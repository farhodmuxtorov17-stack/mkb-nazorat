<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Obyekt xarajatlari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082745">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="aktivlar">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="obyektlar.html">Aktivlar reyestri</a><span class="ajratgich">/</span><span>Obyekt kartochkasi</span></div>
    <div class="hs-qator"><h1>Obyekt kartochkasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="obyekt.html" data-id-qoshib="1">Umumiy</a><a href="obyekt-moliya.html" data-id-qoshib="1">Moliya</a><a href="obyekt-hujjatlar.html" data-id-qoshib="1">Hujjatlar</a><a href="obyekt-koriklar.html" data-id-qoshib="1">Ko'riklar</a><a href="obyekt-xarajatlar.html" class="faol" data-id-qoshib="1">Xarajatlar</a><a href="obyekt-galereya.html" data-id-qoshib="1">Galereya</a><a href="obyekt-3d.html" data-id-qoshib="1">3D navigator</a><a href="obyekt-qavat.html" data-id-qoshib="1">Qavat rejasi</a><a href="obyekt-tarix.html" data-id-qoshib="1">Tarix</a></nav>
  <section class="foto-shapka" aria-label="Obyekt">
    <img id="fs-rasm" src="" alt="">
    <div>
      <div style="flex:1;min-width:220px">
        <div style="display:flex;gap:8px;margin-bottom:8px" id="fs-chiplar"></div>
        <h2 id="fs-nom">—</h2>
        <div class="fs-meta"><span class="kod-mono" id="fs-id" style="color:rgba(255,255,255,.85)">—</span> · <span id="fs-manzil">—</span></div>
      </div>
      <div id="fs-halqa"></div>
    </div>
  </section>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Jami xarajat</span>
      <span class="m-qiymat"><span id="x-jami">—</span></span>
      <span class="m-izoh">Balansda saqlash davri uchun</span>
    </div>
    <div class="metrika"><span class="m-yorliq">To'langan</span>
      <span class="m-qiymat"><span id="x-tolangan">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">To'lanmagan</span>
      <span class="m-qiymat"><span id="x-qoldiq">—</span></span>
      <span class="m-izoh">Navbatdagi to'lovlar</span>
    </div>
  </section>
  <section class="karta"><div class="karta-bosh"><h2>Xarajatlar reyestri</h2><button type="button" class="tugma tugma-kichik tugma-asosiy" id="x-qoshish" style="margin-left:auto"><svg class="ic"><use href="#i-qoshish"/></svg>Xarajat kiritish</button></div><div id="x-royxat"></div></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082745"></script>
<script src="malumot.js?v=26082745"></script>
<script src="malumot-qoshimcha.js?v=26082745"></script>
<script src="malumot-kengaytma.js?v=26082745"></script>
<script src="malumot-kirish.js?v=26082745"></script>
<script src="malumot-indeks.js?v=26082745"></script>
<script src="tarjima.js?v=26082745"></script>
<script src="yadro/ikonlar.js?v=26082745"></script>
<script src="yadro/daraxt.js?v=26082745"></script>
<script src="yadro/chizma.js?v=26082745"></script>
<script src="yadro/qollanma.js?v=26082745"></script>
<script src="yadro/api.js?v=26082745"></script>
<script src="yadro/app.js?v=26082745"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const x = id ? await MKBapi.bitta('YOZUVLAR', id) : null;
  if (!x){ location.replace("xato-404.html"); return; }
  document.getElementById("fs-rasm").src = x.mulk.rasm;
  document.getElementById("fs-nom").textContent = x.mulk.nom;
  document.getElementById("fs-id").textContent = x.id;
  document.getElementById("fs-manzil").textContent = x.mulk.manzil;
  document.getElementById("fs-chiplar").innerHTML =
    "<span class=\"chip chip-brend\">" + x.bosqichNomi + "</span>" +
    "<span class=\"chip chip-siyoh\">" + x.mulk.tur + "</span>";
  const fsIndeks = MKB_DATA.nazoratIndeksi(x);
  document.getElementById("fs-halqa").innerHTML = MKB.halqa(fsIndeks.ball, 74, 6)
    .replace('class="halqa', 'class="halqa katta');
  document.getElementById("fs-halqa").title = "Nazorat indeksi: " + fsIndeks.darajaNomi;
  /* tab havolalariga ?id= ulab qo'yamiz */
  document.querySelectorAll(".bolim-tablar a").forEach(a => {
    if (!a.href.includes("?")) a.href += "?id=" + encodeURIComponent(id);
  });
  document.getElementById("hs-meta").textContent = x.id + " · " + x.filial;

  async function chiz(){
    const r = (await MKBapi.royxat("XARAJATLAR")).filter(v => v.obyektId === x.id);
    const jami = r.reduce((a, v) => a + MKB.sonQiymat(v.summa), 0);
    const tol = r.filter(v => v.holat === "tolangan").reduce((a, v) => a + MKB.sonQiymat(v.summa), 0);
    document.getElementById("x-jami").innerHTML = jami.toFixed(1).replace(".", ",") + "<small>mln so'm</small>";
    document.getElementById("x-tolangan").innerHTML = tol.toFixed(1).replace(".", ",") + "<small>mln so'm</small>";
    document.getElementById("x-qoldiq").innerHTML = (jami - tol).toFixed(1).replace(".", ",") + "<small>mln so'm</small>";
    document.getElementById("x-royxat").innerHTML = r.length ? r.map(v =>
      '<div class="qator">' +
        '<span style="width:38px;height:38px;border-radius:14px;background:var(--varaq-2);display:grid;place-items:center;color:var(--qalam)">' + ik("pul") + '</span>' +
        '<span class="matn"><b>' + v.tur + '</b>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + v.id + ' · ' + v.sana + '</span></span>' +
        '<span class="pul">' + String(v.summa).replace(".", ",") + ' mln</span>' +
        (v.holat === "tolangan"
          ? '<span class="chip chip-yashil">To\'langan</span>'
          : '<span class="chip chip-sariq">Kutilmoqda</span>') + '</div>').join("")
      : '<div class="bosh-holat">' + ik("pul") + '<b>Xarajatlar kiritilmagan</b><span>Bu obyekt bo\'yicha saqlash xarajatlari yo\'q</span></div>';
  }
  chiz();
  document.getElementById("x-qoshish").addEventListener("click", () => {
    MKB.modal("Xarajat kiritish",
      '<div class="forma-tor">' +
        '<div class="maydon"><label class="maydon-yorliq">Xarajat turi <b>*</b></label>' +
          '<div class="kirish"><input name="tur" placeholder="Masalan: Qo\'riqlash xizmati"></div></div>' +
        '<div class="maydon"><label class="maydon-yorliq">Summa, mln so\'m <b>*</b></label>' +
          '<div class="kirish"><input name="summa" type="number" step="0.1" placeholder="0,0"></div></div>' +
      '</div>',
      {okMatn: "Saqlash", ok(modal){
        const q = MKB.forma(modal, ["tur", "summa"]);
        if (!q) return false;
        MKBapi.yangi("XARAJATLAR", {id: "XJ-" + Date.now().toString(36).toUpperCase(),
          obyektId: x.id, obyekt: x.mulk.qisqa, tur: q.tur, summa: +q.summa,
          sana: "bugun", holat: "tolanmagan"}).then(chiz);
        MKB.toast("Xarajat reyestrga kiritildi");
      }});
  });

});
</script>
</body>
</html>
