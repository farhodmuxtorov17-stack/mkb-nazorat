<script>

function gorizontalBar(joy, juftlar, rang){
  MKB.barlar(joy, juftlar.map(([nom, v]) => [nom, v, rang]), {format: (n, j) => j[1]});
}
function ustunBar(joy, yorliqlar, qiymatlar){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:12px;height:160px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + String(v).replace(".", ",") + '</span>' +
        '<div style="width:100%;max-width:38px;height:' + Math.round(v / maks * 112) + 'px;border-radius:14px 14px 4px 4px;background:' +
        (i === qiymatlar.length - 1 ? 'var(--brend)' : 'var(--siyoh)') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span></div>').join("") + '</div>';
}
document.addEventListener("mkb:tayyor", async () => {
  const D = MKB_DATA;
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const indekslar = yoz.map(y => ({y, n: D.nazoratIndeksi(y)})).filter(v => v.n);
  const j = D.nazoratJamlama(yoz);
  document.getElementById("hs-meta").textContent = MKB.fmt(j.jami) + " ta obyekt bo'yicha";
  document.getElementById("hk-1").innerHTML = j.ortacha + "<small>%</small>";
  /* daraja nomlari reyestrdagi darajaNomi bilan bir xil bo'lishi kerak — aks holda sonlar mos kelmaydi */
  document.getElementById("hk-2").innerHTML = MKB.fmt(j.daraja.yuqori) + "<small>ta obyekt</small>";
  document.getElementById("hk-5").innerHTML = MKB.fmt(j.daraja.barqaror) + "<small>ta obyekt</small>";
  document.getElementById("hk-3").innerHTML = MKB.fmt(j.daraja.past) + "<small>ta obyekt</small>";
  document.getElementById("hk-4").innerHTML = MKB.fmt(j.daraja.kritik) + "<small>ta obyekt</small>";

  /* tarkibiy qismlar: har bir talabning o'rtacha bajarilishi */
  MKB.barlar("hk-tarkib", D.NAZORAT_OGIRLIK.map(t => {
    const ulush = indekslar.reduce((a, v) => a + (v.n.tarkib.find(x => x.kalit === t.kalit) || {ulush: 0}).ulush, 0) / Math.max(1, indekslar.length);
    const foiz = Math.round(ulush * 100);
    return [t.nom, foiz, foiz >= 85 ? "var(--mint-matn)" : foiz >= 60 ? "var(--siyoh)" : "var(--xavf)"];
  }), {format: v => v + "%"});

  /* hududlar: indeksi past hudud yuqorida */
  const hudud = {};
  indekslar.forEach(v => {
    const h = hudud[v.y.mulk.hudud] || (hudud[v.y.mulk.hudud] = {soni: 0, ball: 0, kritik: 0});
    h.soni++; h.ball += v.n.ball; if (v.n.daraja === "kritik") h.kritik++;
  });
  const tana = document.getElementById("hk-hudud");
  tana.innerHTML = Object.entries(hudud).map(([nom, h]) => [nom, h.soni, Math.round(h.ball / h.soni), h.kritik])
    .sort((a, b) => a[2] - b[2]).map(q =>
    '<tr><td><a href="obyektlar.html?hudud=' + encodeURIComponent(q[0]) + '">' + q[0] + '</a></td>' +
    '<td style="text-align:right" data-tarjimasiz>' + MKB.fmt(q[1]) + '</td>' +
    '<td style="text-align:right" data-tarjimasiz>' + q[2] + '%</td>' +
    '<td style="text-align:right" data-tarjimasiz>' + (q[3] || "—") + '</td></tr>').join("");
  tarjimaQil(tana);
});
</script>
