  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Sozlamalar</span></div>

<script src="yadro/app.js?v=26082760"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  async function chiz(){
    const r = await MKBapi.royxat("FOYDLAR");
    document.getElementById("hs-meta").textContent = r.filter(f => f.faol).length + " ta faol / " + r.length;
    MKB.jadval("jadval-joy", {
      qatorlar: r,
      qidiruv: ["nom", "rol", "bolim"],
      filtrlar: [{kalit: "rol", nom: "Rol", variantlar: [...new Set(r.map(f => f.rol))]}],
      ustunlar: [
        {kalit: "nom", nom: "Xodim", chiz: f =>
          '<span class="obyekt-katak"><span style="width:36px;height:36px;border-radius:99px;background:var(--siyoh);color:var(--brend);display:grid;place-items:center;font:500 13px var(--shrift)">' +
          f.nom.split(" ").map(v => v[0]).join("").slice(0, 2) + '</span>' +
          '<span><span class="nom">' + f.nom + '</span><br><span class="sub">' + (f.email || "") + '</span></span></span>'},
        {kalit: "rol", nom: "Rol", chiz: f => '<span class="chip chip-info">' + f.rol + '</span>'},
        {kalit: "bolim", nom: "Bo'lim"},
        {kalit: "faol", nom: "Holat", chiz: f => f.faol
          ? '<span class="chip chip-yashil">Faol</span>' : '<span class="chip">O\'chirilgan</span>'},
        {kalit: "id", nom: "", saralash: false, chiz: f =>
          '<button type="button" class="tugma tugma-kichik tugma-oq" data-almash="' + f.id + '">' +
          (f.faol ? "O'chirish" : "Yoqish") + '</button>'},
      ],
      bosilganda: f => location.href = "foydalanuvchi.html?id=" + encodeURIComponent(f.id),
      chizilganda(bolak, el){
        el.querySelectorAll("[data-almash]").forEach(b => b.addEventListener("click", async ev => {
          ev.stopPropagation();
          const f = r.find(x => x.id === b.dataset.almash);
          await MKBapi.yangilash("FOYDLAR", f.id, {faol: !f.faol});
          MKB.toast(f.faol ? "Hisob o'chirildi" : "Hisob faollashtirildi");
          chiz();
        }));
      },
    });
  }
  chiz();
});
</script>
</body>
</html>
