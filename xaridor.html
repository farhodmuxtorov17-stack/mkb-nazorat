<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Xaridor kartochkasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082620">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="savdo.html">Realizatsiya</a><span class="ajratgich">/</span><span>Xaridor</span></div>
    <div class="hs-qator"><h1>Xaridor kartochkasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:760px"><div class="karta-bosh"><span id="xk-belgi" style="width:50px;height:50px;border-radius:99px;background:var(--siyoh);color:var(--brend);display:grid;place-items:center;font:700 16px var(--shrift)">—</span><div><h2 id="xk-nom" style="font:700 18px var(--shrift-displey)">—</h2><span style="font-size:12px;color:var(--iz)" id="xk-tur">—</span></div></div><div class="karta-bosh" style="margin:14px 0 8px"><h2 style="font-size:14.5px">Ishtirok tarixi</h2><span class="soni" id="xk-soni"></span></div><div id="xk-tarix"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082620"></script>
<script src="malumot-qoshimcha.js?v=26082620"></script>
<script src="tarjima.js?v=26082620"></script>
<script src="yadro/ikonlar.js?v=26082620"></script>
<script src="yadro/daraxt.js?v=26082620"></script>
<script src="yadro/chizma.js?v=26082620"></script>
<script src="yadro/api.js?v=26082620"></script>
<script src="yadro/app.js?v=26082620"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const x = id ? await MKBapi.bitta("XARIDORLAR", id) : null;
  if (!x){ location.replace("xaridorlar.html"); return; }
  document.getElementById("hs-meta").textContent = x.nom;
  document.getElementById("xk-belgi").textContent =
    x.nom.replace(/[«»]/g, "").split(" ").map(v => v[0]).join("").slice(0, 2).toUpperCase();
  document.getElementById("xk-nom").textContent = x.nom;
  document.getElementById("xk-tur").textContent = x.tur + " · " + x.ishtirok + " ishtirok · " + x.yutgan + " yutuq";
  const takliflar = (await MKBapi.royxat("TAKLIFLAR")).filter(t => t.kim === x.nom);
  const arxiv = (await MKBapi.royxat("ARXIV")).filter(a => a.xaridor === x.nom);
  const tarix = takliflar.map(t => ({nom: t.obyekt, izoh: "Taklif — " + t.sana, summa: t.summa, teg: t.holat, href: "lot.html?id=" + encodeURIComponent(t.obyektId)}))
    .concat(arxiv.map(a => ({nom: a.nom, izoh: "Sotib olingan — " + a.sotilgan, summa: a.summa, teg: "g'olib", href: "arxiv-obyekt.html?id=" + encodeURIComponent(a.id)})));
  document.getElementById("xk-soni").textContent = tarix.length + " ta yozuv";
  document.getElementById("xk-tarix").innerHTML = tarix.map(t =>
    '<a href="' + t.href + '" style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--chiziq-2)">' +
      '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px">' + t.nom + '</b>' +
      '<span style="font-size:11.5px;color:var(--iz)">' + t.izoh + '</span></span>' +
      '<b class="pul">' + MKB.fmt(t.summa) + ' mln</b>' +
      '<span class="chip ' + (t.teg === "g'olib" ? "chip-brend" : "") + '">' + t.teg + '</span></a>').join("");
});
</script>
</body>
</html>
