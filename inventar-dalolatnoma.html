<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Inventarizatsiya dalolatnomasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<link rel="stylesheet" href="yadro/dalolatnoma.css?v=26092200">
<style>
#id-akt > .skelet-royxat{background:var(--oq);border-radius:var(--r-karta);padding:24px;box-shadow:var(--soya);max-width:880px;margin:0 auto;width:100%}
#id-akt > .karta{max-width:880px;margin:0 auto;width:100%}
</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="inventarizatsiya.html">Inventarizatsiya</a><span class="ajratgich">/</span><span>Dalolatnoma</span></div>
    <div class="hs-qator"><h1>Inventarizatsiya dalolatnomasi</h1><span class="hs-meta" id="hs-meta" data-tarjimasiz>—</span>
      <div class="hs-amallar" id="id-amallar"></div></div>
  </div>
  <div id="id-xabar" class="chop-yashir"></div>
  <div id="id-akt" data-sayohat="akt"><div class="skelet-royxat" aria-busy="true"></div></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script src="yadro/dalolatnoma.js?v=26092200"></script>
<script>
(() => {
  const akt = document.getElementById("id-akt");
  const D = MKB_DATA, esc = MKB.esc;
  MKB.sahifaYukla({joylar: {"id-akt": ["qator", 6]}, xato: "Dalolatnomani yuklab bo'lmadi", ish: async () => {
  await MKB.kolYukla(["INVENTAR", "INVENTARIZATSIYALAR"]);
  const id = new URLSearchParams(location.search).get("id");
  const z = id ? (D.INVENTARIZATSIYALAR || []).find(x => x.id === id) : null;
  const doirada = z && (!MKB.filialXodimi() || (z.obyektlar || []).some(o => MKB.doira([{obyektId: o}]).length));
  if (!z || !doirada){
    akt.innerHTML = '<section class="karta">' + MKB.boshHolat("skaner", "Inventarizatsiya topilmadi", "Inventarizatsiyani ro'yxatdan tanlang",
      '<a class="tugma tugma-asosiy" href="inventarizatsiya.html" style="margin-top:12px">Inventarizatsiya</a>') + "</section>";
    tarjimaQil(akt); return;
  }
  const TURI = {yillik: "Yillik", "navbatdan tashqari": "Navbatdan tashqari", rejali: "Rejali"};
  const yakun = z.holat === "yakunlangan";
  const obNomi = oid => { const o = D.OBYEKT_INDEKS[oid]; return o ? (o.qisqa || o.nom) : oid; };
  document.getElementById("hs-meta").textContent = z.id;
  document.title = "MKB — Inventarizatsiya dalolatnomasi " + z.id;

  /* Hisob bo'yicha birliklar: shu inventarizatsiya obyektlaridagi INVENTAR yozuvlari.
     Dalolatnoma yagona hujjat: filial xodimi ham bosh ofis bilan bir xil to'liq qaydnomani ko'radi,
     aks holda bir raqamli varaqning sonlari va tekshirish kodi ochgan odamga qarab farq qiladi */
  const birliklar = (D.INVENTAR || []).filter(x => (z.obyektlar || []).includes(x.obyektId))
    .slice().sort((a, c) => String(a.inventarRaqam).localeCompare(String(c.inventarRaqam)));
  const nat = z.natijalar || [];
  const natija = iid => nat.find(n => n.inventarId === iid);
  const ortiqcha = nat.filter(n => n.ortiqcha);
  const qatorlar = birliklar.map(x => {
    const n = natija(x.id);
    const holat = !n ? "sanalmagan" : n.topildi ? "topildi" : "kamomad";
    return {x, n, holat, haqiqat: holat === "topildi" ? 1 : holat === "kamomad" ? 0 : null};
  });
  const topildi = qatorlar.filter(q => q.holat === "topildi").length;
  const kamomad = qatorlar.filter(q => q.holat === "kamomad").length;
  const sanalmagan = qatorlar.filter(q => q.holat === "sanalmagan").length;
  const butlikEmas = qatorlar.filter(q => q.n && q.n.topildi && q.n.butlik === false).length;

  const amallar = document.getElementById("id-amallar");
  amallar.innerHTML =
    '<button type="button" class="tugma tugma-oq" id="id-csv" data-sayohat="yuklab">' + ik("csv") + "<span>Qaydnomani yuklab olish</span></button>" +
    (yakun ? '<button type="button" class="tugma tugma-asosiy" id="id-chop" data-sayohat="chop">' + ik("chop") + "<span>Chop etish</span></button>"
      : '<a class="tugma tugma-asosiy" href="inventarizatsiya.html?id=' + encodeURIComponent(z.id) + '">' + ik("skaner") + "<span>Sanashga qaytish</span></a>");
  const chop = document.getElementById("id-chop");
  if (chop) chop.addEventListener("click", () => window.print());
  document.getElementById("id-csv").addEventListener("click", () => {
    MKB.csv("inventar-qaydnoma-" + z.id.replace(/\//g, "-") + ".csv",
      ["Inventar raqami", "Nomi", "Obyekt", "Hisob bo'yicha", "Haqiqatda", "Farq", "To'liqligi", "Izoh"],
      qatorlar.map(q => [q.x.inventarRaqam, q.x.nom, q.x.obyektId, 1, q.haqiqat == null ? "" : q.haqiqat, q.haqiqat == null ? "" : q.haqiqat - 1,
        q.n && q.n.topildi ? (q.n.butlik ? "to'liq" : "to'liq emas") : "", (q.n && q.n.izoh) || ""])
        .concat(ortiqcha.map(o => ["", o.nom, o.obyektId, 0, 1, 1, "", o.izoh || ""])));
    MKB.toast("CSV fayl yuklab olindi: " + (qatorlar.length + ortiqcha.length) + " ta qator", "yuklab");
  });

  if (yakun && new URLSearchParams(location.search).get("yakunlandi")){
    document.getElementById("id-xabar").innerHTML = '<section class="karta" style="background:var(--brend-fon)"><div class="qator" style="margin:-10px -16px">' +
      '<span class="belgi mint">' + ik("tasdiq") + '</span><span class="matn"><b>Inventarizatsiya yakunlandi, dalolatnoma saqlandi</b>' +
      (kamomad ? "<span>Kamomad bo'yicha hodisa xavfsizlik xizmatiga yuborildi</span>" : "<span>Farq aniqlanmadi</span>") + "</span></div></section>";
  }

  const obyektlar = (z.obyektlar || []).map(oid => D.OBYEKT_INDEKS[oid] || D.topish(oid) || {id: oid});
  const hududlar = [...new Set(obyektlar.map(o => o.hududToliq || o.hudud).filter(Boolean))];
  const filiallar = [...new Set(obyektlar.map(o => o.filial).filter(Boolean))];
  const farqBelgi = n => n == null ? {t: "Sanalmagan"} : n ? {html: '<b data-tarjimasiz>' + (n > 0 ? "+" : "−") + Math.abs(n) + "</b>"} : "0";
  const komissiya = (z.komissiya || []).map((k, i) => ({rol: i ? "Komissiya a'zosi" : "Komissiya raisi", ism: k}));
  const model = {
    tur: "inventar", sarlavha: "Inventarizatsiya dalolatnomasi", raqam: z.id, sana: z.sana,
    joy: hududlar.length <= 2 ? hududlar.join("; ") : "",
    filial: filiallar.length === 1 ? filiallar[0] : "",
    havola: "inventar-dalolatnoma.html?id=" + encodeURIComponent(z.id),
    bolimlar: [
      {sarlavha: "Inventarizatsiya", kv: [
        ["Turi", {t: TURI[z.turi] || z.turi || "—"}], ["Holati", {t: yakun ? "Yakunlangan" : z.holat === "jarayonda" ? "Sanalmoqda" : "Rejada"}],
        /* Ko'p obyektli inventarizatsiyada ro'yxat qaydnomada: shapka bir qatorda qoladi */
        ["Obyektlar", obyektlar.length <= 6 ? obyektlar.map(o => (o.qisqa || o.nom || o.id) + " (" + o.id + ")").join("; ") || null
          : {html: '<span data-tarjimasiz>' + obyektlar.length + "</span> <span>ta obyekt, ro'yxat solishtirma qaydnomada</span>" +
            (hududlar.length > 2 ? '; <span data-tarjimasiz>' + hududlar.length + "</span> <span>ta hudud</span>" : "")}, {keng: true}],
      ]},
      {sarlavha: "Natija", kv: [
        ["Hisob bo'yicha", String(birliklar.length)], ["Haqiqatda topildi", String(topildi)],
        ["Kamomad", String(kamomad)], ["Ortiqcha", String(ortiqcha.length)],
        ["To'liq emas", String(butlikEmas)], ["Sanalmagan", String(sanalmagan)],
      ]},
      {sarlavha: "Xulosa", matn: {t: yakun
        ? (kamomad || ortiqcha.length
          ? "Hisob ma'lumoti bilan haqiqiy mavjudlik o'rtasida farq aniqlandi. Kamomad bo'yicha hodisa qayd etilgan, javobgar shaxslardan tushuntirish xati olinadi."
          : "Hisob ma'lumoti haqiqiy mavjudlikka mos keldi. Farq aniqlanmadi.")
        : "Sanash tugagach xulosa shakllanadi."}},
      {sarlavha: "Solishtirma qaydnoma", jadval: {ustunlar: ["Inventar raqami", "Nomi va joyi", "Hisobda", "Haqiqatda", "Farq", "Izoh"], son: [2, 3, 4], majburiy: [5],
        kenglik: ["16%", "", "10%", "11%", "9%", "22%"],
        qatorlar: qatorlar.map(q => Object.assign([q.x.inventarRaqam, q.x.nom + (obNomi(q.x.obyektId) !== q.x.nom ? " · " + obNomi(q.x.obyektId) : "") + " · " + q.x.obyektId,
          "1", q.haqiqat == null ? {t: "Sanalmagan"} : String(q.haqiqat), farqBelgi(q.haqiqat == null ? null : q.haqiqat - 1),
          {html: (q.n && q.n.topildi && q.n.butlik === false ? "<span>To'liq emas.</span> " : "") + '<span data-tarjimasiz>' + esc((q.n && q.n.izoh) || "") + "</span>"}],
          {sinf: q.holat === "kamomad" ? "kam" : ""}))
          .concat(ortiqcha.map(o => Object.assign([{t: "Raqamsiz"}, o.nom + " · " + obNomi(o.obyektId), "0", "1", {html: '<b data-tarjimasiz>+1</b>'},
            {html: "<span>Ortiqcha.</span> " + '<span data-tarjimasiz>' + esc(o.izoh || "") + "</span>"}], {sinf: "ort"}))),
        bosh: "Bu obyektlarda inventar birligi yo'q"}},
    ],
    komissiya: (komissiya.length ? komissiya : [{rol: "Komissiya raisi", ism: ""}, {rol: "Komissiya a'zosi", ism: ""}])
      .concat([{rol: "Moddiy javobgar shaxs", ism: ""}, {rol: "Tasdiqladi", ism: ""}]),
    qoralama: yakun ? null : "Inventarizatsiya yakunlanmagan: sanalmagan birliklar bor",
  };
  MKB.dalolatnoma.chiz(akt, model);
  tarjimaQil(document.querySelector(".hujjat-shapka"));
  tarjimaQil(document.getElementById("id-xabar"));
  }});
})();
</script>
</body>
</html>
