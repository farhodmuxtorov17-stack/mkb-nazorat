<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko&#39;rik inspektori paneli</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="panel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Boshqaruv paneli</span></div>
    <div class="hs-qator"><h1>Ko&#39;rik inspektori paneli</h1><span class="hs-meta" id="hs-meta">Ko&#39;rik, sug&#39;urta va hodisalar</span><div class="hs-amallar"><a class="tugma tugma-oq" href="hisobotlar.html"><svg class="ic"><use href="#i-hisobot"/></svg>Hisobotlar</a><a class="tugma tugma-asosiy" href="obyektlar.html"><svg class="ic"><use href="#i-aktivlar"/></svg>Obyektlar reyestri</a></div></div>
  </div>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Rejadagi ko'riklar</span>
      <span class="m-qiymat"><span id="n-reja">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Kechikkan ko'riklar</span>
      <span class="m-qiymat"><span id="n-kech">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Ochiq hodisalar</span>
      <span class="m-qiymat"><span id="n-hodisa">—</span></span>
      <span class="m-izoh">Yopilmagan qaydlar</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Sug'urtasi tugagan</span>
      <span class="m-qiymat"><span id="n-sugurta">—</span></span>
    </div>
  </section>
  <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="panel-tor">
    <section class="karta"><div class="karta-bosh"><h2>Ko'rik rejasi</h2><a class="karta-havola" href="korik-rejasi.html">Barchasi<svg class="ic"><use href="#i-ong"/></svg></a></div><div id="n-koriklar"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>So'nggi hodisalar</h2></div><div id="n-hodisalar"></div></section>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>

function ustunlarChiz(joy, yorliqlar, qiymatlar, brendIdx){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:10px;height:150px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + v + '</span>' +
        '<div style="width:100%;max-width:34px;height:' + Math.round(v / maks * 104) + 'px;border-radius:14px 14px 4px 4px;background:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? 'var(--brend)' : 'var(--siyoh)') + ';opacity:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? '1' : '.82') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span>' +
      '</div>').join("") + '</div>';
}
function obyektQatori(y){
  return '<a class="qator" href="obyekt.html?id=' + encodeURIComponent(y.id) + '">' +
    '<img class="media" src="' + (y.mulk.rasmKichik || y.mulk.rasm) + '" alt="" loading="lazy">' +
    '<span class="matn"><b>' + y.mulk.qisqa + '</b>' +
    '<span>' + y.id + ' · ' + y.bosqichNomi + '</span></span>' +
    '<span class="ong"><span class="pul">' + y.qarzMatn + '</span>' +
    MKB.shtrix(y.qoplash, 12) + '</span></a>';
}
function muddatQatori(m){
  return '<a class="qator" href="' + m.href + '">' +
    '<span class="belgi ' + (m.xavfli ? "pushti" : "") + '">' + ik(m.ikonka) + '</span>' +
    '<span class="matn"><b>' + m.nom + '</b><span>' + m.izoh + '</span></span>' +
    '<span class="vaqt"' + (m.xavfli ? ' style="color:var(--pushti-matn)"' : '') + '>' + m.vaqt + '</span></a>';
}

document.addEventListener("mkb:tayyor", async () => {
  const D = MKB_DATA;
  const k = await MKBapi.royxat("KORIKLAR");
  const s = await MKBapi.royxat("SUGURTALAR");
  document.getElementById("n-reja").textContent = k.filter(x => x.holat === "rejada").length;
  document.getElementById("n-kech").textContent = k.filter(x => x.holat === "kechikkan").length;
  document.getElementById("n-hodisa").textContent = D.HODISALAR.filter(h => h.ustun !== "yopildi").length;
  document.getElementById("n-sugurta").textContent = s.filter(v => v.holat !== "amalda").length;
  document.getElementById("n-koriklar").innerHTML = k.filter(x => x.holat === "rejada").slice(0, 6).map(x => {
    const o = D.OBYEKT_INDEKS[x.obyektId] || {};
    return '<a class="qator" href="korik-akti.html?id=' + encodeURIComponent(x.id) + '">' +
      '<span class="belgi mint">' + ik("korik") + '</span>' +
      '<span class="matn"><b>' + (o.qisqa || x.obyektId) + '</b>' +
      '<span>' + x.id + ' · ' + (x.tur || "Rejali") + ' · ' + x.inspektor + '</span></span>' +
      '<span class="chip chip-brend">' + x.sana + '</span></a>';
  }).join("");
  document.getElementById("n-hodisalar").innerHTML = D.HODISALAR.slice(0, 6).map(h =>
    '<div class="qator"><span class="belgi ' +
    (h.jiddiylik === "yuqori" ? "pushti" : h.jiddiylik === "o&#39;rta" ? "lavanda" : "") + '">' + ik("xavf") + '</span>' +
    '<span class="matn"><b>' + h.hodisa + '</b><span>' + h.obyektId + ' · ' + h.vaqt + '</span></span></div>').join("");
});
</script>
</body>
</html>
