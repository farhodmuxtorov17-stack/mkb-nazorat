<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Aktiv obyektlari reyestri</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
</head>
<body data-sahifa="aktivlar">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Aktivlar reyestri</span></div>
    <div class="hs-qator"><h1>Aktiv obyektlari reyestri</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><a class="tugma tugma-oq" href="xarita.html"><svg class="ic"><use href="#i-xarita"/></svg>Xaritada</a><a class="tugma tugma-asosiy" href="qabul-boshlash.html"><svg class="ic"><use href="#i-qoshish"/></svg>Balansga qabul</a></div></div>
  </div>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const qatorlar = yoz.map(y => ({
    id: y.id, nom: y.mulk.nom, qisqa: y.mulk.qisqa, rasm: y.mulk.rasmKichik || y.mulk.rasm,
    hudud: y.mulk.hudud, tur: y.mulk.tur, bosqich: y.bosqichNomi, chip: y.bosqichChip || "chip-info",
    qarzN: MKB.sonQiymat(y.qarz.jami || y.qarzSon), qarzMatn: y.qarzMatn,
    bahoN: MKB.sonQiymat(y.mulk.baho), bahoMatn: y.bahoMatn, qoplash: y.qoplash,
  }));
  document.getElementById("hs-meta").textContent = qatorlar.length + " ta obyekt nazoratda";
  MKB.jadval("jadval-joy", {
    qatorlar,
    qidiruv: ["nom", "id", "hudud", "tur", "bosqich"],
    qidiruvYozuvi: "Obyekt, id yoki hudud...",
    filtrlar: [
      {kalit: "bosqich", nom: "Bosqich", variantlar: [...new Set(qatorlar.map(q => q.bosqich))]},
      {kalit: "hudud", nom: "Hudud", variantlar: [...new Set(qatorlar.map(q => q.hudud))]},
      {kalit: "tur", nom: "Turi", variantlar: [...new Set(qatorlar.map(q => q.tur))]},
    ],
    ustunlar: [
      {kalit: "nom", nom: "Obyekt", chiz: q =>
        '<span class="obyekt-katak"><img class="foto" src="' + q.rasm + '" alt="" loading="lazy">' +
        '<span><span class="nom">' + q.qisqa + '</span><br><span class="sub kod-mono">' + q.id + '</span></span></span>'},
      {kalit: "hudud", nom: "Hudud"},
      {kalit: "tur", nom: "Turi"},
      {kalit: "bosqich", nom: "Bosqich", chiz: q => '<span class="chip chip-info">' + q.bosqich + '</span>'},
      {kalit: "qarzN", nom: "Qoldiq qarz", son: true, chiz: q => '<span class="pul">' + q.qarzMatn + '</span>'},
      {kalit: "bahoN", nom: "Baholangan", son: true, chiz: q => '<span class="pul">' + q.bahoMatn + '</span>'},
      {kalit: "qoplash", nom: "Qoplash", son: true, chiz: q => MKB.halqa(q.qoplash, 40, 4)},
    ],
    saralash: "qoplash",
    bosilganda: q => location.href = "obyekt.html?id=" + encodeURIComponent(q.id),
  });
  const p = new URLSearchParams(location.search);
  const q = p.get("qidiruv");
  if (q){ const el = document.querySelector("[data-jadval-qidiruv]");
    if (el){ el.value = q; el.dispatchEvent(new Event("input")); } }
});
</script>
</body>
</html>
