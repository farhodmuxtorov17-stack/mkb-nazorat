<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Savdo natijalari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Realizatsiya</span></div>
    <div class="hs-qator"><h1>Savdo natijalari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="savdo.html">Doska</a><a href="auksion-jadvali.html">Auksion jadvali</a><a href="auksion-takliflar.html">Takliflar</a><a href="tolov-nazorati.html">To'lovlar</a><a href="ijara.html">Ijara</a><a href="xaridorlar.html">Xaridorlar</a><a href="savdo-natijalari.html" class="faol">Natijalar</a></nav>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Sotilgan obyektlar</span>
      <span class="m-qiymat"><span id="sn-soni">—</span></span>
      <span class="m-izoh">Arxiv bo'yicha</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Jami tushum</span>
      <span class="m-qiymat"><span id="sn-tushum">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">O'rtacha narx</span>
      <span class="m-qiymat"><span id="sn-ortacha">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Joriy yil</span>
      <span class="m-qiymat"><span id="sn-yil">—</span></span>
      <span class="m-izoh">2026 yilda sotilgan</span>
    </div>
  </section>
  <div style="display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px" class="panel-tor">
    <section class="karta"><div class="karta-bosh"><h2>Yillar kesimida tushum, mln</h2></div><div id="sn-grafik"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>Tur bo'yicha</h2></div><div id="sn-tur"></div></section>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const arxiv = await MKBapi.royxat("ARXIV");
  document.getElementById("sn-soni").textContent = arxiv.length;
  const jami = arxiv.reduce((a, x) => a + MKB.sonQiymat(x.summa), 0);
  document.getElementById("sn-tushum").innerHTML = MKB.fmt(Math.round(jami)) + "<small>mln so'm</small>";
  document.getElementById("sn-ortacha").innerHTML = MKB.fmt(Math.round(jami / (arxiv.length || 1))) + "<small>mln so'm</small>";
  document.getElementById("sn-yil").textContent = arxiv.filter(a => a.yil === "2026").length;
  const yillar = {};
  arxiv.forEach(a => yillar[a.yil] = (yillar[a.yil] || 0) + MKB.sonQiymat(a.summa));
  const juft = Object.entries(yillar).sort();
  const maks = Math.max(...juft.map(v => v[1]));
  document.getElementById("sn-grafik").innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:22px;height:170px">' +
    juft.map(([yil, v], i) =>
      '<div style="flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px">' +
        '<span class="pul" style="font-size:12px">' + MKB.fmt(Math.round(v)) + '</span>' +
        '<div style="width:100%;max-width:56px;height:' + Math.round(v / maks * 120) + 'px;border-radius:9px 9px 3px 3px;background:' +
        (i === juft.length - 1 ? 'var(--brend)' : 'var(--siyoh)') + '"></div>' +
        '<span style="font-size:11px;color:var(--iz)">' + yil + '</span></div>').join("") + '</div>';
  const turlar = {};
  arxiv.forEach(a => turlar[a.tur] = (turlar[a.tur] || 0) + 1);
  const maks2 = Math.max(...Object.values(turlar));
  document.getElementById("sn-tur").innerHTML = Object.entries(turlar).map(([nom, son]) =>
    '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">' +
      '<span style="width:130px;font-size:12.5px;color:var(--qalam)">' + nom + '</span>' +
      '<div style="flex:1;height:8px;border-radius:99px;background:var(--kirish-fon)">' +
        '<div style="height:100%;width:' + Math.round(son / maks2 * 100) + '%;border-radius:99px;background:var(--siyoh)"></div></div>' +
      '<b style="font:700 12px var(--shrift-mono);width:20px;text-align:right">' + son + '</b></div>').join("");
});
</script>
</body>
</html>
