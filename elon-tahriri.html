<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Savdo e'loni</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="savdo.html">Realizatsiya</a><span class="ajratgich">/</span><span>E'lon</span></div>
    <div class="hs-qator"><h1>Savdo e'loni</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:760px"><div class="karta-bosh"><h2>Savdo e'loni</h2><span class="soni kod-mono" id="e-id"></span></div>
  <form id="e-forma" class="forma-tor">
    <div class="maydon"><label class="maydon-yorliq">Boshlang'ich narx, mln <b>*</b></label>
      <div class="kirish"><input name="narx" type="number" min="1"></div></div>
    <div class="maydon"><label class="maydon-yorliq">Auksion sanasi <b>*</b></label>
      <div class="kirish"><input name="sana" placeholder="kk.oo.yyyy"></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">E'lon matni <b>*</b></label>
      <textarea class="kirish-matn" name="matn" placeholder="Obyekt tavsifi, ko'rish tartibi, aloqa"></textarea></div>
    <div class="maydon keng"><label class="maydon-yorliq">Joylash kanallari</label>
      <div id="e-kanallar" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" id="e-orqaga" href="savdo.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit">E'lonni saqlash</button></div>
  </form></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const l = id ? await MKBapi.bitta("SOTUV", id) : null;
  if (!l){ location.replace("savdo.html"); return; }
  document.getElementById("hs-meta").textContent = l.nom;
  document.getElementById("e-id").textContent = l.id;
  document.getElementById("e-orqaga").href = "lot.html?id=" + encodeURIComponent(l.id);
  const saqlangan = JSON.parse(localStorage.getItem("mkb4-elon-" + l.id) || "{}");
  document.querySelector('[name="narx"]').value = saqlangan.narx || l.baho;
  document.querySelector('[name="sana"]').value = saqlangan.sana || "";
  document.querySelector('[name="matn"]').value = saqlangan.matn || "";
  const KANALLAR = ["e-auksion.uz", "Bank sayti", "Matbuot", "Telegram kanal"];
  document.getElementById("e-kanallar").innerHTML = KANALLAR.map((k, i) =>
    '<label class="chip" style="cursor:pointer;height:30px;padding:0 13px">' +
    '<input type="checkbox" data-kanal value="' + k + '"' +
    ((saqlangan.kanallar || ["e-auksion.uz"]).includes(k) ? " checked" : "") +
    ' style="accent-color:var(--siyoh);margin-right:2px">' + k + '</label>').join("");
  document.getElementById("e-forma").addEventListener("submit", e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["narx", "sana", "matn"]);
    if (!q) return;
    q.kanallar = [...document.querySelectorAll("[data-kanal]:checked")].map(c => c.value);
    localStorage.setItem("mkb4-elon-" + l.id, JSON.stringify(q));
    MKBapi.yangilash("SOTUV", l.id, {bosqich: "elon", baho: +q.narx});
    MKB.toast("E'lon saqlandi va joylandi");
    setTimeout(() => location.href = "lot.html?id=" + encodeURIComponent(l.id), 700);
  });
});
</script>
</body>
</html>
