<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Portfel segmentlari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="portfel">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Qarzdorlar portfeli</span></div>
    <div class="hs-qator"><h1>Portfel segmentlari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Jismoniy shaxslar</span>
      <span class="m-qiymat"><span id="sg-jis">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Yuridik shaxslar</span>
      <span class="m-qiymat"><span id="sg-yur">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">O'rtacha kechikish</span>
      <span class="m-qiymat"><span id="sg-kun">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">O'rtacha qarz</span>
      <span class="m-qiymat"><span id="sg-qarz">—</span></span>
    </div>
  </section>
  <div style="display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px" class="panel-tor">
    <section class="karta"><div class="karta-bosh"><h2>Ta'minot turi bo'yicha</h2></div><div id="sg-tur"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>Bosqich bo'yicha</h2></div><div id="sg-bosqich"></div></section>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/chizma.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const jis = yoz.filter(y => !y.mijoz.yur).length;
  document.getElementById("sg-jis").textContent = jis;
  document.getElementById("sg-yur").textContent = yoz.length - jis;
  document.getElementById("sg-kun").innerHTML =
    Math.round(yoz.reduce((a, y) => a + y.qarz.kunlar, 0) / yoz.length) + "<small>kun</small>";
  document.getElementById("sg-qarz").innerHTML =
    MKB.fmt(Math.round(yoz.reduce((a, y) => a + MKB.sonQiymat(y.qarzSon), 0) / yoz.length)) + "<small>mln so'm</small>";
  function taqsimot(joy, kalitFn){
    const guruh = {};
    yoz.forEach(y => { const k = kalitFn(y); guruh[k] = (guruh[k] || 0) + 1; });
    const r = Object.entries(guruh).sort((a, b) => b[1] - a[1]);
    const maks = Math.max(...r.map(v => v[1]));
    document.getElementById(joy).innerHTML = r.map(([nom, son]) =>
      '<div style="display:flex;align-items:center;gap:10px;padding:7px 0">' +
        '<span style="width:150px;font-size:12.5px;color:var(--qalam);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + nom + '</span>' +
        '<div style="flex:1;height:8px;border-radius:99px;background:var(--kirish-fon)">' +
          '<div style="height:100%;width:' + Math.round(son / maks * 100) + '%;border-radius:99px;background:var(--siyoh)"></div></div>' +
        '<b style="font:700 12px var(--shrift-mono);width:22px;text-align:right">' + son + '</b></div>').join("");
  }
  taqsimot("sg-tur", y => y.mulk.tur);
  taqsimot("sg-bosqich", y => y.bosqichNomi);
});
</script>
</body>
</html>
