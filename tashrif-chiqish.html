<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Tashrif chiqishi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.tor-2>*,.ustun>*,.forma-tor>*{min-width:0}
.kirish select{width:100%;text-overflow:ellipsis}
.topshir-band{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--chiziq-2);flex-wrap:wrap}
.topshir-band:last-child{border-bottom:0}
.topshir-band .band-nom{flex:1 1 220px;font-size:14px}
.topshir-band .tanlash{display:flex;gap:6px}
.topshir-band label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:var(--plitka);font-size:13px;cursor:pointer;border:1.5px solid transparent}
.topshir-band input{position:absolute;opacity:0;pointer-events:none}
.topshir-band label:has(input:checked){border-color:var(--siyoh);background:var(--oq)}
.topshir-band label.nomuvofiq:has(input:checked){border-color:var(--xavf);color:var(--pushti-matn)}
.topshir-band label:has(input:focus-visible){outline:2px solid var(--siyoh);outline-offset:2px}
.nomuv-blok{margin-top:16px;padding:16px;border-radius:18px;background:var(--xavf-fon)}
.nomuv-blok[hidden]{display:none}
.amal-qator{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.kichik-izoh{font-size:12.5px;color:var(--matn-3);line-height:1.55;margin-top:10px}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Himoya va monitoring</a><span class="ajratgich">/</span><a href="tashriflar.html">Tashriflar</a><span class="ajratgich">/</span><span>Chiqish</span></div>
    <div class="hs-qator"><h1>Tashrif chiqishi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div class="tor-2" id="tc-tor">
    <section class="karta" aria-labelledby="tc-b-s" data-tur="tashrif-chiqish-bandlar">
      <div class="karta-bosh"><h2 id="tc-b-s">Obyektni topshirish bandlari</h2></div>
      <div id="tc-asosiy"></div>
    </section>
    <div class="ustun">
      <section class="karta" aria-labelledby="tc-m-s">
        <div class="karta-bosh"><h2 id="tc-m-s">Tashrif</h2></div>
        <dl class="malumot-royxat" id="tc-malumot"></dl>
      </section>
      <section class="karta" aria-labelledby="tc-d-s" data-tur="tashrif-chiqish-dalolatnoma">
        <div class="karta-bosh"><h2 id="tc-d-s">Dalolatnoma</h2></div>
        <div id="tc-dalolatnoma"></div>
      </section>
    </div>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(async () => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  const yuklandi = await new Promise(hal => MKB.sahifaYukla({
    joylar: {"tc-asosiy": ["qator", 6], "tc-dalolatnoma": ["qator", 1]},
    xato: "Tashrif ma'lumotini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["TASHRIFLAR", "SHAXSLAR", "HUJJATLAR", "FAYLLAR", "KIRISH_VOQEALARI", "MENING_VAZIFALARIM"]);
      ulandi = true;
      hal(true);
    },
  }));
  if (!yuklandi) return;
  /* Yangi kiritilgan shaxs indeksda bo'lmasligi mumkin: to'plamdan ham qidiriladi */
  const shaxsTop = id => D.shaxs(id) || (D.SHAXSLAR || []).find(s => s.id === id) || null;

  const id = new URLSearchParams(location.search).get("id");
  let t = (D.TASHRIFLAR || []).find(x => x.id === id);
  if (!t || !MKB.doira([t]).length){ location.replace("xato-404.html"); return; }
  const sh = shaxsTop(t.shaxsId), y = D.topish(t.obyektId);
  const yozadi = MKB.huquq("himoya", "yoz");
  const BANDLAR = ["Tashrifchi obyektdan chiqdi", "Eshik va darvozalar yopildi, qulflandi", "Deraza va panjaralar butun", "Mulk joyida, zarar yetkazilmagan",
    "Hisoblagich plombalari butun", "Elektr va suv o'chirildi", "Kalit va kirish kodi qaytarildi"];
  const dalolatnoma = () => (D.HUJJATLAR || []).find(h => h.raqam === t.id && h.obyektId === t.obyektId);
  const inspektorlar = (D.FOYDLAR || []).filter(f => f.faol !== false && f.rol === "Ko'rik va xavfsizlik inspektori");

  function malumot(){
    t = (D.TASHRIFLAR || []).find(x => x.id === id) || t;
    $("hs-meta").innerHTML = '<span data-tarjimasiz>' + esc(t.id) + "</span> · <span>" + esc(sh ? sh.ism : "") + "</span>";
    $("tc-malumot").innerHTML = [["Tashrifchi", esc(sh ? sh.ism + (sh.tashkilot ? ", " + sh.tashkilot : "") : "—")],
      ["Obyekt", y ? '<a href="obyekt-himoya.html?id=' + encodeURIComponent(y.id) + '">' + esc(y.qisqa || y.nom) + "</a>" : esc(t.obyektId)],
      ["Maqsad", esc(t.maqsad || "—")], ["Hamroh", esc(t.hamroh || "—")],
      ["Kirish", '<span data-tarjimasiz>' + esc((t.sana || "") + " " + (t.kirish || "—")) + "</span>"],
      ["Chiqish", '<span data-tarjimasiz>' + esc(t.chiqish || "—") + "</span>"], ["Davomiylik", '<span data-tarjimasiz>' + esc(t.davomiylik || "—") + "</span>"]]
      .map(x => "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>").join("");
    tarjimaQil(document.querySelector(".hujjat-shapka")); tarjimaQil($("tc-malumot"));
  }

  function dalolatChiz(){
    const h = dalolatnoma();
    $("tc-dalolatnoma").innerHTML = h ? '<div class="qator"><span class="belgi mint">' + ik("hujjat") + '</span><span class="matn"><b>' + esc(h.nom) + '</b><span data-tarjimasiz>' + esc(h.sana + " · " + (h.yuklagan || "")) +
      '</span></span><span class="ong"><button type="button" class="tugma tugma-oq tugma-kichik" id="tc-yukla">' + ik("yuklab") + "<span>Yuklab olish</span></button></span></div>" +
      '<p class="kichik-izoh">Dalolatnoma obyektning Hujjatlar tabida saqlangan.</p>'
      : MKB.boshHolat("hujjat", "Dalolatnoma tuzilmagan", "Chiqish rasmiylashtirilganda avtomatik tuziladi");
    tarjimaQil($("tc-dalolatnoma"));
    const b = $("tc-yukla");
    if (b) b.addEventListener("click", async () => { if (!h.faylId || !(await MKBapi.fayl.yuklab(h.faylId))) MKB.toast("Fayl bank tarmog'ida saqlanadi"); });
  }

  function asosiy(){
    if (t.holat === "yakunlandi" || t.holat === "bekor qilingan" || !yozadi){
      const h = dalolatnoma();
      const qator = h && h.izoh ? String(h.izoh).split("\n").filter(s => / — /.test(s)) : [];
      $("tc-asosiy").innerHTML = qator.length ? qator.map(s => { const [b, n] = s.split(" — "); const ok = n === "joyida";
        return '<div class="qator"><span class="belgi ' + (ok ? "mint" : "pushti") + '">' + ik(ok ? "tasdiq" : "xavf") + '</span><span class="matn"><b>' + esc(b) + '</b></span><span class="ong"><span class="chip chip-kichik ' + (ok ? "chip-yashil" : "chip-xavf") + '">' + (ok ? "Joyida" : "Nomuvofiq") + "</span></span></div>"; }).join("")
        : MKB.boshHolat("hujjat", t.holat === "kutilmoqda" ? "Tashrifchi hali kirmagan" : t.holat === "obyektda" ? "Chiqishni xavfsizlik xizmati yoki inspektor rasmiylashtiradi" : "Bandlar saqlanmagan",
          t.holat === "kutilmoqda" ? "Avval kirishni qayd eting" : t.holat === "yakunlandi" ? "Tashrif chiqish dalolatnomasisiz yakunlangan" : "", t.holat === "kutilmoqda" ? '<a class="tugma tugma-oq tugma-kichik" href="tashrif-jonli.html?id=' + encodeURIComponent(t.id) + '">Tashrif sahifasi</a>' : "");
      tarjimaQil($("tc-asosiy")); return;
    }
    if (t.holat !== "obyektda"){
      $("tc-asosiy").innerHTML = MKB.boshHolat("eshik", "Tashrifchi hali kirmagan", "Chiqishdan oldin kirish qayd etiladi", '<a class="tugma tugma-asosiy tugma-kichik" href="tashrif-jonli.html?id=' + encodeURIComponent(t.id) + '">' + ik("eshik") + "Tashrif sahifasi</a>");
      tarjimaQil($("tc-asosiy")); return;
    }
    $("tc-asosiy").innerHTML = '<form id="tc-forma" novalidate>' + BANDLAR.map((b, i) =>
      '<div class="topshir-band"><span class="band-nom">' + esc(b) + '</span><span class="tanlash" role="radiogroup" aria-label="' + esc(b) + '">' +
        '<label><input type="radio" name="b' + i + '" value="joyida" checked>' + ik("tasdiq") + "<span>Joyida</span></label>" +
        '<label class="nomuvofiq"><input type="radio" name="b' + i + '" value="nomuvofiq">' + ik("xavf") + "<span>Nomuvofiq</span></label></span></div>").join("") +
      '<div class="forma-tor" style="margin-top:14px"><div class="maydon"><label class="maydon-yorliq" for="f-ch">Chiqish vaqti <b>*</b></label><div class="kirish"><input id="f-ch" type="time" name="chiqish" required data-xato="Chiqish vaqtini kiriting" value="' + MKB.soat() + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-iz">Izoh</label><textarea class="kirish-matn" id="f-iz" name="izoh" rows="2" maxlength="400"></textarea></div></div>' +
      '<div class="nomuv-blok" id="nomuv" hidden><b style="font-weight:500">Nomuvofiqlik aniqlandi.</b> <span>Hodisa ochiladi va inspektorga tekshirish vazifasi beriladi.</span>' +
        '<div class="forma-tor" style="margin-top:12px"><div class="maydon"><label class="maydon-yorliq" for="f-j">Jiddiylik <b>*</b></label><div class="kirish"><select id="f-j" name="jiddiylik"><option value="yuqori">Yuqori</option><option value="o\'rta" selected>O\'rta</option><option value="past">Past</option></select></div></div>' +
        '<div class="maydon"><label class="maydon-yorliq" for="f-in">Inspektor <b>*</b></label><div class="kirish"><select id="f-in" name="inspektor" required data-xato="Inspektorni tanlang"><option value="">Tanlang</option>' +
          inspektorlar.map(f => '<option value="' + esc(f.nom) + '">' + esc(f.nom) + "</option>").join("") + "</select></div></div>" +
        '<div class="maydon keng"><label class="maydon-yorliq" for="f-nt">Nima aniqlandi <b>*</b></label><textarea class="kirish-matn" id="f-nt" name="tavsif" rows="2" maxlength="400" required minlength="5" data-xato="Nima aniqlanganini yozing"></textarea></div></div></div>' +
      '</form><div class="amal-qator"><button type="button" class="tugma tugma-asosiy" id="tc-saqla" data-yozadi data-tur="tashrif-chiqish-rasmiylashtirish">' + ik("tasdiq") + "<span>Chiqishni rasmiylashtirish</span></button></div>";
    tarjimaQil($("tc-asosiy"));
    const forma = $("tc-forma");
    const nomuvlar = () => BANDLAR.filter((b, i) => forma.querySelector('input[name="b' + i + '"]:checked').value === "nomuvofiq");
    forma.addEventListener("change", () => { $("nomuv").hidden = !nomuvlar().length; });
    $("tc-saqla").addEventListener("click", async () => {
      const nm = nomuvlar();
      const daqiqa = v => { const [a, b] = String(v || "00:00").split(":").map(Number); return a * 60 + b; };
      const tek = MKB.formaTekshir(forma, {chiqish: v => daqiqa(v) >= daqiqa(t.kirish) || "Chiqish vaqti kirishdan (" + (t.kirish || "—") + ") oldin bo'lmaydi"});
      if (!tek) return;
      const f = Object.assign({}, tek.qiymatlar, {izoh: (forma.querySelector("[name=izoh]").value || "").trim()});
      const daq = daqiqa(f.chiqish) - daqiqa(t.kirish);
      /* Rasmiylashtirish dalolatnoma tuzadi va tashrifni yakunlaydi: tashrifchi, obyekt va vaqt bilan tasdiqlanadi */
      const tasdiq = await MKB.tasdiqla({
        sarlavha: "Chiqishni rasmiylashtirish",
        matn: "Tashrif yakunlanadi, chiqish dalolatnomasi obyekt hujjatlariga saqlanadi va kirish jurnaliga chiqish yoziladi.",
        tafsilot: [["Tashrifchi", sh ? sh.ism : "—"], ["Obyekt", y ? (y.qisqa || y.nom) : t.obyektId], ["Kirish", {matn: (t.sana || "") + " " + (t.kirish || "—"), tarjimasiz: true}],
          ["Chiqish", {matn: f.chiqish, tarjimasiz: true}], ["Davomiyligi", {matn: daq + " daq", tarjimasiz: true}]],
        oqibat: nm.length ? ["Nomuvofiqlik bo'yicha hodisa ochiladi va inspektorga vazifa beriladi"] : [],
        okMatn: "Chiqishni rasmiylashtirish", bekorMatn: "Orqaga",
      });
      if (!tasdiq) return;
      await MKB.band($("tc-saqla"), async () => {
      const bugun = D.sanaYoz(D.bugun());
      const natijalar = BANDLAR.map((b, i) => b + " — " + forma.querySelector('input[name="b' + i + '"]:checked').value);
      const matn = ["TASHRIF CHIQISHI DALOLATNOMASI", "Tashrif: " + t.id, "Sana: " + bugun, "Obyekt: " + (y ? (y.qisqa || y.nom) + " (" + y.id + ")" : t.obyektId),
        "Tashrifchi: " + (sh ? sh.ism + (sh.tashkilot ? ", " + sh.tashkilot : "") : "—"), "Maqsad: " + (t.maqsad || "—"), "Hamroh: " + (t.hamroh || "—"),
        "Kirish: " + (t.kirish || "—") + ", chiqish: " + f.chiqish + ", davomiyligi: " + daq + " daqiqa", "", "Bandlar:"].concat(natijalar.map(s => "  " + s))
        .concat(f.izoh ? ["", "Izoh: " + f.izoh] : []).concat(nm.length ? ["", "Nomuvofiqlik: " + f.tavsif] : []).concat(["", "Rasmiylashtirdi: " + MKB.kim()]).join("\r\n");
      let hodisaId = null;
      const ok = await MKB.saqla(async () => {
        const fayl = await MKBapi.fayl.saqla(new File(["﻿" + matn], "tashrif-" + t.id.replace(/\W/g, "") + "-dalolatnoma.txt", {type: "text/plain"}), {obyektId: t.obyektId, kolleksiya: "HUJJATLAR"});
        const hid = await MKB.keyingiId("HUJJATLAR", "HJ-", 0);
        await MKBapi.yangi("HUJJATLAR", {id: hid, obyektId: t.obyektId, nom: "Tashrif chiqishi dalolatnomasi", tur: "Dalolatnoma", bosqich: (y && y.bosqich) || "qabul", raqam: t.id,
          sana: bugun, amalQilishTugash: null, holat: "Tasdiqlangan", format: "TXT", hajm: Math.max(1, Math.round(fayl.hajm / 1024)) + " KB", yuklagan: MKB.kim(), faylId: fayl.id, izoh: natijalar.join("\n")});
        await MKBapi.yangilash("TASHRIFLAR", t.id, {holat: "yakunlandi", chiqish: f.chiqish, davomiylik: daq + " daqiqa",
          izoh: [t.izoh, f.chiqish + " · Chiqish rasmiylashtirildi" + (nm.length ? ", nomuvofiqlik: " + nm.length : "") + (f.izoh ? ". " + f.izoh : "")].filter(Boolean).join("\n")});
        const n = D.obyektNuqtalari(t.obyektId)[0];
        const vid = await MKB.keyingiId("KIRISH_VOQEALARI", "KV-", 5);
        await MKBapi.yangi("KIRISH_VOQEALARI", {id: vid, vaqt: bugun + " " + f.chiqish, sana: bugun, soat: f.chiqish, obyektId: t.obyektId, kirishNuqtaId: n ? n.id : null, qurilmaId: null,
          nuqtaNomi: n ? n.nom : "Obyekt", shaxsId: t.shaxsId, usul: "Xodim qaydi", yuzMoslik: null, natija: "qayd etildi", sabab: "Tashrif " + t.id + " yakunlandi", yonalish: "chiqish"});
        if (nm.length){
          const h = await MKB.hodisa.yarat({obyektId: t.obyektId, hodisa: "Tashrifdan keyin nomuvofiqlik", jiddiylik: f.jiddiylik, manba: "qo'lda", masul: f.inspektor,
            tavsif: f.tavsif + " Bandlar: " + nm.join("; ") + ". Tashrif " + t.id + "."});
          hodisaId = h && h.id;
          const vzid = await MKB.keyingiId("MENING_VAZIFALARIM", "VZ-" + D.bugun().getFullYear() + "-", 0);
          await MKBapi.yangi("MENING_VAZIFALARIM", {id: vzid, nom: "Tashrifdan keyin obyektni tekshirish", tur: "Hodisa", obyektId: t.obyektId, kod: hodisaId || t.id, qoidaId: null,
            sana: bugun, muddat: D.sanaYoz(D.ishKuniQosh(D.bugun(), 1)), ijrochi: f.inspektor, rol: "Ko'rik va xavfsizlik inspektori", muhimlik: f.jiddiylik === "past" ? "orta" : "yuqori", bajarildi: false});
        }
      }, nm.length ? "Chiqish rasmiylashtirildi. Hodisa ochildi, inspektorga vazifa berildi" : "Chiqish rasmiylashtirildi. Dalolatnoma saqlandi");
      if (!ok) return;
      t = (D.TASHRIFLAR || []).find(x => x.id === id) || t;
      malumot(); dalolatChiz(); asosiy();
      if (hodisaId) $("tc-asosiy").insertAdjacentHTML("afterbegin", '<p class="kichik-izoh" style="margin:0 0 10px"><a href="hodisa.html?id=' + encodeURIComponent(hodisaId) + '">Ochilgan hodisa: ' + esc(hodisaId) + "</a></p>");
      });
    });
  }
  malumot(); dalolatChiz(); asosiy();
})();
</script>
</body>
</html>
