<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Auksion natijasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082620">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="savdo.html">Realizatsiya</a><span class="ajratgich">/</span><span>Natija</span></div>
    <div class="hs-qator"><h1>Auksion natijasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Auksion natijasi</h2></div>
  <form id="n-forma" class="forma-tor">
    <div class="maydon keng"><label class="maydon-yorliq">Lot <b>*</b></label>
      <div class="kirish"><select name="lotId" id="n-lot"></select></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">G'olib taklif <b>*</b></label>
      <div class="kirish"><select name="taklifId" id="n-taklif"></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Yakuniy narx, mln <b>*</b></label>
      <div class="kirish"><input name="narx" type="number" id="n-narx"></div></div>
    <div class="maydon"><label class="maydon-yorliq">Savdo sanasi <b>*</b></label>
      <div class="kirish"><input name="sana" placeholder="kk-oy, yyyy"></div></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" href="savdo.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit"><svg class="ic"><use href="#i-gavel"/></svg>Natijani rasmiylashtirish</button></div>
  </form></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082620"></script>
<script src="malumot-qoshimcha.js?v=26082620"></script>
<script src="tarjima.js?v=26082620"></script>
<script src="yadro/ikonlar.js?v=26082620"></script>
<script src="yadro/daraxt.js?v=26082620"></script>
<script src="yadro/chizma.js?v=26082620"></script>
<script src="yadro/api.js?v=26082620"></script>
<script src="yadro/app.js?v=26082620"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const lotlar = await MKBapi.royxat("SOTUV");
  const takliflar = await MKBapi.royxat("TAKLIFLAR");
  const oldindan = new URLSearchParams(location.search).get("id");
  const nl = document.getElementById("n-lot"), nt = document.getElementById("n-taklif");
  nl.innerHTML = lotlar.map(l =>
    '<option value="' + l.id + '"' + (l.id === oldindan ? " selected" : "") + '>' + l.id + " — " + l.nom + '</option>').join("");
  function takliflarniYangila(){
    const t = takliflar.filter(v => v.obyektId === nl.value)
      .sort((a, b) => MKB.sonQiymat(b.summa) - MKB.sonQiymat(a.summa));
    nt.innerHTML = t.length ? t.map(v =>
      '<option value="' + v.id + '" data-summa="' + v.summa + '">' + v.kim + " — " + MKB.fmt(v.summa) + ' mln</option>').join("")
      : '<option value="">Taklif yo\'q</option>';
    document.getElementById("n-narx").value = t.length ? t[0].summa : "";
  }
  nl.addEventListener("change", takliflarniYangila);
  nt.addEventListener("change", () => {
    const o = nt.selectedOptions[0];
    if (o && o.dataset.summa) document.getElementById("n-narx").value = o.dataset.summa;
  });
  takliflarniYangila();
  document.getElementById("n-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["lotId", "taklifId", "narx", "sana"]);
    if (!q) return;
    const l = lotlar.find(v => v.id === q.lotId);
    const t = takliflar.find(v => v.id === q.taklifId);
    await MKBapi.yangi("ARXIV", {id: l.id, kod: l.id, nom: l.nom, tur: l.tur,
      sotilgan: q.sana, yil: "2026", xaridor: t.kim, summa: +q.narx,
      ish: l.ish, qabul: "—", nazorat: "—", rasm: l.rasm});
    await MKBapi.yangilash("SOTUV", l.id, {bosqich: "rasmiylashtirish", yakuniyNarx: +q.narx, golib: t.kim});
    localStorage.setItem("mkb4-natija-" + l.id, JSON.stringify({golib: t.kim, narx: q.narx, sana: q.sana}));
    MKB.toast("Natija rasmiylashtirildi — " + l.id);
    setTimeout(() => location.href = "auksion-bayonnoma.html?id=" + encodeURIComponent(l.id), 800);
  });
});
</script>
</body>
</html>
