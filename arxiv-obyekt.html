<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Arxiv yozuvi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.natija-royxat{display:flex;flex-direction:column}
.natija-royxat div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--chiziq-2);font-size:14px}
.natija-royxat div > span:first-child{color:var(--matn-2)}
.natija-royxat small{display:block;font-size:12px;color:var(--matn-3);margin-top:2px}
.natija-royxat .ayir b::before{content:"− "}
.natija-royxat div.oraliq-jami{background:var(--plitka);border-radius:12px;padding:11px 14px;margin:6px 0;border-bottom:0}
.natija-royxat div.jami{border-bottom:0;padding-top:16px}
.natija-royxat div.jami span:first-child{font:500 16px var(--shrift-displey);color:var(--siyoh)}
.natija-royxat div.jami b{font:500 26px/1 var(--shrift-displey);letter-spacing:-.02em}
.musbat{color:var(--yashil)}
.manfiy{color:var(--xavf-matn-yorqin)}
.hujjat-qatori{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--chiziq-2)}
.hujjat-qatori:last-child{border-bottom:0}
.hujjat-qatori .belgi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--plitka);flex:none}
.hujjat-qatori .matn{flex:1;min-width:0}
.hujjat-qatori .matn b{display:block;font-weight:500;font-size:14px}
.hujjat-qatori .matn span{font-size:12.5px;color:var(--matn-3)}
.hujjat-qatori .fayl-izoh{display:block;margin-top:4px}
.voqealar{list-style:none;display:flex;flex-direction:column}
.voqealar li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--chiziq-2);font-size:13.5px}
.voqealar li:last-child{border-bottom:0}
.voqealar time{color:var(--matn-3);font-variant-numeric:tabular-nums}
.voqealar b{font-weight:500;display:block}
.voqealar span{color:var(--matn-3);font-size:12.5px}
</style>
</head>
<body data-sahifa="aktivlar">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="obyektlar.html">Balans aktivlari</a><span class="ajratgich">/</span><a href="arxiv.html">Arxiv va chiqim</a><span class="ajratgich">/</span><span id="yorliq">Yozuv</span></div>
    <div class="hs-qator"><h1 id="sarlavha">Arxiv yozuvi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div id="joy" class="ustun"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(async () => {
  const joy = document.getElementById("joy");
  joy.innerHTML = MKB.skelet(2, "karta");
  await MKBapi.tayyor;
  if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
  if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
  const D = MKB_DATA;
  const esc = MKB.esc;
  const yaxlit = n => Math.round(n * 10) / 10;
  const id = new URLSearchParams(location.search).get("id");
  let a = null;
  try{ a = id ? await MKBapi.bitta("ARXIV", id) : null; }
  catch(e){ MKB.xatoHolat(joy, "Arxiv yozuvini o'qib bo'lmadi", () => location.reload()); return; }
  if (!a){ location.replace("xato-404.html"); return; }
  if (!MKB.doira([a]).length){ location.replace("xato-403.html"); return; }
  const y = D.topish(a.obyektId || a.id);
  const usulNomi = k => k === "hisobdan" ? "Hisobdan chiqarish" : (((D.SOTISH_USULLARI || []).find(u => u.kalit === k) || {}).nom || k || "—");
  document.getElementById("yorliq").textContent = a.qisqa || a.nom;
  document.getElementById("sarlavha").textContent = a.qisqa || a.nom || "Arxiv yozuvi";
  document.getElementById("hs-meta").innerHTML = '<span class="kod-mono" data-tarjimasiz>' + esc(a.id) + "</span> · <span>Chiqarildi</span> <span data-tarjimasiz>" + esc(a.sotuvSana || "") + "</span>";

  /* ---------- Iqtisodiy natija ---------- */
  const tushum = a.sotuvNarxi == null ? 0 : +a.sotuvNarxi;
  const balans = +a.balansQiymat || 0;
  const xarajat = +a.jamiXarajat || 0;
  const zaxira = a.tiklanganZaxira == null ? null : +a.tiklanganZaxira;
  const qqsP = (D.PARAMETRLAR || []).find(p => p.id === "qqsFoiz");
  const qqsFoiz = qqsP && qqsP.qiymat != null ? +qqsP.qiymat : 12;
  const qqsTaxminiy = !qqsP || qqsP.taxminiy !== false;
  const qqs = tushum > 0 ? yaxlit(tushum * qqsFoiz / (100 + qqsFoiz)) : 0;
  const foydaZarar = a.foydaZarar != null ? +a.foydaZarar : yaxlit(tushum - balans - xarajat);
  const sof = yaxlit(foydaZarar - qqs);
  const pul = n => '<b data-tarjimasiz>' + esc(MKB.pul(n)) + "</b>";
  const belgili = n => '<b data-tarjimasiz class="' + (n < 0 ? "manfiy" : "musbat") + '">' + (n < 0 ? "−" : "+") + esc(MKB.pul(Math.abs(n))) + "</b>";

  /* ---------- Hujjatlar va xarajatlar ---------- */
  const oid = a.obyektId || a.id;
  let hujjatlar = [], xarajatlar = [];
  try{ hujjatlar = (await MKBapi.royxat("HUJJATLAR")).filter(h => h.obyektId === oid); }catch(_){ }
  try{ xarajatlar = (await MKBapi.royxat("XARAJATLAR")).filter(x => x.obyektId === oid && x.holat !== "bekor"); }catch(_){ }
  const sh = a.shartnomaId ? (D.SHARTNOMALAR || []).find(s => s.id === a.shartnomaId) : null;
  const lot = a.lotId ? (D.LOTLAR || []).find(l => l.id === a.lotId) : null;

  const kv = (k, v) => "<dt>" + k + "</dt><dd>" + v + "</dd>";
  const matn = v => v == null || v === "" ? "—" : '<span data-tarjimasiz>' + esc(String(v)) + "</span>";
  joy.innerHTML =
    '<section class="foto-shapka" aria-label="Obyekt"></section>' +
    '<div class="tor-2">' +
      '<section class="karta" aria-labelledby="n-sar" data-sayohat="natija"><div class="karta-bosh"><h2 id="n-sar">Iqtisodiy natija</h2></div>' +
        '<div class="natija-royxat">' +
          "<div><span>Tushum</span>" + pul(tushum) + "</div>" +
          '<div class="ayir"><span>Balans qiymati</span>' + pul(balans) + "</div>" +
          '<div class="ayir"><span>Saqlash xarajatlari</span>' + pul(xarajat) + "</div>" +
          '<div class="oraliq-jami"><span>Natija, QQSgacha</span>' + belgili(foydaZarar) + "</div>" +
          '<div class="ayir"><span><span>QQS</span> <span data-tarjimasiz>' + qqsFoiz + '%</span><small>' + (qqsTaxminiy ? "<span>Taxminiy, narx ichida.</span> <span>Buxgalteriya tasdiqlashi kerak</span>" : "<span>Narx ichida</span>") + "</small></span>" + pul(qqs) + "</div>" +
          '<div class="jami"><span>Natija, QQSdan keyin</span>' + belgili(sof) + "</div>" +
          '<div style="border-bottom:0;padding-top:4px"><span><span>Tiklangan zaxira</span><small>Joriy davr daromadiga o&#39;tadi</small></span>' + (zaxira == null ? "<b>—</b>" : pul(zaxira)) + "</div>" +
        "</div></section>" +
      '<div class="ustun">' +
        '<section class="karta" aria-labelledby="s-sar" data-sayohat="chiqim"><div class="karta-bosh"><h2 id="s-sar">Chiqim</h2></div><dl class="malumot-royxat">' +
          kv("Usul", "<span>" + esc(usulNomi(a.sotishUsuli)) + "</span>") +
          kv("Xaridor", matn(a.xaridor)) +
          kv("Chiqim sanasi", matn(a.sotuvSana)) +
          kv("Shartnoma", a.shartnomaId ? (sh ? '<a class="kod-mono" data-tarjimasiz href="shartnoma.html?id=' + encodeURIComponent(a.shartnomaId) + '">' + esc(a.shartnomaId) + "</a>" : matn(a.shartnomaId)) : "—") +
          kv("Lot", a.lotId ? (lot ? '<a class="kod-mono" data-tarjimasiz href="lot.html?id=' + encodeURIComponent(a.lotId) + '">' + esc(a.lotId) + "</a>" : matn(a.lotId)) : "—") +
          (a.izoh ? kv("Asos", matn(a.izoh)) : "") +
        "</dl></section>" +
        '<section class="karta" aria-labelledby="b-sar"><div class="karta-bosh"><h2 id="b-sar">Balansda</h2></div><dl class="malumot-royxat">' +
          kv("Balansga qabul", matn(a.balansSana)) +
          kv("Balansdan chiqish", matn(a.sotuvSana)) +
          kv("Balansda turgan", a.turganKun == null ? "—" : '<b data-tarjimasiz>' + MKB.fmt(a.turganKun) + "</b> <span>kun</span>") +
          kv("Turi", "<span>" + esc(a.tur || "—") + "</span>") +
          kv("Filial", matn(a.filial)) +
        "</dl></section>" +
      "</div></div>" +
    '<div class="tor-2-teng">' +
      '<section class="karta" aria-labelledby="x-sar"><div class="karta-bosh"><h2 id="x-sar">Xarajatlar tarkibi</h2></div><div id="xarajat-joy"></div></section>' +
      '<section class="karta" aria-labelledby="h-sar" data-sayohat="hujjatlar"><div class="karta-bosh"><h2 id="h-sar">Hujjatlar</h2><span class="soni" data-tarjimasiz>' + hujjatlar.length + "</span></div><div id=\"hujjat-joy\"></div></section>" +
    "</div>" +
    (y && Array.isArray(y.tarix) && y.tarix.length ? '<section class="karta" aria-labelledby="t-sar"><div class="karta-bosh"><h2 id="t-sar">Tarix</h2></div><ul class="voqealar">' +
      y.tarix.slice().reverse().slice(0, 8).map(t => '<li><time data-tarjimasiz>' + esc(t.sana || "") + "</time><div><b>" + esc(t.voqea || "") + "</b><span>" + esc(t.izoh || "") + "</span></div></li>").join("") + "</ul></section>" : "");
  MKB.fotoShapka(a, joy.querySelector(".foto-shapka"));

  /* Xarajatlar */
  const xj = document.getElementById("xarajat-joy");
  if (xarajatlar.length){
    const toifa = {};
    xarajatlar.forEach(x => { toifa[x.toifa] = (toifa[x.toifa] || 0) + (+x.summa || 0); });
    const qatorlar = Object.keys(toifa).map(k => [MKB.holatNomi(k), yaxlit(toifa[k])]).sort((p, q) => q[1] - p[1]);
    MKB.barlar(xj, qatorlar, {format: v => MKB.pul(v)});
  } else {
    xj.innerHTML = MKB.boshHolat("pul", xarajat > 0 ? "Xarajat yozuvlari tizimda yo'q" : "Xarajat qayd etilmagan",
      xarajat > 0 ? "Jami summa arxiv yozuvidan olingan. Toifalar bo'yicha taqsimot kiritilmagan." : "");
  }

  /* Hujjatlar */
  const hj = document.getElementById("hujjat-joy");
  if (hujjatlar.length){
    hj.innerHTML = hujjatlar.sort((p, q) => (D.sanaOqi(q.sana) || 0) - (D.sanaOqi(p.sana) || 0)).map(h =>
      '<div class="hujjat-qatori"><span class="belgi">' + ik("hujjat") + '</span><div class="matn"><b>' + esc(h.nom || h.tur) + "</b><span>" +
        [h.raqam, h.sana, h.format].filter(Boolean).map(x => '<span data-tarjimasiz>' + esc(x) + "</span>").join(" · ") + "</span></div>" +
      (h.faylId ? '<button type="button" class="tugma tugma-oq tugma-kichik" data-fayl-yukla="' + esc(h.faylId) + '">' + ik("yuklab") + "Yuklab olish</button>" : "") + "</div>").join("");
    /* Yuklab olish: tugma band holatida; faylning o'zi shu brauzerda bo'lmasa halol izoh qator ostida */
    hj.addEventListener("click", async e => {
      const b = e.target.closest("[data-fayl-yukla]"); if (!b) return;
      const qator = b.closest(".hujjat-qatori");
      const eski = qator.querySelector(".fayl-izoh"); if (eski) eski.remove();
      const izoh = matn => { const s2 = document.createElement("span"); s2.className = "maydon-izoh fayl-izoh"; s2.setAttribute("role", "status"); s2.textContent = matn; qator.querySelector(".matn").appendChild(s2); tarjimaQil(s2); };
      try{
        const ok = await MKB.band(b, () => MKBapi.fayl.yuklab(b.dataset.faylYukla));
        if (ok === false) izoh("Fayl bank tarmog'ida saqlanadi. Nusxasini hujjatlar bo'limidan so'rang");
      }catch(err){ izoh("Fayl ochilmadi: " + (err && err.message ? err.message : "qayta urinib ko'ring")); }
    });
  } else {
    hj.innerHTML = MKB.boshHolat("hujjat", "Hujjat biriktirilmagan", "Chiqim hujjatlari tizimga yuklanmagan.");
  }
  tarjimaQil(joy);
})();
</script>
</body>
</html>
