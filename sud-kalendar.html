<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Sud majlislari kalendari</title>
<link rel="stylesheet" href="yadro/app.css?v=26091807">
</head>
<body data-sahifa="yuridik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Undiruv va sud</span></div>
    <div class="hs-qator"><h1>Sud majlislari kalendari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="undiruv.html">Undiruv doskasi</a><a href="sud-kalendar.html" class="faol">Sud kalendari</a><a href="davo-tayyorlash.html">Da&#39;vo tayyorlash</a></nav>
  <div id="kalendar" style="display:flex;flex-direction:column;gap:14px"></div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26091807"></script>
<script src="malumot.js?v=26091807"></script>
<script src="malumot-qoshimcha.js?v=26091807"></script>
<script src="malumot-kengaytma.js?v=26091807"></script>
<script src="malumot-kirish.js?v=26091807"></script>
<script src="malumot-indeks.js?v=26091807"></script>
<script src="tarjima.js?v=26091807"></script>
<script src="yadro/ikonlar.js?v=26091807"></script>
<script src="yadro/daraxt.js?v=26091807"></script>
<script src="yadro/chizma.js?v=26091807"></script>
<script src="yadro/qollanma.js?v=26091807"></script>
<script src="yadro/api.js?v=26091807"></script>
<script src="yadro/app.js?v=26091807"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("SUD_MAJLISLAR");
  document.getElementById("hs-meta").textContent = r.length + " ta majlis";
  if (!r.length){
    const joy = document.getElementById("kalendar");
    joy.innerHTML = '<section class="karta"><div class="bosh-holat"><svg class="ic"><use href="#i-kalendar"/></svg>' +
      "<b>Rejada sud majlisi yo'q</b><span>Majlis tayinlanganda shu yerda ko'rinadi</span></div></section>";
    tarjimaQil(joy);
    return;
  }
  const kunlar = {};
  r.forEach(m => { (kunlar[m.sana] = kunlar[m.sana] || []).push(m); });
  /* kalendar sana bo'yicha o'sish tartibida chiziladi — massiv tartibi tasodifiy bo'lishi mumkin */
  const kunTartib = Object.entries(kunlar).sort((a, b) => {
    const d = n => MKB_DATA.sanaOqi(n) || new Date(8640000000000);
    return d(a[0]) - d(b[0]);
  });
  document.getElementById("kalendar").innerHTML = kunTartib.map(([sana, royxat]) =>
    '<section class="karta"><div class="karta-bosh">' +
      '<span style="width:46px;text-align:center;border:1.5px solid var(--siyoh);border-radius:14px;padding:5px 0;flex:none">' +
        '<b style="display:block;font:500 16px var(--shrift-displey)">' + sana.split("-")[0] + '</b>' +
        '<span style="font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--iz)">' + sana.split("-")[1].split(",")[0] + '</span></span>' +
      '<h2>' + sana + '</h2><span class="soni">' + royxat.length + ' ta majlis</span></div>' +
      royxat.map(m =>
        '<a href="sud-majlis.html?id=' + encodeURIComponent(m.id) + '" class="qator">' +
          '<b class="kod-mono" style="flex:none;width:44px">' + m.soat + '</b>' +
          '<span class="matn"><b>' + m.obyekt + '</b>' +
          '<span style="font-size:12.5px;color:var(--matn-3)">' + m.sud + ' · ' + m.zal + ' · ' + m.advokat + '</span></span>' +
          '<span class="chip ' + (m.holat === "rejada" ? "chip-brend\">Rejada" : "chip-yashil\">O'tkazildi") + '</span></a>').join("") +
    '</section>').join("");
});
</script>
</body>
</html>
