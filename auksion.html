<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKB — Auksion savdolari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mkb.css?v=26082602">
<style>
/* ---- Auksion savdolari (Musodara qilingan aktiv obyektlarini realizatsiya qilish) ---- */
.st-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.st-kpi .karta{display:flex;align-items:center;gap:13px;padding:18px 20px}
.st-kpi .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;box-shadow:var(--chuqur-tile)}
.st-kpi .tile .ic{width:21px;height:21px}
.st-kpi .tile.yashil{background:#EEF2FF;color:#4F46E5}
.st-kpi .tile.kok{background:#F0F9FF;color:#0369A1}
.st-kpi .tile.sariq{background:#FFFBEB;color:#B45309}
.st-kpi .tile.binafsha{background:#F5F3FF;color:#6D28D9}
.st-kpi .yorliq{font-size:13.5px;color:var(--matn-3)}
.st-kpi b{display:block;font-size:24px;font-weight:750;line-height:1.2}

.st-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.bosqich-ustunlar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.b-ustun h4{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:750;padding:0 4px 10px}
.b-ustun h4 .son{margin-left:auto;font-size:11.5px;font-weight:750;background:#F4F4F5;border-radius:99px;padding:2px 8px;color:#52525B}
.b-ustun h4 .nuqta{width:8px;height:8px;border-radius:99px}
.s-karta{
  width:100%;text-align:left;background:var(--karta);border:1px solid var(--chiziq);border-radius:14px;
  padding:11px;margin-bottom:10px;transition:box-shadow var(--tez),border-color var(--tez);
}
.s-karta:hover{box-shadow:var(--soya)}
.s-karta.faol{border-color:#C7D2FE;background:#FAFAFA;box-shadow:0 0 0 1px #C7D2FE}
.s-karta img{width:100%;height:84px;object-fit:cover;border-radius:10px;outline:1px solid rgba(23,26,31,.06);outline-offset:-1px}
.s-karta b{display:block;font-size:13px;font-weight:700;margin-top:8px}
.s-karta .narx{display:block;font-size:12.5px;font-weight:750;color:#3730A3;margin-top:2px}
.s-karta .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--matn-4);margin-top:4px}
.s-karta .meta .ic{width:13px;height:13px}

/* Tanlangan obyekt paneli */
.tanlangan-panel h3{font-size:17px;font-weight:750}
.tp-obyekt{display:flex;gap:13px;margin-top:12px}
.tp-obyekt img{width:104px;height:84px;object-fit:cover;border-radius:12px;outline:1px solid rgba(23,26,31,.06);outline-offset:-1px}
.tp-obyekt b{display:block;font-size:15.5px;font-weight:750}
.tp-obyekt .kod{display:block;font-size:12px;color:var(--matn-4)}
.tp-obyekt .narx{display:block;font-size:14px;font-weight:750;color:#3730A3;margin-top:4px}
.tp-obyekt .chip{margin-top:6px}
.tp-blok{margin-top:14px;padding-top:12px;border-top:1px solid var(--chiziq)}
.tp-blok h4{font-size:14.5px;font-weight:750;margin-bottom:6px;display:flex;align-items:center}
.tp-blok h4 .son{margin-left:8px;font-size:11.5px;background:#EEF2FF;color:#3730A3;border-radius:99px;padding:2px 8px}
.mijoz-band{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F4F4F5}
.mijoz-band:last-of-type{border-bottom:none}
.mijoz-band .avatar{width:36px;height:36px}
.mijoz-band b{display:block;font-size:13.5px;font-weight:650}
.mijoz-band span{display:block;font-size:12px;color:var(--matn-4)}
.mijoz-band .teg{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.teg-korik{background:#F0F9FF;color:#0369A1}
.teg-muzokara{background:#FFFBEB;color:#B45309}
.teg-tayyor{background:#EEF2FF;color:#3730A3}
.tp-amal{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.tp-amal .a{
  display:flex;align-items:center;gap:11px;height:48px;padding:0 15px;border-radius:12px;
  border:1px solid var(--kirish-chiziq);font-size:13.5px;font-weight:650;color:#18181B;
  transition:background var(--tez);text-align:left;
}
.tp-amal .a:hover{background:#F4F4F5}
.tp-amal .a .ic{width:17px;height:17px;color:#52525B}
.tp-amal .yakun{
  height:54px;border-radius:13px;background:#C7D2FE;color:var(--tile-och-ikon);border:none;
  font-size:15px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;
}
.tp-amal .yakun:hover{background:#A5B4FC}
.tp-amal .yakun .ic{width:19px;height:19px;color:var(--tile-och-ikon)}
@media (max-width:1500px){.st-kpi{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bosqich-ustunlar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:1200px){.st-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:800px){.bosqich-ustunlar{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body data-sahifa="realizatsiya">

<div class="app">
<aside class="sidebar" data-shell-sidebar></aside>

<div class="asosiy">
  <header class="topbar" data-shell-topbar></header>

  <main class="kontent">
    <div class="sahifa-qator">
      <div>
        <h1>Auksion savdolari</h1>
        <div class="sahifa-izoh">Musodara qilingan aktiv obyektlarini realizatsiya qilish: ko'rikdan hujjatlargacha yagona jarayon</div>
      </div>
      <div class="sahifa-harakat">
        <a class="tugma tugma-oq" href="musodara-qabul.html"><svg class="ic"><use href="#i-aktiv"/></svg>Balansga qabulga o'tish</a>
        <a class="tugma tugma-asos" data-ruxsat-yashir href="korik-tayinlash.html"><svg class="ic"><use href="#i-tashrif"/></svg>Ko'rik tayinlash</a>
      </div>
    </div>

    <!-- KPI -->
    <section class="st-kpi">
      <button class="karta" data-toast="Auksiondagi obyektlar ro'yxati">
        <span class="tile yashil"><svg class="ic"><use href="#i-daromad"/></svg></span>
        <span><span class="yorliq">Auksionda (doska)</span><b id="ak-doska">—</b></span>
      </button>
      <button class="karta" data-toast="Belgilangan ko'riklar jadvali">
        <span class="tile kok"><svg class="ic"><use href="#i-tashrif"/></svg></span>
        <span><span class="yorliq">Ko'rik belgilangan</span><b id="ak-korik">—</b></span>
      </button>
      <button class="karta" data-toast="Muzokaradagi obyektlar">
        <span class="tile sariq"><svg class="ic"><use href="#i-tashrif"/></svg></span>
        <span><span class="yorliq">Muzokarada</span><b id="ak-muzokara">—</b></span>
      </button>
      <a class="karta" href="arxiv.html">
        <span class="tile binafsha"><svg class="ic"><use href="#i-papka"/></svg></span>
        <span><span class="yorliq">2026-yilda realizatsiya qilingan</span><b id="ak-sotildi">—</b></span>
      </a>
    </section>

    <div class="st-grid">

      <!-- Bosqichlar -->
      <div class="karta">
        <div class="bosqich-ustunlar" id="bosqichlar"></div>
      </div>

      <!-- Tanlangan obyekt -->
      <aside class="karta tanlangan-panel" id="tanlangan-panel"></aside>
    </div>
  </main>
</div>
</div>

<script src="malumot.js?v=26082602"></script>
<script src="tarjima.js?v=26082602"></script>
<script src="mkb.js?v=26082602"></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{

const AVATAR = `<span class="avatar"><svg viewBox="0 0 34 34" style="width:28px;height:28px;display:block;margin:4px auto 0"><circle cx="17" cy="12" r="6.5" fill="#A1A1AA"/><path d="M4 34c1.6-8 7-11.5 13-11.5S28.4 26 30 34z" fill="#A1A1AA"/></svg></span>`;

/* Lotlar yagona manbadan: faol yozuvlar (musodara/auksion bosqichi) + yopilgan ishlar */
const MIJOZ_QOSHIMCHA = MKB_DATA.SAVDO_MIJOZLAR;   /* yagona manba (Д-1) */
const OBYEKTLAR = MKB_DATA.YOZUVLAR
  .filter(y => ["musodara", "auksion"].includes(y.ish.bosqich))
  .map(y => {
    const q = MIJOZ_QOSHIMCHA[y.id] || {};
    return {id: y.id, nom: y.mulk.nom, kod: y.id + " · " + y.ish.ijro,
      narx: y.bahoMatn, rasm: y.mulk.rasm,
      bosqich: q.bosqich || "tayyorlanmoqda", korik: q.korik || 0, mijozlar: q.mijozlar || []};
  })
  .concat(MKB_DATA.SOTUV.map(l => {
    const q = MIJOZ_QOSHIMCHA[l.id] || {};
    return {id: l.id, nom: l.nom, kod: l.id + " · " + l.ijro,
      narx: MKB_DATA.pul(l.baho), rasm: l.rasm,
      bosqich: l.bosqich, korik: l.korik, mijozlar: q.mijozlar || []};
  }));

const BOSQICHLAR = MKB_DATA.AUKSION_BOSQICH;   /* yagona manba (Д-1) */
let faolId = null;

function bosqichChiz(){
  document.getElementById("bosqichlar").innerHTML = BOSQICHLAR.map(b=>{
    const royxat = OBYEKTLAR.filter(o=>o.bosqich===b[0]);
    return `
    <div class="b-ustun">
      <h4><span class="nuqta" style="background:${b[2]}"></span>${b[1]}<span class="son">${royxat.length}</span></h4>
      ${royxat.map(o=>`
        <button class="s-karta ${o.id===faolId?"faol":""}" data-id="${o.id}">
          <img loading="lazy" src="${o.rasm}" alt="">
          <b>${o.nom}</b>
          <span class="narx">${o.narx}</span>
          <span class="meta"><svg class="ic"><use href="#i-foyd"/></svg>${o.mijozlar.length} mijoz${o.korik?` · <svg class="ic"><use href="#i-tashrif"/></svg>${o.korik} ko'rik`:""}</span>
        </button>`).join("")}
    </div>`;
  }).join("");
  document.querySelectorAll(".s-karta").forEach(k=>{
    k.addEventListener("click", ()=>{ faolId = k.dataset.id; bosqichChiz(); panelChiz(); });
  });
}

function panelChiz(){
  if (faolId === null || !OBYEKTLAR.some(x=>x.id===faolId)) faolId = OBYEKTLAR[0].id;
  const o = OBYEKTLAR.find(x=>x.id===faolId);
  if (window.lotAktUlash) window.lotAktUlash(o.id);
  const bosqichNomi = BOSQICHLAR.find(b=>b[0]===o.bosqich)[1];
  document.getElementById("tanlangan-panel").innerHTML = `
    <h3>Tanlangan obyekt</h3>
    <div class="tp-obyekt">
      <img loading="lazy" src="${o.rasm}" alt="${o.nom}">
      <span>
        <b>${o.nom}</b>
        <span class="kod">${o.kod}</span>
        <span class="narx">${o.narx}</span>
        <span class="chip chip-sariq" style="height:24px">${bosqichNomi}</span>
      </span>
    </div>

    ${(MKB_DATA.SAVDO_MIJOZLAR[o.id] || {}).savdoSana ? `
    <div class="tp-blok">
      <h4>Savdo sanasi</h4>
      <div style="display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700">
        <svg class="ic" style="width:16px;height:16px;color:var(--asos)"><use href="#i-kalendar"/></svg>
        ${MKB_DATA.SAVDO_MIJOZLAR[o.id].savdoSana}
      </div>
    </div>` : ""}

    <div class="tp-blok">
      <h4>Auksion ishtirokchilari<span class="son">${o.mijozlar.length}</span></h4>
      ${o.mijozlar.map(m=>`
        <div class="mijoz-band">
          ${AVATAR}
          <span><b>${m[0]}</b><span>${m[1]}</span></span>
          <span class="teg teg-${m[2]}">${m[3]}</span>
        </div>`).join("")}
      <button class="tp-amal a" style="margin-top:9px;width:100%" data-toast="Yangi mijoz qo'shish oynasi">
        <svg class="ic"><use href="#i-qoshish"/></svg>Mijoz qo'shish
      </button>
    </div>

    <div class="tp-blok">
      <h4>Amallar</h4>
      <div class="tp-amal">
        <a class="a" id="lot-akt" data-ruxsat-yashir href="korik-akti.html"><svg class="ic"><use href="#i-hujjat"/></svg>So'nggi ko'rik dalolatnomasi</a>
        <a class="a" data-ruxsat-yashir href="korik-tayinlash.html"><svg class="ic"><use href="#i-tashrif"/></svg>Xaridor ko'rigini tayinlash</a>
        <a class="a" data-ruxsat-yashir href="aktiv-monitoringi.html"><svg class="ic"><use href="#i-monitor"/></svg>Nazorat holatini ko'rish</a>
        <a class="a" data-ruxsat-yashir href="hujjatlar.html"><svg class="ic"><use href="#i-hujjat"/></svg>Obyekt hujjatlari</a>
        <button class="yakun" id="sotuv-yakunlash"><svg class="ic"><use href="#i-belgi-doira"/></svg>Auksion natijasini rasmiylashtirish</button>
      </div>
    </div>`;

  document.getElementById("sotuv-yakunlash").addEventListener("click", ()=>{
    MKB.modal("Auksion natijasini rasmiylashtirish — "+o.nom,
      `<div style="display:grid;gap:13px;margin-top:6px">
        <div><label class="maydon-yorliq">Xaridor</label><div class="kirish"><svg class="ic"><use href="#i-foyd"/></svg><input value="${o.mijozlar[0][0]}"></div></div>
        <div><label class="maydon-yorliq">Yakuniy narx</label><div class="kirish"><svg class="ic"><use href="#i-daromad"/></svg><input value="${o.narx}"></div></div>
        <div><label class="maydon-yorliq">Shartnoma raqami</label><div class="kirish"><svg class="ic"><use href="#i-shartnoma"/></svg><input placeholder="SOT-2026-____"></div></div>
        <label class="katakcha"><input type="checkbox" checked><span class="quti"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Oldi-sotdi shartnomasi rasmiylashtirildi</label>
        <label class="katakcha"><input type="checkbox" checked><span class="quti"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>To'lov tasdiqnomasi biriktirildi</label>
        <label class="katakcha"><input type="checkbox"><span class="quti"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Topshirish dalolatnomasi biriktirildi</label>
        <div style="background:#FFFBEB;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#8A6116">
          Obyekt sotilgach <b>doimiy arxivga</b> o'tadi va faol reyestrdan chiqariladi. Arxiv yozuvi hech qachon o'chirilmaydi.
        </div>
      </div>`,
      { okMatn:"Sotuvni tasdiqlash", ok(){
        MKB.toast(o.nom+" sotildi — doimiy arxivga o'tkazildi", "i-belgi-doira");
        setTimeout(()=>location.href="arxiv.html", 1100);
      }});
  });
}
bosqichChiz(); panelChiz();
});

/* Tanlangan lot uchun so'nggi ko'rik akti (flow #7): akt bo'lmasa havola yashiriladi */
(function(){
  const a = document.getElementById("lot-akt");
  if (!a) return;
  function aktUlash(obyektId){
    const k = MKB_DATA.KORIKLAR.filter(x => x.obyektId === obyektId && x.holat === "otkazildi")
      .sort((x, y) => (x.sana < y.sana ? 1 : -1))[0];
    if (k){ a.style.display = ""; a.href = "korik-akti.html?id=" + encodeURIComponent(k.id); }
    else { a.style.display = "none"; }
  }
  window.lotAktUlash = aktUlash;
})();

/* KPI doska ma'lumotidan hisoblanadi (Д-7) */
(function(){
  const q = (i, v) => { const e = document.getElementById(i); if (e) e.textContent = v; };
  q("ak-doska", OBYEKTLAR.length);
  let korik = 0, muzokara = 0;
  OBYEKTLAR.forEach(o => {
    const qo = MIJOZ_QOSHIMCHA[o.id] || {};
    (qo.mijozlar || []).forEach(m => {
      if (m[2] === "korik") korik++;
      if (m[2] === "muzokara") muzokara++;
    });
  });
  q("ak-korik", korik);
  q("ak-muzokara", muzokara);
  q("ak-sotildi", MKB_DATA.ARXIV.filter(a => a.yil === "2026").length);
})();
</script>
</body>
</html>
