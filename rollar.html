<script>
document.addEventListener("mkb:tayyor", () => {
  const bolimlar = BOLIMLAR.map(b => ({kalit: b.kalit, yorliq: b.yorliq})).concat([{kalit: "sozlama", yorliq: "Sozlamalar"}]);
  const rollar = Object.keys(ROL_RUXSAT);
  const ROL_NOMI = {};
  Object.entries(ROL_KALIT).forEach(([nom, k]) => ROL_NOMI[k] = nom);
  document.getElementById("rollar-jadval").innerHTML =
    '<thead><tr><th>Bo\'lim</th>' + rollar.map(r => '<th style="text-align:center">' + ROL_NOMI[r] + '</th>').join("") + '</tr></thead><tbody>' +
    bolimlar.map(b => '<tr><td><b>' + b.yorliq + '</b></td>' +
      rollar.map(r => {
        const bor = !ROL_RUXSAT[r] || ROL_RUXSAT[r].includes(b.kalit);
        return '<td style="text-align:center">' + (bor
          ? '<span style="display:inline-grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--brend-fon);color:var(--brend-quyuq)">' + ik("tasdiq") + '</span>'
          : '<span style="color:var(--xira)">—</span>') + '</td>';
      }).join("") + '</tr>').join("") + '</tbody>';
});
</script>
