      <div class="hs-amallar"><a class="tugma tugma-asosiy" href="kirish-soravi.html" data-huquq="yoz" data-tur="tashriflar-sorov"><svg class="ic"><use href="#ik-qoshish"/></svg>Kirish so'rovi</a></div></div>
  </div>
  <nav class="bolim-tablar" data-bir-qator aria-label="Bo'lim ichi"><a href="himoya.html">Monitoring markazi</a><a href="hodisalar.html">Hodisalar</a><a href="qurilmalar.html">Qurilmalar</a><a href="ruxsatlar.html" class="faol">Kirish nazorati</a><a href="korik-rejasi.html">Ko'rik rejasi</a><a href="qoriqlash.html">Qo'riqlash</a></nav>

<script>
(async () => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  const yuklandi = await new Promise(hal => MKB.sahifaYukla({
    joylar: {"tr-metrika": ["karta", 4], "tr-jadval": ["jadval", 8]},
    xato: "Tashriflar ro'yxatini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["TASHRIFLAR", "SHAXSLAR", "KIRISH_SOROVLARI"]);
      ulandi = true;
      hal(true);
    },
  }));
  if (!yuklandi) return;
  /* Yangi kiritilgan shaxs indeksda bo'lmasligi mumkin: to'plamdan ham qidiriladi */
  const shaxsTop = id => D.shaxs(id) || (D.SHAXSLAR || []).find(s => s.id === id) || null;

  const p = new URLSearchParams(location.search);
  const HOL = {kutilmoqda: ["Kutilmoqda", "chip-sariq"], obyektda: ["Obyektda", "chip-kok"], yakunlandi: ["Yakunlandi", "chip-kul"], "bekor qilingan": ["Bekor qilingan", "chip-kul"]};
  const bugun = D.sanaYoz(D.bugun());
  const hamma = MKB.doira(D.TASHRIFLAR || []);
  const kutSorov = MKB.doira(D.KIRISH_SOROVLARI || []).filter(s => s.holat === "kutilmoqda").length;
  const qatorlar = hamma.map(t => {
    const sh = shaxsTop(t.shaxsId);
    return {id: t.id, t, shaxs: sh ? sh.ism : "—", tashkilot: sh ? (sh.lavozim || "") + (sh.tashkilot ? ", " + sh.tashkilot : "") : "", obyekt: MKB.kn.obyektNomi(t.obyektId),
      maqsad: t.maqsad || "—", sana: t.sana || "", kirish: t.kirish || "", chiqish: t.chiqish || "", davomiylik: t.davomiylik || "", hamroh: t.hamroh || "", holat: (HOL[t.holat] || [t.holat])[0], kalit: t.holat};
  });
  const FILTR = {
    "": ["Jami tashriflar", () => true, "Barcha davr"],
    obyektda: ["Hozir obyektda", x => x.kalit === "obyektda", "Chiqish rasmiylashtirilmagan"],
    kutilmoqda: ["Rejalashtirilgan", x => x.kalit === "kutilmoqda", "Tasdiqlangan so'rov bo'yicha"],
    bugun: ["Bugun", x => x.sana === bugun, "Bugungi tashriflar"],
  };
  let filtr = FILTR[p.get("filtr")] ? p.get("filtr") : "";
  $("hs-meta").innerHTML = kutSorov ? '<a href="kirish-soravi.html"><b data-tarjimasiz>' + kutSorov + "</b> <span>ta so'rov tasdiq kutmoqda</span></a>" : '<b data-tarjimasiz>' + hamma.length + "</b> <span>ta tashrif</span>";
  tarjimaQil($("hs-meta"));
  if (!hamma.length){
    $("tr-metrika").hidden = true;
    $("tr-jadval").innerHTML = '<div class="karta">' + MKB.boshHolat("tashrif", "Tashrif qayd etilmagan", "Obyektga xaridor, baholovchi yoki pudratchi kelishi kirish so'rovi orqali rasmiylashtiriladi",
      '<a class="tugma tugma-asosiy tugma-kichik" href="kirish-soravi.html" data-huquq="yoz">' + ik("qoshish") + "Kirish so'rovi</a>") + "</div>";
    tarjimaQil($("tr-jadval")); return;
  }
  const cfg = {
    qatorlar: [], csvNomi: "tashriflar",
    qidiruv: ["shaxs", "obyekt", "maqsad", "id", "hamroh"], qidiruvYozuvi: "Shaxs, obyekt yoki maqsad",
    filtrlar: [{kalit: "maqsad", nom: "Maqsad", variantlar: [...new Set(qatorlar.map(x => x.maqsad))].sort()}, {kalit: "holat", nom: "Holat", variantlar: Object.values(HOL).map(h => h[0])}],
    ustunlar: [
      {kalit: "shaxs", nom: "Tashrifchi", chiz: x => "<b>" + esc(x.shaxs) + '</b><div class="kod-mono">' + esc(x.tashkilot) + "</div>", csv: x => x.shaxs},
      {kalit: "obyekt", nom: "Obyekt", chiz: x => '<a href="obyekt-himoya.html?id=' + encodeURIComponent(x.t.obyektId) + '">' + esc(x.obyekt) + "</a>"},
      {kalit: "maqsad", nom: "Maqsad"},
      {kalit: "sana", nom: "Sana", tur: "sana", chiz: x => '<span data-tarjimasiz>' + esc(x.sana) + "</span>" + (x.kirish ? '<div class="kod-mono" data-tarjimasiz>' + esc(x.kirish + (x.chiqish ? "–" + x.chiqish : "")) + "</div>" : "")},
      {kalit: "davomiylik", nom: "Davomiylik", chiz: x => (/^\d/.test(x.davomiylik || "") ? '<span data-tarjimasiz>' : "<span>") + esc(x.davomiylik || "—") + "</span>"},
      {kalit: "hamroh", nom: "Hamroh"},
      {kalit: "holat", nom: "Holat", chiz: x => { const h = HOL[x.kalit] || [x.holat, "chip-kul"]; return '<span class="chip chip-kichik ' + h[1] + '">' + h[0] + "</span>"; }},
    ],
    saralash: "sana", yonalish: -1,
    bosilganda: x => { location.href = (x.kalit === "yakunlandi" ? "tashrif-chiqish.html?id=" : "tashrif-jonli.html?id=") + encodeURIComponent(x.id); },
  };
  let jadval = null;
  function chiz(){
    $("tr-metrika").innerHTML = Object.keys(FILTR).map(k => {
      const son = qatorlar.filter(FILTR[k][1]).length;
      return '<button type="button" class="metrika' + (k === filtr ? " tanlangan" : "") + '" data-f="' + k + '" aria-pressed="' + (k === filtr) + '"><span class="m-yorliq">' + FILTR[k][0] +
        '</span><span class="m-qiymat"><span data-tarjimasiz>' + son + '</span></span><span class="m-izoh">' + FILTR[k][2] + "</span></button>";
    }).join("");
    tarjimaQil($("tr-metrika"));
    const r = qatorlar.filter(FILTR[filtr][1]);
    if (jadval) jadval.yangila(r); else { cfg.qatorlar = r; jadval = MKB.jadval("tr-jadval", cfg); }
  }
  $("tr-metrika").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filtr = b.dataset.f === filtr ? "" : b.dataset.f; chiz(); });
  chiz();
})();
</script>
</body>
</html>
