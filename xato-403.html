<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ruxsat yo'q</title>
<link rel="stylesheet" href="yadro/app.css?v=26082730">
<style>
.xato-sahna{min-height:100vh;display:grid;place-items:center;padding:26px;
  background:
    radial-gradient(900px 640px at 12% 0%, #FAEEE8 0%, transparent 58%),
    radial-gradient(800px 620px at 92% 16%, #EFEFF8 0%, transparent 56%),
    linear-gradient(150deg,#F8F1ED 0%,#F2F1F7 54%,#EFF4F1 100%)}
.xato-karta{text-align:center;max-width:500px;background:var(--oq);border-radius:30px;
  padding:44px 40px;box-shadow:var(--soya-suzuvchi)}
.xato-karta .kod{font:500 92px/1 var(--shrift-displey);letter-spacing:-.05em;color:var(--siyoh)}
.xato-karta .kod i{font-style:normal;color:var(--mint-matn)}
.xato-karta h1{font:500 24px/1.2 var(--shrift-displey);letter-spacing:-.03em;margin:14px 0 10px}
.xato-karta p{font-size:14.5px;color:var(--matn-3);line-height:1.6;margin-bottom:26px}
.xato-karta .tugmalar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body data-sahifa="kirish" data-ochiq="1">
<div class="xato-sahna"><div class="xato-karta">
  <div class="kod">4<i>0</i>3</div>
  <h1>Bu bo'limga kirish huquqi yo'q</h1>
  <p>Sahifa lavozimingiz vakolatidan tashqarida. Kerak bo'lsa, administratorga murojaat qiling.</p>
  <div class="tugmalar">
    <a class="tugma tugma-oq" href="javascript:history.back()">Orqaga qaytish</a>
    <a class="tugma tugma-asosiy" id="bosh-havola" href="kirish.html">Bosh sahifa</a>
  </div>
</div></div>
<script src="yadro/bino.js?v=26082730"></script>
<script src="malumot.js?v=26082730"></script>
<script src="malumot-qoshimcha.js?v=26082730"></script>
<script src="malumot-kengaytma.js?v=26082730"></script>
<script src="malumot-kirish.js?v=26082730"></script>
<script src="malumot-indeks.js?v=26082730"></script>
<script src="tarjima.js?v=26082730"></script>
<script src="yadro/ikonlar.js?v=26082730"></script>
<script src="yadro/daraxt.js?v=26082730"></script>
<script src="yadro/chizma.js?v=26082730"></script>
<script src="yadro/qollanma.js?v=26082730"></script>
<script src="yadro/api.js?v=26082730"></script>
<script src="yadro/app.js?v=26082730"></script>
<script>
document.addEventListener("mkb:tayyor", () => {
  const s = MKBapi.sessiya();
  if (s) document.getElementById("bosh-havola").href = rolBoshSahifasi(ROL_KALIT[s.rol] || "admin");
});
</script>
</body>
</html>
