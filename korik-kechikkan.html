<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Kechikkan ko'riklar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Ko'rik nazorati</span></div>
    <div class="hs-qator"><h1>Kechikkan ko'riklar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html">Reja</a><a href="korik-kalendar.html">Kalendar</a><a href="korik-tarixi.html">Tarix</a><a href="korik-kechikkan.html" class="faol">Kechikkanlar</a><a href="korik-marshrut.html">Marshrutlar</a></nav>
  <section class="karta"><div class="karta-bosh"><h2>Muddati o'tgan ko'riklar</h2><span class="soni" id="kk-soni"></span></div><div id="kk-royxat"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/chizma.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
function korikQatori(k){
  return '<a href="korik-akti.html?id=' + encodeURIComponent(k.id) + '" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--chiziq-2)">' +
    '<span style="width:38px;height:38px;border-radius:10px;background:' +
      (k.holat === "rejada" ? "var(--brend-fon)" : k.holat === "kechikkan" ? "var(--xavf-fon)" : "var(--yashil-fon)") +
      ';display:grid;place-items:center;color:' +
      (k.holat === "rejada" ? "var(--brend-quyuq)" : k.holat === "kechikkan" ? "var(--xavf-matn)" : "var(--yashil)") + '">' + ik("korik") + '</span>' +
    '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px">' + k.id + ' · ' + (k.tur || "Rejali") + '</b>' +
    '<span style="font-size:11.5px;color:var(--iz)">' + (k.obyektNomi || k.obyektId) + ' · ' + k.inspektor + '</span></span>' +
    '<span class="chip ' + (k.holat === "rejada" ? "chip-brend" : k.holat === "kechikkan" ? "chip-xavf" : "chip-yashil") + '">' + k.sana + '</span></a>';
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? (o.qisqa || o.nom) : id;
}
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("KORIKLAR");
  const kechikkan = r.filter(k => k.holat === "kechikkan")
    .concat(r.filter((k, i) => k.holat === "rejada" && i % 4 === 1).map(k => Object.assign({}, k, {holat: "kechikkan"})));
  kechikkan.forEach(k => k.obyektNomi = obyektNomi(k.obyektId));
  document.getElementById("kk-soni").textContent = kechikkan.length + " ta";
  document.getElementById("kk-royxat").innerHTML = kechikkan.length
    ? kechikkan.map(korikQatori).join("")
    : '<div class="bosh-holat">' + ik("tasdiq") + '<b>Kechikkan ko\'rik yo\'q</b><span>Barcha rejalar o\'z vaqtida bajarilmoqda</span></div>';
});
</script>
</body>
</html>
