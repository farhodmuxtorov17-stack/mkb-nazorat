<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Qarzdor mijozlar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082620">
</head>
<body data-sahifa="portfel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Qarzdor mijozlar</span></div>
    <div class="hs-qator"><h1>Qarzdor mijozlar</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><a class="tugma tugma-oq" href="muloqot-jurnali.html"><svg class="ic"><use href="#i-chat"/></svg>Muloqot jurnali</a><a class="tugma tugma-asosiy" href="restrukturizatsiya-arizasi.html"><svg class="ic"><use href="#i-qoshish"/></svg>Restrukturizatsiya</a></div></div>
  </div>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082620"></script>
<script src="malumot-qoshimcha.js?v=26082620"></script>
<script src="tarjima.js?v=26082620"></script>
<script src="yadro/ikonlar.js?v=26082620"></script>
<script src="yadro/daraxt.js?v=26082620"></script>
<script src="yadro/chizma.js?v=26082620"></script>
<script src="yadro/api.js?v=26082620"></script>
<script src="yadro/app.js?v=26082620"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const qatorlar = yoz.map(y => ({
    id: y.id, nom: y.mijoz.nom, belgi: y.mijoz.belgi, yur: y.mijoz.yur,
    raqam: y.mijoz.raqam, tel: y.mijoz.tel || "—", filial: y.filial,
    bosqich: y.bosqichNomi, kunlar: y.qarz.kunlar,
    qarzN: MKB.sonQiymat(y.qarzSon), qarzMatn: y.qarzMatn, obyekt: y.mulk.qisqa,
  }));
  document.getElementById("hs-meta").textContent = qatorlar.length + " ta qarzdor";
  MKB.jadval("jadval-joy", {
    qatorlar,
    qidiruv: ["nom", "raqam", "obyekt", "bosqich"],
    qidiruvYozuvi: "Mijoz, hujjat raqami...",
    filtrlar: [
      {kalit: "bosqich", nom: "Bosqich", variantlar: [...new Set(qatorlar.map(q => q.bosqich))]},
      {kalit: "filial", nom: "Filial", variantlar: [...new Set(qatorlar.map(q => q.filial))]},
    ],
    ustunlar: [
      {kalit: "nom", nom: "Mijoz", chiz: q =>
        '<span class="obyekt-katak"><span style="width:38px;height:38px;border-radius:99px;background:var(--siyoh);color:var(--brend);display:grid;place-items:center;font:700 12px var(--shrift);flex:none">' + q.belgi + '</span>' +
        '<span><span class="nom">' + q.nom + '</span><br><span class="sub">' + q.raqam + '</span></span></span>'},
      {kalit: "obyekt", nom: "Ta'minot obyekti"},
      {kalit: "bosqich", nom: "Bosqich", chiz: q => '<span class="chip chip-info">' + q.bosqich + '</span>'},
      {kalit: "kunlar", nom: "Kechikish", son: true, chiz: q =>
        '<span class="' + (q.kunlar > 180 ? 'chip chip-xavf' : 'chip') + '">' + q.kunlar + ' kun</span>'},
      {kalit: "qarzN", nom: "Qoldiq qarz", son: true, chiz: q => '<span class="pul">' + q.qarzMatn + '</span>'},
      {kalit: "amal", nom: "", saralash: false, chiz: q =>
        '<span class="amal-tugmalar">' +
        '<button type="button" class="amal-tugma" title="Telefon: ' + q.tel + '" data-toast="Telefon terilmoqda: ' + q.tel + '">' + ik("tel") + "</button>" +
        '<button type="button" class="amal-tugma" title="Xabar yuborish" data-toast="SMS oynasi ochildi: ' + q.nom.replace(/"/g, "") + '">' + ik("chat") + "</button>" +
        '<a class="amal-tugma" title="Kartochka" href="qarzdor.html?id=' + encodeURIComponent(q.id) + '">' + ik("ong") + "</a></span>"},
    ],
    saralash: "qarzN",
    bosilganda: q => location.href = "qarzdor.html?id=" + encodeURIComponent(q.id),
  });
  const sy = MKB.jadval; /* saralashni kamayish tartibiga o'tkazish */
  const th = document.querySelector('th[data-kalit="qarzN"]');
  if (th) th.click();
});
</script>
</body>
</html>
