<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Sug'urta polisi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.sp-muddat{height:8px;border-radius:99px;background:var(--plitka);overflow:hidden;margin:14px 0 6px}
.sp-muddat i{display:block;height:100%;border-radius:99px;background:var(--siyoh)}
.sp-muddat-yorliq{display:flex;justify-content:space-between;font-size:12.5px;color:var(--matn-3)}
#sp-ildiz > .skelet-royxat,#sp-ildiz > .xato-holat{background:var(--oq);border-radius:var(--r-karta);padding:24px;box-shadow:var(--soya)}
</style>
</head>
<body data-sahifa="qiymat">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="baholash.html">Qiymat, zaxira va sug'urta</a><span class="ajratgich">/</span><a href="sugurta.html">Sug'urta polislari</a><span class="ajratgich">/</span><span>Polis</span></div>
    <div class="hs-qator"><h1>Sug'urta polisi</h1><span class="hs-meta" id="hs-meta" data-tarjimasiz>—</span>
      <div class="hs-amallar" id="sp-amallar"></div></div>
  </div>
  <div id="sp-ildiz" class="ustun"><section class="karta"><div class="skelet-royxat" aria-busy="true"></div></section></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, el = id => document.getElementById(id);
  const ildiz = el("sp-ildiz");
  const b = (() => { const x = D.bugun(); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); })();
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const id = new URLSearchParams(location.search).get("id");
  const TUR = {mulk: "Mol-mulk", OSAGO: "OSAGO", XICHO: "XICHO"};
  const DAVO = {"topshirilgan": ["Topshirilgan", "chip-kok"], "korib chiqilmoqda": ["Ko'rib chiqilmoqda", "chip-sariq"], "tolangan": ["To'langan", "chip-yashil"], "rad etilgan": ["Rad etilgan", "chip-xavf"]};

  function chiz(){
    const p = id ? (D.SUGURTALAR || []).find(x => x.id === id) : null;
    if (!p || !MKB.doira([p]).length){
      ildiz.innerHTML = '<section class="karta">' + MKB.boshHolat("sugurta", "Polis topilmadi", "Polisni ro'yxatdan tanlang",
        '<a class="tugma tugma-asosiy" href="sugurta.html" style="margin-top:12px">Sug\'urta polislari</a>') + "</section>";
      tarjimaQil(ildiz); return;
    }
    const y = D.topish(p.obyektId) || D.OBYEKT_INDEKS[p.obyektId] || {id: p.obyektId};
    const bosh = D.sanaOqi(p.boshlanish), tug = D.sanaOqi(p.tugash);
    const qoldi = tug ? D.kunFarqi(b, tug) : null;
    const keyingi = (D.SUGURTALAR || []).find(x => x.id !== p.id && x.obyektId === p.obyektId && x.polisTuri === p.polisTuri && D.sanaOqi(x.tugash) > tug);
    const holat = keyingi ? ["Yangilangan", "chip-kul"] : qoldi == null ? ["Amalda", "chip-yashil"] : qoldi < 0 ? ["Muddati tugagan", "chip-xavf"] : qoldi <= 30 ? ["30 kunda tugaydi", "chip-sariq"] : ["Amalda", "chip-yashil"];
    const yoza = MKB.huquq("qiymat", "yoz");
    const bozor = y.qiymat && y.qiymat.bozor;
    const davolar = (D.SUGURTA_DAVOLARI || []).filter(d => d.polisId === p.id).sort((a, c) => D.sanaOqi(c.sana) - D.sanaOqi(a.sana));
    const tolov = (D.XARAJATLAR || []).filter(x => x.obyektId === p.obyektId && x.toifa === "sugurta" && (x.izoh === "Polis " + p.id || (x.summa === p.mukofot && x.sana === p.boshlanish)));
    const amalda = !keyingi && qoldi != null && qoldi >= 0;
    const ulush = bosh && tug ? Math.max(0, Math.min(100, Math.round(D.kunFarqi(bosh, b) / Math.max(1, D.kunFarqi(bosh, tug)) * 100))) : 0;

    el("hs-meta").textContent = p.polis || p.id;
    el("sp-amallar").innerHTML = yoza && !keyingi ? '<a class="tugma tugma-asosiy" data-sayohat="yangilash" href="sugurta-yangilash.html?id=' + encodeURIComponent(p.id) + '">' + ik("yangilash") + "<span>Polisni yangilash</span></a>"
      : keyingi ? '<a class="tugma tugma-oq" href="sugurta-polis.html?id=' + encodeURIComponent(keyingi.id) + '">' + ik("strelka") + "<span>Yangi polisni ochish</span></a>" : "";

    ildiz.innerHTML =
      '<div class="tor-2">' +
        '<section class="karta"><div class="karta-bosh"><h2><span>' + esc(TUR[p.polisTuri] || p.polisTuri || "") + '</span> <span class="kod-mono" data-tarjimasiz>' + esc(p.polis || p.id) + '</span></h2><span class="chip chip-kichik ' + holat[1] + '">' + esc(holat[0]) + "</span></div>" +
          '<div class="qator" style="margin-top:-6px">' + MKB.obyektSurati(y, {kichik: true, sinf: "media"}) +
            '<span class="matn"><b><a href="obyekt.html?id=' + encodeURIComponent(p.obyektId) + '">' + esc(y.qisqa || y.nom || p.obyektId) + '</a></b><span><span class="kod-mono" data-tarjimasiz>' + esc(p.obyektId) + "</span> · <span>" + esc(y.hudud || "") + "</span></span></span></div>" +
          (bosh && tug ? '<div class="sp-muddat"><i style="width:' + ulush + '%"></i></div><div class="sp-muddat-yorliq"><span data-tarjimasiz>' + esc(p.boshlanish) + "</span><span>" +
            (qoldi >= 0 ? '<span data-tarjimasiz>' + qoldi + "</span> <span>kun qoldi</span>" : "<span>Muddati tugagan</span>") + '</span><span data-tarjimasiz>' + esc(p.tugash) + "</span></div>" : "") +
          '<dl class="malumot-royxat" style="margin-top:14px">' +
            "<dt>Sug'urta kompaniyasi</dt><dd>" + esc(p.kompaniya || "—") + "</dd>" +
            "<dt>Sug'urta summasi</dt><dd data-tarjimasiz>" + esc(MKB.pul(p.summa)) + "</dd>" +
            "<dt>Mukofot</dt><dd data-tarjimasiz>" + esc(MKB.pul(p.mukofot)) + "</dd>" +
            "<dt>Mukofot to'lovi</dt><dd>" + (tolov.length ? tolov.map(x => '<span class="chip chip-kichik ' + (x.holat === "tolangan" ? "chip-yashil" : "chip-sariq") + '">' + (x.holat === "tolangan" ? "To'langan" : "To'lanmagan") + '</span> <span class="kod-mono" data-tarjimasiz>' + esc(x.id) + "</span>").join("<br>") : "<span>Xarajatlar reyestrida topilmadi</span>") + "</dd>" +
            (p.polisTuri === "mulk" ? "<dt>Bozor qiymati</dt><dd>" + (bozor ? '<span data-tarjimasiz>' + esc(MKB.pul(bozor)) + "</span>" + (p.summa < bozor ? ' <span class="chip chip-kichik chip-sariq">sug\'urta summasi past</span>' : "") : "<span>Baholanmagan</span>") + "</dd>" : "") +
          "</dl></section>" +
        '<div class="ustun">' +
          '<section class="karta" data-sayohat="davolar"><div class="karta-bosh"><h2>Da\'volar</h2><span class="soni" data-tarjimasiz>' + davolar.length + " ta</span>" +
            (yoza && amalda ? '<button type="button" class="tugma tugma-kichik tugma-oq" id="sp-davo" data-yozadi style="margin-left:auto">' + ik("qoshish") + "<span>Da'vo qo'shish</span></button>" : "") + "</div>" +
            (davolar.length ? davolar.map(d => {
              const h = (D.HODISALAR || []).find(x => x.id === d.hodisaId), s = DAVO[d.holat] || [d.holat || "—", "chip-kul"];
              return '<div class="qator"><span class="belgi lavanda">' + ik("xavf") + '</span><span class="matn"><b>' + (h ? '<a href="hodisa.html?id=' + encodeURIComponent(h.id) + '">' + esc(h.hodisa) + "</a>" : esc(d.hodisaId || "Hodisa ko'rsatilmagan")) + "</b>" +
                '<span><span class="kod-mono" data-tarjimasiz>' + esc(d.id) + "</span> · <span data-tarjimasiz>" + esc(d.sana) + "</span></span></span>" +
                '<span class="ong"><span class="pul" data-tarjimasiz>' + esc(MKB.pul(d.summa)) + '</span><span class="chip chip-kichik ' + s[1] + '">' + esc(s[0]) + "</span>" +
                (yoza && ["topshirilgan", "korib chiqilmoqda"].indexOf(d.holat) >= 0 ? '<button type="button" class="tugma tugma-kichik tugma-oq" data-tolandi="' + esc(d.id) + '" data-yozadi>To\'landi</button>' +
                  '<button type="button" class="tugma tugma-kichik tugma-oq" data-rad="' + esc(d.id) + '" data-yozadi>Rad etildi</button>' : "") + "</span></div>";
            }).join("") : MKB.boshHolat("sugurta", "Da'vo yo'q")) + "</section>" +
          '<section class="karta"><div class="karta-bosh"><h2>Polis nusxasi</h2></div><div id="sp-fayl"></div></section>' +
        "</div></div>";

    /* Polis fayli */
    (async () => {
      const joy = el("sp-fayl");
      const f = await MKBapi.fayl.royxat({yozuvId: p.id});
      joy.innerHTML = f.length ? f.map(x => '<div class="qator"><span class="belgi mint">' + ik("hujjat") + '</span><span class="matn"><b>' + esc(x.nom) + '</b><span data-tarjimasiz>' + esc(x.yuklangan || "") + "</span></span>" +
        '<span class="ong"><button type="button" class="tugma tugma-kichik tugma-oq" data-fayl="' + esc(x.id) + '">' + ik("yuklab") + "<span>Yuklab olish</span></button></span></div>").join("") : "";
      if (yoza){
        const z = document.createElement("div"); z.id = "sp-yukla"; joy.appendChild(z);
        MKB.faylMaydon(z, {obyektId: p.obyektId, kolleksiya: "SUGURTALAR", yozuvId: p.id, accept: ".pdf,.jpg,.jpeg,.png", sarlavha: "Polis nusxasini yuklang",
          yuklandi(){ MKB.toast("Polis nusxasi saqlandi"); chiz(); }});
      } else if (!f.length) joy.innerHTML = MKB.boshHolat("hujjat", "Nusxa yuklanmagan");
      joy.querySelectorAll("[data-fayl]").forEach(bt => bt.addEventListener("click", async () => {
        if (!(await MKBapi.fayl.yuklab(bt.dataset.fayl))) MKB.toast("Fayl bank tarmog'ida saqlanadi", "info");
      }));
      tarjimaQil(joy);
    })();

    const db = el("sp-davo");
    if (db) db.addEventListener("click", () => {
      const hodisalar = (D.HODISALAR || []).filter(h => h.obyektId === p.obyektId && !davolar.some(d => d.hodisaId === h.id));
      MKB.modal("Sug'urta da'vosi",
        '<form class="forma-tor" id="sp-df" novalidate>' +
          '<div class="maydon keng"><label class="maydon-yorliq" for="sp-h">Hodisa <b>*</b></label><div class="kirish"><select id="sp-h" name="hodisa" required data-xato="Da\'vo qaysi hodisa bo\'yicha ekanini tanlang"><option value="">Tanlang</option>' +
            hodisalar.map(h => '<option value="' + esc(h.id) + '">' + esc(h.vaqt.slice(0, 10) + " · " + h.hodisa) + "</option>").join("") + "</select></div>" +
            (hodisalar.length ? "" : '<span class="maydon-izoh">Bu obyektda qayd etilgan hodisa yo\'q. Avval hodisani qayd eting.</span>') + "</div>" +
          '<div class="maydon"><label class="maydon-yorliq" for="sp-s">Talab summasi <b>*</b></label><div class="kirish"><input id="sp-s" name="summa" type="text" data-format="pul" min="0.01" max="' + esc(p.summa) + '" required data-xato="Talab summasini kiriting"></div>' +
            '<span class="maydon-izoh"><span>Sug\'urta summasi:</span> <span data-tarjimasiz>' + esc(MKB.pul(p.summa)) + "</span></span></div>" +
          '<div class="maydon"><label class="maydon-yorliq" for="sp-sana">Topshirilgan sana <b>*</b></label><div class="kirish"><input id="sp-sana" name="sana" type="date" required max="' + iso(b) + '" value="' + iso(b) + '"></div></div>' +
        "</form>",
        {okMatn: "Da'voni saqlash", async ok(pr){
          const r = MKB.formaTekshir(pr.querySelector("#sp-df"), {
            summa: v => Number.isFinite(v) && v > p.summa ? "Talab sug'urta summasidan oshmasligi kerak" : true,
          });
          if (!r) return false;
          const q = r.qiymatlar, sana = D.sanaOqi(q.sana);
          const nid = await MKB.keyingiId("SUGURTA_DAVOLARI", "SD-" + b.getFullYear() + "/", 4);
          await MKBapi.yangi("SUGURTA_DAVOLARI", {id: nid, polisId: p.id, hodisaId: q.hodisa, obyektId: p.obyektId, sana: D.sanaYoz(sana),
            summa: Math.round(q.summa * 100) / 100, holat: "korib chiqilmoqda"});
          MKB.toast("Da'vo " + nid + " saqlandi");
          chiz();
        }});
    });
    /* Da'vo natijasi pulga ta'sir qiladi: to'lov summasi forma orqali, rad etish tasdiqlash oynasi orqali */
    ildiz.querySelectorAll("[data-tolandi]").forEach(bt => bt.addEventListener("click", () => {
      const d = davolar.find(x => x.id === bt.dataset.tolandi);
      MKB.modal("Da'vo bo'yicha to'lovni qayd etish",
        '<p class="tasdiqla-matn" style="margin:0 0 14px"><span>Sug\'urta kompaniyasi da\'vo bo\'yicha to\'lov qildi. Summa da\'vo yozuviga saqlanadi va keyin o\'zgartirilmaydi.</span></p>' +
        '<dl class="malumot-royxat" style="margin-bottom:14px"><dt>Da\'vo</dt><dd class="kod-mono" data-tarjimasiz>' + esc(d.id) + "</dd><dt>Talab summasi</dt><dd data-tarjimasiz>" + esc(MKB.pul(d.summa)) + "</dd>" +
          "<dt>Kompaniya</dt><dd>" + esc(p.kompaniya || "—") + "</dd></dl>" +
        '<form class="forma-tor" id="sp-nf" novalidate><div class="maydon keng"><label class="maydon-yorliq" for="sp-ns">To\'langan summa <b>*</b></label>' +
          '<div class="kirish"><input id="sp-ns" name="summa" type="text" data-format="pul" min="0.01" max="' + esc(d.summa) + '" required data-xato="To\'langan summani kiriting" value="' + esc(String(d.summa).replace(".", ",")) + '"></div></div></form>',
        {okMatn: "To'lovni qayd etish", async ok(pr){
          const r = MKB.formaTekshir(pr.querySelector("#sp-nf"), {summa: v => Number.isFinite(v) && v > d.summa ? "To'lov talab summasidan oshmasin" : true});
          if (!r) return false;
          await MKBapi.yangilash("SUGURTA_DAVOLARI", d.id, {holat: "tolangan", summa: Math.round(r.qiymatlar.summa * 100) / 100});
          MKB.toast("Da'vo " + d.id + " bo'yicha to'lov qayd etildi");
          chiz();
        }});
    }));
    ildiz.querySelectorAll("[data-rad]").forEach(bt => bt.addEventListener("click", () => {
      const d = davolar.find(x => x.id === bt.dataset.rad);
      MKB.tasdiqla({
        sarlavha: "Da'vo rad etilganini qayd etish",
        matn: "Sug'urta kompaniyasi da'voni rad etdi. Da'vo yopiladi, to'lov kutilmaydi.",
        tafsilot: [["Da'vo", {matn: d.id, tarjimasiz: true}], ["Talab summasi", MKB.pul(d.summa)], ["Kompaniya", {matn: p.kompaniya || "—", tarjimasiz: true}]],
        sabab: {majburiy: false, maks: 500, yorliq: "Rad etish sababi", namuna: "Kompaniya javobidagi asos"},
        okMatn: "Rad etilgan deb belgilash", bekorMatn: "Orqaga",
        bajar: ({sabab}) => MKBapi.yangilash("SUGURTA_DAVOLARI", d.id, Object.assign({holat: "rad etilgan"}, sabab ? {izoh: sabab} : {})),
      }).then(r => { if (r){ MKB.toast("Da'vo " + d.id + " rad etilgan deb belgilandi"); chiz(); } });
    }));
    tarjimaQil(document.querySelector(".kontent"));
  }
  MKB.sahifaYukla({joylar: {"sp-ildiz": ["qator", 6]}, xato: "Polis ma'lumotini yuklab bo'lmadi", ish: async () => {
    await MKB.kolYukla(["SUGURTALAR", "SUGURTA_DAVOLARI", "HODISALAR", "XARAJATLAR", "FAYLLAR"]);
    chiz();
  }});
})();
</script>
</body>
</html>
