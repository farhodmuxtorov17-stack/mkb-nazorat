<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKB — Xonalar va qavatlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mkb.css">
<style>
/* ---- Xonalar va qavatlar (ekran 16) ---- */
.orqa-tugma{width:48px;height:48px;border-radius:14px;background:var(--karta);box-shadow:var(--soya);display:grid;place-items:center;color:#1C2836;flex:none}
.orqa-tugma .ic{width:20px;height:20px}
.xq-grid{display:grid;grid-template-columns:335px minmax(0,1fr) 385px;gap:18px;align-items:start}

.obyekt-karta{display:flex;align-items:center;gap:14px}
.obyekt-karta img{width:76px;height:64px;object-fit:cover;border-radius:12px;outline:1px solid rgba(23,26,31,.06);outline-offset:-1px}
.obyekt-karta b{display:block;font-size:17px;font-weight:750}
.obyekt-karta span{display:block;font-size:13px;color:var(--matn-4);margin-top:2px}

.stat-royxat .band{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #F1F4F8}
.stat-royxat .band:last-child{border-bottom:none}
.stat-royxat .tile{width:44px;height:44px;border-radius:12px;background:#E7EEF4;color:#0F5392;display:grid;place-items:center;flex:none;box-shadow:var(--chuqur-tile)}
.stat-royxat .tile .ic{width:20px;height:20px}
.stat-royxat .yorliq{font-size:13px;color:var(--matn-3)}
.stat-royxat b{display:block;font-size:18px;font-weight:750;margin-top:1px}
.stat-royxat b .yashil{color:#268030}
.stat-royxat b.yashil{color:#268030}

.qavatlar-karta h3{font-size:16.5px;font-weight:750;margin-bottom:8px}
.qavat-band{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:12px;font-size:14px;transition:background var(--tez);
}
.qavat-band:hover{background:#F3F6FA}
.qavat-band.faol{background:#E3EFFA;box-shadow:inset 0 0 0 1px #99C3EB}
.qavat-band .ic{width:18px;height:18px;color:#56626E}
.qavat-band.faol .ic{color:#0B4478}
.qavat-band b{font-weight:700;color:#1C2836}
.qavat-band .tur{color:var(--matn-3)}
.qavat-band .nuqta{margin-left:auto;width:8px;height:8px;border-radius:99px;background:#0F5392;opacity:0}
.qavat-band.faol .nuqta{opacity:1}

/* Markaz */
.sahna-karta h3{font-size:16.5px;font-weight:750}
.sahna-bosh{display:flex;align-items:center;margin-bottom:12px}
.sahna-bosh .rejim{margin-left:auto;display:flex;gap:6px}
.sahna-bosh .rejim button{height:38px;min-width:48px;padding:0 13px;border-radius:10px;font-size:13.5px;font-weight:700;color:#515F6D;border:1px solid var(--kirish-chiziq);transition:all var(--tez)}
.sahna-bosh .rejim button.aktiv{background:#0F5392;border-color:#0F5392;color:#fff}
.qavat-sahna{position:relative;border-radius:16px;background:linear-gradient(180deg,#FDFDFC,#F4F5F2);overflow:hidden;min-height:480px}
.qavat-sahna img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:16px 100px 16px 150px;transition:filter var(--tez)}
.qavat-sahna img.sxematik{filter:grayscale(.85) contrast(1.15) brightness(1.08)}
.qavat-yorliq{
  position:absolute;left:16px;display:flex;flex-direction:column;text-align:left;
  padding:8px 13px;border-radius:11px;background:transparent;transition:background var(--tez);
}
.qavat-yorliq:hover{background:#fff;box-shadow:var(--soya-pin)}
.qavat-yorliq b{font-size:13.5px;font-weight:750;color:#1C2836}
.qavat-yorliq span{font-size:12px;color:var(--matn-4)}
.qavat-yorliq.faol{background:#E3EFFA;box-shadow:0 0 0 1.5px #7FB4E0, var(--soya-pin)}
.qavat-yorliq.faol::after{
  content:"";position:absolute;left:100%;top:50%;width:34px;height:2px;
  background:repeating-linear-gradient(90deg,#0F5392 0 5px,transparent 5px 9px);
}
.xonalar-karta{margin-top:16px}
.xonalar-karta h3{font-size:16.5px;font-weight:750;margin-bottom:12px}
.xona-torlar{display:flex;gap:13px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.xona-torlar::-webkit-scrollbar{display:none}
.xona-k{flex:0 0 150px;text-align:left;border-radius:13px}
.xona-k img{width:150px;height:104px;object-fit:cover;border-radius:13px;outline:1px solid rgba(23,26,31,.07);outline-offset:-1px;transition:transform var(--tez)}
.xona-k.faol img{outline:2px solid #0F5392;outline-offset:0}
.xona-k:hover img{transform:scale(1.02)}
.xona-k b{display:block;font-size:13.5px;font-weight:700;margin-top:8px}
.xona-k span{font-size:12px;color:var(--matn-4)}
.xona-strelka{flex:none;align-self:center;width:38px;height:38px;border-radius:99px;background:var(--karta);box-shadow:var(--soya-pin);display:grid;place-items:center;color:#2C3A49}
.xona-strelka .ic{width:16px;height:16px}

/* O'ng panel */
.xp-bosh{display:flex;align-items:center;gap:10px}
.xp-bosh h2{font-size:20px;font-weight:750}
.xp-bosh .chip{margin-left:auto}
.xp-yop{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#515F6D;flex:none}
.xp-yop:hover{background:#EEF2F7}
.xp-blok{margin-top:14px}
.xp-blok h4{font-size:15px;font-weight:750;margin-bottom:4px}
.xp-qator{display:flex;align-items:center;gap:11px;padding:9.5px 0;border-bottom:1px solid #F1F4F8;font-size:13.5px}
.xp-qator:last-child{border-bottom:none}
.xp-qator .ic{width:17px;height:17px;color:#56626E}
.xp-qator .yorliq{color:var(--matn-3)}
.xp-qator b{margin-left:auto;font-weight:650;text-align:right}
.xp-qator b .nuqta{display:inline-block;width:7px;height:7px;border-radius:99px;background:#3AAA3E;margin-right:6px;vertical-align:1px}
.jihoz-tugma{width:100%;height:46px;margin-top:10px;border-radius:12px;border:1px solid var(--kirish-chiziq);display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;font-weight:700;transition:background var(--tez)}
.jihoz-tugma:hover{background:#F3F6FA}
.jihoz-tugma .ic{width:15px;height:15px}
.xp-tahrir{width:100%;height:52px;margin-top:16px;border-radius:13px;border:1px solid var(--kirish-chiziq);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14.5px;font-weight:700;transition:background var(--tez)}
.xp-tahrir:hover{background:#F3F6FA}
.xp-tahrir .ic{width:17px;height:17px}
@media (max-width:1600px){.xq-grid{grid-template-columns:300px minmax(0,1fr)}.xq-grid > aside:last-child{grid-column:1/-1}}
@media (max-width:1200px){.xq-grid{grid-template-columns:minmax(0,1fr)}.qavat-sahna img{padding:16px 20px}}
</style>
</head>
<body data-sahifa="obyektlar">

<div class="app">
<aside class="sidebar" data-shell-sidebar></aside>

<div class="asosiy">
  <header class="topbar" data-shell-topbar></header>

  <main class="kontent">
    <div class="sahifa-qator">
      <a class="orqa-tugma" href="obyekt.html?id=green-tower" aria-label="Orqaga"><svg class="ic"><use href="#i-chap"/></svg></a>
      <h1>Xonalar va qavatlar</h1>
      <div class="sahifa-harakat" style="position:relative">
        <button class="tugma tugma-asos" id="hisobot-tugma">
          <svg class="ic"><use href="#i-yuklab"/></svg>Hisobot yaratish
          <svg class="ic" style="width:16px;height:16px"><use href="#i-past"/></svg>
        </button>
        <div class="menyu-popover" id="hisobot-menyu" style="top:calc(100% + 8px);right:0">
          <button type="button" data-f="Qavatlar bo'yicha PDF"><svg class="ic"><use href="#i-hujjat"/></svg>Qavatlar bo'yicha PDF</button>
          <button type="button" data-f="Xonalar ro'yxati XLSX"><svg class="ic"><use href="#i-hisobot"/></svg>Xonalar ro'yxati XLSX</button>
        </div>
      </div>
    </div>

    <div class="xq-grid">

      <!-- Chap ustun -->
      <div style="display:flex;flex-direction:column;gap:18px">
        <a class="karta obyekt-karta" href="obyekt.html?id=green-tower">
          <img src="assets/bino_tower.png" alt="Navruz Plaza">
          <span><b>Navruz Plaza</b><span>GT-2024-001</span></span>
        </a>

        <div class="karta stat-royxat">
          <div class="band">
            <span class="tile"><svg class="ic"><use href="#i-panel"/></svg></span>
            <span><span class="yorliq">Jami xonalar</span><b>124</b></span>
          </div>
          <div class="band">
            <span class="tile"><svg class="ic"><use href="#i-uy"/></svg></span>
            <span><span class="yorliq">Band xonalar</span><b>86 <span class="yashil">(69%)</span></b></span>
          </div>
          <div class="band">
            <span class="tile"><svg class="ic"><use href="#i-kengay"/></svg></span>
            <span><span class="yorliq">Mavjud maydon</span><b>4 250 m²</b></span>
          </div>
          <div class="band">
            <span class="tile"><svg class="ic"><use href="#i-qavat"/></svg></span>
            <span><span class="yorliq">Tanlangan qavat</span><b class="yashil" id="stat-qavat">3-qavat</b></span>
          </div>
        </div>

        <div class="karta qavatlar-karta">
          <h3>Qavatlar</h3>
          <div id="qavatlar"></div>
        </div>
      </div>

      <!-- Markaz -->
      <div class="karta sahna-karta">
        <div class="sahna-bosh">
          <h3>Binoning 3D ko'rinishi</h3>
          <div class="rejim" role="group">
            <button class="aktiv" id="rj-3d">3D</button>
            <button id="rj-2d">2D</button>
            <button data-toast="To'liq ekran" aria-label="To'liq ekran"><svg class="ic" style="width:16px;height:16px"><use href="#i-kengay"/></svg></button>
          </div>
        </div>
        <div class="qavat-sahna">
          <img id="qavat-rasm" src="assets/bino_qavatlar.png" alt="Bino qavatlari kesim ko'rinishi">
          <button class="qavat-yorliq" style="top:6%" data-q="5"><b>5-qavat</b><span>Penthouse</span></button>
          <button class="qavat-yorliq" style="top:23%" data-q="4"><b>4-qavat</b><span>Ofis qavati</span></button>
          <button class="qavat-yorliq faol" style="top:41%" data-q="3"><b>3-qavat</b><span>Ofis qavati</span></button>
          <button class="qavat-yorliq" style="top:58%" data-q="2"><b>2-qavat</b><span>Savdo qavati</span></button>
          <button class="qavat-yorliq" style="top:74%" data-q="1"><b>1-qavat</b><span>Kirish va lobby</span></button>
          <button class="qavat-yorliq" style="top:89%" data-q="-1"><b>-1-qavat</b><span>Texnik qavat</span></button>
        </div>

        <div class="xonalar-karta">
          <h3 id="xonalar-sarlavha">Xonalar (3-qavat)</h3>
          <div style="display:flex;gap:13px;align-items:stretch">
            <div class="xona-torlar" id="xona-torlar"></div>
            <button class="xona-strelka" id="xona-keyingi" aria-label="Keyingi xonalar"><svg class="ic"><use href="#i-ong"/></svg></button>
          </div>
        </div>
      </div>

      <!-- O'ng panel -->
      <aside class="karta" id="xona-panel"></aside>
    </div>
  </main>
</div>
</div>

<script src="malumot.js"></script>
<script src="tarjima.js"></script>
<script src="mkb.js"></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{

const QAVATLAR = [
  ["5","Penthouse"],["4","Ofis qavati"],["3","Ofis qavati"],["2","Savdo qavati"],["1","Kirish va lobby"],["-1","Texnik qavat"]
];
let faolQavat = "3";

function qavatChiz(){
  document.getElementById("qavatlar").innerHTML = QAVATLAR.map(q=>`
    <button class="qavat-band ${q[0]===faolQavat?"faol":""}" data-q="${q[0]}">
      <svg class="ic"><use href="#i-soat"/></svg>
      <b>${q[0]}-qavat</b><span class="tur">${q[1]}</span>
      <span class="nuqta"></span>
    </button>`).join("");
  document.querySelectorAll(".qavat-band").forEach(b=>{
    b.addEventListener("click", ()=>qavatTanla(b.dataset.q));
  });
}
function qavatTanla(q){
  faolQavat = q;
  faolXona = 0;
  document.getElementById("stat-qavat").textContent = q+"-qavat";
  qavatChiz();
  document.querySelectorAll(".qavat-yorliq").forEach(y=>y.classList.toggle("faol", y.dataset.q===q));
  document.getElementById("xonalar-sarlavha").textContent = `Xonalar (${q}-qavat)`;
  xonalarChiz();
  const royxat = joriyXonalar();
  const panel = document.getElementById("xona-panel");
  if (royxat.length){ panel.style.display = ""; panelChiz(); }
  else { panel.style.display = "none"; }
  MKB.toast(`${q}-qavat tanlandi`, "i-qavat");
}
document.querySelectorAll(".qavat-yorliq").forEach(y=>{
  y.addEventListener("click", ()=>qavatTanla(y.dataset.q));
});

const XONALAR = [
  {nom:"Ofis 301", qavat:"3", maydon:"120 m²", rasm:"assets/xona_ofis.png", tur:"Ofis", sigim:"12 kishi", holat:"Band",
   egasi:"SecurTech Servis MChJ", shartnoma:"NPR-2024-0566", muddat:"26-may, 2025",
   jihozlar:[["Stol","12 ta"],["Kreslo","12 ta"],["Kompyuter","12 ta"],["Printer","2 ta"],["Konditsioner","2 ta"]]},
  {nom:"Konferensiya zali", qavat:"4", maydon:"60 m²", rasm:"assets/xona_konf.png", tur:"Konferensiya", sigim:"24 kishi", holat:"Bron qilinadi",
   egasi:"Umumiy foydalanish", shartnoma:"—", muddat:"—",
   jihozlar:[["Stol","1 ta"],["Kreslo","24 ta"],["Proyektor","1 ta"],["Video panel","1 ta"],["Konditsioner","2 ta"]]},
  {nom:"Arxiv xonasi", qavat:"-1", maydon:"25 m²", rasm:"assets/xona_arxiv.png", tur:"Arxiv", sigim:"—", holat:"Faol",
   egasi:"MKB ma'muriyati", shartnoma:"—", muddat:"—",
   jihozlar:[["Javon","16 ta"],["Seyf","2 ta"],["Namlik sensori","2 ta"]]},
  {nom:"Server xonasi", qavat:"-1", maydon:"18 m²", rasm:"assets/xona_server.png", tur:"Texnik", sigim:"—", holat:"Faol",
   egasi:"IT bo'limi", shartnoma:"—", muddat:"—",
   jihozlar:[["Server shkafi","6 ta"],["UPS","4 ta"],["Sovutish bloki","2 ta"]]},
  {nom:"Savdo maydoni", qavat:"2", maydon:"240 m²", rasm:"assets/xona_savdo.png", tur:"Savdo", sigim:"120 kishi", holat:"Band",
   egasi:"«Turon Retail» MChJ", shartnoma:"NPR-2024-0312", muddat:"14-iyun, 2025",
   jihozlar:[["Peshtaxta","8 ta"],["Javon","32 ta"],["Kassa","4 ta"],["Konditsioner","4 ta"]]}
];
let faolXona = 0;

function joriyXonalar(){ return XONALAR.filter(x=>x.qavat===faolQavat); }

function xonalarChiz(){
  const royxat = joriyXonalar();
  if (faolXona >= royxat.length) faolXona = 0;
  document.getElementById("xona-torlar").innerHTML = royxat.length ? royxat.map((x,i)=>`
    <button class="xona-k ${i===faolXona?"faol":""}" data-i="${i}">
      <img src="${x.rasm}" alt="${x.nom}">
      <b>${x.nom}</b><span>${x.maydon}</span>
    </button>`).join("") : `<div style="padding:24px;color:var(--matn-4);font-size:13.5px">${faolQavat}-qavatda ro'yxatga olingan xona yo'q</div>`;
  document.querySelectorAll(".xona-k").forEach(k=>{
    k.addEventListener("click", ()=>{
      faolXona = +k.dataset.i;
      document.getElementById("xona-panel").style.display = "";
      xonalarChiz(); panelChiz();
    });
  });
}
function panelChiz(){
  const x = joriyXonalar()[faolXona];
  if (!x) return;
  document.getElementById("xona-panel").innerHTML = `
    <div class="xp-bosh">
      <h2>${x.nom}</h2>
      <span class="chip ${x.holat==="Band"?"chip-asos":x.holat==="Faol"?"chip-asos":"chip-kok"}">${x.holat}</span>
      <button class="xp-yop" id="xp-yop" aria-label="Yopish"><svg class="ic" style="width:18px;height:18px"><use href="#i-yopish"/></svg></button>
    </div>

    <div class="xp-blok">
      <h4>Umumiy ma'lumotlar</h4>
      <div class="xp-qator"><svg class="ic"><use href="#i-uy"/></svg><span class="yorliq">Xona turi</span><b>${x.tur}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-kengay"/></svg><span class="yorliq">Maydon</span><b>${x.maydon}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-tashrif"/></svg><span class="yorliq">Sig'im</span><b>${x.sigim}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-qavat"/></svg><span class="yorliq">Qavat</span><b>${x.qavat}-qavat</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-info"/></svg><span class="yorliq">Holat</span><b><span class="nuqta" style="background:${x.holat==="Band"||x.holat==="Faol"?"#3AAA3E":"#2F6BCF"}"></span>${x.holat}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-foyd"/></svg><span class="yorliq">Egasi / Ijarachi</span><b>${x.egasi}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-shartnoma"/></svg><span class="yorliq">Shartnoma</span><b>${x.shartnoma}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-soat"/></svg><span class="yorliq">Amal qilish muddati</span><b>${x.muddat}</b></div>
    </div>

    <div class="xp-blok">
      <h4>Jihozlar</h4>
      ${x.jihozlar.map(j=>`<div class="xp-qator"><svg class="ic"><use href="#i-ekran"/></svg><span class="yorliq">${j[0]}</span><b>${j[1]}</b></div>`).join("")}
      <button class="jihoz-tugma" data-toast="Barcha jihozlar inventar ro'yxati">Barcha jihozlar<svg class="ic"><use href="#i-strelka"/></svg></button>
    </div>

    <div class="xp-blok">
      <h4>Qo'shimcha ma'lumot</h4>
      <div class="xp-qator"><svg class="ic"><use href="#i-kalendar"/></svg><span class="yorliq">Yaratilgan sana</span><b>12-yanv, 2024</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-soat"/></svg><span class="yorliq">Oxirgi yangilanish</span><b>24-may, 14:10</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-hujjat"/></svg><span class="yorliq">Eslatmalar</span><b>—</b></div>
    </div>

    <button class="xp-tahrir" id="xp-tahrir"><svg class="ic"><use href="#i-qalam"/></svg>Tahrirlash</button>`;

  document.getElementById("xp-tahrir").addEventListener("click", ()=>{
    MKB.modal("Xonani tahrirlash",
      `<div style="display:grid;gap:14px;margin-top:6px">
        <div><label class="maydon-yorliq">Xona nomi</label><div class="kirish"><input id="tx-nom" value="${x.nom}"></div></div>
        <div><label class="maydon-yorliq">Holat</label><div class="kirish"><input id="tx-holat" value="${x.holat}"></div></div>
      </div>`,
      { okMatn:"Saqlash", ok(){
        x.nom = document.getElementById("tx-nom").value.trim() || x.nom;
        x.holat = document.getElementById("tx-holat").value.trim() || x.holat;
        xonalarChiz(); panelChiz();
        MKB.toast("Xona ma'lumotlari saqlandi");
      } });
  });
  document.getElementById("xp-yop").addEventListener("click", ()=>{
    document.getElementById("xona-panel").style.display = "none";
    document.querySelectorAll(".xona-k").forEach(k=>k.classList.remove("faol"));
  });
}
qavatChiz();
xonalarChiz(); panelChiz();

document.getElementById("xona-keyingi").addEventListener("click", ()=>{
  document.getElementById("xona-torlar").scrollBy({left:330, behavior:"smooth"});
});

/* 3D/2D */
document.getElementById("rj-3d").addEventListener("click", function(){
  this.classList.add("aktiv"); document.getElementById("rj-2d").classList.remove("aktiv");
  document.getElementById("qavat-rasm").classList.remove("sxematik");
  MKB.toast("3D ko'rinish");
});
document.getElementById("rj-2d").addEventListener("click", function(){
  this.classList.add("aktiv"); document.getElementById("rj-3d").classList.remove("aktiv");
  document.getElementById("qavat-rasm").classList.add("sxematik");
  MKB.toast("2D reja ko'rinishi");
});

/* Hisobot */
const ht = document.getElementById("hisobot-tugma"), hm = document.getElementById("hisobot-menyu");
ht.addEventListener("click", e=>{
  e.stopPropagation();
  const o = hm.classList.contains("ochiq");
  document.querySelectorAll(".menyu-popover.ochiq").forEach(x=>x.classList.remove("ochiq"));
  hm.classList.toggle("ochiq", !o);
});
hm.querySelectorAll("button").forEach(b=>b.addEventListener("click", e=>{
  e.stopPropagation(); hm.classList.remove("ochiq");
  MKB.toast(b.dataset.f+" shakllantirildi", "i-yuklab");
}));
});
</script>
</body>
</html>
