<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Baholash paneli</title>
<link rel="stylesheet" href="yadro/app.css?v=26082800">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="panel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Boshqaruv paneli</span></div>
    <div class="hs-qator"><h1>Baholash paneli</h1><span class="hs-meta" id="hs-meta">Qiymat va qayta baholash holati</span><div class="hs-amallar"><a class="tugma tugma-oq" href="hisobotlar.html"><svg class="ic"><use href="#i-hisobot"/></svg>Hisobotlar</a><a class="tugma tugma-asosiy" href="obyektlar.html"><svg class="ic"><use href="#i-aktivlar"/></svg>Obyektlar reyestri</a></div></div>
  </div>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Baholashlar</span>
      <span class="m-qiymat"><span id="b-jami">—</span></span>
      <span class="m-izoh">Hisobotlar soni</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Joriy yilda</span>
      <span class="m-qiymat"><span id="b-yil">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">O'rtacha o'zgarish</span>
      <span class="m-qiymat"><span id="b-ozg">—</span></span>
      <span class="m-izoh">Avvalgi bahoga nisbatan</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Qayta baholash zarur</span>
      <span class="m-qiymat"><span id="b-eski">—</span></span>
      <span class="m-izoh">12 oydan oshgan</span>
    </div>
  </section>
  <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="panel-tor">
    <section class="karta"><div class="karta-bosh"><h2>So'nggi baholashlar</h2><a class="karta-havola" href="baholash.html">Barchasi<svg class="ic"><use href="#i-ong"/></svg></a></div><div id="b-royxat"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>Tur bo'yicha qiymat</h2></div><div id="b-turlar"></div></section>
  </div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082800"></script>
<script src="malumot.js?v=26082800"></script>
<script src="malumot-qoshimcha.js?v=26082800"></script>
<script src="malumot-kengaytma.js?v=26082800"></script>
<script src="malumot-kirish.js?v=26082800"></script>
<script src="malumot-indeks.js?v=26082800"></script>
<script src="tarjima.js?v=26082800"></script>
<script src="yadro/ikonlar.js?v=26082800"></script>
<script src="yadro/daraxt.js?v=26082800"></script>
<script src="yadro/chizma.js?v=26082800"></script>
<script src="yadro/qollanma.js?v=26082800"></script>
<script src="yadro/api.js?v=26082800"></script>
<script src="yadro/app.js?v=26082800"></script>
<script>

function ustunlarChiz(joy, yorliqlar, qiymatlar, brendIdx){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:10px;height:150px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + v + '</span>' +
        '<div style="width:100%;max-width:34px;height:' + Math.round(v / maks * 104) + 'px;border-radius:14px 14px 4px 4px;background:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? 'var(--brend)' : 'var(--siyoh)') + ';opacity:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? '1' : '.82') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span>' +
      '</div>').join("") + '</div>';
}
function obyektQatori(y){
  return '<a class="qator" href="obyekt.html?id=' + encodeURIComponent(y.id) + '">' +
    '<img class="media" src="' + (y.mulk.rasmKichik || y.mulk.rasm) + '" alt="" loading="lazy">' +
    '<span class="matn"><b>' + y.mulk.qisqa + '</b>' +
    '<span>' + y.id + ' · ' + y.bosqichNomi + '</span></span>' +
    '<span class="ong"><span class="pul">' + y.qarzMatn + '</span>' +
    MKB.shtrix(MKB_DATA.nazoratIndeksi(y).ball, 12) + '</span></a>';
}
function muddatQatori(m){
  return '<a class="qator" href="' + m.href + '">' +
    '<span class="belgi ' + (m.xavfli ? "pushti" : "") + '">' + ik(m.ikonka) + '</span>' +
    '<span class="matn"><b>' + m.nom + '</b><span>' + m.izoh + '</span></span>' +
    '<span class="vaqt"' + (m.xavfli ? ' style="color:var(--pushti-matn)"' : '') + '>' + m.vaqt + '</span></a>';
}

document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("BAHOLASHLAR");
  const yoz = await MKBapi.royxat("YOZUVLAR");
  document.getElementById("b-jami").textContent = r.length;
  document.getElementById("b-yil").textContent = r.filter(b => (b.sana || "").includes("2026")).length;
  const delta = r.filter(b => b.avvalgi).map(b => (b.qiymat - b.avvalgi) / b.avvalgi * 100);
  const ort = delta.reduce((a, b) => a + b, 0) / (delta.length || 1);
  document.getElementById("b-ozg").innerHTML = (ort >= 0 ? "+" : "") + ort.toFixed(1).replace(".", ",") + "<small>%</small>";
  document.getElementById("b-eski").textContent = r.filter(b => (b.sana || "").includes("2025")).length;
  document.getElementById("b-royxat").innerHTML = r.slice(0, 6).map(b => {
    const o = MKB_DATA.OBYEKT_INDEKS[b.obyektId] || {};
    return '<a class="qator" href="baholash-hisobot.html?id=' + encodeURIComponent(b.id) + '">' +
      '<span class="belgi lavanda">' + ik("baholash") + '</span>' +
      '<span class="matn"><b>' + (o.qisqa || b.obyektId) + '</b>' +
      '<span>' + b.baholovchi + ' · ' + b.usul + '</span></span>' +
      '<span class="pul">' + MKB.fmt(b.qiymat) + ' mln</span></a>';
  }).join("");
  const turlar = {};
  yoz.forEach(y => turlar[y.mulk.tur] = (turlar[y.mulk.tur] || 0) + y.mulk.baho);
  MKB.barlar("b-turlar", Object.entries(turlar).sort((a, b) => b[1] - a[1]).slice(0, 7),
    {format: v => MKB.fmt(Math.round(v))});
});
</script>
</body>
</html>
