<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Parolni tiklash</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>
.xato-sahna{min-height:100vh;display:grid;place-items:center;background:var(--qogoz);padding:24px}
.xato-karta{text-align:center;max-width:460px}
.xato-karta .kod{font:800 96px/1 var(--shrift-displey);letter-spacing:-.04em;color:var(--siyoh)}
.xato-karta .kod i{font-style:normal;color:var(--brend);text-shadow:0 0 0 var(--brend)}
.xato-karta h1{font:700 22px/1.2 var(--shrift-displey);margin:10px 0 8px}
.xato-karta p{font-size:13.5px;color:var(--iz);line-height:1.6;margin-bottom:22px}
.xato-karta .tugmalar{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body data-sahifa="kirish" data-ochiq="1">
<div class="xato-sahna"><div class="k-karta" style="width:min(430px,100%)">
  <span class="yorliq" style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brend-quyuq)">Mikrokreditbank · ichki tizim</span>
  <h1 style="font:700 27px/1.15 var(--shrift-displey);letter-spacing:-.02em;margin:6px 0 4px">Parolni tiklash</h1>
  <p style="font-size:13px;color:var(--iz);margin-bottom:22px">Korporativ emailingizni kiriting — tiklash havolasi yuboriladi</p>
  <form id="tiklash-forma" novalidate style="display:flex;flex-direction:column;gap:14px">
    <div class="maydon">
      <label class="maydon-yorliq" for="email">Korporativ email</label>
      <div class="kirish"><svg class="ic"><use href="#i-xat"/></svg>
        <input id="email" type="email" placeholder="ism.familiya@mkbank.uz"></div>
      <span class="maydon-izoh xato" id="t-xato" hidden>To&#39;g&#39;ri email kiriting (@mkbank.uz)</span>
    </div>
    <button class="tugma tugma-asosiy" type="submit" style="height:46px">Havola yuborish</button>
  </form>
  <div id="t-natija" hidden style="margin-top:16px;background:var(--yashil-fon);color:var(--yashil);border-radius:12px;padding:14px 16px;font-size:13px;font-weight:500">
    Tiklash havolasi yuborildi. Emailingizni tekshiring — havola 30 daqiqa amal qiladi.
  </div>
  <div class="k-past" style="margin-top:18px;font-size:12.5px"><a href="kirish.html" style="font-weight:700;color:var(--brend-quyuq)">← Kirish sahifasiga qaytish</a></div>
</div></div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.getElementById("tiklash-forma").addEventListener("submit", e => {
  e.preventDefault();
  const em = document.getElementById("email").value.trim();
  const xato = document.getElementById("t-xato");
  if (!/^[\w.-]+@mkbank\.uz$/.test(em)){ xato.hidden = false; return; }
  xato.hidden = true;
  document.getElementById("t-natija").hidden = false;
  MKB.toast("Tiklash havolasi yuborildi");
});
</script>
</body>
</html>
