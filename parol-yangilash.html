<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Yangi parol</title>
<link rel="stylesheet" href="yadro/app.css?v=26082760">
<style>
.xato-sahna{min-height:100vh;display:grid;place-items:center;padding:26px;
  background:
    radial-gradient(900px 640px at 12% 0%, #FAEEE8 0%, transparent 58%),
    radial-gradient(800px 620px at 92% 16%, #EFEFF8 0%, transparent 56%),
    linear-gradient(150deg,#F8F1ED 0%,#F2F1F7 54%,#EFF4F1 100%)}
.xato-karta{text-align:center;max-width:500px;background:var(--oq);border-radius:30px;
  padding:44px 40px;box-shadow:var(--soya-suzuvchi)}
.xato-karta .kod{font:500 92px/1 var(--shrift-displey);letter-spacing:-.05em;color:var(--siyoh)}
.xato-karta .kod i{font-style:normal;color:var(--mint-matn)}
.xato-karta h1{font:500 24px/1.2 var(--shrift-displey);letter-spacing:-.03em;margin:14px 0 10px}
.xato-karta p{font-size:14.5px;color:var(--matn-3);line-height:1.6;margin-bottom:26px}
.xato-karta .tugmalar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body data-sahifa="kirish" data-ochiq="1">
<div class="xato-sahna"><div class="k-karta" style="width:min(430px,100%)">
  <h1 style="font:700 27px/1.15 var(--shrift-displey);letter-spacing:-.02em;margin:6px 0 4px">Yangi parol o&#39;rnatish</h1>
  <p style="font-size:13px;color:var(--iz);margin-bottom:22px">Kamida 8 belgi: katta-kichik harf va raqam bo&#39;lsin</p>
  <form id="yangi-forma" novalidate style="display:flex;flex-direction:column;gap:14px">
    <div class="maydon">
      <label class="maydon-yorliq" for="p1">Yangi parol</label>
      <div class="kirish"><svg class="ic"><use href="#i-qulf"/></svg><input id="p1" type="password" placeholder="Yangi parol"></div>
    </div>
    <div class="maydon">
      <label class="maydon-yorliq" for="p2">Parolni takrorlang</label>
      <div class="kirish"><svg class="ic"><use href="#i-qulf"/></svg><input id="p2" type="password" placeholder="Qayta kiriting"></div>
      <span class="maydon-izoh xato" id="p-xato" hidden>Parollar mos emas yoki talabga javob bermaydi</span>
    </div>
    <button class="tugma tugma-asosiy" type="submit" style="height:46px">Parolni saqlash</button>
  </form>
</div></div>
<script src="yadro/bino.js?v=26082760"></script>
<script src="malumot.js?v=26082760"></script>
<script src="malumot-qoshimcha.js?v=26082760"></script>
<script src="malumot-kengaytma.js?v=26082760"></script>
<script src="malumot-kirish.js?v=26082760"></script>
<script src="malumot-indeks.js?v=26082760"></script>
<script src="tarjima.js?v=26082760"></script>
<script src="yadro/ikonlar.js?v=26082760"></script>
<script src="yadro/daraxt.js?v=26082760"></script>
<script src="yadro/chizma.js?v=26082760"></script>
<script src="yadro/qollanma.js?v=26082760"></script>
<script src="yadro/api.js?v=26082760"></script>
<script src="yadro/app.js?v=26082760"></script>
<script>
document.getElementById("yangi-forma").addEventListener("submit", e => {
  e.preventDefault();
  const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
  const kuchli = p1.length >= 8 && /[A-Z]/.test(p1) && /[a-z]/.test(p1) && /\d/.test(p1);
  const xato = document.getElementById("p-xato");
  if (!kuchli || p1 !== p2){ xato.hidden = false; return; }
  xato.hidden = true;
  MKB.toast("Parol yangilandi — endi kirishingiz mumkin");
  setTimeout(() => location.href = "kirish.html", 900);
});
</script>
</body>
</html>
