</head>
<body data-sahifa="kn">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="kirish-nazorati.html">Kirish nazorati</a><span class="ajratgich">/</span><span>Qurilma</span></div>
    <div class="hs-qator"><h1>Qurilma kartochkasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="kn-tor">
    <section class="karta">
      <div class="karta-bosh"><h2 id="q-nom">—</h2><span class="soni" id="q-holat"></span></div>
<dl class="malumot-royxat">
  <dt><svg class="ic"><use href="#i-qurilma"/></svg>Tur</dt>
  <dd id="q-tur">—</dd>
  <dt><svg class="ic"><use href="#i-bino"/></svg>Obyekt</dt>
  <dd><span id="q-obyekt" class="">—</span></dd>
  <dt><svg class="ic"><use href="#i-eshik"/></svg>Kirish nuqtasi</dt>
  <dd><span id="q-nuqta" class="">—</span></dd>
  <dt><svg class="ic"><use href="#i-hujjat"/></svg>Seriya raqami</dt>
  <dd id="q-seriya">—</dd>
  <dt><svg class="ic"><use href="#i-yangilash"/></svg>Proshivka</dt>
  <dd id="q-proshivka">—</dd>
  <dt><svg class="ic"><use href="#i-kalendar"/></svg>O'rnatilgan</dt>
  <dd id="q-ornatilgan">—</dd>
  <dt><svg class="ic"><use href="#i-signal"/></svg>Oxirgi aloqa</dt>
  <dd id="q-aloqa">—</dd>
  <dt><svg class="ic"><use href="#i-soat"/></svg>Keyingi xizmat</dt>
  <dd id="q-xizmat">—</dd>
</dl>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button type="button" class="tugma tugma-asosiy" id="q-diag"><svg class="ic"><use href="#i-signal"/></svg>Diagnostika o&#39;tkazish</button>
        <a class="tugma tugma-oq" id="q-servis" href="servis-topshirigi.html"><svg class="ic"><use href="#i-vazifa"/></svg>Servis topshirig&#39;i</a>
      </div>
    </section>
    <section class="karta">
      <div class="karta-bosh"><h2>Diagnostika</h2></div>
      <div id="q-testlar"></div>
    </section>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px" class="kn-tor">
    <section class="karta"><div class="karta-bosh"><h2>Qurilma jurnali</h2></div><div id="q-jurnal"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>Xizmat tarixi</h2></div><div id="q-xizmatlar"></div></section>
  </div>
</main>

</div>
<script src="yadro/bino.js?v=26082800"></script>
<script src="malumot.js?v=26082800"></script>
<script src="malumot-qoshimcha.js?v=26082800"></script>
<script src="malumot-kengaytma.js?v=26082800"></script>
<script src="malumot-kirish.js?v=26082800"></script>
<script src="malumot-indeks.js?v=26082800"></script>
<script src="tarjima.js?v=26082800"></script>
<script src="yadro/ikonlar.js?v=26082800"></script>
<script src="yadro/daraxt.js?v=26082800"></script>
<script src="yadro/chizma.js?v=26082800"></script>
<script src="yadro/qollanma.js?v=26082800"></script>
<script src="yadro/api.js?v=26082800"></script>
<script src="yadro/app.js?v=26082800"></script>
<script>

const KN_NATIJA = {ruxsat: ["Ruxsat berildi", "chip-yashil"], rad: ["Rad etildi", "chip-xavf"],
                   ogohlantirish: ["Ogohlantirish", "chip-sariq"]};
const KN_HOLAT = {onlayn: ["Onlayn", "chip-yashil"], oflayn: ["Oflayn", "chip-xavf"],
                  xizmatda: ["Xizmatda", "chip-sariq"]};
const QR_HOLAT = {ishlayapti: ["Ishlayapti", "chip-yashil"], ogohlantirish: ["Ogohlantirish", "chip-sariq"],
                  nosoz: ["Nosoz", "chip-xavf"]};
function chip(xarita, kalit){
  const v = xarita[kalit] || [kalit, ""];
  return '<span class="chip ' + v[1] + '">' + v[0] + "</span>";
}
function nuqtaIkonka(t){
  return t === "turniket" ? "turniket" : t === "shlagbaum" ? "mashina" : t === "darvoza" ? "zavod" : "eshik";
}
function shaxsSurati(sh, olcham){
  const o = olcham || 38;
  return sh && sh.rasm
    ? '<img class="shaxs-surat" src="' + sh.rasm + '" alt="" loading="lazy" style="width:' + o +
      "px;height:" + o + 'px">'
    : '<span class="belgi">' + (sh ? sh.belgi : "?") + "</span>";
}
function shaxsQatori(sh, ong){
  if (!sh) return '<span class="matn"><b>Aniqlanmagan shaxs</b><span>Identifikatsiya o&#39;tmadi</span></span>';
  return shaxsSurati(sh) +
    '<span class="matn"><b>' + sh.ism + "</b><span><span>" + sh.lavozim + "</span> · <span>" + sh.tashkilot + "</span></span></span>" +
    (ong || "");
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? o.qisqa : id;
}
function voqeaQatori(v){
  const sh = MKB_DATA.shaxs(v.shaxsId);
  return '<a class="qator" href="kirish-voqea.html?id=' + encodeURIComponent(v.id) + '">' +
    '<span class="belgi ' + (v.natija === "rad" ? "pushti" : v.natija === "ogohlantirish" ? "lavanda" : "mint") + '">' +
      ik(v.natija === "ruxsat" ? "tasdiq" : v.natija === "rad" ? "rad" : "xavf") + "</span>" +
    '<span class="matn"><b>' + (sh ? sh.ism : "Aniqlanmagan shaxs") + "</b>" +
    "<span>" + obyektNomi(v.obyektId) + " · " + v.nuqtaNomi + " · " + v.usul + "</span></span>" +
    '<span class="ong"><span class="vaqt">' + v.soat + "</span>" + chip(KN_NATIJA, v.natija) + "</span></a>";
}

document.addEventListener("mkb:tayyor", () => {
  const D = MKB_DATA;
  const id = new URLSearchParams(location.search).get("id");
  const q = D.QURILMALAR.find(x => x.id === id) || D.QURILMALAR[0];
  if (!q){ location.replace("xato-404.html"); return; }
  const n = D.kirishNuqtasi(q.kirishNuqtaId) || {};
  document.getElementById("hs-meta").textContent = q.id;
  document.getElementById("q-nom").textContent = q.model;
  document.getElementById("q-holat").innerHTML = chip(QR_HOLAT, q.holat);
  document.getElementById("q-tur").textContent = q.turNomi;
  document.getElementById("q-obyekt").innerHTML =
    '<a href="obyekt.html?id=' + encodeURIComponent(q.obyektId) + '">' + obyektNomi(q.obyektId) + "</a>";
  document.getElementById("q-nuqta").innerHTML = n.id
    ? '<a href="kirish-nuqtasi.html?id=' + encodeURIComponent(n.id) + '">' + n.nom + "</a>" : "—";
  document.getElementById("q-seriya").textContent = q.seriya;
  document.getElementById("q-proshivka").textContent = q.proshivka;
  document.getElementById("q-ornatilgan").textContent = q.ornatilgan;
  document.getElementById("q-aloqa").textContent = q.oxirgiAloqa;
  document.getElementById("q-xizmat").textContent = q.keyingiXizmat;
  document.getElementById("q-servis").href = "servis-topshirigi.html?qurilma=" + encodeURIComponent(q.id);

  const TESTLAR = [
    ["Tarmoq aloqasi", q.holat !== "nosoz"],
    ["Quvvat manbai", true],
    ["Qulf mexanizmi", q.tur !== "qulf" || q.holat === "ishlayapti"],
    ["Kartani o&#39;qish moduli", q.tur !== "oquvchi" || q.holat !== "nosoz"],
    ["Vaqt sinxronizatsiyasi", true],
    ["Xotira hajmi", q.holat !== "ogohlantirish"],
  ];
  function testChiz(natija){
    document.getElementById("q-testlar").innerHTML = TESTLAR.map((t, i) =>
      '<div class="qator"><span class="belgi ' + (natija ? (t[1] ? "mint" : "pushti") : "") + '">' +
      ik(natija ? (t[1] ? "tasdiq" : "rad") : "soat") + "</span>" +
      '<span class="matn"><b>' + t[0] + "</b><span>" +
      (natija ? (t[1] ? "Normada" : "Nosozlik aniqlandi") : "Tekshirilmagan") + "</span></span></div>").join("");
  }
  testChiz(false);
  document.getElementById("q-diag").addEventListener("click", () => {
    testChiz(true);
    const xato = TESTLAR.filter(t => !t[1]).length;
    MKB.toast(xato ? xato + " ta nosozlik aniqlandi" : "Barcha testlar muvaffaqiyatli", xato ? "xavf" : "tasdiq");
  });

  const jurnal = [
    ["Konfiguratsiya yangilandi", q.ornatilgan, "yangilash"],
    ["Proshivka " + q.proshivka + " o&#39;rnatildi", q.ornatilgan, "qurilma"],
    ["Aloqa tiklandi", q.oxirgiAloqa, "signal"],
  ];
  if (q.holat === "nosoz") jurnal.unshift(["Aloqa uzildi", q.oxirgiAloqa, "xavf"]);
  document.getElementById("q-jurnal").innerHTML = jurnal.map(j =>
    '<div class="qator"><span class="belgi">' + ik(j[2]) + "</span>" +
    '<span class="matn"><b>' + j[0] + "</b></span>" +
    '<span class="vaqt">' + j[1] + "</span></div>").join("");

  const xiz = D.XIZMAT_ISHLARI.filter(x => x.qurilmaId === q.id);
  document.getElementById("q-xizmatlar").innerHTML = xiz.length ? xiz.map(x =>
    '<a class="qator" href="servis-topshirigi.html?id=' + encodeURIComponent(x.id) + '">' +
      '<span class="belgi ' + (x.holat === "bajarildi" ? "mint" : "lavanda") + '">' + ik("vazifa") + "</span>" +
      '<span class="matn"><b>' + x.tur + "</b><span>" + x.usta + "</span></span>" +
      '<span class="ong"><span class="vaqt">' + x.sana + "</span>" +
      '<span class="chip chip-kichik">' + x.holat + "</span></span></a>").join("")
    : '<div class="bosh-holat">Xizmat qayd etilmagan</div>';
});
</script>
</body>
</html>
