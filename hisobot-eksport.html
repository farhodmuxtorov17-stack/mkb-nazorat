<script>
(() => {
  const $ = id => document.getElementById(id);
  MKB.sahifaYukla({
    joylar: {"ek-korish": ["jadval", 5]},
    xato: "Eksport uchun ma'lumotni yuklab bo'lmadi",
    ish: boshla,
  });

async function boshla(){
  if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
  const D = MKB_DATA, esc = MKB.esc;
  /* Eksportda niqoblanadigan maydonlar (Sozlamalar: eksportNiqob): telefon, pasport, PINFL va shunga o'xshash */
  const MAXFIY = /(^|\.)(tel|telefon|hujjat|pasport|pinfl|stirYokiPinfl|simRaqam|kartaRaqam)$/i;
  const MAXFIY_NOM = /telefon|pasport|pinfl|karta raqami/i;

  /* ---------- Yordamchilar ---------- */
  const son = n => n == null || n === "" || isNaN(n) ? "" : String(D.yaxlit(Number(n), 2)).replace(".", ",");
  const ha = v => v == null ? "" : v ? "Ha" : "Yo'q";
  const nom = (royxat, k) => ((D[royxat] || []).find(x => x.kalit === k) || {}).nom || k || "";
  const holat = k => k == null || k === "" ? "" : MKB.holatNomi(k);
  const ob = id => id ? (D.obyektNomi ? D.obyektNomi(id, true) : "") || id : "";
  const yol = (x, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], x);
  const muddat = y => { try{ return D.muddatHisobi(y) || {}; }catch(_){ return {}; } };
  const zaxira = y => { try{ return D.zaxiraHisobi(y) || {}; }catch(_){ return {}; } };
  const chorakBosh = s => { const m = /^(\d{4})-Q([1-4])$/.exec(String(s || "")); return m ? new Date(+m[1], (m[2] - 1) * 3, 1) : null; };
  const oyBosh = s => { const m = /^(\d{4})-(\d{2})$/.exec(String(s || "")); return m ? new Date(+m[1], m[2] - 1, 1) : null; };
  const k = kalit => x => yol(x, kalit);
  const OBYEKT = [["Obyekt kodi", k("obyektId")], ["Obyekt", x => ob(x.obyektId)]];

  /* ---------- To'plamlar: bo'lim, sana maydoni va asosiy ustunlar ---------- */
  const T = [
    {kol: "YOZUVLAR", bolim: "aktivlar", nom: "Balans aktivlari reyestri", fayl: "aktivlar-reyestri", sana: y => D.sanaOqi(y.balans && y.balans.sana), davrIzoh: "balansga olingan sana bo'yicha",
      ustunlar: [["Kod", k("id")], ["Nomi", k("nom")], ["Turi", k("tur")], ["Hudud", k("hudud")], ["Tuman", k("tuman")], ["Manzil", k("manzil")], ["Filial", k("filial")],
        ["Holat", k("holat")], ["Bosqich", y => nom("BOSQICHLAR", y.bosqich)], ["Mas'ul", k("masul")],
        ["Balansga olingan", k("balans.sana")], ["Balans qiymati, mln so'm", y => son(yol(y, "balans.qiymat"))], ["Hisobvaraq", k("balans.hisobvaraq")],
        ["Qabul asosi", y => nom("QABUL_ASOSLARI", yol(y, "balans.qabulAsosi"))], ["Asos hujjati", y => [yol(y, "balans.asosHujjat.raqam"), yol(y, "balans.asosHujjat.sana")].filter(Boolean).join(", ")],
        ["Bozor qiymati, mln so'm", y => son(yol(y, "qiymat.bozor"))], ["Tugatish qiymati, mln so'm", y => son(yol(y, "qiymat.tugatish"))], ["Baholash sanasi", k("qiymat.bahoSana")],
        ["Maydon", y => D.maydonMatn ? D.maydonMatn(y) : ""], ["Kadastr raqami", k("huquq.kadastrRaqami")], ["Davlat raqami", k("huquq.davlatRaqami")],
        ["Balansda, kun", y => muddat(y).turganKun ?? ""], ["Me'yoriy muddat sanasi", y => muddat(y).chegaraSana || ""], ["Muddat holati", y => muddat(y).holatNomi || ""],
        ["Zaxira toifasi", y => zaxira(y).toifaNomi || ""], ["Zaxira, %", y => son(zaxira(y).foiz)], ["Zaxira, mln so'm", y => son(zaxira(y).summa)],
        ["Qo'riqlash", y => holat(yol(y, "himoya.qoriqlashTuri"))], ["Sotish usuli", y => nom("SOTISH_USULLARI", yol(y, "sotuv.usul"))]]},
    {kol: "HUJJATLAR", bolim: "aktivlar", nom: "Hujjatlar", fayl: "hujjatlar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Raqam", k("id")]].concat(OBYEKT, [["Hujjat", k("nom")], ["Turi", k("tur")], ["Bosqich", x => nom("BOSQICHLAR", x.bosqich)], ["Hujjat raqami", k("raqam")],
        ["Sana", k("sana")], ["Amal qilish muddati", k("amalQilishTugash")], ["Holat", k("holat")], ["Format", k("format")], ["Hajm", k("hajm")], ["Yuklagan", k("yuklagan")]])},
    {kol: "XARAJATLAR", bolim: "aktivlar", nom: "Saqlash xarajatlari", fayl: "xarajatlar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Raqam", k("id")], ["Sana", k("sana")], ["Davr", k("davr")]].concat(OBYEKT, [["Toifa", x => nom("XARAJAT_TOIFALARI", x.toifa)], ["Summa, mln so'm", x => son(x.summa)],
        ["Kontragent", k("kontragent")], ["Hisob-faktura", k("hisobFaktura")], ["Tasdiqlovchi", k("tasdiqlovchi")], ["Holat", x => holat(x.holat)]])},
    {kol: "ARXIV", bolim: "aktivlar", nom: "Balansdan chiqarilgan aktivlar", fayl: "arxiv", sana: x => D.sanaOqi(x.sotuvSana), davrIzoh: "chiqarilgan sana bo'yicha",
      ustunlar: [["Kod", k("id")], ["Nomi", k("nom")], ["Turi", k("tur")], ["Hudud", k("hudud")], ["Filial", k("filial")], ["Balansga olingan", k("balansSana")],
        ["Balans qiymati, mln so'm", x => son(x.balansQiymat)], ["Chiqarilgan", k("sotuvSana")], ["Usul", x => x.sotishUsuli === "hisobdan" ? "Hisobdan chiqarish" : nom("SOTISH_USULLARI", x.sotishUsuli)],
        ["Sotuv narxi, mln so'm", x => son(x.sotuvNarxi)], ["Xaridor", k("xaridor")], ["Xarajatlar, mln so'm", x => son(x.jamiXarajat)],
        ["Tiklangan zaxira, mln so'm", x => son(x.tiklanganZaxira)], ["Foyda yoki zarar, mln so'm", x => son(x.foydaZarar)], ["Balansda, kun", k("turganKun")]]},
    {kol: "KORIKLAR", bolim: "korik", nom: "Ko'riklar", fayl: "koriklar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Ko'rik", k("id")]].concat(OBYEKT, [["Turi", x => x.korikTuri || x.tur], ["Sana", k("sana")], ["Holat", x => holat(x.holat)], ["Inspektor", k("inspektor")],
        ["Holat bahosi", k("holatBall")], ["Kamchiliklar", k("kamchiliklar")], ["Xarajat taklifi, mln so'm", x => son(x.xarajatTaklifi)], ["Keyingi ko'rik", k("keyingiKorikSana")], ["Xulosa", k("xulosa")]])},
    {kol: "INVENTAR", bolim: "korik", nom: "Inventar ro'yxati", fayl: "inventar", sana: x => D.sanaOqi(x.oxirgiSanash), davrIzoh: "oxirgi sanash bo'yicha",
      ustunlar: [["Inventar raqami", k("inventarRaqam")]].concat(OBYEKT, [["Nomi", k("nom")], ["Marka", k("marka")], ["Model", k("model")], ["Yil", k("yil")], ["VIN", k("vin")],
        ["Kilometraj yoki motosoat", k("motosoatYokiKm")], ["To'liqligi", x => ha(x.butlik)], ["Akkumulyator", k("akkumulyator")], ["Kalitlar", k("kalit")], ["Saqlash joyi", k("saqlashJoyi")],
        ["Holat bahosi", k("holatBall")], ["Oxirgi sanash", k("oxirgiSanash")]])},
    {kol: "INVENTARIZATSIYALAR", bolim: "korik", nom: "Inventarizatsiyalar", fayl: "inventarizatsiyalar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Raqam", k("id")], ["Sana", k("sana")], ["Turi", k("turi")], ["Komissiya", x => (x.komissiya || []).join(", ")], ["Obyektlar", x => (x.obyektlar || []).length],
        ["Kamomad", k("kamomad")], ["Ortiqcha", k("ortiqcha")], ["Holat", x => holat(x.holat)]]},
    {kol: "BAHOLASHLAR", bolim: "qiymat", nom: "Baholash hisobotlari", fayl: "baholashlar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Raqam", k("id")]].concat(OBYEKT, [["Sana", k("sana")], ["Hisobot raqami", k("hisobotRaqami")], ["Bozor qiymati, mln so'm", x => son(x.bozorQiymati)],
        ["Tugatish qiymati, mln so'm", x => son(x.tugatishQiymati)], ["Avvalgi qiymat, mln so'm", x => son(x.avvalgi)], ["Baholovchi", k("baholovchi")], ["Litsenziya", k("litsenziya")],
        ["Usul", k("usul")], ["Amal qilish muddati", k("amalQilishTugash")], ["Holat", x => holat(x.holat)]])},
    {kol: "SUGURTALAR", bolim: "qiymat", nom: "Sug'urta polislari", fayl: "sugurta-polislari", sana: x => D.sanaOqi(x.boshlanish), davrIzoh: "polis boshlangan sana bo'yicha",
      ustunlar: [["Polis", x => x.polis || x.id]].concat(OBYEKT, [["Turi", k("polisTuri")], ["Kompaniya", k("kompaniya")], ["Sug'urta summasi, mln so'm", x => son(x.summa)],
        ["Mukofot, mln so'm", x => son(x.mukofot)], ["Boshlanish", k("boshlanish")], ["Tugash", k("tugash")], ["Holat", x => holat(x.holat)]])},
    {kol: "SUGURTA_DAVOLARI", bolim: "qiymat", nom: "Sug'urta da'volari", fayl: "sugurta-davolari", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Da'vo", k("id")], ["Polis", k("polisId")], ["Hodisa", k("hodisaId")]].concat(OBYEKT, [["Sana", k("sana")], ["Summa, mln so'm", x => son(x.summa)], ["Holat", x => holat(x.holat)]])},
    {kol: "SOLIQ", bolim: "qiymat", nom: "Mol-mulk solig'i", fayl: "soliq", sana: x => chorakBosh(x.davr), davrIzoh: "soliq davri bo'yicha",
      ustunlar: OBYEKT.concat([["Davr", k("davr")], ["Soliq bazasi, mln so'm", x => son(x.baza)], ["Stavka, %", x => son(x.stavka)], ["Summa, mln so'm", x => son(x.summa)],
        ["Imtiyoz", x => ha(x.imtiyoz)], ["Yer solig'i, mln so'm", x => son(x.yerSoligi)], ["Holat", x => holat(x.holat)]])},
    {kol: "ZAXIRA_TARIX", bolim: "qiymat", nom: "Oylik zaxira suratlari", fayl: "zaxira-tarixi", sana: x => oyBosh(x.davr), davrIzoh: "hisobot oyi bo'yicha",
      ustunlar: [["Davr", k("davr")]].concat(OBYEKT, [["Toifa", x => nom("ZAXIRA_TOIFALARI", x.toifa) || x.toifa], ["Zaxira, %", x => son(x.foiz)], ["Zaxira, mln so'm", x => son(x.summa)]])},
    {kol: "LOTLAR", bolim: "realizatsiya", nom: "Lotlar", fayl: "lotlar", sana: x => D.sanaOqi(x.elonSana), davrIzoh: "e'lon sanasi bo'yicha",
      ustunlar: [["Lot", k("id")], ["E-auksion raqami", k("eauksionLotRaqami")]].concat(OBYEKT, [["Sotish usuli", x => nom("SOTISH_USULLARI", x.sotishUsuli)], ["E'lon sanasi", k("elonSana")],
        ["Savdo sanasi", k("savdoSana")], ["Boshlang'ich narx, mln so'm", x => son(x.boshlangichNarx)], ["Minimal narx, mln so'm", x => son(x.minimalNarx)], ["Zakalat, %", k("zakalatFoiz")],
        ["Narx pasaytirishlar", x => (x.pasaytirishlar || []).length], ["Holat", x => holat(x.holat)], ["G'olib", k("golib")], ["Yakuniy narx, mln so'm", x => son(x.yakuniyNarx)],
        ["Ishtirokchilar", k("ishtirokchilarSoni")], ["Qaror raqami", k("qarorRaqami")]])},
    {kol: "TAKLIFLAR", bolim: "realizatsiya", nom: "Takliflar", fayl: "takliflar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Taklif", k("id")], ["Sana", k("sana")]].concat(OBYEKT, [["Lot", k("lotId")], ["Xaridor", k("xaridor")], ["Xaridor turi", k("xaridorTuri")], ["Summa, mln so'm", x => son(x.summa)],
        ["To'lov sharti", k("tolovSharti")], ["Xaridor tekshiruvi natijasi", x => holat(x.amlNatija)], ["Affillangan", x => ha(x.affillanganlik)], ["Qaror raqami", k("qarorRaqami")], ["Holat", x => holat(x.holat)]])},
    {kol: "SHARTNOMALAR", bolim: "realizatsiya", nom: "Sotuv shartnomalari", fayl: "shartnomalar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Shartnoma", k("id")], ["Sana", k("sana")]].concat(OBYEKT, [["Lot", k("lotId")], ["Taklif", k("taklifId")], ["Xaridor", k("xaridor")], ["Narx, mln so'm", x => son(x.narx)],
        ["Avans, mln so'm", x => son(x.avans)], ["Sotish usuli", x => nom("SOTISH_USULLARI", x.sotishUsuli)], ["To'lovlar soni", x => (x.jadval || []).length],
        ["Qoldiq, mln so'm", x => son((x.jadval || []).filter(j => !j.tolandi).reduce((s, j) => s + (Number(j.summa) || 0), 0))], ["Taqiq", k("taqiqHolati")], ["Holat", x => holat(x.holat)]])},
    {kol: "IJARA", bolim: "realizatsiya", nom: "Ijara shartnomalari", fayl: "ijara", sana: x => D.sanaOqi(x.boshlanish), davrIzoh: "ijara boshlangan sana bo'yicha",
      ustunlar: [["Shartnoma", k("id")]].concat(OBYEKT, [["Ijarachi", k("ijarachi")], ["Maydon, m²", k("maydon")], ["Oylik ijara, mln so'm", x => son(x.oylikIjara)], ["Boshlanish", k("boshlanish")],
        ["Tugash", k("tugash")], ["Depozit, mln so'm", x => son(x.depozit)], ["Kommunalni to'laydi", k("kommunalKimTolaydi")],
        ["To'langan oylar", x => (x.tolovlar || []).filter(t => t.tolandi).length], ["To'lanmagan oylar", x => (x.tolovlar || []).filter(t => !t.tolandi).length], ["Holat", x => holat(x.holat)]])},
    {kol: "PAKETLAR", bolim: "realizatsiya", nom: "Sotuv paketlari", fayl: "paketlar",
      ustunlar: [["Paket", k("id")], ["Nomi", k("nom")], ["Tarkibi", x => (x.tarkib || []).join(", ")], ["Investitsiya kompaniyasi", k("investKompaniya")], ["Holat", x => holat(x.holat)]]},
    {kol: "UNDIRUV_ISHLAR", bolim: "yuridik", nom: "Undiruv ishlari", fayl: "undiruv-ishlari",
      ustunlar: [["Ish", k("id")], ["Holat", x => holat(x.holat)], ["Bosqich", x => nom("UNDIRUV_BOSQICHLAR", x.bosqich)], ["Qarzdor", k("qarzdor.nom")], ["Kredit shartnomasi", k("shartnoma.raqam")],
        ["Qarz, mln so'm", x => son(yol(x, "qarz.jami"))], ["Garov", k("garov.nom")], ["Garov bahosi, mln so'm", x => son(yol(x, "garov.bahoMln"))], ["Filial", k("filial")],
        ["Sud", k("sud.nomi")], ["Sud qarori", x => [yol(x, "qaror.raqam"), yol(x, "qaror.sana")].filter(Boolean).join(", ")],
        ["Qaror natijasi", k("qaror.natija")], ["Undiriladigan summa, mln so'm", x => son(yol(x, "qaror.summa"))],
        ["Undiruv garovga qaratilgan", x => ha(yol(x, "qaror.garovgaQaratildi"))], ["Mas'ul", k("masul")], ["Aktiv", k("aktivId")], ["Yopilgan", k("yopilganSana")]]},
    {kol: "SUD_MAJLISLAR", bolim: "yuridik", nom: "Sud majlislari", fayl: "sud-majlislari", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Majlis", k("id")], ["Ish", k("ishId")], ["Sud", k("sud")], ["Sana", k("sana")], ["Vaqt", k("soat")], ["Zal", k("zal")], ["Advokat", k("advokat")],
        ["Mavzu", k("mavzu")], ["Holat", x => holat(x.holat)], ["Natija", k("natija")]]},
    {kol: "QORIQLASH", bolim: "himoya", nom: "Qo'riqlash shartnomalari", fayl: "qoriqlash", sana: x => D.sanaOqi(x.boshlanish), davrIzoh: "shartnoma boshlangan sana bo'yicha",
      ustunlar: [["Shartnoma", k("id")]].concat(OBYEKT, [["Qo'riqlash turi", x => holat(x.qoriqlashTuri)], ["Ijrochi", k("ijrochi")], ["Shartnoma raqami", k("shartnomaRaqami")],
        ["Boshlanish", k("boshlanish")], ["Tugash", k("tugash")], ["Oylik to'lov, mln so'm", x => son(x.oylikTolov)], ["Javob vaqti, daqiqa", k("javobVaqtiDaq")], ["Holat", x => holat(x.holat)]])},
    {kol: "KOMMUNAL_ARIZALAR", bolim: "himoya", nom: "Kommunal arizalar", fayl: "kommunal-arizalar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Ariza", k("id")]].concat(OBYEKT, [["Xizmat", x => holat(x.xizmat)], ["Turi", k("tur")], ["Raqam", k("raqam")], ["Sana", k("sana")], ["Muddat", k("muddat")],
        ["Holat", x => holat(x.holat)], ["Izoh", k("izoh")]])},
    {kol: "HODISALAR", bolim: "himoya", nom: "Hodisalar", fayl: "hodisalar", sana: x => D.sanaOqi(x.vaqt),
      ustunlar: [["Hodisa", k("id")], ["Vaqt", k("vaqt")]].concat(OBYEKT, [["Hodisa turi", k("hodisa")], ["Jiddiylik", x => holat(x.jiddiylik)], ["Holat", k("holat")], ["Manba", k("manba")],
        ["Mas'ul", k("masul")], ["IIB arizasi", x => [yol(x, "iibAriza.raqam"), yol(x, "iibAriza.sana")].filter(Boolean).join(", ")], ["Tavsif", k("tavsif")]])},
    {kol: "QURILMALAR", bolim: "himoya", nom: "Qurilmalar", fayl: "qurilmalar", sana: x => D.sanaOqi(x.ornatilgan), davrIzoh: "o'rnatilgan sana bo'yicha",
      ustunlar: [["Qurilma", k("id")]].concat(OBYEKT, [["Turi", k("turNomi")], ["Ishlab chiqaruvchi", k("ishlabChiqaruvchi")], ["Model", k("model")], ["Seriya", k("seriya")],
        ["O'rnatilgan", k("ornatilgan")], ["Quvvat", k("quvvat")], ["Aloqa", k("aloqa")], ["Batareya, %", k("batareya")], ["Oxirgi signal", k("oxirgiSignal")], ["Holat", x => holat(x.holat)]])},
    {kol: "KIRISH_VOQEALARI", bolim: "himoya", nom: "Kirish voqealari", fayl: "kirish-voqealari", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Voqea", k("id")], ["Vaqt", k("vaqt")]].concat(OBYEKT, [["Kirish nuqtasi", k("nuqtaNomi")], ["Shaxs", x => x.shaxsId ? (D.shaxsNomi ? D.shaxsNomi(x.shaxsId) : x.shaxsId) : ""],
        ["Usul", k("usul")], ["Natija", k("natija")], ["Yo'nalish", k("yonalish")], ["Sabab", k("sabab")]])},
    {kol: "MB_HISOBOTLAR", bolim: "hisobot", nom: "Markaziy bank hisobotlari", fayl: "mb-hisobotlari", sana: x => oyBosh(x.davr), davrIzoh: "hisobot oyi bo'yicha",
      ustunlar: [["Davr", k("davr")], ["Topshirish muddati", k("muddat")], ["Topshirilgan", k("topshirilganSana")], ["Obyektlar soni", k("obyektlarSoni")],
        ["Jami balans qiymati, mln so'm", x => son(x.jamiBalansQiymat)], ["1-darajali kapital, mlrd so'm", x => son(x.kapital1Daraja)], ["Kapitalga nisbati", x => son(x.kapitalgaNisbat)],
        ["Me'yoriy muddat o'tgan", k("umidsizSoni")], ["Holat", x => holat(x.holat)]]},
    {kol: "TASDIQLAR", bolim: "vazifa", nom: "Qarorlar", fayl: "qarorlar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Raqam", k("id")], ["Sana", k("sana")], ["Masala", k("sarlavha")], ["Obyekt kodi", k("obyektId")], ["Manba", k("manbaId")], ["Summa, mln so'm", x => son(x.summa)],
        ["Muallif", k("muallif")], ["Mas'ul", k("masulRol")], ["Javob muddati", k("javobMuddati")], ["Holat", x => holat(x.holat)], ["Qaror sanasi", k("qarorSana")], ["Sabab", k("sabab")]]},
    {kol: "MENING_VAZIFALARIM", bolim: "vazifa", nom: "Vazifalar", fayl: "vazifalar", sana: x => D.sanaOqi(x.sana),
      ustunlar: [["Raqam", k("id")], ["Vazifa", k("nom")], ["Turi", k("tur")]].concat(OBYEKT, [["Qo'yilgan", k("sana")], ["Muddat", k("muddat")], ["Ijrochi", k("ijrochi")],
        ["Rol", k("rol")], ["Muhimlik", x => holat(x.muhimlik)], ["Bajarildi", x => ha(x.bajarildi)]])},
  ];
  /* To'plamlar yangi bo'lim kalitlari bo'yicha guruhlanadi: eski kalitlar shu yerda keltiriladi */
  const BOLIM_KANON = {korik: "nazorat", himoya: "nazorat", realizatsiya: "sotuv", yuridik: "sotuv", vazifa: "ishlar", baholash: "qiymat"};
  const kanon = b => BOLIM_KANON[b] || b;
  const BOLIM = {aktivlar: "Balans aktivlari", nazorat: "Nazorat va himoya", qiymat: "Qiymat va moliya",
    sotuv: "Sotuv va undiruv", ishlar: "Ishlar va qarorlar", hisobot: "Hisobotlar"};
  const ochiq = T.filter(t => MKB.huquq(t.bolim, "oqi"));
  const TUR_MOS = {portfel: "YOZUVLAR", reyestr: "YOZUVLAR", xarajat: "XARAJATLAR", mb: "MB_HISOBOTLAR", undiruv: "UNDIRUV_ISHLAR"};

  /* ---------- Forma ---------- */
  const sel = $("ek-kol");
  sel.innerHTML = Object.keys(BOLIM).filter(b => ochiq.some(t => kanon(t.bolim) === b)).map(b =>
    '<optgroup label="' + esc(BOLIM[b]) + '">' + ochiq.filter(t => kanon(t.bolim) === b).map(t => '<option value="' + t.kol + '">' + esc(t.nom) + "</option>").join("") + "</optgroup>").join("");
  const q = new URLSearchParams(location.search);
  const bosh = TUR_MOS[q.get("tur")] || q.get("kol");
  if (ochiq.some(t => t.kol === bosh)) sel.value = bosh;
  /* Hisobotlar markazidan kelgan davr va format */
  if ([...$("ek-davr").options].some(o => o.value === q.get("davr"))) $("ek-davr").value = q.get("davr");
  if ([...$("ek-format").options].some(o => o.value === q.get("format"))) $("ek-format").value = q.get("format");
  tarjimaQil($("ek-forma"));

  function oraliq(k){
    const b = D.bugun(), y = b.getFullYear(), m = b.getMonth(), bugun = new Date(y, m, b.getDate());
    if (k === "oy") return [new Date(y, m, 1), bugun];
    if (k === "otgan") return [new Date(y, m - 1, 1), new Date(y, m, 0)];
    if (k === "chorak") return [new Date(y, m - m % 3, 1), bugun];
    if (k === "yil") return [new Date(y, 0, 1), bugun];
    return null;
  }
  /* Barcha maydonlar: ichki obyektlar nuqta bilan yoyiladi, ro'yxatlar JSON ko'rinishida */
  function yoy(x, old, natija){
    Object.keys(x).forEach(k => {
      const v = x[k], p = old ? old + "." + k : k;
      if (v && typeof v === "object" && !Array.isArray(v)) yoy(v, p, natija);
      else natija[p] = Array.isArray(v) ? JSON.stringify(v) : v;
    });
    return natija;
  }
  function tozaYozuv(t, x){
    const sx = D.SXEMA && D.SXEMA[t.kol];
    const r = {};
    (sx ? ["id"].concat(sx.filter(k => k !== "id")).concat("izoh" in x ? ["izoh"] : []) : Object.keys(x)).forEach(k => { if (x[k] !== undefined && typeof x[k] !== "function") r[k] = x[k]; });
    return JSON.parse(JSON.stringify(r));
  }

  let tayyor = null;
  async function tayyorla(){
    const t = ochiq.find(x => x.kol === sel.value);
    if (!t) return null;
    const davr = t.sana ? $("ek-davr").value : "hammasi";
    let r = [];
    try{ r = await MKBapi.royxat(t.kol); }catch(_){ r = D[t.kol] || []; }
    r = MKB.doira((r || []).filter(Boolean));
    const o = oraliq(davr);
    if (o) r = r.filter(x => { const d = t.sana(x); return d && d >= o[0] && d < D.kunQosh(o[1], 1); });
    const barcha = $("ek-ustun").value === "barcha";
    let sarlavhalar, qatorlar, obyektlar;
    const niqob = MKB.niqobYoqilgan();
    if (barcha){
      const tekis = r.map(x => yoy(tozaYozuv(t, x), "", {}));
      if (niqob) tekis.forEach(x => Object.keys(x).forEach(k => { if (MAXFIY.test(k) && x[k] != null && x[k] !== "") x[k] = MKB.niqob(x[k]); }));
      sarlavhalar = [];
      tekis.forEach(x => Object.keys(x).forEach(k => { if (sarlavhalar.indexOf(k) < 0) sarlavhalar.push(k); }));
      qatorlar = tekis.map(x => sarlavhalar.map(k => x[k] == null ? "" : x[k]));
      obyektlar = niqob ? tekis : r.map(x => tozaYozuv(t, x));
    } else {
      sarlavhalar = t.ustunlar.map(u => u[0]);
      qatorlar = r.map(x => t.ustunlar.map(u => { let v; try{ v = u[1](x); }catch(_){ v = ""; } v = v == null ? "" : v; return niqob && MAXFIY_NOM.test(u[0]) && v !== "" ? MKB.niqob(v) : v; }));
      obyektlar = qatorlar.map(qt => Object.fromEntries(qt.map((v, i) => [sarlavhalar[i], v])));
    }
    const b = D.bugun(), kun = b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
    const fayl = "mkb-" + t.fayl + (davr !== "hammasi" ? "-" + davr : "") + (barcha ? "-toliq" : "") + "-" + kun + "." + $("ek-format").value;
    return {t, davr, o, sarlavhalar, qatorlar, obyektlar, fayl, barcha, niqob: niqob && (barcha ? true : t.ustunlar.some(u => MAXFIY_NOM.test(u[0])))};
  }

  async function yangila(){
    const r = tayyor = await tayyorla();
    if (!r){
      $("ek-son").textContent = "—";
      $("ek-korish").innerHTML = MKB.boshHolat("hisobot", "Eksport uchun to'plam yo'q", "Sizning rolingizga ochiq bo'lim topilmadi.");
      tarjimaQil($("ek-korish")); return;
    }
    const davrSel = $("ek-davr");
    davrSel.disabled = !r.t.sana;
    if (!r.t.sana) davrSel.value = "hammasi";
    $("ek-davr-izoh").textContent = !r.t.sana ? "Joriy holat olinadi" : r.o ? D.sanaYoz(r.o[0]) + " – " + D.sanaYoz(r.o[1]) + ", " + (r.t.davrIzoh || "sana bo'yicha") : "Davr " + (r.t.davrIzoh || "sana bo'yicha") + " tanlanadi";
    $("ek-ustun-izoh").textContent = r.barcha ? "Tizimdagi maydon nomlari bilan, tahlil uchun" : "Ustun nomlari o'zbek tilida";
    $("ek-kol-izoh").textContent = BOLIM[r.t.bolim];
    $("ek-son").textContent = MKB.fmt(r.qatorlar.length);
    $("ek-birlik").innerHTML = "<span>ta yozuv</span> · <span data-tarjimasiz>" + r.sarlavhalar.length + "</span> <span>ta ustun</span>";
    $("ek-fayl").innerHTML = "<span>Fayl:</span> <span class=\"kod-mono\" data-tarjimasiz>" + esc(r.fayl) + "</span>";
    $("ek-yukla").disabled = !r.qatorlar.length;
    $("hs-meta").textContent = ochiq.length + " ta to'plam · " + D.sanaYoz(D.bugun()) + " holatiga";
    const joy = $("ek-korish");
    $("ek-korish-soni").textContent = r.qatorlar.length ? (Math.min(5, r.qatorlar.length) + " / " + MKB.fmt(r.qatorlar.length)) : "";
    if (!r.qatorlar.length){
      joy.innerHTML = MKB.boshHolat("hisobot", "Yozuv yo'q", D.MANBA === "mahalliy" && r.t.kol !== "YOZUVLAR"
        ? "Mahalliy reyestrda bu to'plam hali to'ldirilmagan." : r.o ? "Tanlangan davrda yozuv yo'q. Davrni kengaytiring." : "Bu to'plamda hali yozuv yo'q.");
    } else {
      const ust = r.sarlavhalar.slice(0, 8);
      /* Ko'rinishda sarlavhalar kabi holat va tur qiymatlari ham interfeys tilida chiqadi (faqat lug'atdagi aniq kalit).
         Kod, raqam va xos nom lug'atda yo'q, o'zgarmaydi. "Barcha maydonlar" rejimida xom qiymat ko'rsatiladi. */
      const qiymat = v => { const m = String(v); return !r.barcha && joriyTil() === "ru" && typeof mkbLugatdan === "function" ? mkbLugatdan(m) : m; };
      joy.innerHTML = '<div class="ek-korish"><table><thead><tr>' + ust.map(s => "<th" + (r.barcha ? " data-tarjimasiz" : "") + ">" + esc(s) + "</th>").join("") +
        (r.sarlavhalar.length > ust.length ? '<th><span>yana</span> <span data-tarjimasiz>' + (r.sarlavhalar.length - ust.length) + "</span></th>" : "") + "</tr></thead><tbody>" +
        r.qatorlar.slice(0, 5).map(qt => "<tr>" + qt.slice(0, 8).map(v => '<td data-tarjimasiz title="' + esc(qiymat(v)) + '">' + esc(qiymat(v)) + "</td>").join("") +
          (r.sarlavhalar.length > ust.length ? "<td>…</td>" : "") + "</tr>").join("") + "</tbody></table></div>";
    }
    tarjimaQil($("ek-forma").parentNode); tarjimaQil(joy); tarjimaQil($("hs-meta").parentNode);
  }

  function jsonYukla(nom, obyektlar){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(obyektlar, null, 2)], {type: "application/json;charset=utf-8"}));
    a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  /* Fayl tuzilayotganda tugma band holatida; tasdiqlash so'ralmaydi */
  $("ek-yukla").onclick = e => MKB.band(e.currentTarget, async () => {
    const r = await tayyorla();
    if (!r || !r.qatorlar.length){ MKB.toast("Tanlangan davrda yozuv yo'q. Fayl tuzilmadi", "xavf"); return; }
    try{
      if ($("ek-format").value === "json") jsonYukla(r.fayl, r.obyektlar);
      else MKB.csv(r.fayl, r.sarlavhalar, r.qatorlar);
      MKB.toast(r.t.nom + ": " + r.qatorlar.length + " ta yozuv yuklab olindi" + (r.niqob ? ", shaxsiy raqamlar yashirilgan" : ""), "yuklab");
    }catch(err){ MKB.toast("Fayl tuzilmadi: " + (err && err.message ? err.message : "xato"), "xavf"); }
  });
  ["ek-kol", "ek-davr", "ek-ustun", "ek-format"].forEach(id => { $(id).onchange = () => {
    if (id === "ek-kol") history.replaceState(null, "", "?kol=" + sel.value);
    yangila();
  }; });
  await yangila();
}
})();
</script>
</body>
</html>
