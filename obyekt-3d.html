<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — 3D navigator</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
<style>
.sahna3d{position:relative;height:520px;border-radius:var(--r-hero);overflow:hidden;
  background:linear-gradient(168deg,var(--fon-issiq) 0%,var(--fon-sovuq) 58%,var(--fon-mint) 100%);cursor:grab;user-select:none;touch-action:none}
.sahna3d:active{cursor:grabbing}
.sahna3d .zamin{position:absolute;left:50%;top:56%;width:460px;height:460px;translate:-50% -50%;
  transform:rotateX(64deg) rotateZ(var(--burilish,45deg));transform-style:preserve-3d;transition:transform 80ms linear}
.qavat3d{position:absolute;inset:80px;transform-style:preserve-3d;transition:transform var(--sekin),opacity var(--tez)}
.qavat3d .plita{position:absolute;inset:0;border-radius:22px;background:var(--chiziq);
  border:1.5px solid rgba(11,11,10,.22);box-shadow:inset 0 0 34px rgba(11,11,10,.04);transition:background var(--tez),border-color var(--tez)}
.qavat3d:hover .plita{background:rgba(197,242,180,.55);border-color:var(--brend)}
.qavat3d.faol .plita{background:rgba(37,101,26,.55);border-color:var(--brend);box-shadow:0 0 34px rgba(197,242,180,.5)}
.qavat3d .yorliq{position:absolute;left:50%;top:50%;translate:-50% -50%;
  transform:rotateZ(calc(var(--burilish,45deg) * -1)) rotateX(-64deg);
  font:600 13px var(--shrift-mono);color:var(--siyoh);pointer-events:none}
.nav3d-panel{position:absolute;right:18px;top:18px;bottom:18px;width:280px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-radius:22px;padding:20px;color:var(--siyoh);overflow-y:auto;box-shadow:var(--soya)}
.nav3d-panel h3{font:500 15px var(--shrift-displey);margin-bottom:2px}
.nav3d-panel .sub{font-size:12.5px;color:var(--matn-3);margin-bottom:14px}
.nav3d-xona{padding:11px 0;border-bottom:1px solid var(--chiziq-2);font-size:12.5px}
.nav3d-xona b{display:block;font-size:12.5px}
.nav3d-xona span{color:var(--matn-3);font-size:12px}
.nav3d-korsatma{position:absolute;left:20px;bottom:16px;font-size:12.5px;color:var(--matn-3);background:rgba(255,255,255,.8);border-radius:999px;padding:8px 16px}
.nav3d-korsatma b{color:var(--siyoh);font-weight:500}
</style>
</head>
<body data-sahifa="aktivlar">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="obyektlar.html">Aktivlar reyestri</a><span class="ajratgich">/</span><span>Obyekt kartochkasi</span></div>
    <div class="hs-qator"><h1>Obyekt kartochkasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="obyekt.html" data-id-qoshib="1">Umumiy</a><a href="obyekt-moliya.html" data-id-qoshib="1">Moliya</a><a href="obyekt-hujjatlar.html" data-id-qoshib="1">Hujjatlar</a><a href="obyekt-koriklar.html" data-id-qoshib="1">Ko'riklar</a><a href="obyekt-xarajatlar.html" data-id-qoshib="1">Xarajatlar</a><a href="obyekt-galereya.html" data-id-qoshib="1">Galereya</a><a href="obyekt-3d.html" class="faol" data-id-qoshib="1">3D navigator</a><a href="obyekt-qavat.html" data-id-qoshib="1">Qavat rejasi</a><a href="obyekt-tarix.html" data-id-qoshib="1">Tarix</a></nav>
  <section class="foto-shapka" aria-label="Obyekt">
    <img id="fs-rasm" src="" alt="">
    <div>
      <div style="flex:1;min-width:220px">
        <div style="display:flex;gap:8px;margin-bottom:8px" id="fs-chiplar"></div>
        <h2 id="fs-nom">—</h2>
        <div class="fs-meta"><span class="kod-mono" id="fs-id" style="color:rgba(255,255,255,.85)">—</span> · <span id="fs-manzil">—</span></div>
      </div>
      <div id="fs-halqa"></div>
    </div>
  </section>
  <section class="sahna3d" id="sahna3d" aria-label="Bino 3D ko'rinishi">
    <div class="zamin" id="zamin3d"></div>
    <aside class="nav3d-panel" id="nav3d-panel"></aside>
    <div class="nav3d-korsatma"><b>Sudrab</b> aylantiring · <b>qavatni bosib</b> tanlang · <b>ikki bosish</b> — boshlang'ich holat</div>
  </section>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const x = id ? await MKBapi.bitta('YOZUVLAR', id) : null;
  if (!x){ location.replace("xato-404.html"); return; }
  document.getElementById("fs-rasm").src = x.mulk.rasm;
  document.getElementById("fs-nom").textContent = x.mulk.nom;
  document.getElementById("fs-id").textContent = x.id;
  document.getElementById("fs-manzil").textContent = x.mulk.manzil;
  document.getElementById("fs-chiplar").innerHTML =
    "<span class=\"chip chip-brend\">" + x.bosqichNomi + "</span>" +
    "<span class=\"chip chip-siyoh\">" + x.mulk.tur + "</span>";
  document.getElementById("fs-halqa").innerHTML = MKB.halqa(x.qoplash, 74, 6).replace('class="halqa', 'class="halqa katta');
  /* tab havolalariga ?id= ulab qo'yamiz */
  document.querySelectorAll(".bolim-tablar a").forEach(a => {
    if (!a.href.includes("?")) a.href += "?id=" + encodeURIComponent(id);
  });
  document.getElementById("hs-meta").textContent = x.id + " · " + x.filial;

  const xonalar = Object.values(MKB_DATA.XONALAR).filter(v => v.obyektId === x.id);
  const qavatSoni = Math.max(3, ...xonalar.map(v => +v.qavat || 1),
    x.mulk.tur === "Yer uchastkasi" || x.mulk.tur === "Dala hovli" ? 3 : 7);
  const zamin = document.getElementById("zamin3d");
  let faol = qavatSoni;
  function chiz(){
    zamin.innerHTML = Array.from({length: qavatSoni}, (_, i) => {
      const q = i + 1;
      return '<div class="qavat3d' + (q === faol ? ' faol' : '') + '" data-qavat="' + q +
        '" style="transform:translateZ(' + (q * 26) + 'px)">' +
        '<div class="plita"></div><span class="yorliq">' + q + '</span></div>';
    }).join("");
  }
  function panel(){
    const r = xonalar.filter(v => +v.qavat === faol);
    document.getElementById("nav3d-panel").innerHTML =
      '<h3>' + faol + '-qavat</h3><div class="sub">' + x.mulk.qisqa + '</div>' +
      (r.length ? r.map(v =>
        '<div class="nav3d-xona"><b>' + v.nom + '</b>' +
        '<span>' + v.maydon + ' · ulush ' + (v.ulush || "—") + '%</span><br>' +
        '<span>' + (v.holat || "") + '</span></div>').join("")
      : '<div class="nav3d-xona"><b>Ta\'minot predmeti emas</b>' +
        '<span>Bu qavat bo\'yicha bank ulushi yo\'q — umumiy foydalanish</span></div>') +
      '<div style="margin-top:12px"><a class="tugma tugma-kichik tugma-brend" href="obyekt-qavat.html?id=' +
        encodeURIComponent(x.id) + '">' + ik("qavat") + 'Qavat rejasi</a></div>';
  }
  chiz(); panel();

  const sahna = document.getElementById("sahna3d");
  let burilish = 45, bosildi = null;
  sahna.addEventListener("pointerdown", e => { bosildi = {x: e.clientX, b: burilish}; sahna.setPointerCapture(e.pointerId); });
  sahna.addEventListener("pointermove", e => {
    if (!bosildi) return;
    burilish = bosildi.b + (e.clientX - bosildi.x) * 0.45;
    zamin.style.setProperty("--burilish", burilish + "deg");
    zamin.querySelectorAll(".yorliq").forEach(y => y.style.setProperty("--burilish", burilish + "deg"));
  });
  ["pointerup", "pointercancel"].forEach(t => sahna.addEventListener(t, () => bosildi = null));
  sahna.addEventListener("dblclick", () => {
    burilish = 45;
    zamin.style.setProperty("--burilish", "45deg");
    zamin.querySelectorAll(".yorliq").forEach(y => y.style.setProperty("--burilish", "45deg"));
  });
  zamin.addEventListener("click", e => {
    const q = e.target.closest(".qavat3d");
    if (!q) return;
    faol = +q.dataset.qavat;
    chiz(); panel();
  });

});
</script>
</body>
</html>
