<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Tugayotgan polislar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="sugurta">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Sug'urta</span></div>
    <div class="hs-qator"><h1>Tugayotgan polislar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="sugurta.html">Polislar</a><a href="sugurta-tugayotgan.html" class="faol">Tugayotganlar</a><a href="sugurta-davolar.html">Da'volar</a><a href="sugurta-yangilash.html">Yangilash</a></nav>
  <section class="karta"><div class="karta-bosh"><h2>Muddati tugayotgan polislar</h2><span class="soni" id="st-soni"></span></div><div id="st-royxat"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("SUGURTALAR");
  const tugayotgan = r.filter(s => s.holat !== "amalda" ||
    ["sen", "okt", "noy"].some(oy => (s.tugash || "").includes(oy)));
  document.getElementById("st-soni").textContent = tugayotgan.length + " ta";
  document.getElementById("st-royxat").innerHTML = tugayotgan.length ? tugayotgan.map(s =>
    '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--chiziq-2)">' +
      '<span style="width:38px;height:38px;border-radius:10px;background:var(--sariq-fon);color:var(--sariq);display:grid;place-items:center">' + ik("soat") + '</span>' +
      '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px">' + s.obyekt + '</b>' +
      '<span style="font-size:11.5px;color:var(--iz)">' + s.polis + ' · ' + s.kompaniya + '</span></span>' +
      '<span class="chip chip-sariq">' + s.tugash + '</span>' +
      '<a class="tugma tugma-kichik tugma-asosiy" href="sugurta-yangilash.html?id=' + encodeURIComponent(s.id) + '">Yangilash</a>' +
    '</div>').join("")
    : '<div class="bosh-holat">' + ik("tasdiq") + '<b>Yaqin muddatda tugaydigan polis yo\'q</b></div>';
});
</script>
</body>
</html>
