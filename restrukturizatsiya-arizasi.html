<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Restrukturizatsiya arizasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
</head>
<body data-sahifa="portfel">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="restrukturizatsiya.html">Restrukturizatsiya</a><span class="ajratgich">/</span><span>Yangi ariza</span></div>
    <div class="hs-qator"><h1>Restrukturizatsiya arizasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Yangi ariza</h2></div>
  <form id="ra-forma" class="forma-tor">
    <div class="maydon keng"><label class="maydon-yorliq">Qarzdor (yozuv) <b>*</b></label>
      <div class="kirish"><select name="obyektId" id="ra-yozuv"></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Taklif turi <b>*</b></label>
      <div class="kirish"><select name="taklif"><option>Muddatni uzaytirish</option><option>Yangi to'lov grafigi</option><option>Imtiyozli davr</option><option>Qisman kechish</option></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Yangi muddat, oy</label>
      <div class="kirish"><input name="muddat" type="number" min="3" max="60" value="18"></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">Asoslash <b>*</b></label>
      <textarea class="kirish-matn" name="asos" placeholder="Mijozning moliyaviy holati va taklif asosi"></textarea></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" href="restrukturizatsiya.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit">Arizani yuborish</button></div>
  </form></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/chizma.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  document.getElementById("ra-yozuv").innerHTML = yoz.map(y =>
    '<option value="' + y.id + '">' + y.mijoz.nom + " — " + y.shartnoma.raqam + '</option>').join("");
  document.getElementById("ra-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["obyektId", "taklif", "asos"]);
    if (!q) return;
    const y = yoz.find(v => v.id === q.obyektId);
    await MKBapi.yangi("RESTRUKTURIZATSIYA", {
      id: "RS-" + Date.now().toString(36).toUpperCase(),
      obyektId: y.id, mijoz: y.mijoz.nom, shartnoma: y.shartnoma.raqam,
      qarz: y.qarzMatn, kunlar: y.qarz.kunlar,
      taklif: q.taklif + (q.muddat ? " (" + q.muddat + " oy)" : ""),
      sana: new Date().toLocaleDateString("uz"), holat: "korib chiqilmoqda",
    });
    MKB.toast("Ariza ro'yxatga olindi");
    setTimeout(() => location.href = "restrukturizatsiya.html", 700);
  });
});
</script>
</body>
</html>
