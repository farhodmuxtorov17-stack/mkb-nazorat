<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const x = id ? await MKBapi.bitta('YOZUVLAR', id) : null;
  if (!x){ location.replace("xato-404.html"); return; }
  document.getElementById("fs-rasm").src = x.mulk.rasm;
  document.getElementById("fs-nom").textContent = x.mulk.nom;
  document.getElementById("fs-id").textContent = x.id;
  document.getElementById("fs-manzil").textContent = x.mulk.manzil;
  document.getElementById("fs-chiplar").innerHTML =
    "<span class=\"chip chip-brend\">" + x.bosqichNomi + "</span>" +
    "<span class=\"chip chip-siyoh\">" + x.mulk.tur + "</span>";
  const fsIndeks = MKB_DATA.nazoratIndeksi(x);
  document.getElementById("fs-halqa").innerHTML = MKB.halqa(fsIndeks.ball, 74, 6)
    .replace('class="halqa', 'class="halqa katta');
  document.getElementById("fs-halqa").title = "Nazorat indeksi: " + fsIndeks.darajaNomi;
  /* tab havolalariga ?id= ulab qo'yamiz */
  document.querySelectorAll(".bolim-tablar a, [data-id-qoshib]").forEach(a => {
    if (!a.href.includes("?")) a.href += "?id=" + encodeURIComponent(id);
  });
  document.getElementById("hs-meta").textContent = x.id + " · " + x.filial;

  document.getElementById("mo-asosiy").textContent = x.asosiyMatn;
  document.getElementById("mo-foiz").textContent = x.foizMatn;
  /* Balansda turgan muddat qabul sanasidan hisoblanadi ("17-sen, 2026" yoki "21.11.2025");
     sana o'qilmasa, yozuvdagi kunlar ko'rsatiladi */
  function balansKunlari(y){
    const OY = {yan: 0, fev: 1, mar: 2, apr: 3, may: 4, iyn: 5, iyl: 6, avg: 7, sen: 8, okt: 9, noy: 10, dek: 11};
    const t = String(y.mulk.qabul || "").trim();
    let m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(t), d = null;
    if (m) d = new Date(+m[3], +m[2] - 1, +m[1]);
    else if ((m = /^(\d{1,2})-([a-z']+),?\s*(\d{4})$/i.exec(t)) && OY[m[2].toLowerCase()] !== undefined)
      d = new Date(+m[3], OY[m[2].toLowerCase()], +m[1]);
    if (!d) return y.qarz.kunlar;
    /* ma'lumot bazasi sanasigacha qabul qilinganlar shu sanaga, keyingilari bugungi kunga nisbatan */
    const baza = new Date(2026, 7, 26);
    const nuqta = d > baza ? new Date() : baza;
    return Math.max(0, Math.floor((nuqta - d) / 864e5));
  }
  /* balansdagi obyektda qarz emas, balans qiymati va balansda turgan muddat ko'rsatiladi */
  const balansdami = ["musodara", "balans"].includes(x.ish.bosqich);
  document.getElementById("mo-jami-yorliq").textContent = balansdami ? "Balans qiymati" : "Jami qarz";
  document.getElementById("mo-kun-yorliq").textContent = balansdami ? "Balansda" : "Kechikish";
  document.getElementById("mo-jami").textContent = x.qarzMatn;
  document.getElementById("mo-kun").innerHTML = (balansdami ? balansKunlari(x) : x.qarz.kunlar) + "<small>kun</small>";
  const t = x.tolov || [];
  document.getElementById("tolov-grafik").innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:6px;height:110px">' +
    t.map((v, i) => '<div style="flex:1;border-radius:12px 12px 4px 4px;height:' +
      (v ? 62 + ((i * 7) % 34) : 16) + '%;background:' + (v ? 'var(--siyoh)' : 'var(--xavf)') +
      ';opacity:' + (v ? .85 : 1) + '" title="' + (i + 1) + '-oy"></div>').join("") + '</div>';
  const otk = t.filter(v => !v).length;
  document.getElementById("tolov-chap").textContent = (t.length - otk) + " ta to'lov o'z vaqtida";
  document.getElementById("tolov-ong").textContent = otk + " ta o'tkazib yuborilgan";
  const b = (await MKBapi.royxat("BAHOLASHLAR")).filter(v => v.obyektId === x.id);
  document.getElementById("baholash-royxat").innerHTML = b.length ? b.map(v =>
    '<div class="qator">' +
      '<span style="width:34px;height:34px;border-radius:14px;background:var(--varaq-2);display:grid;place-items:center;color:var(--qalam)">' + ik("baholash") + '</span>' +
      '<span class="matn"><b>' + v.baholovchi + '</b>' +
      '<span style="font-size:12.5px;color:var(--matn-3)">' + v.usul + ' · ' + v.sana + '</span></span>' +
      (v.qiymat ? '<span class="pul">' + MKB.fmt(v.qiymat) + ' mln</span>' +
      '<span class="delta ' + (v.qiymat >= (v.avvalgi || v.qiymat) ? 'ijobiy">↑' : 'salbiy">↓') + '</span>'
        : '<span class="chip chip-sariq">kutilmoqda</span>') + '</div>').join("")
    : '<div class="bosh-holat">' + ik("baholash") + '<b>Baholash o\'tkazilmagan</b><span>Buyurtma yaratish uchun Baholash bo\'limiga o\'ting</span></div>';

});
</script>
