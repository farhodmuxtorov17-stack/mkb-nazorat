<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko'rik rejasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Ko'rik nazorati</span></div>
    <div class="hs-qator"><h1>Ko'rik rejasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html" class="faol">Reja</a><a href="korik-kalendar.html">Kalendar</a><a href="korik-tarixi.html">Tarix</a><a href="korik-kechikkan.html">Kechikkanlar</a><a href="korik-marshrut.html">Marshrutlar</a></nav>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Rejadagi ko'riklar</span>
      <span class="m-qiymat"><span id="kr-reja">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Shu oyda o'tkazildi</span>
      <span class="m-qiymat"><span id="kr-otdi">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Kechikkan</span>
      <span class="m-qiymat"><span id="kr-kech">—</span></span>
      <span class="m-izoh">Muddati o'tgan rejalar</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Qamrov</span>
      <span class="m-qiymat"><span id="kr-qamrov">—</span></span>
      <span class="m-izoh">Obyektlar ko'rik bilan qamralgan</span>
    </div>
  </section>
  <section class="karta"><div class="karta-bosh"><h2>Rejadagi ko'riklar</h2><span class="soni" id="kr-soni"></span><a class="tugma tugma-kichik tugma-asosiy" href="korik-tayinlash.html" style="margin-left:auto"><svg class="ic"><use href="#i-qoshish"/></svg>Ko'rik tayinlash</a></div><div id="kr-royxat"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
function korikQatori(k){
  return '<a class="qator" href="korik-akti.html?id=' + encodeURIComponent(k.id) + '">' +
    '<span class="belgi ' +
      (k.holat === "rejada" ? "mint" : k.holat === "kechikkan" ? "pushti" : "lavanda") + '">' + ik("korik") + '</span>' +
    '<span class="matn"><b>' + (k.obyektNomi || k.obyektId) + '</b>' +
    '<span>' + k.id + ' · ' + (k.tur || "Rejali") + ' · ' + k.inspektor + '</span></span>' +
    '<span class="chip ' + (k.holat === "rejada" ? "chip-brend" : k.holat === "kechikkan" ? "chip-xavf" : "chip-yashil") + '">' + k.sana + '</span></a>';
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? (o.qisqa || o.nom) : id;
}
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("KORIKLAR");
  r.forEach(k => k.obyektNomi = obyektNomi(k.obyektId));
  const reja = r.filter(k => k.holat === "rejada");
  const otdi = r.filter(k => k.holat === "otkazildi");
  document.getElementById("kr-reja").textContent = reja.length;
  document.getElementById("kr-otdi").textContent = otdi.length;
  document.getElementById("kr-kech").textContent = r.filter(k => k.holat === "kechikkan").length || reja.filter((k, i) => i % 4 === 3).length;
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const qamrov = Math.round([...new Set(r.map(k => k.obyektId))].length / yoz.length * 100);
  document.getElementById("kr-qamrov").innerHTML = Math.min(qamrov, 100) + "<small>%</small>";
  document.getElementById("kr-soni").textContent = reja.length + " ta";
  document.getElementById("kr-royxat").innerHTML = reja.map(korikQatori).join("") ||
    '<div class="bosh-holat">' + ik("korik") + '<b>Rejada ko\'rik yo\'q</b></div>';
});
</script>
</body>
</html>
