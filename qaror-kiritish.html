<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Sud qarorini kiritish</title>
<link rel="stylesheet" href="yadro/app.css?v=26091814">
</head>
<body data-sahifa="yuridik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="undiruv.html">Undiruv va sud</a><span class="ajratgich">/</span><span>Qaror</span></div>
    <div class="hs-qator"><h1>Sud qarorini kiritish</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Sud qarorini kiritish</h2></div>
  <form id="qr-forma" class="forma-tor">
    <div class="maydon keng"><label class="maydon-yorliq">Ish <b>*</b></label>
      <div class="kirish"><select name="obyektId" id="qr-yozuv"></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Qaror raqami <b>*</b></label>
      <div class="kirish"><input name="raqam" placeholder="2-1234/2026"></div></div>
    <div class="maydon"><label class="maydon-yorliq">Qaror sanasi <b>*</b></label>
      <div class="kirish"><input name="sana" placeholder="kk.oo.yyyy"></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">Xulosa <b>*</b></label>
      <textarea class="kirish-matn" name="xulosa" placeholder="Sud xulosasi: da'vo qanoatlantirildi..."></textarea></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" href="undiruv.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit"><svg class="ic"><use href="#i-muhr"/></svg>Qarorni saqlash</button></div>
  </form></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26091814"></script>
<script src="malumot.js?v=26091814"></script>
<script src="malumot-qoshimcha.js?v=26091814"></script>
<script src="malumot-kengaytma.js?v=26091814"></script>
<script src="malumot-kirish.js?v=26091814"></script>
<script src="malumot-indeks.js?v=26091814"></script>
<script src="tarjima.js?v=26091814"></script>
<script src="yadro/ikonlar.js?v=26091814"></script>
<script src="yadro/daraxt.js?v=26091814"></script>
<script src="yadro/chizma.js?v=26091814"></script>
<script src="yadro/qollanma.js?v=26091814"></script>
<script src="yadro/api.js?v=26091814"></script>
<script src="yadro/app.js?v=26091814"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const oldindan = new URLSearchParams(location.search).get("id");
  const tartib = MKB_DATA.BOSQICHLAR.map(b => b.kalit);
  const tanlangan = oldindan ? yoz.find(y => y.id === oldindan) : null;
  /* ro'yxat: da'vo/sud bosqichidagi ishlar + havola orqali kelgan ish (bosqichidan qat'i nazar) */
  const royxat = yoz.filter(y => ["sud", "davo"].includes(y.ish.bosqich));
  if (tanlangan && !royxat.includes(tanlangan)) royxat.unshift(tanlangan);
  const sel = document.getElementById("qr-yozuv");
  sel.innerHTML = (tanlangan ? "" : '<option value="">Ishni tanlang</option>') + royxat.map(y =>
    '<option value="' + y.id + '"' + (y.id === oldindan ? ' selected' : '') + '>' +
    y.ish.raqam + " — " + y.mijoz.nom + " · " + y.bosqichNomi + '</option>').join("");
  const meta = () => {
    const y = yoz.find(v => v.id === sel.value);
    document.getElementById("hs-meta").textContent = y ? y.ish.raqam + " · " + y.bosqichNomi : "—";
  };
  sel.addEventListener("change", meta); meta();
  tarjimaQil(sel);
  document.getElementById("qr-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["obyektId", "raqam", "sana", "xulosa"]);
    if (!q) return;
    const y = yoz.find(v => v.id === q.obyektId);
    if (!y) return;
    const joriy = tartib.indexOf(y.ish.bosqich);
    if (joriy < tartib.indexOf("davo")){
      MKB.toast("Avval da'vo arizasi ro'yxatga olinishi kerak", "xavf");
      return;
    }
    const tarix = (y.ish.tarix || []).concat([[q.sana, "Sud qarori qabul qilindi", q.raqam + ": " + q.xulosa.slice(0, 90)]]);
    /* qarordan keyingi bosqichdagi ish orqaga qaytarilmaydi — faqat qaror rekvizitlari yoziladi */
    const oldinga = joriy < tartib.indexOf("qaror");
    await MKBapi.yangilash("YOZUVLAR", y.id, Object.assign({
      ish: Object.assign({}, y.ish, {qaror: q.raqam, tarix}, oldinga ? {bosqich: "qaror"} : {})},
      oldinga ? {bosqichNomi: "Sud qarori"} : {}));
    MKB.toast(q.raqam + " raqamli qaror kiritildi");
    setTimeout(() => location.href = "ish.html?id=" + encodeURIComponent(y.id), 700);
  });
});
</script>
</body>
</html>
