<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Tashrif</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.tor-2>*,.ustun>*{min-width:0}
.kadr{position:relative;border-radius:var(--r-orta);overflow:hidden;background:var(--qora-yuza);min-height:260px}
.kadr img{display:block;width:100%;height:320px;object-fit:cover}
.kadr .kadr-izoh{position:absolute;left:14px;bottom:14px;background:rgba(10,10,12,.72);color:var(--qora-matn);font-size:12.5px;padding:6px 12px;border-radius:99px}
.video-panel.kadr-bosh{min-height:260px}
.kamera-holat{font-size:12.5px;color:var(--matn-3);margin-top:10px;line-height:1.5}
.taymer{font:500 44px/1 var(--shrift-displey);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.taymer-izoh{font-size:13px;color:var(--matn-3);margin-top:6px}
.amal-qator{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.qayd-forma{display:flex;gap:10px;margin-top:12px;align-items:stretch}
.qayd-forma .kirish{flex:1}
.shaxs-bosh{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.shaxs-bosh b{display:block;font-size:17px;font-weight:500}
.shaxs-bosh span{font-size:13px;color:var(--matn-3)}
@media (max-width:720px){.qayd-forma{flex-direction:column}.qayd-forma .kirish{flex:none}.kadr img{height:220px}}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Himoya va monitoring</a><span class="ajratgich">/</span><a href="tashriflar.html">Tashriflar</a><span class="ajratgich">/</span><span data-tarjimasiz id="hs-kod">—</span></div>
    <div class="hs-qator"><h1 id="tj-nom">Tashrif</h1><span class="hs-meta" id="hs-meta">—</span>
      <div class="hs-amallar" id="tj-amallar" data-tur="tashrif-jonli-amallar"></div></div>
  </div>
  <div class="tor-2" id="tj-tor">
    <div class="ustun">
      <section class="karta" aria-labelledby="tj-k-s">
        <div class="karta-bosh"><h2 id="tj-k-s">Obyektda</h2><span class="soni" id="tj-obyekt"></span></div>
        <div id="tj-kadr"></div>
        <p class="kamera-holat" id="tj-kamera"></p>
      </section>
      <section class="karta" aria-labelledby="tj-j-s" data-tur="tashrif-jonli-jurnal">
        <div class="karta-bosh"><h2 id="tj-j-s">Faollik jurnali</h2></div>
        <div id="tj-jurnal"></div>
        <div class="qayd-forma" id="tj-qayd" hidden>
          <div class="kirish"><input id="tj-qayd-m" name="qayd" maxlength="200" minlength="3" required data-xato="Kamida 3 ta belgi yozing" placeholder="Masalan: xaridor 2-qavatni ko'rdi" aria-label="Qayd matni"></div>
          <button type="button" class="tugma tugma-oq" id="tj-qayd-t" data-yozadi data-tur="tashrif-jonli-qayd"><svg class="ic"><use href="#ik-qoshish"/></svg><span>Qayd qo'shish</span></button>
        </div>
      </section>
    </div>
    <div class="ustun">
      <section class="karta" aria-labelledby="tj-t-s" data-tur="tashrif-jonli-vaqt">
        <div class="karta-bosh"><h2 id="tj-t-s">Vaqt</h2></div>
        <div id="tj-taymer"></div>
      </section>
      <section class="karta" aria-labelledby="tj-s-s">
        <div class="karta-bosh"><h2 id="tj-s-s">Tashrifchi</h2></div>
        <div id="tj-shaxs"></div>
      </section>
      <section class="karta" aria-labelledby="tj-r-s">
        <div class="karta-bosh"><h2 id="tj-r-s">Ruxsat</h2></div>
        <div id="tj-ruxsat"></div>
      </section>
    </div>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(async () => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  const yuklandi = await new Promise(hal => MKB.sahifaYukla({
    joylar: {"tj-kadr": ["karta", 1], "tj-jurnal": ["qator", 3], "tj-shaxs": ["qator", 2], "tj-ruxsat": ["qator", 2]},
    xato: "Tashrif ma'lumotini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["TASHRIFLAR", "SHAXSLAR", "RUXSATLAR", "QURILMALAR", "KIRISH_VOQEALARI"]);
      ulandi = true;
      hal(true);
    },
  }));
  if (!yuklandi) return;
  /* Yangi kiritilgan shaxs indeksda bo'lmasligi mumkin: to'plamdan ham qidiriladi */
  const shaxsTop = id => D.shaxs(id) || (D.SHAXSLAR || []).find(s => s.id === id) || null;

  const id = new URLSearchParams(location.search).get("id");
  let t = (D.TASHRIFLAR || []).find(x => x.id === id);
  if (!t || !MKB.doira([t]).length){ location.replace("xato-404.html"); return; }
  const sh = shaxsTop(t.shaxsId), y = D.topish(t.obyektId);
  const yozadi = MKB.huquq("himoya", "yoz");
  const HOL = {kutilmoqda: ["Kutilmoqda", "chip-sariq"], obyektda: ["Obyektda", "chip-kok"], yakunlandi: ["Yakunlandi", "chip-kul"], "bekor qilingan": ["Bekor qilingan", "chip-kul"]};
  const joriy = () => (D.TASHRIFLAR || []).find(x => x.id === id) || t;

  /* Joriy vaqt: tizim sanasi va soat */
  const hozir = () => { const b = D.bugun(), n = new Date(); return new Date(b.getFullYear(), b.getMonth(), b.getDate(), n.getHours(), n.getMinutes(), n.getSeconds()); };
  const kirishVaqti = () => { if (!t.kirish) return null; const d = D.sanaOqi(t.sana); if (!d) return null; const [h, m] = String(t.kirish).split(":").map(Number); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h || 0, m || 0); };

  function shapka(){
    t = joriy();
    const h = HOL[t.holat] || [t.holat, "chip-kul"];
    $("hs-kod").textContent = t.id;
    $("tj-nom").textContent = sh ? sh.ism : "Tashrif";
    $("hs-meta").innerHTML = '<span class="chip ' + h[1] + '">' + h[0] + "</span> <span>" + esc(t.maqsad || "") + "</span>";
    $("tj-amallar").innerHTML = !yozadi ? "" : t.holat === "kutilmoqda"
      ? '<button type="button" class="tugma tugma-oq" id="tj-bekor" data-yozadi data-tur="tashrif-jonli-bekor">' + ik("yopish") + "<span>Bekor qilish</span></button>" +
        '<button type="button" class="tugma tugma-asosiy" id="tj-kirdi" data-yozadi data-tur="tashrif-jonli-kirish">' + ik("eshik") + "<span>Kirishni qayd etish</span></button>"
      : t.holat === "obyektda" ? '<a class="tugma tugma-asosiy" href="tashrif-chiqish.html?id=' + encodeURIComponent(t.id) + '">' + ik("chiqish") + "<span>Chiqishni rasmiylashtirish</span></a>"
      : t.holat === "yakunlandi" ? '<a class="tugma tugma-oq" href="tashrif-chiqish.html?id=' + encodeURIComponent(t.id) + '">' + ik("hujjat") + "<span>Chiqish dalolatnomasi</span></a>" : "";
    tarjimaQil(document.querySelector(".hujjat-shapka"));
    const kb = $("tj-kirdi"); if (kb) kb.addEventListener("click", () => kirdi(kb));
    const bb = $("tj-bekor"); if (bb) bb.addEventListener("click", bekor);
    $("tj-qayd").hidden = !(yozadi && t.holat === "obyektda");
  }

  function kadr(){
    $("tj-obyekt").innerHTML = y ? '<a href="obyekt-himoya.html?id=' + encodeURIComponent(y.id) + '">' + esc(y.qisqa || y.nom) + "</a>" : "";
    const kam = (D.QURILMALAR || []).filter(q => q.obyektId === t.obyektId && q.tur === "kamera-4G");
    const onl = kam.filter(q => (D.qurilmaHolati(q) || {}).holat === "onlayn");
    const surat = y && (y.rasm || (y.rasmlar || []).length);
    $("tj-kadr").innerHTML = surat ? '<div class="kadr">' + MKB.obyektSurati(y, {sinf: "kadr-surat"}) + '<span class="kadr-izoh">Obyekt surati · jonli kadr emas</span></div>'
      : '<div class="video-panel kadr-bosh">' + ik("kamera") + "<b>" + (kam.length ? "Video tizimga ulanmagan" : "Kamera yo'q") + "</b><span>" +
        (kam.length ? "Obyekt kamerasi videosi kamera ilovasida ko'riladi." : "Bu obyektda kamera o'rnatilmagan.") + "</span></div>";
    $("tj-kamera").innerHTML = kam.length ? "<span>Obyektdagi kameralar:</span> <b data-tarjimasiz>" + kam.length + "</b>, <span>aloqada:</span> <b data-tarjimasiz>" + onl.length + "</b>. <span>Jonli video tizimga ulanmagan.</span>"
      : (surat ? "<span>Obyektda kamera yo'q.</span> " : "") + (yozadi ? '<a href="qurilma-ornatish.html?obyekt=' + encodeURIComponent(t.obyektId) + '&tur=kamera-4G">Kamera o\'rnatish</a>' : "");
    tarjimaQil($("tj-kadr")); tarjimaQil($("tj-kamera"));
  }

  let soat = null;
  function taymer(){
    t = joriy();
    const k = kirishVaqti();
    let html;
    if (t.holat === "obyektda" && k){
      const daq = Math.max(0, Math.floor((hozir() - k) / 60000));
      html = '<div class="taymer" data-tarjimasiz>' + String(Math.floor(daq / 60)).padStart(2, "0") + ":" + String(daq % 60).padStart(2, "0") + '</div><div class="taymer-izoh"><span>Kirgan vaqti:</span> <b data-tarjimasiz>' + esc(t.sana + " " + t.kirish) + "</b></div>";
    } else if (t.holat === "kutilmoqda") html = '<div class="taymer-izoh" style="margin:0"><span>Rejadagi sana:</span> <b data-tarjimasiz>' + esc(t.sana || "—") + "</b>. <span>Tashrifchi hali kelmagan.</span></div>";
    else html = '<dl class="malumot-royxat"><dt>Kirish</dt><dd data-tarjimasiz>' + esc((t.sana || "") + " " + (t.kirish || "—")) + "</dd><dt>Chiqish</dt><dd data-tarjimasiz>" + esc(t.chiqish || "—") + "</dd><dt>Davomiylik</dt><dd data-tarjimasiz>" + esc(t.davomiylik || "—") + "</dd></dl>";
    $("tj-taymer").innerHTML = html;
    tarjimaQil($("tj-taymer"));
  }

  function shaxs(){
    const hujjat = sh && sh.hujjat ? String(sh.hujjat).replace(/\d(?=\d{3})/g, "•") : "—";
    $("tj-shaxs").innerHTML = sh ? '<div class="shaxs-bosh">' + MKB.kn.shaxsSurati(sh, 52) + "<div><b>" + esc(sh.ism) + "</b><span>" + esc([sh.lavozim, sh.tashkilot].filter(Boolean).join(" · ")) + "</span></div></div>" +
      '<dl class="malumot-royxat"><dt>Hujjat</dt><dd data-tarjimasiz>' + esc(hujjat) + "</dd><dt>Telefon</dt><dd data-tarjimasiz>" + esc(sh.tel || "—") + "</dd><dt>Hamroh</dt><dd>" + esc(t.hamroh || "Hamrohsiz") + "</dd></dl>"
      : MKB.boshHolat("foyd", "Shaxs topilmadi");
    tarjimaQil($("tj-shaxs"));
    const b = D.bugun();
    const r = (D.RUXSATLAR || []).filter(x => x.shaxsId === t.shaxsId && x.obyektId === t.obyektId).sort((a, c) => (D.sanaOqi(c.tugash) || 0) - (D.sanaOqi(a.tugash) || 0))[0];
    const amalda = r && r.holat === "amalda" && (!D.sanaOqi(r.tugash) || D.sanaOqi(r.tugash) >= b);
    $("tj-ruxsat").innerHTML = r ? '<dl class="malumot-royxat"><dt>Ruxsat</dt><dd><span data-tarjimasiz>' + esc(r.id) + '</span> <span class="chip chip-kichik ' + (amalda ? "chip-yashil" : "chip-xavf") + '">' + (amalda ? "Amalda" : "Amalda emas") + "</span></dd>" +
      "<dt>Daraja</dt><dd>" + esc(r.daraja || "—") + "</dd><dt>Usul</dt><dd>" + esc(r.usul || "—") + '</dd><dt>Muddat</dt><dd data-tarjimasiz>' + esc((r.boshlanish || "") + " – " + (r.tugash || "")) + "</dd></dl>"
      : MKB.boshHolat("ruxsat", "Ruxsat berilmagan", "Tashrifchiga shu obyektga ruxsat rasmiylashtirilmagan");
    tarjimaQil($("tj-ruxsat"));
  }

  /* Jurnal: kirish/chiqish voqealari, qo'lda qaydlar (izoh qatorlari) va amallar tarixi */
  async function jurnal(){
    t = joriy();
    const qatorlar = [];
    String(t.izoh || "").split("\n").filter(Boolean).forEach(s => { const m = /^(\d{1,2}:\d{2}) · (.*)$/.exec(s); qatorlar.push({vaqt: m ? m[1] : "", matn: m ? m[2] : s, ik: "tahrir", kim: ""}); });
    (D.KIRISH_VOQEALARI || []).filter(v => v.obyektId === t.obyektId && v.shaxsId === t.shaxsId && v.sana === t.sana)
      .forEach(v => qatorlar.push({vaqt: v.soat, matn: (v.yonalish === "chiqish" ? "Chiqdi" : "Kirdi") + " · " + (v.nuqtaNomi || "") + " · " + (v.usul || ""), ik: v.yonalish === "chiqish" ? "chiqish" : "eshik", kim: ""}));
    if (t.kirish && !qatorlar.some(q => q.vaqt === t.kirish && /^Kirdi/.test(q.matn))) qatorlar.push({vaqt: t.kirish, matn: "Kirish qayd etildi", ik: "eshik", kim: t.hamroh || ""});
    if (t.chiqish && !qatorlar.some(q => q.vaqt === t.chiqish && /^Chiqdi/.test(q.matn))) qatorlar.push({vaqt: t.chiqish, matn: "Chiqish qayd etildi", ik: "chiqish", kim: ""});
    qatorlar.sort((a, b) => String(b.vaqt).localeCompare(String(a.vaqt)));
    $("tj-jurnal").innerHTML = qatorlar.length ? qatorlar.map(q => '<div class="qator"><span class="belgi">' + ik(q.ik) + '</span><span class="matn"><b>' + esc(q.matn) + "</b>" + (q.kim ? "<span>" + esc(q.kim) + "</span>" : "") +
      '</span><span class="ong"><span class="vaqt" data-tarjimasiz>' + esc(q.vaqt) + "</span></span></div>").join("")
      : MKB.boshHolat("soat", "Jurnal bo'sh", t.holat === "kutilmoqda" ? "Tashrifchi kelganda kirish qayd etiladi" : "");
    tarjimaQil($("tj-jurnal"));
  }
  $("tj-qayd-t").addEventListener("click", () => MKB.band($("tj-qayd-t"), async () => {
    const el = $("tj-qayd-m"), m = el.value.trim();
    if (m.length < 3){ MKB.maydonXato(el, "Kamida 3 ta belgi yozing"); el.focus(); return; }
    MKB.maydonXato(el, null);
    t = joriy();
    const ok = await MKB.saqla(() => MKBapi.yangilash("TASHRIFLAR", t.id, {izoh: [t.izoh, MKB.soat() + " · " + m + " (" + MKB.kim() + ")"].filter(Boolean).join("\n")}), "Qayd saqlandi");
    if (ok){ el.value = ""; jurnal(); }
  }));
  $("tj-qayd-m").addEventListener("keydown", e => { if (e.key === "Enter") $("tj-qayd-t").click(); });

  /* Kirish darhol yoziladi; xato bosilgan bo'lsa qaytarish tugmasi yozuvni va jurnal voqeasini bekor qiladi */
  async function kirdi(tugma){
    const b = D.bugun(), s = MKB.soat();
    const n = D.obyektNuqtalari(t.obyektId)[0];
    const eski = {holat: t.holat, sana: t.sana, kirish: t.kirish || ""};
    let vid = null;
    const ok = await MKB.band(tugma, () => MKB.saqla(async () => {
      await MKBapi.yangilash("TASHRIFLAR", t.id, {holat: "obyektda", sana: D.sanaYoz(b), kirish: s});
      vid = await MKB.keyingiId("KIRISH_VOQEALARI", "KV-", 5);
      await MKBapi.yangi("KIRISH_VOQEALARI", {id: vid, vaqt: D.sanaYoz(b) + " " + s, sana: D.sanaYoz(b), soat: s, obyektId: t.obyektId, kirishNuqtaId: n ? n.id : null, qurilmaId: null,
        nuqtaNomi: n ? n.nom : "Obyekt", shaxsId: t.shaxsId, usul: "Xodim qaydi", yuzMoslik: null, natija: "ruxsat", sabab: "Tashrif " + t.id + ", hamroh: " + (t.hamroh || MKB.kim()), yonalish: "kirish"});
    }));
    if (!ok) return;
    hammasi();
    MKB.qaytarish("Kirish qayd etildi: " + s, {
      muddat: 10000,
      bekor: async () => {
        await MKBapi.yangilash("TASHRIFLAR", t.id, eski);
        if (vid) await MKBapi.ochir("KIRISH_VOQEALARI", vid);
      },
      keyin: () => hammasi(),
    });
  }
  async function bekor(){
    const r = await MKB.tasdiqla({
      sarlavha: "Tashrifni bekor qilish",
      matn: "Tashrif bekor qilingan deb belgilanadi. Tashrifchi obyektga shu tashrif bo'yicha kirmaydi.",
      tafsilot: [["Tashrifchi", sh ? sh.ism : "—"], ["Obyekt", y ? (y.qisqa || y.nom) : t.obyektId], ["Sana", {matn: t.sana || "—", tarjimasiz: true}], ["Maqsad", t.maqsad || "—"]],
      ton: "xavfli", sabab: {majburiy: true, min: 5, maks: 200, yorliq: "Bekor qilish sababi", namuna: "Masalan: xaridor kelmadi"},
      okMatn: "Tashrifni bekor qilish", bekorMatn: "Orqaga",
      bajar: ({sabab}) => MKBapi.yangilash("TASHRIFLAR", t.id, {holat: "bekor qilingan", izoh: [t.izoh, MKB.soat() + " · Bekor qilindi: " + sabab + " (" + MKB.kim() + ")"].filter(Boolean).join("\n")}),
    });
    if (!r) return;
    MKB.toast("Tashrif " + t.id + " bekor qilindi");
    hammasi();
  }
  function hammasi(){ shapka(); kadr(); taymer(); shaxs(); jurnal(); }
  hammasi();
  soat = setInterval(taymer, 30000);
})();
</script>
</body>
</html>
