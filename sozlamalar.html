<body data-sahifa="sozlama">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Sozlamalar</span></div>
    <div class="hs-qator"><h1>Sozlamalar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="sozlamalar.html" class="faol">Profil</a><a href="sozlama-xavfsizlik.html">Xavfsizlik</a><a href="foydalanuvchilar.html">Foydalanuvchilar</a><a href="rollar.html">Rollar</a><a href="filiallar.html">Filiallar</a><a href="malumotnomalar.html">Ma'lumotnomalar</a><a href="amallar-tarixi.html">Amallar tarixi</a><a href="integratsiyalar.html">Integratsiyalar</a></nav>
  <section class="karta" style="max-width:680px"><div class="karta-bosh"><h2>Shaxsiy profil</h2></div>
  <form id="pr-forma" class="forma-tor">
    <div class="maydon"><label class="maydon-yorliq">F.I.Sh.</label>
      <div class="kirish"><input name="ism" id="pr-ism"></div></div>
    <div class="maydon"><label class="maydon-yorliq">Lavozim</label>
      <div class="kirish"><input name="rol" id="pr-rol" readonly></div></div>
    <div class="maydon"><label class="maydon-yorliq">Filial</label>
      <div class="kirish"><input name="filial" id="pr-filial" readonly></div></div>
    <div class="maydon"><label class="maydon-yorliq">Telefon</label>
      <div class="kirish"><input name="tel" id="pr-tel" placeholder="+998 __ ___ __ __"></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">Email</label>
      <div class="kirish"><input name="email" id="pr-email" placeholder="ism.familiya@mkbank.uz"></div></div>
    <div class="keng" style="display:flex;justify-content:flex-end">
      <button class="tugma tugma-asosiy" type="submit">Profilni saqlash</button></div>
  </form></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082780"></script>
<script src="malumot.js?v=26082780"></script>

<script src="tarjima.js?v=26082780"></script>
<script src="yadro/ikonlar.js?v=26082780"></script>
<script src="yadro/daraxt.js?v=26082780"></script>
<script src="yadro/chizma.js?v=26082780"></script>
<script src="yadro/qollanma.js?v=26082780"></script>
<script src="yadro/api.js?v=26082780"></script>
<script src="yadro/app.js?v=26082780"></script>
<script>
document.addEventListener("mkb:tayyor", () => {
  const s = MKBapi.sessiya() || {};
  const saqlangan = JSON.parse(localStorage.getItem("mkb4-profil") || "{}");
  document.getElementById("pr-ism").value = saqlangan.ism || s.ism || "";
  document.getElementById("pr-rol").value = s.rol || "";
  document.getElementById("pr-filial").value = s.filial || "";
  document.getElementById("pr-tel").value = saqlangan.tel || "";
  document.getElementById("pr-email").value = saqlangan.email || "";
  document.getElementById("pr-forma").addEventListener("submit", e => {
    e.preventDefault();
    const q = MKB.forma(e.target);
    localStorage.setItem("mkb4-profil", JSON.stringify(q));
    const sess = MKBapi.sessiya();
    if (sess && q.ism){ sess.ism = q.ism; localStorage.setItem("mkb4-sessiya", JSON.stringify(sess)); }
    MKB.toast("Profil saqlandi");
  });
});
</script>
</body>
</html>
