<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Aktivlar tasnifi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082620">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="zaxira">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Tasnif va zaxira</span></div>
    <div class="hs-qator"><h1>Aktivlar tasnifi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="tasniflash.html" class="faol">Tasniflash</a><a href="zaxira-hisobi.html">Zaxira hisobi</a><a href="tasnif-dinamika.html">Dinamika</a><a href="tasnif-tasdiqlash.html">Tasdiqlash</a></nav>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Jami zaxira</span>
      <span class="m-qiymat"><span id="z-jami">—</span></span>
      <span class="m-izoh">Tasnif bo'yicha hisoblangan</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Portfelga nisbat</span>
      <span class="m-qiymat"><span id="z-nisbat">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Yuqori toifa (50%+)</span>
      <span class="m-qiymat"><span id="z-yuqori">—</span></span>
      <span class="m-izoh">Shubhali va umidsiz</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Qayta tasniflandi</span>
      <span class="m-qiymat"><span id="z-oy">—</span></span>
      <span class="m-izoh">Joriy oyda</span>
    </div>
  </section>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082620"></script>
<script src="malumot-qoshimcha.js?v=26082620"></script>
<script src="tarjima.js?v=26082620"></script>
<script src="yadro/ikonlar.js?v=26082620"></script>
<script src="yadro/daraxt.js?v=26082620"></script>
<script src="yadro/chizma.js?v=26082620"></script>
<script src="yadro/api.js?v=26082620"></script>
<script src="yadro/app.js?v=26082620"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  let yoz = await MKBapi.royxat("YOZUVLAR");
  function metrikalar(){
    const zaxira = yoz.reduce((a, y) => a + MKB.sonQiymat(y.zaxira), 0);
    const qarz = yoz.reduce((a, y) => a + MKB.sonQiymat(y.qarzSon), 0);
    document.getElementById("z-jami").innerHTML = MKB.fmt(Math.round(zaxira)) + "<small>mln so'm</small>";
    document.getElementById("z-nisbat").innerHTML = Math.round(zaxira / qarz * 100) + "<small>%</small>";
    document.getElementById("z-yuqori").textContent = yoz.filter(y => y.tasnif && y.tasnif.zaxira >= 50).length;
    document.getElementById("z-oy").textContent = yoz.filter(y => y.qaytaTasnif).length;
  }
  metrikalar();
  const jadval = MKB.jadval("jadval-joy", {
    qatorlar: yoz.map(y => ({id: y.id, obyekt: y.mulk.qisqa, kunlar: y.qarz.kunlar,
      qarzN: MKB.sonQiymat(y.qarzSon), qarzMatn: y.qarzMatn,
      toifa: y.tasnif ? y.tasnif.nom : "—", stavka: y.tasnif ? y.tasnif.zaxira : 0,
      zaxiraN: MKB.sonQiymat(y.zaxira), zaxiraMatn: y.zaxiraMatn || "—"})),
    qidiruv: ["obyekt", "toifa"],
    ustunlar: [
      {kalit: "obyekt", nom: "Obyekt"},
      {kalit: "kunlar", nom: "Kechikish", son: true, chiz: q => q.kunlar + " kun"},
      {kalit: "qarzN", nom: "Qarz", son: true, chiz: q => '<span class="pul">' + q.qarzMatn + '</span>'},
      {kalit: "toifa", nom: "Toifa", chiz: q => '<span class="chip ' +
        (q.stavka >= 50 ? "chip-xavf" : q.stavka >= 25 ? "chip-sariq" : "chip-yashil") + '">' + q.toifa + " · " + q.stavka + '%</span>'},
      {kalit: "zaxiraN", nom: "Zaxira", son: true, chiz: q => '<span class="pul">' + q.zaxiraMatn + '</span>'},
      {kalit: "id", nom: "", saralash: false, chiz: q =>
        '<button type="button" class="tugma tugma-kichik tugma-oq" data-tasnif="' + q.id + '">Qayta tasniflash</button>'},
    ],
    chizilganda(bolak, el){
      el.querySelectorAll("[data-tasnif]").forEach(b => b.addEventListener("click", ev => {
        ev.stopPropagation();
        const y = yoz.find(v => v.id === b.dataset.tasnif);
        const t = MKB_DATA.tasnifla(y.qarz.kunlar);
        const yangiZaxira = Math.round(MKB.sonQiymat(y.qarzSon) * t.zaxira) / 100;
        MKB.modal("Qayta tasniflash — " + y.id,
          '<dl class="malumot-royxat">' +
          '<dt>Kechikish</dt><dd>' + y.qarz.kunlar + ' kun</dd>' +
          '<dt>Hisoblangan toifa</dt><dd>' + t.nom + ' (' + t.zaxira + '%)</dd>' +
          '<dt>Yangi zaxira</dt><dd class="pul">' + MKB.fmt(yangiZaxira) + ' mln so\'m</dd></dl>',
          {okMatn: "Tasdiqlash", async ok(){
            await MKBapi.yangilash("YOZUVLAR", y.id, {tasnif: t, zaxira: yangiZaxira,
              zaxiraMatn: MKB.fmt(yangiZaxira) + " mln so'm", qaytaTasnif: true});
            yoz = await MKBapi.royxat("YOZUVLAR");
            jadval.yangila(yoz.map(y2 => ({id: y2.id, obyekt: y2.mulk.qisqa, kunlar: y2.qarz.kunlar,
              qarzN: MKB.sonQiymat(y2.qarzSon), qarzMatn: y2.qarzMatn,
              toifa: y2.tasnif ? y2.tasnif.nom : "—", stavka: y2.tasnif ? y2.tasnif.zaxira : 0,
              zaxiraN: MKB.sonQiymat(y2.zaxira), zaxiraMatn: y2.zaxiraMatn || "—"})));
            metrikalar();
            MKB.toast("Tasnif yangilandi — " + y.id);
          }});
      }));
    },
  });
});
</script>
</body>
</html>
