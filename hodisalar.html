<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Hodisalar</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.hd-asbob{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.hd-asbob .tanlov{min-height:42px}
.hd-asbob select{border:0;background:transparent;font:inherit;font-size:13.5px;color:var(--siyoh);min-height:40px;padding:0 4px;cursor:pointer;max-width:240px}
.hd-asbob .oraliq{flex:1}
.hd-asbob .hd-qosh{display:none}
.hd-asbob.keng .hd-qosh{display:inline-flex}
/* Doska, ustun, sarlavha va karta ko'rinishi yadro/app.css dagi yagona .doska komponentidan keladi */
.doska{--doska-ustun:176px}
.hk[draggable="true"]{cursor:grab}
.hk.surilmoqda{opacity:.45}
.hk a.hk-nom{font-size:14px;font-weight:500;line-height:1.3;color:var(--siyoh);text-decoration:none;overflow-wrap:anywhere}
.hk a.hk-nom:hover{text-decoration:underline}
.hk a.hk-nom::after{content:"";position:absolute;inset:0;border-radius:inherit}
.hk a.hk-nom:focus-visible{outline:none}
.hk:has(a.hk-nom:focus-visible){box-shadow:0 0 0 2px var(--siyoh)}
.hk .keyingi{position:relative;z-index:1}
.hk .hk-ob{font-size:12.5px;line-height:1.35;color:var(--matn-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.hk .hk-past{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--matn-3)}
.hk .hk-past .vaqt{margin-left:auto}
.hk .keyingi{width:100%;justify-content:center;min-height:36px;height:auto;padding:6px 10px;font-size:12.5px;min-width:0}
.hk .keyingi span{white-space:normal;line-height:1.25;text-align:center}
@media (max-width:1024px){.doska{--doska-ustun:250px}}
@media (max-width:720px){.doska{grid-auto-flow:row;grid-template-columns:minmax(0,1fr);overflow:visible}.hd-asbob select{max-width:170px}}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><span>Hodisalar</span></div>
    <div class="hs-qator"><h1>Hodisalar</h1><span class="hs-meta" id="hs-meta"></span><span class="hs-meta" id="hd-yangilandi" data-sayohat="yangilandi" data-tur="hodisalar-yangilandi" hidden></span>
      <div class="hs-amallar">
        <button type="button" class="tugma tugma-asosiy" id="hd-yangi" data-huquq="yoz" data-sayohat="qayd" data-tur="hodisalar-qayd"><svg class="ic"><use href="#ik-qoshish"/></svg>Hodisa qayd etish</button>
      </div></div>
  </div>
  <nav class="bolim-tablar" data-bir-qator aria-label="Bo'lim ichi"><a href="himoya.html">Monitoring markazi</a><a href="qoriqlash.html">Qo'riqlash</a><a href="kommunal.html">Kommunal</a><a href="qurilmalar.html">Qurilmalar</a><a href="hodisalar.html" class="faol" aria-current="page">Hodisalar</a><a href="tashriflar.html">Tashriflar</a><a href="masofaviy-korik.html">Masofaviy ko'rik</a><a href="ruxsatlar.html">Ruxsatlar</a><a href="kirish-voqealari.html">Signallar</a></nav>

  <div class="hd-asbob" data-tur="hodisalar-filtr">
    <label class="tanlov"><span class="t-old">Holat:</span><select id="hd-holat" aria-label="Holat bo'yicha"><option value="">Barchasi</option><option value="ochiq">Ochiq</option></select></label>
    <label class="tanlov"><span class="t-old">Jiddiylik:</span><select id="hd-jiddiy" aria-label="Jiddiylik bo'yicha"><option value="">Barchasi</option><option value="yuqori">Yuqori</option><option value="o'rta">O'rta</option><option value="past">Past</option></select></label>
    <button type="button" class="tugma tugma-oq tugma-kichik" id="hd-qosh-t" aria-expanded="false" aria-controls="hd-manba hd-obyekt" data-tur="hodisalar-boshqa-filtr"><svg class="ic"><use href="#ik-filtr"/></svg><span>Boshqa filtrlar</span></button>
    <label class="tanlov hd-qosh"><span class="t-old">Manba:</span><select id="hd-manba" aria-label="Manba bo'yicha"><option value="">Barchasi</option><option value="qurilma">Qurilma signali</option><option value="obyekt">Ko'rik va qo'lda qayd</option></select></label>
    <label class="tanlov hd-qosh"><span class="t-old">Obyekt:</span><select id="hd-obyekt" aria-label="Obyekt bo'yicha"><option value="">Barchasi</option></select></label>
    <span class="oraliq"></span>
    <button type="button" class="tugma tugma-oq tugma-kichik" id="hd-csv" data-tur="hodisalar-csv"><svg class="ic"><use href="#ik-csv"/></svg>CSV</button>
  </div>
  <div class="doska" id="hd-doska" aria-label="Hodisalar doskasi" data-sayohat="doska" data-tur="hodisalar-doska"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  const KOLLAR = ["XAVFSIZLIK_HODISALARI", "HODISALAR", "FAYLLAR"];
  const doska = $("hd-doska");
  let ulandi = false;
  MKB.sahifaYukla({
    joylar: {"hd-doska": ["karta", 5]},
    xato: "Hodisalar ro'yxatini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(KOLLAR);
      ulandi = true;
      sahifa();
    },
  });

  function sahifa(){
  /* Yagona holatlar: ochiq = yangi, tekshiruvda, bartaraf (himoya.html bilan bir xil) */
  const USTUNLAR = [["yangi", "Yangi", "var(--xavf)"], ["tekshiruvda", "Tekshiruvda", "var(--jid-orta)"], ["bartaraf", "Bartaraf etilmoqda", "var(--kok)"],
                    ["hal", "Hal qilindi", "var(--mint-matn)"], ["yopildi", "Yopildi", "var(--matn-4)"]];
  const NOM = {}; USTUNLAR.forEach(u => { NOM[u[0]] = u[1]; });
  /* Kartadagi keyingi amal: fe'l bilan (qabul qilish, bartaraf etishga o'tkazish, hal qilish, yopish) */
  const KEYINGI = {yangi: ["tekshiruvda", "Qabul qilish"], tekshiruvda: ["bartaraf", "Bartaraf etishga"], bartaraf: ["hal", "Hal qilindi"], hal: ["yopildi", "Yopish"]};
  const XH_MOS = {ochiq: "yangi", tekshiruvda: "tekshiruvda", bartaraf: "bartaraf", hal: "hal", yopildi: "yopildi"};
  const GH_MOS = {yangi: "yangi", tekshirilmoqda: "tekshiruvda", tekshiruvda: "tekshiruvda", bartaraf: "bartaraf", hal: "hal", yopildi: "yopildi"};
  const JID = {}; ["yuqori", "o'rta", "past"].forEach(k => { const j = MKB.jiddiylik(k); JID[k] = [j.nom, j.chip]; });
  const jid = v => String(v || "").replace(/&#39;|’/g, "'");
  const yozadi = MKB.huquq("himoya", "yoz");
  const p = new URLSearchParams(location.search);

  function bandlar(){
    return MKB.doira(D.XAVFSIZLIK_HODISALARI || []).map(h => ({
      id: h.id, kol: "XAVFSIZLIK_HODISALARI", obyektId: h.obyektId, nom: h.hodisa, jiddiylik: jid(h.jiddiylik),
      holat: XH_MOS[h.holat] || "yangi", vaqt: h.vaqt || h.sana || "", masul: h.masul || "", manba: "qurilma",
      qurilma: (D.qurilma(h.qurilmaId) || {}).turNomi || ""
    })).concat(MKB.doira(D.HODISALAR || []).map(h => ({
      id: h.id, kol: "HODISALAR", obyektId: h.obyektId, nom: h.hodisa, jiddiylik: jid(h.jiddiylik),
      holat: GH_MOS[h.ustun] || "yangi", vaqt: h.vaqt || "", masul: h.masul || "", manba: h.manba === "qurilma" ? "qurilma" : "obyekt", qurilma: ""
    }))).map(b => Object.assign(b, {d: D.sanaOqi(b.vaqt)})).sort((a, b) => (b.d || 0) - (a.d || 0));
  }
  const holatPatch = (kol, kalit) => kol === "XAVFSIZLIK_HODISALARI" ? {holat: kalit === "yangi" ? "ochiq" : kalit}
    : {ustun: kalit === "tekshiruvda" ? "tekshirilmoqda" : kalit, holat: NOM[kalit]};

  /* Obyekt tanlovi */
  const obIdlar = [...new Set(bandlar().map(b => b.obyektId))].map(id => [id, MKB.kn.obyektYorligi(id)]).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  /* Havoladan kelgan obyektda hodisa bo'lmasa ham u tanlanadi: barcha hodisalar o'rniga bo'sh ustunlar ko'rsatiladi */
  if (p.get("obyekt") && !obIdlar.some(x => x[0] === p.get("obyekt"))) obIdlar.unshift([p.get("obyekt"), MKB.kn.obyektYorligi(p.get("obyekt"))]);
  $("hd-obyekt").insertAdjacentHTML("beforeend", obIdlar.map(([id, n]) => '<option value="' + esc(id) + '">' + esc(n) + "</option>").join(""));
  if (p.get("obyekt")) $("hd-obyekt").value = p.get("obyekt");
  if (p.get("filtr") === "ochiq") $("hd-holat").value = "ochiq";
  const OCHIQ = ["yangi", "tekshiruvda", "bartaraf"];
  /* Kam ishlatiladigan filtrlar (manba, obyekt) tugma ortida; qiymati bo'lsa ochiq turadi */
  const asbob = document.querySelector(".hd-asbob");
  const qoshOch = och => { asbob.classList.toggle("keng", och); $("hd-qosh-t").setAttribute("aria-expanded", String(och)); };
  qoshOch(!!($("hd-manba").value || $("hd-obyekt").value));
  $("hd-qosh-t").addEventListener("click", () => qoshOch(!asbob.classList.contains("keng")));

  const QADAM = 8, chegara = {};
  let joriy = [];
  function chiz(){
    const j = $("hd-jiddiy").value, m = $("hd-manba").value, o = $("hd-obyekt").value;
    /* "Ochiq" tanlansa hal qilingan va yopilgan hodisalar ham doskada, ham CSV da chiqmaydi */
    const faqatOchiq = $("hd-holat").value === "ochiq";
    const hamma = bandlar();
    joriy = hamma.filter(b => (!j || b.jiddiylik === j) && (!m || b.manba === m) && (!o || b.obyektId === o) && (!faqatOchiq || OCHIQ.includes(b.holat)));
    const ochiq = joriy.filter(b => OCHIQ.includes(b.holat)).length;
    $("hs-meta").innerHTML = '<b data-tarjimasiz>' + ochiq + "</b> <span>ta ochiq hodisa</span> · <b data-tarjimasiz>" + joriy.length + "</b> <span>jami</span>";
    if (!hamma.length){
      doska.style.display = "block";
      doska.innerHTML = '<div class="karta">' + MKB.boshHolat("qalqon", "Hodisa qayd etilmagan",
        "Qurilma signali, ko'rik yoki xodim xabari bo'yicha hodisa shu yerda yuritiladi",
        yozadi ? '<button type="button" class="tugma tugma-asosiy tugma-kichik" data-yangi>' + ik("qoshish") + "Hodisa qayd etish</button>" : "") + "</div>";
      tarjimaQil(doska); tarjimaQil($("hs-meta")); return;
    }
    doska.style.display = "";
    doska.innerHTML = USTUNLAR.filter(u => !faqatOchiq || OCHIQ.includes(u[0])).map(([kalit, nom, rang]) => {
      const q = joriy.filter(b => b.holat === kalit);
      const son = chegara[kalit] || QADAM;
      const keyingi = KEYINGI[kalit];
      return '<section class="doska-ustun" data-ustun="' + kalit + '" aria-label="' + esc(nom) + '"><div class="doska-bosh"><span class="nuq" style="background:' + rang + '"></span>' +
        "<b>" + nom + '</b><span class="soni" data-tarjimasiz>' + q.length + "</span></div>" +
        (q.length ? q.slice(0, son).map(b => {
          const jd = JID[b.jiddiylik] || [b.jiddiylik || "—", "chip-kul"];
          return '<article class="doska-karta hk" data-id="' + esc(b.id) + '"' + (yozadi ? ' draggable="true"' : "") + ">" +
            '<a class="hk-nom" draggable="false" href="hodisa.html?id=' + encodeURIComponent(b.id) + '">' + esc(b.nom) + "</a>" +
            '<span class="hk-ob">' + esc(MKB.kn.obyektNomi(b.obyektId)) + (b.qurilma ? " · " + esc(b.qurilma) : "") + "</span>" +
            '<div class="hk-past"><span class="chip chip-kichik ' + jd[1] + '">' + jd[0] + '</span><span class="kod-mono" data-tarjimasiz>' + esc(b.id) + '</span><span class="vaqt" data-tarjimasiz>' + esc(b.vaqt) + "</span></div>" +
            (yozadi && keyingi ? '<button type="button" class="tugma tugma-oq tugma-kichik keyingi" data-yozadi data-keyingi="' + esc(b.id) + '" data-holat="' + keyingi[0] + '">' + ik("ong") + '<span>' + keyingi[1] + "</span></button>" : "") +
            "</article>";
        }).join("") : '<p class="doska-bosh-joy">Hodisa yo\'q</p>') +
        (q.length > son ? '<button type="button" class="tugma tugma-kichik tugma-oq" data-yana="' + kalit + '">' + '<span>Yana ko\'rsatish</span>&nbsp;<span data-tarjimasiz>' + (q.length - son) + "</span></button>" : "") +
        "</section>";
    }).join("");
    tarjimaQil(doska); tarjimaQil($("hs-meta"));
  }

  /* Bosqich o'tishi: qabul qilish va oraliq bosqichlar darhol yoziladi va qaytarib olinadi;
     "Hal qilindi" va "Yopildi" ko'rilgan chora bilan tasdiqlanadi (hodisa.html bilan bir xil qoida) */
  async function kochir(id, kalit, tugma){
    const b = bandlar().find(x => x.id === id);
    if (!b || b.holat === kalit) return;
    const yozuv = (D[b.kol] || []).find(x => x.id === id);
    const maydon = b.kol === "XAVFSIZLIK_HODISALARI" ? "chora" : "izoh";
    const xato = MKB.hodisa.otishXatosi(Object.assign({}, yozuv, {[maydon]: "x"}), b.kol, b.holat, kalit);
    if (xato){ MKB.toast("Hodisa bosqichlari ketma-ket o'tkaziladi", "xavf"); return; }
    const eski = b.holat;
    if (kalit === "hal" || kalit === "yopildi"){
      const halmi = kalit === "hal";
      const bor = String(yozuv[maydon] || "").trim();
      const r = await MKB.tasdiqla({
        sarlavha: halmi ? "Hodisani hal qilindi deb belgilash" : "Hodisani yopish",
        matn: halmi ? "Hodisa \"Hal qilindi\" bosqichiga o'tadi. Ko'rilgan chora hodisa tarixiga ismingiz bilan yoziladi." : "Hodisa yopiladi va ochiq hodisalar ro'yxatidan chiqadi. Kerak bo'lsa, keyin qayta ochish mumkin.",
        tafsilot: [["Hodisa", {matn: b.id, tarjimasiz: true}], ["Nomi", b.nom], ["Obyekt", MKB.kn.obyektNomi(b.obyektId)], ["Mas'ul", b.masul || "—"]]
          .concat(bor ? [["Oldingi chora", bor.split("\n").pop()]] : []),
        sabab: {majburiy: halmi || !bor, min: halmi || !bor ? 5 : 0, maks: 600, yorliq: halmi || !bor ? "Ko'rilgan chora" : "Yopish izohi",
          izoh: "Sabab, ko'rilgan chora va natija", namuna: "Masalan: eshik qulfi almashtirildi, IIBga xabar berildi"},
        okMatn: halmi ? "Hal qilindi deb belgilash" : "Hodisani yopish", bekorMatn: "Orqaga",
        bajar: ({sabab}) => MKBapi.yangilash(b.kol, b.id, Object.assign(holatPatch(b.kol, kalit),
          sabab ? {[maydon]: [bor, D.sanaYoz(D.bugun()) + " " + MKB.soat() + " · " + MKB.kim() + ": " + sabab].filter(Boolean).join("\n")} : {})),
      });
      if (!r) return;
      MKB.toast(halmi ? "Hodisa " + b.id + " hal qilindi" : "Hodisa " + b.id + " yopildi");
      chiz(); return;
    }
    const masulBer = eski === "yangi" && kalit === "tekshiruvda" && (!yozuv.masul || yozuv.masul === "—");
    const eskiMasul = yozuv.masul || "";
    const ish = () => MKB.saqla(() => MKBapi.yangilash(b.kol, b.id, Object.assign(holatPatch(b.kol, kalit), masulBer ? {masul: MKB.kim()} : {})));
    const ok = tugma ? await MKB.band(tugma, ish) : await ish();
    if (!ok) return;
    chiz();
    MKB.qaytarish(eski === "yangi" && kalit === "tekshiruvda" ? "Hodisa " + b.id + " qabul qilindi" : "Hodisa " + b.id + ": " + NOM[kalit], {
      bekor: () => MKBapi.yangilash(b.kol, b.id, Object.assign(holatPatch(b.kol, eski), masulBer ? {masul: eskiMasul} : {})),
      keyin: () => chiz(),
    });
  }
  doska.addEventListener("click", e => {
    const y = e.target.closest("[data-yana]");
    if (y){ chegara[y.dataset.yana] = (chegara[y.dataset.yana] || QADAM) + QADAM; chiz(); return; }
    const k = e.target.closest("[data-keyingi]");
    if (k){ kochir(k.dataset.keyingi, k.dataset.holat, k); return; }
    if (e.target.closest("[data-yangi]")) yangiForma();
  });
  /* Sudrab o'tkazish */
  let sudralgan = null;
  doska.addEventListener("dragstart", e => {
    const k = e.target.closest(".hk"); if (!k) return;
    sudralgan = k.dataset.id; k.classList.add("surilmoqda");
    e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", sudralgan);
  });
  doska.addEventListener("dragend", e => { const k = e.target.closest(".hk"); if (k) k.classList.remove("surilmoqda"); doska.querySelectorAll(".ustida").forEach(x => x.classList.remove("ustida")); });
  doska.addEventListener("dragover", e => { const u = e.target.closest(".doska-ustun"); if (!u || !sudralgan) return; e.preventDefault();
    doska.querySelectorAll(".ustida").forEach(x => x !== u && x.classList.remove("ustida")); u.classList.add("ustida"); });
  doska.addEventListener("drop", e => { const u = e.target.closest(".doska-ustun"); if (!u || !sudralgan) return; e.preventDefault();
    const id = sudralgan; sudralgan = null; u.classList.remove("ustida"); kochir(id, u.dataset.ustun, null); });

  ["hd-holat", "hd-jiddiy", "hd-manba", "hd-obyekt"].forEach(i => $(i).addEventListener("change", chiz));
  $("hd-csv").addEventListener("click", () => {
    MKB.csv("hodisalar-" + D.sanaYoz(D.bugun()).split(".").reverse().join("-") + ".csv",
      ["ID", "Hodisa", "Obyekt", "Jiddiylik", "Holat", "Vaqt", "Mas'ul"],
      joriy.map(b => [b.id, b.nom, MKB.kn.obyektNomi(b.obyektId), (JID[b.jiddiylik] || [b.jiddiylik])[0], NOM[b.holat], b.vaqt, b.masul]));
    MKB.toast("CSV fayl yuklab olindi: " + joriy.length + " ta qator", "yuklab");
  });

  /* ---------- Yangi hodisa (palitradan ?yangi=1 bilan ham ochiladi) ---------- */
  const TURLAR = ["Buzib kirishga urinish", "O'g'irlik yoki kamomad", "Mulkka zarar yetkazilgan", "Ruxsatsiz egallash", "Yong'in yoki tutun", "Suv bosishi", "Kommunal avariya", "Qurilma nosozligi", "Boshqa"];
  const isoBugun = D.sanaYoz(D.bugun()).split(".").reverse().join("-");
  function yangiForma(){
    if (!yozadi) return;
    const royxat = MKB.doira(D.YOZUVLAR).filter(y => y.holat !== "Chiqarildi").sort((a, b) => String(a.qisqa || a.nom).localeCompare(String(b.qisqa || b.nom)));
    const tanlangan = p.get("obyekt") || $("hd-obyekt").value;
    const html = '<div class="forma-tor">' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-ob">Obyekt <b>*</b></label><div class="kirish"><select id="f-ob" name="obyektId" required data-xato="Obyektni tanlang"><option value="">Tanlang</option>' +
        royxat.map(y => '<option value="' + esc(y.id) + '"' + (y.id === tanlangan ? " selected" : "") + ">" + esc(MKB.kn.obyektYorligi(y.id)) + "</option>").join("") + "</select></div></div>" +
      '<div class="maydon"><label class="maydon-yorliq" for="f-tur">Hodisa turi <b>*</b></label><div class="kirish"><select id="f-tur" name="tur" required data-xato="Hodisa turini tanlang"><option value="">Tanlang</option>' +
        TURLAR.map(t => "<option>" + esc(t) + "</option>").join("") + "</select></div></div>" +
      '<div class="maydon"><label class="maydon-yorliq" for="f-j">Jiddiylik <b>*</b></label><div class="kirish"><select id="f-j" name="jiddiylik" required><option value="yuqori">Yuqori</option><option value="o\'rta" selected>O\'rta</option><option value="past">Past</option></select></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-t">Tavsif <b>*</b></label><textarea class="kirish-matn" id="f-t" name="tavsif" rows="3" maxlength="600" required minlength="10" data-xato="Nima bo\'lganini yozing" placeholder="Nima bo\'ldi, qachon va kim aniqladi"></textarea></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-ir">IIB arizasi raqami</label><div class="kirish"><input id="f-ir" name="iibRaqam" maxlength="40"></div><span class="maydon-izoh">Ariza berilgan bo\'lsa</span></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-is">IIB arizasi sanasi</label><div class="kirish"><input id="f-is" name="iibSana" type="date" max="' + isoBugun + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-f">Dalil fayli</label><div class="kirish"><input id="f-f" type="file" accept="image/*,application/pdf"></div><span class="maydon-izoh">Surat yoki PDF, 20 MB gacha</span></div>' +
      "</div>";
    MKB.modal("Hodisa qayd etish", html, {okMatn: "Hodisani qayd etish", ok: async pd => {
      const tana = pd.querySelector(".modal-tana");
      const f = MKB.formaTekshir(tana, {
        iibSana: (v, q) => !!v === !!q.iibRaqam || (v ? "Ariza raqamini ham kiriting" : "Ariza sanasini kiriting"),
      });
      if (!f) return false;
      const v = f.qiymatlar;
      const faylEl = tana.querySelector("#f-f"), fayl = faylEl.files[0];
      if (fayl && fayl.size > MKBapi.fayl.MAX_HAJM){ MKB.maydonXato(faylEl, "Fayl 20 MB dan oshmasin"); faylEl.focus(); return false; }
      let yangi = null;
      const ok = await MKB.saqla(async () => {
        yangi = await MKB.hodisa.yarat({obyektId: v.obyektId, hodisa: v.tur, jiddiylik: v.jiddiylik, tavsif: v.tavsif, manba: "qo'lda",
          iibAriza: v.iibRaqam ? {raqam: v.iibRaqam, sana: v.iibSana} : null});
        if (fayl && yangi) await MKBapi.fayl.saqla(fayl, {obyektId: v.obyektId, kolleksiya: "HODISALAR", yozuvId: yangi.id});
      });
      if (!ok) return false;
      MKB.toast("Hodisa " + (yangi && yangi.id ? yangi.id : "") + " qayd etildi");
      chiz();
    }});
  }
  $("hd-yangi").addEventListener("click", yangiForma);
  chiz();
  const belgi = MKB.yangilanganBelgi("hd-yangilandi", {avto: 60, yangila: async () => { await MKB.kn.yukla(KOLLAR); chiz(); }});
  belgi.belgila();
  if (p.get("yangi") && yozadi){
    yangiForma();
    const u = new URL(location.href); u.searchParams.delete("yangi"); history.replaceState(null, "", u);
  }
  }
})();
</script>
</body>
</html>
