<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, el = id => document.getElementById(id);
  const b = (() => { const x = D.bugun(); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); })();
  const yoza = MKB.huquq("qiymat", "yoz");
  const TUR = D.POLIS_TURLARI || {mulk: "Mol-mulk", OSAGO: "OSAGO", XICHO: "Xavfli obyekt (XICHO)"};
  const kerakTur = y => y.turKalit === "transport" ? "OSAGO" : "mulk";
  const DAVO = {"topshirilgan": ["Topshirilgan", "chip-kok"], "korib chiqilmoqda": ["Ko'rib chiqilmoqda", "chip-sariq"], "tolangan": ["To'langan", "chip-yashil"], "rad etilgan": ["Rad etilgan", "chip-xavf"]};

  /* Polis holati: keyinroq tugaydigan shu turdagi polis bo'lsa yangilangan */
  function holati(p, hamma){
    const t = D.sanaOqi(p.tugash);
    const yangi = hamma.some(x => x.id !== p.id && x.obyektId === p.obyektId && x.polisTuri === p.polisTuri && D.sanaOqi(x.tugash) > t && D.sanaOqi(x.boshlanish) >= D.kunQosh(t, -60));
    if (yangi) return "Yangilangan";
    if (String(p.holat).indexOf("to'xtat") >= 0) return "To'xtatilgan";
    const q = t ? D.kunFarqi(b, t) : null;
    if (q == null) return "Amalda";
    if (q < 0) return "Muddati tugagan";
    if (q <= 30) return "30 kunda tugaydi";
    return "Amalda";
  }
  const CH = {"Amalda": "chip-yashil", "30 kunda tugaydi": "chip-sariq", "Muddati tugagan": "chip-xavf", "Yangilangan": "chip-kul", "To'xtatilgan": "chip-kul"};

  let jadval = null;
  function chiz(){
    const aktivlar = MKB.doira(D.YOZUVLAR.filter(y => y.holat !== "Chiqarildi"));
    const faolId = new Set(aktivlar.map(y => y.id));
    const hamma = MKB.doira(D.SUGURTALAR || []);
    const qatorlar = hamma.filter(p => faolId.has(p.obyektId)).map(p => {
      const y = D.topish(p.obyektId) || {};
      const h = holati(p, hamma);
      return {id: p.id, polis: p.polis || p.id, obyektId: p.obyektId, obyekt: y.qisqa || y.nom || p.obyektId, tur: TUR[p.polisTuri] || p.polisTuri || "",
        kompaniya: p.kompaniya || "", summa: p.summa, mukofot: p.mukofot, boshlanish: p.boshlanish, tugash: p.tugash,
        qoldi: D.sanaOqi(p.tugash) ? D.kunFarqi(b, D.sanaOqi(p.tugash)) : null, holat: h,
        pastQoplama: p.polisTuri === "mulk" && y.qiymat && y.qiymat.bozor && p.summa < y.qiymat.bozor && (h === "Amalda" || h === "30 kunda tugaydi")};
    });
    const amalda = qatorlar.filter(x => x.holat === "Amalda" || x.holat === "30 kunda tugaydi");
    /* Sug'urtasiz: talab qilingan turdagi amaldagi polis yo'q (transport — OSAGO, qolganlari — mol-mulk) */
    const yoqlar = aktivlar.filter(y => !amalda.some(x => x.obyektId === y.id && x.tur === TUR[kerakTur(y)]));

    el("hs-meta").innerHTML = "<span data-tarjimasiz>" + MKB.fmt(qatorlar.length) + "</span> <span>ta polis</span>";
    /* Karta va uni bosganda qo'yiladigan filtr bitta mezon: holat === "Amalda". 30 kunda tugaydiganlar keyingi kartada alohida */
    const faqatAmalda = qatorlar.filter(x => x.holat === "Amalda");
    el("sg-amalda").textContent = MKB.fmt(faqatAmalda.length);
    el("sg-amalda-izoh").innerHTML = "<span>Sug'urta summasi</span> <span data-tarjimasiz>" + esc(MKB.pul(Math.round(faqatAmalda.reduce((a, x) => a + (x.summa || 0), 0)))) + "</span>";
    el("sg-30").textContent = MKB.fmt(qatorlar.filter(x => x.holat === "30 kunda tugaydi").length);
    el("sg-tugagan").textContent = MKB.fmt(qatorlar.filter(x => x.holat === "Muddati tugagan").length);
    el("sg-yoq").textContent = MKB.fmt(yoqlar.length);
    el("sg-yoq-izoh").innerHTML = aktivlar.length ? "<span>Faol aktivlarning</span> <b data-tarjimasiz>" + Math.round(yoqlar.length / aktivlar.length * 100) + "%</b>" : "<span>Faol aktiv yo'q</span>";
    el("sg-soni").textContent = qatorlar.length + " ta";

    const cfg = {
      qatorlar, saralash: "qoldi", yonalish: 1, sahifaHajmi: 12,
      qidiruv: ["polis", "obyekt", "obyektId", "kompaniya"], qidiruvYozuvi: "Polis, obyekt yoki kompaniya",
      filtrlar: [
        {kalit: "holat", nom: "Holat", variantlar: ["Amalda", "30 kunda tugaydi", "Muddati tugagan", "Yangilangan"]},
        {kalit: "tur", nom: "Turi", variantlar: ["Mol-mulk", "OSAGO", "Xavfli obyekt (XICHO)"]},
        {kalit: "kompaniya", nom: "Kompaniya", variantlar: [...new Set(qatorlar.map(x => x.kompaniya).filter(Boolean))].sort()},
      ],
      csvNomi: "sugurta-polislari",
      bosh: {sarlavha: "Polis yo'q", izoh: D.MANBA === "mahalliy" ? "Mahalliy reyestrda sug'urta polislari hali kiritilmagan" : "Yangi polis qo'shing"},
      ustunlar: [
        {kalit: "polis", nom: "Polis", chiz: x => '<span class="kod-mono" data-tarjimasiz>' + esc(x.polis) + '</span><br><span style="font-size:12px;color:var(--matn-3)">' + esc(x.tur) + "</span>"},
        {kalit: "obyekt", nom: "Obyekt", chiz: x => "<b>" + esc(x.obyekt) + '</b><br><span style="font-size:12px;color:var(--matn-3)">' + esc(x.kompaniya) + "</span>"},
        {kalit: "summa", nom: "Sug'urta summasi", son: true, chiz: x => '<span data-tarjimasiz>' + esc(MKB.pul(x.summa)) + "</span>" + (x.pastQoplama ? '<br><span style="font-size:12px;color:var(--xavf-matn-yorqin)">bozor qiymatidan past</span>' : "")},
        {kalit: "mukofot", nom: "Mukofot", son: true, chiz: x => '<span data-tarjimasiz>' + esc(MKB.pul(x.mukofot)) + "</span>"},
        {kalit: "tugash", nom: "Tugash", tur: "sana", chiz: x => '<span data-tarjimasiz>' + esc(x.tugash || "—") + "</span>" + (x.qoldi != null && x.qoldi >= 0 && x.holat !== "Yangilangan" ? '<br><span style="font-size:12px;color:var(--matn-3)"><span data-tarjimasiz>' + x.qoldi + "</span> <span>kun</span></span>" : "")},
        {kalit: "holat", nom: "Holat", chiz: x => '<span class="chip chip-kichik ' + (CH[x.holat] || "chip-kul") + '">' + esc(x.holat) + "</span>"},
        {kalit: "amal", nom: "", saralash: false, csv: false, chiz: x => yoza && (x.holat === "30 kunda tugaydi" || x.holat === "Muddati tugagan")
          ? '<a class="tugma tugma-kichik tugma-oq" href="sugurta-yangilash.html?id=' + encodeURIComponent(x.id) + '">Yangilash</a>' : ""},
      ],
      bosilganda: x => { location.href = "sugurta-polis.html?id=" + encodeURIComponent(x.id); },
    };
    if (jadval) jadval.yangila(qatorlar); else jadval = MKB.jadval("sg-jadval", cfg);

    /* Sug'urtasiz aktivlar: balans qiymati bo'yicha */
    el("sg-yoq-soni").textContent = yoqlar.length + " ta";
    const ys = yoqlar.slice().sort((a, c) => ((c.balans && c.balans.qiymat) || 0) - ((a.balans && a.balans.qiymat) || 0));
    el("sg-yoqlar").innerHTML = ys.length ? ys.slice(0, 8).map(y => {
      const t = kerakTur(y), eski = qatorlar.filter(x => x.obyektId === y.id && x.tur === TUR[t]).sort((a, c) => D.sanaOqi(c.tugash) - D.sanaOqi(a.tugash))[0];
      return '<div class="qator"><span class="belgi pushti">' + ik("sugurta") + "</span>" +
        '<span class="matn"><b>' + esc(y.qisqa || y.nom) + "</b><span><span>" + esc(TUR[t]) + "</span> · " +
        (eski ? "<span>muddati tugagan</span> <span data-tarjimasiz>" + esc(eski.tugash) + "</span>" : "<span>polis yo'q</span>") + "</span></span>" +
        '<span class="ong">' + (yoza ? '<a class="tugma tugma-kichik tugma-asosiy" href="' + (eski ? "sugurta-yangilash.html?id=" + encodeURIComponent(eski.id) : "sugurta-yangilash.html?obyekt=" + encodeURIComponent(y.id) + "&tur=" + t) + '">' + (eski ? "Yangilash" : "Polis qo'shish") + "</a>" : "") + "</span></div>";
    }).join("") + (ys.length > 8 ? '<p class="maydon-izoh" style="margin:10px 0 0"><span>Yana</span> <b data-tarjimasiz>' + (ys.length - 8) + "</b> <span>ta aktiv</span></p>" : "")
      : MKB.boshHolat("tasdiq", "Barcha faol aktivlar sug'urtalangan");

    /* Da'volar */
    const davolar = MKB.doira(D.SUGURTA_DAVOLARI || []).slice().sort((a, c) => D.sanaOqi(c.sana) - D.sanaOqi(a.sana));
    el("sg-davo-soni").textContent = davolar.length + " ta";
    el("sg-davo").innerHTML = davolar.length ? davolar.map(d => {
      const h = (D.HODISALAR || []).find(x => x.id === d.hodisaId), s = DAVO[d.holat] || [d.holat || "—", "chip-kul"];
      return '<div class="qator"><span class="belgi lavanda">' + ik("xavf") + "</span>" +
        '<span class="matn"><b>' + esc(D.obyektNomi(d.obyektId, true) || d.obyektId) + "</b><span>" +
          (h ? '<a href="hodisa.html?id=' + encodeURIComponent(h.id) + '">' + esc(h.hodisa) + "</a>" : '<span class="kod-mono" data-tarjimasiz>' + esc(d.hodisaId || "") + "</span>") +
          ' · <a href="sugurta-polis.html?id=' + encodeURIComponent(d.polisId) + '" class="kod-mono" data-tarjimasiz>' + esc(d.polisId) + "</a> · <span data-tarjimasiz>" + esc(d.sana) + "</span></span></span>" +
        '<span class="ong"><span class="pul" data-tarjimasiz>' + esc(MKB.pul(d.summa)) + '</span><span class="chip chip-kichik ' + s[1] + '">' + esc(s[0]) + "</span></span></div>";
    }).join("") : MKB.boshHolat("sugurta", "Da'vo yo'q", D.MANBA === "mahalliy" ? "Mahalliy reyestrda da'volar hali kiritilmagan" : "Sug'urta hodisasi bo'yicha da'vo polis sahifasidan yuboriladi");
    tarjimaQil(document.querySelector(".kontent"));
  }

  MKB.sahifaYukla({joylar: {"sg-jadval": ["jadval"], "sg-yoqlar": ["qator", 3], "sg-davo": ["qator", 3]}, xato: "Sug'urta polislarini yuklab bo'lmadi", ish: async () => {
    await MKB.kolYukla(["SUGURTALAR", "SUGURTA_DAVOLARI", "HODISALAR"]);
    chiz();
    if (!ulandi){ ulandi = true; ulash(); }
  }});
  let ulandi = false;
  function ulash(){
  const filtrla = f => { if (jadval){ jadval.holat.filtrlar.holat = f; jadval.holat.sahifa = 1; jadval.yangila(); } };
  document.querySelectorAll(".metrika[data-filtr]").forEach(a => a.addEventListener("click", () => filtrla(a.dataset.filtr)));
  const f = new URLSearchParams(location.search).get("filtr");
  if (f && CH[f]) filtrla(f);
  document.addEventListener("mkb:malumot", () => { try{ chiz(); }catch(_){ } });
  }
})();
</script>
<script>
/* Polislarni Excel yoki CSV fayldan kiritish: har qator sug'urta formasidagi qoidalar bilan tekshiriladi */
(() => {
  const tugma = document.getElementById("import-tugma");
  if (!tugma) return;
  tugma.addEventListener("click", () => {
    const D = MKB_DATA, Y = MKB.importYordam;
    const TUR = Object.entries(D.POLIS_TURLARI || {mulk: "Mol-mulk", OSAGO: "OSAGO", XICHO: "Xavfli obyekt (XICHO)"});
    const fayldagi = new Set();
    const b = Y.bugun();
    MKB.jadvalImport({
      sarlavha: "Polislarni fayldan qo'shish", birlik: "polis", faylNomi: "sugurta-polislari-namuna", qaytaYukla: true,
      ustunlar: [
        {kalit: "obyekt", nom: "Obyekt ID", majburiy: true}, {kalit: "tur", nom: "Polis turi", majburiy: true},
        {kalit: "raqam", nom: "Polis raqami", majburiy: true}, {kalit: "kompaniya", nom: "Sug'urta kompaniyasi", majburiy: true},
        {kalit: "summa", nom: "Sug'urta summasi", majburiy: true, format: "pul"}, {kalit: "mukofot", nom: "Sug'urta mukofoti", majburiy: true, format: "pul"},
        {kalit: "boshlanish", nom: "Boshlanish sanasi", majburiy: true}, {kalit: "tugash", nom: "Tugash sanasi", majburiy: true},
      ],
      namuna: [[(MKB.doira(D.YOZUVLAR || [])[0] || {}).id || "AK-2026/0001", "Mol-mulk", "PL-2026/000123", "O'zbekinvest", "520", "1,84", D.sanaYoz(b), D.sanaYoz(D.oyQosh(b, 12))]],
      qoidalar: {obyekt: "Reyestr raqami yoki obyektning to'liq nomi", tur: TUR.map(t => t[1]).join(", "), summa: "mln so'm", mukofot: "mln so'm, summadan kichik",
        boshlanish: "kk.oo.yyyy", tugash: "kk.oo.yyyy, bugundan keyin, boshlanishdan 400 kundan oshmaydi"},
      tekshir(x){
        const e = [];
        const y = Y.obyekt(x.obyekt), t = Y.variant(TUR, x.tur);
        const bosh = Y.sana(x.boshlanish), tug = Y.sana(x.tugash);
        if (x.obyekt && !y) e.push("Obyekt topilmadi yoki sizning doirangizda emas: " + x.obyekt);
        if (x.tur && !t) e.push("Polis turi noma'lum: " + x.tur);
        if (x.boshlanish && !bosh) e.push("Boshlanish sanasini kk.oo.yyyy ko'rinishida yozing");
        if (x.tugash && !tug) e.push("Tugash sanasini kk.oo.yyyy ko'rinishida yozing");
        if (bosh && tug && tug < bosh) e.push("Tugash sanasi boshlanishdan oldin bo'lmasin");
        if (tug && tug <= b) e.push("Tugash sanasi bugundan keyin bo'lishi kerak");
        if (bosh && tug && D.kunFarqi(bosh, tug) > 400) e.push("Polis muddati bir yildan oshmasin");
        if (x.summa != null && !(x.summa > 0)) e.push("Sug'urta summasi 0 dan katta bo'lsin");
        if (x.mukofot != null && x.summa != null && !(x.mukofot > 0 && x.mukofot < x.summa)) e.push("Mukofot 0 dan katta va sug'urta summasidan kichik bo'lsin");
        const k = Y.kichik(x.raqam);
        if (k && (D.SUGURTALAR || []).some(p => Y.kichik(p.polis) === k)) e.push("Bu raqamli polis allaqachon kiritilgan");
        else if (k && fayldagi.has(k)) e.push("Faylda takrorlangan polis raqami");
        if (k) fayldagi.add(k);
        if (y && t && bosh && tug && (D.SUGURTALAR || []).some(p => p.obyektId === y.id && (p.polisTuri || "mulk") === t[0] &&
            ["amalda", "tugaydi", "rejada"].indexOf(p.holat) >= 0 && D.sanaOqi(p.boshlanish) <= tug && D.sanaOqi(p.tugash) >= bosh))
          e.push("Bu davrda obyektda amaldagi " + t[1] + " polisi bor");
        return e;
      },
      async saqla(x){
        const y = Y.obyekt(x.obyekt), t = Y.variant(TUR, x.tur), bosh = Y.sana(x.boshlanish), tug = Y.sana(x.tugash);
        const yil = b.getFullYear();
        const id = await MKB.keyingiId("SUGURTALAR", "PL-" + yil + "/", 5);
        await MKBapi.yangi("SUGURTALAR", {id, obyektId: y.id, polis: x.raqam.trim(), polisTuri: t[0], kompaniya: x.kompaniya.trim(), summa: Math.round(x.summa * 10) / 10,
          mukofot: Math.round(x.mukofot * 100) / 100, boshlanish: D.sanaYoz(bosh), tugash: D.sanaYoz(tug), holat: bosh > b ? "rejada" : "amalda"});
        await MKBapi.yangi("XARAJATLAR", {id: await MKB.keyingiId("XARAJATLAR", "XJ-" + yil + "/", 4), obyektId: y.id, toifa: "sugurta", summa: Math.round(x.mukofot * 100) / 100,
          davr: bosh.getFullYear() + "-" + String(bosh.getMonth() + 1).padStart(2, "0"), sana: D.sanaYoz(bosh), kontragent: x.kompaniya.trim(), hisobFaktura: null,
          tasdiqlovchi: null, holat: "tolanmagan", izoh: "Polis " + id + ", fayldan kiritildi"});
      },
      keyin(n){ if (n && n.saqlandi) MKB.toast(n.saqlandi + " ta polis kiritildi, mukofotlar xarajatga to'lanmagan deb yozildi"); },
    });
  });
})();
</script>
