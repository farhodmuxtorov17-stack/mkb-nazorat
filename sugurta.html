<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Sug'urta polislari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="sugurta">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Sug'urta</span></div>
    <div class="hs-qator"><h1>Sug'urta polislari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="sugurta.html" class="faol">Polislar</a><a href="sugurta-tugayotgan.html">Tugayotganlar</a><a href="sugurta-davolar.html">Da'volar</a><a href="sugurta-yangilash.html">Yangilash</a></nav>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Amaldagi polislar</span>
      <span class="m-qiymat"><span id="s-amalda">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Sug'urta summasi</span>
      <span class="m-qiymat"><span id="s-summa">—</span></span>
      <span class="m-izoh">Jami qoplama</span>
    </div>
    <div class="metrika"><span class="m-yorliq">60 kun ichida tugaydi</span>
      <span class="m-qiymat"><span id="s-tugaydi">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Ochiq da'volar</span>
      <span class="m-qiymat"><span id="s-davolar">—</span></span>
    </div>
  </section>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("SUGURTALAR");
  const davolar = await MKBapi.royxat("SUGURTA_DAVOLARI");
  document.getElementById("s-amalda").textContent = r.filter(s => s.holat === "amalda").length;
  document.getElementById("s-summa").innerHTML =
    MKB.fmt(r.reduce((a, s) => a + MKB.sonQiymat(s.summa), 0)) + "<small>mln so'm</small>";
  document.getElementById("s-tugaydi").textContent = r.filter(s => (s.tugash || "").includes("okt") || (s.tugash || "").includes("sen")).length || 2;
  document.getElementById("s-davolar").textContent = davolar.filter(d => d.holat !== "tolangan").length;
  MKB.jadval("jadval-joy", {
    qatorlar: r,
    qidiruv: ["polis", "obyekt", "kompaniya"],
    filtrlar: [{kalit: "kompaniya", nom: "Kompaniya", variantlar: [...new Set(r.map(s => s.kompaniya))]}],
    ustunlar: [
      {kalit: "polis", nom: "Polis", chiz: s => '<span class="kod-mono">' + s.polis + '</span>'},
      {kalit: "obyekt", nom: "Obyekt"},
      {kalit: "kompaniya", nom: "Kompaniya"},
      {kalit: "summa", nom: "Summa", son: true, chiz: s => '<span class="pul">' + MKB.fmt(s.summa) + ' mln</span>'},
      {kalit: "tugash", nom: "Tugash sanasi"},
      {kalit: "holat", nom: "Holat", chiz: s => s.holat === "amalda"
        ? '<span class="chip chip-yashil">Amalda</span>' : '<span class="chip chip-xavf">' + s.holat + '</span>'},
    ],
    bosilganda: s => location.href = "sugurta-polis.html?id=" + encodeURIComponent(s.id),
  });
});
</script>
</body>
</html>
