<script>

const KN_NATIJA = {ruxsat: ["Ruxsat berildi", "chip-yashil"], rad: ["Rad etildi", "chip-xavf"],
                   ogohlantirish: ["Ogohlantirish", "chip-sariq"]};
const KN_HOLAT = {onlayn: ["Onlayn", "chip-yashil"], oflayn: ["Oflayn", "chip-xavf"],
                  xizmatda: ["Xizmatda", "chip-sariq"]};
const QR_HOLAT = {ishlayapti: ["Ishlayapti", "chip-yashil"], ogohlantirish: ["Ogohlantirish", "chip-sariq"],
                  nosoz: ["Nosoz", "chip-xavf"]};
function chip(xarita, kalit){
  const v = xarita[kalit] || [kalit, ""];
  return '<span class="chip ' + v[1] + '">' + v[0] + "</span>";
}
function nuqtaIkonka(t){
  return t === "turniket" ? "turniket" : t === "shlagbaum" ? "mashina" : t === "darvoza" ? "zavod" : "eshik";
}
function shaxsSurati(sh, olcham){
  const o = olcham || 38;
  return sh && sh.rasm
    ? '<img class="shaxs-surat" src="' + sh.rasm + '" alt="" loading="lazy" style="width:' + o +
      "px;height:" + o + 'px">'
    : '<span class="belgi">' + (sh ? sh.belgi : "?") + "</span>";
}
function shaxsQatori(sh, ong){
  if (!sh) return '<span class="matn"><b>Aniqlanmagan shaxs</b><span>Identifikatsiya o&#39;tmadi</span></span>';
  return shaxsSurati(sh) +
    '<span class="matn"><b>' + sh.ism + "</b><span><span>" + sh.lavozim + "</span> · <span>" + sh.tashkilot + "</span></span></span>" +
    (ong || "");
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? o.qisqa : id;
}
function voqeaQatori(v){
  const sh = MKB_DATA.shaxs(v.shaxsId);
  return '<a class="qator" href="kirish-voqea.html?id=' + encodeURIComponent(v.id) + '">' +
    '<span class="belgi ' + (v.natija === "rad" ? "pushti" : v.natija === "ogohlantirish" ? "lavanda" : "mint") + '">' +
      ik(v.natija === "ruxsat" ? "tasdiq" : v.natija === "rad" ? "rad" : "xavf") + "</span>" +
    '<span class="matn"><b>' + (sh ? sh.ism : v.operator || "Aniqlanmagan shaxs") + "</b>" +
    "<span>" + obyektNomi(v.obyektId) + " · " + v.nuqtaNomi + " · " + v.usul + "</span></span>" +
    '<span class="ong"><span class="vaqt">' + v.soat + "</span>" + chip(KN_NATIJA, v.natija) + "</span></a>";
}

/* ---------- saqlash yordamchilari (yozuv faqat MKBapi orqali) ---------- */
/* server rejimida kolleksiya xotiradagi nusxaga id bo'yicha qo'shib olinadi */
async function knYukla(nomlar){
  await MKBapi.tayyor;
  if (MKBapi.rejim() !== "server") return;
  for (const k of nomlar){
    try{
      const asl = MKB_DATA[k], r = await MKBapi.royxat(k);
      if (!Array.isArray(asl) || !Array.isArray(r)) continue;
      const ix = new Map(asl.map(x => [x.id, x]));
      r.forEach(x => { const b = ix.get(x.id); if (b) Object.assign(b, x); else asl.push(x); });
    }catch(_){ }
  }
}
async function knYangila(k, id, patch){
  await MKBapi.yangilash(k, id, patch);
  const b = (MKB_DATA[k] || []).find(x => x.id === id);
  if (b) Object.assign(b, patch);
  return b;
}
async function knYangi(k, obyekt){
  const j = await MKBapi.yangi(k, obyekt);
  const y = j && j.id ? j : obyekt;
  const a = MKB_DATA[k];
  if (Array.isArray(a) && !a.some(x => x.id === y.id)) a.push(y);
  return (Array.isArray(a) && a.find(x => x.id === y.id)) || y;
}
/* keyingi raqam: shu old qo'shimchali id'larning eng katta soni + 1 */
async function knKeyingiId(k, old, uzunlik){
  const r = await MKBapi.royxat(k);
  let maks = 0;
  r.forEach(x => {
    const s = String(x.id || ""), m = /(\d+)$/.exec(s);
    if (m && s.indexOf(old) === 0) maks = Math.max(maks, +m[1]);
  });
  return old + String(maks + 1).padStart(uzunlik || 0, "0");
}
async function knSaqla(ish){
  try{ await ish(); return true; }
  catch(_){ MKB.toast("Saqlab bo'lmadi, qayta urinib ko'ring", "xavf"); return false; }
}
function knKim(){ const s = MKBapi.sessiya(); return s && s.ism ? s.ism : "Operator"; }
function knSoat(){
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* "26.08.2026" + "14:05" -> saralash kaliti */
function knVaqtKalit(sana, soat){ return String(sana || "").split(".").reverse().join("") + (soat || ""); }

document.addEventListener("mkb:tayyor", async () => {
  const D = MKB_DATA;
  await knYukla(["KIRISH_NUQTALARI", "QURILMALAR", "KIRISH_VOQEALARI"]);
  const id = new URLSearchParams(location.search).get("id");
  const n = D.kirishNuqtasi(id) || D.KIRISH_NUQTALARI[0];
  if (!n){ location.replace("xato-404.html"); return; }
  document.getElementById("hs-meta").textContent = n.id;
  document.getElementById("n-nom").textContent = n.nom;
  document.getElementById("n-holat").innerHTML = chip(KN_HOLAT, n.holat);
  document.getElementById("n-obyekt").innerHTML =
    '<a href="obyekt.html?id=' + encodeURIComponent(n.obyektId) + '">' + obyektNomi(n.obyektId) + "</a>";
  document.getElementById("n-qavat").textContent = n.qavat + "-qavat";
  document.getElementById("n-tur").textContent = n.turNomi;
  document.getElementById("n-rejim").textContent = n.rejim;
  document.getElementById("n-vaqt").textContent = n.ishVaqti;
  document.getElementById("n-aloqa").textContent = n.oxirgiAloqa;

  const qurilma = D.QURILMALAR.filter(q => q.kirishNuqtaId === n.id);
  document.getElementById("n-qurilmalar").innerHTML = qurilma.length ? qurilma.map(q =>
    '<a class="qator" href="qurilma.html?id=' + encodeURIComponent(q.id) + '">' +
      '<span class="belgi ' + (q.holat === "nosoz" ? "pushti" : q.holat === "ogohlantirish" ? "lavanda" : "") + '">' +
        ik(q.tur === "kamera" ? "kamera" : q.tur === "yuz" ? "yuz" : q.tur === "oquvchi" ? "skaner" : "qurilma") + "</span>" +
      '<span class="matn"><b>' + q.turNomi + "</b><span>" + q.model + " · " + q.seriya + "</span></span>" +
      '<span class="ong">' + chip(QR_HOLAT, q.holat) + "</span></a>").join("")
    : '<div class="bosh-holat">Qurilma o&#39;rnatilmagan</div>';

  /* voqealar va dinamika jurnaldan — saqlangan masofaviy ochishlar ham kiradi */
  function voqealarChiz(){
    const voqea = D.KIRISH_VOQEALARI.filter(v => v.kirishNuqtaId === n.id)
      .sort((a, b) => knVaqtKalit(b.sana, b.soat).localeCompare(knVaqtKalit(a.sana, a.soat)));
    const joy = document.getElementById("n-voqealar");
    joy.innerHTML = voqea.length
      ? voqea.slice(0, 6).map(voqeaQatori).join("")
      : '<div class="bosh-holat">Bu nuqta bo&#39;yicha voqea qayd etilmagan</div>';
    tarjimaQil(joy);

    const kunlar = [];
    for (let i = 6; i >= 0; i--){
      const d = new Date(2026, 7, 26 - i);
      const s = String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
      kunlar.push([String(d.getDate()), voqea.filter(v => v.sana === s).length]);
    }
    MKB.barlar("n-dinamika", kunlar.map(k => [k[0] + "-kun", k[1]]));
  }
  voqealarChiz();

  document.getElementById("n-sorov").href = "kirish-soravi.html?nuqta=" + encodeURIComponent(n.id);
  document.getElementById("n-masofaviy").href = "masofaviy-korik.html?obyekt=" + encodeURIComponent(n.obyektId);
  let band = false;
  document.getElementById("n-ochish").addEventListener("click", () => {
    if (n.holat !== "onlayn"){ MKB.toast("Nuqta oflayn, uni masofadan ochib bo'lmaydi", "xavf"); return; }
    MKB.modal("Masofadan ochish — " + n.nom,
      '<p style="font-size:14px;line-height:1.6;color:var(--matn-2)">Eshik 10 soniyaga ochiladi. ' +
      "Amal kirish voqealari jurnaliga operator nomi bilan yoziladi.</p>" +
      '<div class="maydon" style="margin-top:14px"><label class="maydon-yorliq">Ochish asosi <b>*</b></label>' +
      '<div class="kirish"><select id="mo-sabab"><option>Rejali ko&#39;rik</option>' +
      "<option>Texnik xizmat</option><option>Favqulodda holat</option>" +
      "<option>Hujjatlarni olib chiqish</option></select></div></div>",
      {okMatn: "Ochish", ok: pd => {
        if (band) return false;
        band = true;
        const sabab = pd.querySelector("#mo-sabab").value;
        const soat = knSoat();
        knSaqla(async () => {
          await knYangi("KIRISH_VOQEALARI", {
            id: await knKeyingiId("KIRISH_VOQEALARI", "KV-"), vaqt: D.KIRISH_BUGUN + " " + soat,
            sana: D.KIRISH_BUGUN, soat: soat, obyektId: n.obyektId, kirishNuqtaId: n.id,
            nuqtaNomi: n.nom, shaxsId: null, operator: knKim(), usul: "Masofadan ochish",
            natija: "ruxsat", sabab: sabab, yonalish: "kirish",
          });
          await knYangila("KIRISH_NUQTALARI", n.id,
            {kunlikOtish: (n.kunlikOtish || 0) + 1, oxirgiAloqa: D.KIRISH_BUGUN + " " + soat});
          document.getElementById("n-aloqa").textContent = n.oxirgiAloqa;
          voqealarChiz();
          MKB.toast("Eshik ochildi va jurnalga yozildi");
        }).then(() => { band = false; });
      }});
  });
});
</script>
