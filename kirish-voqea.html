<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Kirish voqeasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.tor-2>*,.ustun>*{min-width:0}
.shaxs-bosh{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.shaxs-bosh b{display:block;font-size:17px;font-weight:500}
.shaxs-bosh span{font-size:13px;color:var(--matn-3)}
.qaror-blok{padding:14px 16px;border-radius:16px;background:var(--plitka);font-size:14px;line-height:1.6}
.kichik-izoh{font-size:12.5px;color:var(--matn-3);line-height:1.55;margin-top:10px}
.amal-qator{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="kirish-voqealari.html?rejim=kirish">Kirish voqealari</a><span class="ajratgich">/</span><span data-tarjimasiz id="hs-kod">—</span></div>
    <div class="hs-qator"><h1 id="kv-nom">Kirish voqeasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div class="tor-2" id="kv-tor">
    <div class="ustun">
      <section class="karta" aria-labelledby="kv-m-s" data-tur="kirish-voqea-malumot">
        <div class="karta-bosh"><h2 id="kv-m-s" data-ikonka="qurilma">Qurilma yozuvi</h2></div>
        <dl class="malumot-royxat" id="kv-malumot"></dl>
        <p class="kichik-izoh">Bu ma'lumot qurilmadan kelgan va o'zgartirilmaydi.</p>
      </section>
      <section class="karta" aria-labelledby="kv-q-s" data-tur="kirish-voqea-qaror">
        <div class="karta-bosh"><h2 id="kv-q-s" data-ikonka="tasdiq">Operator qarori</h2></div>
        <div id="kv-qaror"></div>
      </section>
    </div>
    <div class="ustun">
      <section class="karta" aria-labelledby="kv-s-s">
        <div class="karta-bosh"><h2 id="kv-s-s" data-ikonka="foyd">Shaxs</h2></div>
        <div id="kv-shaxs"></div>
      </section>
      <section class="karta" aria-labelledby="kv-b-s">
        <div class="karta-bosh"><h2 id="kv-b-s" data-ikonka="kalendar">Shu kuni shu obyektda</h2><span class="soni" id="kv-b-soni"></span></div>
        <div id="kv-boshqa"></div>
      </section>
    </div>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(async () => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  const yuklandi = await new Promise(hal => MKB.sahifaYukla({
    joylar: {"kv-malumot": ["qator", 5], "kv-qaror": ["qator", 1], "kv-shaxs": ["qator", 2], "kv-boshqa": ["qator", 3]},
    xato: "Kirish voqeasini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["KIRISH_VOQEALARI", "SHAXSLAR", "RUXSATLAR", "QURILMALAR", "HODISALAR"]);
      ulandi = true;
      hal(true);
    },
  }));
  if (!yuklandi) return;
  /* Yangi kiritilgan shaxs indeksda bo'lmasligi mumkin: to'plamdan ham qidiriladi */
  const shaxsTop = id => D.shaxs(id) || (D.SHAXSLAR || []).find(s => s.id === id) || null;

  const id = new URLSearchParams(location.search).get("id");
  let v = (D.KIRISH_VOQEALARI || []).find(x => x.id === id);
  if (!v || !MKB.doira([v]).length){ location.replace("xato-404.html"); return; }
  const NAT = {ruxsat: ["Ruxsat berildi", "chip-yashil"], rad: ["Rad etildi", "chip-xavf"], ogohlantirish: ["Ogohlantirish", "chip-sariq"], "qayd etildi": ["Qayd etildi", "chip-kul"]};
  const yozadi = MKB.huquq("himoya", "yoz");
  const sh = shaxsTop(v.shaxsId), q = v.qurilmaId ? D.qurilma(v.qurilmaId) : null;
  const QAROR_BELGI = "Operator qarori: ";

  function malumot(){
    const n = NAT[v.natija] || [v.natija || "—", "chip-kul"];
    $("hs-kod").textContent = v.id;
    $("kv-nom").textContent = v.usul || "Kirish voqeasi";
    $("hs-meta").innerHTML = '<span class="chip ' + n[1] + '">' + n[0] + '</span> <span data-tarjimasiz>' + esc(v.vaqt || "") + "</span>";
    const r = [
      ["Obyekt", '<a href="obyekt-himoya.html?id=' + encodeURIComponent(v.obyektId) + '">' + esc(MKB.kn.obyektNomi(v.obyektId)) + "</a>"],
      ["Kirish nuqtasi", esc(v.nuqtaNomi || "—")],
      ["Qurilma", q ? '<a href="qurilma.html?id=' + encodeURIComponent(q.id) + '">' + esc(q.turNomi) + '</a> <span class="kod-mono" data-tarjimasiz>' + esc(q.id) + "</span>" : "<span>Xodim qaydi</span>"],
      ["Usul", esc(v.usul || "—")],
      ["Yo'nalish", v.yonalish === "chiqish" ? "<span>Chiqish</span>" : "<span>Kirish</span>"],
      ["Natija", '<span class="chip chip-kichik ' + n[1] + '">' + n[0] + "</span>"],
    ];
    if (v.yuzMoslik != null) r.push(["Yuz o'xshashligi", '<b data-tarjimasiz>' + esc(v.yuzMoslik) + "%</b>"]);
    if (v.kartaRaqam) r.push(["Karta raqami", '<span data-tarjimasiz>' + esc(v.kartaRaqam) + "</span>"]);
    if (v.ijro === "integratsiyasiz") r.push(["Ijro", "<span>Qurilmaga buyruq yuborilmagan. Eshik joyida qo'lda ochiladi.</span>"]);
    if (v.sabab) r.push(["Sabab", esc(v.sabab)]);
    $("kv-malumot").innerHTML = r.map(x => "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>").join("");
    tarjimaQil(document.querySelector(".hujjat-shapka")); tarjimaQil($("kv-malumot"));
  }

  function shaxs(){
    if (!sh){ $("kv-shaxs").innerHTML = MKB.boshHolat("foyd", v.natija === "qayd etildi" ? "Shaxs aniqlanmaydi" : "Shaxs aniqlanmagan",
      v.natija === "qayd etildi" ? "Eshik datchigi faqat ochilish faktini yozadi" : "Qurilma shaxsni tanimadi"); tarjimaQil($("kv-shaxs")); return; }
    const b = D.sanaOqi(v.sana) || D.bugun();
    const r = (D.RUXSATLAR || []).filter(x => x.shaxsId === sh.id && x.obyektId === v.obyektId)
      .find(x => (!D.sanaOqi(x.boshlanish) || D.sanaOqi(x.boshlanish) <= b) && (!D.sanaOqi(x.tugash) || D.sanaOqi(x.tugash) >= b));
    $("kv-shaxs").innerHTML = '<div class="shaxs-bosh">' + MKB.kn.shaxsSurati(sh, 52) + "<div><b>" + esc(sh.ism) + "</b><span>" + esc([sh.lavozim, sh.tashkilot].filter(Boolean).join(" · ")) + "</span></div></div>" +
      '<dl class="malumot-royxat"><dt>Voqea kunidagi ruxsat</dt><dd>' + (r ? '<span data-tarjimasiz>' + esc(r.id) + "</span> · " + esc(r.usul || "") + " · <span data-tarjimasiz>" + esc(r.boshlanish + " – " + r.tugash) + "</span>"
        : '<span class="chip chip-kichik chip-xavf">Ruxsat yo\'q</span>') + "</dd></dl>";
    tarjimaQil($("kv-shaxs"));
  }

  /* Operator qarori asl natijani o'zgartirmaydi: alohida qayd sifatida saqlanadi */
  function qaror(){
    v = (D.KIRISH_VOQEALARI || []).find(x => x.id === id) || v;
    const qatorlar = String(v.izoh || "").split("\n").filter(s => s.indexOf(QAROR_BELGI) === 0).map(s => s.slice(QAROR_BELGI.length));
    $("kv-qaror").innerHTML = (qatorlar.length ? qatorlar.map(s => '<div class="qaror-blok" style="margin-bottom:8px">' + esc(s) + "</div>").join("")
      : '<p class="kichik-izoh" style="margin-top:0">Operator qarori qayd etilmagan.</p>') +
      (yozadi ? '<div class="amal-qator"><button type="button" class="tugma tugma-' + (qatorlar.length ? "oq" : "asosiy") + '" id="kv-qaror-t" data-yozadi data-tur="kirish-voqea-qaror-qayd">' + ik("tahrir") + "<span>Qaror qayd etish</span></button></div>" : "");
    tarjimaQil($("kv-qaror"));
    const b = $("kv-qaror-t");
    if (b) b.addEventListener("click", qarorForma);
  }
  function qarorForma(){
    const pd0 = MKB.modal("Operator qarori", '<div class="forma-tor">' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="q-q">Qaror <b>*</b></label><div class="kirish"><select id="q-q" name="qaror" required data-xato="Qarorni tanlang"><option value="">Tanlang</option>' +
        '<option value="tasdiq">Voqea joiz, chora kerak emas</option><option value="xato">Qurilma xatosi, soxta signal</option><option value="hodisa">Ruxsatsiz urinish, hodisa ochish</option></select></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="q-i">Asos <b>*</b></label><textarea class="kirish-matn" id="q-i" name="izoh" rows="2" maxlength="300" required minlength="5" data-xato="Nima tekshirilganini yozing" placeholder="Nima tekshirildi"></textarea>' +
        '<span class="maydon-izoh">Qaror ismingiz va vaqt bilan jurnalga yoziladi</span></div>' +
      '<div class="maydon" id="q-j-m" hidden><label class="maydon-yorliq" for="q-j">Hodisa jiddiyligi</label><div class="kirish"><select id="q-j" name="jiddiylik"><option value="yuqori">Yuqori</option><option value="o\'rta" selected>O\'rta</option><option value="past">Past</option></select></div><span class="maydon-izoh">Hodisa ochilganda</span></div>' +
      "</div>", {okMatn: "Qarorni qayd etish", ok: async pd => {
        const tana = pd.querySelector(".modal-tana");
        const t0 = MKB.formaTekshir(tana);
        if (!t0) return false;
        const f = Object.assign({jiddiylik: "o'rta"}, t0.qiymatlar);
        const NOMI = {tasdiq: "Voqea joiz", xato: "Soxta signal", hodisa: "Ruxsatsiz urinish"};
        let hodisa = null;
        const ok = await MKB.saqla(async () => {
          if (f.qaror === "hodisa") hodisa = await MKB.hodisa.yarat({obyektId: v.obyektId, hodisa: "Ruxsatsiz kirishga urinish", jiddiylik: f.jiddiylik, manba: "qurilma",
            tavsif: f.izoh + ". Kirish voqeasi " + v.id + ", " + (v.nuqtaNomi || "") + ", " + (v.vaqt || "") + "."});
          const s = QAROR_BELGI + NOMI[f.qaror] + ". " + f.izoh + " · " + MKB.kim() + ", " + D.sanaYoz(D.bugun()) + " " + MKB.soat() + (hodisa ? " · hodisa " + hodisa.id : "");
          await MKBapi.yangilash("KIRISH_VOQEALARI", v.id, {izoh: [v.izoh, s].filter(Boolean).join("\n")});
        }, f.qaror === "hodisa" ? "Qaror saqlandi. Hodisa ochildi" : "Qaror saqlandi");
        if (!ok) return false;
        qaror();
        if (hodisa) $("kv-qaror").insertAdjacentHTML("beforeend", '<p class="kichik-izoh"><a href="hodisa.html?id=' + encodeURIComponent(hodisa.id) + '">Hodisani ochish: ' + esc(hodisa.id) + "</a></p>");
      }});
    /* Jiddiylik faqat hodisa ochilganda kerak */
    const qs = document.querySelector(".modal #q-q");
    if (qs) qs.addEventListener("change", () => { document.getElementById("q-j-m").hidden = qs.value !== "hodisa"; });
  }

  function boshqa(){
    const r = (D.KIRISH_VOQEALARI || []).filter(x => x.id !== v.id && x.obyektId === v.obyektId && x.sana === v.sana)
      .sort((a, b) => String(b.soat).localeCompare(String(a.soat)));
    $("kv-b-soni").textContent = r.length || "";
    $("kv-boshqa").innerHTML = r.length ? r.slice(0, 8).map(MKB.kn.voqeaQatori).join("") : MKB.boshHolat("soat", "Boshqa voqea yo'q");
    tarjimaQil($("kv-boshqa"));
  }
  malumot(); shaxs(); qaror(); boshqa();
})();
</script>
</body>
</html>
