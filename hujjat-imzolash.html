<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Imzolash navbati</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="hujjat">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Hujjatlar</span></div>
    <div class="hs-qator"><h1>Imzolash navbati</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="hujjatlar.html">Markaz</a><a href="hujjat-shablonlar.html">Shablonlar</a><a href="hujjat-yuklash.html">Yuklash</a><a href="hujjat-imzolash.html" class="faol">Imzolash</a></nav>
  <section class="karta"><div class="karta-bosh"><h2>Imzolash navbati</h2><span class="soni" id="im-soni"></span></div><div id="im-royxat"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  async function chiz(){
    const r = (await MKBapi.royxat("HUJJATLAR")).filter(h => h.holat !== "Tasdiqlangan");
    document.getElementById("im-soni").textContent = r.length + " ta kutilmoqda";
    document.getElementById("im-royxat").innerHTML = r.length ? r.map(h =>
      '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--chiziq-2)">' +
        '<span style="width:38px;height:38px;border-radius:14px;background:var(--sariq-fon);color:var(--sariq);display:grid;place-items:center">' + ik("muhr") + '</span>' +
        '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px">' + h.nom + '</b>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + [h.tur, h.obyektId, h.sana].filter(Boolean).join(" · ") + '</span></span>' +
        '<button type="button" class="tugma tugma-kichik tugma-asosiy" data-imzola="' + h.id + '">Imzolash</button></div>').join("")
      : '<div class="bosh-holat">' + ik("tasdiq") + '<b>Navbat bo\'sh</b><span>Barcha hujjatlar imzolangan</span></div>';
    document.querySelectorAll("[data-imzola]").forEach(b => b.addEventListener("click", async () => {
      await MKBapi.yangilash("HUJJATLAR", b.dataset.imzola, {holat: "Tasdiqlangan"});
      MKB.toast("Imzolandi"); chiz();
    }));
  }
  chiz();
});
</script>
</body>
</html>
