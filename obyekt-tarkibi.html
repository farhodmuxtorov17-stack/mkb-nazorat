<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKB — Obyekt tarkibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mkb.css?v=26082602">
<style>
/* ---- Xonalar va qavatlar (ekran 16) ---- */
.orqa-tugma{width:48px;height:48px;border-radius:14px;background:var(--karta);box-shadow:var(--soya);display:grid;place-items:center;color:#18181B;flex:none}
.orqa-tugma .ic{width:20px;height:20px}
.xq-grid{display:grid;grid-template-columns:335px minmax(0,1fr) 385px;gap:18px;align-items:start}

.obyekt-karta{display:flex;align-items:center;gap:14px}
.obyekt-karta img{width:76px;height:64px;object-fit:cover;border-radius:12px;outline:1px solid rgba(23,26,31,.06);outline-offset:-1px}
.obyekt-karta b{display:block;font-size:17px;font-weight:750}
.obyekt-karta span{display:block;font-size:13px;color:var(--matn-4);margin-top:2px}

.stat-royxat .band{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #F4F4F5}
.stat-royxat .band:last-child{border-bottom:none}
.stat-royxat .tile{width:44px;height:44px;border-radius:12px;background:#E7EEF4;color:#4F46E5;display:grid;place-items:center;flex:none;box-shadow:var(--chuqur-tile)}
.stat-royxat .tile .ic{width:20px;height:20px}
.stat-royxat .yorliq{font-size:13px;color:var(--matn-3)}
.stat-royxat b{display:block;font-size:18px;font-weight:750;margin-top:1px}
.stat-royxat b .yashil{color:#047857}
.stat-royxat b.yashil{color:#047857}

.qavatlar-karta h3{font-size:16.5px;font-weight:750;margin-bottom:8px}
.qavat-band{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:12px;font-size:14px;transition:background var(--tez);
}
.qavat-band:hover{background:#F4F4F5}
.qavat-band.faol{background:#EEF2FF;box-shadow:inset 0 0 0 1px #C7D2FE}
.qavat-band .ic{width:18px;height:18px;color:#52525B}
.qavat-band.faol .ic{color:#3730A3}
.qavat-band b{font-weight:700;color:#18181B}
.qavat-band .tur{color:var(--matn-3)}
.qavat-band .nuqta{margin-left:auto;width:8px;height:8px;border-radius:99px;background:#4F46E5;opacity:0}
.qavat-band.faol .nuqta{opacity:1}

/* Markaz */
.sahna-karta h3{font-size:16.5px;font-weight:750}
.sahna-bosh{display:flex;align-items:center;margin-bottom:12px}
.sahna-bosh .rejim{margin-left:auto;display:flex;gap:6px}
.sahna-bosh .rejim button{height:38px;min-width:48px;padding:0 13px;border-radius:10px;font-size:13.5px;font-weight:700;color:#52525B;border:1px solid var(--kirish-chiziq);transition:all var(--tez)}
.sahna-bosh .rejim button.aktiv{background:#4F46E5;border-color:#4F46E5;color:#fff}
.qavat-sahna{position:relative;border-radius:16px;background:linear-gradient(180deg,#FDFDFC,#F4F5F2);overflow:hidden;min-height:480px}
.qavat-sahna img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:16px 100px 16px 150px;transition:filter var(--tez)}
.qavat-sahna img.sxematik{filter:grayscale(.85) contrast(1.15) brightness(1.08)}
.qavat-yorliq{
  position:absolute;left:16px;display:flex;flex-direction:column;text-align:left;
  padding:8px 13px;border-radius:11px;background:transparent;transition:background var(--tez);
}
.qavat-yorliq:hover{background:#fff;box-shadow:var(--soya-pin)}
.qavat-yorliq b{font-size:13.5px;font-weight:750;color:#18181B}
.qavat-yorliq span{font-size:12px;color:var(--matn-4)}
.qavat-yorliq.faol{background:#EEF2FF;box-shadow:0 0 0 1.5px #A5B4FC, var(--soya-pin)}
.qavat-yorliq.faol::after{
  content:"";position:absolute;left:100%;top:50%;width:34px;height:2px;
  background:repeating-linear-gradient(90deg,#4F46E5 0 5px,transparent 5px 9px);
}
.xonalar-karta{margin-top:16px}
.xonalar-karta h3{font-size:16.5px;font-weight:750;margin-bottom:12px}
.xona-torlar{display:flex;gap:13px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.xona-torlar::-webkit-scrollbar{display:none}
.xona-k{flex:0 0 150px;text-align:left;border-radius:13px}
.xona-k img{width:150px;height:104px;object-fit:cover;border-radius:13px;outline:1px solid rgba(23,26,31,.07);outline-offset:-1px;transition:transform var(--tez)}
.xona-k.faol img{outline:2px solid #4F46E5;outline-offset:0}
.xona-k:hover img{transform:scale(1.02)}
.xona-k b{display:block;font-size:13.5px;font-weight:700;margin-top:8px}
.xona-k span{font-size:12px;color:var(--matn-4)}
.xona-strelka{flex:none;align-self:center;width:38px;height:38px;border-radius:99px;background:var(--karta);box-shadow:var(--soya-pin);display:grid;place-items:center;color:#3F3F46}
.xona-strelka .ic{width:16px;height:16px}

/* O'ng panel */
.xp-bosh{display:flex;align-items:center;gap:10px}
.xp-bosh h2{font-size:20px;font-weight:750}
.xp-bosh .chip{margin-left:auto}
.xp-yop{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#52525B;flex:none}
.xp-yop:hover{background:#F4F4F5}
.xp-blok{margin-top:14px}
.xp-blok h4{font-size:15px;font-weight:750;margin-bottom:4px}
.xp-qator{display:flex;align-items:center;gap:11px;padding:9.5px 0;border-bottom:1px solid #F4F4F5;font-size:13.5px}
.xp-qator:last-child{border-bottom:none}
.xp-qator .ic{width:17px;height:17px;color:#52525B}
.xp-qator .yorliq{color:var(--matn-3)}
.xp-qator b{margin-left:auto;font-weight:650;text-align:right}
.xp-qator b .nuqta{display:inline-block;width:7px;height:7px;border-radius:99px;background:#059669;margin-right:6px;vertical-align:1px}
.jihoz-tugma{width:100%;height:46px;margin-top:10px;border-radius:12px;border:1px solid var(--kirish-chiziq);display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;font-weight:700;transition:background var(--tez)}
.jihoz-tugma:hover{background:#F4F4F5}
.jihoz-tugma .ic{width:15px;height:15px}
.xp-tahrir{width:100%;height:52px;margin-top:16px;border-radius:13px;border:1px solid var(--kirish-chiziq);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14.5px;font-weight:700;transition:background var(--tez)}
.xp-tahrir:hover{background:#F4F4F5}
.xp-tahrir .ic{width:17px;height:17px}
@media (max-width:1600px){.xq-grid{grid-template-columns:300px minmax(0,1fr)}.xq-grid > aside:last-child{grid-column:1/-1}}

/* ---- Interaktiv 3D bino navigatori ---- */
.bino3d{position:absolute;inset:0;display:grid;place-items:center;perspective:1400px;overflow:hidden;cursor:grab;touch-action:none}
.bino3d.sudralmoqda{cursor:grabbing}
.bino3d.sudralmoqda .b3-stack{transition:none}
.b3-korsatma{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--matn-4);
  background:rgba(255,255,255,.82);border:1px solid rgba(228,228,231,.8);
  border-radius:99px;padding:4px 12px;pointer-events:none;white-space:nowrap;
}
.b3-stack{
  position:relative;width:340px;height:230px;
  transform-style:preserve-3d;
  --rx:57deg; --rz:-42deg;
  transform:rotateX(var(--rx)) rotateZ(var(--rz));
  transition:transform .5s cubic-bezier(.23,1,.32,1);
}
.b3-zamin{
  position:absolute;inset:-34px;transform:translateZ(-26px);border-radius:26px;
  background:radial-gradient(closest-side, rgba(16,30,48,.16), rgba(16,30,48,.04) 68%, transparent);
}
.b3-qavat{
  position:absolute;inset:0;border-radius:12px;cursor:pointer;
  transform:translateZ(calc(var(--i) * 36px));
  transition:transform .3s cubic-bezier(.23,1,.32,1), filter .25s;
  background:linear-gradient(135deg,#EEF2FF 0%,#E0E7FF 100%);
  border:1.5px solid rgba(79,70,229,.28);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.55),
    inset -14px -14px 30px rgba(16,48,84,.10),
    0 2px 4px rgba(16,30,48,.18);
}
.b3-qavat:hover{transform:translateZ(calc(var(--i) * 36px + 14px));filter:brightness(1.05)}
.b3-qavat.faol{
  background:linear-gradient(135deg,#C7D2FE 0%,#A5B4FC 100%);
  border-color:var(--asos);
  box-shadow:
    inset 0 0 0 1.5px rgba(79,70,229,.5),
    inset -14px -14px 30px rgba(79,70,229,.14),
    0 0 22px rgba(79,70,229,.35),
    0 2px 4px rgba(16,30,48,.2);
}
/* Qavat qalinligi — old va o'ng qirralar */
.b3-qavat::before{
  content:"";position:absolute;left:-1.5px;right:-1.5px;bottom:-9px;height:9px;
  background:linear-gradient(180deg,#9FB4C8,#7E93A8);
  border-radius:0 0 12px 12px;
  transform:skewX(-45deg) scaleY(1);transform-origin:top;
}
.b3-qavat.faol::before{background:linear-gradient(180deg,#5D89B4,#3D689A)}
/* Tanlangan qavatdagi xonalar taqsimoti */
.b3-xonalar{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:6px;pointer-events:none;opacity:0;transition:opacity .3s}
.b3-qavat.faol .b3-xonalar{opacity:1}
.b3-xona{border-radius:5px;background:rgba(255,255,255,.66);border:1px solid rgba(79,70,229,.30)}
.b3-xona.band{background:rgba(79,70,229,.30)}
.b3-xona.bosh{background:rgba(58,170,62,.24);border-color:rgba(58,170,62,.45)}
/* Qavat raqami plita ustida */
.b3-raqam{
  position:absolute;left:10px;top:8px;font-size:15px;font-weight:800;color:#33506C;
  letter-spacing:-.02em;pointer-events:none;
}
.b3-qavat.faol .b3-raqam{color:#3730A3}
@media (max-width:1200px){.b3-stack{width:280px;height:190px}}

@media (max-width:1200px){.xq-grid{grid-template-columns:minmax(0,1fr)}.qavat-sahna img{padding:16px 20px}}
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const QAVATLAR = [
  ["5","Penthouse"],["4","Ofis qavati"],["3","Ofis qavati"],["2","Savdo qavati"],["1","Kirish va lobby"],["-1","Texnik qavat"]
];
let faolQavat = "3";

function qavatChiz(){
  document.getElementById("qavatlar").innerHTML = QAVATLAR.map(q=>`
    <button class="qavat-band ${q[0]===faolQavat?"faol":""}" data-q="${q[0]}">
      <svg class="ic"><use href="#i-soat"/></svg>
      <b>${q[0]}-qavat</b><span class="tur">${q[1]}</span>
      <span class="nuqta"></span>
    </button>`).join("");
  document.querySelectorAll(".qavat-band").forEach(b=>{
    b.addEventListener("click", ()=>qavatTanla(b.dataset.q));
  });
}
function qavatTanla(q){
  faolQavat = q;
  faolXona = 0;
  document.getElementById("stat-qavat").textContent = q+"-qavat";
  qavatChiz();
  document.querySelectorAll(".qavat-yorliq").forEach(y=>y.classList.toggle("faol", y.dataset.q===q));
  document.querySelectorAll(".b3-qavat").forEach(e=>e.classList.toggle("faol", e.dataset.q===q));
  document.getElementById("xonalar-sarlavha").textContent = `Xonalar (${q}-qavat)`;
  xonalarChiz();
  const royxat = joriyXonalar();
  const panel = document.getElementById("xona-panel");
  if (royxat.length){ panel.style.display = ""; panelChiz(); }
  else { panel.style.display = "none"; }
  MKB.toast(`${q}-qavat tanlandi`, "i-qavat");
}
document.querySelectorAll(".qavat-yorliq").forEach(y=>{
  y.addEventListener("click", ()=>qavatTanla(y.dataset.q));
});

/* ---- 3D stack: qavatlar pastdan yuqoriga ---- */
const B3_TARTIB = ["-1","1","2","3","4","5"];
function b3Chiz(){
  const st = document.getElementById("b3-stack");
  st.querySelectorAll(".b3-qavat").forEach(e=>e.remove());
  B3_TARTIB.forEach((q,i)=>{
    const el = document.createElement("button");
    el.type = "button";
    el.className = "b3-qavat" + (q===faolQavat ? " faol" : "");
    el.style.setProperty("--i", i);
    el.dataset.q = q;
    el.setAttribute("aria-label", q + "-qavatni tanlash");
    const band = XONALAR.filter(x=>x.qavat===q).length;   /* qavatdagi ta'minot birliklari */
    const jami = Math.max(XONALAR.filter(x=>x.qavat===q).length, 0);
    let xon = "";
    for (let k = 0; k < 8; k++){
      const sinf = k < band*2 ? "band" : (k >= 6 && jami ? "bosh" : "");
      xon += `<span class="b3-xona ${sinf}"></span>`;
    }
    el.innerHTML = `<span class="b3-raqam">${q}</span><span class="b3-xonalar">${xon}</span>`;
    el.addEventListener("click", ()=>qavatTanla(q));
    st.appendChild(el);
  });
}

/* XONALAR yagona manbadan (Д-1): obyekt nomi malumot.js reyestridan. */
const XONALAR = MKB_DATA.XONALAR;
let faolXona = 0;

function joriyXonalar(){ return XONALAR.filter(x=>x.qavat===faolQavat); }

function xonalarChiz(){
  const royxat = joriyXonalar();
  if (faolXona >= royxat.length) faolXona = 0;
  document.getElementById("xona-torlar").innerHTML = royxat.length ? royxat.map((x,i)=>`
    <button class="xona-k ${i===faolXona?"faol":""}" data-i="${i}">
      <img loading="lazy" src="${x.rasm}" alt="${x.nom}">
      <b>${x.nom}</b><span>${x.maydon}</span>
    </button>`).join("") : `<div style="padding:24px;color:var(--matn-4);font-size:13.5px">${faolQavat}-qavatda ro'yxatga olingan xona yo'q</div>`;
  document.querySelectorAll(".xona-k").forEach(k=>{
    k.addEventListener("click", ()=>{
      faolXona = +k.dataset.i;
      document.getElementById("xona-panel").style.display = "";
      xonalarChiz(); panelChiz();
    });
  });
}
function panelChiz(){
  const x = joriyXonalar()[faolXona];
  if (!x) return;
  document.getElementById("xona-panel").innerHTML = `
    <div class="xp-bosh">
      <h2>${x.nom}</h2>
      <span class="chip chip-asos">${x.holat}</span>
      <button class="xp-yop" id="xp-yop" aria-label="Yopish"><svg class="ic" style="width:18px;height:18px"><use href="#i-yopish"/></svg></button>
    </div>

    <div class="xp-blok">
      <h4>Umumiy ma'lumotlar</h4>
      <div class="xp-qator"><svg class="ic"><use href="#i-uy"/></svg><span class="yorliq">Xona turi</span><b>${x.tur}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-kengay"/></svg><span class="yorliq">Maydon</span><b>${x.maydon}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-grafik"/></svg><span class="yorliq">Baholashdagi ulush</span><b>${x.ulush}%</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-qavat"/></svg><span class="yorliq">Qavat</span><b>${x.qavat}-qavat</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-info"/></svg><span class="yorliq">Holat</span><b><span class="nuqta" style="background:#059669"></span>${x.holat}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-hujjat"/></svg><span class="yorliq">Kadastr birligi</span><b>${x.kadastr}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-qalqon"/></svg><span class="yorliq">Huquqiy holat</span><b>${x.huquq}</b></div>
      <div class="xp-qator"><svg class="ic"><use href="#i-soat"/></svg><span class="yorliq">Amal qilish muddati</span><b>${x.tur}</b></div>
    </div>

    <div class="xp-blok">

/* Sudrab aylantirish: sahna sichqoncha/barmoq bilan buriladi */
(function(){
  const kon = document.getElementById("bino3d");
  const stack = kon && kon.querySelector(".b3-stack");
  if (!kon || !stack) return;
  const hint = document.createElement("div");
  hint.className = "b3-korsatma";
  hint.textContent = "Aylantirish uchun sudrang";
  kon.appendChild(hint);
  let rx = 57, rz = -42, faol = false, x0 = 0, y0 = 0, surildi = false;
  function qoll(){
    stack.style.setProperty("--rx", rx + "deg");
    stack.style.setProperty("--rz", rz + "deg");
  }
  kon.addEventListener("pointerdown", e => {
    if (e.target.closest(".b3-qavat") && !e.shiftKey){
      /* qavat ustida bosish — tanlash uchun; sudrash faqat bo'sh joydan yoki Shift bilan */
    }
    faol = true; surildi = false; x0 = e.clientX; y0 = e.clientY;
    kon.setPointerCapture(e.pointerId);
  });
  kon.addEventListener("pointermove", e => {
    if (!faol) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!surildi && Math.hypot(dx, dy) < 5) return;
    if (!surildi){ surildi = true; kon.classList.add("sudralmoqda"); hint.style.opacity = "0"; }
    rz += dx * 0.35; rx -= dy * 0.3;
    rx = Math.max(28, Math.min(80, rx));
    qoll();
    x0 = e.clientX; y0 = e.clientY;
  });
  function tugat(e){
    if (!faol) return;
    faol = false;
    kon.classList.remove("sudralmoqda");
    if (surildi){
      /* sudrashdan keyingi click qavat tanlamasin */
      const stop = ev => { ev.stopPropagation(); ev.preventDefault(); kon.removeEventListener("click", stop, true); };
      kon.addEventListener("click", stop, true);
      setTimeout(() => kon.removeEventListener("click", stop, true), 60);
    }
  }
  kon.addEventListener("pointerup", tugat);
  kon.addEventListener("pointercancel", tugat);
  kon.addEventListener("dblclick", () => { rx = 57; rz = -42; qoll(); });
})();
</script>
