<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Masofaviy ko'rik</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.tor-2>*,.ustun>*,.forma-tor>*{min-width:0}
.kirish select{width:100%;text-overflow:ellipsis}
.bosqich{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--chiziq-2);font-size:14px}
.bosqich:last-child{border-bottom:0}
.bosqich i{font-style:normal;width:28px;height:28px;border-radius:var(--r-pilyula);display:grid;place-items:center;background:var(--plitka);color:var(--matn-3);font-size:12.5px;flex:none}
.bosqich.otdi i{background:var(--mint);color:var(--mint-matn)}
.bosqich.joriy i{background:var(--siyoh);color:var(--oq)}
.bosqich.joriy{font-weight:500}
.amal-qator{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.kichik-izoh{font-size:12.5px;color:var(--matn-3);line-height:1.55;margin-top:10px}
.tanlov-q{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;background:var(--xavf-fon);cursor:pointer}
.tanlov-q input{width:18px;height:18px;margin-top:2px;flex:none}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="masofaviy-korik.html">Masofaviy ko'rik</a></div>
    <div class="hs-qator"><h1 id="mk-nom">Masofaviy ko'rik</h1><span class="hs-meta" id="hs-meta"></span><span class="hs-meta" id="mk-yangilandi" data-sayohat="yangilandi" data-tur="masofaviy-korik-yangilandi" hidden></span><div class="hs-amallar" id="mk-amallar" data-tur="masofaviy-korik-amallar"></div></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html">Ko'rik rejasi</a><a href="korik-kechikkan.html">Kechikkanlar</a><a href="korik-tarixi.html">Ko'riklar tarixi</a><a href="korik-tayinlash.html">Ko'rik tayinlash</a><a href="masofaviy-korik.html" class="faol" aria-current="page">Masofaviy ko'rik</a><a href="inventarizatsiya.html">Inventarizatsiya</a></nav>
  <div id="mk-asosiy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  const KOLLAR = ["MASOFAVIY_SESSIYALAR", "QURILMALAR", "RUXSATLAR", "KORIKLAR"];
  let ulandi = false;
  MKB.sahifaYukla({
    joylar: {"mk-asosiy": ["qator", 6]},
    xato: "Masofaviy ko'riklarni yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(KOLLAR);
      ulandi = true;
      boshla();
    },
  });

  function boshla(){
  const p = new URLSearchParams(location.search);
  const yozadi = MKB.huquq("himoya", "yoz");
  /* Yakunlash ko'riklar tarixiga (KORIKLAR, korik bo'limi) yozuv qo'shadi: korik yozish huquqi yoki YARATISH_ISTISNO kerak */
  const yakunlaydi = yozadi && MKB.yaratadimi("KORIKLAR", "korik");
  /* Video tizimga ulanmagan: inspektor kamera ilovasida ko'radi va bosqichlarni shu yerda belgilaydi */
  const BOSQICHLAR = ["Aloqa o'rnatildi", "Kameralar aylanib chiqildi", "Perimetr ko'rildi", "Ko'rik yakunlandi"];
  const HOL = {rejalashtirilgan: ["Rejalashtirilgan", "chip-info"], jarayonda: ["Jarayonda", "chip-sariq"], yakunlandi: ["Yakunlandi", "chip-yashil"], "bekor qilingan": ["Bekor qilingan", "chip-kul"]};
  const iso = d => D.sanaYoz(d).split(".").reverse().join("-");
  const inspektorlar = (D.FOYDLAR || []).filter(f => f.faol !== false && f.rol === "Ko'rik va xavfsizlik inspektori");
  const kameralar = oid => (D.QURILMALAR || []).filter(q => q.obyektId === oid && q.tur === "kamera-4G");
  const daqiqa = v => { const [a, b] = String(v || "00:00").split(":").map(Number); return (a || 0) * 60 + (b || 0); };
  let belgi = null, soatT = 0, yakunQoriq = null, rejaQoriq = null;


  /* ---------- Ro'yxat va rejalashtirish ---------- */
  let jadval = null;
  const qatorlar = () => MKB.doira(D.MASOFAVIY_SESSIYALAR || []).map(s => ({id: s.id, s, obyekt: MKB.kn.obyektNomi(s.obyektId), sana: s.sana, vaqt: s.vaqt || "", inspektor: s.inspektor || "—",
    holat: (HOL[s.holat] || [s.holat])[0], k: s.holat, kamera: s.kameralar}));
  function meta(){
    const hamma = MKB.doira(D.MASOFAVIY_SESSIYALAR || []);
    const reja = hamma.filter(s => s.holat === "rejalashtirilgan" || s.holat === "jarayonda").length;
    $("hs-meta").innerHTML = '<b data-tarjimasiz>' + reja + "</b> <span>ta rejada</span> · <b data-tarjimasiz>" + hamma.length + "</b> <span>jami</span>";
    tarjimaQil($("hs-meta"));
  }
  function jadvalYangila(){ meta(); if (jadval) jadval.yangila(qatorlar()); }
  function royxat(){
    meta();
    $("mk-amallar").innerHTML = "";
    $("mk-asosiy").innerHTML = '<div class="tor-2"><section class="karta" aria-labelledby="mk-r-s" data-tur="masofaviy-korik-jadval"><div class="karta-bosh"><h2 id="mk-r-s" data-ikonka="qulf">Sessiyalar</h2></div><div id="mk-jadval"></div></section>' +
      '<section class="karta" aria-labelledby="mk-f-s" data-tur="masofaviy-korik-rejalashtirish"><div class="karta-bosh"><h2 id="mk-f-s" data-ikonka="kalendar">Ko\'rikni rejalashtirish</h2></div><div id="mk-forma"></div></section></div>';
    jadval = MKB.jadval("mk-jadval", {qatorlar: qatorlar(), csvNomi: "masofaviy-koriklar",
      qidiruv: ["obyekt", "inspektor", "id"], qidiruvYozuvi: "Obyekt yoki inspektor",
      filtrlar: [{kalit: "holat", nom: "Holat", variantlar: Object.values(HOL).map(h => h[0])}],
      bosh: {sarlavha: "Masofaviy ko'rik o'tkazilmagan", izoh: "Kamerasi bor obyektni joyga bormasdan ko'rish uchun sessiya rejalashtiring"},
      ustunlar: [
        {kalit: "obyekt", nom: "Obyekt", chiz: x => "<b>" + esc(x.obyekt) + '</b><div class="kod-mono" data-tarjimasiz>' + esc(x.id) + "</div>"},
        {kalit: "sana", nom: "Sana", tur: "sana", chiz: x => '<span data-tarjimasiz style="white-space:nowrap">' + esc(x.sana + " " + x.vaqt) + "</span>"},
        {kalit: "inspektor", nom: "Inspektor"},
        {kalit: "holat", nom: "Holat", chiz: x => '<span class="chip chip-kichik ' + (HOL[x.k] || ["", "chip-kul"])[1] + '">' + esc(x.holat) + "</span>"},
      ], saralash: "sana", yonalish: -1,
      bosilganda: x => { location.href = "masofaviy-korik.html?id=" + encodeURIComponent(x.id); }});
    if (!yozadi){ $("mk-forma").innerHTML = MKB.boshHolat("korik", "Rejalashtirish inspektor va xavfsizlik xizmati huquqida"); tarjimaQil($("mk-forma")); return; }
    const obyektlar = MKB.doira(D.YOZUVLAR).filter(y => y.holat !== "Chiqarildi" && kameralar(y.id).length).sort((a, b) => MKB.kn.obyektYorligi(a.id).localeCompare(MKB.kn.obyektYorligi(b.id)));
    if (!obyektlar.length){
      $("mk-forma").innerHTML = MKB.boshHolat("kamera", "Kamerali obyekt yo'q", "Masofaviy ko'rik uchun obyektda 4G kamera bo'lishi kerak",
        '<a class="tugma tugma-asosiy tugma-kichik" href="qurilma-ornatish.html?tur=kamera-4G">' + ik("qoshish") + "Kamera o'rnatish</a>");
      tarjimaQil($("mk-forma")); return;
    }
    const tanla = p.get("obyekt");
    const bugunIso = iso(D.bugun());
    $("mk-forma").innerHTML = '<form class="forma-tor" id="mk-f" novalidate>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-o">Obyekt <b>*</b></label><div class="kirish"><select id="f-o" name="obyektId" required data-xato="Obyektni tanlang"><option value="">Tanlang</option>' +
        obyektlar.map(y => '<option value="' + esc(y.id) + '"' + (y.id === tanla ? " selected" : "") + ">" + esc(MKB.kn.obyektYorligi(y.id) + " · " + kameralar(y.id).length + " kamera") + "</option>").join("") + "</select></div>" +
        '<span class="maydon-izoh">Faqat kamerasi bor obyektlar</span></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-s">Sana <b>*</b></label><div class="kirish"><input id="f-s" type="date" name="sana" required min="' + bugunIso + '" value="' + bugunIso + '"></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-v">Vaqt <b>*</b></label><div class="kirish"><input id="f-v" type="time" name="vaqt" required data-xato="Vaqtni kiriting" value="' + (daqiqa(MKB.soat()) < daqiqa("11:00") ? "11:00" : "16:00") + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-i">Inspektor <b>*</b></label><div class="kirish"><select id="f-i" name="inspektor" required data-xato="Inspektorni tanlang"><option value="">Tanlang</option>' +
        inspektorlar.map(f => '<option value="' + esc(f.nom) + '"' + (f.nom === MKB.kim() ? " selected" : "") + ">" + esc(f.nom) + "</option>").join("") + "</select></div></div></form>" +
      '<div class="amal-qator"><button type="button" class="tugma tugma-asosiy" id="mk-rej" data-yozadi data-saqla data-tur="masofaviy-korik-rejalashtirish-tugma">' + ik("kalendar") + "<span>Ko'rikni rejalashtirish</span></button></div>";
    if (tanla && !obyektlar.some(y => y.id === tanla)){
      const ty = D.topish(tanla) && MKB.doira([D.topish(tanla)]).length ? D.topish(tanla) : null;
      $("mk-forma").insertAdjacentHTML("afterbegin", '<p class="kichik-izoh" style="margin:0 0 12px">' +
        (ty ? '<b data-tarjimasiz>' + esc(MKB.kn.obyektYorligi(ty.id)) + "</b>. " : "") + "<span>Obyektda kamera yo'q.</span> <span>Masofaviy ko'rik uchun obyektda 4G kamera bo'lishi kerak</span>. " +
        (ty ? '<a href="qurilma-ornatish.html?obyekt=' + encodeURIComponent(ty.id) + '&tur=kamera-4G">' + "<span>Kamera o'rnatish</span></a>" : "") + "</p>");
    }
    tarjimaQil($("mk-asosiy"));
    rejaQoriq = MKB.formaQoriqla($("mk-f"), {nom: "Ko'rik rejasi"});
    $("mk-rej").addEventListener("click", () => MKB.band($("mk-rej"), async () => {
      /* Reja sanasi o'tgan bo'lishi mumkin emas: bugun bo'lsa, vaqt hozirdan keyin */
      const f = MKB.formaTekshir($("mk-f"), {
        vaqt: (v, q) => q.sana !== D.sanaYoz(D.bugun()) || daqiqa(v) >= daqiqa(MKB.soat()) || "Bugungi ko'rik vaqti hozirdan keyin bo'lishi kerak",
      });
      if (!f) return;
      const v = f.qiymatlar, d = D.sanaOqi(v.sana);
      let yid = null;
      const ok = await MKB.saqla(async () => {
        yid = await MKB.keyingiId("MASOFAVIY_SESSIYALAR", "MS-" + d.getFullYear() + "/", 3);
        await MKBapi.yangi("MASOFAVIY_SESSIYALAR", {id: yid, obyektId: v.obyektId, sana: v.sana, vaqt: $("f-v").value, inspektor: v.inspektor, holat: "rejalashtirilgan", bosqich: 0,
          bosqichlar: BOSQICHLAR.slice(), kameralar: kameralar(v.obyektId).length, davomiylik: ""});
      });
      if (!ok) return;
      rejaQoriq.toza();
      MKB.toast("Ko'rik " + yid + " rejalashtirildi: " + v.sana + " " + $("f-v").value);
      location.href = "masofaviy-korik.html?id=" + encodeURIComponent(yid);
    }));
  }

  /* ---------- Sessiya ---------- */
  /* Haqiqiy sessiya vaqti: boshlangan paytdan hozirgacha (boshlashda vaqt joriy soatga yoziladi) */
  const otganDaq = s => s.sana === D.sanaYoz(D.bugun()) ? Math.max(0, daqiqa(MKB.soat()) - daqiqa(s.vaqt)) : null;
  function sessiya(sid){
    const s = (D.MASOFAVIY_SESSIYALAR || []).find(x => x.id === sid);
    const y = D.topish(s.obyektId);
    const bq = (s.bosqichlar && s.bosqichlar.length ? s.bosqichlar : BOSQICHLAR);
    const h = HOL[s.holat] || [s.holat, "chip-kul"];
    if (!document.getElementById("hs-kod")) document.querySelector(".hs-yorliq").insertAdjacentHTML("beforeend", '<span class="ajratgich">/</span><span data-tarjimasiz id="hs-kod">' + esc(s.id) + "</span>");
    $("mk-nom").textContent = y ? (y.qisqa || y.nom) : "Masofaviy ko'rik";
    $("hs-meta").innerHTML = '<span class="chip ' + h[1] + '">' + h[0] + '</span> <span data-tarjimasiz>' + esc(s.sana + " " + (s.vaqt || "")) + "</span> · <span>" + esc(s.inspektor || "") + "</span>";
    const faol = yozadi && (s.holat === "rejalashtirilgan" || s.holat === "jarayonda");
    $("mk-amallar").innerHTML = faol && s.holat === "rejalashtirilgan" ? '<button type="button" class="tugma tugma-oq" id="mk-bekor" data-yozadi data-tur="masofaviy-korik-bekor">' + ik("yopish") + "<span>Ko'rikni bekor qilish</span></button>" : "";
    const kam = kameralar(s.obyektId);
    const onl = kam.filter(q => (D.qurilmaHolati(q) || {}).holat === "onlayn");
    const korik = (D.KORIKLAR || []).find(k => k.obyektId === s.obyektId && k.tur === "masofaviy" && String(k.izoh || "").indexOf(s.id) >= 0);
    const amaldagi = (D.RUXSATLAR || []).filter(r => r.obyektId === s.obyektId && r.holat === "amalda");
    const oxirgi = faol && kam.length && s.holat === "jarayonda" && s.bosqich >= bq.length - 1;
    const keyingiTugma = faol && kam.length && !oxirgi
      ? '<button type="button" class="tugma tugma-asosiy" id="mk-keyingi" data-yozadi data-tur="masofaviy-korik-keyingi">' + ik(s.holat === "rejalashtirilgan" ? "ong" : "tasdiq") + "<span>" +
        (s.holat === "rejalashtirilgan" ? "Ko'rikni boshlash" : "Bosqich bajarildi") + "</span></button>" : "";
    $("mk-asosiy").innerHTML = '<div class="tor-2"><div class="ustun">' +
      '<section class="karta" data-tur="masofaviy-korik-bosqichlar"><div class="karta-bosh"><h2 data-ikonka="jadval-ic">Bosqichlar</h2></div>' +
        (s.holat === "jarayonda" ? '<p class="kichik-izoh" id="mk-vaqt" style="margin:0 0 8px"></p>' : "") +
        "<div>" + bq.map((b, i) =>
        '<div class="bosqich' + (i < s.bosqich ? " otdi" : i === s.bosqich && s.holat !== "yakunlandi" ? " joriy" : "") + '"><i>' + (i < s.bosqich ? ik("tasdiq") : i + 1) + "</i><span>" + esc(b) + "</span></div>").join("") + "</div>" +
        (keyingiTugma ? '<div class="amal-qator">' + keyingiTugma + "</div>" : "") +
        (oxirgi && !yakunlaydi ? "<p class=\"kichik-izoh\">Ko'rikni ko'rik inspektori yakunlaydi</p>" : "") +
        (s.holat === "yakunlandi" ? '<p class="kichik-izoh"><span>Davomiyligi:</span> <b data-tarjimasiz>' + esc(s.davomiylik || "—") + "</b>" +
          (korik ? '. <a href="korik-akti.html?id=' + encodeURIComponent(korik.id) + '">Ko\'rik yozuvi ' + esc(korik.id) + "</a>" : "") + "</p>" +
          '<p class="kichik-izoh">Ko\'rik kamera ilovasida o\'tkazildi. Tizim video va suratlarni saqlamaydi.</p>' : "") +
        (s.holat === "bekor qilingan" && s.izoh ? '<p class="kichik-izoh">' + esc(s.izoh) + "</p>" : "") +
      "</section>" +
      (oxirgi && yakunlaydi ? '<section class="karta" data-tur="masofaviy-korik-natija"><div class="karta-bosh"><h2 data-ikonka="korik">Ko\'rik natijasi</h2></div><div id="mk-yakun"></div></section>' : "") +
      '</div><div class="ustun">' +
      '<section class="karta" data-tur="masofaviy-korik-kameralar"><div class="karta-bosh"><h2 data-ikonka="kamera">Kameralar</h2><span class="soni"><span data-tarjimasiz>' + kam.length + "</span> <span>ta kamera</span></span></div>" +
        '<div class="video-panel">' + ik("kamera") + "<b>" + (kam.length ? "Video tizimga ulanmagan" : "Kamera ulanmagan") + "</b><span>" +
          (kam.length ? "Kameralarni kamera ilovasida oching va har bir bosqichni shu yerda belgilang." : "Obyektda kamera yo'q. Masofaviy ko'rik o'tkazib bo'lmaydi.") + "</span></div>" +
        (kam.length ? kam.map(q => { const qh = D.qurilmaHolati(q) || {}; return '<a class="qator" href="qurilma.html?id=' + encodeURIComponent(q.id) + '"><span class="belgi ' + (qh.holat === "onlayn" ? "mint" : "pushti") + '">' + ik("kamera") +
          '</span><span class="matn"><b>' + esc(q.model || q.turNomi) + '</b><span><span data-tarjimasiz>' + esc(q.id) + '</span> · <span>Oxirgi signal</span> <span data-tarjimasiz>' + esc(q.oxirgiSignal || "—") + "</span></span></span></a>"; }).join("") : "") +
      "</section>" +
      '<section class="karta" data-tur="masofaviy-korik-ruxsatlar"><div class="karta-bosh"><h2 data-ikonka="ruxsat">Obyektga ruxsatlar</h2><span class="soni" data-tarjimasiz>' + (amaldagi.length || "") + "</span></div>" +
        (amaldagi.length ? amaldagi.map(r => { const sh = D.shaxs(r.shaxsId) || (D.SHAXSLAR || []).find(x => x.id === r.shaxsId); return '<div class="qator">' + MKB.kn.shaxsSurati(sh) + '<span class="matn"><b>' + esc(sh ? sh.ism : "—") + "</b><span>" + esc(r.usul || "") +
          ' · <span data-tarjimasiz>' + esc(r.tugash || "") + "</span></span></span></div>"; }).join("") : MKB.boshHolat("ruxsat", "Amaldagi ruxsat yo'q")) +
      "</section></div></div>";
    tarjimaQil(document.querySelector(".hujjat-shapka")); tarjimaQil($("mk-asosiy"));
    clearInterval(soatT);
    const vaqtChiz = () => { const el = $("mk-vaqt"); if (!el) return; const d = otganDaq(s);
      el.innerHTML = "<span>Boshlangan:</span> <b data-tarjimasiz>" + esc(s.vaqt || "—") + "</b>" + (d != null ? " · <span data-tarjimasiz>" + d + "</span> <span>daqiqa davom etmoqda</span>" : ""); tarjimaQil(el); };
    vaqtChiz(); if (s.holat === "jarayonda") soatT = setInterval(vaqtChiz, 30000);
    const kb = $("mk-keyingi");
    if (kb) kb.addEventListener("click", () => keyingi(s, kb));
    const bk = $("mk-bekor");
    if (bk) bk.addEventListener("click", () => bekorQil(s));
    if (oxirgi && yakunlaydi) yakunForma(s, amaldagi);
  }

  /* Boshlash va bosqich belgilash darhol yoziladi, qaytarish mumkin */
  async function keyingi(s, tugma){
    const eski = {holat: s.holat, bosqich: s.bosqich, vaqt: s.vaqt, sana: s.sana};
    const boshlash = s.holat === "rejalashtirilgan";
    const patch = boshlash ? {holat: "jarayonda", bosqich: 1, vaqt: MKB.soat(), sana: D.sanaYoz(D.bugun())} : {bosqich: s.bosqich + 1};
    const ok = await MKB.band(tugma, () => MKB.saqla(() => MKBapi.yangilash("MASOFAVIY_SESSIYALAR", s.id, patch)));
    if (!ok) return;
    sessiya(s.id);
    MKB.qaytarish(boshlash ? "Ko'rik " + s.id + " boshlandi" : "Bosqich belgilandi", {
      bekor: () => MKBapi.yangilash("MASOFAVIY_SESSIYALAR", s.id, eski),
      keyin: () => sessiya(s.id),
    });
  }
  async function bekorQil(s){
    const r = await MKB.tasdiqla({
      sarlavha: "Masofaviy ko'rikni bekor qilish",
      matn: "Sessiya bekor qilingan deb belgilanadi va rejadan chiqadi.",
      tafsilot: [["Obyekt", MKB.kn.obyektNomi(s.obyektId)], ["Sessiya", {matn: s.id, tarjimasiz: true}], ["Reja", {matn: s.sana + " " + (s.vaqt || ""), tarjimasiz: true}], ["Inspektor", s.inspektor || "—"]],
      ton: "xavfli", sabab: {majburiy: true, min: 5, maks: 300, yorliq: "Bekor qilish sababi", namuna: "Masalan: kamera aloqasi yo'q, ko'rik joyida o'tkaziladi"},
      okMatn: "Ko'rikni bekor qilish", bekorMatn: "Orqaga",
      bajar: ({sabab}) => MKBapi.yangilash("MASOFAVIY_SESSIYALAR", s.id, {holat: "bekor qilingan", izoh: "Bekor qilindi: " + sabab + " · " + MKB.kim()}),
    });
    if (!r) return;
    MKB.toast("Ko'rik " + s.id + " bekor qilindi");
    sessiya(s.id);
  }

  /* Baho shkalasi korik-otkazish.html bilan bir xil: 2 va 1 hodisa sifatida qayd etiladi */
  const BAHO = [[5, "A'lo"], [4, "Yaxshi"], [3, "Qoniqarli"], [2, "Nuqsonli"], [1, "Avariya holati"]];
  function yakunForma(s, amaldagi){
    const bq = s.bosqichlar && s.bosqichlar.length ? s.bosqichlar : BOSQICHLAR;
    const ertaga = iso(D.kunQosh(D.bugun(), 1));
    $("mk-yakun").innerHTML = '<form class="forma-tor" id="mk-yf" novalidate>' +
      bq.map((b, i) => '<div class="maydon"><label class="maydon-yorliq" for="y-n' + i + '">' + esc(b) + ' <b>*</b></label><div class="kirish"><select id="y-n' + i + '" name="n' + i + '" required>' +
        '<option value="">Tanlang</option><option value="joyida">Joyida</option><option value="kamchilik">Kamchilik</option></select></div></div>').join("") +
      '<div class="maydon"><label class="maydon-yorliq" for="y-b">Holat bahosi <b>*</b></label><div class="kirish"><select id="y-b" name="holatBall" required>' +
        BAHO.map(([v, n]) => '<option value="' + v + '"' + (v === 4 ? " selected" : "") + ">" + v + " · " + n + "</option>").join("") + "</select></div>" +
        '<span class="maydon-izoh">Nuqsonli yoki avariya holati hodisa sifatida qayd etiladi va xavfsizlik xizmatiga yuboriladi.</span></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="y-k">Keyingi ko\'rik <b>*</b></label><div class="kirish"><input id="y-k" type="date" name="keyingi" required min="' + ertaga + '" value="' + iso(D.kunQosh(D.bugun(), D.param("korikDavriBino") || 90)) + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="y-x">Xulosa <b>*</b></label><textarea class="kirish-matn" id="y-x" name="xulosa" rows="2" maxlength="400" required minlength="10" data-xato="Xulosani yozing"></textarea></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="y-km">Kamchiliklar</label><textarea class="kirish-matn" id="y-km" name="kamchiliklar" rows="2" maxlength="400" placeholder="Bo\'lmasa bo\'sh qoldiring"></textarea></div>' +
      (amaldagi.length ? '<label class="tanlov-q keng" style="grid-column:1/-1"><input type="checkbox" name="bekor"><span><b style="font-weight:500">Obyektga barcha ruxsatlarni bekor qilish</b><br><span>Ruxsatsiz kirish belgisi ko\'rilganda belgilang.</span> <span>Amaldagi ruxsatlar:</span> <span data-tarjimasiz>' + amaldagi.length + "</span></span></label>" : "") +
      "</form>" +
      '<div class="amal-qator"><button type="button" class="tugma tugma-asosiy" id="mk-yakunla" data-yozadi data-tur="masofaviy-korik-yakunlash">' + ik("tasdiq") + "<span>Ko'rikni yakunlash</span></button></div>";
    tarjimaQil($("mk-yakun"));
    if (yakunQoriq) yakunQoriq.yoq();
    yakunQoriq = MKB.formaQoriqla($("mk-yf"), {nom: "Masofaviy ko'rik natijasi"});
    $("mk-yakunla").addEventListener("click", async () => {
      const kamchilikBor = () => bq.some((_, i) => $("y-n" + i).value === "kamchilik") || +$("y-b").value <= 2;
      const t0 = MKB.formaTekshir($("mk-yf"), {kamchiliklar: v => !kamchilikBor() || String(v || "").trim().length >= 5 || "Bandlarda yoki bahoda kamchilik belgilangan: kamchilikni yozing"});
      if (!t0) return;
      const f = t0.qiymatlar;
      const ball = +f.holatBall;
      const chekList = bq.map((b, i) => ({band: b, natija: f["n" + i]}));
      const kamchiliklar = String(f.kamchiliklar || "").trim();
      const daq = otganDaq(s);
      const bekor = !!f.bekor && amaldagi.length;
      const bahoNomi = (BAHO.find(b => b[0] === ball) || [ball, ""])[1];
      const r = await MKB.tasdiqla({
        sarlavha: "Masofaviy ko'rikni yakunlash",
        matn: "Ko'rik yakunlanadi va obyektning ko'riklar tarixiga yoziladi. Keyingi ko'rik sanasi belgilanadi.",
        tafsilot: [["Obyekt", MKB.kn.obyektNomi(s.obyektId)], ["Inspektor", s.inspektor || MKB.kim()], ["Davomiyligi", {matn: daq != null ? daq + " daq" : "—", tarjimasiz: true}],
          ["Holat bahosi", ball + " · " + bahoNomi], ["Keyingi ko'rik", {matn: f.keyingi, tarjimasiz: true}]],
        oqibat: [].concat(ball <= 2 ? ["Nuqson yoki avariya holati hodisa sifatida qayd etiladi"] : [], bekor ? ["Obyektga barcha amaldagi ruxsatlar to'xtatiladi"] : []),
        okMatn: "Ko'rikni yakunlash", bekorMatn: "Orqaga",
        bajar: async () => {
          const kid = await MKB.keyingiId("KORIKLAR", "KO-" + D.bugun().getFullYear() + "/", 4);
          await MKBapi.yangi("KORIKLAR", {id: kid, obyektId: s.obyektId, korikTuri: "Masofaviy", tur: "masofaviy", sana: D.sanaYoz(D.bugun()), holat: "otkazildi", inspektor: s.inspektor || MKB.kim(),
            holatBall: ball, chekList, kamchiliklar, xarajatTaklifi: null,
            keyingiKorikSana: f.keyingi, xulosa: f.xulosa, izoh: "Masofaviy sessiya " + s.id + (bekor ? ". Ruxsatlar bekor qilindi: " + amaldagi.length : "")});
          await MKBapi.yangilash("MASOFAVIY_SESSIYALAR", s.id, {holat: "yakunlandi", bosqich: bq.length, davomiylik: daq != null ? Math.max(1, daq) + " daqiqa" : "—"});
          if (bekor) for (const rx of amaldagi) await MKBapi.yangilash("RUXSATLAR", rx.id, {holat: "to'xtatilgan", tugash: D.sanaYoz(D.bugun())});
          if (ball <= 2){
            try{
              await MKB.hodisa.yarat({obyektId: s.obyektId, hodisa: ball === 1 ? "Ko'rikda avariya holati aniqlandi" : "Ko'rikda nuqson aniqlandi",
                jiddiylik: ball === 1 ? "yuqori" : "o'rta", tavsif: kid + " (" + s.id + "): " + kamchiliklar, manba: "korik"});
            }catch(err){ MKB.toast("Hodisa yaratilmadi: " + err.message, "xavf"); }
          }
          return kid;
        },
      });
      if (!r) return;
      yakunQoriq.toza();
      MKB.toast("Ko'rik " + s.id + " yakunlandi va " + r.qiymat + " sifatida tarixga yozildi");
      sessiya(s.id);
    });
  }

  if (p.get("id")){
    const s0 = (D.MASOFAVIY_SESSIYALAR || []).find(x => x.id === p.get("id"));
    if (!s0 || !MKB.doira([s0]).length){ location.replace("xato-404.html"); return; }
    sessiya(s0.id);
    belgi = MKB.yangilanganBelgi("mk-yangilandi", {avto: 60, yangila: async () => { await MKB.kn.yukla(KOLLAR); sessiya(s0.id); }});
  } else {
    royxat();
    belgi = MKB.yangilanganBelgi("mk-yangilandi", {avto: 60, yangila: async () => { await MKB.kn.yukla(KOLLAR); jadvalYangila(); }});
  }
  belgi.belgila();
  }
})();
</script>
</body>
</html>
