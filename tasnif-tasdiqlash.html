<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Tasdiqlash navbati</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="zaxira">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Tasnif va zaxira</span></div>
    <div class="hs-qator"><h1>Tasdiqlash navbati</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="tasniflash.html">Tasniflash</a><a href="zaxira-hisobi.html">Zaxira hisobi</a><a href="tasnif-dinamika.html">Dinamika</a><a href="tasnif-tasdiqlash.html" class="faol">Tasdiqlash</a></nav>
  <section class="karta"><div class="karta-bosh"><h2>Tasdiqlash navbati</h2><span class="soni" id="tt-soni"></span></div><div id="tt-royxat"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  async function chiz(){
    const r = await MKBapi.royxat("TASDIQLAR");
    const ochiq = r.filter(t => !t.hal);
    document.getElementById("tt-soni").textContent = ochiq.length + " ta kutilmoqda";
    document.getElementById("tt-royxat").innerHTML = ochiq.length ? ochiq.map(t =>
      '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--chiziq-2)">' +
        '<span style="width:38px;height:38px;border-radius:14px;background:var(--brend-fon);color:var(--brend-quyuq);display:grid;place-items:center">' + ik("muhr") + '</span>' +
        '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px">' + t.sarlavha + '</b>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + (t.org || "") + ' · ' + (t.sub || "") + ' · ' + (t.vaqt || "") + '</span></span>' +
        '<button type="button" class="tugma tugma-kichik tugma-oq" data-rad="' + t.id + '">Rad etish</button>' +
        '<button type="button" class="tugma tugma-kichik tugma-asosiy" data-ok="' + t.id + '">Tasdiqlash</button>' +
      '</div>').join("")
      : '<div class="bosh-holat">' + ik("tasdiq") + '<b>Navbat bo\'sh</b><span>Barcha so\'rovlar ko\'rib chiqilgan</span></div>';
    document.querySelectorAll("[data-ok]").forEach(b => b.addEventListener("click", async () => {
      await MKBapi.yangilash("TASDIQLAR", b.dataset.ok, {hal: "tasdiqlandi"});
      MKB.toast("Tasdiqlandi"); chiz();
    }));
    document.querySelectorAll("[data-rad]").forEach(b => b.addEventListener("click", async () => {
      await MKBapi.yangilash("TASDIQLAR", b.dataset.rad, {hal: "rad"});
      MKB.toast("Rad etildi"); chiz();
    }));
  }
  chiz();
});
</script>
</body>
</html>
