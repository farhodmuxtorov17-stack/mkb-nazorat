<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko'rik o'tkazish</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.ko-band{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--chiziq)}
.ko-band:first-child{border-top:0;padding-top:4px}
.ko-band > .ko-nom{flex:1 1 220px;min-width:0;font-size:14px;line-height:1.4}
.ko-band > .ko-nom small{display:block;color:var(--matn-3);font-size:12.5px}
.ko-band .ko-izoh{flex:1 1 100%}
.segment{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--plitka);border-radius:var(--r-pilyula)}
.segment label{position:relative;cursor:pointer}
.segment input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.segment span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--r-pilyula);font-size:13.5px;color:var(--matn-2);transition:background var(--tez),color var(--tez)}
.segment input:checked + span{background:var(--siyoh);color:#fff}
.segment input[value="kamchilik"]:checked + span,.segment input[value="1"]:checked + span,.segment input[value="2"]:checked + span{background:var(--pushti);color:var(--pushti-matn)}
.segment input:focus-visible + span{outline:2px solid var(--siyoh);outline-offset:2px}
.segment.xato{box-shadow:inset 0 0 0 1.5px var(--xavf)}
.ko-fotolar{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.ko-fotolar figure{margin:0;min-width:0}
.ko-fotolar img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-kichik);background:var(--plitka);display:block}
.ko-fotolar figcaption{font-size:12.5px;color:var(--matn-3);margin-top:4px;line-height:1.35}
.ko-uzoq{color:var(--xavf-matn-yorqin)}
.ko-kamera{width:100%;justify-content:center;margin-bottom:10px;min-height:48px}
.ko-marshrut summary{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:14px;color:var(--matn-2)}
.ko-marshrut ol{margin:6px 0 0;padding-left:22px;font-size:14px;line-height:1.45}
.ko-marshrut li{padding:4px 0}
.ko-marshrut li.joriy{font-weight:600}
.ko-marshrut small{color:var(--matn-3);font-size:12.5px}
.ko-qadam{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--r-pilyula);background:var(--siyoh);color:#fff;font-size:13px;flex:none}
.ko-qoshimcha summary{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:14px;color:var(--matn-2)}
.ko-qoshimcha summary:focus-visible{outline:2px solid var(--siyoh);outline-offset:2px;border-radius:var(--r-kichik)}
.ko-band > .maydon-xato{flex:1 1 100%}
#ko-ildiz > .skelet-royxat,#ko-ildiz > .xato-holat{background:var(--oq);border-radius:var(--r-karta);padding:24px;box-shadow:var(--soya)}
@media (max-width:720px){.segment{width:100%}.segment label{flex:1 1 auto}.segment span{justify-content:center;width:100%;padding:0 10px}}
</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="korik-rejasi.html">Ko'rik rejasi</a><span class="ajratgich">/</span><span>Ko'rik o'tkazish</span></div>
    <div class="hs-qator"><h1>Ko'rik o'tkazish</h1><span class="hs-meta" id="hs-meta" data-tarjimasiz>—</span></div>
  </div>

  <div id="ko-ildiz" class="ustun">
    <section class="karta"><div class="skelet-royxat" aria-busy="true"></div></section>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script src="yadro/dalolatnoma.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc;
  const ildiz = document.getElementById("ko-ildiz");
  MKB.sahifaYukla({joylar: {"ko-ildiz": ["qator", 6]}, xato: "Ko'rik ma'lumotini yuklab bo'lmadi", ish: boshla});

  async function boshla(){
  await MKB.kolYukla(["KORIKLAR", "INVENTAR", "FAYLLAR"]);
  const bugun = () => { const b = D.bugun(); return new Date(b.getFullYear(), b.getMonth(), b.getDate()); };
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const b = bugun();
  const id = new URLSearchParams(location.search).get("id");
  const k = id ? (D.KORIKLAR || []).find(x => x.id === id) || await MKBapi.bitta("KORIKLAR", id) : null;
  if (!k){
    ildiz.innerHTML = '<section class="karta">' + MKB.boshHolat("korik", "Ko'rik topilmadi", "Ko'rikni rejadan tanlang",
      '<a class="tugma tugma-asosiy" href="korik-rejasi.html" style="margin-top:12px">Ko\'rik rejasi</a>') + "</section>";
    tarjimaQil(ildiz);
    return;
  }
  /* O'tkazilgan ko'rik qayta o'tkazilmaydi */
  if (k.holat === "otkazildi"){ location.replace("korik-akti.html?id=" + encodeURIComponent(k.id)); return; }
  const y = D.topish(k.obyektId);
  if (!y || !MKB.doira([y]).length){ location.replace("xato-404.html"); return; }

  const BAHO = [[5, "A'lo"], [4, "Yaxshi"], [3, "Qoniqarli"], [2, "Nuqsonli"], [1, "Avariya holati"]];
  const BAHO_NOM = Object.fromEntries(BAHO);
  const turi = k.korikTuri || k.tur || "Rejali";
  const davr = D.binolimi(y) ? D.param("korikDavriBino") : D.param("korikDavriTransport");
  /* Sotuv oldi ko'rigida qo'shimcha bandlar */
  const SOTUV_OLDI = ["Obyekt xaridorga ko'rsatishga tayyor", "Fotojadval sotuv e'loni uchun yangilandi", "Kalitlar soni hujjatdagiga mos", "Hududga kirish yo'li ochiq"];
  const bandlar = (D.korikChekListi ? D.korikChekListi(y) : []).concat(turi === "Sotuv oldi" ? SOTUV_OLDI : []);
  const hisoblagichlar = D.binolimi(y) ? (y.kommunal || []).filter(x => x.holat !== "mavjud emas") : [];
  const inv = (D.INVENTAR || []).find(i => i.obyektId === y.id);
  const XIZMAT = {elektr: "Elektr", gaz: "Gaz", suv: "Suv"};
  const kechikish = D.kunFarqi(D.sanaOqi(k.sana), b);
  /* Surat qoidasi: har bir kamchilikli bandga kamida bitta surat, nuqsonli yoki avariya bahosida va sotuv oldi ko'rigida kamida bitta.
     Obyekt turi bo'yicha me'yor PARAMETRLAR da bo'lsa (korikSuratBino / korikSuratTransport) u ham qo'llanadi. */
  const turMeyori = Number(D.param(D.binolimi(y) ? "korikSuratBino" : "korikSuratTransport")) || 0;
  document.getElementById("hs-meta").textContent = k.id;

  const segment = (nom, variantlar) => '<div class="segment" role="radiogroup" data-segment="' + nom + '">' +
    variantlar.map(([v, m]) => '<label><input type="radio" name="' + nom + '" value="' + v + '"><span>' + m + "</span></label>").join("") + "</div>";

  ildiz.innerHTML =
    '<section class="karta">' +
      '<div class="qator" style="margin:-6px -16px 0">' + MKB.obyektSurati(y, {kichik: true, sinf: "media"}) +
        '<span class="matn"><b>' + esc(y.qisqa || y.nom) + '</b><span><span class="kod-mono" data-tarjimasiz>' + esc(y.id) + "</span> · <span>" + esc(y.tur || "") + "</span> · <span>" + esc(y.manzil || y.hudud || "") + "</span></span></span>" +
        '<span class="ong"><span class="chip chip-oq">' + esc(turi) + "</span>" +
          (kechikish > 0 ? '<span class="chip chip-xavf"><span>Kechikkan</span>&nbsp;<span data-tarjimasiz>' + kechikish + "</span>&nbsp;<span>kun</span></span>" : '<span class="chip chip-kok"><span>Reja</span>&nbsp;<span data-tarjimasiz>' + esc(k.sana) + "</span></span>") +
        "</span></div>" +
      (k.izoh ? '<p class="maydon-izoh" style="margin:12px 0 0"><span>Topshiriq:</span> ' + esc(k.izoh) + "</p>" : "") +
      '<div id="ko-qoralama-joy" data-sayohat="qoralama"></div><div id="ko-marshrut" data-sayohat="marshrut"></div>' +
    "</section>" +
    '<form id="ko-forma" class="ustun" novalidate>' +
      '<section class="karta" data-sayohat="chek-list"><div class="karta-bosh"><span class="ko-qadam" data-tarjimasiz>1</span><h2>Nazorat bandlari</h2><span class="soni" id="ko-band-soni" data-tarjimasiz></span>' +
        '<button type="button" class="tugma tugma-kichik tugma-oq" id="ko-hammasi">Barchasi joyida</button></div>' +
        '<div id="ko-bandlar">' + bandlar.map((t, i) =>
          '<div class="ko-band" data-band="' + i + '"><span class="ko-nom">' + esc(t) + "</span>" +
          segment("b" + i, [["joyida", "Joyida"], ["kamchilik", "Kamchilik"], ["tekshirilmadi", "Tekshirilmadi"]]) +
          '<div class="ko-izoh" hidden><textarea class="kirish-matn" name="bi' + i + '" style="min-height:64px" placeholder="Kamchilikni qisqa yozing" aria-label="Kamchilik izohi"></textarea></div></div>').join("") +
        "</div></section>" +
      '<section class="karta"><div class="karta-bosh"><span class="ko-qadam" data-tarjimasiz>2</span><h2>' + (D.binolimi(y) ? "Hisoblagichlar" : "Ko'rsatkich") + "</h2></div>" +
        '<div class="forma-tor">' +
        (D.binolimi(y)
          ? (hisoblagichlar.length ? hisoblagichlar.map((h, i) =>
              '<div class="maydon"><label class="maydon-yorliq" for="ko-h' + i + '"><span>' + XIZMAT[h.xizmat] + '</span> <span class="kod-mono" data-tarjimasiz>' + esc(h.hisoblagich || "") + "</span></label>" +
              '<div class="kirish"><input id="ko-h' + i + '" name="h' + i + '" type="text" data-format="kasr" placeholder="Ko\'rsatkich"></div>' +
              '<span class="maydon-izoh">' + (h.korsatkich != null ? "<span>Oldingi:</span> <span data-tarjimasiz>" + MKB.fmt(h.korsatkich) + (h.korsatkichSana ? " · " + esc(h.korsatkichSana) : "") + "</span>" : "<span>Oldingi ko'rsatkich yo'q</span>") +
              '</span><label style="display:flex;gap:8px;align-items:center;font-size:13px;min-height:40px"><input type="checkbox" name="p' + i + '" checked><span>Plomba butun</span></label></div>').join("")
            : '<div class="keng">' + MKB.boshHolat("info", "Hisoblagich ma'lumoti kiritilmagan", "Kommunal xizmatlar obyekt kartochkasida kiritiladi") + "</div>")
          : '<div class="maydon"><label class="maydon-yorliq" for="ko-km">Kilometraj yoki motosoat</label>' +
              '<div class="kirish"><input id="ko-km" name="km" inputmode="numeric" placeholder="Masalan: 85 600 km"></div>' +
              '<span class="maydon-izoh">' + (inv && inv.motosoatYokiKm ? "<span>Oldingi:</span> <span data-tarjimasiz>" + esc(inv.motosoatYokiKm) + "</span>" : "<span>Oldingi qayd yo'q</span>") + "</span></div>") +
        "</div></section>" +
      '<section class="karta" data-sayohat="surat"><div class="karta-bosh"><span class="ko-qadam" data-tarjimasiz>3</span><h2>Suratlar va joylashuv</h2><span class="soni" id="ko-foto-soni" data-tarjimasiz></span></div>' +
        '<p class="maydon-izoh" id="ko-foto-qoida" style="margin:-6px 0 12px"></p>' +
        '<div id="ko-foto"></div><div class="ko-fotolar" id="ko-fotolar"></div>' +
        '<div class="qator" style="margin:14px -16px -8px"><span class="belgi lavanda">' + ik("manzil") + '</span><span class="matn"><b id="ko-gps-matn">Joylashuv aniqlanmagan</b><span id="ko-gps-izoh">Ko\'rik obyektda o\'tkazilganini tasdiqlaydi</span></span>' +
          '<span class="ong"><button type="button" class="tugma tugma-kichik tugma-oq" id="ko-gps">' + ik("manzil") + "<span>Aniqlash</span></button></span></div></section>" +
      '<section class="karta"><div class="karta-bosh"><span class="ko-qadam" data-tarjimasiz>4</span><h2>Xulosa</h2></div>' +
        '<div class="forma-tor">' +
          '<div class="maydon keng"><span class="maydon-yorliq" id="ko-ball-yorliq">Umumiy holat bahosi <b>*</b></span>' + segment("ball", BAHO.map(([v, m]) => [v, v + " · " + m])) +
            '<span class="maydon-izoh">Nuqsonli yoki avariya holati hodisa sifatida qayd etiladi va xavfsizlik xizmatiga yuboriladi.</span></div>' +
          '<div class="maydon keng" id="ko-kam-joy"><label class="maydon-yorliq" for="ko-kam">Aniqlangan kamchiliklar <b id="ko-kam-belgi" hidden>*</b></label>' +
            '<textarea class="kirish-matn" id="ko-kam" name="kamchiliklar" style="min-height:80px" placeholder="Nima buzilgan, qayerda, qanchalik jiddiy"></textarea></div>' +
          '<div class="maydon keng"><label class="maydon-yorliq" for="ko-xulosa">Xulosa <b>*</b></label>' +
            '<textarea class="kirish-matn" id="ko-xulosa" name="xulosa" required minlength="10" data-xato="Obyektning umumiy holatini yozing" placeholder="Obyektning umumiy holati va tavsiyalar"></textarea></div>' +
          '<div class="maydon"><label class="maydon-yorliq" for="ko-keyingi">Keyingi ko\'rik <b>*</b></label>' +
            '<div class="kirish"><input id="ko-keyingi" name="keyingi" type="date" required min="' + iso(D.kunQosh(b, 1)) + '" value="' + iso(D.kunQosh(b, davr)) + '"></div>' +
            '<span class="maydon-izoh"><span>Davr bo\'yicha:</span> <span data-tarjimasiz>' + davr + "</span> <span>kun</span></span></div>" +
          '<details class="keng ko-qoshimcha"><summary>Qo\'shimcha: ta\'mir xarajati taklifi</summary>' +
            '<div class="maydon" style="margin-top:12px"><label class="maydon-yorliq" for="ko-xar">Ta\'mir xarajati taklifi</label>' +
            '<div class="kirish"><input id="ko-xar" name="xarajat" type="text" data-format="pul" placeholder="0"></div></div></details>' +
        "</div>" +
        '<div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px">' +
          '<a class="tugma tugma-oq" href="korik-rejasi.html">Keyinroq</a>' +
          '<button class="tugma tugma-asosiy" type="submit" id="ko-saqla" data-yozadi data-saqla data-sayohat="yakunlash">' + ik("muhr") + "<span>Dalolatnomani yakunlash</span></button></div>" +
      "</section></form>";
  tarjimaQil(ildiz);

  const forma = document.getElementById("ko-forma");
  const tanlangan = nom => { const r = forma.querySelector('input[name="' + nom + '"]:checked'); return r ? r.value : null; };
  const kamchilikBandlar = () => bandlar.map((t, i) => ({t, i})).filter(x => tanlangan("b" + x.i) === "kamchilik");
  let fotoSoni = 0;
  const kerakSurat = () => {
    const ball = +tanlangan("ball") || 0;
    return Math.max(turMeyori, kamchilikBandlar().length, ball && ball <= 2 ? 1 : 0, turi === "Sotuv oldi" ? 1 : 0);
  };
  function fotoHolat(){
    const kerak = kerakSurat();
    document.getElementById("ko-foto-soni").textContent = kerak ? fotoSoni + " / " + kerak : fotoSoni + " ta";
    const q = document.getElementById("ko-foto-qoida");
    q.innerHTML = kerak
      ? "<span>Kamida</span> <b data-tarjimasiz>" + kerak + "</b> <span>ta surat kerak: har bir kamchilikka bittadan" + (turi === "Sotuv oldi" ? ", sotuv e'loni uchun fotojadval" : "") + ".</span>"
      : "<span>Surat ixtiyoriy. Kamchilik belgilansa, har biriga surat kerak bo'ladi.</span>";
    tarjimaQil(q);
    if (fotoSoni >= kerak) MKB.maydonXato(document.getElementById("ko-foto"), null);
  }
  function kamchilikMajburiy(){
    const kerak = kamchilikBandlar().length > 0 || ((+tanlangan("ball") || 9) <= 2);
    document.getElementById("ko-kam-belgi").hidden = !kerak;
  }
  function hisob(){
    const javob = bandlar.filter((_, i) => tanlangan("b" + i)).length;
    document.getElementById("ko-band-soni").textContent = javob + " / " + bandlar.length;
    fotoHolat(); kamchilikMajburiy();
  }
  forma.addEventListener("change", e => {
    const m = /^b(\d+)$/.exec(e.target.name || "");
    if (m){
      const band = forma.querySelector('[data-band="' + m[1] + '"]');
      band.querySelector(".ko-izoh").hidden = tanlangan("b" + m[1]) !== "kamchilik";
      const s = band.querySelector(".segment"); s.classList.remove("xato"); MKB.maydonXato(s, null);
    }
    if (e.target.name === "ball"){ const s = forma.querySelector('[data-segment="ball"]'); s.classList.remove("xato"); MKB.maydonXato(s, null); }
    if (m || e.target.name === "ball") hisob();
  });

  /* Barchasi joyida: belgilanmagan bandlar "Joyida" bo'ladi; oldingi holatga qaytarish mumkin */
  document.getElementById("ko-hammasi").addEventListener("click", () => {
    const oldin = bandlar.map((_, i) => tanlangan("b" + i));
    const ozgardi = oldin.map((v, i) => v ? null : i).filter(i => i != null);
    if (!ozgardi.length){ MKB.toast("Barcha bandlar allaqachon belgilangan", "info"); return; }
    const qoy = (i, v) => {
      forma.querySelectorAll('input[name="b' + i + '"]').forEach(r => { r.checked = r.value === v; });
      const s = forma.querySelector('[data-band="' + i + '"] .segment'); s.classList.remove("xato"); MKB.maydonXato(s, null);
    };
    ozgardi.forEach(i => qoy(i, "joyida"));
    forma.dispatchEvent(new Event("change", {bubbles: true}));
    hisob();
    MKB.qaytarish(ozgardi.length + " ta band «Joyida» deb belgilandi", {
      bekor: () => { ozgardi.forEach(i => qoy(i, null)); forma.dispatchEvent(new Event("change", {bubbles: true})); hisob(); },
    });
  });

  /* GPS: "Aniqlash" tugmasi yoki birinchi surat muhri joylashuvni to'ldiradi */
  const H = window.MKB_HUJJAT;
  let gps = null, gpsVaqt = 0;
  const reyestrJoy = y.joy && y.joy.lat != null ? y.joy : null;
  function gpsKorsat(){
    const matn = document.getElementById("ko-gps-matn"), iz = document.getElementById("ko-gps-izoh");
    matn.innerHTML = '<span data-tarjimasiz>' + gps.lat + ", " + gps.lng + "</span>";
    iz.innerHTML = (gps.aniqlik != null ? "<span>Aniqlik</span> <span data-tarjimasiz>±" + gps.aniqlik + " m</span>" : "<span>Surat ma'lumotidan</span>") +
      (gps.masofa != null ? " · <span>reyestrdagi nuqtagacha</span> <span data-tarjimasiz>" + H.masofaMatn(gps.masofa) + "</span>" +
        (reyestrJoy.aniq === false ? " <span>(reyestrda hudud markazi)</span>" : "") : "");
    tarjimaQil(matn.parentNode);
  }
  const joyOl = (vaqtKut) => new Promise(hal => {
    if (gps && gps.aniqlik != null && Date.now() - gpsVaqt < 300000) return hal(gps);
    if (!navigator.geolocation) return hal(null);
    navigator.geolocation.getCurrentPosition(p => {
      gps = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), aniqlik: Math.round(p.coords.accuracy)};
      gps.masofa = reyestrJoy ? H.masofa(gps, reyestrJoy) : null;
      gpsVaqt = Date.now();
      gpsKorsat();
      hal(gps);
    }, err => hal({xato: err.code}), {enableHighAccuracy: true, timeout: vaqtKut || 15000, maximumAge: 60000});
  });
  document.getElementById("ko-gps").addEventListener("click", async () => {
    const matn = document.getElementById("ko-gps-matn"), iz = document.getElementById("ko-gps-izoh");
    if (!navigator.geolocation){ matn.textContent = "Qurilma joylashuvni aniqlay olmaydi"; tarjimaQil(matn.parentNode); return; }
    matn.textContent = "Aniqlanmoqda...";
    tarjimaQil(matn.parentNode);
    gpsVaqt = 0;
    const r = await joyOl(15000);
    if (r && r.xato != null || !r){
      matn.textContent = r && r.xato === 1 ? "Joylashuvga ruxsat berilmadi" : "Joylashuvni aniqlab bo'lmadi";
      iz.textContent = "Brauzer sozlamalarida joylashuvga ruxsat bering va qayta urining";
      tarjimaQil(matn.parentNode);
    }
  });

  /* Suratlar: darhol FAYLLAR ga ko'rik yozuvi bilan bog'lanadi (qoralama ularni yo'qotmaydi).
     Har suratga muhr: yuklangan vaqt, suratga olingan vaqt (EXIF) va joy (EXIF GPS yoki telefon joylashuvi), obyektgacha masofa.
     Muhrlar imzolangunga qadar shu qurilmada saqlanadi, imzoda dalolatnomaga yoziladi */
  const muhrKalit = MKBapi.kalit("mkb4-muhr:" + k.id);
  let muhrlar = [];
  try{ muhrlar = JSON.parse(localStorage.getItem(muhrKalit) || "[]") || []; }catch(_){ muhrlar = []; }
  const muhrSaqla = () => { try{ localStorage.setItem(muhrKalit, JSON.stringify(muhrlar)); }catch(_){ } };
  const p2 = n => String(n).padStart(2, "0");
  const hozir = () => { const d = new Date(); return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear() + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
  /* 500 m dan uzoq surat qizil bilan belgilanadi; reyestrda faqat hudud markazi bo'lsa masofa taxminiy */
  const UZOQ_M = 500, taxJoy = !!reyestrJoy && reyestrJoy.aniq === false;
  function muhrMatn(m){
    if (!m) return "";
    const eski = m.suratVaqti && D.kunFarqi(D.sanaOqi(m.suratVaqti.split(" ")[0]), b);
    return '<span data-tarjimasiz>' + esc((m.suratVaqti || m.vaqt).split(" ")[1] || "") + "</span>" +
      (m.masofa != null ? ' · <span' + (taxJoy && m.masofa < 1000 ? "" : " data-tarjimasiz") + ' class="' + (m.masofa > UZOQ_M && !taxJoy ? "ko-uzoq" : "") + '">' + H.masofaMatn(m.masofa, taxJoy) + "</span>" : m.lat != null ? "" : " · <span>joylashuvsiz</span>") +
      (eski > 1 ? '<br><span class="ko-uzoq"><span>Surat</span> <span data-tarjimasiz>' + eski + "</span> <span>kun oldin olingan</span></span>" : "");
  }
  async function muhrla(yozuv, f){
    let ex = null;
    try{ if (/jpe?g/i.test(f.type || "")) ex = H.exifOqi(await f.slice(0, 262144).arrayBuffer()); }catch(_){ ex = null; }
    let joy = ex && ex.lat != null ? {lat: ex.lat, lng: ex.lng, aniqlik: null, manba: "exif"} : null;
    if (!joy){ const r = await joyOl(8000); if (r && r.lat != null) joy = {lat: r.lat, lng: r.lng, aniqlik: r.aniqlik, manba: "qurilma"}; }
    const m = {faylId: yozuv.id, vaqt: hozir(), suratVaqti: ex && ex.vaqt || null, lat: joy ? joy.lat : null, lng: joy ? joy.lng : null,
      aniqlik: joy ? joy.aniqlik : null, manba: joy ? joy.manba : null, masofa: joy && reyestrJoy ? H.masofa(joy, reyestrJoy) : null};
    muhrlar = muhrlar.filter(x => x.faylId !== yozuv.id).concat([m]);
    muhrSaqla();
    if (!gps && joy){ gps = {lat: joy.lat, lng: joy.lng, aniqlik: joy.aniqlik, masofa: m.masofa}; gpsVaqt = joy.manba === "qurilma" ? Date.now() : 0; gpsKorsat(); }
    return m;
  }
  const fotoJoy = document.getElementById("ko-fotolar");
  async function fotoQosh(f){
    const u = f.yol && !/^fayllar\//.test(f.yol) ? f.yol : await MKBapi.fayl.url(f.id);
    const fig = document.createElement("figure");
    fig.dataset.fayl = f.id;
    const img = document.createElement("img");
    img.alt = f.nom || "Ko'rik surati";
    if (u) img.src = u;
    const cap = document.createElement("figcaption");
    cap.innerHTML = muhrMatn(muhrlar.find(x => x.faylId === f.id));
    fig.append(img, cap);
    fotoJoy.appendChild(fig);
    tarjimaQil(cap);
  }
  const mavjudFayllar = (await MKBapi.fayl.royxat({yozuvId: k.id})).filter(f => /^image\//.test(f.tur || ""));
  for (const f of mavjudFayllar){ fotoSoni++; await fotoQosh(f); }
  const fm = MKB.faylMaydon("#ko-foto", {obyektId: y.id, kolleksiya: "KORIKLAR", yozuvId: k.id, accept: "image/*", kop: true,
    sarlavha: "Suratlarni shu yerga tashlang yoki tanlang",
    async yuklandi(yozuv, f){
      fotoSoni++;
      await fotoQosh(yozuv);
      fotoHolat();
      const m = await muhrla(yozuv, f);
      const cap = fotoJoy.querySelector('figure[data-fayl="' + CSS.escape(yozuv.id) + '"] figcaption');
      if (cap){ cap.innerHTML = muhrMatn(m); tarjimaQil(cap); }
    }});
  /* Telefonda: kamerani to'g'ridan-to'g'ri ochadigan tugma (galereya orqali emas) */
  if (fm && window.matchMedia && matchMedia("(pointer: coarse)").matches){
    const kam = document.createElement("label");
    kam.className = "tugma tugma-oq ko-kamera";
    kam.innerHTML = ik("foto") + '<span>Kamera bilan suratga olish</span><input type="file" accept="image/*" capture="environment" multiple hidden>';
    document.getElementById("ko-foto").before(kam);
    kam.querySelector("input").addEventListener("change", e => { const fl = e.target.files; if (fl && fl.length) fm.yukla(Array.from(fl)); e.target.value = ""; });
    tarjimaQil(kam);
  }
  hisob();

  /* Bugungi marshrut: shu inspektorning bugun va kechikkan ko'riklari, eng ko'p kechikkanidan boshlab har safar eng yaqin obyektga */
  if (k.inspektor){
    const ochiq = MKB.doira(D.KORIKLAR || []).filter(x => x.holat !== "otkazildi" && x.inspektor === k.inspektor && D.sanaOqi(x.sana) && D.sanaOqi(x.sana) <= b)
      .sort((p, q) => D.sanaOqi(p.sana) - D.sanaOqi(q.sana));
    if (!ochiq.some(x => x.id === k.id)) ochiq.push(k);
    if (ochiq.length > 1){
      const nuqta = x => { const o = D.topish(x.obyektId) || {}; return Object.assign({korik: x, obyekt: o}, o.joy && o.joy.lat != null ? {lat: o.joy.lat, lng: o.joy.lng, aniq: o.joy.aniq !== false} : {}); };
      const m = H.marshrut(ochiq.map(nuqta), null);
      const i = m.findIndex(x => x.nuqta.korik.id === k.id);
      const jami = m.reduce((s, x) => s + (x.masofa || 0), 0), taxJami = m.some(x => x.taxminiy);
      const keyingi = m[i + 1];
      const joy = document.getElementById("ko-marshrut");
      joy.innerHTML = '<details class="ko-marshrut"><summary>' + ik("xarita") + "<span><span>Bugungi marshrut:</span> <b data-tarjimasiz>" + (i + 1) + " / " + m.length + "</b>" +
          (jami ? ' · <span data-tarjimasiz>' + H.masofaMatn(jami, taxJami && jami >= 1000) + "</span>" : "") +
          (keyingi ? " · <span>keyingisi</span> <span data-tarjimasiz>" + esc(keyingi.nuqta.obyekt.qisqa || keyingi.nuqta.obyekt.nom || keyingi.nuqta.korik.obyektId) + "</span>" : "") + "</span></summary>" +
        "<ol>" + m.map(x => {
          const o = x.nuqta.obyekt, kx = x.nuqta.korik, bu = kx.id === k.id;
          return '<li class="' + (bu ? "joriy" : "") + '">' + (bu ? "<span data-tarjimasiz>" + esc(o.qisqa || o.nom || kx.obyektId) + "</span> <small>(<span>shu ko'rik</span>)</small>"
              : '<a href="korik-otkazish.html?id=' + encodeURIComponent(kx.id) + '" data-tarjimasiz>' + esc(o.qisqa || o.nom || kx.obyektId) + "</a>") +
            (x.masofa != null ? " <small>· <span" + (x.taxminiy && x.masofa < 1000 ? "" : " data-tarjimasiz") + ">" + H.masofaMatn(x.masofa, x.taxminiy) + "</span></small>" : "") +
            '<br><small><span data-tarjimasiz>' + esc(kx.id + " · " + kx.sana) + "</span> · <span>" + esc(o.hudud || "") + "</span></small></li>";
        }).join("") + "</ol>" +
        '<p class="maydon-izoh" style="margin:6px 0 0">' + "Tartib: eng ko'p kechikkan ko'rikdan boshlab, har safar eng yaqin obyekt. Masofa to'g'ri chiziq bo'yicha." + "</p></details>";
      tarjimaQil(joy);
    }
  }

  /* Qoralama: shu qurilmada avtomatik saqlanadi, aloqa uzilsa ham yo'qolmaydi */
  const qoriq = MKB.formaQoriqla(forma, {nom: "Ko'rik dalolatnomasi", qoralama: "korik:" + k.id, holatJoy: "#ko-qoralama-joy",
    tiklandi(){
      bandlar.forEach((_, i) => { forma.querySelector('[data-band="' + i + '"] .ko-izoh').hidden = tanlangan("b" + i) !== "kamchilik"; });
      hisob();
    }});

  forma.addEventListener("submit", async e => {
    e.preventDefault();
    /* 1. Bandlar va baho */
    const segXato = [];
    bandlar.forEach((_, i) => {
      if (!tanlangan("b" + i)){ const s = forma.querySelector('[data-band="' + i + '"] .segment'); s.classList.add("xato"); MKB.maydonXato(s, "Natijani belgilang"); segXato.push(s); }
    });
    const ball = +tanlangan("ball") || 0;
    if (!ball){ const s = forma.querySelector('[data-segment="ball"]'); s.classList.add("xato"); MKB.maydonXato(s, "Umumiy holat bahosini tanlang"); segXato.push(s); }
    if (segXato.length){
      MKB.formaXato(forma, segXato.length + " ta joyda natija belgilanmagan: " + (ball ? "nazorat bandlari" : "nazorat bandlari yoki umumiy baho"));
      segXato[0].scrollIntoView({block: "center"});
      const r0 = segXato[0].querySelector("input"); if (r0) r0.focus({preventScroll: true});
      return;
    }
    /* 2. Suratlar */
    const kerak = kerakSurat();
    if (fotoSoni < kerak){
      const fj = document.getElementById("ko-foto");
      MKB.maydonXato(fj, "Yana " + (kerak - fotoSoni) + " ta surat qo'shing");
      MKB.formaXato(forma, "Suratlar yetarli emas: kamida " + kerak + " ta kerak, biriktirilgan " + fotoSoni + " ta");
      fj.scrollIntoView({block: "center"});
      return;
    }
    /* 3. Maydonlar */
    const xarKirish = document.getElementById("ko-xar");
    if (xarKirish.value.trim()) xarKirish.closest("details").open = true;
    const kams = kamchilikBandlar();
    const r = MKB.formaTekshir(forma, {
      kamchiliklar: v => (kams.length || ball <= 2) && String(v || "").length < 5 ? "Kamchilikni yozing: bandlarda yoki bahoda kamchilik belgilangan" : true,
      keyingi: v => { const s = D.sanaOqi(v); return s && s > b ? true : "Keyingi ko'rik sanasi bugundan keyin bo'lishi kerak"; },
    });
    if (!r) return;
    const q = r.qiymatlar;
    const keyingi = D.sanaOqi(q.keyingi);
    const xarajat = Number.isFinite(q.xarajat) ? q.xarajat : null;

    const bugunS = D.sanaYoz(b);
    const chekList = bandlar.map((t, i) => {
      const x = {band: t, natija: tanlangan("b" + i)};
      if (x.natija === "kamchilik" && q["bi" + i]) x.izoh = q["bi" + i];
      return x;
    });
    const yangiKommunal = (y.kommunal || []).map(h => Object.assign({}, h));
    hisoblagichlar.forEach((h, i) => {
      const v = q["h" + i];
      const bor = Number.isFinite(v);
      chekList.push({band: XIZMAT[h.xizmat] + " hisoblagichi" + (h.hisoblagich ? " " + h.hisoblagich : ""), tur: "hisoblagich", xizmat: h.xizmat,
        natija: bor ? "qayd etildi" : "kiritilmadi", korsatkich: bor ? v : null, avvalgi: h.korsatkich != null ? h.korsatkich : null, plomba: !!q["p" + i]});
      if (bor){
        const j = yangiKommunal.find(x => x.xizmat === h.xizmat);
        if (j){ j.korsatkich = v; j.korsatkichSana = bugunS; }
      }
    });
    if (!D.binolimi(y) && q.km) chekList.push({band: "Kilometraj yoki motosoat", tur: "hisoblagich", natija: "qayd etildi", qiymat: q.km});
    /* Ko'rik vaqti, joylashuv va surat muhrlari bitta "gps" bandida: boshqa sahifalar uni bitta qator deb ko'rsatadi */
    const qolganFayllar = new Set([...fotoJoy.querySelectorAll("figure[data-fayl]")].map(f => f.dataset.fayl));
    const suratMuhr = muhrlar.filter(m => qolganFayllar.has(m.faylId));
    if (gps || suratMuhr.length) chekList.push(Object.assign({band: "Joylashuv", tur: "gps", natija: gps ? "qayd etildi" : "kiritilmadi", vaqt: hozir(), suratlar: suratMuhr},
      gps ? {lat: gps.lat, lng: gps.lng, aniqlik: gps.aniqlik, masofa: gps.masofa != null ? gps.masofa : null} : {}));
    const hisobSoni = hisoblagichlar.filter((_, i) => Number.isFinite(q["h" + i])).length;

    /* 4. Imzolashdan oldin xulosa */
    let hodisa = null;
    const natija = await MKB.tasdiqla({
      sarlavha: "Dalolatnomani imzolash",
      matn: "Ko'rik dalolatnomasi yakunlanadi. Imzolangandan keyin natijalar o'zgartirilmaydi.",
      tafsilot: [
        ["Obyekt", {matn: (y.qisqa || y.nom) + " · " + y.id, tarjimasiz: true}],
        ["Umumiy baho", ball + " / 5"],
        ["Holat", {matn: BAHO_NOM[ball]}],
        ["Kamchilikli bandlar", kams.length + " / " + bandlar.length],
        ["Suratlar", fotoSoni ? String(fotoSoni) : {matn: "Biriktirilmagan"}],
        ["Keyingi ko'rik", {matn: D.sanaYoz(keyingi), tarjimasiz: true}],
      ].concat(q.kamchiliklar ? [["Aniqlangan kamchiliklar", {matn: q.kamchiliklar, tarjimasiz: true}]] : [])
       .concat(xarajat != null ? [["Ta'mir xarajati taklifi", MKB.pul(xarajat)]] : []),
      oqibat: [].concat(
        ball <= 2 ? ["Hodisa qayd etiladi va xavfsizlik xizmatiga yuboriladi"] : [],
        ["Keyingi rejali ko'rik rejaga qo'shiladi"],
        hisobSoni && MKB.huquq("aktivlar", "yoz") ? ["Hisoblagich ko'rsatkichlari obyekt kartochkasiga yoziladi"] : [],
        fotoSoni ? [] : ["Aktda fotojadval bo'lmaydi"]),
      okMatn: "Imzolash",
      async bajar(){
        const s = MKBapi.sessiya() || {};
        await MKBapi.yangilash("KORIKLAR", k.id, {holat: "otkazildi", sana: bugunS, holatBall: ball, chekList,
          kamchiliklar: q.kamchiliklar, xarajatTaklifi: xarajat, keyingiKorikSana: D.sanaYoz(keyingi), xulosa: q.xulosa,
          inspektor: s.rol === "Ko'rik va xavfsizlik inspektori" ? s.ism : (k.inspektor || s.ism || null),
          izoh: "Reja sanasi " + k.sana + (kechikish > 0 ? ", " + kechikish + " kun kechikib o'tkazildi" : "") + ". " + (fotoSoni ? fotoSoni + " ta surat." : "Surat biriktirilmagan.")});
        /* Keyingi rejali ko'rik (obyektda boshqa ochiq ko'rik bo'lmasa) */
        const ochiq = (D.KORIKLAR || []).some(x => x.obyektId === y.id && x.id !== k.id && x.holat !== "otkazildi");
        if (!ochiq){
          const nid = await MKB.keyingiId("KORIKLAR", "KO-" + b.getFullYear() + "/", 4);
          await MKBapi.yangi("KORIKLAR", {id: nid, obyektId: y.id, korikTuri: "Rejali", tur: "Rejali", sana: D.sanaYoz(keyingi), holat: "rejada",
            inspektor: k.inspektor || null, holatBall: null, chekList: [], kamchiliklar: "", xarajatTaklifi: null, keyingiKorikSana: null, xulosa: "",
            izoh: k.id + " ko'rigidan keyin rejalashtirildi"});
        }
        /* Nuqsonli yoki avariya holati: hodisa */
        if (ball <= 2){
          try{
            hodisa = await MKB.hodisa.yarat({obyektId: y.id, hodisa: ball === 1 ? "Ko'rikda avariya holati aniqlandi" : "Ko'rikda nuqson aniqlandi",
              jiddiylik: ball === 1 ? "yuqori" : "o'rta", tavsif: k.id + ": " + q.kamchiliklar, manba: "korik"});
          }catch(err){ MKB.toast("Hodisa yaratilmadi: " + err.message, "xavf"); }
        }
        /* Hisoblagich ko'rsatkichlari va obyekt tarixi (aktivlarga yozish huquqi bo'lsa) */
        if (MKB.huquq("aktivlar", "yoz")){
          try{
            const patch = {tarix: (y.tarix || []).concat([{sana: bugunS, voqea: turi + " ko'rik o'tkazildi", izoh: "Baho " + ball + ". " + q.xulosa.slice(0, 120)}])};
            if (hisobSoni) patch.kommunal = yangiKommunal;
            await MKBapi.yangilash("YOZUVLAR", y.id, patch);
          }catch(_){ }
        }
      },
    });
    if (!natija) return;
    qoriq.toza();
    try{ localStorage.removeItem(muhrKalit); }catch(_){ }
    location.href = "korik-akti.html?id=" + encodeURIComponent(k.id) + "&yakunlandi=1" + (hodisa ? "&hodisa=" + encodeURIComponent(hodisa.id) : "");
  });
  }
})();
</script>
</body>
</html>
