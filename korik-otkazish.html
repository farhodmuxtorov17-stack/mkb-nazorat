<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko'rik o'tkazish</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="korik-rejasi.html">Ko'rik nazorati</a><span class="ajratgich">/</span><span>O'tkazish</span></div>
    <div class="hs-qator"><h1>Ko'rik o'tkazish</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:760px"><div class="karta-bosh"><h2>Ko'rik o'tkazish</h2><span class="soni kod-mono" id="ko-id"></span></div>
  <div id="ko-obyekt" style="margin-bottom:16px"></div>
  <form id="ko-forma">
    <div id="ko-savollar" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px"></div>
    <div class="forma-tor">
      <div class="maydon"><label class="maydon-yorliq">Umumiy holat bahosi <b>*</b></label>
        <div class="kirish"><select name="baho"><option value="">Tanlang</option><option>A'lo</option><option>Qoniqarli</option><option>Nuqsonli</option><option>Avariya holati</option></select></div></div>
      <div class="maydon"><label class="maydon-yorliq">Foto biriktirish</label>
        <div class="kirish"><input type="file" name="foto" multiple></div></div>
      <div class="maydon keng"><label class="maydon-yorliq">Xulosa <b>*</b></label>
        <textarea class="kirish-matn" name="xulosa" placeholder="Aniqlangan holatlar va tavsiyalar"></textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
      <a class="tugma tugma-oq" href="korik-rejasi.html">Keyinroq</a>
      <button class="tugma tugma-asosiy" type="submit"><svg class="ic"><use href="#i-muhr"/></svg>Aktni yakunlash</button></div>
  </form></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const k = id ? await MKBapi.bitta("KORIKLAR", id) : null;
  if (!k){ location.replace("korik-rejasi.html"); return; }
  const y = MKB_DATA.OBYEKT_INDEKS[k.obyektId];
  document.getElementById("hs-meta").textContent = k.id;
  document.getElementById("ko-id").textContent = k.id;
  document.getElementById("ko-obyekt").innerHTML =
    '<div style="display:flex;gap:12px;align-items:center">' +
    '<img class="foto" src="' + (y.rasmKichik || y.rasm) + '" style="width:74px;height:52px;border-radius:14px;object-fit:cover" alt="">' +
    '<span><b style="display:block;font-size:13.5px">' + (y.qisqa || y.nom) + '</b>' +
    '<span style="font-size:12.5px;color:var(--matn-3)">' + k.obyektId + ' · ' + k.tur + ' · ' + k.sana + '</span></span></div>';
  const SAVOLLAR = ["Tashqi konstruksiya butunligi", "Muhrlar va qulflar joyida",
    "Kommunikatsiyalar holati", "Yong'in xavfsizligi talablari", "Ruxsatsiz foydalanish belgilari yo'q"];
  document.getElementById("ko-savollar").innerHTML = SAVOLLAR.map(s =>
    '<label style="display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--chiziq-2);border-radius:10px;font-size:13px;cursor:pointer">' +
    '<input type="checkbox" data-savol style="width:16px;height:16px;accent-color:var(--siyoh)"><span style="flex:1">' + s + '</span>' +
    '<span class="chip">majburiy</span></label>').join("");
  document.getElementById("ko-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["baho", "xulosa"]);
    if (!q) return;
    const hammasi = [...document.querySelectorAll("[data-savol]")].every(c => c.checked);
    if (!hammasi){ MKB.toast("Barcha nazorat bandlari tekshirilishi shart", "xavf"); return; }
    await MKBapi.yangilash("KORIKLAR", k.id, {holat: "otkazildi", baho: q.baho,
      izoh: q.xulosa, otkazilganSana: new Date().toLocaleDateString("uz")});
    MKB.toast("Akt yakunlandi — " + k.id);
    setTimeout(() => location.href = "korik-akti.html?id=" + encodeURIComponent(k.id), 700);
  });
});
</script>
</body>
</html>
