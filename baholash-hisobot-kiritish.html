<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Hisobot kiritish</title>
<link rel="stylesheet" href="yadro/app.css?v=26082745">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="baholash">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Baholash</span></div>
    <div class="hs-qator"><h1>Hisobot kiritish</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="baholash.html">Reyestr</a><a href="baholash-buyurtma.html">Buyurtma</a><a href="baholash-hisobot-kiritish.html" class="faol">Hisobot kiritish</a><a href="baholovchilar.html">Baholovchilar</a><a href="baholash-dinamika.html">Dinamika</a></nav>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Hisobot natijasini kiritish</h2></div>
  <form id="bk-forma" class="forma-tor">
    <div class="maydon keng"><label class="maydon-yorliq">Buyurtma / hisobot <b>*</b></label>
      <div class="kirish"><select name="id" id="bk-buyurtma"></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Yangi qiymat, mln so'm <b>*</b></label>
      <div class="kirish"><input name="qiymat" type="number" step="1" placeholder="0"></div></div>
    <div class="maydon"><label class="maydon-yorliq">Hisobot sanasi <b>*</b></label>
      <div class="kirish"><input name="sana" placeholder="kk.oo.yyyy"></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">Usul</label>
      <div class="kirish"><select name="usul"><option>Qiyosiy yondashuv</option><option>Daromad yondashuvi</option><option>Xarajat yondashuvi</option></select></div></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" href="baholash.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit">Hisobotni saqlash</button></div>
  </form></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082745"></script>
<script src="malumot.js?v=26082745"></script>
<script src="malumot-qoshimcha.js?v=26082745"></script>
<script src="malumot-kengaytma.js?v=26082745"></script>
<script src="malumot-kirish.js?v=26082745"></script>
<script src="malumot-indeks.js?v=26082745"></script>
<script src="tarjima.js?v=26082745"></script>
<script src="yadro/ikonlar.js?v=26082745"></script>
<script src="yadro/daraxt.js?v=26082745"></script>
<script src="yadro/chizma.js?v=26082745"></script>
<script src="yadro/qollanma.js?v=26082745"></script>
<script src="yadro/api.js?v=26082745"></script>
<script src="yadro/app.js?v=26082745"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("BAHOLASHLAR");
  document.getElementById("bk-buyurtma").innerHTML = r.map(b => {
    const y = MKB_DATA.OBYEKT_INDEKS[b.obyektId] || {};
    return '<option value="' + b.id + '">' + b.id + " — " + (y.qisqa || b.obyektId) + '</option>';
  }).join("");
  document.getElementById("bk-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["id", "qiymat", "sana"]);
    if (!q) return;
    const eski = r.find(b => b.id === q.id);
    await MKBapi.yangilash("BAHOLASHLAR", q.id, {
      avvalgi: eski.qiymat || eski.avvalgi, qiymat: +q.qiymat,
      sana: q.sana, usul: q.usul, holat: "yakunlangan"});
    MKB.toast("Hisobot saqlandi");
    setTimeout(() => location.href = "baholash-hisobot.html?id=" + encodeURIComponent(q.id), 700);
  });
});
</script>
</body>
</html>
