<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const NOMLAR = ["Toshkent shahar filiali", "Yunusobod filiali", "Chilonzor filiali",
    "Samarqand filiali", "Namangan filiali", "Buxoro filiali"];
  const qatorlar = NOMLAR.map((nom, i) => {
    const r = yoz.filter(y => y.filial === nom);
    return {id: i, nom, obyektlar: r.length,
      qarz: Math.round(r.reduce((a, y) => a + MKB.sonQiymat(y.qarzSon), 0)),
      qoplash: r.length ? MKB_DATA.nazoratJamlama(r).ortacha : 0,
      hodim: 4 + (i * 3) % 9};
  });
  document.getElementById("hs-meta").textContent = qatorlar.length + " ta filial tarmoqda";
  MKB.jadval("jadval-joy", {
    qatorlar,
    ustunlar: [
      {kalit: "nom", nom: "Filial", chiz: q => '<b>' + q.nom + '</b>'},
      {kalit: "hodim", nom: "Mas'ul xodimlar", son: true},
      {kalit: "obyektlar", nom: "Muammoli obyektlar", son: true},
      {kalit: "qarz", nom: "Qoldiq qarz", son: true, chiz: q =>
        q.qarz ? '<span class="pul">' + MKB.fmt(q.qarz) + ' mln</span>' : "—"},
      {kalit: "qoplash", nom: "O'rtacha nazorat indeksi", son: true, chiz: q =>
        q.qoplash ? MKB.shtrix(q.qoplash) : "—"},
    ],
  });
});
</script>
</body>
