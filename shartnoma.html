<style>
.rz-iz{height:8px;border-radius:var(--r-pilyula);background:var(--band);overflow:hidden;margin-top:8px}
.rz-iz > span{display:block;height:100%;background:var(--mint-matn);border-radius:var(--r-pilyula)}
.rz-sub{font-size:12.5px;color:var(--matn-3)}
.rz-sub.xavf{color:var(--xavf-matn)}
.rz-izoh{font-size:13px;color:var(--matn-2);padding:14px 16px;border-radius:var(--r-kichik);background:var(--plitka);display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.rz-izoh .ic{width:17px;height:17px;flex:none;margin-top:1px;color:var(--matn-3)}
.rz-jadval{width:100%;border-collapse:collapse;font-size:14px}
.rz-jadval th{text-align:left;font-weight:400;font-size:12.5px;color:var(--matn-3);padding:0 10px 10px;border-bottom:1px solid var(--chiziq-2)}
.rz-jadval td{padding:10px;border-bottom:1px solid var(--chiziq-2);vertical-align:middle}
.rz-jadval tr:last-child td{border-bottom:none}
.rz-jadval .son{text-align:right;white-space:nowrap}
.rz-jadval tr.otgan td{background:var(--xavf-fon)}
.rz-jadval tr.tolangan td{color:var(--matn-3)}
.rz-jadval-orash{overflow-x:auto;margin:0 -6px}
.rz-jadval .tugma-kichik{height:34px;padding:0 12px}
.rz-jadval tr.yashirin{display:none}
.rz-jadval.toliq tr.yashirin{display:table-row}
.rz-yigish{margin-top:12px}
.rz-mobil-amal{display:none}
@media (max-width:720px){
  .rz-jadval th:nth-child(1),.rz-jadval td:nth-child(1){display:none}
  .rz-jadval .tugma-kichik{height:40px}
  .rz-jadval.tahrir th:last-child,.rz-jadval.tahrir td:last-child{display:none}
  .rz-mobil-amal{display:block;margin-top:6px}
  .rz-mobil-amal:empty{display:none}
}
</style>
</head>

  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="realizatsiya.html">Sotuv va undiruv</a><span class="ajratgich">/</span><a href="shartnomalar.html">Shartnomalar va to'lovlar</a><span class="ajratgich">/</span><span id="yorliq-id" data-tarjimasiz>—</span></div>
    <div class="hs-qator"><h1 id="sarlavha" data-tarjimasiz>Shartnoma</h1><span id="holat-chip"></span><span class="hs-meta" id="hs-meta" data-tarjimasiz></span>
      <div class="hs-amallar" id="amallar" data-sayohat="amallar"></div></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="realizatsiya.html">Sotuv rejasi</a><a href="lotlar.html">E-auksion lotlari</a><a href="takliflar.html">Takliflar</a><a href="shartnomalar.html" class="faol">Shartnomalar va to'lovlar</a><a href="ijara.html">Ijara</a></nav>

  <section class="metrika-qator tort" id="kpi" aria-label="To'lov ko'rsatkichlari" data-sayohat="kpi"></section>

      </section>
      <section class="karta" aria-labelledby="qqs-sarlavha" data-sayohat="soliq">
        <div class="karta-bosh"><h2 id="qqs-sarlavha" data-ikonka="soliq">Soliq va balans</h2></div>
        <dl class="malumot-royxat" id="qqs"></dl>
        <p class="rz-izoh"><svg class="ic"><use href="#ik-info"/></svg><span>QQS bazasi taxminiy: sotish narxi va balans qiymati farqi. Yakuniy hisob buxgalteriya tasdig'ida.</span></p>

<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, pul = v => MKB.pul(v);
  const tp = v => ({matn: MKB.pul(v)});
  const tz = v => ({matn: String(v == null || v === "" ? "—" : v), tarjimasiz: true});
  /* Obyekt havolasi: balansdagi aktiv obyekt kartasiga, balansdan chiqarilgani arxiv yozuviga olib boradi; ikkalasida ham yo'q bo'lsa havola berilmaydi */
  const obyektHref = id => {
    if (!id) return null;
    if (D.topish(id)) return "obyekt.html?id=" + encodeURIComponent(id);
    const a = (D.ARXIV || []).find(x => x.id === id || x.obyektId === id);
    return a ? "arxiv-obyekt.html?id=" + encodeURIComponent(a.id) : null;
  };
  const id = new URLSearchParams(location.search).get("id");
  const top = () => (D.SHARTNOMALAR || []).find(s => s.id === id) || null;
  const oqi = x => D.sanaOqi(x);
  const bugun = () => { const b = D.bugun(); return new Date(b.getFullYear(), b.getMonth(), b.getDate()); };
  const yaxlit = n => Math.round(n * 10) / 10;
  /* KPI uchun: raqam katta, birlik kichik ("27,53" + "mlrd so'm") */
  const pulK = v => { const t = MKB.pul(v), i = t.indexOf(" "); return i < 0 ? "<span>" + t + "</span>" : '<span data-tarjimasiz>' + t.slice(0, i) + "</span> <small>" + t.slice(i + 1) + "</small>"; };
  const usulNomi = k => ((D.SOTISH_USULLARI || []).find(u => u.kalit === k) || {}).nom || "—";
  /* Sotish usuli (qanday sotildi) va to'lov sharti (qanday to'lanadi) alohida o'lchov.
     Lot orqali sotilgan bo'lsa usul lotdan olinadi, lotsiz bo'lib to'lash to'g'ridan-to'g'ri sotuv hisoblanadi. */
  const sotuvUsuli = sh => {
    if (MKB.sotuvUsuli) return MKB.sotuvUsuli(sh);
    const l = sh.lotId ? (D.LOTLAR || []).find(x => x.id === sh.lotId) : null;
    const u = l && l.sotishUsuli !== "bolib" ? l.sotishUsuli : sh.sotishUsuli;
    return !u || u === "bolib" ? "togridan" : u;
  };
  const bolibmi = sh => MKB.bolibTolovmi ? MKB.bolibTolovmi(sh) : sh.sotishUsuli === "bolib" || (Array.isArray(sh.jadval) && sh.jadval.length > 0);
  const yoza = () => MKB.huquq("realizatsiya", "yoz");
  const CHIP = {"faol": "chip-info", "kechikkan": "chip-xavf", "toliq tolangan": "chip-yashil", "yakunlangan": "chip-kul", "bekor": "chip-kul",
    "taqiq qo'yilgan": "chip-sariq", "o'rnatilgan": "chip-sariq", "yechilgan": "chip-kul"};
  const NOM = {"toliq tolangan": "To'liq to'langan", "taqiq qo'yilgan": "Taqiq qo'yilgan", "o'rnatilgan": "Taqiq qo'yilgan", "yechilgan": "Taqiq yechilgan"};
  const nomi = k => NOM[k] || MKB.holatNomi(k);
  const chip = (k, kichik) => '<span class="chip ' + (CHIP[k] || "") + (kichik ? " chip-kichik" : "") + '">' + esc(nomi(k)) + "</span>";
  const obNomi = s => { const o = D.obyekt(s.obyektId) || {}; return o.qisqa || o.nom || s.obyektId; };

  function tolov(s){
    const b = bugun(), j = Array.isArray(s.jadval) ? s.jadval : [];
    if (s.holat === "yakunlangan") return {tolangan: +s.narx || 0, qoldiq: 0, otgan: [], otganSumma: 0, kechikish: 0, keyingi: null};
    const tolangan = yaxlit((+s.avans || 0) + j.filter(x => x.tolandi).reduce((a, x) => a + (+x.summa || 0), 0));
    const otgan = j.filter(x => !x.tolandi && oqi(x.sana) && oqi(x.sana) < b);
    return {tolangan, qoldiq: Math.max(0, yaxlit((+s.narx || 0) - tolangan)), otgan, otganSumma: yaxlit(otgan.reduce((a, x) => a + (+x.summa || 0), 0)),
      kechikish: otgan.length ? D.kunFarqi(oqi(otgan[0].sana), b) : 0, keyingi: j.find(x => !x.tolandi) || null};
  }
  const holatHisobla = (s, t) => ["yakunlangan", "bekor"].indexOf(s.holat) >= 0 ? s.holat : t.otgan.length ? "kechikkan" : t.qoldiq <= 0 ? "toliq tolangan" : "faol";
  const tarixQosh = (y, voqea, izoh) => (Array.isArray(y.tarix) ? y.tarix : []).concat([{sana: D.sanaYoz(bugun()), voqea, izoh: izoh || ""}]);

  function chiz(){
    const s = top(), t = tolov(s), k = holatHisobla(s, t);
    const y = D.topish(s.obyektId), o = D.obyekt(s.obyektId) || {};
    const chiqarilgan = y ? y.holat === "Chiqarildi" : (D.ARXIV || []).some(a => a.obyektId === s.obyektId);
    document.title = "MKB — " + s.id;
    document.getElementById("sarlavha").textContent = s.id;
    document.getElementById("yorliq-id").textContent = s.id;
    document.getElementById("holat-chip").innerHTML = chip(k) + (s.taqiqHolati && k !== "yakunlangan" ? " " + chip(s.taqiqHolati) : "");
    document.getElementById("hs-meta").textContent = s.xaridor || "";

    /* Amallar: holatga qarab bitta asosiy amal */
    let a = "";
    if (yoza() && k !== "yakunlangan" && k !== "bekor"){
      if (t.keyingi) a += '<button type="button" class="tugma tugma-asosiy" data-amal="keyingi" data-yozadi data-sayohat="keyingi-tolov"><svg class="ic"><use href="#ik-tasdiq"/></svg><span>Keyingi to\'lovni qabul qilish</span></button>';
      if (t.qoldiq <= 0 && s.taqiqHolati && s.taqiqHolati !== "yechilgan") a += '<button type="button" class="tugma tugma-oq" data-amal="taqiq" data-yozadi data-sayohat="taqiq"><svg class="ic"><use href="#ik-ochiq-qulf"/></svg><span>Taqiqni yechish</span></button>';
      if (t.qoldiq <= 0 && !chiqarilgan) a += '<a class="tugma tugma-asosiy" href="chiqim-tasdiqlash.html?shartnoma=' + encodeURIComponent(s.id) + '" data-sayohat="chiqim"><svg class="ic"><use href="#ik-arxiv"/></svg><span>Balansdan chiqarish</span></a>';
      if (chiqarilgan) a += '<button type="button" class="tugma tugma-asosiy" data-amal="yakun" data-yozadi data-sayohat="yakunlash"><svg class="ic"><use href="#ik-tasdiq"/></svg><span>Shartnomani yakunlash</span></button>';
    }
    const am = document.getElementById("amallar");
    am.innerHTML = a;
    am.querySelectorAll("[data-amal]").forEach(b => b.addEventListener("click", () => AMAL[b.dataset.amal](b)));

    /* Ko'rsatkichlar */
    const foiz = s.narx > 0 ? Math.round(t.tolangan / s.narx * 100) : 0;
    const m = (yorliq, qiymat, izoh) => '<div class="metrika"><span class="m-yorliq">' + yorliq + '</span><span class="m-qiymat">' + qiymat + '</span><span class="m-izoh">' + izoh + "</span></div>";
    document.getElementById("kpi").innerHTML =
      m("Shartnoma narxi", pulK(s.narx), "<span>Avans</span> <span>" + pul(s.avans || 0) + "</span>") +
      m("To'langan", pulK(t.tolangan), '<span class="rz-iz" style="display:block"><span style="width:' + Math.min(100, foiz) + '%"></span></span><span data-tarjimasiz>' + foiz + "%</span>") +
      m("Qoldiq", pulK(t.qoldiq), t.keyingi ? "<span>Keyingi to'lov</span> <span data-tarjimasiz>" + esc(t.keyingi.sana) + "</span>" : "<span>Jadval yakunlangan</span>") +
      m("Kechikish", t.kechikish ? '<span data-tarjimasiz>' + t.kechikish + "</span> <small>kun</small>" : '<span data-tarjimasiz>0</span>',
        t.otganSumma ? "<span>Muddati o'tgan</span> <span>" + pul(t.otganSumma) + "</span>" : "<span>Muddati o'tgan to'lov yo'q</span>");

    /* To'lov jadvali */
    const j = Array.isArray(s.jadval) ? s.jadval : [];
    const b = bugun();
    document.getElementById("jadval-soni").textContent = j.length ? j.filter(x => x.tolandi).length + " / " + j.length : "";
    const tahrir = yoza() && k !== "yakunlangan" && k !== "bekor";
    const birinchiOchiq = j.findIndex(x => !x.tolandi);
    let oxirgiTolangan = -1;
    j.forEach((x, i) => { if (x.tolandi) oxirgiTolangan = i; });
    /* Qisqa ko'rinish: oxirgi to'langan, muddati o'tganlar va keyingi uchta to'lov */
    const korinadi = i => { const x = j[i], d = oqi(x.sana);
      return i === oxirgiTolangan || (!x.tolandi && d && d < b) || (birinchiOchiq >= 0 && i >= birinchiOchiq && i < birinchiOchiq + 3); };
    const yashirinSoni = j.filter((x, i) => !korinadi(i)).length;
    const toliqEdi = !!document.querySelector("#jadval .rz-jadval.toliq");
    document.getElementById("jadval").innerHTML =
      '<div class="rz-jadval-orash"><table class="rz-jadval' + (toliqEdi ? " toliq" : "") + (tahrir ? " tahrir" : "") + '"><thead><tr><th>№</th><th>Sana</th><th class="son">Summa</th><th>Holat</th>' + (tahrir ? "<th></th>" : "") + "</tr></thead><tbody>" +
      '<tr class="tolangan"><td>—</td><td data-tarjimasiz>' + esc(s.sana || "—") + '</td><td class="son pul">' + pul(s.avans || 0) + "</td><td>" +
        '<span class="chip chip-kichik chip-yashil">Avans</span></td>' + (tahrir ? "<td></td>" : "") + "</tr>" +
      j.map((x, i) => {
        const d = oqi(x.sana), otgan = !x.tolandi && d && d < b;
        const holat = x.tolandi ? '<span class="chip chip-kichik chip-yashil">To\'langan</span>'
          : otgan ? '<span class="chip chip-kichik chip-xavf"><span><b data-tarjimasiz style="font-weight:500">' + D.kunFarqi(d, b) + "</b> <span>kun kechikdi</span></span></span>"
          : '<span class="chip chip-kichik chip-kul">Kutilmoqda</span>';
        const tugma = !tahrir ? "" : x.tolandi
          ? (i === oxirgiTolangan ? '<button type="button" class="tugma tugma-kichik tugma-oq" data-i="' + i + '" data-yozadi>Belgini olib tashlash</button>' : "")
          /* Keyingi to'lov sarlavhadagi «Keyingi to'lovni qabul qilish» tugmasida; qatorda faqat undan keyingi muddati o'tganlari */
          : (otgan && i !== birinchiOchiq ? '<button type="button" class="tugma tugma-kichik tugma-brend" data-i="' + i + '" data-yozadi>Qabul qilish</button>' : "");
        return '<tr class="' + [x.tolandi ? "tolangan" : otgan ? "otgan" : "", korinadi(i) ? "" : "yashirin"].join(" ").trim() + '"><td data-tarjimasiz>' + (i + 1) + "</td><td data-tarjimasiz>" + esc(x.sana) + '</td><td class="son pul">' + pul(x.summa) + "</td><td>" + holat + (tugma ? '<span class="rz-mobil-amal">' + tugma + "</span>" : "") + "</td>" +
          (tahrir ? '<td class="son">' + tugma + "</td>" : "") + "</tr>";
      }).join("") +
      "</tbody></table></div>" +
      (yashirinSoni ? '<button type="button" class="tugma tugma-oq tugma-kichik rz-yigish" id="jadval-ochish" aria-expanded="' + toliqEdi + '"><span>' + (toliqEdi ? "Qisqa ko'rinish" : "Butun jadval") + '</span> <span data-tarjimasiz>' + (toliqEdi ? "" : "(" + j.length + ")") + "</span></button>" : "") +
      (j.length ? "" : '<p class="rz-izoh"><svg class="ic"><use href="#ik-info"/></svg><span>Narx bir martada to\'langan. Bo\'lib to\'lash jadvali yo\'q.</span></p>');
    const ochTugma = document.getElementById("jadval-ochish");
    if (ochTugma) ochTugma.addEventListener("click", () => {
      const tb = document.querySelector("#jadval .rz-jadval"), t2 = tb.classList.toggle("toliq");
      ochTugma.setAttribute("aria-expanded", t2);
      ochTugma.innerHTML = "<span>" + (t2 ? "Qisqa ko'rinish" : "Butun jadval") + '</span> <span data-tarjimasiz>' + (t2 ? "" : "(" + j.length + ")") + "</span>";
      tarjimaQil(ochTugma);
    });
    document.getElementById("jadval").querySelectorAll("[data-i]").forEach(btn => btn.addEventListener("click", () => belgila(+btn.dataset.i)));

    /* Ma'lumotlar */
    const dd = (n, v, ts) => "<dt>" + n + "</dt><dd" + (ts ? " data-tarjimasiz" : "") + ">" + v + "</dd>";
    document.getElementById("malumot").innerHTML =
      dd("Obyekt", (h => h ? '<a href="' + h + '">' + esc(o.qisqa || s.obyektId) + "</a>" : esc(o.qisqa || s.obyektId || "—"))(obyektHref(s.obyektId)), true) +
      dd("Xaridor", esc(s.xaridor || "—"), true) +
      dd("Sotish usuli", esc(usulNomi(sotuvUsuli(s)))) +
      dd("To'lov sharti", bolibmi(s) ? "<span>Bo'lib to'lash</span>" : "<span>To'liq to'lov</span>") +
      dd("Imzolangan", esc(s.sana || "—"), true) +
      dd("Lot", s.lotId ? '<a href="lot.html?id=' + encodeURIComponent(s.lotId) + '">' + esc(s.lotId) + "</a>" : "—", true) +
      dd("Taklif", s.taklifId ? '<a href="takliflar.html?id=' + encodeURIComponent(s.taklifId) + '">' + esc(s.taklifId) + "</a>" : "—", true) +
      dd("Muddat", j.length ? '<span data-tarjimasiz>' + j.length + "</span> <span>oy</span>" : "<span>Bir martalik to'lov</span>") +
      dd("Taqiq", chip(s.taqiqHolati || "yechilgan", true));
    /* Sotish narxi yuqoridagi «Shartnoma narxi» kartasida — bu yerda takrorlanmaydi */
    const balans = y && y.balans ? +y.balans.qiymat : (o.balansQiymat != null ? +o.balansQiymat : null);
    const farq = balans != null ? yaxlit((+s.narx || 0) - balans) : null;
    document.getElementById("qqs").innerHTML =
      dd("Balans qiymati", balans != null ? pul(balans) : "<span>Kiritilmagan</span>") +
      dd("Narx va balans farqi", farq == null ? "—" : farq > 0 ? pul(farq) : "<span>Farq yo'q</span>") +
      dd("QQS bazasi", farq != null && farq > 0 ? pul(farq) + ' <span class="chip chip-kichik chip-sariq">Taxminiy</span>' : "<span>QQS hisoblanmaydi</span>");
    tarjimaQil(document.querySelector(".kontent"));
  }

  /* Jadvalni yozish (xato bo'lsa tasdiqlash oynasida ko'rinadi) */
  async function jadvalYoz(jadval, tarixMatn){
    const s = top();
    const vaqtincha = Object.assign({}, s, {jadval});
    const t = tolov(vaqtincha), yangi = holatHisobla(vaqtincha, t);
    await MKBapi.yangilash("SHARTNOMALAR", s.id, {jadval, holat: yangi});
    const y = D.topish(s.obyektId);
    if (y && tarixMatn) await MKBapi.yangilash("YOZUVLAR", y.id, {tarix: tarixQosh(y, tarixMatn[0], tarixMatn[1])});
    else if (y && yangi === "toliq tolangan" && s.holat !== "toliq tolangan")
      await MKBapi.yangilash("YOZUVLAR", y.id, {tarix: tarixQosh(y, "Shartnoma bo'yicha to'lov to'liq tushdi", s.id + ", " + pul(s.narx))});
  }
  /* To'lov belgisi pulga ta'sir qiladi: qabul qilish — tasdiqlash bilan, belgini olib tashlash — sabab bilan */
  async function belgila(i){
    const s = top(), j0 = s.jadval || [], x = j0[i];
    if (!x) return;
    const t0 = tolov(s);
    if (!x.tolandi){
      const jadval = j0.map((z, k) => k === i ? Object.assign({}, z, {tolandi: true, tolanganSana: D.sanaYoz(bugun())}) : Object.assign({}, z));
      const qoldiq = Math.max(0, yaxlit(t0.qoldiq - (+x.summa || 0)));
      const r = await MKB.tasdiqla({
        sarlavha: "To'lovni qabul qilish",
        matn: "To'lov tushgani qayd etiladi. Qabul sanasi — bugun.",
        tafsilot: [["Shartnoma", tz(s.id)], ["Xaridor", tz(s.xaridor)], ["To'lov", (i + 1) + " / " + j0.length], ["Reja sanasi", x.sana], ["Summa", tp(x.summa)],
          ["Qabul sanasi", D.sanaYoz(bugun())], ["Qoldiq to'lovdan keyin", tp(qoldiq)]],
        oqibat: qoldiq <= 0 ? ["To'lov to'liq yopiladi: taqiqni yechish va balansdan chiqarish mumkin bo'ladi"] : undefined,
        okMatn: "To'lovni qabul qilish", bekorMatn: "Orqaga",
        bajar: () => jadvalYoz(jadval),
      });
      if (!r) return;
      MKB.toast("Shartnoma " + s.id + " bo'yicha to'lov qabul qilindi");
    } else {
      const jadval = j0.map((z, k) => { const c = Object.assign({}, z); if (k === i){ c.tolandi = false; delete c.tolanganSana; } return c; });
      const r = await MKB.tasdiqla({
        sarlavha: "To'lov belgisini olib tashlash",
        matn: "To'lov qabul qilinmagan deb qayd etiladi. Qoldiq va kechikish qayta hisoblanadi.",
        tafsilot: [["Shartnoma", tz(s.id)], ["To'lov", (i + 1) + " / " + j0.length], ["Reja sanasi", x.sana], ["Summa", tp(x.summa)], ["Qabul qilingan", x.tolanganSana || "—"]],
        ton: "xavfli",
        sabab: {majburiy: true, min: 5, maks: 300, yorliq: "Sabab", izoh: "Sabab obyekt tarixiga yoziladi", namuna: "Masalan, bank ko'chirmasida to'lov topilmadi"},
        okMatn: "Belgini olib tashlash", bekorMatn: "Orqaga",
        bajar: ({sabab}) => jadvalYoz(jadval, ["To'lov belgisi olib tashlandi", s.id + ", " + x.sana + ", " + pul(x.summa) + ". " + sabab]),
      });
      if (!r) return;
      MKB.toast("Shartnoma " + s.id + " bo'yicha to'lov belgisi olib tashlandi");
    }
    chiz();
  }
  const AMAL = {
    keyingi(){
      const i = (top().jadval || []).findIndex(x => !x.tolandi);
      if (i >= 0) belgila(i);
    },
    async taqiq(){
      const s = top();
      const r = await MKB.tasdiqla({
        sarlavha: "Taqiqni yechish",
        matn: "To'lov to'liq tushgan. Mulk ustidagi taqiq yechilgani qayd etiladi, xaridor mulkni erkin tasarruf eta oladi.",
        tafsilot: [["Shartnoma", tz(s.id)], ["Xaridor", tz(s.xaridor)], ["Obyekt", tz(obNomi(s))], ["To'langan", tp(tolov(s).tolangan)]],
        ton: "xavfli",
        okMatn: "Taqiqni yechish", bekorMatn: "Orqaga",
        bajar: async () => {
          await MKBapi.yangilash("SHARTNOMALAR", s.id, {taqiqHolati: "yechilgan"});
          const y = D.topish(s.obyektId);
          if (y) await MKBapi.yangilash("YOZUVLAR", y.id, {tarix: tarixQosh(y, "Taqiq yechildi", s.id)});
        },
      });
      if (!r) return;
      MKB.toast("Shartnoma " + s.id + " bo'yicha taqiq yechildi");
      chiz();
    },
    async yakun(){
      const s = top();
      const r = await MKB.tasdiqla({
        sarlavha: "Shartnomani yakunlash",
        matn: "Obyekt balansdan chiqarilgan. Shartnoma yopiladi, uning to'lov belgilarini keyin o'zgartirib bo'lmaydi.",
        tafsilot: [["Shartnoma", tz(s.id)], ["Xaridor", tz(s.xaridor)], ["Narx", tp(s.narx)], ["Taqiq", nomi("yechilgan")]],
        ton: "xavfli",
        yozibTasdiq: s.id,
        okMatn: "Shartnomani yakunlash", bekorMatn: "Orqaga",
        bajar: () => MKBapi.yangilash("SHARTNOMALAR", s.id, {holat: "yakunlangan", taqiqHolati: "yechilgan"}),
      });
      if (!r) return;
      MKB.toast("Shartnoma " + s.id + " yakunlandi");
      chiz();
    },
  };

  MKB.sahifaYukla({
    joylar: {"kpi": ["karta", 4], "jadval": ["qator", 6], "malumot": ["qator", 5], "qqs": ["qator", 3]},
    xato: "Shartnoma ma'lumotini yuklab bo'lmadi",
    ish: async () => {
      await MKB.kolYukla(["YOZUVLAR", "SHARTNOMALAR", "LOTLAR", "TAKLIFLAR"]);
      if (!top() || !MKB.doira([top()]).length){ location.replace("xato-404.html"); return; }
      chiz();
    },
  });
  document.addEventListener("mkb:malumot", () => { try{ if (top()) chiz(); }catch(_){ } });
})();
</script>
