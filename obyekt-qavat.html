<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Qavat rejasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082800">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
<style>

.reja-tor{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:18px}
.reja-varaq{background:var(--oq);border-radius:var(--r-karta);box-shadow:var(--soya);padding:18px;
  overflow-x:auto}
.qavat-reja{width:100%;min-width:640px;height:auto;display:block}
.reja-toq line{stroke:#C9C2B7;stroke-width:.6;stroke-dasharray:6 4}
.reja-toq circle{fill:#fff;stroke:#15150F;stroke-width:1}
.reja-toq text{font:500 8px var(--shrift);fill:#15150F}
.reja-devor rect{fill:#15150F}
.reja-simvol line{stroke:#15150F;stroke-width:.9}
.reja-simvol .qanot{stroke-width:1.4}
.reja-simvol .yoy{fill:none;stroke:#8A8378;stroke-width:.7;stroke-dasharray:3 2}
.reja-yozuv .nom{font:500 9px var(--shrift);fill:#15150F}
.reja-yozuv .olcham{font:500 8.6px var(--shrift-mono);fill:#5F5A52}
.reja-yozuv .kod{font:500 7.6px var(--shrift-mono);fill:#8C8478}
.reja-yozuv .qisqa{font:500 8px var(--shrift-mono);fill:#5F5A52}
.reja-olchov line{stroke:#6F6A61;stroke-width:.6}
.reja-olchov text{font:500 7.4px var(--shrift-mono);fill:#3A362F}
.reja-masshtab text{font:500 7.4px var(--shrift-mono);fill:#3A362F}
.reja-shimol path{fill:#15150F}
.reja-shimol text{font:500 8px var(--shrift);fill:#15150F}
.reja-kn circle{fill:#25651A}
.reja-kn path{fill:#fff}
.reja-xona{cursor:pointer}
.reja-xona:hover .reja-tanla{stroke:#25651A;stroke-width:2}
.reja-xona:focus-visible .reja-tanla{stroke:#25651A;stroke-width:2.4}
.reja-xona.tanlangan .reja-tanla{stroke:#15150F;stroke-width:2.6}
.reja-qavatlar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.reja-qavatlar button{height:36px;padding:0 15px;border-radius:999px;background:var(--oq);
  box-shadow:var(--soya-past);font-size:13px;font-weight:500;color:var(--matn-2)}
.reja-qavatlar button.faol{background:var(--siyoh);color:var(--oq)}
.reja-legend{display:flex;flex-direction:column;gap:9px}
.reja-legend div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--matn-2)}
.reja-legend i{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.12)}
@media (max-width:1100px){.reja-tor{grid-template-columns:minmax(0,1fr)}}
</style>
<script src="yadro/qavat.js?v=26082800"></script><script src="yadro/nav3d.js?v=26082800"></script></head>
<body data-sahifa="aktivlar">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="obyektlar.html">Aktivlar reyestri</a><span class="ajratgich">/</span><span>Obyekt kartochkasi</span></div>
    <div class="hs-qator"><h1>Obyekt kartochkasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="obyekt.html" data-id-qoshib="1">Umumiy</a><a href="obyekt-moliya.html" data-id-qoshib="1">Moliya</a><a href="obyekt-hujjatlar.html" data-id-qoshib="1">Hujjatlar</a><a href="obyekt-koriklar.html" data-id-qoshib="1">Ko'riklar</a><a href="obyekt-xarajatlar.html" data-id-qoshib="1">Xarajatlar</a><a href="obyekt-galereya.html" data-id-qoshib="1">Galereya</a><a href="obyekt-3d.html" data-id-qoshib="1">3D navigator</a><a href="obyekt-qavat.html" class="faol" data-id-qoshib="1">Qavat rejasi</a><a href="obyekt-tarix.html" data-id-qoshib="1">Tarix</a></nav>
  <section class="foto-shapka" aria-label="Obyekt">
    <img id="fs-rasm" src="" alt="">
    <div>
      <div style="flex:1;min-width:220px">
        <div style="display:flex;gap:8px;margin-bottom:8px" id="fs-chiplar"></div>
        <h2 id="fs-nom">—</h2>
        <div class="fs-meta"><span class="kod-mono" id="fs-id" style="color:rgba(255,255,255,.85)">—</span> · <span id="fs-manzil">—</span></div>
      </div>
      <div id="fs-halqa"></div>
    </div>
  </section>
  <div class="reja-qavatlar" id="reja-qavatlar" role="group" aria-label="Qavat tanlash"></div>
  <div class="reja-tor">
    <section class="reja-varaq" id="reja-joy" aria-label="Qavat rejasi"></section>
    <aside class="nav3d-yon">
      <section class="karta"><div class="karta-bosh"><h2 id="rj-qavat">—</h2></div>
        <dl class="malumot-royxat xona-tafsilot" id="rj-jamlama"></dl></section>
      <section class="karta"><div class="karta-bosh"><h2 id="rj-xona-nom">Xona tanlanmagan</h2></div>
        <dl class="malumot-royxat xona-tafsilot" id="rj-xona"></dl></section>
      <section class="karta"><div class="karta-bosh"><h2>Shartli belgilar</h2></div>
        <div class="reja-legend" id="rj-legend"></div></section>
    </aside>
  </div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082800"></script>
<script src="malumot.js?v=26082800"></script>
<script src="malumot-qoshimcha.js?v=26082800"></script>
<script src="malumot-kengaytma.js?v=26082800"></script>
<script src="malumot-kirish.js?v=26082800"></script>
<script src="malumot-indeks.js?v=26082800"></script>
<script src="tarjima.js?v=26082800"></script>
<script src="yadro/ikonlar.js?v=26082800"></script>
<script src="yadro/daraxt.js?v=26082800"></script>
<script src="yadro/chizma.js?v=26082800"></script>
<script src="yadro/qollanma.js?v=26082800"></script>
<script src="yadro/api.js?v=26082800"></script>
<script src="yadro/app.js?v=26082800"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const x = id ? await MKBapi.bitta('YOZUVLAR', id) : null;
  if (!x){ location.replace("xato-404.html"); return; }
  document.getElementById("fs-rasm").src = x.mulk.rasm;
  document.getElementById("fs-nom").textContent = x.mulk.nom;
  document.getElementById("fs-id").textContent = x.id;
  document.getElementById("fs-manzil").textContent = x.mulk.manzil;
  document.getElementById("fs-chiplar").innerHTML =
    "<span class=\"chip chip-brend\">" + x.bosqichNomi + "</span>" +
    "<span class=\"chip chip-siyoh\">" + x.mulk.tur + "</span>";
  const fsIndeks = MKB_DATA.nazoratIndeksi(x);
  document.getElementById("fs-halqa").innerHTML = MKB.halqa(fsIndeks.ball, 74, 6)
    .replace('class="halqa', 'class="halqa katta');
  document.getElementById("fs-halqa").title = "Nazorat indeksi: " + fsIndeks.darajaNomi;
  /* tab havolalariga ?id= ulab qo'yamiz */
  document.querySelectorAll(".bolim-tablar a").forEach(a => {
    if (!a.href.includes("?")) a.href += "?id=" + encodeURIComponent(id);
  });
  document.getElementById("hs-meta").textContent = x.id + " · " + x.filial;

  const model = MKBbino.model(x.id, x.mulk.tur, x.mulk.qisqa, x.mulk.maydon);
  if (!model.binoli){
    const q0 = document.getElementById("reja-qavatlar");
    if (q0) q0.remove();
    document.querySelector(".reja-tor").innerHTML =
      '<div class="bosh-holat" style="padding:52px 24px;text-align:center">' +
      '<b style="display:block;font:500 17px var(--shrift-displey);margin-bottom:6px">' +
      "Bu obyekt turida bino tuzilmasi yuritilmaydi</b>" +
      '<span style="font-size:13.5px;color:var(--matn-3)">' + x.mulk.tur +
      " uchun qavat rejasi va uch o&#39;lchovli ko&#39;rinish o&#39;rniga hujjatlar, " +
      "foto va ko&#39;rik dalolatnomalari yuritiladi.</span>" +
      '<div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<a class="tugma tugma-oq" href="obyekt-galereya.html?id=' + encodeURIComponent(x.id) + '">' +
      '<svg class="ic"><use href="#i-galereya"/></svg>Foto galereya</a>' +
      '<a class="tugma tugma-oq" href="obyekt-hujjatlar.html?id=' + encodeURIComponent(x.id) + '">' +
      '<svg class="ic"><use href="#i-hujjat"/></svg>Hujjatlar</a></div></div>';
    return;
  }
  const RANG = {foydalanishda: "#EAF6E4", bosh: "#EFF4F7", muhrlangan: "#FBE7E3", tamirda: "#E7EAFA"};
  const p2 = new URLSearchParams(location.search);
  let joriy = Math.min(model.qavatSoni, Math.max(1, +(p2.get("qavat") || 1)));

  document.getElementById("rj-legend").innerHTML = MKBbino.HOLATLAR.map(h =>
    '<div><i style="background:' + RANG[h.kalit] + '"></i>' + h.nom + "</div>").join("") +
    '<div><i style="background:#25651A;border-radius:99px"></i>Kirish nuqtasi</div>';

  const qav = document.getElementById("reja-qavatlar");
  qav.innerHTML = model.qavatlar.map(q =>
    '<button type="button" data-q="' + q.raqam + '">' + q.nom + "</button>").join("");

  function xonaChiz(xona){
    document.getElementById("rj-xona-nom").textContent = xona ? xona.nom : "Xona tanlanmagan";
    document.getElementById("rj-xona").innerHTML = xona
      ? "<dt>Kod</dt><dd>" + xona.id + "</dd>" +
        "<dt>Maydon</dt><dd>" + xona.maydon.toFixed(1).replace(".", ",") + " m&#178;</dd>" +
        "<dt>O&#39;lcham</dt><dd>" + xona.en.toFixed(1).replace(".", ",") + " × " +
          xona.chuq.toFixed(1).replace(".", ",") + " m</dd>" +
        "<dt>Holat</dt><dd>" + MKBbino.holatNomi(xona.holat) + "</dd>"
      : '<dd style="grid-column:1/-1;color:var(--matn-3)">Rejada xonani bosing</dd>';
  }

  function chiz(){
    const q = model.qavatlar.find(z => z.raqam === joriy);
    MKBqavat.chiz("reja-joy", model, joriy, {
      tanlanganda: xonaChiz,
      kirishNuqtaBosilganda: kn => MKB.toast("Kirish nuqtasi: " + kn.nom),
    });
    qav.querySelectorAll("button").forEach(b => b.classList.toggle("faol", +b.dataset.q === joriy));
    const jam = {};
    q.xonalar.forEach(z => jam[z.holat] = (jam[z.holat] || 0) + 1);
    document.getElementById("rj-qavat").textContent = q.nom;
    document.getElementById("rj-jamlama").innerHTML =
      "<dt>Xonalar</dt><dd>" + q.xonalar.length + " ta</dd>" +
      "<dt>Qavat maydoni</dt><dd>" + MKB.fmt(Math.round(q.maydon)) + " m&#178;</dd>" +
      "<dt>Yo&#39;lak</dt><dd>" + q.yolak.maydon.toFixed(1).replace(".", ",") + " m&#178;</dd>" +
      "<dt>Kirish nuqtalari</dt><dd>" + q.kirishNuqtalari.length + " ta</dd>" +
      MKBbino.HOLATLAR.map(h => "<dt>" + h.nom + "</dt><dd>" + (jam[h.kalit] || 0) + "</dd>").join("");
    xonaChiz(null);
  }
  qav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    joriy = +b.dataset.q;
    chiz();
  }));
  chiz();

});
</script>
</body>
</html>
