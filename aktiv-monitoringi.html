<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var t=localStorage.getItem("mkb-tema");if(t==="realty"||t==="estate")document.documentElement.dataset.tema=t})()</script>
<title>MKB — Aktivlar monitoringi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mkb.css?v=26082605">
<style>
/* ---- Aktivlar monitoringi: nazorat holati bo'yicha yig'ma ekran ---- */
.mn-ustun{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.mn-ustun > *{min-width:0}

/* Nazorat holati jadvali */
.mn-jadval td{vertical-align:middle}
.mn-jadval .son{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mn-obyekt{display:flex;align-items:center;gap:11px}
.mn-obyekt img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.mn-obyekt b{font-weight:750;display:block}
.mn-obyekt span{font-size:12px;color:var(--matn-3)}

/* Nazorat balli */
.ball-iz{position:relative;height:6px;border-radius:99px;background:var(--chiziq);min-width:70px;overflow:hidden}
.ball-iz i{display:block;height:100%;border-radius:99px}
.ball-matn{font-size:11.5px;color:var(--matn-3);font-variant-numeric:tabular-nums;margin-top:3px}

/* Holat belgilari: uch nazorat o'qi */
.mn-belgi{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.mn-belgi .ic{width:11px;height:11px}
.b-yaxshi{background:#ECFDF5;color:#047857}
.b-ogoh{background:#FFFBEB;color:#B45309}
.b-xavf{background:#FEF2F2;color:#B91C1C}

/* O'ng panel: e'tibor talab qilinadigan holatlar */
.et-band{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--chiziq)}
.et-band:last-child{border-bottom:none}
.et-tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.et-tile .ic{width:17px;height:17px}
.et-band b{font-size:13.5px;font-weight:750;display:block}
.et-band p{font-size:12.5px;color:var(--matn-3);line-height:1.5;margin-top:2px}
.et-band .vaqt{font-size:11.5px;color:var(--matn-4);margin-top:4px;display:block}

.mn-qator{cursor:pointer}
.mn-qator:hover{background:var(--kanvas)}
.mn-qator.tanlangan{background:var(--asos-fon)}

@media (max-width:1320px){ .mn-ustun{grid-template-columns:1fr} }
</style>
</head>
<body data-sahifa="aktivlar" data-topbar-sarlavha="Aktivlar monitoringi" data-topbar-ikon="i-monitor">

<div class="app">
<aside class="sidebar" data-shell-sidebar></aside>

<div class="asosiy">
  <header class="topbar" data-shell-topbar></header>

  <main class="kontent">
    <div class="sahifa-qator">
      <div>
        <h1>Aktivlar monitoringi</h1>
        <div class="sahifa-izoh">Har bir obyekt bo'yicha ko'rik, sug'urta va baholash holati — bir ekranda</div>
      </div>
      <div class="sahifa-harakat">
        <button class="tanlov" id="f-hudud" data-royxat="hudud" data-royxat-bosh="Barcha hududlar"><span class="t-yorliq">Barcha hududlar</span><svg class="ic"><use href="#i-past"/></svg></button>
        <button class="tugma tugma-oq" data-toast="Monitoring hisoboti PDF ga yuklanmoqda"><svg class="ic"><use href="#i-yuklab"/></svg>Hisobot</button>
      </div>
    </div>

    <section class="kpi-band" aria-label="Nazorat ko'rsatkichlari">
      <button class="kpi" data-toast="Ko'riklar kesimi butun portfel bo'yicha">
        <span class="kpi-tile dark"><svg class="ic"><use href="#i-tashrif"/></svg></span>
        <div class="kpi-matn">
          <div class="kpi-yorliq">Ko'riklar (portfel)</div>
          <div class="kpi-qiymat"><b id="k-korik">—</b></div>
          <div class="kpi-izoh"><span id="k-korik-izoh">—</span></div>
        </div>
      </button>
      <button class="kpi" data-toast="Sug'urta amal qilish kesimi">
        <span class="kpi-tile lime"><svg class="ic"><use href="#i-qalqon"/></svg></span>
        <div class="kpi-matn">
          <div class="kpi-yorliq">Sug'urta amalda</div>
          <div class="kpi-qiymat"><b id="k-sugurta">—</b></div>
          <div class="kpi-izoh"><span id="k-sugurta-izoh">—</span></div>
        </div>
      </button>
      <button class="kpi" data-toast="Baholash dolzarbligi kesimi">
        <span class="kpi-tile lime"><svg class="ic"><use href="#i-grafik"/></svg></span>
        <div class="kpi-matn">
          <div class="kpi-yorliq">Baholash dolzarb</div>
          <div class="kpi-qiymat"><b id="k-baho">—</b></div>
          <div class="kpi-izoh"><span id="k-baho-izoh">—</span></div>
        </div>
      </button>
      <button class="kpi" data-toast="Ochiq aktiv hodisalari — yuridik ish bo'limida">
        <span class="kpi-tile dark"><svg class="ic"><use href="#i-ogoh"/></svg></span>
        <div class="kpi-matn">
          <div class="kpi-yorliq">Ochiq hodisalar</div>
          <div class="kpi-qiymat"><b id="k-hodisa">—</b></div>
          <div class="kpi-izoh">Shikast, kamomad, huquqiy cheklov</div>
        </div>
      </button>
    </section>

    <div class="mn-ustun">
      <div class="karta">
        <div class="karta-bosh"><h3>Batafsil nazoratdagi obyektlar</h3></div>
        <div class="jadval-orash">
          <table class="jadval mn-jadval">
            <thead>
              <tr>
                <th>Obyekt</th><th>Bosqich</th><th>Nazorat balli</th>
                <th>So'nggi ko'rik</th><th>Sug'urta</th><th>Baholash</th>
              </tr>
            </thead>
            <tbody id="mn-jadval"></tbody>
          </table>
        </div>
      </div>

      <aside class="karta" aria-label="E'tibor talab qilinadigan holatlar">
        <div class="karta-bosh"><h3>E'tibor talab qilinadi</h3></div>
        <div id="mn-etibor"></div>
      </aside>
    </div>
  </main>
</div>
</div>

<script src="malumot.js?v=26082605"></script>
<script src="tarjima.js?v=26082605"></script>
<script src="mkb.js?v=26082605"></script>
<script>
const D = MKB_DATA;

/* ---- KPI: portfel kesimlari (Д-7 — sonlar kesim jadvalidan) ---- */
const pk = D.PORTFEL.koriklar, ps = D.PORTFEL.sugurtali, pb = D.PORTFEL.baholash;
const f = D.fmt;
document.getElementById("k-korik").textContent  = f(pk.otkazilgan) + " / " + f(pk.jami);
document.getElementById("k-korik-izoh").textContent = f(pk.muddatiOtgan) + " ta muddati o'tgan, " + f(pk.rejada) + " ta rejada";
document.getElementById("k-sugurta").textContent = f(ps.amalda) + " / " + f(ps.jami);
document.getElementById("k-sugurta-izoh").textContent = f(ps.tugaydi30) + " ta 30 kunda tugaydi, " + f(ps.muddatiOtgan) + " ta o'tgan";
document.getElementById("k-baho").textContent = f(pb.dolzarb) + " / " + f(pb.jami);
document.getElementById("k-baho-izoh").textContent = f(pb.tugaydi90) + " ta 90 kunda eskiradi, " + f(pb.eskirgan) + " ta eskirgan";
document.getElementById("k-hodisa").textContent =
  D.HODISALAR.filter(h => h.holat !== "Yopildi").length;

/* ---- Har bir yozuv bo'yicha nazorat holati: uch o'q ---- */
function korikHolati(id){
  const otgan = D.KORIKLAR.find(x => x.obyektId === id && x.holat === "otkazildi");
  const kechikkan = D.KORIKLAR.find(x => x.obyektId === id && x.holat === "muddati_otgan");
  if (kechikkan) return {cls: "b-xavf", ikon: "i-ogoh", matn: "Ko'rik o'tkazilmadi"};
  if (otgan)     return {cls: "b-yaxshi", ikon: "i-belgi", matn: otgan.sana};
  return {cls: "b-ogoh", ikon: "i-soat", matn: "Rejalashtirilgan"};
}
function sugurtaHolati(id){
  const g = D.SUGURTALAR.find(x => x.obyektId === id);
  if (!g || g.holat === "yoq")          return {cls: "b-xavf", ikon: "i-ogoh", matn: "Polis yo'q"};
  if (g.holat === "muddati_otgan")      return {cls: "b-xavf", ikon: "i-ogoh", matn: "Muddati o'tgan"};
  if (g.holat === "tugaydi")            return {cls: "b-ogoh", ikon: "i-soat", matn: g.tugash + " gacha"};
  return {cls: "b-yaxshi", ikon: "i-belgi", matn: g.tugash + " gacha"};
}
function bahoHolati(id){
  const b = D.BAHOLASHLAR.find(x => x.obyektId === id);
  if (!b)                       return {cls: "b-xavf", ikon: "i-ogoh", matn: "Baholanmagan"};
  if (b.holat === "eskirgan")   return {cls: "b-xavf", ikon: "i-ogoh", matn: "Eskirgan"};
  if (b.holat === "tugaydi")    return {cls: "b-ogoh", ikon: "i-soat", matn: b.keyingi + " gacha"};
  return {cls: "b-yaxshi", ikon: "i-belgi", matn: b.keyingi + " gacha"};
}
const HOLAT_SOZ = {"b-yaxshi": "holat yaxshi", "b-ogoh": "e'tibor talab qilinadi", "b-xavf": "muammo"};
const belgi = h => `<span class="mn-belgi ${h.cls}"><svg class="ic" aria-hidden="true"><use href="#${h.ikon}"/></svg><span class="sr-only">${HOLAT_SOZ[h.cls]}: </span>${h.matn}</span>`;

function ballRang(b){ return b >= 80 ? "#047857" : b >= 60 ? "#B45309" : "#B91C1C"; }

let fHudud = null;
function jadvalChiz(){
document.getElementById("mn-jadval").innerHTML = D.YOZUVLAR
  .filter(y => !fHudud || y.mulk.hudud === fHudud)
  .map(y => `
  <tr class="mn-qator" data-id="${y.id}" tabindex="0" role="link" aria-label="${y.mulk.qisqa} kartochkasini ochish">
    <td>
      <div class="mn-obyekt">
        <img src="${y.mulk.rasmKichik}" alt="" loading="lazy" width="44" height="44">
        <div><b>${y.mulk.qisqa}</b><span>${y.id} · ${y.mulk.hudud}</span></div>
      </div>
    </td>
    <td><span class="chip ${y.bosqichChip}">${y.bosqichNomi}</span></td>
    <td>
      <div class="ball-iz"><i style="width:${y.mulk.nazoratBall}%;background:${ballRang(y.mulk.nazoratBall)}"></i></div>
      <div class="ball-matn">${y.mulk.nazoratBall} / 100</div>
    </td>
    <td>${belgi(korikHolati(y.id))}</td>
    <td>${belgi(sugurtaHolati(y.id))}</td>
    <td>${belgi(bahoHolati(y.id))}</td>
  </tr>`).join("");

document.querySelectorAll(".mn-qator").forEach(tr => {
  const och = () => location.href = "obyekt.html?id=" + encodeURIComponent(tr.dataset.id);
  tr.addEventListener("click", och);
  tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); och(); } });
});
}
jadvalChiz();
document.getElementById("f-hudud").addEventListener("tanlov", e => {
  fHudud = e.detail === "Barcha hududlar" ? null : e.detail;
  jadvalChiz();
});

/* ---- E'tibor paneli: uch manbadan yig'iladi, qo'lda yozilmaydi (Д-7) ---- */
const etibor = [];
D.KORIKLAR.filter(k => k.holat === "muddati_otgan").forEach(k => etibor.push({
  tur: "xavf", ikon: "i-tashrif", sarlavha: "Ko'rik o'tkazilmadi",
  matn: k.obyekt + " — " + k.izoh, vaqt: k.sana + " · " + k.inspektor
}));
D.SUGURTALAR.filter(g => g.holat === "muddati_otgan" || g.holat === "yoq").forEach(g => etibor.push({
  tur: "xavf", ikon: "i-qalqon",
  sarlavha: g.holat === "yoq" ? "Sug'urta polisi yo'q" : "Sug'urta muddati o'tgan",
  matn: g.obyekt + (g.polis !== "—" ? " — polis " + g.polis : ""),
  vaqt: g.tugash !== "—" ? g.tugash + " da tugagan" : "rasmiylashtirilmagan"
}));
D.SUGURTALAR.filter(g => g.holat === "tugaydi").forEach(g => etibor.push({
  tur: "ogoh", ikon: "i-qalqon", sarlavha: "Sug'urta muddati tugayapti",
  matn: g.obyekt + " — " + g.kompaniya, vaqt: g.tugash + " gacha amalda"
}));
D.BAHOLASHLAR.filter(b => b.holat === "eskirgan").forEach(b => etibor.push({
  tur: "ogoh", ikon: "i-grafik", sarlavha: "Baholash eskirgan",
  matn: b.obyekt + " — so'nggi baholash " + b.sana, vaqt: "keyingi muddat: " + b.keyingi
}));

const tile = t => t === "xavf"
  ? 'style="background:#FEF2F2;color:#B91C1C"'
  : 'style="background:#FFFBEB;color:#B45309"';

document.getElementById("mn-etibor").innerHTML = etibor.map(e => `
  <div class="et-band">
    <span class="et-tile" ${tile(e.tur)}><svg class="ic"><use href="#${e.ikon}"/></svg></span>
    <div><b>${e.sarlavha}</b><p>${e.matn}</p><span class="vaqt">${e.vaqt}</span></div>
  </div>`).join("");
</script>
</body>
</html>
