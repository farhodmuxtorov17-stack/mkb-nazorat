<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Servis topshirig'i</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.tor-2>*,.ustun>*,.forma-tor>*{min-width:0}
.kirish select{width:100%;text-overflow:ellipsis}
.amal-qator{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.kichik-izoh{font-size:12.5px;color:var(--matn-3);line-height:1.55;margin-top:10px}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="qurilmalar.html">Qurilmalar</a><span class="ajratgich">/</span><span>Servis topshirig'i</span></div>
    <div class="hs-qator"><h1 id="st-nom">Servis topshirig'i</h1><span class="hs-meta" id="hs-meta"></span><div class="hs-amallar" id="st-amallar" data-tur="servis-amallar"></div></div>
  </div>
  <div class="tor-2" id="st-tor">
    <div class="ustun">
      <section class="karta" id="st-natija-k" hidden aria-labelledby="st-n-s" data-tur="servis-natija">
        <div class="karta-bosh"><h2 id="st-n-s" data-ikonka="pul">Natija va xarajat</h2></div>
        <div id="st-natija"></div>
      </section>
      <section class="karta" aria-labelledby="st-f-s" data-tur="servis-forma">
        <div class="karta-bosh"><h2 id="st-f-s" data-ikonka="vazifa">Topshiriq</h2></div>
        <div id="st-forma"></div>
      </section>
    </div>
    <div class="ustun">
      <section class="karta" aria-labelledby="st-q-s" data-tur="servis-qurilma">
        <div class="karta-bosh"><h2 id="st-q-s" data-ikonka="qurilma">Qurilma</h2></div>
        <div id="st-qurilma"></div>
      </section>
      <section class="karta" aria-labelledby="st-t-s" data-tur="servis-tarix">
        <div class="karta-bosh"><h2 id="st-t-s" data-ikonka="uskuna">Qurilmaning servis tarixi</h2><span class="soni" id="st-t-soni"></span></div>
        <div id="st-tarix"></div>
      </section>
    </div>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  MKB.sahifaYukla({
    joylar: {"st-forma": ["qator", 5], "st-qurilma": ["qator", 3], "st-tarix": ["qator", 3]},
    xato: "Servis topshirig'ini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["QURILMALAR", "XIZMAT_ISHLARI", "XARAJATLAR"]);
      ulandi = true;
      boshla();
    },
  });

  function boshla(){
  const p = new URLSearchParams(location.search);
  let ish = p.get("id") ? (D.XIZMAT_ISHLARI || []).find(x => x.id === p.get("id")) : null;
  if (p.get("id") && (!ish || !MKB.doira([ish]).length)){ location.replace("xato-404.html"); return; }
  let q = ish ? D.qurilma(ish.qurilmaId) : (p.get("qurilma") ? D.qurilma(p.get("qurilma")) : null);
  if (p.get("qurilma") && !q){ location.replace("xato-404.html"); return; }

  const TURLAR = ["Batareyani almashtirish", "Quyosh panelini tozalash", "Dasturiy ta'minotni yangilash", "Nosozlikni bartaraf etish", "SIM-kartani almashtirish", "Qayta sozlash", "Demontaj"];
  const HOL = {rejada: ["Rejada", "chip-info"], bajarilmoqda: ["Bajarilmoqda", "chip-sariq"], bajarildi: ["Bajarildi", "chip-yashil"], "bekor qilingan": ["Bekor qilingan", "chip-kul"]};
  const yozadi = MKB.huquq("himoya", "yoz");
  const iso = s => { const d = D.sanaOqi(s); return d ? D.sanaYoz(d).split(".").reverse().join("-") : ""; };
  const xarajati = () => ish ? (D.XARAJATLAR || []).filter(x => String(x.izoh || "").indexOf(ish.id) >= 0) : [];
  let qoriq = null, natijaQoriq = null;
  if (!yozadi && !ish){ location.replace("qurilmalar.html"); return; }

  function shapka(){
    if (ish){
      const h = HOL[ish.holat] || [ish.holat, "chip-kul"];
      $("st-nom").textContent = ish.tur;
      $("hs-meta").innerHTML = '<span class="kod-mono" data-tarjimasiz>' + esc(ish.id) + '</span> <span class="chip ' + h[1] + '">' + h[0] + "</span>";
    } else { $("st-nom").textContent = "Yangi servis topshirig'i"; $("hs-meta").innerHTML = "<span>Qurilmaga xizmat ko'rsatish</span>"; }
    /* Navbatdagi amal: rejadagi ishni boshlash. Yakunlash natija formasida, bekor qilish ikkinchi darajali */
    const faol = yozadi && ish && (ish.holat === "rejada" || ish.holat === "bajarilmoqda");
    $("st-amallar").innerHTML = faol ? '<button type="button" class="tugma tugma-oq" id="st-bekor" data-yozadi data-tur="servis-bekor">' + ik("yopish") + "<span>Bekor qilish</span></button>" +
      (ish.holat === "rejada" ? '<button type="button" class="tugma tugma-asosiy" id="st-boshla" data-yozadi data-tur="servis-boshlash">' + ik("ong") + "<span>Ishni boshlash</span></button>" : "") : "";
    tarjimaQil(document.querySelector(".hujjat-shapka"));
    const b = $("st-boshla"); if (b) b.addEventListener("click", () => boshlash(b));
    const bk = $("st-bekor"); if (bk) bk.addEventListener("click", bekorQil);
  }

  function qurilmaKarta(){
    if (!q){ $("st-qurilma").innerHTML = MKB.boshHolat("qurilma", "Qurilma tanlanmagan", "Topshiriq formasida qurilmani tanlang"); tarjimaQil($("st-qurilma")); $("st-tarix").innerHTML = ""; $("st-t-soni").textContent = ""; return; }
    const h = D.qurilmaHolati(q) || {};
    $("st-qurilma").innerHTML = '<a class="qator" href="qurilma.html?id=' + encodeURIComponent(q.id) + '"><span class="belgi">' + ik("qurilma") + '</span><span class="matn"><b>' + esc(q.turNomi) + "</b><span>" +
      esc(MKB.kn.obyektNomi(q.obyektId)) + " · " + esc(q.id) + "</span></span></a>" +
      '<dl class="malumot-royxat" style="margin-top:8px"><dt>Model</dt><dd>' + esc([q.ishlabChiqaruvchi, q.model].filter(Boolean).join(" ")) + "</dd>" +
      "<dt>Batareya</dt><dd data-tarjimasiz>" + (q.batareya == null ? "—" : q.batareya + "%") + "</dd>" +
      "<dt>Oxirgi signal</dt><dd data-tarjimasiz>" + esc(q.oxirgiSignal || "—") + "</dd>" +
      "<dt>Aloqa</dt><dd>" + esc(q.aloqa || "—") + (h.uzoqOflayn ? ' <span class="chip chip-kichik chip-xavf">24 soatdan ortiq jim</span>' : "") + "</dd>" +
      "<dt>Keyingi xizmat</dt><dd data-tarjimasiz>" + esc(q.keyingiXizmat || "—") + "</dd></dl>";
    tarjimaQil($("st-qurilma"));
    const r = (D.XIZMAT_ISHLARI || []).filter(x => x.qurilmaId === q.id && (!ish || x.id !== ish.id)).sort((a, b) => (D.sanaOqi(b.sana) || 0) - (D.sanaOqi(a.sana) || 0));
    $("st-t-soni").textContent = r.length || "";
    $("st-tarix").innerHTML = r.length ? r.map(x => { const c = HOL[x.holat] || [x.holat, "chip-kul"];
      return '<a class="qator" href="servis-topshirigi.html?id=' + encodeURIComponent(x.id) + '"><span class="belgi">' + ik("sozlama") + '</span><span class="matn"><b>' + esc(x.tur) + "</b><span>" + esc(x.usta || "") +
        '</span></span><span class="ong"><span class="vaqt" data-tarjimasiz>' + esc(x.sana || "") + '</span><span class="chip chip-kichik ' + c[1] + '">' + c[0] + "</span></span></a>"; }).join("")
      : MKB.boshHolat("sozlama", "Boshqa servis ishi yo'q");
    tarjimaQil($("st-tarix"));
  }

  function forma(){
    if (qoriq){ qoriq.yoq(); qoriq = null; }
    const tahrir = yozadi && (!ish || ish.holat === "rejada" || ish.holat === "bajarilmoqda");
    const qurilmalar = MKB.doira(D.QURILMALAR || []).slice().sort((a, b) => String(MKB.kn.obyektNomi(a.obyektId)).localeCompare(String(MKB.kn.obyektNomi(b.obyektId))));
    if (!tahrir){
      $("st-forma").innerHTML = '<dl class="malumot-royxat"><dt>Ish turi</dt><dd>' + esc(ish.tur) + "</dd><dt>Sana</dt><dd data-tarjimasiz>" + esc(ish.sana || "—") + "</dd><dt>Usta</dt><dd>" + esc(ish.usta || "—") +
        "</dd><dt>Ehtiyot qismlar</dt><dd>" + esc((ish.ehtiyotQismlar || []).join(", ") || "—") + "</dd><dt>Izoh</dt><dd>" + esc(ish.izoh || "—") + "</dd></dl>";
      tarjimaQil($("st-forma")); return;
    }
    const minSana = iso(D.sanaYoz(D.kunQosh(D.bugun(), -30)));
    $("st-forma").innerHTML = '<form class="forma-tor" id="st-f" novalidate>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-q">Qurilma <b>*</b></label><div class="kirish"><select id="f-q" name="qurilmaId" required data-xato="Qurilmani tanlang"' + (ish ? " disabled" : "") + '><option value="">Tanlang</option>' +
        qurilmalar.map(x => '<option value="' + esc(x.id) + '"' + (q && x.id === q.id ? " selected" : "") + ">" + esc(MKB.kn.obyektNomi(x.obyektId) + " · " + x.turNomi + " · " + x.id) + "</option>").join("") + "</select></div></div>" +
      '<div class="maydon"><label class="maydon-yorliq" for="f-t">Ish turi <b>*</b></label><div class="kirish"><select id="f-t" name="tur" required data-xato="Ish turini tanlang"><option value="">Tanlang</option>' +
        TURLAR.concat(ish && !TURLAR.includes(ish.tur) ? [ish.tur] : []).map(t => "<option" + (ish && ish.tur === t ? " selected" : "") + ">" + esc(t) + "</option>").join("") + "</select></div></div>" +
      '<div class="maydon"><label class="maydon-yorliq" for="f-s">Rejadagi sana <b>*</b></label><div class="kirish"><input id="f-s" type="date" name="sana" required min="' + minSana + '" value="' + (ish ? iso(ish.sana) : iso(D.sanaYoz(D.ishKuniQosh(D.bugun(), 1)))) + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-u">Usta yoki tashkilot <b>*</b></label><div class="kirish"><input id="f-u" name="usta" maxlength="80" required data-xato="Usta yoki tashkilotni yozing" value="' + esc(ish ? ish.usta || "" : "") + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-e">Ehtiyot qismlar</label><div class="kirish"><input id="f-e" name="ehtiyot" maxlength="200" placeholder="Vergul bilan: LiFePO4 batareya, SIM-karta" value="' + esc(ish ? (ish.ehtiyotQismlar || []).join(", ") : "") + '"></div></div>' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-i">Izoh</label><textarea class="kirish-matn" id="f-i" name="izoh" rows="2" maxlength="400"></textarea></div>' +
      "</form>" +
      '<div class="amal-qator">' + (!ish ? '<button type="button" class="tugma tugma-asosiy" id="st-yarat" data-yozadi data-saqla data-tur="servis-berish">' + ik("tasdiq") + "<span>Topshiriq berish</span></button>"
        : '<button type="button" class="tugma tugma-oq" id="st-saqla" data-yozadi data-saqla data-tur="servis-saqlash">' + ik("tasdiq") + "<span>O'zgarishni saqlash</span></button>") + "</div>";
    if (ish) $("f-i").value = ish.izoh || "";
    tarjimaQil($("st-forma"));
    qoriq = MKB.formaQoriqla($("st-f"), {nom: "Servis topshirig'i"});
    const fq = $("f-q");
    fq.addEventListener("change", () => { q = D.qurilma(fq.value); qurilmaKarta(); });
    const yig = () => {
      const f = MKB.formaTekshir($("st-f"));
      if (!f) return null;
      const v = f.qiymatlar;
      return {tur: v.tur, sana: v.sana, usta: v.usta, ehtiyotQismlar: v.ehtiyot ? v.ehtiyot.split(",").map(s => s.trim()).filter(Boolean) : [], izoh: v.izoh || "", qurilmaId: v.qurilmaId};
    };
    if (!ish) $("st-yarat").addEventListener("click", () => MKB.band($("st-yarat"), async () => {
      const f = yig(); if (!f) return;
      const qq = D.qurilma(f.qurilmaId);
      let yangiId = null;
      const ok = await MKB.saqla(async () => {
        yangiId = await MKB.keyingiId("XIZMAT_ISHLARI", "XI-" + D.sanaOqi(f.sana).getFullYear() + "/", 3);
        await MKBapi.yangi("XIZMAT_ISHLARI", {id: yangiId, qurilmaId: qq.id, obyektId: qq.obyektId, kirishNuqtaId: qq.kirishNuqtaId || null, tur: f.tur, sana: f.sana, usta: f.usta,
          holat: "rejada", ehtiyotQismlar: f.ehtiyotQismlar, izoh: f.izoh});
      });
      if (!ok) return;
      MKB.toast("Servis topshirig'i " + yangiId + " berildi: " + f.tur);
      qoriq.toza();
      history.replaceState(null, "", "servis-topshirigi.html?id=" + encodeURIComponent(yangiId));
      ish = D.XIZMAT_ISHLARI.find(x => x.id === yangiId);
      chizHammasi();
    }));
    else $("st-saqla").addEventListener("click", () => MKB.band($("st-saqla"), async () => {
      const f = yig(); if (!f) return; delete f.qurilmaId;
      if (await MKB.saqla(() => MKBapi.yangilash("XIZMAT_ISHLARI", ish.id, f), "Servis topshirig'i " + ish.id + " saqlandi")){ qoriq.toza(); chizHammasi(); }
    }));
  }

  /* Xizmatdan chiqqan qurilmaning holati oxirgi signal bo'yicha: onlayn yoki oflayn */
  function signalHolati(qq){ const h = D.qurilmaHolati(Object.assign({}, qq, {holat: "onlayn"})) || {}; return h.holat === "onlayn" ? "onlayn" : "oflayn"; }
  const boshqaIshBor = () => (D.XIZMAT_ISHLARI || []).some(x => x.id !== ish.id && x.qurilmaId === q.id && x.holat === "bajarilmoqda");

  /* Ishni boshlash: darhol yoziladi, qaytarish mumkin */
  async function boshlash(tugma){
    const eskiQ = q ? q.holat : null;
    const qurilmaXizmatga = q && q.holat !== "nosoz";
    const ok = await MKB.band(tugma, () => MKB.saqla(async () => {
      await MKBapi.yangilash("XIZMAT_ISHLARI", ish.id, {holat: "bajarilmoqda"});
      if (qurilmaXizmatga) await MKBapi.yangilash("QURILMALAR", q.id, {holat: "xizmatda"});
    }));
    if (!ok) return;
    chizHammasi();
    MKB.qaytarish("Ish " + ish.id + " boshlandi. Qurilma xizmatda", {
      bekor: async () => {
        await MKBapi.yangilash("XIZMAT_ISHLARI", ish.id, {holat: "rejada"});
        if (qurilmaXizmatga) await MKBapi.yangilash("QURILMALAR", q.id, {holat: eskiQ});
      },
      keyin: () => chizHammasi(),
    });
  }
  async function bekorQil(){
    const boshlangan = ish.holat === "bajarilmoqda";
    const r = await MKB.tasdiqla({
      sarlavha: "Servis topshirig'ini bekor qilish",
      matn: "Topshiriq bekor qilingan deb belgilanadi." + (boshlangan ? " Qurilma xizmatdan chiqariladi, holati oxirgi signal bo'yicha tiklanadi." : ""),
      tafsilot: [["Topshiriq", {matn: ish.id, tarjimasiz: true}], ["Ish turi", ish.tur], ["Qurilma", q ? {matn: (q.turNomi || "") + " · " + q.id, tarjimasiz: true} : "—"], ["Usta", ish.usta || "—"]],
      ton: "xavfli", sabab: {majburiy: true, min: 5, maks: 300, yorliq: "Bekor qilish sababi", namuna: "Masalan: qurilma boshqa usta tomonidan tuzatildi"},
      okMatn: "Topshiriqni bekor qilish", bekorMatn: "Orqaga",
      bajar: async ({sabab}) => {
        await MKBapi.yangilash("XIZMAT_ISHLARI", ish.id, {holat: "bekor qilingan", izoh: [ish.izoh, "Bekor qilindi: " + sabab + " · " + MKB.kim()].filter(Boolean).join("\n")});
        if (boshlangan && q && q.holat === "xizmatda" && !boshqaIshBor()) await MKBapi.yangilash("QURILMALAR", q.id, {holat: signalHolati(q)});
      },
    });
    if (!r) return;
    MKB.toast("Servis topshirig'i " + ish.id + " bekor qilindi");
    chizHammasi();
  }

  /* Natija va xarajat: bajarilayotgan ishda forma, yakunlash pul yozuvi bo'lgani uchun tasdiqlanadi */
  function natija(){
    if (natijaQoriq){ natijaQoriq.yoq(); natijaQoriq = null; }
    if (!ish || (ish.holat !== "bajarildi" && !(ish.holat === "bajarilmoqda" && yozadi))){ $("st-natija-k").hidden = true; return; }
    $("st-natija-k").hidden = false;
    if (ish.holat === "bajarilmoqda"){
      const batmi = /Batareya/.test(ish.tur);
      const bugunIso = iso(D.sanaYoz(D.bugun()));
      $("st-natija").innerHTML = '<form class="forma-tor" id="st-n" novalidate>' +
        '<div class="maydon"><label class="maydon-yorliq" for="y-s">Bajarilgan sana <b>*</b></label><div class="kirish"><input id="y-s" type="date" name="sana" required max="' + bugunIso + '" value="' + bugunIso + '"></div></div>' +
        '<div class="maydon"><label class="maydon-yorliq" for="y-n">Narx <b>*</b></label><div class="kirish"><input id="y-n" type="text" name="narx" data-format="pul" min="0" required data-xato="Narxni kiriting" placeholder="0,45"></div><span class="maydon-izoh">Bepul kafolat ishi uchun 0</span></div>' +
        '<div class="maydon"><label class="maydon-yorliq" for="y-h">Hisob-faktura raqami</label><div class="kirish"><input id="y-h" name="hisobFaktura" maxlength="30"></div></div>' +
        '<div class="maydon"><label class="maydon-yorliq" for="y-k">Keyingi xizmat <b>*</b></label><div class="kirish"><input id="y-k" type="date" name="keyingiXizmat" required data-dan="sana" value="' + iso(D.sanaYoz(D.oyQosh(D.bugun(), 6))) + '"></div></div>' +
        (batmi ? '<div class="maydon"><label class="maydon-yorliq" for="y-b">Yangi batareya zaryadi, %</label><div class="kirish"><input id="y-b" type="text" name="batareya" data-format="son" max="100" value="100"></div></div>' : "") +
        '<div class="maydon keng"><label class="maydon-yorliq" for="y-i">Natija <b>*</b></label><textarea class="kirish-matn" id="y-i" name="natija" rows="2" maxlength="300" required minlength="5" data-xato="Nima qilinganini yozing" placeholder="Nima qilindi, qurilma ishlayaptimi"></textarea></div></form>' +
        '<div class="amal-qator"><button type="button" class="tugma tugma-asosiy" id="st-yakun" data-yozadi data-tur="servis-yakunlash">' + ik("tasdiq") + "<span>Ishni yakunlash</span></button></div>";
      tarjimaQil($("st-natija"));
      natijaQoriq = MKB.formaQoriqla($("st-n"), {nom: "Servis natijasi"});
      $("st-yakun").addEventListener("click", yakunla);
      return;
    }
    const x = xarajati();
    $("st-natija").innerHTML = x.length ? x.map(r => '<div class="qator"><span class="belgi mint">' + ik("pul") + '</span><span class="matn"><b data-tarjimasiz>' + esc(r.id) + "</b><span>" +
      '<span>Ta\'mir va konservatsiya</span> · <span data-tarjimasiz>' + esc(r.sana || "") + '</span></span></span><span class="ong"><span class="pul" data-tarjimasiz>' + MKB.pul(r.summa) + "</span></span></div>").join("") +
      '<p class="kichik-izoh">Xarajat obyektning Xarajatlar tabida ham ko\'rinadi.</p>'
      : '<p class="kichik-izoh" style="margin-top:0">Bu ish uchun xarajat yozilmagan.</p>';
    tarjimaQil($("st-natija"));
  }
  async function yakunla(){
    const f = MKB.formaTekshir($("st-n"), {
      keyingiXizmat: (v, qq) => !(D.sanaOqi(v) <= D.sanaOqi(qq.sana)) || "Keyingi xizmat bajarilgan sanadan keyin bo'ladi",
    });
    if (!f) return;
    const v = f.qiymatlar;
    const narx = v.narx || 0, sana = D.sanaOqi(v.sana), kx = D.sanaOqi(v.keyingiXizmat);
    const bat = v.batareya === undefined || v.batareya === null || v.batareya === "" || !Number.isFinite(v.batareya) ? null : v.batareya;
    const r = await MKB.tasdiqla({
      sarlavha: "Servis ishini yakunlash",
      matn: narx > 0 ? "Ish bajarildi deb belgilanadi va narxi obyekt xarajatlariga \"to'lanmagan\" holatida yoziladi." : "Ish bajarildi deb belgilanadi. Narx 0: xarajat yozilmaydi.",
      tafsilot: [["Topshiriq", {matn: ish.id, tarjimasiz: true}], ["Ish turi", ish.tur], ["Qurilma", q ? {matn: (q.turNomi || "") + " · " + q.id, tarjimasiz: true} : "—"],
        ["Bajarilgan sana", {matn: v.sana, tarjimasiz: true}], ["Narx", MKB.pul(narx)], ["Keyingi xizmat", {matn: v.keyingiXizmat, tarjimasiz: true}]],
      oqibat: q && (q.holat === "xizmatda" || q.holat === "nosoz") ? ["Qurilma xizmatdan chiqadi, holati oxirgi signal bo'yicha tiklanadi"] : [],
      okMatn: "Ishni yakunlash", bekorMatn: "Orqaga",
      bajar: async () => {
        await MKBapi.yangilash("XIZMAT_ISHLARI", ish.id, {holat: "bajarildi", sana: v.sana, izoh: v.natija, narx});
        if (narx > 0){
          const davr = sana.getFullYear() + "-" + String(sana.getMonth() + 1).padStart(2, "0");
          const xid = await MKB.keyingiId("XARAJATLAR", "XJ-" + sana.getFullYear() + "/", 4);
          await MKBapi.yangi("XARAJATLAR", {id: xid, obyektId: ish.obyektId, toifa: "tamir", summa: narx, davr, sana: v.sana, kontragent: ish.usta || "",
            hisobFaktura: v.hisobFaktura || null, tasdiqlovchi: MKB.kim(), holat: "tolanmagan", izoh: "Servis ishi " + ish.id + ": " + ish.tur, manbaId: ish.id});
        }
        if (q){
          const patch = {keyingiXizmat: D.sanaYoz(kx)};
          if (bat != null) patch.batareya = bat;
          if (q.holat === "nosoz" || (q.holat === "xizmatda" && !boshqaIshBor())) patch.holat = signalHolati(q);
          await MKBapi.yangilash("QURILMALAR", q.id, patch);
        }
      },
    });
    if (!r) return;
    if (natijaQoriq) natijaQoriq.toza();
    MKB.toast(narx > 0 ? "Ish " + ish.id + " yakunlandi. Xarajat yozildi: " + MKB.pul(narx) : "Ish " + ish.id + " yakunlandi");
    chizHammasi();
  }
  function chizHammasi(){ if (ish) ish = (D.XIZMAT_ISHLARI || []).find(x => x.id === ish.id) || ish; if (q) q = D.qurilma(q.id) || q; shapka(); natija(); forma(); qurilmaKarta(); }
  chizHammasi();
  }
})();
</script>
