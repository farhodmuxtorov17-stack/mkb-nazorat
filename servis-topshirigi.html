<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Servis topshirig'i</title>

<body data-sahifa="kn">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="kirish-nazorati.html">Kirish nazorati</a><span class="ajratgich">/</span><span>Servis topshirig'i</span></div>
    <div class="hs-qator"><h1>Servis topshirig'i</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="kn-tor">
    <section class="karta">
      <div class="karta-bosh"><h2 id="sv-sarlavha">Tekshiruv vazifalari</h2><span class="soni" id="sv-holat"></span></div>
      <div id="sv-yarat-joy" hidden>
      <form id="sv-yarat" class="forma-tor">
        <div class="maydon keng"><label class="maydon-yorliq">Ish turi <b>*</b></label>
          <div class="kirish"><select name="tur"><option>Profilaktika</option><option>Nosozlikni bartaraf etish</option><option>Proshivkani yangilash</option><option>Batareyani almashtirish</option><option>Qayta sozlash</option></select></div></div>
        <div class="maydon"><label class="maydon-yorliq">Sana <b>*</b></label>
          <div class="kirish"><input type="date" name="sana"></div></div>
        <div class="maydon"><label class="maydon-yorliq">Texnik xodim <b>*</b></label>
          <div class="kirish"><select name="usta"></select></div></div>
        <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
          <button type="submit" class="tugma tugma-asosiy"><svg class="ic"><use href="#i-qoshish"/></svg>Topshiriqni yaratish</button></div>
      </form>
      </div>
      <div id="sv-ish">
      <div id="sv-royxat"></div>
      <div class="karta-bosh" style="margin-top:20px"><h2>Texnik xulosa</h2></div>
      <div class="maydon"><label class="maydon-yorliq">Bajarilgan ish tavsifi <b>*</b></label>
        <div class="kirish"><input id="sv-xulosa" placeholder="Nima qilindi va natija qanday"></div></div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button type="button" class="tugma tugma-asosiy" id="sv-yakun"><svg class="ic"><use href="#i-tasdiq"/></svg>Topshiriqni yakunlash</button>
        <button type="button" class="tugma tugma-oq" id="sv-qism"><svg class="ic"><use href="#i-qoshish"/></svg>Ehtiyot qism qo&#39;shish</button>
      </div>
      </div>
    </section>
    <section class="karta">
      <div class="karta-bosh"><h2>Topshiriq</h2></div>
<dl class="malumot-royxat">
  <dt><svg class="ic"><use href="#i-hujjat"/></svg>Raqam</dt>
  <dd id="sv-raqam">—</dd>
  <dt><svg class="ic"><use href="#i-qurilma"/></svg>Qurilma</dt>
  <dd><span id="sv-qurilma" class="">—</span></dd>
  <dt><svg class="ic"><use href="#i-bino"/></svg>Obyekt</dt>
  <dd id="sv-obyekt">—</dd>
  <dt><svg class="ic"><use href="#i-kalendar"/></svg>Sana</dt>
  <dd id="sv-sana">—</dd>
  <dt><svg class="ic"><use href="#i-foyd"/></svg>Texnik xodim</dt>
  <dd id="sv-usta">—</dd>
  <dt><svg class="ic"><use href="#i-xavf"/></svg>Muhimlik</dt>
  <dd id="sv-muhim">—</dd>
</dl>
      <div class="karta-bosh" style="margin-top:20px"><h2>Ehtiyot qismlar</h2></div>
      <div id="sv-qismlar"></div>
    </section>
  </div>
</main>
</div>
</div>

<script src="malumot-kirish.js?v=26091814"></script>
<script src="malumot-indeks.js?v=26091814"></script>
<script src="tarjima.js?v=26091814"></script>
<script src="yadro/ikonlar.js?v=26091814"></script>
<script src="yadro/daraxt.js?v=26091814"></script>

<script src="yadro/qollanma.js?v=26091814"></script>
<script src="yadro/api.js?v=26091814"></script>
<script src="yadro/app.js?v=26091814"></script>
<script>

const KN_NATIJA = {ruxsat: ["Ruxsat berildi", "chip-yashil"], rad: ["Rad etildi", "chip-xavf"],
                   ogohlantirish: ["Ogohlantirish", "chip-sariq"]};
const KN_HOLAT = {onlayn: ["Onlayn", "chip-yashil"], oflayn: ["Oflayn", "chip-xavf"],
                  xizmatda: ["Xizmatda", "chip-sariq"]};
const QR_HOLAT = {ishlayapti: ["Ishlayapti", "chip-yashil"], ogohlantirish: ["Ogohlantirish", "chip-sariq"],
                  nosoz: ["Nosoz", "chip-xavf"]};
function chip(xarita, kalit){
  const v = xarita[kalit] || [kalit, ""];
  return '<span class="chip ' + v[1] + '">' + v[0] + "</span>";
}
function nuqtaIkonka(t){
  return t === "turniket" ? "turniket" : t === "shlagbaum" ? "mashina" : t === "darvoza" ? "zavod" : "eshik";
}
function shaxsSurati(sh, olcham){
  const o = olcham || 38;
  return sh && sh.rasm
    ? '<img class="shaxs-surat" src="' + sh.rasm + '" alt="" loading="lazy" style="width:' + o +
      "px;height:" + o + 'px">'
    : '<span class="belgi">' + (sh ? sh.belgi : "?") + "</span>";
}
function shaxsQatori(sh, ong){
  if (!sh) return '<span class="matn"><b>Aniqlanmagan shaxs</b><span>Identifikatsiya o&#39;tmadi</span></span>';
  return shaxsSurati(sh) +
    '<span class="matn"><b>' + sh.ism + "</b><span><span>" + sh.lavozim + "</span> · <span>" + sh.tashkilot + "</span></span></span>" +
    (ong || "");
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? o.qisqa : id;
}
function voqeaQatori(v){
  const sh = MKB_DATA.shaxs(v.shaxsId);
  return '<a class="qator" href="kirish-voqea.html?id=' + encodeURIComponent(v.id) + '">' +
    '<span class="belgi ' + (v.natija === "rad" ? "pushti" : v.natija === "ogohlantirish" ? "lavanda" : "mint") + '">' +
      ik(v.natija === "ruxsat" ? "tasdiq" : v.natija === "rad" ? "rad" : "xavf") + "</span>" +
    '<span class="matn"><b>' + (sh ? sh.ism : v.operator || "Aniqlanmagan shaxs") + "</b>" +
    "<span>" + obyektNomi(v.obyektId) + " · " + v.nuqtaNomi + " · " + v.usul + "</span></span>" +
    '<span class="ong"><span class="vaqt">' + v.soat + "</span>" + chip(KN_NATIJA, v.natija) + "</span></a>";
}

/* ---------- saqlash yordamchilari (yozuv faqat MKBapi orqali) ---------- */
/* server rejimida kolleksiya xotiradagi nusxaga id bo'yicha qo'shib olinadi */
async function knYukla(nomlar){
  await MKBapi.tayyor;
  if (MKBapi.rejim() !== "server") return;
  for (const k of nomlar){
    try{
      const asl = MKB_DATA[k], r = await MKBapi.royxat(k);
      if (!Array.isArray(asl) || !Array.isArray(r)) continue;
      const ix = new Map(asl.map(x => [x.id, x]));
      r.forEach(x => { const b = ix.get(x.id); if (b) Object.assign(b, x); else asl.push(x); });
    }catch(_){ }
  }
}
async function knYangila(k, id, patch){
  await MKBapi.yangilash(k, id, patch);
  const b = (MKB_DATA[k] || []).find(x => x.id === id);
  if (b) Object.assign(b, patch);
  return b;
}
async function knYangi(k, obyekt){
  const j = await MKBapi.yangi(k, obyekt);
  const y = j && j.id ? j : obyekt;
  const a = MKB_DATA[k];
  if (Array.isArray(a) && !a.some(x => x.id === y.id)) a.push(y);
  return (Array.isArray(a) && a.find(x => x.id === y.id)) || y;
}
/* keyingi raqam: shu old qo'shimchali id'larning eng katta soni + 1 */
async function knKeyingiId(k, old, uzunlik){
  const r = await MKBapi.royxat(k);
  let maks = 0;
  r.forEach(x => {
    const s = String(x.id || ""), m = /(\d+)$/.exec(s);
    if (m && s.indexOf(old) === 0) maks = Math.max(maks, +m[1]);
  });
  return old + String(maks + 1).padStart(uzunlik || 0, "0");
}
async function knSaqla(ish){
  try{ await ish(); return true; }
  catch(_){ MKB.toast("Saqlab bo'lmadi, qayta urinib ko'ring", "xavf"); return false; }
}
function knKim(){ const s = MKBapi.sessiya(); return s && s.ism ? s.ism : "Operator"; }
function knSoat(){
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* "26.08.2026" + "14:05" -> saralash kaliti */
function knVaqtKalit(sana, soat){ return String(sana || "").split(".").reverse().join("") + (soat || ""); }

document.addEventListener("mkb:tayyor", async () => {
  const D = MKB_DATA;
  await knYukla(["XIZMAT_ISHLARI", "QURILMALAR"]);
  const p = new URLSearchParams(location.search);
  const qurilmaId = p.get("qurilma");
  const raqam = v => { const m = /(\d+)$/.exec(String(v.id)); return m ? +m[1] : 0; };
  let x = D.XIZMAT_ISHLARI.find(v => v.id === p.get("id"));
  /* qurilma bo'yicha faqat OCHIQ topshiriq ochiladi; bo'lmasa yaratish shakli */
  if (!x && qurilmaId)
    x = D.XIZMAT_ISHLARI.filter(v => v.qurilmaId === qurilmaId && v.holat !== "bajarildi")
      .sort((a, b) => raqam(b) - raqam(a))[0];
  const yangiQurilma = !x && qurilmaId ? D.QURILMALAR.find(v => v.id === qurilmaId) : null;
  if (!x && qurilmaId && !yangiQurilma){ location.replace("xato-404.html"); return; }
  if (!x && !yangiQurilma) x = D.XIZMAT_ISHLARI.find(v => v.holat !== "bajarildi") || D.XIZMAT_ISHLARI[0];
  if (!x && !yangiQurilma){ location.replace("xato-404.html"); return; }

  const q = yangiQurilma || D.QURILMALAR.find(v => v.id === x.qurilmaId) || {};
  document.getElementById("sv-qurilma").innerHTML =
    '<a href="qurilma.html?id=' + encodeURIComponent(q.id || x.qurilmaId) + '">' + (q.model || x.qurilmaId) + "</a>";
  document.getElementById("sv-obyekt").textContent = obyektNomi(q.obyektId || x.obyektId);
  document.getElementById("sv-muhim").innerHTML = q.holat === "nosoz"
    ? '<span class="chip chip-xavf">Yuqori</span>' : '<span class="chip chip-info">Odatiy</span>';

  /* ---------- yangi topshiriq shakli ---------- */
  if (yangiQurilma){
    document.getElementById("sv-ish").hidden = true;
    const shakl = document.getElementById("sv-yarat");
    document.getElementById("sv-yarat-joy").hidden = false;
    document.getElementById("sv-sarlavha").textContent = "Yangi topshiriq";
    document.getElementById("hs-meta").textContent = "yangi topshiriq";
    document.getElementById("sv-holat").innerHTML = '<span class="chip chip-info">yaratilmoqda</span>';
    document.getElementById("sv-qismlar").innerHTML = '<div class="bosh-holat">Ehtiyot qism ishlatilmagan</div>';
    shakl.elements.tur.value = q.holat === "nosoz" ? "Nosozlikni bartaraf etish" : "Profilaktika";
    shakl.elements.sana.value = D.KIRISH_BUGUN.split(".").reverse().join("-");
    shakl.elements.usta.innerHTML = '<option value="">Tanlang</option>' +
      D.SHAXSLAR.filter(s => s.tur === "pudratchi" && s.faol).map(s =>
        "<option>" + s.ism + "</option>").join("");
    let band = false;
    shakl.addEventListener("submit", e => {
      e.preventDefault();
      const f = MKB.forma(shakl, ["tur", "sana", "usta"]);
      if (!f){ MKB.toast("Majburiy maydonlarni to'ldiring", "xavf"); return; }
      if (band) return;
      band = true;
      knSaqla(async () => {
        const y = await knYangi("XIZMAT_ISHLARI", {
          id: await knKeyingiId("XIZMAT_ISHLARI", "XI-2026/"),
          qurilmaId: q.id, obyektId: q.obyektId, kirishNuqtaId: q.kirishNuqtaId,
          tur: f.tur, sana: f.sana.split("-").reverse().join("."), usta: f.usta,
          holat: "rejada", ehtiyotQismlar: [], izoh: "", yaratgan: knKim(),
        });
        MKB.toast("Topshiriq yaratildi: " + y.id);
        setTimeout(() => location.replace("servis-topshirigi.html?id=" + encodeURIComponent(y.id)), 700);
      }).then(ok => { if (!ok) band = false; });
    });
    tarjimaQil(document.querySelector("main"));
    return;
  }

  /* ---------- mavjud topshiriq ---------- */
  document.getElementById("hs-meta").textContent = x.id;
  document.getElementById("sv-raqam").textContent = x.id;
  document.getElementById("sv-sana").textContent = x.sana;
  document.getElementById("sv-usta").textContent = x.usta;

  const VAZIFA = [
    "Qurilmani tarmoqdan uzish va xavfsizlikni ta&#39;minlash",
    "Korpus va kabellarni ko&#39;zdan kechirish",
    "Diagnostika testini o&#39;tkazish",
    "Nosoz komponentni almashtirish yoki sozlash",
    "Qurilmani qayta ulash va sinovdan o&#39;tkazish",
    "Kirish nuqtasi ishlashini tekshirish",
  ];
  document.getElementById("sv-royxat").innerHTML = VAZIFA.map((v, i) =>
    '<label class="qator" style="cursor:pointer">' +
      '<input type="checkbox" data-v="' + i + '" style="width:20px;height:20px;accent-color:var(--brend)">' +
      '<span class="matn"><b>' + v + "</b></span></label>").join("");

  const xulosaEl = document.getElementById("sv-xulosa");
  function holatChiz(){
    const tayyor = x.holat === "bajarildi";
    document.getElementById("sv-holat").innerHTML =
      '<span class="chip ' + (tayyor ? "chip-yashil" : "chip-sariq") + '">' + x.holat + "</span>";
    document.querySelectorAll("[data-v]").forEach(v => { if (tayyor) v.checked = true; v.disabled = tayyor; });
    if (tayyor && x.izoh) xulosaEl.value = x.izoh;
    xulosaEl.disabled = tayyor;
    document.getElementById("sv-yakun").disabled = tayyor;
    document.getElementById("sv-qism").disabled = tayyor;
    tarjimaQil(document.getElementById("sv-holat"));
  }
  function qismChiz(){
    const qismlar = x.ehtiyotQismlar || [];
    const joy = document.getElementById("sv-qismlar");
    joy.innerHTML = qismlar.length
      ? qismlar.map(q2 => '<div class="qator"><span class="belgi">' + ik("qurilma") + "</span>" +
          '<span class="matn"><b>' + q2 + "</b><span>Ombordan yechildi</span></span></div>").join("")
      : '<div class="bosh-holat">Ehtiyot qism ishlatilmagan</div>';
    tarjimaQil(joy);
  }
  holatChiz();
  qismChiz();

  let band = false;
  document.getElementById("sv-qism").addEventListener("click", () => {
    MKB.modal("Ehtiyot qism qo'shish",
      '<div class="maydon"><label class="maydon-yorliq">Qism <b>*</b></label>' +
      '<div class="kirish"><select id="sv-yangi"><option>Magnit qulf plastinasi</option>' +
      "<option>Kartani o&#39;quvchi moduli</option><option>Quvvat bloki</option>" +
      "<option>Aloqa kabeli</option><option>Datchik batareyasi</option>" +
      "<option>Kamera obyektivi</option></select></div></div>",
      {okMatn: "Ombordan yechish", ok: pd => {
        const qism = pd.querySelector("#sv-yangi").value;
        knSaqla(async () => {
          await knYangila("XIZMAT_ISHLARI", x.id, {ehtiyotQismlar: (x.ehtiyotQismlar || []).concat(qism)});
          qismChiz();
          MKB.toast("Ehtiyot qism topshiriqqa biriktirildi");
        });
      }});
  });

  document.getElementById("sv-yakun").addEventListener("click", () => {
    const bajarilgan = [...document.querySelectorAll("[data-v]")].filter(v => v.checked).length;
    if (bajarilgan < VAZIFA.length){ MKB.toast("Barcha tekshiruv bandlari bajarilishi shart", "xavf"); return; }
    const xulosa = xulosaEl.value.trim();
    if (!xulosa){
      MKB.toast("Texnik xulosasiz topshiriq yopilmaydi", "xavf"); xulosaEl.focus(); return;
    }
    if (band) return;
    band = true;
    knSaqla(async () => {
      await knYangila("XIZMAT_ISHLARI", x.id, {holat: "bajarildi", izoh: xulosa,
        yakunlagan: knKim(), yakunVaqti: D.KIRISH_BUGUN + " " + knSoat()});
      /* servisdan keyin qurilma ish holatiga qaytadi */
      if (q.id && q.holat !== "ishlayapti")
        await knYangila("QURILMALAR", q.id, {holat: "ishlayapti", oxirgiAloqa: "bugun " + knSoat()});
      holatChiz();
      MKB.toast("Topshiriq yakunlandi va xarajat obyektga bog'landi");
    }).then(() => { band = false; });
  });
});
</script>
