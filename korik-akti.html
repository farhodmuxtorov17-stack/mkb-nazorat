    <div class="hs-yorliq"><a href="korik-rejasi.html">Ko'rik nazorati</a><span class="ajratgich">/</span><span>Dalolatnoma</span></div>
    <div class="hs-qator"><h1>Ko'rik dalolatnomasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:820px"><div class="karta-bosh"><h2>Ko'rik dalolatnomasi</h2><span class="soni kod-mono" id="ka-id"></span><div style="margin-left:auto;display:flex;gap:8px"><a class="tugma tugma-kichik tugma-oq" id="ka-otkazish" href="#"><svg class="ic"><use href="#i-tahrir"/></svg>O'tkazish</a><a class="tugma tugma-kichik tugma-asosiy" id="ka-chop" href="#"><svg class="ic"><use href="#i-chop"/></svg>Chop shakli</a></div></div><div id="ka-obyekt" style="margin-bottom:14px"></div><dl class="malumot-royxat">
  <dt><svg class="ic"><use href="#i-korik"/></svg>Ko'rik turi</dt>

<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const k = id ? await MKBapi.bitta("KORIKLAR", id) : null;
  if (!k){ location.replace("xato-404.html"); return; }
  const y = MKB_DATA.OBYEKT_INDEKS[k.obyektId] || {};
  document.getElementById("hs-meta").textContent = k.id;
  document.getElementById("ka-id").textContent = k.id;
  document.getElementById("ka-otkazish").href = "korik-otkazish.html?id=" + encodeURIComponent(k.id);
  document.getElementById("ka-chop").href = "korik-akti-chop.html?id=" + encodeURIComponent(k.id);
  document.getElementById("ka-obyekt").innerHTML =
    '<a href="obyekt.html?id=' + encodeURIComponent(k.obyektId) + '" style="display:flex;gap:12px;align-items:center">' +
    '<img class="foto" src="' + (y.rasmKichik || y.rasm || "") + '" style="width:86px;height:60px;border-radius:14px;object-fit:cover" alt="">' +
    '<span><b style="display:block;font-size:14px">' + (y.qisqa || k.obyektId) + '</b>' +
    '<span style="font-size:12.5px;color:var(--matn-3)">' + k.obyektId + '</span></span></a>';
  document.getElementById("ka-tur").textContent = k.tur || "Rejali";
  document.getElementById("ka-sana").textContent = k.sana + (k.otkazilganSana ? " · o'tkazildi: " + k.otkazilganSana : "");
  document.getElementById("ka-inspektor").textContent = k.inspektor;
  document.getElementById("ka-holat").innerHTML = k.holat === "rejada"
    ? '<span class="chip chip-brend">Rejada</span>'
    : k.holat === "kechikkan" ? '<span class="chip chip-xavf">Kechikkan</span>'
    : '<span class="chip chip-yashil">O\'tkazildi</span>';
  document.getElementById("ka-baho").textContent = k.baho || "—";
  document.getElementById("ka-xulosa").textContent = k.izoh || "—";
});
</script>

</html>
