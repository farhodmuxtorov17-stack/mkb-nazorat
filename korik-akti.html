<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko'rik dalolatnomasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<link rel="stylesheet" href="yadro/dalolatnoma.css?v=26092200">
<style>
#ka-akt > .skelet-royxat{background:var(--oq);border-radius:var(--r-karta);padding:24px;box-shadow:var(--soya);max-width:880px;margin:0 auto;width:100%}
#ka-akt > .karta{max-width:880px;margin:0 auto;width:100%}
</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="korik-tarixi.html">Ko'riklar tarixi</a><span class="ajratgich">/</span><span>Dalolatnoma</span></div>
    <div class="hs-qator"><h1>Ko'rik dalolatnomasi</h1><span class="hs-meta" id="hs-meta" data-tarjimasiz>—</span>
      <div class="hs-amallar" id="ka-amallar"></div></div>
  </div>
  <div id="ka-xabar" class="chop-yashir"></div>
  <div id="ka-akt" data-sayohat="akt"><div class="skelet-royxat" aria-busy="true"></div></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script src="yadro/dalolatnoma.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, H = window.MKB_HUJJAT;
  MKB.sahifaYukla({joylar: {"ka-akt": ["qator", 6]}, xato: "Dalolatnomani yuklab bo'lmadi", ish: async () => {
  await MKB.kolYukla(["KORIKLAR", "FAYLLAR"]);
  const url = new URLSearchParams(location.search);
  const akt = document.getElementById("ka-akt");
  const id = url.get("id");
  const k = id ? (D.KORIKLAR || []).find(x => x.id === id) || await MKBapi.bitta("KORIKLAR", id) : null;
  if (!k || !MKB.doira([k]).length){
    akt.innerHTML = '<section class="karta">' + MKB.boshHolat("korik", "Ko'rik topilmadi", "Ko'rikni reja yoki tarixdan tanlang",
      '<a class="tugma tugma-asosiy" href="korik-tarixi.html" style="margin-top:12px">Ko\'riklar tarixi</a>') + "</section>";
    tarjimaQil(akt); return;
  }
  const y = D.topish(k.obyektId) || D.OBYEKT_INDEKS[k.obyektId] || {id: k.obyektId};
  const bugun = (() => { const b = D.bugun(); return new Date(b.getFullYear(), b.getMonth(), b.getDate()); })();
  const BAHO = {5: "A'lo", 4: "Yaxshi", 3: "Qoniqarli", 2: "Nuqsonli", 1: "Avariya holati"};
  const NATIJA = {joyida: ["Joyida", "yashil"], kamchilik: ["Kamchilik", "xavf"], tekshirilmadi: ["Tekshirilmadi", "kul"],
    "qayd etildi": ["Qayd etildi", "yashil"], kiritilmadi: ["Kiritilmadi", "kul"]};
  const natijaBelgi = n => { const v = NATIJA[n] || [n || "—", "kul"]; return {html: '<span class="dn-belgi ' + v[1] + '">' + esc(v[0]) + "</span>"}; };
  const otkazildi = k.holat === "otkazildi";
  const kechikkan = !otkazildi && (k.holat === "kechikkan" || D.sanaOqi(k.sana) < bugun);
  const turi = k.korikTuri || k.tur || "Rejali";
  const yoza = MKB.huquq("korik", "yoz");
  document.getElementById("hs-meta").textContent = k.id;
  document.title = "MKB — Ko'rik dalolatnomasi " + k.id;

  const amallar = document.getElementById("ka-amallar");
  if (otkazildi){
    amallar.innerHTML = '<button type="button" class="tugma tugma-asosiy" id="ka-chop" data-sayohat="chop">' + ik("chop") + "<span>Chop etish</span></button>";
    document.getElementById("ka-chop").addEventListener("click", () => window.print());
  } else if (yoza){
    amallar.innerHTML = '<a class="tugma tugma-oq" href="korik-tayinlash.html?id=' + encodeURIComponent(k.id) + '">Qayta tayinlash</a>' +
      '<a class="tugma tugma-asosiy" data-sayohat="otkazish" href="korik-otkazish.html?id=' + encodeURIComponent(k.id) + '">' + ik("korik") + "<span>Ko'rikni o'tkazish</span></a>";
  }

  if (!otkazildi){
    akt.innerHTML = '<section class="karta">' + MKB.boshHolat(kechikkan ? "ogoh" : "kalendar", kechikkan ? "Ko'rik kechikkan" : "Ko'rik hali o'tkazilmagan",
        kechikkan ? "Reja sanasi o'tgan. Ko'rikni o'tkazing yoki yangi sanaga ko'chiring." : "Dalolatnoma ko'rik o'tkazilgandan keyin shakllanadi.",
        yoza ? '<a class="tugma tugma-asosiy" style="margin-top:12px" href="korik-otkazish.html?id=' + encodeURIComponent(k.id) + '">Ko\'rikni o\'tkazish</a>' : "") +
      (k.izoh ? '<p class="maydon-izoh" style="text-align:center"><span>Topshiriq:</span> ' + esc(k.izoh) + "</p>" : "") + "</section>";
    tarjimaQil(document.querySelector(".kontent"));
    return;
  }

  const cl = k.chekList || [];
  const bandlar = cl.filter(c => !c.tur);
  const hisob = cl.filter(c => c.tur === "hisoblagich");
  const gps = cl.find(c => c.tur === "gps");
  const muhrlar = gps && Array.isArray(gps.suratlar) ? gps.suratlar : [];
  const kamSoni = bandlar.filter(c => c.natija === "kamchilik").length;
  const fayllar = (await MKBapi.fayl.royxat({yozuvId: k.id})).filter(f => /^image\//.test(f.tur || ""));
  /* Surat qoidasi ko'rik o'tkazish sahifasidagi bilan bir xil: tur me'yori, har kamchilikka bittadan,
     nuqsonli yoki avariya bahosida va sotuv oldi ko'rigida kamida bitta */
  const turMeyori = Number(D.param(y.turKalit && !D.binolimi(y) ? "korikSuratTransport" : "korikSuratBino")) || 0;
  /* Qoida kuchga kirgan sana (PARAMETRLAR.suratQoidasiSana): undan oldin yopilgan ko'rik qoralama bo'lmaydi,
     varaqda esa suratsiz yopilgani ochiq yoziladi. Parametr bo'lmasa qoida barcha ko'riklarga qo'llanadi */
  const qoidaSana = D.param("suratQoidasiSana") ? D.sanaOqi(D.param("suratQoidasiSana")) : null;
  const qoidadanOldin = !!(qoidaSana && D.sanaOqi(k.sana) && D.sanaOqi(k.sana) < qoidaSana);
  const kerak = qoidadanOldin ? 0 : Math.max(turMeyori, kamSoni, k.holatBall && k.holatBall <= 2 ? 1 : 0, turi === "Sotuv oldi" ? 1 : 0);
  const qoida = qoidadanOldin ? null : H.suratQoidasi(fayllar.length, kerak);
  /* Mas'ul xodimning hisobi bloklangan bo'lsa, imzo qatori qo'lda to'ldiriladi */
  const faolXodim = ism => { const f = (D.FOYDLAR || []).find(x => x.nom === ism); return ism && (!f || f.faol !== false) ? ism : ""; };
  const joyMatn = g => ({html: '<span data-tarjimasiz>' + g.lat + ", " + g.lng + " (±" + g.aniqlik + " m)</span>" +
    (g.masofa != null ? " · <span>reyestrdagi nuqtagacha</span> <span data-tarjimasiz>" + H.masofaMatn(g.masofa) + "</span>" : "")});

  const fotolar = [];
  for (const f of fayllar){
    const src = f.yol && !/^fayllar\//.test(f.yol) ? f.yol : await MKBapi.fayl.url(f.id);
    const mh = muhrlar.find(x => x.faylId === f.id);
    fotolar.push({id: f.id, src: src || null, alt: f.nom || "", izoh: {t: "Ko'rik surati"},
      muhr: mh ? [mh.suratVaqti || mh.vaqt, mh.masofa != null ? H.masofaMatn(mh.masofa) : null].filter(Boolean).join(" · ") : (f.yuklangan || "")});
  }

  const model = {
    tur: "korik", sarlavha: "Ko'rik dalolatnomasi", raqam: k.id, sana: k.sana, vaqt: gps && gps.vaqt ? String(gps.vaqt).split(" ")[1] : null,
    joy: y.hududToliq || y.hudud || "", filial: y.filial || "", obyekt: {id: k.obyektId, nom: y.qisqa || y.nom || k.obyektId},
    havola: "korik-akti.html?id=" + encodeURIComponent(k.id),
    bolimlar: [
      {sarlavha: "Obyekt va ko'rik", kv: [
        ["Obyekt turi", y.tur ? {t: y.tur} : null], ["Ko'rik turi", {t: turi}],
        ["Manzil", y.manzil || null, {keng: true}],
        ["Inspektor", k.inspektor || null], ["Obyekt uchun mas'ul", y.masul || null],
        ["Joylashuv", gps && gps.lat != null ? joyMatn(gps) : {t: "Qayd etilmagan"}, {keng: true}],
      ]},
      {sarlavha: "Nazorat bandlari", jadval: {ustunlar: ["№", "Band", "Natija", "Izoh"], kenglik: ["7%", "", "17%", "34%"],
        qatorlar: bandlar.map((c, i) => Object.assign([String(i + 1), {t: c.band}, natijaBelgi(c.natija), c.izoh ? {t: c.izoh} : ""], {sinf: c.natija === "kamchilik" ? "kam" : ""})),
        bosh: "Bandlar qayd etilmagan"}},
      hisob.length ? {sarlavha: "Hisoblagich va ko'rsatkichlar", jadval: {ustunlar: ["Hisoblagich", "Oldingi", "Joriy", "Plomba"], son: [1, 2],
        qatorlar: hisob.map(c => [{t: c.band}, c.avvalgi != null ? MKB.fmt(c.avvalgi) : "—", c.korsatkich != null ? MKB.fmt(c.korsatkich) : (c.qiymat || "—"),
          c.plomba === false ? {html: '<span class="dn-belgi xavf">Buzilgan</span>'} : c.plomba ? {t: "Butun"} : "—"])}} : null,
      {sarlavha: "Baho va keyingi qadam", kv: [
        ["Umumiy holat bahosi", k.holatBall ? {html: '<span data-tarjimasiz>' + k.holatBall + " / 5</span> · <span>" + esc(BAHO[k.holatBall]) + "</span>"} : {t: "Baho qo'yilmagan"}],
        ["Kamchilikli bandlar", kamSoni + " / " + bandlar.length],
        ["Ta'mir xarajati taklifi", k.xarajatTaklifi != null ? MKB.pul(k.xarajatTaklifi) : {t: "Yo'q"}],
        ["Keyingi ko'rik", k.keyingiKorikSana || null],
      ]},
      {sarlavha: "Xulosa", matn: {t: k.xulosa || "—"}},
      k.kamchiliklar ? {sarlavha: "Aniqlangan kamchiliklar", matn: {t: k.kamchiliklar}} : null,
    ],
    fotolar, fotoKerak: kerak,
    fotoBosh: qoidadanOldin ? "Surat biriktirilmagan: ko'rik surat qoidasi kuchga kirishidan oldin yopilgan." : "Surat biriktirilmagan",
    komissiya: [{rol: "Inspektor", ism: k.inspektor || ""}, {rol: "Obyekt uchun mas'ul", ism: faolXodim(y.masul)}, {rol: "Tasdiqladi", ism: ""}],
    qoralama: qoida ? qoida.matn : null,
  };
  MKB.dalolatnoma.chiz(akt, model);

  /* Ko'rik yakunlandi: natija va inspektorning bugungi marshrutidagi keyingi obyekt */
  if (url.get("yakunlandi")){
    const h = url.get("hodisa");
    const qolgan = MKB.doira(D.KORIKLAR || []).filter(x => x.id !== k.id && x.holat !== "otkazildi" && x.inspektor && x.inspektor === k.inspektor &&
      D.sanaOqi(x.sana) && D.sanaOqi(x.sana) <= bugun);
    const nuqta = x => { const o = D.topish(x.obyektId) || {}; return Object.assign({korik: x, obyekt: o}, o.joy && o.joy.lat != null ? {lat: o.joy.lat, lng: o.joy.lng, aniq: o.joy.aniq !== false} : {}); };
    const m = H.marshrut(qolgan.map(nuqta), y.joy && y.joy.lat != null ? {lat: y.joy.lat, lng: y.joy.lng, aniq: y.joy.aniq !== false} : null);
    const keyingi = m[0];
    document.getElementById("ka-xabar").innerHTML = '<section class="karta" style="background:var(--brend-fon)"><div class="qator" style="margin:-10px -16px">' +
      '<span class="belgi mint">' + ik("tasdiq") + '</span><span class="matn"><b>Ko\'rik yakunlandi, dalolatnoma saqlandi</b><span>' +
      (k.keyingiKorikSana ? "<span>Keyingi ko'rik rejaga qo'shildi:</span> <span data-tarjimasiz>" + esc(k.keyingiKorikSana) + "</span>" : "") +
      (h ? " · <span>Hodisa qayd etildi</span>" : "") +
      (keyingi ? "<br><span>Bugungi marshrutda qolgan ko'riklar:</span> <b data-tarjimasiz>" + m.length + "</b>. <span>Keyingisi:</span> " +
        '<span data-tarjimasiz>' + esc(keyingi.nuqta.obyekt.qisqa || keyingi.nuqta.obyekt.nom || keyingi.nuqta.korik.obyektId) +
        (keyingi.masofa != null ? ", " + H.masofaMatn(keyingi.masofa, keyingi.taxminiy) : "") + "</span>" : "") + "</span></span>" +
      '<span class="ong">' + (h ? '<a class="tugma tugma-kichik tugma-oq" href="hodisa.html?id=' + encodeURIComponent(h) + '">Hodisani ochish</a>' : "") +
        (keyingi && yoza ? '<a class="tugma tugma-kichik tugma-asosiy" href="korik-otkazish.html?id=' + encodeURIComponent(keyingi.nuqta.korik.id) + '">' + ik("korik") + "<span>Keyingi ko'rik</span></a>" : "") +
      "</span></div></section>";
    tarjimaQil(document.getElementById("ka-xabar"));
    /* Asosiy amal bitta: marshrutda keyingi ko'rik bo'lsa, chop etish ikkinchi darajali */
    const ch = document.getElementById("ka-chop");
    if (ch && keyingi && yoza) ch.className = "tugma tugma-oq";
  }
  tarjimaQil(document.querySelector(".hujjat-shapka"));
  }});
})();
</script>
</body>
</html>
