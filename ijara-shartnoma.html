<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ijara shartnomasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="savdo.html">Realizatsiya</a><span class="ajratgich">/</span><span>Ijara shartnomasi</span></div>
    <div class="hs-qator"><h1>Ijara shartnomasi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Ijara shartnomasi</h2><span class="soni kod-mono" id="ijs-id"></span></div><div id="ijs-obyekt" style="margin-bottom:14px"></div><dl class="malumot-royxat">
  <dt><svg class="ic"><use href="#i-foyd"/></svg>Ijarachi</dt>
  <dd id="ijs-ijarachi">—</dd>
  <dt><svg class="ic"><use href="#i-pul"/></svg>Oylik to'lov</dt>
  <dd><span id="ijs-oylik" class="pul">—</span></dd>
  <dt><svg class="ic"><use href="#i-kalendar"/></svg>Muddat</dt>
  <dd id="ijs-muddat">—</dd>
  <dt><svg class="ic"><use href="#i-grafik"/></svg>To'lovlar</dt>
  <dd id="ijs-tolov">—</dd>
  <dt><svg class="ic"><use href="#i-tasdiq"/></svg>Holat</dt>
  <dd id="ijs-holat">—</dd>
</dl>  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px"><button type="button" class="tugma tugma-oq" id="ijs-tolov-qabul"><svg class="ic"><use href="#i-pul"/></svg>To'lov qabul qilish</button><button type="button" class="tugma tugma-asosiy" onclick="window.print()"><svg class="ic"><use href="#i-chop"/></svg>Chop etish</button></div>  </section>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  let x = id ? await MKBapi.bitta("IJARA", id) : null;
  if (!x){ location.replace("ijara.html"); return; }
  const y = MKB_DATA.OBYEKT_INDEKS[x.obyektId] || {};
  function chiz(){
    document.getElementById("hs-meta").textContent = x.id;
    document.getElementById("ijs-id").textContent = x.id;
    document.getElementById("ijs-obyekt").innerHTML =
      '<a href="obyekt.html?id=' + encodeURIComponent(x.obyektId) + '" style="display:flex;gap:12px;align-items:center">' +
      '<img class="foto" src="' + (y.rasmKichik || y.rasm || "") + '" style="width:86px;height:60px;border-radius:10px;object-fit:cover" alt="">' +
      '<span><b style="display:block;font-size:14px">' + x.obyekt + '</b>' +
      '<span style="font-size:11.5px;color:var(--iz)">' + x.obyektId + ' · ' + x.hudud + '</span></span></a>';
    document.getElementById("ijs-ijarachi").textContent = x.ijarachi;
    document.getElementById("ijs-oylik").textContent = String(x.oylik).replace(".", ",") + " mln so'm";
    document.getElementById("ijs-muddat").textContent = x.boshlanish + " — " + x.tugash;
    document.getElementById("ijs-tolov").textContent = x.tolangan + " / " + x.jami + " oy to'langan";
    document.getElementById("ijs-holat").innerHTML = x.holat === "amalda"
      ? '<span class="chip chip-yashil">Amalda</span>' : '<span class="chip chip-xavf">Kechikkan</span>';
  }
  chiz();
  document.getElementById("ijs-tolov-qabul").addEventListener("click", async () => {
    x = await MKBapi.yangilash("IJARA", x.id, {tolangan: Math.min(x.tolangan + 1, x.jami), holat: "amalda"});
    x = await MKBapi.bitta("IJARA", id);
    chiz();
    MKB.toast("Oylik to'lov qabul qilindi");
  });
});
</script>
</body>
</html>
