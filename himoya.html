<!doctype html>
<html lang="uz">
<head>

<title>MKB — Monitoring markazi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.lenta-sana{font-size:12.5px;color:var(--matn-3);padding:14px 0 4px;letter-spacing:.01em}
.lenta-sana:first-child{padding-top:0}
.lenta-filtr{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lenta-filtr .pill{height:38px;padding:0 14px;font-size:13px}
.lenta-ichki > .qator:first-child{box-shadow:inset 0 1px 0 var(--chiziq-2)}
.yigma-havola{padding:12px 0 2px}
@media (max-width:720px){.qator:has([data-yigma]) > .ong{flex:none;padding-left:0;margin-left:auto}}
.metrika-qator button.metrika{text-align:left;font:inherit;cursor:pointer}
.metrika-qator :is(a,button).metrika{transition:transform var(--tez),box-shadow var(--tez)}
.metrika-qator :is(a,button).metrika:hover{transform:translateY(-2px);box-shadow:var(--soya-suzuvchi)}
.metrika-qator .metrika.tanlangan{box-shadow:0 0 0 2px var(--siyoh),var(--soya)}

/* Kamera kartasi: kadr maydoni, holat chiplari va operator amallari */
#mm-kartalar{margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.mm-kadr{min-height:0;padding:14px 14px 0}
.mm-kadr img,.mm-kadr .surat-yoq{aspect-ratio:16/10;border-radius:16px}
.mm-kadr:has(> .kadr-qora){background:var(--qora-yuza);padding:14px}
.mm-kadr:has(> .kadr-och){background:var(--plitka);padding:14px}
.mm-kadr .beyj-qator{position:absolute;left:24px;top:24px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 48px)}
.mm-kadr:has(> .kadr-yoq) .beyj-qator{left:24px;top:24px}
.kadr-belgi{position:absolute;z-index:2;bottom:12px;display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;
  border-radius:var(--r-pilyula);background:var(--parda-belgi);color:var(--oq);font-size:11.5px;line-height:1;backdrop-filter:blur(6px)}
.kadr-belgi .ic{width:14px;height:14px}
.kadr-yorliq{left:24px}
/* Surat muallifi va litsenziyasi kadr ostida: ochiq litsenziya shuni talab qiladi */
.mm-manba{margin:10px 20px 0;font-size:12px;line-height:1.45;color:var(--matn-3)}
.obyekt-karta:has(> .mm-manba) .obyekt-tana{padding-top:10px}
.kadr-yoq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;width:100%;
  aspect-ratio:16/10;border-radius:16px;font-size:12.5px;line-height:1.5;padding:16px}
.kadr-qora{background:var(--qora-yuza);color:var(--qora-matn-2)}
.kadr-qora b{color:var(--oq)}
.kadr-och{background:var(--band);color:var(--matn-3)}
.kadr-och b{color:var(--matn-2)}
.kadr-yoq .ic{width:28px;height:28px}
.kadr-yoq b{font-size:14px;font-weight:500}
.kadr-yoq span{max-width:280px}
.mm-chiplar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mm-amallar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mm-past{margin-top:12px;gap:14px;flex-wrap:wrap}
.mm-tahlil{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:16px 20px;margin-top:20px;
  border-radius:var(--r-plitka);background:var(--plitka);font-size:13px;color:var(--matn-3);line-height:1.6}
.mm-tahlil b{color:var(--matn-2)}
.mm-tahlil a{display:inline-flex;align-items:center;gap:6px}
#mm-jadval.karta-rejim .jadval-orash,#mm-jadval.karta-rejim .jadval-past{display:none}
#mm-jadval.karta-rejim .jadval-korpus{padding-bottom:6px}
.mm-sahifa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--matn-3);padding:14px 2px 0}
.mm-tanlov select{max-width:230px}
.smeta-izoh{font-size:12.5px;color:var(--matn-3);margin-top:14px;line-height:1.6}
</style>
</head>

<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  const KOLLAR = ["QURILMALAR", "XAVFSIZLIK_HODISALARI", "HODISALAR", "KIRISH_VOQEALARI", "QORIQLASH", "MASOFAVIY_SESSIYALAR"];
  let ulandi = false;
  MKB.sahifaYukla({
    joylar: {"hm-metrika": ["karta", 4], "mm-jadval": ["jadval", 6], "hm-lenta": ["qator", 6], "hm-mk": ["qator", 3]},
    xato: "Monitoring ma'lumotini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(KOLLAR);
      ulandi = true;
      boshla();
    },
  });

  function boshla(){
  const obNomi = id => MKB.kn.obyektNomi(id);
  const qh = q => D.qurilmaHolati(q) || {};
  /* Namoyish ma'lumotida obyekt surati oxirgi kadr o'rnida "namuna kadr" sifatida ko'rsatiladi.
     Mahalliy reyestrda bunday almashtirish yo'q: video tizim ulanmagani ochiq yoziladi. */
  const namoyish = D.MANBA !== "mahalliy";
  const HOLAT_NOM = {ochiq: ["Yangi", "chip-xavf"], tekshiruvda: ["Tekshiruvda", "chip-sariq"], bartaraf: ["Bartaraf etilmoqda", "chip-info"], hal: ["Hal qilindi", "chip-yashil"], yopildi: ["Yopildi", "chip-kul"]};
  const GH_HOLAT = {yangi: "ochiq", tekshirilmoqda: "tekshiruvda", tekshiruvda: "tekshiruvda", bartaraf: "bartaraf", hal: "hal", yopildi: "yopildi"};
  const KAMERA = "kamera-4G";
  const H_ALOQADA = "Aloqada", H_ALOQASIZ = "Aloqasiz", H_KAMERASIZ = "Kamera yo'q";
  let H = null, lentaTur = "";

  /* ---------- Yagona ta'riflar (hodisalar.html va qoriqlash.html bilan bir xil) ---------- */
  function hisobla(){
    const obyektlar = MKB.doira(D.YOZUVLAR).filter(y => y.holat !== "Chiqarildi");
    const qurilmalar = MKB.doira(D.QURILMALAR || []);
    const qOb = {};
    qurilmalar.forEach(q => { (qOb[q.obyektId] = qOb[q.obyektId] || []).push(q); });
    const qurilmali = new Set(Object.keys(qOb));
    const shartnomali = new Set(MKB.doira(D.QORIQLASH || []).filter(q => q.holat === "amalda" && !(D.sanaOqi(q.tugash) && D.sanaOqi(q.tugash) < D.bugun())).map(q => q.obyektId));
    const qoriqlanadimi = y => !!(y.himoya && y.himoya.qoriqlashTuri) || shartnomali.has(y.id) || qurilmali.has(y.id);
    /* Ochiq hodisa: yangi, tekshiruvda yoki bartaraf etilmoqda */
    const ochiqXH = MKB.doira(D.XAVFSIZLIK_HODISALARI || []).filter(h => ["ochiq", "tekshiruvda", "bartaraf"].includes(h.holat));
    const ochiqGH = MKB.doira(D.HODISALAR || []).filter(h => ["yangi", "tekshirilmoqda", "tekshiruvda", "bartaraf"].includes(h.ustun));
    const ochiqOb = {};
    ochiqXH.concat(ochiqGH).forEach(h => { ochiqOb[h.obyektId] = (ochiqOb[h.obyektId] || 0) + 1; });
    const kameralar = qurilmalar.filter(q => q.tur === KAMERA);
    const signalKalit = m => { const [s, t] = String(m || "").split(" "); return MKB.kn.vaqtKalit(s, t || ""); };
    const oxirgiSignal = qurilmalar.filter(q => D.sanaOqi(q.oxirgiSignal)).map(q => ({m: q.oxirgiSignal, k: signalKalit(q.oxirgiSignal)}))
      .sort((a, b) => b.k.localeCompare(a.k))[0];
    return {obyektlar, qurilmalar, qOb, qurilmali, kameralar, ochiqOb, qoriqlanadimi,
      ochiqSoni: ochiqXH.length + ochiqGH.length, oxirgiSignal: oxirgiSignal ? oxirgiSignal.m : null,
      uzoq: qurilmalar.filter(q => qh(q).uzoqOflayn || q.holat === "nosoz"),
      batPast: qurilmalar.filter(q => qh(q).batareyaPast),
      qoriqlanmagan: obyektlar.filter(y => !qoriqlanadimi(y))};
  }

  /* ---------- Kamera kartalari uchun qatorlar ----------
     Bitta qator = qurilmasi bor bitta obyekt. Kamera bo'lsa kadr maydoni, bo'lmasa sababi yoziladi. */
  const soatMatn = s => s == null ? "—" : s >= 48 ? Math.floor(s / 24) + " kun" : s + " soat";
  function qatorlarniYasa(){
    return H.obyektlar.filter(y => (H.qOb[y.id] || []).length).map(y => {
      const qs = H.qOb[y.id];
      const kams = qs.filter(q => q.tur === KAMERA);
      /* Asosiy kamera: eng kam jim turgani (aloqadagisi birinchi) */
      const kam = kams.slice().sort((a, b) => (qh(a).oflaynSoat == null ? 1e6 : qh(a).oflaynSoat) - (qh(b).oflaynSoat == null ? 1e6 : qh(b).oflaynSoat))[0] || null;
      const kmh = kam ? qh(kam) : {};
      const jim = !!kam && (kam.holat === "nosoz" || kmh.holat !== "onlayn");
      const holat = !kam ? H_KAMERASIZ : jim ? H_ALOQASIZ : H_ALOQADA;
      const bat = qs.map(q => q.batareya).filter(v => v != null);
      const batMin = bat.length ? Math.min.apply(null, bat) : -1;
      /* Kadr ustidagi belgi kameraning o'z quvvatini ko'rsatadi; obyektdagi eng past
         batareya boshqa qurilmaniki bo'lishi mumkin, shuning uchun alohida saqlanadi */
      const kamBat = kam && kam.batareya != null ? kam.batareya : -1;
      const ochiq = H.ochiqOb[y.id] || 0;
      const qulf = qs.find(q => q.tur === "aqlli-qulf" || q.tur === "faceid-terminal") || null;
      const turlari = [...new Set(qs.map(q => q.turNomi || q.tur))];
      /* E'tibor tartibi: aloqasiz kamera, past batareya, ochiq hodisa, qolgani. Kamerasiz obyekt oxirida:
         bu yerda kuzatiladigan kadr yo'q, u qurilma o'rnatish ishi */
      const daraja = holat === H_KAMERASIZ ? 4 : jim ? 0 : batMin >= 0 && batMin < 20 ? 1 : ochiq ? 2 : 3;
      return {id: y.id, y, nom: y.qisqa || y.nom || y.id, hudud: y.hudud || "Kiritilmagan", tur: y.tur || "",
        kam, kamNomi: kam ? (kam.turNomi || kam.tur) : "", kamSoni: kams.length,
        model: kam ? [kam.ishlabChiqaruvchi, kam.model].filter(Boolean).join(" ") : "",
        holat, jim, soat: kam ? kmh.oflaynSoat : null, signal: kam ? (kam.oxirgiSignal || "") : "",
        batareya: batMin, batPast: batMin >= 0 && batMin < 20, kamBat, kamBatPast: kamBat >= 0 && kamBat < 20,
        surat: !!(kam && !jim && (y.rasm || y.rasmKichik)), ochiq, qulf, qurilmaSoni: qs.length, turlari, daraja,
        izlash: [y.id, y.nom, y.qisqa, y.hudud, y.manzil, kam ? kam.id : "", kam ? kam.model : ""].filter(Boolean).join(" ").toLowerCase()};
    }).sort((a, b) => a.daraja - b.daraja || (b.soat || 0) - (a.soat || 0) || String(a.nom).localeCompare(String(b.nom)));
  }

  /* ---------- Ko'rsatkichlar: faqat monitoringga tegishlilari ----------
     Plitkalar jadval bilan bir xil to'plamdan sanaladi: qurilma turi, qidiruv va hudud filtri
     hisobga olinadi, holat filtri esa hisobga olinmaydi — plitkaning o'zi shu filtrni yoqadi.
     Aks holda plitkadagi son bosilganda bo'sh ro'yxat chiqadi. */
  function asosQatorlar(){
    let r = tanlangan();
    if (!jadval) return r;
    const q = String(jadval.holat.qidiruv || "").trim().toLowerCase();
    if (q) r = r.filter(x => String(x.izlash).indexOf(q) >= 0);
    Object.keys(jadval.holat.filtrlar).forEach(k => {
      const v = jadval.holat.filtrlar[k];
      if (v && k !== "holat") r = r.filter(x => String(x[k]) === v);
    });
    return r;
  }
  const signalKalit = m => { const [s, t] = String(m || "").split(" "); return MKB.kn.vaqtKalit(s, t || ""); };
  function metrikalar(){
    const asos = asosQatorlar();
    const kamOb = asos.filter(x => x.kam);
    const aloqada = kamOb.filter(x => x.holat === H_ALOQADA).length;
    const aloqasiz = kamOb.filter(x => x.holat === H_ALOQASIZ).length;
    const kamerasiz = asos.filter(x => !x.kam).length;
    const kamSoni = kamOb.reduce((a, x) => a + x.kamSoni, 0);
    const oxirgiSignal = kamOb.map(x => x.signal).filter(Boolean)
      .sort((a, b) => signalKalit(b).localeCompare(signalKalit(a)))[0] || null;
    $("hs-meta").innerHTML = '<b data-tarjimasiz>' + kamSoni + "</b> <span>ta kamera</span> · " +
      '<b data-tarjimasiz>' + kamOb.length + "</b> <span>ta obyektda</span>";
    const joriy = jadval ? (jadval.holat.filtrlar.holat || "") : "";
    const plitka = (kalit, yorliq, qiymat, izoh, xavf) =>
      '<button type="button" class="metrika' + (kalit && joriy === kalit ? " tanlangan" : "") + '" data-holat="' + esc(kalit) + '" aria-pressed="' + (!!kalit && joriy === kalit) + '">' +
      '<span class="m-yorliq">' + yorliq + "</span>" +
      '<span class="m-qiymat' + (xavf ? " xavf" : "") + '">' + qiymat + "</span>" +
      '<span class="m-izoh">' + izoh + "</span></button>";
    $("hm-metrika").innerHTML =
      plitka(H_ALOQADA, "Kadr beradigan kameralar", '<span data-tarjimasiz>' + aloqada + "</span><small data-tarjimasiz>/ " + kamOb.length + "</small>",
        oxirgiSignal ? "<span>Oxirgi signal:</span> <span data-tarjimasiz>" + esc(oxirgiSignal) + "</span>" : "<span>Signal kelmagan</span>") +
      plitka(H_ALOQASIZ, "Kadr bermayotgan kameralar", '<span data-tarjimasiz>' + aloqasiz + "</span>",
        "Jim yoki nosoz qurilmalar", aloqasiz > 0) +
      plitka(H_KAMERASIZ, "Kamerasiz obyektlar", '<span data-tarjimasiz>' + kamerasiz + "</span>",
        "Qurilmasi bor, kamerasi yo'q", kamerasiz > 0) +
      '<a class="metrika" data-ikonka="ogoh" href="hodisalar.html?filtr=ochiq"><span class="m-yorliq">Ochiq hodisalar</span>' +
      '<span class="m-qiymat"><span data-tarjimasiz>' + H.ochiqSoni + "</span></span>" +
      '<span class="m-izoh">Yangi, tekshiruvda va bartaraf etilmoqda</span></a>';
    tarjimaQil($("hs-meta")); tarjimaQil($("hm-metrika"));
  }
  $("hm-metrika").addEventListener("click", e => {
    const b = e.target.closest("[data-holat]");
    if (!b || !jadval) return;
    const k = b.dataset.holat;
    jadval.holat.filtrlar.holat = jadval.holat.filtrlar.holat === k ? "" : k;
    jadval.holat.sahifa = 1; kartaSahifa = 1;
    jadval.yangila();
  });

  /* ---------- Kadr maydoni: hech qachon jonli video o'rnini bosmaydi ---------- */
  function kadrHTML(x){
    if (!x.kam) return '<div class="kadr-yoq kadr-qora">' + ik("kamera") + "<b>Kamera o'rnatilmagan</b>" +
      "<span>Obyektda kamera yo'q: kadr olib bo'lmaydi. Boshqa qurilmalar signal beradi.</span></div>";
    /* Sabab matni bo'laklarga bo'lingan: son tarjima qilinmaydi, so'zlar lug'atdan o'giriladi */
    const sabab = x.kam.holat === "nosoz" ? "<span>Qurilma nosoz deb belgilangan</span>"
      : x.kam.holat === "xizmatda" ? "<span>Qurilma xizmatda</span>"
      : x.soat == null ? "<span>Qurilmadan signal kelmagan</span>"
      : "<span>Jim turgani:</span> <b data-tarjimasiz>" + (x.soat >= 48 ? Math.floor(x.soat / 24) : x.soat) + "</b> <span>" +
        (x.soat >= 48 ? "kun" : "soat") + "</span>";
    if (x.jim) return '<div class="kadr-yoq kadr-qora">' + ik("kamera") + "<b>Kadr yangilanmadi</b>" +
      "<span>" + sabab + (x.signal ? ' \u00b7 <span>Oxirgi signal:</span> <span data-tarjimasiz>' + esc(x.signal) + "</span>" : "") + "</span></div>";
    const bor = !!(x.y.rasm || x.y.rasmKichik);
    /* Kamera aloqada, lekin ko'rsatadigan kadr yo'q: tizim video saqlamaydi, obyekt surati ham yuklanmagan */
    if (!bor) return '<div class="kadr-yoq kadr-och">' + ik("foto") + "<b>Kadr yo'q</b>" +
      "<span><span>Kamera aloqada, tizim video saqlamaydi.</span> <span>Obyekt surati yuklanmagan.</span></span></div>";
    /* Foto ikonkasi va "surat" so'zi ataylab: bu saqlangan surat, o'sha daqiqadagi kadr emas.
       Oxirgi signal vaqti kartaning pastki qatorida turadi, kadr ustida takrorlanmaydi. */
    return MKB.obyektSurati(x.y, {kichik: !!x.y.rasmKichik}) +
      '<span class="kadr-belgi kadr-yorliq">' + ik("foto") + (namoyish ? "<span>Namuna surat</span>" : "<span>Obyekt surati</span>") + "</span>";
  }

  function kartaHTML(x){
    const chip = (sinf, matn) => '<span class="chip chip-kichik ' + sinf + '">' + matn + "</span>";
    const holatChip = x.holat === H_ALOQADA ? chip("chip-yashil", "Kadr beradi")
      : x.holat === H_ALOQASIZ ? chip("chip-xavf", x.kam.holat === "nosoz" ? "Nosoz" : "Jim") : chip("chip-kul", "Kamera yo'q");
    const amal = (sinf, href, ikon, matn, yoz) =>
      '<a class="tugma ' + sinf + ' tugma-kichik" href="' + href + '"' + (yoz ? ' data-huquq="yoz"' : "") + ">" + ik(ikon) + "<span>" + matn + "</span></a>";
    const amallar = [];
    if (x.kam && x.jim) amallar.push(amal("tugma-asosiy", "servis-topshirigi.html?qurilma=" + encodeURIComponent(x.kam.id), "sozlama", "Servis topshirig'i", true));
    else if (x.kam) amallar.push(amal("tugma-oq", "masofaviy-korik.html?obyekt=" + encodeURIComponent(x.id), "korish", "Masofaviy ko'rik", true));
    else amallar.push(amal("tugma-oq", "qurilma-ornatish.html?obyekt=" + encodeURIComponent(x.id) + "&tur=kamera-4G", "qoshish", "Kamera o'rnatish", true));
    amallar.push(amal("tugma-oq", "obyekt-himoya.html?id=" + encodeURIComponent(x.id), "qalqon", "Obyekt himoyasi", false));
    if (x.qulf) amallar.push(amal("tugma-oq", "qurilma.html?id=" + encodeURIComponent(x.qulf.id) + "#qr-ochish-karta", "ochiq-qulf", "Eshikni ochish", true));
    else amallar.push(amal("tugma-oq", "hodisalar.html?yangi=1&obyekt=" + encodeURIComponent(x.id), "xavf", "Hodisa qayd etish", true));
    /* Belgi kimning quvvati ekanini aytadi: kamera o'zi past bo'lsa — kameraniki,
       aks holda obyektdagi boshqa qurilmaning eng past ko'rsatkichi */
    const batChip = x.kamBatPast ? chip("chip-sariq", "<span>Kamera batareyasi</span>&nbsp;<b data-tarjimasiz>" + x.kamBat + "%</b>")
      : x.batPast ? chip("chip-sariq", "<span>Eng past batareya</span>&nbsp;<b data-tarjimasiz>" + x.batareya + "%</b>") : "";
    return '<article class="obyekt-karta">' +
      '<div class="obyekt-media mm-kadr">' + kadrHTML(x) +
        '<div class="beyj-qator">' + holatChip + batChip + "</div></div>" +
      (x.surat && x.y.rasmManba ? '<p class="mm-manba"><span>Surat manbasi:</span> <span>' + esc(x.y.rasmManba) + "</span></p>" : "") +
      '<div class="obyekt-tana">' +
        '<h3><a href="obyekt-himoya.html?id=' + encodeURIComponent(x.id) + '">' + esc(x.nom) + "</a></h3>" +
        '<span class="manzil"><span class="kod-mono" data-tarjimasiz>' + esc(x.id) + "</span> · " + esc(x.hudud) + (x.tur ? " · " + esc(x.tur) : "") + "</span>" +
        '<div class="mm-chiplar">' +
          (x.kam ? '<span class="chip chip-oq chip-kichik" data-tarjimasiz>' + esc(x.kam.id) + "</span>" : "") +
          (x.kamSoni > 1 ? '<span class="chip chip-oq chip-kichik"><b data-tarjimasiz>' + x.kamSoni + "</b>&nbsp;<span>ta kamera</span></span>" : "") +
          (x.ochiq ? '<span class="chip chip-xavf chip-kichik"><b data-tarjimasiz>' + x.ochiq + "</b>&nbsp;<span>ta ochiq hodisa</span></span>" : "") + "</div>" +
        '<div class="obyekt-past mm-past">' +
          '<span class="obyekt-xoss">' + ik("soat") + "<span>" + (x.signal ? '<span data-tarjimasiz>' + esc(x.signal) + "</span>" : "<span>Signal yo'q</span>") + "</span></span>" +
          '<span class="obyekt-xoss">' + ik("qurilma") + "<b data-tarjimasiz>" + x.qurilmaSoni + "</b>&nbsp;<span>ta qurilma</span></span>" +
        "</div>" +
        '<div class="mm-amallar">' + amallar.join("") + "</div>" +
      "</div></article>";
  }

  /* ---------- Jadval (ixcham ro'yxat) va kartalar bir xil filtrdan oziqlanadi ---------- */
  const KARTA_HAJMI = 24;
  let qatorlar = [], jadval = null, kartaSahifa = 1, kor = "karta", qurilmaTuri = "";
  try{ const s = localStorage.getItem(MKBapi.kalit("mkb4-monitoring-kor")); if (s === "jadval" || s === "karta") kor = s; }catch(_){ }

  const turVariantlari = () => [...new Set(qatorlar.reduce((a, x) => a.concat(x.turlari), []))].sort((a, b) => String(a).localeCompare(String(b)));
  const tanlangan = () => qatorlar.filter(x => !qurilmaTuri || x.turlari.indexOf(qurilmaTuri) >= 0);
  const amallarHTML = () => '<label class="tanlov mm-tanlov" data-tur="himoya-qurilma-filtr"><span class="t-old">Qurilma:</span>' +
      '<select data-qtur aria-label="Qurilma turi bo&#39;yicha"><option value="">Barchasi</option>' +
      turVariantlari().map(t => '<option value="' + esc(t) + '"' + (t === qurilmaTuri ? " selected" : "") + ">" + esc(t) + "</option>").join("") + "</select></label>" +
    '<div class="almashtirgich" role="group" aria-label="Ko\'rinish turi" data-tur="himoya-korinish">' +
      '<button type="button" data-kor="karta" aria-pressed="' + (kor === "karta") + '"' + (kor === "karta" ? ' class="faol"' : "") + ">" + ik("galereya") + "<span>Kameralar</span></button>" +
      '<button type="button" data-kor="jadval" aria-pressed="' + (kor === "jadval") + '"' + (kor === "jadval" ? ' class="faol"' : "") + ">" + ik("hujjat") + "<span>Ro'yxat</span></button></div>";

  function sahifalashHTML(joriy, jami){
    if (jami <= 1) return "";
    let h = '<div class="sahifalash" role="navigation" aria-label="Sahifalar">' +
      '<button type="button" data-kp="old" aria-label="Oldingi sahifa"' + (joriy <= 1 ? " disabled" : "") + ">" + ik("chap") + "</button>";
    for (let i = 1; i <= jami; i++){
      if (jami > 7 && Math.abs(i - joriy) > 2 && i !== 1 && i !== jami){ if (Math.abs(i - joriy) === 3) h += "<span>…</span>"; continue; }
      h += '<button type="button" data-kp="' + i + '"' + (i === joriy ? ' class="faol" aria-current="page"' : "") + ">" + i + "</button>";
    }
    return h + '<button type="button" data-kp="keyin" aria-label="Keyingi sahifa"' + (joriy >= jami ? " disabled" : "") + ">" + ik("ong") + "</button></div>";
  }
  function kartalarChiz(){
    const kartada = kor === "karta";
    const kj = $("mm-kartalar"), ks = $("mm-sahifa");
    $("mm-jadval").classList.toggle("karta-rejim", kartada);
    kj.hidden = !kartada; ks.hidden = !kartada;
    if (!kartada || !jadval) return;
    const r = jadval.moslar();
    const sahifalar = Math.max(1, Math.ceil(r.length / KARTA_HAJMI));
    kartaSahifa = Math.min(Math.max(1, kartaSahifa), sahifalar);
    const bolak = r.slice((kartaSahifa - 1) * KARTA_HAJMI, kartaSahifa * KARTA_HAJMI);
    kj.innerHTML = bolak.length ? bolak.map(kartaHTML).join("")
      : '<div class="karta" style="grid-column:1/-1">' + MKB.boshHolat("filtr", "Filtrga mos obyekt yo'q", "Qidiruv yoki filtr shartlarini o'zgartiring") + "</div>";
    ks.innerHTML = r.length ? '<span><span>Ko&#39;rsatilmoqda</span> <b data-tarjimasiz>' + ((kartaSahifa - 1) * KARTA_HAJMI + 1) + "–" +
      ((kartaSahifa - 1) * KARTA_HAJMI + bolak.length) + "</b> / <b data-tarjimasiz>" + r.length + "</b></span>" + sahifalashHTML(kartaSahifa, sahifalar) : "";
    tarjimaQil(kj); tarjimaQil(ks);
  }

  const USTUNLAR = [
    {kalit: "nom", nom: "Obyekt", chiz: x => "<b>" + esc(x.nom) + '</b><div class="kod-mono" data-tarjimasiz>' + esc(x.id) + "</div>", csv: x => x.nom},
    {kalit: "hudud", nom: "Hudud"},
    {kalit: "kamNomi", nom: "Kamera", chiz: x => x.kam
      ? '<a href="qurilma.html?id=' + encodeURIComponent(x.kam.id) + '">' + esc(x.kamNomi) + '</a><div class="kod-mono" data-tarjimasiz>' + esc(x.kam.id) + (x.kamSoni > 1 ? " +" + (x.kamSoni - 1) : "") + "</div>"
      : "<span>Kamera yo'q</span>", csv: x => x.kam ? x.kamNomi + " " + x.kam.id : ""},
    {kalit: "batareya", nom: "Batareya", son: true, chiz: x => x.batareya < 0 ? "<span>Tarmoq</span>"
      : '<span' + (x.batPast ? ' style="color:var(--xavf-matn-yorqin)"' : "") + ' data-tarjimasiz>' + x.batareya + "%</span>", csv: x => x.batareya < 0 ? "" : x.batareya + "%"},
    {kalit: "signal", nom: "Oxirgi signal", tur: "sana", chiz: x => '<span data-tarjimasiz>' + esc(x.signal || "—") + "</span>" +
      (x.soat != null && x.soat >= 1 ? '<div class="kod-mono"><span data-tarjimasiz>' + (x.soat >= 48 ? Math.floor(x.soat / 24) : x.soat) + "</span> <span>" + (x.soat >= 48 ? "kun oldin" : "soat oldin") + "</span></div>" : "")},
    {kalit: "ochiq", nom: "Ochiq hodisa", son: true, chiz: x => x.ochiq ? '<span class="chip chip-kichik chip-xavf" data-tarjimasiz>' + x.ochiq + "</span>" : "—"},
    {kalit: "holat", nom: "Holat", chiz: x => '<span class="chip chip-kichik ' +
      (x.holat === H_ALOQADA ? "chip-yashil" : x.holat === H_ALOQASIZ ? "chip-xavf" : "chip-kul") + '">' + x.holat + "</span>"},
  ];
  function jadvalQur(){
    const cfg = {
      id: "monitoring-kameralar", qatorlar: tanlangan(), ustunlar: USTUNLAR, sahifaHajmi: 12,
      saralash: "daraja", yonalish: 1, csvNomi: "monitoring-kameralar",
      qidiruv: ["izlash"], qidiruvYozuvi: "Obyekt, hudud yoki qurilma ID",
      filtrlar: [
        {kalit: "holat", nom: "Holat", variantlar: [H_ALOQADA, H_ALOQASIZ, H_KAMERASIZ]},
        {kalit: "hudud", nom: "Hudud", variantlar: [...new Set(qatorlar.map(x => x.hudud))].sort((a, b) => String(a).localeCompare(String(b)))},
      ],
      bosh: {sarlavha: "Qurilmali obyekt yo'q", izoh: "Kamera yoki datchik o'rnatilgan obyektlar shu yerda ko'rinadi"},
      bosilganda: x => { location.href = "obyekt-himoya.html?id=" + encodeURIComponent(x.id); },
      chizilganda: () => { if (!jadval) return; metrikalar(); kartalarChiz(); },
    };
    Object.defineProperty(cfg, "amallar", {get: amallarHTML, enumerable: true});
    jadval = MKB.jadval("mm-jadval", cfg);
  }
  $("mm-jadval").addEventListener("change", e => {
    if (!e.target.matches("[data-qtur]")) return;
    qurilmaTuri = e.target.value; kartaSahifa = 1;
    jadval.holat.sahifa = 1;
    jadval.yangila(tanlangan());
  });
  $("mm-jadval").addEventListener("click", e => {
    const k = e.target.closest("[data-kor]");
    if (!k || !jadval) return;
    kor = k.dataset.kor; kartaSahifa = 1;
    try{ localStorage.setItem(MKBapi.kalit("mkb4-monitoring-kor"), kor); }catch(_){ }
    jadval.yangila();
    const y = document.querySelector('#mm-jadval [data-kor="' + kor + '"]');
    if (y) y.focus();
  });
  $("mm-sahifa").addEventListener("click", e => {
    const b = e.target.closest("[data-kp]");
    if (!b) return;
    const v = b.dataset.kp;
    kartaSahifa = v === "old" ? kartaSahifa - 1 : v === "keyin" ? kartaSahifa + 1 : +v;
    kartalarChiz();
    $("mm-kartalar").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  });

  /* ---------- Tahlil: bu yerda sanalmaydi, o'z sahifasida ochiladi ---------- */
  function tahlil(){
    const h = (href, matn, son) => '<a href="' + href + '">' + ik("ong") + "<span>" + matn + "</span>&nbsp;<b data-tarjimasiz>" + son + "</b></a>";
    $("hm-tahlil").innerHTML = "<span>Tahlil:</span> " +
      h("qurilmalar.html?filtr=oflayn24", "24 soatdan ortiq jim qurilmalar", H.uzoq.length) +
      h("qurilmalar.html?filtr=batareya", "batareyasi past qurilmalar", H.batPast.length) +
      h("qoriqlash.html?filtr=qoriqlanmagan", "qo'riqlanmayotgan obyektlar", H.qoriqlanmagan.length) +
      '<a href="qurilmalar.html#qr-smeta"><svg class="ic"><use href="#ik-ong"/></svg><span>himoya smetasi</span></a>';
    tarjimaQil($("hm-tahlil"));
  }

  /* ---------- Signallar lentasi ----------
     Tartib: xavfsizlik hodisasi > uzilgan aloqa > past batareya. Qurilma holati haqidagi
     bir xil signallar (aloqa, batareya) bitta ochiladigan qatorga yig'iladi: haqiqiy
     xavfsizlik hodisasi ro'yxat boshida turadi va texnik signallar orasida yo'qolmaydi. */
  const LENTA_TARTIB = {xavfsizlik: 0, aloqa: 1, batareya: 2};
  const LENTA_YIGMA = {
    aloqa: {nom: "Aloqasiz qurilmalar", belgi: "sariq", havola: "qurilmalar.html?filtr=oflayn24"},
    batareya: {nom: "Batareyasi past qurilmalar", belgi: "", havola: "qurilmalar.html?filtr=batareya"},
  };
  const yigmaOchiq = {};
  function signalGuruhi(nom, tur){
    if (tur === "kirish") return "xavfsizlik";
    const n = String(nom || "").replace(/[’ʼʻ`´]/g, "'").toLowerCase();
    if (n.indexOf("batareya") >= 0 || n.indexOf("akkumulyator") >= 0) return "batareya";
    if (n.indexOf("aloqasiz") >= 0 || n.indexOf("aloqasi uzildi") >= 0) return "aloqa";
    return "xavfsizlik";
  }
  function signallar(){
    return MKB.doira(D.XAVFSIZLIK_HODISALARI || []).map(h => {
      const q = D.qurilma(h.qurilmaId);
      return {tur: "qurilma", vaqt: h.vaqt, d: D.sanaOqi(h.vaqt), nom: h.hodisa, izoh: obNomi(h.obyektId) + (q ? " · " + q.turNomi : ""),
        href: "hodisa.html?id=" + encodeURIComponent(h.id), jid: h.jiddiylik, holat: h.holat};
    }).concat(MKB.doira(D.HODISALAR || []).filter(h => h.manba === "qurilma").map(h => ({
      /* Qurilmadan kelib hodisa sifatida ochilgan signal (tutun, suv bosishi, GPS) */
      tur: "qurilma", vaqt: h.vaqt, d: D.sanaOqi(h.vaqt), nom: h.hodisa, izoh: obNomi(h.obyektId) + (h.masul ? " · " + h.masul : ""),
      href: "hodisa.html?id=" + encodeURIComponent(h.id), jid: h.jiddiylik, holat: GH_HOLAT[h.ustun] || null
    }))).concat(MKB.doira(D.KIRISH_VOQEALARI || []).filter(v => v.natija === "rad" || v.natija === "ogohlantirish").map(v => ({
      tur: "kirish", vaqt: v.vaqt, d: D.sanaOqi(v.vaqt), nom: v.natija === "rad" ? "Kirish rad etildi" : "Ish vaqtidan tashqari ochilish",
      izoh: obNomi(v.obyektId) + " · " + (v.nuqtaNomi || "") + (v.sabab ? " · " + v.sabab : ""),
      href: "kirish-voqea.html?id=" + encodeURIComponent(v.id), jid: v.natija === "rad" ? "yuqori" : "o'rta", holat: null
    }))).filter(s => s.d).map(s => { s.guruh = signalGuruhi(s.nom, s.tur); return s; })
      .sort((a, b) => LENTA_TARTIB[a.guruh] - LENTA_TARTIB[b.guruh] || b.d - a.d);
  }
  function lentaChiz(){
    const lenta = $("hm-lenta");
    const bugunS = D.sanaYoz(D.bugun());
    const r = signallar().filter(s => !lentaTur || s.tur === lentaTur);
    if (!r.length){
      lenta.innerHTML = H.qurilmalar.length || lentaTur ? MKB.boshHolat("signal", "Signal yo'q", "Qurilmalar va kirish nuqtalaridan signal kelmagan")
        : MKB.boshHolat("qurilma", "Qurilmalar hali kiritilmagan", "Signallar qurilma o'rnatilgandan keyin shu yerda chiqadi",
          '<a class="tugma tugma-asosiy tugma-kichik" href="qurilma-ornatish.html" data-huquq="yoz">' + ik("qoshish") + "Birinchi qurilmani o'rnatish</a>");
      tarjimaQil(lenta); return;
    }
    /* vaqt: bugungi signalda soat, eskisida kun va soat */
    const vaqti = s => { const sn = D.sanaYoz(s.d), soat = String(s.vaqt).slice(11); return sn === bugunS ? soat : sn.slice(0, 5) + " " + soat; };
    const qatorHTML = s => {
      const h = s.holat ? HOLAT_NOM[s.holat] : null;
      return '<a class="qator" href="' + s.href + '"><span class="belgi ' + MKB.jiddiylik(s.jid).belgi + '">' + ik(s.tur === "kirish" ? "qulf" : "signal") + "</span>" +
        '<span class="matn"><b>' + esc(s.nom) + "</b><span>" + esc(s.izoh) + "</span></span>" +
        '<span class="ong">' + (h ? '<span class="chip chip-kichik ' + h[1] + '">' + h[0] + "</span>" : "") +
        '<span class="vaqt" data-tarjimasiz>' + esc(vaqti(s)) + "</span></span></a>";
    };
    const xavf = r.filter(s => s.guruh === "xavfsizlik");
    const holat = ["aloqa", "batareya"].map(k => ({k, q: r.filter(s => s.guruh === k)})).filter(g => g.q.length);
    let html = "";
    if (xavf.length) html += (holat.length ? '<div class="lenta-sana">Xavfsizlik signallari</div>' : "") + xavf.slice(0, 8).map(qatorHTML).join("");
    if (holat.length){
      if (xavf.length) html += '<div class="lenta-sana">Qurilma signallari</div>';
      holat.forEach(g => {
        /* ikki-uchta signal yig'ilmaydi: ro'yxat qisqa bo'lsa ochib o'tirishning hojati yo'q */
        if (g.q.length < 3){ html += g.q.map(qatorHTML).join(""); return; }
        const y = LENTA_YIGMA[g.k], ochiq = !!yigmaOchiq[g.k], id = "hm-yigma-" + g.k;
        html += '<div class="qator"><span class="belgi ' + y.belgi + '">' + ik("qurilma") + "</span>" +
          '<span class="matn"><b><button type="button" class="qator-och" data-yigma="' + g.k + '" aria-expanded="' + ochiq + '" aria-controls="' + id + '">' + y.nom + "</button></b>" +
          '<span><b data-tarjimasiz>' + g.q.length + "</b> <span>ta qurilma signali</span></span></span>" +
          '<span class="ong"><svg class="ic"><use href="#ik-' + (ochiq ? "yuqori" : "past") + '"/></svg></span></div>' +
          '<div class="lenta-ichki" id="' + id + '"' + (ochiq ? "" : " hidden") + ">" + g.q.slice(0, 5).map(qatorHTML).join("") +
          (g.q.length > 5 ? '<div class="yigma-havola"><a class="karta-havola" style="margin-left:0" href="' + y.havola + '">Barcha qurilmalar' + ik("ong") + "</a></div>" : "") + "</div>";
      });
    }
    lenta.innerHTML = html;
    tarjimaQil(lenta);
  }
  document.querySelectorAll("[data-lenta]").forEach(b => b.addEventListener("click", () => {
    lentaTur = b.dataset.lenta;
    document.querySelectorAll("[data-lenta]").forEach(x => { x.classList.toggle("faol", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    lentaChiz();
  }));
  $("hm-lenta").addEventListener("click", e => {
    const b = e.target.closest("[data-yigma]");
    if (!b) return;
    const k = b.dataset.yigma;
    yigmaOchiq[k] = !yigmaOchiq[k];
    lentaChiz();
    const yangi = $("hm-lenta").querySelector('[data-yigma="' + k + '"]');
    if (yangi) yangi.focus();
  });

  /* ---------- Masofaviy ko'riklar: bugun rejada va jarayonda ---------- */
  function masofaviy(){
    const bugunS = D.sanaYoz(D.bugun());
    const mkOchiq = MKB.doira(D.MASOFAVIY_SESSIYALAR || []).filter(s => s.holat === "jarayonda" || (s.holat === "rejalashtirilgan" && D.sanaOqi(s.sana) >= D.bugun()))
      .sort((a, b) => (a.holat === "jarayonda" ? 0 : 1) - (b.holat === "jarayonda" ? 0 : 1) || (D.sanaOqi(a.sana) - D.sanaOqi(b.sana)) || String(a.vaqt || "").localeCompare(String(b.vaqt || "")));
    const mkJarayonda = mkOchiq.filter(s => s.holat === "jarayonda").length;
    const mkBugun = mkOchiq.filter(s => s.holat === "rejalashtirilgan" && s.sana === bugunS).length;
    $("hm-mk-soni").textContent = mkOchiq.length ? mkOchiq.length : "";
    $("hm-mk").innerHTML = mkOchiq.length
      ? '<p class="smeta-izoh" style="margin:0 0 6px"><span>Bugun rejada:</span> <b data-tarjimasiz>' + mkBugun + "</b> · <span>jarayonda:</span> <b data-tarjimasiz>" + mkJarayonda + "</b></p>" +
        mkOchiq.slice(0, 5).map(s => '<a class="qator" href="masofaviy-korik.html?id=' + encodeURIComponent(s.id) + '"><span class="belgi ' + (s.holat === "jarayonda" ? "mint" : "lavanda") + '">' + ik("kamera") + "</span>" +
          '<span class="matn"><b>' + esc(obNomi(s.obyektId)) + "</b><span>" + esc(s.inspektor || "—") + ' · <span data-tarjimasiz>' + esc(s.id) + "</span></span></span>" +
          '<span class="ong">' + (s.holat === "jarayonda" ? '<span class="chip chip-kichik chip-sariq">Jarayonda</span>' : "") +
          '<span class="vaqt" data-tarjimasiz>' + esc((s.sana === bugunS ? "" : s.sana + " ") + (s.vaqt || "")) + "</span></span></a>").join("")
      : MKB.boshHolat("kamera", "Rejadagi masofaviy ko'rik yo'q", "Kamerasi bor obyektni joyga bormasdan ko'rish uchun sessiya rejalashtiring",
          '<a class="tugma tugma-asosiy tugma-kichik" href="masofaviy-korik.html" data-huquq="yoz">' + ik("kalendar") + "Ko'rikni rejalashtirish</a>");
    tarjimaQil($("hm-mk"));
  }

  function hammasi(){
    H = hisobla();
    qatorlar = qatorlarniYasa();
    if (jadval) jadval.yangila(tanlangan()); else jadvalQur();
    metrikalar(); kartalarChiz(); tahlil(); lentaChiz(); masofaviy();
  }
  hammasi();
  const belgi = MKB.yangilanganBelgi("hm-yangilandi", {avto: 60, yangila: async () => { await MKB.kn.yukla(KOLLAR); hammasi(); }});
  belgi.belgila();
  }
})();
