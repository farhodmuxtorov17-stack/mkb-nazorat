<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Savdo doskasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>
.doska{display:grid;grid-auto-flow:column;grid-auto-columns:300px;gap:18px;overflow-x:auto;padding:4px 2px 12px}
.doska-ustun{display:flex;flex-direction:column;gap:12px;min-height:220px}
.doska-bosh{display:flex;align-items:center;gap:10px;padding:2px 6px 0}
.doska-bosh b{font-size:14.5px;font-weight:500}
.doska-bosh .nuq{width:9px;height:9px;border-radius:99px;flex:none}
.doska-bosh .soni{margin-left:auto;font-size:12.5px;color:var(--matn-3);
  background:var(--oq);border-radius:999px;padding:3px 11px;box-shadow:var(--soya-past)}
.ish-karta{background:var(--oq);border-radius:22px;padding:16px 18px;display:block;
  box-shadow:var(--soya-past);transition:transform var(--tez),box-shadow var(--tez)}
.ish-karta:hover{transform:translateY(-3px);box-shadow:var(--soya)}
.ish-karta .bosh{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.ish-karta .yuz{width:38px;height:38px;border-radius:999px;background:var(--siyoh);color:var(--oq);
  display:grid;place-items:center;font:500 13px var(--shrift);flex:none}
.ish-karta .ik{font-size:12px;color:var(--matn-3)}
.ish-karta b{display:block;font-size:14px;font-weight:500;line-height:1.3}
.ish-karta .obyekt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--chiziq-2)}
.ish-karta .obyekt img{width:44px;height:36px;border-radius:12px;object-fit:cover;flex:none;background:var(--persik)}
.ish-karta .obyekt span{font-size:12.5px;color:var(--matn-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ish-karta .past{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--chiziq-2)}
.doska-bosh-ustun{position:sticky;top:0}
</style>
<style>.doska{grid-auto-columns:318px}</style><style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Realizatsiya</span></div>
    <div class="hs-qator"><h1>Savdo doskasi</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><a class="tugma tugma-asosiy" href="auksion-natija.html"><svg class="ic"><use href="#i-gavel"/></svg>Natija kiritish</a></div></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="savdo.html" class="faol">Doska</a><a href="auksion-jadvali.html">Auksion jadvali</a><a href="auksion-takliflar.html">Takliflar</a><a href="tolov-nazorati.html">To'lovlar</a><a href="ijara.html">Ijara</a><a href="xaridorlar.html">Xaridorlar</a><a href="savdo-natijalari.html">Natijalar</a></nav>
  <div class="doska" id="doska"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("SOTUV");
  const takliflar = await MKBapi.royxat("TAKLIFLAR");
  document.getElementById("hs-meta").textContent = r.length + " ta lot savdo jarayonida";
  document.getElementById("doska").innerHTML = MKB_DATA.AUKSION_BOSQICH.map(([kalit, nom, rang]) => {
    const lotlar = r.filter(l => l.bosqich === kalit);
    return '<div class="doska-ustun"><div class="doska-bosh">' +
      '<span class="nuq" style="background:' + rang + '"></span>' +
      '<b>' + nom + '</b><span class="soni">' + lotlar.length + '</span></div>' +
      (lotlar.length ? lotlar.map(l => {
        const t = takliflar.filter(v => v.obyektId === l.id).length;
        return '<a class="obyekt-karta" href="lot.html?id=' + encodeURIComponent(l.id) + '">' +
          '<div class="obyekt-media"><img src="' + l.rasm + '" alt="" loading="lazy">' +
            (t ? '<span class="beyj beyj-mint">' + t + ' taklif</span>'
               : '<span class="beyj beyj-lavanda">' + nom + '</span>') +
            '<span class="amallar"><span class="amal-doira">' + ik("korish") + '</span>' +
            '<span class="amal-doira">' + ik("strelka") + '</span></span></div>' +
          '<div class="obyekt-tana"><h3>' + l.nom + '</h3>' +
            '<span class="manzil">' + (l.hududToliq || l.hudud) + '</span>' +
            '<span class="obyekt-narx">' + MKB.fmt(l.baho) + " mln so'm</span>" +
            '<div class="obyekt-past">' +
              '<span class="obyekt-xoss">' + ik("kub") + l.tur + '</span>' +
              '<span class="obyekt-xoss">' + ik("korik") + (l.korik || 0) + ' ko&#39;rik</span>' +
            '</div></div></a>';
      }).join("")
      : '<div class="karta" style="padding:20px;text-align:center;font-size:12.5px;color:var(--matn-3);box-shadow:none;background:rgba(255,255,255,.5)">Lot yo&#39;q</div>');
  }).map(x => x + "</div>").join("");
});
</script>
</body>
</html>
