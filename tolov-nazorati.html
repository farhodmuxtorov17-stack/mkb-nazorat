<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — To'lov nazorati</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Realizatsiya</span></div>
    <div class="hs-qator"><h1>To'lov nazorati</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="savdo.html">Doska</a><a href="auksion-jadvali.html">Auksion jadvali</a><a href="auksion-takliflar.html">Takliflar</a><a href="tolov-nazorati.html" class="faol">To'lovlar</a><a href="ijara.html">Ijara</a><a href="xaridorlar.html">Xaridorlar</a><a href="savdo-natijalari.html">Natijalar</a></nav>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const arxiv = await MKBapi.royxat("ARXIV");
  const qatorlar = [];
  arxiv.forEach((a, i) => {
    const bolaklar = i % 2 ? 1 : 3;
    for (let k = 1; k <= bolaklar; k++){
      const kalit = "mkb4-tolov-" + a.id + "-" + k;
      qatorlar.push({id: a.id + "-" + k, arxivId: a.id, obyekt: a.nom, xaridor: a.xaridor,
        bolak: k + "/" + bolaklar, summa: Math.round(a.summa / bolaklar),
        muddat: (10 + k * 15) + "-" + (i % 2 ? "iyn" : "avg") + ", 2026",
        tolandi: localStorage.getItem(kalit) === "1" || k === 1, kalit});
    }
  });
  document.getElementById("hs-meta").textContent = qatorlar.filter(q => !q.tolandi).length + " ta to'lov kutilmoqda";
  const jadval = MKB.jadval("jadval-joy", {
    qatorlar,
    qidiruv: ["obyekt", "xaridor"],
    ustunlar: [
      {kalit: "obyekt", nom: "Obyekt"},
      {kalit: "xaridor", nom: "Xaridor"},
      {kalit: "bolak", nom: "Bo'lak"},
      {kalit: "summa", nom: "Summa", son: true, chiz: q => '<span class="pul">' + MKB.fmt(q.summa) + ' mln</span>'},
      {kalit: "muddat", nom: "Muddat"},
      {kalit: "tolandi", nom: "Holat", chiz: q => q.tolandi
        ? '<span class="chip chip-yashil">To\'landi</span>'
        : '<button type="button" class="tugma tugma-kichik tugma-asosiy" data-tola="' + q.kalit + '">Qabul qilish</button>'},
    ],
    chizilganda(bolak, el){
      el.querySelectorAll("[data-tola]").forEach(b => b.addEventListener("click", ev => {
        ev.stopPropagation();
        localStorage.setItem(b.dataset.tola, "1");
        const q = qatorlar.find(v => v.kalit === b.dataset.tola);
        if (q) q.tolandi = true;
        jadval.yangila();
        MKB.toast("To'lov qabul qilindi");
      }));
    },
  });
});
</script>
</body>
</html>
