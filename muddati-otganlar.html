<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Muddati o'tgan qarzlar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
</head>
<body data-sahifa="portfel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Muddati o'tgan qarzlar</span></div>
    <div class="hs-qator"><h1>Muddati o'tgan qarzlar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const qatorlar = yoz.filter(y => y.qarz.kunlar > 0)
    .map(y => ({id: y.id, mijoz: y.mijoz.nom, obyekt: y.mulk.qisqa, kunlar: y.qarz.kunlar,
      qarzN: MKB.sonQiymat(y.qarzSon), qarzMatn: y.qarzMatn, bosqich: y.bosqichNomi,
      daraja: y.qarz.kunlar > 365 ? "Surunkali" : y.qarz.kunlar > 180 ? "Og'ir" : y.qarz.kunlar > 90 ? "O'rtacha" : "Boshlang'ich"}));
  document.getElementById("hs-meta").textContent = qatorlar.length + " ta kechikkan shartnoma";
  MKB.jadval("jadval-joy", {
    qatorlar,
    qidiruv: ["mijoz", "obyekt"],
    filtrlar: [{kalit: "daraja", nom: "Daraja", variantlar: ["Boshlang'ich", "O'rtacha", "Og'ir", "Surunkali"]}],
    ustunlar: [
      {kalit: "mijoz", nom: "Mijoz"},
      {kalit: "obyekt", nom: "Ta'minot"},
      {kalit: "kunlar", nom: "Kechikish", son: true, chiz: q =>
        '<span class="chip ' + (q.kunlar > 180 ? 'chip-xavf' : q.kunlar > 90 ? 'chip-sariq' : '') + '">' + q.kunlar + ' kun</span>'},
      {kalit: "daraja", nom: "Daraja"},
      {kalit: "qarzN", nom: "Qoldiq qarz", son: true, chiz: q => '<span class="pul">' + q.qarzMatn + '</span>'},
      {kalit: "bosqich", nom: "Bosqich", chiz: q => '<span class="chip chip-info">' + q.bosqich + '</span>'},
    ],
    saralash: "kunlar",
    bosilganda: q => location.href = "qarzdor.html?id=" + encodeURIComponent(q.id),
  });
  const th = document.querySelector('th[data-kalit="kunlar"]');
  if (th) th.click();
});
</script>
</body>
</html>
