<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ommaviy oferta va foydalanish shartlari</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.h-sahna{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px 40px;
  background:
    radial-gradient(900px 620px at 50% -12%, var(--fon-issiq) 0%, transparent 60%),
    linear-gradient(168deg,var(--fon-sovuq) 0%,var(--fon-sovuq) 50%,var(--fon-mint) 100%)}
.h-shapka{width:min(820px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-varaq{width:min(820px,100%);background:var(--oq);border-radius:var(--r-karta);box-shadow:var(--soya-suzuvchi);padding:40px 46px 38px}
.h-varaq h1{font:500 30px/1.16 var(--shrift-displey);letter-spacing:-.035em}
.h-ost{font-size:14px;color:var(--matn-3);margin-top:8px}
.h-tahrir{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 15px;border-radius:var(--r-pilyula);
  background:var(--plitka);font-size:12.5px;color:var(--matn-2)}
.h-tahrir .ic{width:16px;height:16px;color:var(--matn-3)}
.h-band{margin-top:28px;padding-top:22px;border-top:1px solid var(--chiziq-2)}
.h-band h2{font:500 17.5px/1.32 var(--shrift-displey);letter-spacing:-.022em}
.h-band p{margin-top:10px;font-size:14.5px;line-height:1.68;color:var(--matn-2)}
.h-band ul{margin-top:11px;display:flex;flex-direction:column;gap:9px;list-style:none}
.h-band li{position:relative;padding-left:21px;font-size:14.5px;line-height:1.62;color:var(--matn-2)}
.h-band li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:999px;background:var(--matn-4)}
.h-oyoq{width:min(820px,100%);display:flex;justify-content:center;font-size:13px}
.h-oyoq a{color:var(--matn-2);text-decoration:underline;text-underline-offset:3px}
.h-oyoq a:hover{color:var(--siyoh)}
@media (max-width:560px){
  .h-sahna{padding:16px 14px 30px}
  .h-varaq{padding:26px 20px 24px;border-radius:24px}
  .h-varaq h1{font-size:24px}
  .h-shapka .tugma{flex:1 1 auto;justify-content:center}
}
</style>
</head>
<body data-sahifa="kirish" data-ochiq="1">
<div class="h-sahna">
  <header class="h-shapka">
    <a class="tugma tugma-oq" id="ortga" href="kirish.html"><svg class="ic"><use href="#ik-chap"/></svg><span id="ortga-matn">Kirish sahifasiga qaytish</span></a>
    <div class="til-almash" role="group" aria-label="Interfeys tili" id="til-almash">
      <button type="button" data-til="uz" lang="uz" aria-pressed="true" class="faol">UZ</button>
      <button type="button" data-til="ru" lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>
  <main class="h-varaq" id="hujjat"></main>
  <nav class="h-oyoq" aria-label="Boshqa hujjatlar">
    <a href="maxfiylik.html" id="juft">Maxfiylik va shaxsga doir ma&#39;lumotlar bildirishnomasi</a>
  </nav>
</div>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script>
/* Ommaviy oferta. Tahrir kirish sahifasidagi HUJJAT_TAHRIR bilan bir xil bo'lishi shart:
   tahrir o'zgarganda foydalanuvchidan rozilik qaytadan so'raladi. */
(function(){
  const TAHRIR = "1.0", SANA = "25.09.2026";
  const JUFT = {uz: "Maxfiylik va shaxsga doir ma'lumotlar bildirishnomasi", ru: "Уведомление о конфиденциальности и персональных данных"};
  const MATN = {
  uz: {
    sarlavha: "Ommaviy oferta va foydalanish shartlari",
    ost: "“Balans aktivlari nazorati” tizimi",
    tahrir: "Tahrir " + TAHRIR + " · " + SANA + " dan kuchda",
    bandlar: [
      {n: "1. Oferta predmeti", p: [
        "“Mikrokreditbank” ATB (quyida — Bank) “Balans aktivlari nazorati” tizimidan (quyida — Tizim) foydalanish shartlarini shu oferta bilan e'lon qiladi.",
        "Tizim undiruv natijasida bank balansiga o'tgan aktivlarni — ko'chmas mulk, transport, uskuna va inventarni — balansga qabul qilingan kundan balansdan chiqarilgunga qadar yuritadi: reyestr, huquqni rasmiylashtirish, baholash, ko'rik, qo'riqlash, sug'urta, ijara, realizatsiya va hisobot.",
        "Tizim buxgalteriya hisobini yuritmaydi. Rasmiy hisob avtomatlashtirilgan bank tizimida qoladi, Tizim esa aktivning jismoniy holati va hujjatlar to'liqligini nazorat qiladi."
      ]},
      {n: "2. Ofertani qabul qilish", p: [
        "Kirish sahifasidagi belgini qo'yish va “Kirish” tugmasini bosish akseptdir. Shu daqiqadan boshlab oferta va maxfiylik bildirishnomasi foydalanuvchi uchun majburiy bo'ladi.",
        "Aksept paytida hisob logini, hujjat tahriri va qabul qilingan sana qayd etiladi. Shartlarni qabul qilmagan xodim Tizimga kirmaydi: boshqa yo'l ko'zda tutilmagan."
      ]},
      {n: "3. Kim foydalanadi", p: [
        "Hisobni faqat Axborot texnologiyalari departamenti ochadi va yopadi. Huquqlar lavozimga qarab beriladi: rahbariyat, obyekt menejeri, ko'rik va xavfsizlik inspektori, buxgalteriya va risk, administrator.",
        "Hisob shaxsiy. Login va parol boshqa shaxsga berilmaydi, bo'lim uchun umumiy hisob ochilmaydi.",
        "Pudratchi xodimiga vaqtinchalik hisob shartnoma va maxfiylik majburiyati imzolangandan keyin, aniq muddat va cheklangan huquq bilan ochiladi."
      ]},
      {n: "4. Foydalanuvchining majburiyatlari", r: [
        "Ish o'rnini qulflanmagan holda tashlab ketmaslik. Sessiya 30 daqiqa harakatsizlikdan keyin va har holda 8 soatdan so'ng yopiladi.",
        "Parolni faqat o'zi bilishi; oshkor bo'lganidan shubha tug'ilsa, darhol almashtirish va administratorga xabar berish.",
        "Tizimga faqat haqiqiy ma'lumot kiritish: dalolatnoma raqami, sana, summa va surat asl hujjatga mos bo'lishi shart.",
        "Ko'rik va inventarizatsiya suratlarini o'sha obyektda, o'sha kuni olish; eski suratni qayta ishlatmaslik.",
        "Xatoni yashirmaslik. Noto'g'ri yozuv o'chirilmaydi — u tuzatiladi, sabab izohda qoladi va tarixda ko'rinadi."
      ]},
      {n: "5. Taqiqlanadi", r: [
        "Login va parolni berish yoki boshqa xodim hisobi ostida ishlash.",
        "Ekran suratini, nusxani yoki eksport faylini bank konturidan tashqariga chiqarish: messenjer, shaxsiy pochta, shaxsiy bulut, tashqi xotira.",
        "Ma'lumotni shaxsiy manfaat, uchinchi shaxs yoki savdo maqsadida ishlatish.",
        "Huquqlarni chetlab o'tishga urinish: boshqa rolning sahifasini ochish, so'rovni qo'lda yasash, sahifa kodini o'zgartirish.",
        "Uchinchi tomon kengaytmalari, ma'lumot yig'uvchi skript va avtomatik vositalarni ulash.",
        "Soxta yozuv kiritish yoki boshqa xodimning tasdig'ini taqlid qilish."
      ]},
      {n: "6. Nazorat va amallar tarixi", p: [
        "Har bir kiritish, o'zgartirish va o'chirish amallar tarixiga tushadi: kim, qachon, qaysi yozuvning qaysi maydonini qaysi qiymatdan qaysi qiymatga o'zgartirgani. Kirish va muvaffaqiyatsiz kirish urinishi ham yoziladi.",
        "Tarixni foydalanuvchi o'chira olmaydi. U xizmat tekshiruvi va nizolarda dalil sifatida ishlatiladi.",
        "Pul va huquqqa ta'sir qiladigan qarorlar “to'rt ko'z” qoidasi bilan rasmiylashtiriladi: so'rovni bir xodim yuboradi, ikkinchisi tasdiqlaydi. O'z so'rovini o'zi tasdiqlash tizim darajasida taqiqlangan."
      ]},
      {n: "7. Ma'lumot kimga tegishli", p: [
        "Tizimdagi barcha yozuv, hujjat, surat va eksport fayli Bank mulki hisoblanadi hamda bank siriga kiradi.",
        "Mehnat munosabatlari tugagan kuni hisob yopiladi. Foydalanuvchi ma'lumot nusxasini o'zida saqlab qolmaydi va uni qaytarish yoki yo'q qilish majburiyatini oladi."
      ]},
      {n: "8. Javobgarlik", p: [
        "Shartlarning buzilishi intizomiy javobgarlikka, yetkazilgan zarar uchun moddiy javobgarlikka, qonunda nazarda tutilgan hollarda esa ma'muriy va jinoiy javobgarlikka olib keladi. Bank siriga kiruvchi ma'lumotni oshkor qilish alohida javobgarlikka sabab bo'ladi.",
        "Bank uzluksiz ishlashni kafolatlamaydi: rejali texnik ishlar o'tkaziladi, aloqa uzilishi va tashqi tizimlarning javob bermasligi mumkin.",
        "Tizim ko'rsatkichlari qaror uchun asos bo'ladi, biroq yakuniy hujjat dalolatnoma, shartnoma yoki buyruq bilan rasmiylashtiriladi."
      ]},
      {n: "9. Shartlarning o'zgarishi", p: [
        "Bank shartlarni bir tomonlama yangilashga haqli. Tahrir o'zgarganda keyingi kirishda rozilik qaytadan so'raladi, eski tahrirdagi aksept esa tarixda qoladi."
      ]},
      {n: "10. Kimga murojaat qilinadi", p: [
        "Hisob, huquq va texnik nosozliklar — Axborot texnologiyalari departamenti xizmat stoli. Huquqiy savollar — Yuridik departament. Shaxsga doir ma'lumotlar — Bankning shaxsga doir ma'lumotlar himoyasi bo'yicha mas'ul xodimi.",
        "Aloqa ma'lumotlari bankning ichki portalida e'lon qilinadi."
      ]}
    ]
  },
  ru: {
    sarlavha: "Публичная оферта и условия использования",
    ost: "Система «Контроль балансовых активов»",
    tahrir: "Редакция " + TAHRIR + " · действует с " + SANA,
    bandlar: [
      {n: "1. Предмет оферты", p: [
        "АКБ «Микрокредитбанк» (далее — Банк) настоящей офертой объявляет условия использования системы «Контроль балансовых активов» (далее — Система).",
        "Система ведёт активы, перешедшие на баланс банка в результате взыскания, — недвижимость, транспорт, оборудование и инвентарь — со дня приёма на баланс до списания: реестр, оформление прав, оценка, осмотр, охрана, страхование, аренда, реализация и отчётность.",
        "Система не ведёт бухгалтерский учёт. Официальный учёт остаётся в автоматизированной банковской системе, а Система контролирует физическое состояние актива и полноту документов."
      ]},
      {n: "2. Акцепт оферты", p: [
        "Отметка на странице входа и нажатие кнопки «Войти» являются акцептом. С этого момента оферта и уведомление о конфиденциальности обязательны для пользователя.",
        "При акцепте фиксируются логин учётной записи, редакция документа и дата принятия. Сотрудник, не принявший условия, в Систему не входит: иного порядка не предусмотрено."
      ]},
      {n: "3. Кто пользуется", p: [
        "Учётную запись открывает и закрывает только департамент информационных технологий. Права выдаются по должности: руководство, менеджер объекта, инспектор осмотра и безопасности, бухгалтерия и риск, администратор.",
        "Учётная запись персональна. Логин и пароль не передаются, общая запись на отдел не открывается.",
        "Сотруднику подрядчика временная запись открывается после подписания договора и обязательства о конфиденциальности — на конкретный срок и с ограниченными правами."
      ]},
      {n: "4. Обязанности пользователя", r: [
        "Не оставлять рабочее место незаблокированным. Сессия закрывается после 30 минут без действий и в любом случае через 8 часов.",
        "Знать пароль единолично; при подозрении на раскрытие немедленно сменить его и сообщить администратору.",
        "Вносить только достоверные данные: номер акта, дата, сумма и снимок должны соответствовать оригиналу документа.",
        "Снимки осмотра и инвентаризации делать на самом объекте и в тот же день; повторно использовать старые снимки запрещено.",
        "Не скрывать ошибку. Неверная запись не удаляется — она исправляется, причина остаётся в примечании и видна в истории."
      ]},
      {n: "5. Запрещается", r: [
        "Передавать логин и пароль или работать под учётной записью другого сотрудника.",
        "Выносить снимок экрана, копию или файл выгрузки за контур банка: мессенджер, личная почта, личное облако, внешний носитель.",
        "Использовать данные в личных интересах, в интересах третьих лиц или в коммерческих целях.",
        "Пытаться обойти права доступа: открывать страницы чужой роли, формировать запросы вручную, изменять код страницы.",
        "Подключать сторонние расширения, скрипты сбора данных и средства автоматизации.",
        "Вносить недостоверные записи или имитировать утверждение другого сотрудника."
      ]},
      {n: "6. Контроль и история действий", p: [
        "Каждое внесение, изменение и удаление попадает в историю действий: кто, когда, в какой записи, какое поле и с какого значения на какое изменил. Вход и неудачная попытка входа также фиксируются.",
        "Историю пользователь удалить не может. Она используется как доказательство при служебных проверках и спорах.",
        "Решения, влияющие на деньги и права, оформляются по правилу «четырёх глаз»: запрос направляет один сотрудник, утверждает другой. Утверждение собственного запроса запрещено на уровне системы."
      ]},
      {n: "7. Кому принадлежат данные", p: [
        "Все записи, документы, снимки и файлы выгрузки в Системе являются собственностью Банка и составляют банковскую тайну.",
        "В день прекращения трудовых отношений учётная запись закрывается. Пользователь не оставляет у себя копий данных и обязуется вернуть либо уничтожить их."
      ]},
      {n: "8. Ответственность", p: [
        "Нарушение условий влечёт дисциплинарную ответственность, материальную — за причинённый ущерб, а в предусмотренных законом случаях административную и уголовную. Раскрытие сведений, составляющих банковскую тайну, влечёт отдельную ответственность.",
        "Банк не гарантирует непрерывную работу: проводятся плановые технические работы, возможны обрывы связи и отсутствие ответа внешних систем.",
        "Показатели Системы служат основанием для решения, но окончательный документ оформляется актом, договором или приказом."
      ]},
      {n: "9. Изменение условий", p: [
        "Банк вправе обновить условия в одностороннем порядке. При смене редакции согласие запрашивается заново при следующем входе, а акцепт прежней редакции остаётся в истории."
      ]},
      {n: "10. Куда обращаться", p: [
        "Учётная запись, права и технические сбои — служба поддержки департамента информационных технологий. Правовые вопросы — юридический департамент. Персональные данные — ответственный сотрудник Банка по защите персональных данных.",
        "Контактные данные публикуются на внутреннем портале банка."
      ]}
    ]
  }};

  const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  const varaq = document.getElementById("hujjat");
  const tilJoy = document.getElementById("til-almash");
  function chiz(){
    const ru = joriyTil() === "ru";
    const t = ru ? MATN.ru : MATN.uz;
    document.documentElement.lang = ru ? "ru" : "uz";
    document.title = "MKB — " + t.sarlavha;
    document.getElementById("juft").textContent = ru ? JUFT.ru : JUFT.uz;
    varaq.innerHTML =
      "<h1>" + esc(t.sarlavha) + "</h1>" +
      '<p class="h-ost">' + esc(t.ost) + "</p>" +
      '<p class="h-tahrir"><svg class="ic"><use href="#ik-hujjat"/></svg><span>' + esc(t.tahrir) + "</span></p>" +
      t.bandlar.map(b =>
        '<section class="h-band"><h2>' + esc(b.n) + "</h2>" +
        (b.p || []).map(x => "<p>" + esc(x) + "</p>").join("") +
        (b.r ? "<ul>" + b.r.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "") +
        "</section>").join("");
    tilJoy.querySelectorAll("button").forEach(b => {
      const f = b.dataset.til === (ru ? "ru" : "uz");
      b.classList.toggle("faol", f);
      b.setAttribute("aria-pressed", String(f));
    });
  }
  chiz();
  tilJoy.addEventListener("click", e => {
    const b = e.target.closest("button[data-til]");
    if (!b) return;
    try{ localStorage.setItem("mkb-til", b.dataset.til); }catch(_){ }
    chiz();
    tarjimaQil();
  });
  /* Ortga: hujjat tizim ichidan ochilgan bo'lsa — o'sha sahifaga, aks holda kirish sahifasiga */
  const ortga = document.getElementById("ortga");
  const kel = document.referrer;
  if (kel && kel.indexOf(location.origin) === 0 && !/\/(kirish|oferta|maxfiylik)\.html/.test(kel) && history.length > 1){
    document.getElementById("ortga-matn").textContent = "Orqaga";
    ortga.addEventListener("click", e => { e.preventDefault(); history.back(); });
  }
})();
</script>
</body>
</html>
