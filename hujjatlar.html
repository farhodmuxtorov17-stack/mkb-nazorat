<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Hujjatlar markazi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082800">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="hujjat">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Hujjatlar</span></div>
    <div class="hs-qator"><h1>Hujjatlar markazi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="hujjatlar.html" class="faol">Markaz</a><a href="hujjat-shablonlar.html">Shablonlar</a><a href="hujjat-yuklash.html">Yuklash</a><a href="hujjat-imzolash.html">Imzolash</a></nav>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082800"></script>
<script src="malumot.js?v=26082800"></script>
<script src="malumot-qoshimcha.js?v=26082800"></script>
<script src="malumot-kengaytma.js?v=26082800"></script>
<script src="malumot-kirish.js?v=26082800"></script>
<script src="malumot-indeks.js?v=26082800"></script>
<script src="tarjima.js?v=26082800"></script>
<script src="yadro/ikonlar.js?v=26082800"></script>
<script src="yadro/daraxt.js?v=26082800"></script>
<script src="yadro/chizma.js?v=26082800"></script>
<script src="yadro/qollanma.js?v=26082800"></script>
<script src="yadro/api.js?v=26082800"></script>
<script src="yadro/app.js?v=26082800"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("HUJJATLAR");
  document.getElementById("hs-meta").textContent = r.length + " ta hujjat omborda";
  MKB.jadval("jadval-joy", {
    qatorlar: r,
    qidiruv: ["nom", "obyektId", "tur"],
    filtrlar: [
      {kalit: "tur", nom: "Turi", variantlar: [...new Set(r.map(h => h.tur))]},
      {kalit: "holat", nom: "Holat", variantlar: [...new Set(r.map(h => h.holat))]},
    ],
    ustunlar: [
      {kalit: "nom", nom: "Hujjat", chiz: h =>
        '<span class="obyekt-katak"><span style="width:36px;height:36px;border-radius:14px;background:var(--varaq-2);display:grid;place-items:center;font:700 9px var(--shrift);color:var(--qalam)">' +
        (h.teg || "PDF").slice(0, 4).toUpperCase() + '</span>' +
        '<span><span class="nom">' + h.nom + '</span><br><span class="sub kod-mono">' + (h.obyektId || "") + '</span></span></span>'},
      {kalit: "tur", nom: "Turi"},
      {kalit: "sana", nom: "Sana"},
      {kalit: "hajm", nom: "Hajm", son: true},
      {kalit: "holat", nom: "Holat", chiz: h => '<span class="chip ' +
        (h.holat === "Tasdiqlangan" ? "chip-yashil" : "chip-sariq") + '">' + h.holat + '</span>'},
    ],
    bosilganda: h => location.href = "hujjat.html?id=" + encodeURIComponent(h.id),
  });
});
</script>
</body>
</html>
