<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Xaritada</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css?v=26092200">
<style>
.xarita-asbob{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xarita-asbob .izoh{font-size:13px;color:var(--matn-3);margin-left:auto}
.xarita-qobiq{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:stretch}
.xarita-karta{position:relative;background:var(--oq);border-radius:var(--r-karta);overflow:hidden;box-shadow:var(--soya);min-height:max(60vh,560px)}
#leaflet-joy{position:absolute;inset:0;z-index:1}
.xarita-yon{display:flex;flex-direction:column;gap:16px;min-width:0;max-height:max(60vh,560px);overflow-y:auto;padding:22px}
.xarita-yon h3{font:500 15px var(--shrift-displey);letter-spacing:-.01em;margin-bottom:8px}
.legenda{list-style:none;display:flex;flex-direction:column;gap:2px}
.legenda button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border-radius:12px;font-size:13.5px;text-align:left;transition:background var(--tez),opacity var(--tez)}
.legenda button:hover{background:var(--plitka)}
.legenda button[aria-pressed="false"]{opacity:.4}
.legenda i{width:12px;height:12px;border-radius:99px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(11,11,10,.25)}
.legenda b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.taxminiy-royxat{list-style:none;display:flex;flex-direction:column;font-size:13px}
.taxminiy-royxat li{display:flex;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--chiziq-2)}
.taxminiy-royxat li:last-child{border-bottom:0}
.taxminiy-royxat a{min-width:0;flex:1;align-self:stretch;line-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taxminiy-royxat a:hover{text-decoration:underline}
.taxminiy-royxat .tahrir{flex:none;color:var(--matn-3);display:inline-flex;align-items:center;min-height:40px;line-height:1.3;gap:4px;font-size:12.5px}
.yon-izoh{font-size:12.5px;color:var(--matn-3);line-height:1.45}
.hudud-royxat{display:flex;flex-direction:column}
.hudud-band{display:flex;align-items:center;gap:9px;width:100%;min-height:40px;padding:6px 10px;border-radius:12px;font-size:13.5px;text-align:left}
.hudud-band:hover{background:var(--plitka)}
.hudud-band.faol{background:var(--siyoh);color:#fff}
.hudud-band b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.leaflet-container{font-family:var(--shrift);background:var(--plitka)}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important}
.leaflet-popup-content-wrapper{border-radius:18px}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.xp{display:flex;flex-direction:column;gap:6px;font-size:13px}
.xp .xp-surat{width:100%;height:110px;border-radius:12px;overflow:hidden;background:var(--plitka)}
.xp .xp-surat img,.xp .xp-surat .surat-yoq{width:100%;height:100%;object-fit:cover}
.xp b{font-size:14px;font-weight:500}
.xp .xp-qator{display:flex;justify-content:space-between;gap:10px;color:var(--matn-2)}
.xp .xp-qator span:last-child{font-weight:500;color:var(--siyoh);text-align:right}
.xp a.tugma{margin-top:4px;color:#fff}
.klaster-belgi{display:grid;place-items:center;border-radius:999px;background:rgba(255,255,255,.85);border:2px dashed var(--matn-2);
  font:600 13px var(--shrift);color:var(--siyoh)}
/* Aniq joydagi obyekt: klaviatura bilan tanlanadigan belgi (Leaflet marker, Enter popupni ochadi) */
/* Ko'rinishi 16px, teginish maydoni 40px: divIcon 40x40, belgi markazda (margin) */
.nuqta-belgi{width:16px;height:16px;margin:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(11,11,10,.35);opacity:.95}
.leaflet-marker-icon:focus-visible{outline:2px solid var(--siyoh);outline-offset:3px;border-radius:999px}
.leaflet-marker-icon:focus-visible:has(.nuqta-belgi){outline:none}
.leaflet-marker-icon:focus-visible .nuqta-belgi{outline:2px solid var(--siyoh);outline-offset:3px}
.varaq-tugma{display:none}
@media (max-width:1100px){
  .xarita-qobiq{grid-template-columns:minmax(0,1fr)}
  .xarita-yon{max-height:none}
}
@media (max-width:720px){
  .xarita-asbob .izoh{margin-left:0;flex:1 1 100%}
  .xarita-karta{min-height:62vh}
  .varaq-tugma{display:inline-flex;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:500}
  .xarita-yon{position:fixed;left:0;right:0;bottom:0;z-index:900;max-height:72vh;border-radius:24px 24px 0 0;
    transform:translateY(105%);transition:transform var(--sekin);box-shadow:var(--soya-suzuvchi);padding:14px 18px 24px}
  .xarita-yon.ochiq{transform:none}
  .xarita-yon::before{content:"";display:block;width:44px;height:5px;border-radius:99px;background:var(--chiziq-3);margin:0 auto 6px;flex:none}
  .varaq-parda{position:fixed;inset:0;background:rgba(20,16,14,.3);z-index:899;display:none}
  .varaq-parda.ochiq{display:block}
}
</style>
</head>

<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="obyektlar.html">Balans aktivlari</a><span class="ajratgich">/</span><span>Xaritada</span></div>

  <div class="xarita-qobiq">
    <div class="xarita-karta" data-sayohat="xarita">
      <div id="leaflet-joy" role="region" aria-label="Xarita"></div>
      <button type="button" class="tugma tugma-asosiy tugma-kichik varaq-tugma" id="varaq-tugma" aria-controls="xarita-yon" aria-expanded="false"><svg class="ic"><use href="#ik-filtr"/></svg>Legenda va ro'yxat</button>
    </div>
    <aside class="karta xarita-yon" id="xarita-yon" aria-label="Legenda">
      <section data-sayohat="legenda"><h3 id="legenda-sar">Legenda</h3><ul class="legenda" id="legenda"></ul></section>
      <section data-sayohat="hududlar"><h3>Hududlar</h3><div class="hudud-royxat" id="hudud-royxat"></div></section>
      <section id="taxminiy-blok" data-sayohat="taxminiy"></section>
    </aside>
  </div>
  <div class="varaq-parda" id="varaq-parda"></div>

<script src="malumot-kirish.js?v=26092200"></script>

<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>

<script>
MKB.sahifaYukla({
  joylar: {"legenda": ["qator", 4], "hudud-royxat": ["qator", 5]},
  xato: "Xarita ma'lumotini yuklab bo'lmadi",
  ish: async () => {
  if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
  if (!window.L) throw new Error("Xarita kutubxonasi yuklanmadi. Sahifani yangilang");
  if (window.MKB_XARITA) return;
  const D = MKB_DATA;
  const esc = MKB.esc;
  const HK = D.HUDUD_KODLAR || {};
  const yozaOladi = MKB.huquq("yoz") && MKB.ruxsat("obyekt-tahrir.html");

  const uslub = getComputedStyle(document.documentElement);
  const tokenRang = nom => uslub.getPropertyValue(nom).trim() || "#B6B2AC";   /* zaxira: --matn-4 ning qiymati */

  /* ---------- Qatlamlar: rang va toifa ---------- */
  const QATLAMLAR = {
    /* Umidsiz toifa 3 yildan oshganlarni ham o'z ichiga oladi (zaxira hisobidagi kabi). Ular legenda ostida alohida sanaladi. */
    muddat: {nom: "Muddat holati", toifalar: ["imtiyozda", "normal", "xavf-90", "umidsiz", "kiritilmagan"]
      .map(k => ({kalit: k, nom: D.MUDDAT_HOLATLARI[k].nom, rang: D.MUDDAT_HOLATLARI[k].rang})),
      toifa: y => { const h = D.muddatHisobi(y).holat; return h === "3-yildan-oshgan" ? "umidsiz" : h; }},
    /* Ranglar app.css dagi --qoriq-* tokenlaridan (qoriqlash.html grafigi ham shularni o'qiydi).
       Leaflet fillColor ni SVG atributiga yozadi, u yerda var() yechilmaydi, shuning uchun xom qiymat olinadi */
    qoriqlash: {nom: "Qo'riqlash", toifalar: (D.QORIQLASH_TURLARI || []).map(t => ({kalit: t.kalit, nom: t.nom, rang: tokenRang("--qoriq-" + t.kalit)}))
      .concat([{kalit: "yoq", nom: "Qo'riqlanmaydi", rang: tokenRang("--qoriq-yoq")}]),
      toifa: y => {
        const t = y.himoya && y.himoya.qoriqlashTuri;
        if (t) return t;
        const q = (D.QORIQLASH || []).find(q => q.obyektId === y.id && q.holat === "amalda");
        return q && q.qoriqlashTuri ? q.qoriqlashTuri : "yoq";
      }},
    kommunal: {nom: "Kommunal", toifalar: [
      {kalit: "ulangan", nom: "Hammasi ulangan", rang: "var(--yashil)"}, {kalit: "uzilgan", nom: "Uzilgan xizmat bor", rang: "var(--xavf-matn-yorqin)"},
      {kalit: "noaniq", nom: "Holati kiritilmagan", rang: "var(--matn-3)"}, {kalit: "binosiz", nom: "Bino emas", rang: "var(--matn-4)"}],
      toifa: y => {
        if (!D.binolimi(y)) return "binosiz";
        const k = (y.kommunal || []).filter(x => x && x.holat && x.holat !== "mavjud emas");
        if (k.some(x => x.holat === "uzilgan" || x.holat === "vaqtincha to'xtatilgan")) return "uzilgan";
        return k.length && k.every(x => x.holat === "ulangan") ? "ulangan" : "noaniq";
      }},
  };
  const url = new URLSearchParams(location.search);
  /* Qatlam, yashirilgan toifalar va hudud xodim bo'yicha eslab qolinadi; havoladagi ?qatlam= ustun turadi */
  const SOZ = MKBapi.kalit("mkb4-xarita:" + ((MKBapi.sessiya() || {}).login || "-"));
  let soz = {};
  try{ soz = JSON.parse(localStorage.getItem(SOZ) || "{}") || {}; }catch(_){ soz = {}; }
  const qatlam0 = QATLAMLAR[url.get("qatlam")] ? url.get("qatlam") : QATLAMLAR[soz.qatlam] ? soz.qatlam : "muddat";
  const holat = {qatlam: qatlam0, yashirin: new Set(qatlam0 === soz.qatlam && Array.isArray(soz.yashirin) ? soz.yashirin : []), hudud: soz.hudud || null};
  const eslab = () => { try{ localStorage.setItem(SOZ, JSON.stringify({qatlam: holat.qatlam, yashirin: [...holat.yashirin], hudud: holat.hudud})); }catch(_){ } };

  const obyektlar = MKB.doira((D.YOZUVLAR || []).filter(y => y.holat !== "Chiqarildi"));
  const aniq = obyektlar.filter(y => y.joy && y.joy.aniq && isFinite(y.joy.lat) && isFinite(y.joy.lng));
  const taxminiy = obyektlar.filter(y => !aniq.includes(y));
  const hududKod = y => y.hududKod || D.hududKodi(y.hudud) || null;

  /* ---------- Xarita ---------- */
  const xarita = L.map("leaflet-joy", {zoomControl: false, attributionControl: true, scrollWheelZoom: true}).setView([41.3, 64.6], 6);
  window.MKB_XARITA = xarita;
  L.control.zoom({zoomInTitle: "Kattalashtirish", zoomOutTitle: "Kichraytirish"}).addTo(xarita);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(xarita);
  const nuqtaQatlam = L.layerGroup().addTo(xarita);
  const klasterQatlam = L.layerGroup().addTo(xarita);

  function popupHTML(y){
    const m = D.muddatHisobi(y);
    const muddat = m.kiritilmagan ? "Balans sanasi kiritilmagan" : m.qolganKun > 0 ? m.qolganKun + " kun" : (D.MUDDAT_HOLATLARI[m.holat] || {}).nom;
    return '<div class="xp"><div class="xp-surat">' + MKB.obyektSurati(y, {kichik: true}) + "</div>" +
      "<b>" + esc(y.qisqa || y.nom) + '</b><span class="kod-mono" data-tarjimasiz>' + esc(y.id) + "</span>" +
      '<div class="xp-qator"><span>Balans qiymati</span><span data-tarjimasiz>' + esc(MKB.pul(y.balans && y.balans.qiymat)) + "</span></div>" +
      '<div class="xp-qator"><span>Umidsizgacha</span><span>' + esc(muddat) + "</span></div>" +
      '<div class="xp-qator"><span>Holat</span><span>' + esc(y.holat || "") + "</span></div>" +
      '<a class="tugma tugma-asosiy tugma-kichik" href="obyekt.html?id=' + encodeURIComponent(y.id) + '">Kartani ochish</a></div>';
  }

  function toifaRang(q, k){ const t = QATLAMLAR[q].toifalar.find(t => t.kalit === k); return MKB.rangQiymat(t ? t.rang : "var(--matn-4)"); }

  function chiz(){
    const Q = QATLAMLAR[holat.qatlam];
    nuqtaQatlam.clearLayers();
    klasterQatlam.clearLayers();
    const koringan = y => !holat.yashirin.has(Q.toifa(y)) && (!holat.hudud || hududKod(y) === holat.hudud);
    let soni = 0;
    aniq.filter(koringan).forEach(y => {
      soni++;
      /* divIcon marker: Leaflet unga tabindex va role="button" beradi; nomi ekran o'quvchi uchun belgi ichida */
      L.marker([y.joy.lat, y.joy.lng], {icon: L.divIcon({className: "", iconSize: [40, 40],
          html: '<span class="sr-only" data-tarjimasiz>' + esc(y.qisqa || y.nom) + '</span><div class="nuqta-belgi" aria-hidden="true" style="background:' + toifaRang(holat.qatlam, Q.toifa(y)) + '"></div>'}), zIndexOffset: 1000})
        .bindPopup(() => { const d = document.createElement("div"); d.innerHTML = popupHTML(y); tarjimaQil(d); return d; }, {maxWidth: 280})
        .addTo(nuqtaQatlam);
    });
    /* koordinatasiz obyektlar: hudud markazida bitta "taxminiy joy" belgisi */
    const guruh = {};
    taxminiy.filter(koringan).forEach(y => { const k = hududKod(y) || "?"; (guruh[k] = guruh[k] || []).push(y); });
    Object.keys(guruh).forEach(k => {
      const h = HK[k];
      if (!h) return;
      const r = guruh[k];
      const o = Math.min(64, 34 + r.length * 2);
      /* Tugma nomi faqat son bo'lmasin: hudud, obyektlar soni va joy taxminiy ekani o'qiladi */
      L.marker([h.lat, h.lng], {icon: L.divIcon({className: "", iconSize: [o, o],
          html: '<span class="sr-only"><span>' + esc(h.toliq) + '</span>: <span data-tarjimasiz>' + r.length + '</span> <span>ta obyekt, taxminiy joy</span></span>' +
            '<div class="klaster-belgi" aria-hidden="true" style="width:' + o + "px;height:" + o + 'px" data-tarjimasiz>' + r.length + "</div>"}),
        title: "Taxminiy joy"})
        .bindPopup('<div class="xp"><b>' + esc(h.toliq) + "</b><span>Taxminiy joy: aniq koordinata kiritilmagan</span>" +
          '<div class="xp-qator"><span>Obyektlar</span><span data-tarjimasiz>' + r.length + "</span></div>" +
          '<div class="xp-qator"><span>Balans qiymati</span><span data-tarjimasiz>' + esc(MKB.pul(r.reduce((s, y) => s + ((y.balans && y.balans.qiymat) || 0), 0))) + "</span></div></div>")
        .addTo(klasterQatlam);
    });
    const tx = Object.values(guruh).reduce((s, r) => s + r.length, 0);
    document.getElementById("hs-meta").innerHTML = '<span>Aniq joyda</span> <b data-tarjimasiz>' + soni + "</b>" +
      (tx ? ' · <span>taxminiy joyda</span> <b data-tarjimasiz>' + tx + "</b>" : "");
    document.getElementById("xarita-izoh").textContent = taxminiy.length
      ? "Uzuq chiziqli doira: koordinatasi kiritilmagan obyektlar, hudud markazida jamlangan."
      : "Barcha obyektlar aniq koordinata bilan chizilgan.";
    legendaChiz();
    tarjimaQil(document.querySelector(".kontent"));
  }

  function legendaChiz(){
    const Q = QATLAMLAR[holat.qatlam];
    const hisob = {};
    obyektlar.filter(y => !holat.hudud || hududKod(y) === holat.hudud).forEach(y => { const k = Q.toifa(y); hisob[k] = (hisob[k] || 0) + 1; });
    document.getElementById("legenda-sar").textContent = Q.nom;
    const el = document.getElementById("legenda");
    el.innerHTML = Q.toifalar.filter(t => hisob[t.kalit]).map(t =>
      '<li><button type="button" data-toifa="' + t.kalit + '" aria-pressed="' + !holat.yashirin.has(t.kalit) + '">' +
      '<i style="background:' + t.rang + '"></i><span>' + esc(t.nom) + '</span><b data-tarjimasiz>' + hisob[t.kalit] + "</b></button></li>").join("") ||
      "<li>" + MKB.boshHolat("xarita", "Obyekt yo'q") + "</li>";
    if (holat.qatlam === "muddat") {
      const uchYil = obyektlar.filter(y => (!holat.hudud || hududKod(y) === holat.hudud) && D.muddatHisobi(y).holat === "3-yildan-oshgan").length;
      if (uchYil) el.insertAdjacentHTML("beforeend", '<li class="maydon-izoh" style="padding:6px 10px"><span>Umidsiz toifa ichida 3 yildan oshgan aktivlar:</span> <b data-tarjimasiz>' + uchYil + " ta</b></li>");
    }
    el.querySelectorAll("[data-toifa]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.toifa;
      if (holat.yashirin.has(k)) holat.yashirin.delete(k); else holat.yashirin.add(k);
      eslab();
      chiz();
      const y = document.querySelector('#legenda [data-toifa="' + k + '"]'); if (y) y.focus();
    }));
  }

  /* Ko'rinish oynasi: aniq nuqtalar va koordinatasiz obyektlar jamlangan hudud markazlari birga (hudud tanlansa, faqat shu hudud) */
  function korinishNuqtalari(hudud){
    const bu = aniq.filter(y => !hudud || hududKod(y) === hudud).map(y => [y.joy.lat, y.joy.lng]);
    new Set(taxminiy.map(hududKod)).forEach(k => { if (HK[k] && (!hudud || k === hudud)) bu.push([HK[k].lat, HK[k].lng]); });
    if (hudud && HK[hudud] && !bu.length) bu.push([HK[hudud].lat, HK[hudud].lng]);
    return bu;
  }

  function hududChiz(){
    const s = {};
    obyektlar.forEach(y => { const k = hududKod(y) || "?"; s[k] = (s[k] || 0) + 1; });
    const el = document.getElementById("hudud-royxat");
    if (holat.hudud && !s[holat.hudud]) holat.hudud = null;
    el.innerHTML = '<button type="button" class="hudud-band' + (!holat.hudud ? " faol" : "") + '" data-hudud="" aria-pressed="' + !holat.hudud + '">Barcha hududlar<b data-tarjimasiz>' + obyektlar.length + "</b></button>" +
      Object.keys(s).filter(k => HK[k]).sort((a, b) => s[b] - s[a]).map(k =>
        '<button type="button" class="hudud-band' + (holat.hudud === k ? " faol" : "") + '" data-hudud="' + k + '" aria-pressed="' + (holat.hudud === k) + '">' + esc(HK[k].toliq) + '<b data-tarjimasiz>' + s[k] + "</b></button>").join("");
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-hudud]");
      if (!b) return;
      holat.hudud = b.dataset.hudud || null;
      eslab();
      el.querySelectorAll(".hudud-band").forEach(x => { x.classList.toggle("faol", x === b); x.setAttribute("aria-pressed", String(x === b)); });
      xarita.closePopup();
      const bu = korinishNuqtalari(holat.hudud);
      if (bu.length > 1) xarita.flyToBounds(bu, {padding: [40, 40], maxZoom: 12, duration: .6});
      else if (bu.length) xarita.flyTo(bu[0], 10, {duration: .6});
      chiz();
      varaqYop();
    });
    tarjimaQil(el);
  }

  function taxminiyChiz(){
    const el = document.getElementById("taxminiy-blok");
    if (!taxminiy.length){ el.innerHTML = ""; return; }
    el.innerHTML = '<h3><span>Koordinatasi kiritilmagan:</span> <span data-tarjimasiz>' + taxminiy.length + "</span> <span>ta</span></h3>" +
      '<p class="yon-izoh">Bu obyektlar xaritada aniq nuqta sifatida chizilmaydi. Koordinatani obyekt tahririda kiriting.</p>' +
      '<ul class="taxminiy-royxat">' + taxminiy.slice(0, 60).map(y =>
        '<li><a href="obyekt.html?id=' + encodeURIComponent(y.id) + '" title="' + esc(y.qisqa || y.nom) + '">' + esc(y.qisqa || y.nom) + "</a>" +
        (yozaOladi ? '<a class="tahrir" href="obyekt-tahrir.html?id=' + encodeURIComponent(y.id) + '">' + ik("tahrir") + "<span>Kiritish</span></a>" : "") + "</li>").join("") + "</ul>" +
      (taxminiy.length > 60 ? '<p class="yon-izoh"><span>Ro&#39;yxatda birinchi 60 tasi.</span> <a href="obyektlar.html" style="text-decoration:underline">Reyestrga o&#39;tish</a></p>' : "");
    tarjimaQil(el);
  }

  /* ---------- Pastki varaq (telefon) ---------- */
  const yon = document.getElementById("xarita-yon"), parda = document.getElementById("varaq-parda"), vt = document.getElementById("varaq-tugma");
  function varaqYop(){ yon.classList.remove("ochiq"); parda.classList.remove("ochiq"); vt.setAttribute("aria-expanded", "false"); }
  vt.addEventListener("click", () => { yon.classList.add("ochiq"); parda.classList.add("ochiq"); vt.setAttribute("aria-expanded", "true"); });
  parda.addEventListener("click", varaqYop);
  document.addEventListener("keydown", e => { if (e.key === "Escape") varaqYop(); });

  document.querySelectorAll("[data-qatlam]").forEach(b => b.addEventListener("click", () => {
    holat.qatlam = b.dataset.qatlam;
    holat.yashirin.clear();
    eslab();
    const p = new URLSearchParams(location.search);
    p.set("qatlam", holat.qatlam);
    history.replaceState(null, "", location.pathname + "?" + p.toString());
    qatlamTugmalari();
    chiz();
  }));
  function qatlamTugmalari(){
    document.querySelectorAll("[data-qatlam]").forEach(b => { const f = b.dataset.qatlam === holat.qatlam; b.classList.toggle("faol", f); b.setAttribute("aria-pressed", f); });
  }

  qatlamTugmalari();
  hududChiz();
  taxminiyChiz();
  chiz();
  const boshNuqtalar = korinishNuqtalari(holat.hudud);
  if (boshNuqtalar.length > 1) xarita.fitBounds(boshNuqtalar, {padding: [30, 30], maxZoom: holat.hudud ? 12 : 11});
  else if (boshNuqtalar.length) xarita.setView(boshNuqtalar[0], 10);
  setTimeout(() => xarita.invalidateSize(), 200);
  },
});
</script>
</body>
</html>
