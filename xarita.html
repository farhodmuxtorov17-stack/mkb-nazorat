<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Hududiy xarita</title>
<link rel="stylesheet" href="yadro/app.css?v=26082760">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<script src="assets/vendor/leaflet/leaflet.js"></script>
<style>
.xarita-karta{position:relative;background:var(--varaq);border:1px solid var(--chiziq-2);border-radius:var(--r-hero);overflow:hidden;min-height:520px}
#leaflet-joy{position:absolute;inset:0;z-index:1}
.xarita-yon{position:absolute;right:16px;top:16px;bottom:16px;width:270px;z-index:5;
  background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:1px solid var(--chiziq);
  border-radius:14px;padding:14px;overflow-y:auto}
.xarita-yon h3{font:700 13.5px var(--shrift);margin-bottom:8px}
.hudud-band{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:9px;font-size:12.5px;text-align:left;transition:background var(--tez)}
.hudud-band:hover{background:var(--band)}
.hudud-band.faol{background:var(--brend-fon)}
.hudud-band b{margin-left:auto;font:500 12.5px var(--shrift-mono)}
</style>
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="xarita">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Hududiy xarita</span></div>
    <div class="hs-qator"><h1>Hududiy xarita</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><a class="tugma tugma-oq" href="hisobot-hudud.html"><svg class="ic"><use href="#i-hisobot"/></svg>Hududiy hisobot</a></div></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="xarita.html" class="faol">Hududiy</a><a href="xarita-obyektlar.html">Obyektlar</a></nav>
  <div class="xarita-karta">
    <div id="leaflet-joy"></div>
    <aside class="xarita-yon"><h3>Hududlar</h3><div id="hudud-royxat"></div>
      <div style="border-top:1px solid var(--chiziq-2);margin:10px 0;padding-top:10px"><h3>Jami portfel</h3><b style="font:500 24px var(--shrift-displey)" id="xj-jami">—</b><span class="delta ijobiy" id="xj-delta" style="margin-left:8px"></span></div>
    </aside>
  </div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082760"></script>
<script src="malumot.js?v=26082760"></script>
<script src="malumot-qoshimcha.js?v=26082760"></script>
<script src="malumot-kengaytma.js?v=26082760"></script>
<script src="malumot-kirish.js?v=26082760"></script>
<script src="malumot-indeks.js?v=26082760"></script>
<script src="tarjima.js?v=26082760"></script>
<script src="yadro/ikonlar.js?v=26082760"></script>
<script src="yadro/daraxt.js?v=26082760"></script>
<script src="yadro/chizma.js?v=26082760"></script>
<script src="yadro/qollanma.js?v=26082760"></script>
<script src="yadro/api.js?v=26082760"></script>
<script src="yadro/app.js?v=26082760"></script>
<script>
document.addEventListener("mkb:tayyor", () => {
  const HUDUD_MARKAZ = {"Toshkent shahri": [41.31, 69.28], "Toshkent viloyati": [41.0, 69.6],
    "Samarqand": [39.65, 66.96], "Namangan": [41.0, 71.67], "Buxoro": [39.77, 64.42],
    "Farg'ona": [40.38, 71.78], "Andijon": [40.78, 72.34], "Xorazm": [41.55, 60.63]};
  const xarita = L.map("leaflet-joy", {zoomControl: true, attributionControl: true}).setView([41.2, 66.9], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(xarita);
  const guruhlar = {};
  (MKB_DATA.XARITA_NUQTALARI || []).forEach(n => {
    (guruhlar[n.guruh] = guruhlar[n.guruh] || []).push(n);
    L.circleMarker([n.lat, n.lng], {radius: 7, color: "#0B0B0A", weight: 2,
      fillColor: "#C5F2B4", fillOpacity: .95})
      .addTo(xarita)
      .bindPopup("<b>" + n.nom + "</b><br>" + n.tur + " · " + n.holat);
  });
  const maks = Math.max(...MKB_DATA.HUDUDLAR.map(h => MKB.sonQiymat(h[1])));
  document.getElementById("hudud-royxat").innerHTML = MKB_DATA.HUDUDLAR.map(h =>
    '<button type="button" class="hudud-band" data-hudud="' + h[0] + '">' +
    '<span style="width:8px;height:8px;border-radius:99px;background:var(--siyoh);opacity:' + (0.3 + MKB.sonQiymat(h[1]) / maks * 0.7) + '"></span>' +
    h[0] + "<b>" + h[1] + "</b></button>").join("");
  document.getElementById("hudud-royxat").addEventListener("click", e => {
    const b = e.target.closest("[data-hudud]");
    if (!b) return;
    document.querySelectorAll(".hudud-band").forEach(x => x.classList.toggle("faol", x === b));
    const m = HUDUD_MARKAZ[b.dataset.hudud];
    if (m) xarita.flyTo(m, 9, {duration: .6});
  });
  document.getElementById("xj-jami").textContent =
    MKB.fmt(MKB_DATA.HUDUDLAR.reduce((a, h) => a + MKB.sonQiymat(h[1]), 0));
  document.getElementById("xj-delta").textContent = MKB_DATA.PORTFEL.delta && MKB_DATA.PORTFEL.delta.hudud || "↑ 5,4%";
});
</script>
</body>
</html>
