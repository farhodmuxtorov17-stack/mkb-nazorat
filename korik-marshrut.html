<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Inspektor marshrutlari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Ko'rik nazorati</span></div>
    <div class="hs-qator"><h1>Inspektor marshrutlari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html">Reja</a><a href="korik-kalendar.html">Kalendar</a><a href="korik-tarixi.html">Tarix</a><a href="korik-kechikkan.html">Kechikkanlar</a><a href="korik-marshrut.html" class="faol">Marshrutlar</a></nav>
  <div id="mr-royxat" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
function korikQatori(k){
  return '<a href="korik-akti.html?id=' + encodeURIComponent(k.id) + '" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--chiziq-2)">' +
    '<span style="width:38px;height:38px;border-radius:14px;background:' +
      (k.holat === "rejada" ? "var(--brend-fon)" : k.holat === "kechikkan" ? "var(--xavf-fon)" : "var(--yashil-fon)") +
      ';display:grid;place-items:center;color:' +
      (k.holat === "rejada" ? "var(--brend-quyuq)" : k.holat === "kechikkan" ? "var(--xavf-matn)" : "var(--yashil)") + '">' + ik("korik") + '</span>' +
    '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px">' + k.id + ' · ' + (k.tur || "Rejali") + '</b>' +
    '<span style="font-size:12.5px;color:var(--matn-3)">' + (k.obyektNomi || k.obyektId) + ' · ' + k.inspektor + '</span></span>' +
    '<span class="chip ' + (k.holat === "rejada" ? "chip-brend" : k.holat === "kechikkan" ? "chip-xavf" : "chip-yashil") + '">' + k.sana + '</span></a>';
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? (o.qisqa || o.nom) : id;
}
document.addEventListener("mkb:tayyor", async () => {
  const r = (await MKBapi.royxat("KORIKLAR")).filter(k => k.holat === "rejada");
  const guruh = {};
  r.forEach(k => (guruh[k.inspektor] = guruh[k.inspektor] || []).push(k));
  document.getElementById("hs-meta").textContent = Object.keys(guruh).length + " ta inspektor marshrutda";
  document.getElementById("mr-royxat").innerHTML = Object.entries(guruh).map(([inspektor, royxat]) =>
    '<section class="karta"><div class="karta-bosh">' +
      '<span style="width:38px;height:38px;border-radius:99px;background:var(--siyoh);color:var(--brend);display:grid;place-items:center;font:500 13px var(--shrift)">' +
      inspektor.split(" ").map(v => v[0]).join("").slice(0, 2) + '</span>' +
      '<h2 style="font-size:14.5px">' + inspektor + '</h2><span class="soni">' + royxat.length + ' nuqta</span></div>' +
      royxat.map((k, i) =>
        '<a href="korik-otkazish.html?id=' + encodeURIComponent(k.id) + '" style="display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid var(--chiziq-2)">' +
          '<span style="width:22px;height:22px;border-radius:99px;background:var(--brend);color:var(--siyoh);display:grid;place-items:center;font:700 11px var(--shrift);flex:none">' + (i + 1) + '</span>' +
          '<span style="flex:1;min-width:0"><b style="display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + obyektNomi(k.obyektId) + '</b>' +
          '<span style="font-size:12.5px;color:var(--matn-3)">' + k.sana + ' · ' + (k.tur || "Rejali") + '</span></span>' +
          ik("ong") + '</a>').join("") +
    '</section>').join("");
});
</script>
</body>
</html>
