<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Restrukturizatsiya arizalari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
</head>
<body data-sahifa="portfel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Restrukturizatsiya arizalari</span></div>
    <div class="hs-qator"><h1>Restrukturizatsiya arizalari</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><a class="tugma tugma-asosiy" href="restrukturizatsiya-arizasi.html"><svg class="ic"><use href="#i-qoshish"/></svg>Yangi ariza</a></div></div>
  </div>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("RESTRUKTURIZATSIYA");
  document.getElementById("hs-meta").textContent = r.length + " ta ariza";
  const HOLAT = {korib: ["chip-sariq", "Ko'rib chiqilmoqda"], kelishilgan: ["chip-yashil", "Kelishilgan"], rad: ["chip-xavf", "Rad etilgan"]};
  MKB.jadval("jadval-joy", {
    qatorlar: r.map(v => Object.assign({}, v, {holatNomi:
      v.holat === "kelishilgan" ? "Kelishilgan" : v.holat === "rad etilgan" ? "Rad etilgan" : "Ko'rib chiqilmoqda"})),
    qidiruv: ["mijoz", "shartnoma", "taklif"],
    filtrlar: [{kalit: "holatNomi", nom: "Holat", variantlar: ["Ko'rib chiqilmoqda", "Kelishilgan", "Rad etilgan"]}],
    ustunlar: [
      {kalit: "id", nom: "Ariza", chiz: q => '<span class="kod-mono">' + q.id + '</span>'},
      {kalit: "mijoz", nom: "Mijoz"},
      {kalit: "taklif", nom: "Taklif"},
      {kalit: "qarz", nom: "Qarz", son: true, chiz: q => '<span class="pul">' + q.qarz + '</span>'},
      {kalit: "sana", nom: "Sana"},
      {kalit: "holatNomi", nom: "Holat", chiz: q => '<span class="chip ' +
        (q.holatNomi === "Kelishilgan" ? "chip-yashil" : q.holatNomi === "Rad etilgan" ? "chip-xavf" : "chip-sariq") + '">' + q.holatNomi + '</span>'},
    ],
    bosilganda: q => location.href = "qarzdor.html?id=" + encodeURIComponent(q.obyektId),
  });
});
</script>
</body>
</html>
