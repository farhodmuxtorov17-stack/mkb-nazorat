<style>
.forma-bolim{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--matn-3);font-weight:600;margin:6px 0 -4px}
.forma-bolim:not(:first-child){margin-top:18px;padding-top:18px;border-top:1px solid var(--chiziq-2)}
.forma-tugmalar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.ozg-royxat{list-style:none;margin:0;padding:0;font-size:13px}
.ozg-royxat li{padding:10px 0;border-bottom:1px solid var(--chiziq-2);display:grid;gap:3px}
.ozg-royxat li:last-child{border-bottom:none}
.ozg-royxat b{font-weight:500}
.ozg-royxat span{color:var(--matn-3);overflow-wrap:anywhere}
.ozg-royxat del{color:var(--matn-4)}
/* Koordinatani xaritadan belgilash */
.ot-xarita{position:relative;height:316px;border-radius:var(--r-plitka);overflow:hidden;background:var(--plitka)}
#ot-leaflet{position:absolute;inset:0;z-index:1;cursor:crosshair}
.ot-xarita .leaflet-container{font-family:var(--shrift);background:var(--plitka)}
.ot-xarita .leaflet-control-zoom a{width:40px;height:40px;line-height:40px;font-size:20px}
.ot-xarita .leaflet-control-attribution{padding:2px 8px;border-radius:9px 0 0 0;font-size:9.5px;line-height:1.35;
  color:var(--matn-3);background:rgba(255,255,255,.9)}
.ot-xarita .leaflet-control-attribution a{color:var(--matn-2)}
.ot-amallar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ot-holat{display:block;margin-top:8px;font-size:12.5px;color:var(--matn-3)}
.ot-holat b{font-weight:500;color:var(--matn-2);font-variant-numeric:tabular-nums}
.ot-holat.xato{color:var(--xavf-matn-yorqin)}
.ot-holat.xato b{color:var(--xavf-matn-yorqin)}
@media (max-width:480px){.ot-xarita{height:260px}.ot-amallar .tugma{flex:1;justify-content:center}}
</style>
</head>

<script>
/* Koordinata maydonining matnlari. Lug'atda bo'lmagan kalitgina qo'shiladi:
   tarjima.js dagi yozuv ustun turadi (yadro/app.js bilan bir xil qoida). */
(function(){
  const L = window.MKB_LUGAT;
  if (!L || typeof L !== "object") return;
  const Y = {
    "Xaritada belgilash": "Отметить на карте",
    "Xaritani bosing: metka o'sha nuqtaga qo'yiladi": "Нажмите на карту: метка встанет в эту точку",
    "Metkani surib aniqlashtiring": "Уточните перетаскиванием метки",
    "Nuqta O'zbekiston chegarasidan tashqarida": "Точка за пределами Узбекистана",
    "Nuqta obyekt hududidan tashqarida": "Точка вне региона объекта",
    "Manzildagi tuman topilmadi": "Район из адреса не найден",
    "Xarita chegaralarini yuklab bo'lmadi": "Не удалось загрузить границы карты"
  };
  Object.keys(Y).forEach(k => { if (L[k] == null) L[k] = Y[k]; });
})();
</script>

<script>
MKB.sahifaYukla({joylar: {forma: ["qator", 8], ozgarishlar: ["qator", 3], oxirgi: ["qator", 3]}, xato: "Obyekt ma'lumotlarini yuklab bo'lmadi", ish: async () => {
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r));
  const forma = document.getElementById("forma");
  const D = MKB_DATA, esc = MKB.esc, ik = MKB.ik;
  const id = new URLSearchParams(location.search).get("id");
  const y = id ? D.topish(id) : null;
  if (!y || !MKB.doira([y]).length){ location.replace("xato-404.html"); return; }
  const q = encodeURIComponent(y.id);
  document.getElementById("hs-obyekt").innerHTML = '<a href="obyekt.html?id=' + q + '">' + esc(y.qisqa || y.nom) + "</a>";
  document.getElementById("hs-meta").textContent = y.id + (y.filial ? " · " + y.filial : "");
  document.getElementById("tarix-havola").href = "obyekt-tarix.html?id=" + q;
  MKB.fotoShapka(y, ".foto-shapka");

  const bugun = D.bugun();
  const iso = s => { const d = D.sanaOqi(s); return d ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") : ""; };
  /* Koordinata maydonlariga faqat aniq nuqta yoziladi. Tuman yoki viloyat markaziga qo'yilgan
     taxminiy joy (joy.aniq === false) bu yerda ko'rsatilmaydi: u xodim kiritgan koordinata emas,
     maydonda turgani esa uni aniq deb saqlashga olib keladi. */
  const b = y.balans || {}, h = y.huquq || {}, md = y.maydon || {};
  const joy = y.joy && y.joy.aniq ? y.joy : {};
  /* Lot, ijara, bo'lib to'lash va chiqim holatlari tegishli amal orqali o'rnatiladi */
  const QOLDA = ["Balansda", "Rasmiylashtirilmoqda", "Sotuvga tayyorlanmoqda"];
  const holatlar = D.HOLATLAR.filter(x => QOLDA.indexOf(x.nom) >= 0 || x.nom === y.holat);
  const xodimlar = Array.from(new Set((D.FOYDLAR || []).filter(f => f.faol !== false).map(f => f.nom).filter(Boolean))).sort();
  const filiallar = (D.FILIALLAR || []).slice().sort((a, c) => String(a.nom).localeCompare(String(c.nom)));

  const maydon = (nom, yorliq, html, opt) => {
    opt = opt || {};
    return '<div class="maydon' + (opt.keng ? " keng" : "") + '"' + (opt.guruh ? ' data-guruh="' + opt.guruh + '"' : "") + '><label class="maydon-yorliq" for="t-' + nom + '">' + yorliq + (opt.majburiy ? " <b>*</b>" : "") + "</label>" +
      '<div class="kirish">' + html + "</div>" + (opt.izoh ? '<span class="maydon-izoh">' + opt.izoh + "</span>" : "") + "</div>";
  };
  const inp = (nom, qiymat, attr) => '<input id="t-' + nom + '" name="' + nom + '" value="' + esc(qiymat == null ? "" : qiymat) + '"' + (attr || "") + ">";
  /* Son maydonlari matn ko'rinishida: formati (1 234,5) va tekshiruvi yadroda (data-format) */
  const son = (nom, qiymat, format, attr) => inp(nom, qiymat > 0 ? qiymat : "", ' data-format="' + format + '"' + (attr || ""));

  forma.innerHTML =
    '<div class="forma-tor">' +
    '<p class="forma-bolim keng">Asosiy</p>' +
    maydon("nom", "To'liq nomi", inp("nom", y.nom, ' maxlength="160" minlength="3" required data-xato="To\'liq nomini kiriting"'), {keng: true, majburiy: true}) +
    maydon("qisqa", "Qisqa nomi", inp("qisqa", y.qisqa, ' maxlength="60"')) +
    maydon("rasmTuri", "Turi", '<select id="t-rasmTuri" name="rasmTuri" required>' + D.TUR_KALITLAR.map(t =>
      '<option value="' + t.kalit + '"' + (t.kalit === y.rasmTuri ? " selected" : "") + ">" + esc(t.nom) + "</option>").join("") + "</select>", {majburiy: true}) +
    '<p class="forma-bolim keng">Joylashuv</p>' +
    maydon("manzil", "Manzil", inp("manzil", y.manzil, ' maxlength="200" required data-xato="Manzilni kiriting"'), {keng: true, majburiy: true}) +
    maydon("lat", "Kenglik", inp("lat", joy.lat, ' type="number" step="any" inputmode="decimal" placeholder="41.3111"'), {izoh: "37 dan 46 gacha"}) +
    maydon("lng", "Uzunlik", inp("lng", joy.lng, ' type="number" step="any" inputmode="decimal" placeholder="69.2797"'), {izoh: "55 dan 74 gacha"}) +
    '<div class="maydon keng" id="joy"><span class="maydon-yorliq">Xaritada belgilash</span>' +
      '<div class="ot-xarita"><div id="ot-leaflet" role="application" aria-label="Xaritada belgilash"></div></div>' +
      '<div class="ot-amallar">' +
        '<button type="button" class="tugma tugma-oq tugma-kichik" id="ot-markaz">' + ik("manzil") + "<span>Markazlash</span></button>" +
        '<button type="button" class="tugma tugma-oq tugma-kichik" id="ot-tozala">' + ik("yopish") + "<span>Tozalash</span></button>" +
      "</div><span class=\"ot-holat\" id=\"ot-holat\" role=\"status\"></span></div>" +
    '<p class="forma-bolim keng" data-guruh="bino">Maydon, m²</p>' +
    maydon("yer", "Yer maydoni", son("yer", md.yer, "kasr", ' min="0.1"'), {guruh: "bino"}) +
    maydon("qurilishOsti", "Qurilish osti", son("qurilishOsti", md.qurilishOsti, "kasr", ' min="0.1"'), {guruh: "bino"}) +
    maydon("foydali", "Foydali maydon", son("foydali", md.foydali, "kasr", ' min="0.1"'), {guruh: "bino"}) +
    '<p class="forma-bolim keng">Balans</p>' +
    maydon("qiymat", "Balans qiymati", son("qiymat", b.qiymat, "pul", ' min="0.01" required data-xato="Balans qiymatini kiriting"'), {majburiy: true}) +
    maydon("sana", "Balansga qabul sanasi", inp("sana", iso(b.sana), ' type="date" required data-xato="Balansga qabul sanasini kiriting" max="' + iso(D.sanaYoz(bugun)) + '"'), {majburiy: true}) +
    maydon("hisobvaraq", "Hisobvaraq", inp("hisobvaraq", b.hisobvaraq, ' inputmode="numeric" maxlength="5"'), {izoh: "5 xonali raqam"}) +
    '<p class="forma-bolim keng">Huquq</p>' +
    maydon("kadastrRaqami", "Kadastr raqami", inp("kadastrRaqami", h.kadastrRaqami, ' maxlength="40" placeholder="10:07:02:01:0105"'), {guruh: "bino"}) +
    maydon("davlatRaqami", "Davlat raqami", inp("davlatRaqami", h.davlatRaqami, ' maxlength="16" placeholder="01 A 123 BC"'), {guruh: "transport"}) +
    maydon("vin", "VIN yoki zavod raqami", inp("vin", h.vin, ' maxlength="30"'), {guruh: "binosiz"}) +
    '<p class="forma-bolim keng">Mas\'uliyat va holat</p>' +
    maydon("masul", "Mas'ul xodim", inp("masul", y.masul, ' list="xodimlar" maxlength="80"') +
      '<datalist id="xodimlar">' + xodimlar.map(n => '<option value="' + esc(n) + '">').join("") + "</datalist>") +
    maydon("filialKod", "Filial", '<select id="t-filialKod" name="filialKod" required>' + filiallar.map(f =>
      '<option value="' + esc(f.id) + '"' + (f.id === y.filialKod ? " selected" : "") + ">" + esc(f.nom) + "</option>").join("") + "</select>", {majburiy: true}) +
    maydon("holat", "Holat", '<select id="t-holat" name="holat">' + holatlar.map(x =>
      '<option value="' + esc(x.nom) + '"' + (x.nom === y.holat ? " selected" : "") + ">" + esc(x.nom) + "</option>").join("") + "</select>",
      {keng: true, izoh: "Lot, ijara va balansdan chiqarish holati tegishli amal orqali o'rnatiladi"}) +
    '<div class="maydon keng"><label class="maydon-yorliq" for="t-sabab">O\'zgarish sababi</label>' +
      '<textarea id="t-sabab" name="sabab" class="kirish-matn" maxlength="300" placeholder="Masalan: kadastr ko\'chirmasi bo\'yicha aniqlashtirildi"></textarea></div>' +
    "</div>" +
    '<div class="forma-tugmalar"><a class="tugma tugma-oq" href="obyekt.html?id=' + q + '">Bekor qilish</a>' +
    '<button type="submit" class="tugma tugma-asosiy" id="saqla" data-saqla data-yozadi data-sayohat="saqla" title="Ctrl+S">' + ik("tasdiq") + "<span>Saqlash</span></button></div>";

  const $ = n => forma.querySelector('[name="' + n + '"]');
  const turInfo = k => D.TUR_KALITLAR.find(t => t.kalit === k) || {};
  const binomi = () => ["noturar", "turar"].indexOf(turInfo($("rasmTuri").value).turKalit) >= 0;
  function guruhlar(){
    const t = turInfo($("rasmTuri").value);
    const bino = binomi();
    forma.querySelectorAll("[data-guruh]").forEach(el => {
      const g = el.dataset.guruh;
      el.hidden = g === "bino" ? !bino : g === "transport" ? t.turKalit !== "transport" : bino;
    });
  }

  /* ---------- Qo'shimcha qoidalar (HTML atributlaridan tashqari); xato matni maydon ostida chiqadi ---------- */
  const raqam = v => { const s = String(v == null ? "" : v).replace(/\s/g, "").replace(",", "."); if (!s) return null; const n = Number(s); return Number.isFinite(n) ? n : NaN; };
  const QOIDA = {
    hisobvaraq: v => !v || /^\d{5}$/.test(v) || "5 xonali hisobvaraq raqamini kiriting",
    /* Chekka qiymatlar avval tekshiriladi, keyin nuqta chindan ham O'zbekiston chegarasi ichidami:
       to'rtburchak Turkmaniston va Qozog'iston cho'lini ham qamrab oladi, poligon esa yo'q. */
    lat: (v, qv) => {
      const lng = raqam($("lng").value);
      if (v == null && lng != null) return "Kenglikni ham kiriting";
      if (v == null) return true;
      if (!(v >= 37 && v <= 46)) return "Kenglik 37 dan 46 gacha bo'ladi";
      return lng == null || ichkarida(v, lng) || "Nuqta O'zbekiston chegarasidan tashqarida";
    },
    lng: v => {
      const lat = raqam($("lat").value);
      if (v == null && lat != null) return "Uzunlikni ham kiriting";
      if (v == null) return true;
      if (!(v >= 55 && v <= 74)) return "Uzunlik 55 dan 74 gacha bo'ladi";
      return lat == null || ichkarida(lat, v) || "Nuqta O'zbekiston chegarasidan tashqarida";
    },
    vin: v => turInfo($("rasmTuri").value).turKalit !== "transport" || !v || /^[A-HJ-NPR-Z0-9]{17}$/i.test(v) || "VIN 17 ta belgidan iborat bo'ladi",
  };

  /* ---------- Koordinatani xaritadan belgilash ----------
     Chegaralar repodagi assets/geo dan o'qiladi: na tashqi geokoder, na tashqi tayl serveri talab qilinadi.
     Manzildan faqat ko'rinish hisoblanadi — koordinata xodim bosgan nuqtadan olinadi. Tuman markazini
     koordinata o'rniga yozib qo'yish taqiqlangan: u aniq nuqta emas, reyestrga esa aniq nuqta yoziladi. */
  let GEO = null;                     /* {hududlar, tumanlar} — yuklangandan keyin */
  let xKarta = null, xMetka = null, xAsos = null, xTuman = null;
  const hudKod = y.hududKod || D.hududKodi(y.hudud) || null;
  const past = s => String(s == null ? "" : s).toLowerCase().replace(/[‘’ʻʼ`´]/g, "'").replace(/\s+/g, " ");
  const tumanKalit = s => past(s).replace(/\s+(tumani|tuman|shahri|shahar|sh\.)$/, "").trim();

  /* Nuqta poligon ichidami: nur usuli. Teshikli poligonda ichki halqalar chiqarib tashlanadi. */
  function halqaIchida(r, lat, lng){
    let ichida = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++){
      const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) ichida = !ichida;
    }
    return ichida;
  }
  function shaklIchida(f, lat, lng){
    const g = f && f.geometry;
    if (!g) return false;
    const pol = p => p.length && halqaIchida(p[0], lat, lng) && !p.slice(1).some(r => halqaIchida(r, lat, lng));
    return g.type === "Polygon" ? pol(g.coordinates) : g.coordinates.some(pol);
  }
  const hududTop = (lat, lng) => GEO ? GEO.hududlar.features.find(f => shaklIchida(f, lat, lng)) || null : null;
  const tumanTop = (lat, lng) => GEO ? GEO.tumanlar.features.find(f => shaklIchida(f, lat, lng)) || null : null;
  /* Chegara fayli hali yuklanmagan bo'lsa tekshiruv o'tkazib yuboriladi: forma bloklanmaydi */
  function ichkarida(lat, lng){ return !GEO || !!hududTop(lat, lng); }

  /* Manzil matnidan tuman: chegara faylidagi nomlar manzil ichidan qidiriladi. Bu repodagi
     ma'lumot bo'yicha joylashtirish — tashqi xizmatga so'rov yuborilmaydi. */
  function manzildanTuman(){
    if (!GEO) return null;
    const matn = " " + past((($("manzil") && $("manzil").value) || "") + " " + (y.tuman || "")) + " ";
    let eng = null;
    GEO.tumanlar.features.forEach(f => {
      if (hudKod && f.properties.hudud !== hudKod) return;
      [f.properties.nom_uz, f.properties.nom_ru].forEach(n => {
        const k = tumanKalit(n);
        if (k.length < 4) return;
        const i = matn.indexOf(k);
        if (i < 0 || /[a-z0-9']/.test(matn[i - 1] || " ")) return;
        if (!eng || k.length > eng.uzun) eng = {f: f, uzun: k.length};
      });
    });
    return eng ? eng.f : null;
  }

  const kord = () => {
    const lat = raqam($("lat").value), lng = raqam($("lng").value);
    return Number.isFinite(lat) && Number.isFinite(lng) ? [lat, lng] : null;
  };
  function holatYoz(){
    const el = document.getElementById("ot-holat");
    if (!el) return;
    const k = kord();
    if (!k){
      const t = manzildanTuman();
      el.className = "ot-holat";
      el.innerHTML = (t ? "<b data-tarjimasiz>" + esc(t.properties[document.documentElement.lang === "ru" ? "nom_ru" : "nom_uz"]) + "</b>"
        : "<span>Manzildagi tuman topilmadi</span>") +
        " · <span>Xaritani bosing: metka o'sha nuqtaga qo'yiladi</span>";
    } else if (!ichkarida(k[0], k[1])){
      el.className = "ot-holat xato";
      el.innerHTML = "<span>Nuqta O'zbekiston chegarasidan tashqarida</span>";
    } else {
      const h = hududTop(k[0], k[1]), t = tumanTop(k[0], k[1]);
      const nomi = [t && t.properties[document.documentElement.lang === "ru" ? "nom_ru" : "nom_uz"],
        h && h.properties[document.documentElement.lang === "ru" ? "nom_ru" : "nom_uz"]].filter(Boolean).join(", ");
      const boshqa = h && hudKod && h.properties.kod !== hudKod;
      /* Tuman darajasidagi tekshiruv: nuqta hudud ichida, lekin yozuvdagi tumandan boshqasiga
         tushishi mumkin — namoyish ma'lumotida aynan shunday to'rtta yozuv bor edi va metka
         xaritada boshqa tumanda turardi. Bu xatoni faqat tuman konturi ko'rsatib beradi. */
      const kutilgan = manzildanTuman();
      const tumanBoshqa = !boshqa && kutilgan && t && t.properties.kod !== kutilgan.properties.kod;
      const kutilganNom = kutilgan && kutilgan.properties[document.documentElement.lang === "ru" ? "nom_ru" : "nom_uz"];
      el.className = "ot-holat" + (boshqa || tumanBoshqa ? " xato" : "");
      el.innerHTML = "<b data-tarjimasiz>" + MKB.fmt(D.yaxlit(k[0], 5)) + ", " + MKB.fmt(D.yaxlit(k[1], 5)) + "</b>" +
        (nomi ? ' · <b data-tarjimasiz>' + esc(nomi) + "</b>" : "") +
        (boshqa ? " · <span>Nuqta obyekt hududidan tashqarida</span>"
          : tumanBoshqa ? ' · <span>Nuqta manzildagi tumanga tushmadi:</span> <b data-tarjimasiz>' + esc(kutilganNom) + "</b>"
          : " · <span>Metkani surib aniqlashtiring</span>");
    }
    tarjimaQil(el);
  }

  function metkaKorsat(){
    if (!xKarta) return;
    const k = kord();
    if (!k){
      if (xMetka){ xKarta.removeLayer(xMetka); xMetka = null; }
      return;
    }
    if (!xMetka){
      xMetka = MKBxarita.metka(k, {nom: y.qisqa || y.nom,
        tur: turInfo($("rasmTuri").value).turKalit || y.turKalit, rang: "var(--siyoh)"});
      xMetka.options.draggable = true;
      xMetka.addTo(xKarta);
      if (xMetka.dragging) xMetka.dragging.enable();
      xMetka.on("dragend", () => { const p = xMetka.getLatLng(); nuqtaYoz(p.lat, p.lng, false); });
    } else xMetka.setLatLng(k);
  }
  /* Maydonlarga yozish: forma o'z hodisalarini eshitadi (o'zgarishlar ro'yxati, qoralama, tekshiruv) */
  function nuqtaYoz(lat, lng, metkaniHam){
    const a = $("lat"), b = $("lng");
    a.value = D.yaxlit(lat, 6);
    b.value = D.yaxlit(lng, 6);
    [a, b].forEach(el => {
      MKB.maydonXato(el, "");
      el.dispatchEvent(new Event("input", {bubbles: true}));
      el.dispatchEvent(new Event("change", {bubbles: true}));
    });
    if (metkaniHam !== false) metkaKorsat();
    holatYoz();
  }
  /* Manzildan tanilgan tuman uzuq kontur bilan chiziladi: bu taxmin, tasdiqlangan nuqta emas */
  function tumanChiz(){
    if (!xKarta) return;
    if (xTuman){ xKarta.removeLayer(xTuman); xTuman = null; }
    const t = manzildanTuman();
    if (!t) return;
    xTuman = L.geoJSON(t, {pane: "mkb-tuman", interactive: false,
      style: {color: MKB.rangQiymat("var(--siyoh)"), weight: 2, opacity: .85, dashArray: "5 4",
        fillColor: MKB.rangQiymat("var(--lavanda)"), fillOpacity: .6}}).addTo(xKarta);
  }
  function markazla(){
    if (!xKarta) return;
    const k = kord();
    if (k){ xKarta.setView(k, Math.max(xKarta.getZoom(), 13)); return; }
    const t = manzildanTuman();
    const chek = t && MKB.geo.chegara(t.properties.kod);
    if (chek){ xKarta.fitBounds(chek, {padding: [18, 18], maxZoom: 13}); return; }
    const hc = hudKod && MKB.geo.chegara(hudKod);
    if (hc){ xKarta.fitBounds(hc, {padding: [18, 18], maxZoom: 11}); return; }
    const hammasi = xAsos && xAsos.hududQatlam && xAsos.hududQatlam.getBounds();
    if (hammasi && hammasi.isValid()) xKarta.fitBounds(hammasi, {padding: [14, 14]});
  }

  async function xaritaQur(){
    const idish = document.getElementById("ot-leaflet");
    if (!idish || !window.L) return;
    try { GEO = await MKB.geo.yukla(); }
    catch (_) {
      idish.parentElement.innerHTML = MKB.xatoHolat(null, "Xarita chegaralarini yuklab bo'lmadi");
      idish.parentElement.classList.remove("ot-xarita");
      holatYoz();
      return;
    }
    /* Formadagi maydon: g'ildirak bilan kattalashtirish sahifa aylanishini o'g'irlaydi, shuning uchun
       masshtab faqat tugma va ikki marta bosish bilan o'zgaradi. */
    xKarta = L.map("ot-leaflet", {zoomControl: false, attributionControl: true, scrollWheelZoom: false,
      minZoom: 4, zoomSnap: .25, zoomDelta: 1}).setView([41.3, 64.6], 6);
    MKBxarita.zoomTugmalari(xKarta);
    xAsos = MKBxarita.asos(xKarta, {
      uslub: kod => kod === hudKod ? {rang: "var(--lavanda)", shaffof: .5} : {rang: "var(--oq)"},
      nom: kod => "<b>" + esc(((D.HUDUD_KODLAR || {})[kod] || {}).toliq || MKB.geo.nomi(kod, document.documentElement.lang) || kod) + "</b>"
    });
    MKBxarita.yorliqlarniKuzat(xKarta);
    xKarta.on("click", ev => { nuqtaYoz(ev.latlng.lat, ev.latlng.lng); });
    tumanChiz();
    metkaKorsat();
    holatYoz();
    const mosla = () => { xKarta.invalidateSize({animate: false}); markazla(); };
    mosla();
    if (xAsos && xAsos.tayyor) xAsos.tayyor.then(mosla).catch(() => {});
    setTimeout(mosla, 220);
    requestAnimationFrame(() => MKBxarita.yorliqlarniTekisla(xKarta));
  }

  document.getElementById("ot-markaz").addEventListener("click", markazla);
  /* Manzil o'zgarsa taxminiy tuman qayta hisoblanadi: geokoder emas, repodagi chegara nomlari bo'yicha */
  $("manzil").addEventListener("input", () => { tumanChiz(); holatYoz(); });
  document.getElementById("ot-tozala").addEventListener("click", () => {
    const a = $("lat"), b = $("lng");
    a.value = ""; b.value = "";
    [a, b].forEach(el => {
      MKB.maydonXato(el, "");
      el.dispatchEvent(new Event("input", {bubbles: true}));
      el.dispatchEvent(new Event("change", {bubbles: true}));
    });
    metkaKorsat();
    holatYoz();
  });
  [$("lat"), $("lng")].forEach(el => {
    el.addEventListener("input", () => { metkaKorsat(); holatYoz(); });
    /* Qo'lda yozilgan nuqta ko'rinishdan tashqarida qolsa, xodim xatoni ko'rmaydi: maydondan
       chiqqanda xarita o'sha nuqtaga suriladi. Har bosishda emas — aks holda yozayotganda sakraydi. */
    el.addEventListener("change", () => {
      const k = kord();
      if (k && xKarta && !xKarta.getBounds().contains(k)) xKarta.panTo(k);
    });
  });
  /* Obyekt kartochkasidan "Tahrirlash" havolasi shu maydonga olib keladi */
  if (location.hash === "#joy") setTimeout(() => {
    const t = document.getElementById("joy");
    if (t) t.scrollIntoView({block: "center", behavior: "smooth"});
  }, 400);
  xaritaQur();

  /* Qo'shimcha qoida xatosi maydondan chiqqanda ham qoladi (yadro blur tekshiruvi faqat HTML atributlarini ko'radi) */
  function qoidaJonli(forma, qoidalar){
    const qiy = el => { const f = el.getAttribute("data-format"); if (f) return MKB_UX_SOF.ajrat(f, el.value);
      if (el.type === "number") return el.value === "" ? null : Number(el.value); return String(el.value || "").trim(); };
    Object.keys(qoidalar).forEach(n => {
      const el = forma.querySelector('[name="' + n + '"]');
      if (!el) return;
      el.addEventListener("blur", () => setTimeout(() => {
        const hamma = {};
        forma.querySelectorAll("[name]").forEach(m => { hamma[m.name] = qiy(m); });
        const v = hamma[n];
        if (v == null || v === "" || el.getAttribute("aria-invalid") === "true") return;
        const r = qoidalar[n](v, hamma);
        if (typeof r === "string" && r) MKB.maydonXato(el, r);
      }, 0));
    });
  }

  /* ---------- O'zgarishlarni yig'ish: faqat o'zgargan maydonlar ---------- */
  const yax = (v, k) => v == null || v === "" ? null : Math.round(Number(v) * k) / k;
  function yigish(){
    const f = {};
    forma.querySelectorAll("[name]").forEach(m => { f[m.name] = m.value.trim(); });
    const t = turInfo(f.rasmTuri);
    const bino = binomi();
    const qiymat = raqam(f.qiymat);
    const sana = D.sanaOqi(f.sana);
    const mayd = {};
    if (bino) ["yer", "qurilishOsti", "foydali"].forEach(k => { const v = raqam(f[k]); mayd[k] = v > 0 ? yax(v, 10) : 0; });
    const lat = raqam(f.lat), lng = raqam(f.lng);

    /* patch: ichki obyektlar bir daraja birlashtiriladi */
    const patch = {}, ozg = [];
    const tekshirQosh = (yorliq, eski, yangi, qoy, korinish) => {
      const e = eski == null || eski === "" ? null : eski, n = yangi == null || yangi === "" ? null : yangi;
      if (JSON.stringify(e) === JSON.stringify(n)) return;
      qoy(n); ozg.push(korinish ? [yorliq, e == null ? null : korinish(e), n == null ? null : korinish(n)] : [yorliq, e, n]);
    };
    const m2 = v => MKB.fmt(v) + " m²";
    const ich = (k, kk, v) => { patch[k] = Object.assign(patch[k] || {}, {[kk]: v}); };
    tekshirQosh("Nomi", y.nom, f.nom, v => { patch.nom = v; });
    tekshirQosh("Qisqa nomi", y.qisqa, f.qisqa, v => { patch.qisqa = v || ""; });
    if (f.rasmTuri !== y.rasmTuri){
      const asosiy = (D.ASOSIY_TURLAR || []).find(a => a.kalit === t.turKalit) || {};
      Object.assign(patch, {rasmTuri: f.rasmTuri, turKalit: t.turKalit, tur: asosiy.nom || y.tur, binoli: bino});
      ozg.push(["Turi", turInfo(y.rasmTuri).nom, t.nom]);
    }
    tekshirQosh("Manzil", y.manzil, f.manzil, v => { patch.manzil = v; });
    const eskiJoy = joy.lat != null ? [joy.lat, joy.lng].join(", ") : null;
    if (Number.isFinite(lat) && Number.isFinite(lng)) tekshirQosh("Koordinata", eskiJoy, [lat, lng].join(", "), () => { patch.joy = {lat, lng, aniq: true}; });
    else if (lat == null && lng == null) tekshirQosh("Koordinata", eskiJoy, null, () => { patch.joy = null; });
    if (bino){
      tekshirQosh("Yer maydoni", yax(md.yer, 10) || null, mayd.yer || null, v => ich("maydon", "yer", v || 0), m2);
      tekshirQosh("Qurilish osti", yax(md.qurilishOsti, 10) || null, mayd.qurilishOsti || null, v => ich("maydon", "qurilishOsti", v || 0), m2);
      tekshirQosh("Foydali maydon", yax(md.foydali, 10) || null, mayd.foydali || null, v => ich("maydon", "foydali", v || 0), m2);
    }
    if (qiymat > 0) tekshirQosh("Balans qiymati", yax(b.qiymat, 100), yax(qiymat, 100), v => ich("balans", "qiymat", v), MKB.pul);
    if (sana) tekshirQosh("Qabul sanasi", b.sana, D.sanaYoz(sana), v => ich("balans", "sana", v));
    tekshirQosh("Hisobvaraq", b.hisobvaraq, f.hisobvaraq, v => ich("balans", "hisobvaraq", v));
    if (bino) tekshirQosh("Kadastr raqami", h.kadastrRaqami, f.kadastrRaqami, v => ich("huquq", "kadastrRaqami", v));
    if (t.turKalit === "transport") tekshirQosh("Davlat raqami", h.davlatRaqami, f.davlatRaqami ? f.davlatRaqami.toUpperCase() : "", v => ich("huquq", "davlatRaqami", v));
    if (!bino) tekshirQosh("VIN yoki zavod raqami", h.vin, f.vin ? f.vin.toUpperCase() : "", v => ich("huquq", "vin", v));
    tekshirQosh("Mas'ul xodim", y.masul, f.masul, v => { patch.masul = v; });
    if (f.filialKod !== y.filialKod){
      const fl = D.filial ? D.filial(f.filialKod) : filiallar.find(x => x.id === f.filialKod);
      Object.assign(patch, {filialKod: f.filialKod, filial: fl ? fl.nom : f.filialKod});
      ozg.push(["Filial", y.filial, fl ? fl.nom : f.filialKod]);
    }
    if (f.holat !== y.holat){
      Object.assign(patch, {holat: f.holat, bosqich: (D.HOLAT_BOSQICH || {})[f.holat] || y.bosqich});
      ozg.push(["Holat", y.holat, f.holat]);
    }
    return {patch, ozg, sabab: f.sabab};
  }

  const qisqa = v => v == null ? "—" : String(v).length > 60 ? String(v).slice(0, 60) + "…" : String(v);
  function ozgarishlarChiz(){
    const {ozg} = yigish();
    document.getElementById("ozg-soni").innerHTML = ozg.length ? '<span data-tarjimasiz>' + ozg.length + "</span>" : "";
    const el = document.getElementById("ozgarishlar");
    el.innerHTML = !ozg.length ? MKB.boshHolat("tahrir", "O'zgarish yo'q", "Maydonni o'zgartirsangiz, eski va yangi qiymat shu yerda chiqadi")
      : '<ul class="ozg-royxat">' + ozg.map(([n, e, v]) => "<li><b>" + esc(n) + '</b><span data-tarjimasiz><del>' + esc(qisqa(e)) + "</del> → " + esc(qisqa(v)) + "</span></li>").join("") + "</ul>";
    tarjimaQil(el);
  }

  /* ---------- Oxirgi tahrirlar (amallar tarixi) ---------- */
  async function oxirgiChiz(){
    const el = document.getElementById("oxirgi");
    let r = [];
    try{ r = (await MKBapi.royxat("amallar")) || []; }
    catch(_){ MKB.xatoHolat(el, "Tahrirlar tarixini yuklab bo'lmadi", oxirgiChiz); return; }
    r = r.filter(a => a && a.kolleksiya === "YOZUVLAR" && a.obyektId === y.id && a.turi === "yangilash").slice(0, 5);
    el.innerHTML = !r.length ? MKB.boshHolat("soat", "Tahrir qayd etilmagan", "Saqlangan o'zgarishlar eski va yangi qiymati bilan yoziladi")
      : r.map(a => '<div class="qator"><span class="belgi lavanda">' + ik("tahrir") + "</span>" +
          '<span class="matn"><b data-tarjimasiz>' + esc(a.kim || "—") + "</b>" +
          '<span data-tarjimasiz>' + esc(a.vaqt + (a.ozgarish ? " · " + Object.keys(a.ozgarish).join(", ") : "")) + "</span></span></div>").join("");
    tarjimaQil(el);
  }

  guruhlar();
  /* Format (1 234,5) qoriqlash asosidan oldin qo'llanadi, aks holda forma darrov "o'zgargan" bo'lib ko'rinadi */
  MKB.formaUla(forma);
  const oxirgiTarix = (y.tarix || []).slice(-1)[0];
  qoidaJonli(forma, QOIDA);
  const qoriq = MKB.formaQoriqla(forma, {nom: "Obyekt tahriri", qoralama: "obyekt-tahrir:" + y.id, yozuvVaqt: oxirgiTarix && oxirgiTarix.sana,
    tiklandi(){ guruhlar(); ozgarishlarChiz(); }});
  ozgarishlarChiz();
  oxirgiChiz();
  forma.addEventListener("input", ozgarishlarChiz);
  forma.addEventListener("change", e => { if (e.target.name === "rasmTuri") guruhlar(); ozgarishlarChiz(); });
  forma.addEventListener("submit", async e => {
    e.preventDefault();
    if (!MKB.formaTekshir(forma, QOIDA)) return;
    const {patch, ozg, sabab} = yigish();
    if (!ozg.length){ MKB.toast("O'zgarish yo'q", "info"); return; }
    patch.tarix = (y.tarix || []).concat([{sana: D.sanaYoz(bugun), voqea: "Ma'lumotlar tahrirlandi", izoh: sabab || ozg.map(o => o[0]).join(", ")}]);
    try{
      await MKB.band(document.getElementById("saqla"), () => MKBapi.yangilash("YOZUVLAR", y.id, patch));
    }catch(err){
      MKB.formaXato(forma, "O'zgarishlar saqlanmadi: " + (err && err.message ? err.message : "qayta urinib ko'ring"));
      return;
    }
    qoriq.toza();
    MKB.toast("Obyekt ma'lumotlari saqlandi");
    setTimeout(() => { location.href = "obyekt.html?id=" + q; }, 600);
  });
  tarjimaQil(document.querySelector("main"));
}});
</script>
