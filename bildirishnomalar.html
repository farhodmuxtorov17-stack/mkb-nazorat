<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Bildirishnomalar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082780">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="vazifa">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Vazifalar</span></div>
    <div class="hs-qator"><h1>Bildirishnomalar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="vazifalar.html">Vazifalar</a><a href="tasdiqlar.html">Tasdiqlar</a><a href="bildirishnomalar.html" class="faol">Bildirishnomalar</a><a href="taqvim.html">Taqvim</a><a href="eslatmalar.html">Eslatmalar</a></nav>
  <section class="karta"><div class="karta-bosh"><h2>Oqim</h2><button type="button" class="tugma tugma-kichik tugma-oq" id="b-hammasi" style="margin-left:auto">Barchasini o'qilgan qilish</button></div><div id="b-royxat"></div></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082780"></script>
<script src="malumot.js?v=26082780"></script>
<script src="malumot-qoshimcha.js?v=26082780"></script>
<script src="malumot-kengaytma.js?v=26082780"></script>
<script src="malumot-kirish.js?v=26082780"></script>
<script src="malumot-indeks.js?v=26082780"></script>
<script src="tarjima.js?v=26082780"></script>
<script src="yadro/ikonlar.js?v=26082780"></script>
<script src="yadro/daraxt.js?v=26082780"></script>
<script src="yadro/chizma.js?v=26082780"></script>
<script src="yadro/qollanma.js?v=26082780"></script>
<script src="yadro/api.js?v=26082780"></script>
<script src="yadro/app.js?v=26082780"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  async function chiz(){
    const r = await MKBapi.royxat("BILDIRISHLAR");
    document.getElementById("hs-meta").textContent = r.filter(b => !b.oqildi).length + " ta o'qilmagan";
    document.getElementById("b-royxat").innerHTML = r.map(b =>
      '<div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--chiziq-2);' + (b.oqildi ? 'opacity:.55' : '') + '">' +
        '<span style="width:9px;height:9px;border-radius:99px;background:' + (b.oqildi ? 'var(--xira)' : 'var(--brend)') + ';margin-top:6px;flex:none"></span>' +
        '<span style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px">' +
        '<b style="font-size:13px">' + b.sarlavha + '</b><span style="font-size:12.5px;color:var(--matn-3)">' + (b.t || "") + '</span></div>' +
        '<span style="font-size:12.5px;color:var(--qalam);line-height:1.5">' + b.matn + '</span></span>' +
        (b.oqildi ? '' : '<button type="button" class="tugma tugma-kichik tugma-oq" data-oqi="' + b.id + '">O\'qildi</button>') +
      '</div>').join("");
    document.querySelectorAll("[data-oqi]").forEach(x => x.addEventListener("click", async () => {
      await MKBapi.yangilash("BILDIRISHLAR", x.dataset.oqi, {oqildi: true}); chiz();
    }));
  }
  chiz();
  document.getElementById("b-hammasi").addEventListener("click", async () => {
    const r = await MKBapi.royxat("BILDIRISHLAR");
    for (const b of r.filter(v => !v.oqildi)) await MKBapi.yangilash("BILDIRISHLAR", b.id, {oqildi: true});
    MKB.toast("Barchasi o'qilgan deb belgilandi"); chiz();
  });
});
</script>
</body>
</html>
