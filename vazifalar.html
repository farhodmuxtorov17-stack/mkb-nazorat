<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Vazifalar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082745">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="vazifa">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Vazifalar</span></div>
    <div class="hs-qator"><h1>Vazifalar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="vazifalar.html" class="faol">Vazifalar</a><a href="tasdiqlar.html">Tasdiqlar</a><a href="bildirishnomalar.html">Bildirishnomalar</a><a href="taqvim.html">Taqvim</a><a href="eslatmalar.html">Eslatmalar</a></nav>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Bugungi vazifalar</span>
      <span class="m-qiymat"><span id="v-bugun">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Shoshilinch</span>
      <span class="m-qiymat"><span id="v-shosh">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Tasdiq kutmoqda</span>
      <span class="m-qiymat"><span id="v-tasdiq">—</span></span>
    </div>
  </section>
  <section class="karta"><div class="karta-bosh"><h2>Vazifalar ro'yxati</h2><span class="soni" id="v-soni"></span><button type="button" class="tugma tugma-kichik tugma-asosiy" id="v-qoshish" style="margin-left:auto"><svg class="ic"><use href="#i-qoshish"/></svg>Vazifa qo'shish</button></div><div id="v-royxat"></div></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082745"></script>
<script src="malumot.js?v=26082745"></script>
<script src="malumot-qoshimcha.js?v=26082745"></script>
<script src="malumot-kengaytma.js?v=26082745"></script>
<script src="malumot-kirish.js?v=26082745"></script>
<script src="malumot-indeks.js?v=26082745"></script>
<script src="tarjima.js?v=26082745"></script>
<script src="yadro/ikonlar.js?v=26082745"></script>
<script src="yadro/daraxt.js?v=26082745"></script>
<script src="yadro/chizma.js?v=26082745"></script>
<script src="yadro/qollanma.js?v=26082745"></script>
<script src="yadro/api.js?v=26082745"></script>
<script src="yadro/app.js?v=26082745"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  async function chiz(){
    const r = await MKBapi.royxat("MENING_VAZIFALARIM");
    const tasdiqlar = await MKBapi.royxat("TASDIQLAR");
    document.getElementById("v-bugun").textContent = r.filter(v => v.bugunmi && !v.bajarildi).length;
    document.getElementById("v-shosh").textContent = r.filter(v => v.muhimlik === "yuqori" && !v.bajarildi).length;
    document.getElementById("v-tasdiq").textContent = tasdiqlar.filter(t => !t.hal).length;
    document.getElementById("v-soni").textContent = r.length + " ta";
    document.getElementById("v-royxat").innerHTML = r.map(v =>
      '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--chiziq-2);' +
      (v.bajarildi ? 'opacity:.5' : '') + '">' +
        '<button type="button" data-belgi="' + v.id + '" aria-label="Bajarildi deb belgilash" style="width:22px;height:22px;border-radius:7px;border:1.5px solid ' +
        (v.bajarildi ? 'var(--siyoh);background:var(--siyoh);color:var(--brend)' : 'var(--chiziq-3)') + ';display:grid;place-items:center;flex:none">' +
        (v.bajarildi ? ik("tasdiq") : '') + '</button>' +
        '<span style="flex:1;min-width:0"><b style="display:block;font-size:13px;' + (v.bajarildi ? 'text-decoration:line-through' : '') + '">' + v.nom + '</b>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + v.tur + ' · ' + (v.kod || "") + '</span></span>' +
        (v.muhimlik === "yuqori" && !v.bajarildi ? '<span class="chip chip-xavf">shoshilinch</span>' : '') +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + (v.bugunmi ? "Bugun " : "") + (v.vaqt || v.sana || "") + '</span>' +
      '</div>').join("");
    document.querySelectorAll("[data-belgi]").forEach(b => b.addEventListener("click", async () => {
      const v = r.find(x => x.id === b.dataset.belgi);
      await MKBapi.yangilash("MENING_VAZIFALARIM", v.id, {bajarildi: !v.bajarildi});
      chiz();
    }));
  }
  chiz();
  document.getElementById("v-qoshish").addEventListener("click", () => {
    MKB.modal("Yangi vazifa",
      '<div class="forma-tor">' +
      '<div class="maydon keng"><label class="maydon-yorliq">Vazifa <b>*</b></label>' +
      '<div class="kirish"><input name="nom" placeholder="Nima qilish kerak?"></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq">Bo\'lim</label><div class="kirish"><select name="tur">' +
      '<option>Aktivlar nazorati</option><option>Yuridik</option><option>Baholash</option><option>Savdo</option></select></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq">Muhimlik</label><div class="kirish"><select name="muhimlik">' +
      '<option value="oddiy">Odatiy</option><option value="yuqori">Shoshilinch</option></select></div></div></div>',
      {okMatn: "Qo'shish", ok(modal){
        const q = MKB.forma(modal, ["nom"]);
        if (!q) return false;
        MKBapi.yangi("MENING_VAZIFALARIM", {id: "VZ-" + Date.now().toString(36),
          nom: q.nom, tur: q.tur, kod: "", sana: new Date().toISOString().slice(0, 10),
          vaqt: "", bugunmi: true, muhimlik: q.muhimlik, bajarildi: false}).then(chiz);
        MKB.toast("Vazifa ro'yxatga qo'shildi");
      }});
  });
});
</script>
</body>
</html>
