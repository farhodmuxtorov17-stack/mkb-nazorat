<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Hodisa</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.hd-tavsif{font-size:14px;line-height:1.65;color:var(--matn-2);margin:6px 0 16px;white-space:pre-line}
.hd-zanjir{margin:0 0 20px}
.hd-amal{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.zarar-jami{font:500 28px/1.1 var(--shrift-displey);letter-spacing:-.03em;margin:2px 0 4px}
.kichik-izoh{font-size:12.5px;color:var(--matn-3);line-height:1.55}
.chora-qator{padding:12px 0;border-bottom:1px solid var(--chiziq-2);font-size:14px;line-height:1.6;color:var(--matn-2)}
.chora-qator:last-of-type{border-bottom:0}
.chora-qator .chora-kim{display:block;font-size:12.5px;color:var(--matn-3);margin-bottom:2px}
.keyingi-izoh{font-size:13px;color:var(--matn-3);margin:0 0 14px;line-height:1.55}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><a href="hodisalar.html">Hodisalar</a><span class="ajratgich">/</span><span data-tarjimasiz id="hs-kod">—</span></div>
    <div class="hs-qator"><h1 id="hd-nom">Hodisa</h1><span class="hs-meta" id="hs-meta"></span><span class="hs-meta" id="hd-yangi" data-sayohat="yangilandi" data-tur="hodisa-yangilandi" hidden></span>
      <div class="hs-amallar" id="hd-amallar" data-sayohat="yopish" data-tur="hodisa-amallar"></div></div>
  </div>
  <div class="hd-zanjir" id="hd-zanjir" data-sayohat="bosqich" data-tur="hodisa-bosqich"></div>

  <div class="tor-2" id="hd-tor">
    <div class="ustun">
      <section class="karta" aria-labelledby="hd-m-s" data-tur="hodisa-malumot">
        <div class="karta-bosh"><h2 id="hd-m-s" data-ikonka="ogoh">Hodisa ma'lumoti</h2></div>
        <p class="hd-tavsif" id="hd-tavsif"></p>
        <dl class="malumot-royxat" id="hd-malumot"></dl>
      </section>
      <section class="karta" id="hd-x" aria-labelledby="hd-x-s" data-sayohat="chora" data-tur="hodisa-chora">
        <div class="karta-bosh"><h2 id="hd-x-s" data-ikonka="tasdiq">Ko'rilgan chora</h2></div>
        <div id="hd-xulosa"></div>
      </section>
      <section class="karta" aria-labelledby="hd-t-s" data-tur="hodisa-tarix">
        <div class="karta-bosh"><h2 id="hd-t-s" data-ikonka="soat">O'zgarishlar tarixi</h2></div>
        <div id="hd-tarix"></div>
      </section>
    </div>
    <div class="ustun">
      <section class="karta" aria-labelledby="hd-d-s" data-tur="hodisa-dalillar">
        <div class="karta-bosh"><h2 id="hd-d-s" data-ikonka="foto">Dalil fayllari</h2><span class="soni" id="hd-d-soni"></span></div>
        <div id="hd-dalillar"></div>
        <div id="hd-yuklash" style="margin-top:12px"></div>
      </section>
      <section class="karta" aria-labelledby="hd-z-s" data-tur="hodisa-zarar">
        <div class="karta-bosh"><h2 id="hd-z-s" data-ikonka="sugurta">Zarar va sug'urta</h2></div>
        <div id="hd-zarar"></div>
      </section>
      <section class="karta" aria-labelledby="hd-v-s" data-tur="hodisa-vazifalar">
        <div class="karta-bosh"><h2 id="hd-v-s" data-ikonka="vazifa">Vazifalar</h2><span class="soni" id="hd-v-soni"></span></div>
        <div id="hd-vazifalar"></div>
      </section>
    </div>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script src="yadro/dalolatnoma.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  const KOLLAR = ["XAVFSIZLIK_HODISALARI", "HODISALAR", "FAYLLAR", "SUGURTA_DAVOLARI", "SUGURTALAR", "MENING_VAZIFALARIM"];
  let ulandi = false;
  MKB.sahifaYukla({
    joylar: {"hd-malumot": ["qator", 5], "hd-xulosa": ["qator", 2], "hd-dalillar": ["qator", 2], "hd-zarar": ["qator", 2], "hd-vazifalar": ["qator", 2]},
    xato: "Hodisa ma'lumotini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(KOLLAR);
      ulandi = true;
      sahifa();
    },
  });

  function sahifa(){
  const id = new URLSearchParams(location.search).get("id") || "";
  const kodId = id.replace(/^#/, "");
  let kol = "XAVFSIZLIK_HODISALARI";
  let h = (D.XAVFSIZLIK_HODISALARI || []).find(x => x.id === kodId);
  if (!h){ kol = "HODISALAR"; h = (D.HODISALAR || []).find(x => x.id === kodId || x.kod === id || x.kod === "#" + kodId); }
  if (!h || !MKB.doira([h]).length){ location.replace("xato-404.html"); return; }
  const joriy = () => { h = (D[kol] || []).find(x => x.id === h.id) || h; return h; };

  const USTUNLAR = [["yangi", "Yangi"], ["tekshiruvda", "Tekshiruvda"], ["bartaraf", "Bartaraf etilmoqda"], ["hal", "Hal qilindi"], ["yopildi", "Yopildi"]];
  const NOM = Object.fromEntries(USTUNLAR);
  const CHIP = {yangi: "chip-xavf", tekshiruvda: "chip-sariq", bartaraf: "chip-info", hal: "chip-yashil", yopildi: "chip-kul"};
  const XH_MOS = {ochiq: "yangi", tekshiruvda: "tekshiruvda", bartaraf: "bartaraf", hal: "hal", yopildi: "yopildi"};
  const GH_MOS = {yangi: "yangi", tekshirilmoqda: "tekshiruvda", tekshiruvda: "tekshiruvda", bartaraf: "bartaraf", hal: "hal", yopildi: "yopildi"};
  const JID = {}; ["yuqori", "o'rta", "past"].forEach(k => { const j = MKB.jiddiylik(k); JID[k] = [j.nom, j.chip]; });
  const holati = () => kol === "XAVFSIZLIK_HODISALARI" ? (XH_MOS[h.holat] || "yangi") : (GH_MOS[h.ustun] || "yangi");
  /* Chora maydoni: XAVFSIZLIK_HODISALARI da "chora", HODISALAR da "izoh" (MKB.hodisa.otishXatosi bilan bir xil) */
  const xulosaMaydon = kol === "XAVFSIZLIK_HODISALARI" ? "chora" : "izoh";
  const yozadi = MKB.huquq("himoya", "yoz");
  const obyekt = D.topish(h.obyektId);
  const qurilma = h.qurilmaId ? D.qurilma(h.qurilmaId) : null;
  const nuqta = h.kirishNuqtaId ? D.kirishNuqtasi(h.kirishNuqtaId) : null;
  const vaqtBelgi = () => D.sanaYoz(D.bugun()) + " " + MKB.soat() + " · " + MKB.kim();
  /* Chora yozuvlari qo'shiladi, o'chirilmaydi: har bir qator kim va qachon yozganini saqlaydi */
  const choraQosh = matn => [String(h[xulosaMaydon] || "").trim(), vaqtBelgi() + ": " + matn].filter(Boolean).join("\n");

  function holatPatch(kalit){
    if (kol === "XAVFSIZLIK_HODISALARI") return {holat: kalit === "yangi" ? "ochiq" : kalit};
    return {ustun: kalit === "tekshiruvda" ? "tekshirilmoqda" : kalit, holat: NOM[kalit]};
  }

  function shapka(){
    joriy();
    const k = holati(), jd = JID[String(h.jiddiylik).replace(/&#39;/g, "'")] || [h.jiddiylik || "—", "chip-kul"];
    $("hs-kod").textContent = h.id;
    $("hd-nom").textContent = h.hodisa || "Hodisa";
    $("hs-meta").innerHTML = '<span class="chip ' + CHIP[k] + '">' + NOM[k] + '</span> <span class="chip ' + jd[1] + '">' + jd[0] + "</span>";
    const i = USTUNLAR.findIndex(u => u[0] === k);
    $("hd-zanjir").innerHTML = MKB.zanjir(USTUNLAR.map(u => ({nom: u[1]})), k === "yopildi" ? USTUNLAR.length : i);
    /* Bitta asosiy amal: navbatdagi bosqich. Orqaga qaytarish ikkinchi darajali */
    const KEYINGI = {yangi: ["tekshiruvda", "Qabul qilish", "tasdiq"], tekshiruvda: ["bartaraf", "Bartaraf etishga o'tkazish", "ong"],
      bartaraf: ["hal", "Hal qilindi deb belgilash", "tasdiq"], hal: ["yopildi", "Hodisani yopish", "tasdiq"], yopildi: ["tekshiruvda", "Qayta ochish", "yangilash"]};
    const kb = KEYINGI[k];
    $("hd-amallar").innerHTML = yozadi
      ? (i > 0 && k !== "yopildi" ? '<button type="button" class="tugma tugma-oq" data-qayt="' + USTUNLAR[i - 1][0] + '" data-yozadi data-tur="hodisa-orqaga">' + ik("chap") + "<span>Orqaga qaytarish</span></button>" : "") +
        '<button type="button" class="tugma ' + (k === "yopildi" ? "tugma-oq" : "tugma-asosiy") + '" data-otish="' + kb[0] + '" data-yozadi data-tur="hodisa-keyingi">' + ik(kb[2]) + "<span>" + kb[1] + "</span></button>"
      : "";
    document.title = "MKB — Hodisa";
    if (MKB.dalolatnoma) MKB.dalolatnoma.tugma($("hd-amallar"), "hodisa", {id: h.id});
    tarjimaQil(document.querySelector(".hujjat-shapka")); tarjimaQil($("hd-zanjir"));
  }

  function malumot(){
    joriy();
    $("hd-tavsif").textContent = h.tavsif || "";
    $("hd-tavsif").hidden = !h.tavsif;
    const q = [];
    q.push(["Obyekt", obyekt ? '<a href="obyekt-himoya.html?id=' + encodeURIComponent(obyekt.id) + '">' + esc(obyekt.qisqa || obyekt.nom) + '</a> <span class="kod-mono" data-tarjimasiz>' + esc(obyekt.id) + "</span>" : esc(h.obyektId || "—")]);
    q.push(["Manzil", esc(obyekt ? (obyekt.manzil || obyekt.hududToliq || "—") : (h.joy || "—"))]);
    q.push(["Qayd etilgan", '<span data-tarjimasiz>' + esc(h.vaqt || h.sana || "—") + "</span>"]);
    q.push(["Manba", kol === "XAVFSIZLIK_HODISALARI" ? "<span>Qurilma signali</span>" : "<span>" + ({korik: "Ko'rik", qurilma: "Qurilma signali"}[h.manba] || "Qo'lda qayd etilgan") + "</span>"]);
    if (qurilma) q.push(["Qurilma", '<a href="qurilma.html?id=' + encodeURIComponent(qurilma.id) + '">' + esc(qurilma.turNomi) + '</a> <span class="kod-mono" data-tarjimasiz>' + esc(qurilma.id) + "</span>"]);
    if (nuqta) q.push(["Kirish nuqtasi", esc(nuqta.nom)]);
    q.push(["Mas'ul", '<span data-sayohat="masul" data-tur="hodisa-masul"><span data-tarjimasiz>' + esc(h.masul || "—") + "</span>" +
      (yozadi && holati() !== "yopildi" ? ' <button type="button" class="tugma tugma-oq tugma-kichik" id="hd-masul-t" data-yozadi style="margin-left:8px">' + ik("tahrir") + "<span>Almashtirish</span></button>" : "") + "</span>"]);
    if (kol === "HODISALAR") q.push(["IIB arizasi", h.iibAriza && h.iibAriza.raqam ? '<span data-tarjimasiz>' + esc(h.iibAriza.raqam) + " · " + esc(h.iibAriza.sana || "") + "</span>" : "<span>Berilmagan</span>" +
      (yozadi ? ' <button type="button" class="tugma tugma-oq tugma-kichik" id="hd-iib-t" data-yozadi style="margin-left:8px">' + ik("qoshish") + "<span>Kiritish</span></button>" : "")]);
    $("hd-malumot").innerHTML = q.map(x => "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>").join("");
    tarjimaQil($("hd-malumot"));
    const mt = $("hd-masul-t");
    if (mt) mt.addEventListener("click", masulAlmashtir);
    const it = $("hd-iib-t");
    if (it) it.addEventListener("click", iibKirit);
  }

  function xulosa(){
    joriy();
    const qatorlar = String(h[xulosaMaydon] || "").split("\n").map(s => s.trim()).filter(Boolean);
    const k = holati();
    const izoh = {yangi: "Hodisani qabul qiling va tekshiruvni boshlang. Mas'ul bo'lmasa, siz mas'ul bo'lasiz.", tekshiruvda: "Sababni aniqlang va bartaraf etishga o'tkazing.",
      bartaraf: "Chora ko'rilgach, \"Hal qilindi deb belgilash\" tugmasi bilan choraning mazmunini yozing.", hal: "Natija tasdiqlangach hodisani yoping.", yopildi: ""}[k];
    $("hd-xulosa").innerHTML = (yozadi && izoh ? '<p class="keyingi-izoh">' + izoh + "</p>" : "") +
      (qatorlar.length ? qatorlar.map(s => {
        const m = /^(\d{2}\.\d{2}\.\d{4} \d{2}:\d{2}) · ([^:]+): (.*)$/.exec(s);
        return '<div class="chora-qator">' + (m ? '<span class="chora-kim"><span data-tarjimasiz>' + esc(m[1]) + "</span> · <span data-tarjimasiz>" + esc(m[2]) + "</span></span>" + esc(m[3]) : esc(s)) + "</div>";
      }).join("") : MKB.boshHolat("hujjat", "Chora yozilmagan", "Hal qilish va yopishda ko'rilgan chora majburiy yoziladi")) +
      (yozadi && k !== "yopildi" ? '<div class="hd-amal"><button type="button" class="tugma tugma-oq tugma-kichik" id="hd-izoh-t" data-yozadi>' + ik("tahrir") + "<span>Izoh qo'shish</span></button></div>" : "");
    tarjimaQil($("hd-xulosa"));
    const b = $("hd-izoh-t");
    if (b) b.addEventListener("click", izohQosh);
  }
  function izohQosh(){
    MKB.modal("Chora bo'yicha izoh", '<div class="maydon"><label class="maydon-yorliq" for="iz-m">Izoh <b>*</b></label>' +
      '<textarea class="kirish-matn" id="iz-m" name="matn" rows="3" maxlength="600" required minlength="5" data-xato="Kamida 5 ta belgi yozing" placeholder="Nima qilindi, kim bilan bog\'lanildi"></textarea>' +
      '<span class="maydon-izoh">Izoh ismingiz va vaqt bilan saqlanadi</span></div>', {okMatn: "Izohni saqlash", ok: async pd => {
        const f = MKB.formaTekshir(pd.querySelector(".modal-tana"));
        if (!f) return false;
        const ok = await MKB.saqla(() => MKBapi.yangilash(kol, h.id, {[xulosaMaydon]: choraQosh(f.qiymatlar.matn)}), "Izoh saqlandi");
        if (!ok) return false;
        xulosa(); tarix();
      }});
  }

  const MAYDON_NOMI = {holat: "Holat", ustun: "Holat", masul: "Mas'ul", chora: "Chora", izoh: "Chora", iibAriza: "IIB arizasi", tavsif: "Tavsif"};
  async function tarix(){
    let r = [];
    try{ r = (await MKBapi.royxat("amallar")) || []; }catch(_){ r = []; }
    r = r.filter(a => a.kolleksiya === kol && a.obyektId === h.id);
    const qiymat = (k, v) => v == null ? "—" : typeof v === "object" ? (v.raqam || JSON.stringify(v)) : (k === "chora" || k === "izoh") ? String(v).split("\n").pop() : (NOM[XH_MOS[v] || GH_MOS[v]] || String(v));
    const qatorlar = r.map(a => {
      const oz = a.ozgarish || {};
      const bandlar = Object.keys(oz).filter(k => k !== "ustun" || !oz.holat).map(k => (MAYDON_NOMI[k] || k) + ": " + qiymat(k, oz[k].yangi));
      return '<div class="qator"><span class="belgi">' + ik(a.turi === "yaratish" ? "qoshish" : "tahrir") + '</span><span class="matn"><b>' +
        esc(a.turi === "yaratish" ? "Hodisa qayd etildi" : bandlar.join(" · ") || "O'zgartirildi") + "</b><span>" + esc(a.kim || "") + '</span></span><span class="ong"><span class="vaqt" data-tarjimasiz>' + esc(a.vaqt || "") + "</span></span></div>";
    });
    qatorlar.push('<div class="qator"><span class="belgi mint">' + ik("signal") + '</span><span class="matn"><b>Hodisa qayd etildi</b><span>' +
      esc(kol === "XAVFSIZLIK_HODISALARI" ? "Qurilma signali" : (h.masul || "")) + '</span></span><span class="ong"><span class="vaqt" data-tarjimasiz>' + esc(h.vaqt || "") + "</span></span></div>");
    $("hd-tarix").innerHTML = qatorlar.join("") + '<p class="kichik-izoh" style="margin-top:8px">Tizimda bajarilgan har bir o\'zgarish amallar tarixidan olinadi.</p>';
    tarjimaQil($("hd-tarix"));
  }

  /* Dalil fayllari */
  function dalillar(){
    const f = (D.FAYLLAR || []).filter(x => x.kolleksiya === kol && x.yozuvId === h.id);
    $("hd-d-soni").textContent = f.length || "";
    $("hd-dalillar").innerHTML = f.length ? f.map(x =>
      '<div class="qator"><span class="belgi">' + ik(/^image/.test(x.tur) ? "foto" : "hujjat") + '</span><span class="matn"><b>' + esc(x.nom) + "</b><span>" +
      esc(x.yuklagan || "") + " · " + esc(x.yuklangan || "") + '</span></span><span class="ong"><button type="button" class="tugma tugma-oq tugma-kichik" data-fayl="' + esc(x.id) + '">' + ik("yuklab") + "<span>Ochish</span></button></span></div>").join("")
      : MKB.boshHolat("hujjat", "Dalil biriktirilmagan", "Surat, dalolatnoma yoki IIB arizasining nusxasini yuklang");
    tarjimaQil($("hd-dalillar"));
  }
  $("hd-dalillar").addEventListener("click", async e => {
    const b = e.target.closest("[data-fayl]"); if (!b) return;
    const bor = await MKB.band(b, () => MKBapi.fayl.yuklab(b.dataset.fayl));
    if (!bor) MKB.toast("Fayl bank tarmog'ida saqlanadi", "info");
  });
  if (yozadi) MKB.faylMaydon("#hd-yuklash", {obyektId: h.obyektId, kolleksiya: kol, yozuvId: h.id, accept: "image/*,application/pdf", kop: true,
    sarlavha: "Dalil faylini tashlang yoki tanlang", yuklandi(){ dalillar(); tarix(); }});

  /* Zarar va sug'urta: da'vo qiymat bo'limida yuritiladi, nazorat xodimi uni hodisadan ocha oladi (YARATISH_ISTISNO) */
  const daVoYoza = MKB.yaratadimi("SUGURTA_DAVOLARI", "qiymat");
  const isoBugun = () => D.sanaYoz(D.bugun()).split(".").reverse().join("-");
  function zarar(){
    const davolar = (D.SUGURTA_DAVOLARI || []).filter(s => s.hodisaId === h.id);
    const polislar = (D.SUGURTALAR || []).filter(s => s.obyektId === h.obyektId && s.holat !== "muddati tugagan");
    const jami = davolar.reduce((s, x) => s + (+x.summa || 0), 0);
    const HOL = {"topshirilgan": ["Topshirilgan", "chip-info"], "korib chiqilmoqda": ["Ko'rib chiqilmoqda", "chip-sariq"], "tolangan": ["To'langan", "chip-yashil"], "rad etilgan": ["Rad etilgan", "chip-xavf"]};
    $("hd-zarar").innerHTML =
      (davolar.length ? '<div class="m-yorliq kichik-izoh">Da\'vo qilingan zarar</div><div class="zarar-jami" data-tarjimasiz>' + MKB.pul(Math.round(jami * 100) / 100) + "</div>" +
        davolar.map(s => { const c = HOL[s.holat] || [s.holat, "chip-kul"]; return '<div class="qator"><span class="belgi lavanda">' + ik("sugurta") + '</span><span class="matn"><b data-tarjimasiz>' + esc(s.id) + "</b><span>" +
          '<span data-tarjimasiz>' + esc(s.polisId || "") + " · " + esc(s.sana || "") + '</span></span></span><span class="ong"><span class="pul" data-tarjimasiz>' + MKB.pul(s.summa) + '</span><span class="chip chip-kichik ' + c[1] + '">' + c[0] + "</span></span></div>"; }).join("")
        : '<p class="kichik-izoh" style="margin-bottom:10px">Zarar summasi sug\'urta da\'vosi bilan qayd etiladi. Bu hodisa bo\'yicha da\'vo yo\'q.</p>') +
      '<p class="kichik-izoh" style="margin-top:10px">' + (polislar.length ? "<span>Amaldagi polis:</span> <b data-tarjimasiz>" + esc(polislar.map(p => (p.polis || p.id) + " (" + (p.kompaniya || "") + ")").join(", ")) + "</b>"
        : "<span>Obyektda amaldagi sug'urta polisi yo'q.</span>") + "</p>" +
      (daVoYoza && polislar.length ? '<div class="hd-amal"><button type="button" class="tugma tugma-oq tugma-kichik" id="hd-davo" data-yozadi>' + ik("sugurta") + "<span>Sug'urta da'vosi yaratish</span></button></div>" : "");
    tarjimaQil($("hd-zarar"));
    const b = $("hd-davo");
    if (b) b.addEventListener("click", () => davoYarat(polislar));
  }
  function davoYarat(polislar){
    const html = '<div class="forma-tor">' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-p">Polis <b>*</b></label><div class="kirish"><select id="f-p" name="polisId" required>' +
        polislar.map(p => '<option value="' + esc(p.id) + '">' + esc((p.polis || p.id) + " · " + (p.kompaniya || "") + " · " + MKB.pul(p.summa)) + "</option>").join("") + "</select></div></div>" +
      '<div class="maydon"><label class="maydon-yorliq" for="f-s">Zarar summasi <b>*</b></label><div class="kirish"><input id="f-s" name="summa" type="text" data-format="pul" min="0.01" required data-xato="Zarar summasini kiriting" placeholder="1,8"></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-d">Topshirilgan sana <b>*</b></label><div class="kirish"><input id="f-d" type="date" name="sana" required max="' + isoBugun() + '" value="' + isoBugun() + '"></div></div>' +
      "</div>";
    MKB.modal("Sug'urta da'vosi", html, {okMatn: "Da'voni saqlash", ok: async pd => {
      const f = MKB.formaTekshir(pd.querySelector(".modal-tana"));
      if (!f) return false;
      const v = f.qiymatlar, sana = D.sanaOqi(v.sana);
      let yangiId = null;
      const ok = await MKB.saqla(async () => {
        yangiId = await MKB.keyingiId("SUGURTA_DAVOLARI", "SD-" + sana.getFullYear() + "/", 4);
        await MKBapi.yangi("SUGURTA_DAVOLARI", {id: yangiId, polisId: v.polisId, hodisaId: h.id, obyektId: h.obyektId, sana: D.sanaYoz(sana), summa: v.summa, holat: "topshirilgan"});
      });
      if (!ok) return false;
      MKB.toast("Sug'urta da'vosi " + yangiId + " yaratildi: " + MKB.pul(v.summa));
      zarar();
    }});
  }

  /* Vazifalar */
  const vazYoza = MKB.huquq("vazifa", "yoz");
  function vazifalar(){
    const v = (D.MENING_VAZIFALARIM || []).filter(x => x.kod === h.id);
    $("hd-v-soni").textContent = v.length || "";
    $("hd-vazifalar").innerHTML = (v.length ? v.map(x =>
      '<div class="qator"><span class="belgi ' + (x.bajarildi ? "mint" : "lavanda") + '">' + ik(x.bajarildi ? "tasdiq" : "vazifa") + '</span><span class="matn"><b>' + esc(x.nom) + "</b><span>" +
      esc(x.ijrochi || x.rol || "") + '</span></span><span class="ong"><span class="vaqt" data-tarjimasiz>' + esc(x.muddat || "") + "</span>" +
      (x.bajarildi ? '<span class="chip chip-kichik chip-yashil">Bajarildi</span>' : "") + "</span></div>").join("")
      : MKB.boshHolat("vazifa", "Vazifa berilmagan")) +
      (vazYoza && holati() !== "yopildi" ? '<div class="hd-amal"><button type="button" class="tugma tugma-oq tugma-kichik" id="hd-vaz" data-yozadi>' + ik("qoshish") + "<span>Vazifa yaratish</span></button></div>" : "");
    tarjimaQil($("hd-vazifalar"));
    const b = $("hd-vaz");
    if (b) b.addEventListener("click", vazifaYarat);
  }
  const xodimlar = () => (D.FOYDLAR || []).filter(f => f.faol !== false && ["Ko'rik va xavfsizlik inspektori", "Obyekt menejeri", "Rahbariyat"].includes(f.rol) &&
    (!MKB.filialKod() || !f.filialKod || f.filialKod === MKB.filialKod()));
  function vazifaYarat(){
    /* Oldindan to'ldirilgan qiymat input value ichida: tarjimaQil unga tegmaydi, shuning uchun
       matn joriy tilda yig'iladi. Ma'lumotda nom har doim o'zbekcha saqlanadi. */
    const nomUz = "Hodisa bo'yicha chora ko'rish: " + (h.hodisa || "");
    const nomKorinishi = MKB.matn("Hodisa bo'yicha chora ko'rish:") + " " + MKB.matn(h.hodisa || "");
    const html = '<div class="forma-tor">' +
      '<div class="maydon keng"><label class="maydon-yorliq" for="f-n">Vazifa <b>*</b></label><div class="kirish"><input id="f-n" name="nom" maxlength="140" required minlength="5" value="' + esc(nomKorinishi) + '"></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-i">Ijrochi <b>*</b></label><div class="kirish"><select id="f-i" name="ijrochi" required data-xato="Ijrochini tanlang"><option value="">Tanlang</option>' +
        xodimlar().map(f => '<option value="' + esc(f.nom) + '">' + esc(f.nom + " · " + f.rol) + "</option>").join("") + "</select></div></div>" +
      '<div class="maydon"><label class="maydon-yorliq" for="f-m">Muddat <b>*</b></label><div class="kirish"><input id="f-m" type="date" name="muddat" required min="' + isoBugun() + '" value="' + D.sanaYoz(D.ishKuniQosh(D.bugun(), 2)).split(".").reverse().join("-") + '"></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-mh">Muhimlik</label><div class="kirish"><select id="f-mh" name="muhimlik"><option value="yuqori">Yuqori</option><option value="orta" selected>O\'rta</option><option value="past">Past</option></select></div></div>' +
      "</div>";
    MKB.modal("Vazifa yaratish", html, {okMatn: "Vazifa berish", ok: async pd => {
      const f = MKB.formaTekshir(pd.querySelector(".modal-tana"));
      if (!f) return false;
      const v = f.qiymatlar, m = D.sanaOqi(v.muddat);
      const xodim = (D.FOYDLAR || []).find(x => x.nom === v.ijrochi);
      const ok = await MKB.saqla(async () => {
        const vid = await MKB.keyingiId("MENING_VAZIFALARIM", "VZ-" + D.bugun().getFullYear() + "-", 0);
        await MKBapi.yangi("MENING_VAZIFALARIM", {id: vid, nom: v.nom.trim() === nomKorinishi.trim() ? nomUz : v.nom, tur: "Hodisa", obyektId: h.obyektId, kod: h.id, qoidaId: null,
          sana: D.sanaYoz(D.bugun()), muddat: D.sanaYoz(m), ijrochi: v.ijrochi, rol: xodim ? xodim.rol : "", muhimlik: v.muhimlik, bajarildi: false});
      }, "Vazifa berildi: " + v.ijrochi);
      if (!ok) return false;
      vazifalar();
    }});
  }

  function masulAlmashtir(){
    const html = '<div class="maydon"><label class="maydon-yorliq" for="f-ms">Yangi mas\'ul <b>*</b></label><div class="kirish"><select id="f-ms" name="masul" required data-xato="Mas\'ulni tanlang"><option value="">Tanlang</option>' +
      xodimlar().map(f => '<option value="' + esc(f.nom) + '"' + (f.nom === h.masul ? " selected" : "") + ">" + esc(f.nom + " · " + f.rol) + "</option>").join("") + "</select></div>" +
      '<span class="maydon-izoh">Hodisa yangi mas\'ulning navbatiga o\'tadi</span></div>';
    MKB.modal("Mas'ulni almashtirish", html, {okMatn: "Mas'ulni belgilash", ok: async pd => {
      const f = MKB.formaTekshir(pd.querySelector(".modal-tana"));
      if (!f) return false;
      const yangi = f.qiymatlar.masul;
      if (yangi === h.masul) return true;
      const ok = await MKB.saqla(() => MKBapi.yangilash(kol, h.id, {masul: yangi}), "Mas'ul almashtirildi: " + yangi);
      if (!ok) return false;
      malumot(); tarix();
    }});
  }
  function iibKirit(){
    const html = '<div class="forma-tor"><div class="maydon"><label class="maydon-yorliq" for="f-r">Ariza raqami <b>*</b></label><div class="kirish"><input id="f-r" name="raqam" maxlength="40" required data-xato="Ariza raqamini kiriting"></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq" for="f-sa">Sana <b>*</b></label><div class="kirish"><input id="f-sa" type="date" name="sana" required max="' + isoBugun() + '" value="' + isoBugun() + '"></div></div></div>';
    MKB.modal("IIB arizasi", html, {okMatn: "Arizani saqlash", ok: async pd => {
      const f = MKB.formaTekshir(pd.querySelector(".modal-tana"));
      if (!f) return false;
      const ok = await MKB.saqla(() => MKBapi.yangilash(kol, h.id, {iibAriza: {raqam: f.qiymatlar.raqam, sana: f.qiymatlar.sana}}), "IIB arizasi saqlandi");
      if (!ok) return false;
      malumot(); tarix();
    }});
  }

  /* ---------- Bosqich o'tishi ----------
     Qabul qilish, bartaraf etishga o'tkazish va orqaga qaytarish darhol yoziladi va qaytarib olinadi;
     hal qilish va yopish chora bilan tasdiqlanadi; qayta ochish sabab bilan tasdiqlanadi */
  function qaytarishBilan(eski, yangi, eskiMasul, xabar){
    MKB.qaytarish(xabar, {
      bekor: () => MKBapi.yangilash(kol, h.id, Object.assign(holatPatch(eski), eskiMasul !== undefined ? {masul: eskiMasul} : {})),
      keyin: () => hammasi(),
    });
  }
  async function otish(kalit, tugma){
    joriy();
    const eski = holati();
    const xato = MKB.hodisa.otishXatosi(Object.assign({}, h, {[xulosaMaydon]: "x"}), kol, eski, kalit);
    if (xato){ MKB.toast("Hodisa bosqichlari ketma-ket o'tkaziladi", "xavf"); return; }
    const tafsilot = [["Hodisa", {matn: h.id, tarjimasiz: true}], ["Obyekt", MKB.kn.obyektNomi(h.obyektId)], ["Mas'ul", h.masul || "—"]];
    const bor = String(h[xulosaMaydon] || "").trim();
    if (kalit === "hal" || kalit === "yopildi"){
      const halmi = kalit === "hal";
      const r = await MKB.tasdiqla({
        sarlavha: halmi ? "Hodisani hal qilindi deb belgilash" : "Hodisani yopish",
        matn: halmi ? "Hodisa \"Hal qilindi\" bosqichiga o'tadi. Ko'rilgan chora hodisa tarixiga ismingiz bilan yoziladi." : "Hodisa yopiladi va ochiq hodisalar ro'yxatidan chiqadi. Kerak bo'lsa, keyin qayta ochish mumkin.",
        tafsilot: tafsilot.concat(bor ? [["Oldingi chora", bor.split("\n").pop()]] : []),
        sabab: {majburiy: halmi || !bor, min: halmi || !bor ? 5 : 0, maks: 600, yorliq: halmi ? "Ko'rilgan chora" : (bor ? "Yopish izohi" : "Ko'rilgan chora"),
          izoh: "Sabab, ko'rilgan chora va natija", namuna: "Masalan: eshik qulfi almashtirildi, IIBga xabar berildi"},
        okMatn: halmi ? "Hal qilindi deb belgilash" : "Hodisani yopish", bekorMatn: "Orqaga",
        bajar: ({sabab}) => MKBapi.yangilash(kol, h.id, Object.assign(holatPatch(kalit), sabab ? {[xulosaMaydon]: choraQosh(sabab)} : {})),
      });
      if (!r) return;
      MKB.toast(halmi ? "Hodisa " + h.id + " hal qilindi" : "Hodisa " + h.id + " yopildi");
      hammasi(); return;
    }
    if (eski === "yopildi"){
      const r = await MKB.tasdiqla({
        sarlavha: "Hodisani qayta ochish",
        matn: "Hodisa \"Tekshiruvda\" bosqichiga qaytadi va ochiq hodisalar ro'yxatiga tushadi.",
        tafsilot, sabab: {majburiy: true, min: 5, maks: 400, yorliq: "Qayta ochish sababi", namuna: "Masalan: obyektda yana buzilish aniqlandi"},
        okMatn: "Qayta ochish", bekorMatn: "Orqaga",
        bajar: ({sabab}) => MKBapi.yangilash(kol, h.id, Object.assign(holatPatch(kalit), {[xulosaMaydon]: choraQosh("Qayta ochildi: " + sabab)})),
      });
      if (!r) return;
      MKB.toast("Hodisa " + h.id + " qayta ochildi");
      hammasi(); return;
    }
    /* Qabul qilishda mas'ul bo'lmasa, qabul qilgan xodim mas'ul bo'ladi */
    const masulBer = kalit === "tekshiruvda" && eski === "yangi" && (!h.masul || h.masul === "—");
    const eskiMasul = masulBer ? (h.masul || "") : undefined;
    const ok = await MKB.band(tugma, () => MKB.saqla(() => MKBapi.yangilash(kol, h.id, Object.assign(holatPatch(kalit), masulBer ? {masul: MKB.kim()} : {}))));
    if (!ok) return;
    hammasi();
    qaytarishBilan(eski, kalit, eskiMasul, eski === "yangi" ? "Hodisa qabul qilindi" : "Hodisa bosqichi: " + NOM[kalit]);
  }
  $("hd-amallar").addEventListener("click", e => {
    const b = e.target.closest("[data-otish],[data-qayt]"); if (!b) return;
    otish(b.dataset.otish || b.dataset.qayt, b);
  });

  function hammasi(){ shapka(); malumot(); xulosa(); vazifalar(); tarix(); }
  shapka(); malumot(); xulosa(); dalillar(); zarar(); vazifalar(); tarix();
  const belgi = MKB.yangilanganBelgi("hd-yangi", {avto: 60, yangila: async () => { await MKB.kn.yukla(KOLLAR); hammasi(); dalillar(); zarar(); }});
  belgi.belgila();
  /* Doskadan chora so'rab kelinganda chora bo'limiga o'tiladi */
  if (location.hash === "#hd-x") $("hd-x").scrollIntoView({block: "start"});
  }
})();
</script>
</body>
</html>
