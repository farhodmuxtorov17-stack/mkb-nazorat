<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Polisni yangilash</title>
<link rel="stylesheet" href="yadro/app.css?v=26082800">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="sugurta">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Sug'urta</span></div>
    <div class="hs-qator"><h1>Polisni yangilash</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="sugurta.html">Polislar</a><a href="sugurta-tugayotgan.html">Tugayotganlar</a><a href="sugurta-davolar.html">Da'volar</a><a href="sugurta-yangilash.html" class="faol">Yangilash</a></nav>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Polisni yangilash</h2></div>
  <form id="sy-forma" class="forma-tor">
    <div class="maydon keng"><label class="maydon-yorliq">Polis <b>*</b></label>
      <div class="kirish"><select name="id" id="sy-polis"></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Yangi muddat <b>*</b></label>
      <div class="kirish"><select name="tugash"><option>14-yan, 2028</option><option>01-iyl, 2027</option><option>31-dek, 2027</option></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Yangi summa, mln so'm</label>
      <div class="kirish"><input name="summa" type="number" placeholder="joriy summa"></div></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" href="sugurta.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit">Polisni yangilash</button></div>
  </form></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082800"></script>
<script src="malumot.js?v=26082800"></script>
<script src="malumot-qoshimcha.js?v=26082800"></script>
<script src="malumot-kengaytma.js?v=26082800"></script>
<script src="malumot-kirish.js?v=26082800"></script>
<script src="malumot-indeks.js?v=26082800"></script>
<script src="tarjima.js?v=26082800"></script>
<script src="yadro/ikonlar.js?v=26082800"></script>
<script src="yadro/daraxt.js?v=26082800"></script>
<script src="yadro/chizma.js?v=26082800"></script>
<script src="yadro/qollanma.js?v=26082800"></script>
<script src="yadro/api.js?v=26082800"></script>
<script src="yadro/app.js?v=26082800"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("SUGURTALAR");
  const oldindan = new URLSearchParams(location.search).get("id");
  document.getElementById("sy-polis").innerHTML = r.map(s =>
    '<option value="' + s.id + '"' + (s.id === oldindan ? " selected" : "") + '>' +
    s.polis + " — " + s.obyekt + '</option>').join("");
  document.getElementById("sy-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["id", "tugash"]);
    if (!q) return;
    const patch = {tugash: q.tugash, holat: "amalda"};
    if (q.summa) patch.summa = +q.summa;
    await MKBapi.yangilash("SUGURTALAR", q.id, patch);
    MKB.toast("Polis yangilandi");
    setTimeout(() => location.href = "sugurta.html", 700);
  });
});
</script>
</body>
</html>
