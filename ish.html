<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ish varaqasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.qadam{display:flex;flex-direction:column;gap:14px}
.qadam p{font-size:14.5px;line-height:1.55;color:var(--matn-2);max-width:62ch}
.qadam .amallar{display:flex;gap:10px;flex-wrap:wrap}
.qadam-muddat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:var(--plitka)}
.qadam-muddat .ic{width:20px;height:20px;color:var(--matn-3);flex:none}
.qadam-muddat .qm-matn{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px}
.qadam-muddat .qm-matn b{font-size:14px;font-weight:500}
.qadam-muddat .qm-matn span{font-size:12.5px;color:var(--matn-3)}
.malumot-royxat dd .ikkinchi{display:block;font-size:12.5px;color:var(--matn-3);margin-top:2px}
.hujjat-tur{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 10px}
.hujjat-tur .maydon{flex:1 1 200px}
.tarix-band{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--chiziq-2);font-size:13.5px}
.tarix-band:last-child{border-bottom:0}
.tarix-band .kod-mono{flex:none;width:86px;color:var(--matn-3);font-size:12.5px;padding-top:1px}
.tarix-band span{display:block;color:var(--matn-3);font-size:12.5px;margin-top:2px}
.karta-bosh > .tugma{margin-left:auto}
.kichik-amal{display:flex;gap:8px;flex-wrap:wrap}
.sorov-holat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:var(--plitka)}
.sorov-holat .ic{width:20px;height:20px;color:var(--matn-3);flex:none}
.sorov-holat .sh-matn{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 200px}
.sorov-holat .sh-matn b{font-size:14px;font-weight:500}
.sorov-holat .sh-matn span{font-size:12.5px;color:var(--matn-3)}
@media (max-width:720px){#malumot{grid-template-columns:minmax(0,1fr)}#malumot dt{border-bottom:0;padding-bottom:2px}#malumot dd{text-align:left;padding-top:0;justify-content:flex-start}}
</style>
</head>
<body data-sahifa="yuridik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="undiruv.html">Undiruv ishlari</a><span class="ajratgich">/</span><span id="yorliq-id" data-tarjimasiz>—</span></div>
    <div class="hs-qator"><h1 id="sarlavha" data-tarjimasiz>Ish varaqasi</h1><span class="hs-meta" id="hs-meta"></span>
      <div class="hs-amallar"><button type="button" class="tugma tugma-oq" id="ish-yop" data-huquq="yoz" data-yozadi data-sayohat="yopish" hidden><svg class="ic"><use href="#ik-yopish"/></svg>Ishni yopish</button></div></div>
  </div>

  <section class="karta" aria-label="Ish bosqichlari" data-sayohat="bosqich"><div id="zanjir"></div></section>

  <div class="tor-2">
    <div class="ustun">
      <section class="karta" aria-labelledby="qadam-h" data-sayohat="keyingi-amal"><div class="karta-bosh"><h2 id="qadam-h">Keyingi qadam</h2></div><div class="qadam" id="qadam"></div></section>
      <section class="karta" aria-labelledby="mal-h" data-sayohat="malumot"><div class="karta-bosh"><h2 id="mal-h">Ish ma'lumotlari</h2></div><dl class="malumot-royxat" id="malumot"></dl></section>
      <section class="karta" aria-labelledby="huj-h" data-sayohat="hujjatlar"><div class="karta-bosh"><h2 id="huj-h">Hujjatlar</h2><span class="soni" id="huj-soni"></span></div><div id="hujjatlar"></div><div id="huj-yuklash"></div></section>
    </div>
    <div class="ustun">
      <section class="karta" aria-labelledby="maj-h" data-sayohat="majlis"><div class="karta-bosh"><h2 id="maj-h">Sud majlislari</h2><button type="button" class="tugma tugma-oq tugma-kichik" id="majlis-qosh" data-huquq="yoz" data-yozadi hidden><svg class="ic"><use href="#ik-qoshish"/></svg>Majlis tayinlash</button></div><div id="majlislar"></div></section>
      <section class="karta" aria-labelledby="mul-h"><div class="karta-bosh"><h2 id="mul-h">Qarzdor bilan muloqot</h2><button type="button" class="tugma tugma-oq tugma-kichik" id="muloqot-qosh" data-huquq="yoz" data-yozadi hidden><svg class="ic"><use href="#ik-qoshish"/></svg>Qayd etish</button></div><div id="muloqot"></div></section>
      <section class="karta" aria-labelledby="res-h"><div class="karta-bosh"><h2 id="res-h">Restrukturizatsiya</h2><button type="button" class="tugma tugma-oq tugma-kichik" id="res-qosh" data-huquq="yoz" data-yozadi hidden><svg class="ic"><use href="#ik-qoshish"/></svg>Taklifni qayd etish</button></div><div id="restruktur"></div></section>
      <section class="karta" aria-labelledby="tar-h" data-sayohat="tarix"><div class="karta-bosh"><h2 id="tar-h">Ish tarixi</h2></div><div id="tarix"></div></section>
    </div>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(async () => {
  const JOYLAR = {qadam: ["qator", 2], malumot: ["qator", 6], majlislar: ["qator", 3], muloqot: ["qator", 3], restruktur: ["qator", 2], tarix: ["qator", 4], hujjatlar: ["qator", 2]};
  Object.keys(JOYLAR).forEach(k => { document.getElementById(k).innerHTML = MKB.skelet(JOYLAR[k][1]); });
  await MKBapi.tayyor;
  const D = MKB_DATA;
  const esc = MKB.esc;
  const id = new URLSearchParams(location.search).get("id");
  const BOSQ = D.UNDIRUV_BOSQICHLAR;
  const bosqich = k => BOSQ.find(b => b.kalit === k) || {kalit: k, nom: k, chip: "chip-kul"};
  const bugun = D.bugun();
  const bugunMatn = D.sanaYoz(bugun);
  const iso = s => { const d = s instanceof Date ? s : D.sanaOqi(s); return d ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") : ""; };
  const qolgan = s => { const d = D.sanaOqi(s); return d ? D.kunFarqi(bugun, d) : null; };
  const yozadi = () => MKB.huquq("yuridik", "yoz");
  const t = s => '<span data-tarjimasiz>' + esc(s == null || s === "" ? "—" : String(s)) + "</span>";
  const tj = s => ({matn: s == null || s === "" ? "—" : String(s), tarjimasiz: true});

  let ish = null, majlislar = [], muloqot = [], restruktur = [], tasdiqlar = [];

  /* false: sahifa boshqa joyga yo'naltirildi */
  async function yukla(){
    ish = id ? await MKBapi.bitta("UNDIRUV_ISHLAR", id) : null;
    if (!ish){ location.replace("xato-404.html"); return false; }
    if (!MKB.doira([ish]).length){ location.replace("xato-403.html"); return false; }
    const [m, l, r, ts] = await Promise.all([MKBapi.royxat("SUD_MAJLISLAR"), MKBapi.royxat("MULOQOTLAR"),
      MKBapi.royxat("RESTRUKTURIZATSIYA"), MKBapi.royxat("TASDIQLAR")]);
    majlislar = m.filter(x => x.ishId === ish.id);
    muloqot = l.filter(x => x.ishId === ish.id);
    restruktur = r.filter(x => x.ishId === ish.id);
    tasdiqlar = ts.filter(x => x.manbaKol === "UNDIRUV_ISHLAR" && x.manbaId === ish.id);
    return true;
  }
  const qaytaChiz = async () => { if (await yukla()) chiz(); };

  const tarixQosh = (voqea, izoh, sana) => (ish.tarix || []).concat([{sana: sana || bugunMatn, voqea, izoh: izoh || ""}]);

  /* ---------- Chizish ---------- */
  function bosqichSana(k){
    const tr = ish.tarix || [];
    const top = re => { const x = tr.find(v => re.test(v.voqea || "")); return x ? x.sana : null; };
    if (k === "ogohlantirish") return top(/ogohlantirish|talabnoma/i);
    if (k === "davo") return top(/da'vo/i);
    if (k === "sud") return top(/ish yuritish/i);
    if (k === "qaror") return ish.qaror && ish.qaror.sana;
    if (k === "ijro") return ish.ijro && ish.ijro.sana;
    if (k === "qabul") return ish.aktivId ? ish.yopilganSana : null;
    return null;
  }
  function chiz(){
    const faol = ish.holat === "faol";
    const b = bosqich(ish.bosqich);
    document.title = "MKB — Ish varaqasi";
    document.getElementById("yorliq-id").textContent = ish.id;
    document.getElementById("sarlavha").textContent = ish.qarzdor ? ish.qarzdor.nom : ish.id;
    document.getElementById("hs-meta").innerHTML = '<span class="kod-mono" data-tarjimasiz>' + esc(ish.id) + "</span> " +
      (faol ? '<span class="chip ' + b.chip + '">' + esc(b.nom) + "</span>"
            : '<span class="chip chip-kul">' + (ish.aktivId ? "Balansga qabul qilingan" : "Yopilgan") + "</span>");
    document.getElementById("ish-yop").hidden = !(faol && yozadi());
    ["majlis-qosh", "muloqot-qosh", "res-qosh"].forEach(k => { document.getElementById(k).hidden = !(faol && yozadi()); });

    const joriy = faol ? BOSQ.findIndex(x => x.kalit === ish.bosqich) : (ish.aktivId ? BOSQ.length : BOSQ.findIndex(x => x.kalit === ish.bosqich));
    document.getElementById("zanjir").innerHTML = MKB.zanjir(BOSQ.map(x => ({nom: x.nom, sana: bosqichSana(x.kalit)})), joriy);

    qadamChiz();
    malumotChiz();
    hujjatChiz();
    majlisChiz();
    muloqotChiz();
    restrukturChiz();
    document.getElementById("tarix").innerHTML = (ish.tarix || []).length ? (ish.tarix || []).slice()
      .sort((a, c) => (D.sanaOqi(c.sana) || 0) - (D.sanaOqi(a.sana) || 0)).map(x =>
      '<div class="tarix-band"><b class="kod-mono" data-tarjimasiz>' + esc(x.sana || "—") + "</b><div><b>" + esc(x.voqea || "") + "</b>" +
        (x.izoh ? '<span data-tarjimasiz>' + esc(x.izoh) + "</span>" : "") + "</div></div>").join("")
      : MKB.boshHolat("soat", "Tarix bo'sh");
    tarjimaQil(document.querySelector(".kontent"));
  }

  function muddatBlok(){
    if (ish.holat !== "faol") return "";
    const m = ish.muddat;
    const q = m && m.sana ? qolgan(m.sana) : null;
    const chip = q == null ? "" : q < 0 ? '<span class="chip chip-xavf"><b data-tarjimasiz>' + (-q) + "</b><span>kun o'tdi</span></span>"
      : q === 0 ? '<span class="chip chip-sariq">Bugun</span>'
      : q <= 7 ? '<span class="chip chip-sariq"><b data-tarjimasiz>' + q + "</b><span>kun qoldi</span></span>"
      : '<span class="chip chip-kul"><b data-tarjimasiz>' + q + "</b><span>kun qoldi</span></span>";
    return '<div class="qadam-muddat">' + ik("kalendar") + '<div class="qm-matn">' +
      (m && m.sana ? "<b data-tarjimasiz>" + esc(m.sana) + "</b><span>" + esc(m.izoh || "Nazorat muddati") + "</span>"
                   : "<b>Nazorat muddati belgilanmagan</b><span>Muddat qo'yilsa, yaqinlashganda ro'yxatda ajralib turadi</span>") +
      "</div>" + chip +
      (yozadi() ? '<button type="button" class="tugma tugma-oq tugma-kichik" id="muddat-ozgar" data-yozadi>' + ik("tahrir") + (m && m.sana ? "O'zgartirish" : "Belgilash") + "</button>" : "") +
      "</div>";
  }

  /* Rahbariyat qarori so'rovining holati: kutilmoqda, tasdiqlangan yoki rad etilgan (eng oxirgisi) */
  function sorovHolati(){
    const r = tasdiqlar.filter(x => x.tur === "qabul");
    return {
      ochiq: r.find(x => x.holat === "kutilmoqda") || null,
      tasdiqlangan: r.find(x => x.holat === "tasdiqlangan") || null,
      rad: r.filter(x => x.holat === "rad etilgan").pop() || null,
    };
  }
  function sorovKarta(ikon, sarlavha, ts, izoh){
    return '<div class="sorov-holat" data-sayohat="qabulga">' + ik(ikon) + '<div class="sh-matn"><b>' + sarlavha + "</b>" +
      "<span>" + izoh + "</span></div>" +
      '<a class="tugma tugma-oq tugma-kichik" href="tasdiqlar.html?id=' + encodeURIComponent(ts.id) + '"><span data-tarjimasiz>' + esc(ts.id) + "</span></a></div>";
  }

  function qadamChiz(){
    const joy = document.getElementById("qadam");
    const k = ish.bosqich;
    const qid = encodeURIComponent(ish.id);
    let matn = "", amal = "", holat = "";
    const yoz = yozadi();
    if (ish.holat !== "faol"){
      if (ish.aktivId){
        const a = D.topish ? D.topish(ish.aktivId) : null;
        matn = "<p><span>Garov bank balansiga qabul qilingan.</span> <span>Yopilgan sana:</span> <b data-tarjimasiz>" + esc(ish.yopilganSana || "—") + "</b></p>";
        amal = a ? '<a class="tugma tugma-asosiy" href="obyekt.html?id=' + encodeURIComponent(a.id) + '">' + ik("aktivlar") + "Aktiv kartochkasi</a>"
                 : '<span class="chip chip-kul" data-tarjimasiz>' + esc(ish.aktivId) + "</span>";
      } else {
        const oxirgi = (ish.tarix || [])[(ish.tarix || []).length - 1];
        matn = "<p><span>Ish yopilgan.</span> <span>Yopilgan sana:</span> <b data-tarjimasiz>" + esc(ish.yopilganSana || "—") + "</b></p>" +
          (oxirgi ? '<p data-tarjimasiz>' + esc(oxirgi.voqea + (oxirgi.izoh ? ": " + oxirgi.izoh : "")) + "</p>" : "");
      }
    } else if (k === "ogohlantirish"){
      matn = "<p>Qarzdorga yozma talabnoma yuborilgan. Javob muddatida qarz to'lanmasa, da'vo arizasi tayyorlanadi.</p>";
      if (yoz) amal = '<a class="tugma tugma-asosiy" href="davo-tayyorlash.html?id=' + qid + '">' + ik("sud") + "Da'vo tayyorlash</a>";
    } else if (k === "davo"){
      matn = "<p>Da'vo arizasi sudga topshirilgan. Sud ishni ish yuritishga qabul qilganda ish raqamini qayd eting.</p>";
      if (yoz) amal = '<button type="button" class="tugma tugma-asosiy" data-amal="sud" data-yozadi>' + ik("sud") + "Sud qabul qilganini qayd etish</button>";
    } else if (k === "sud"){
      matn = "<p>Ish sudda ko'rilmoqda. Majlis natijalarini kiritib boring. Qaror e'lon qilingach, uni kiriting.</p>";
      if (yoz) amal = '<a class="tugma tugma-asosiy" href="qaror-kiritish.html?id=' + qid + '">' + ik("muhr") + "Qaror kiritish</a>";
    } else if (k === "qaror"){
      matn = "<p>Sud qarori qabul qilingan. Qaror kuchga kirib, ijro varaqasi olingach, uni MIBga topshiring.</p>";
      if (yoz) amal = '<button type="button" class="tugma tugma-asosiy" data-amal="ijro" data-yozadi>' + ik("hujjat") + "Ijroga topshirish</button>";
    } else if (k === "ijro"){
      const s = sorovHolati();
      /* Sud qarorida undiruv garovga qaratilmagan bo'lsa, garov balansga qabul qilish uchun taklif etilmaydi */
      const garovsiz = !!ish.qaror && ish.qaror.garovgaQaratildi === false;
      const soray = yoz && MKB.huquq("aktivlar", "yoz");
      if (garovsiz){
        matn = "<p>Ijro varaqasi MIBda. Sud qarorida undiruv garov mulkiga qaratilmagan, shu sababli garov balansga qabul qilinmaydi.</p>";
      } else if (s.ochiq){
        matn = "<p>Ijro varaqasi MIBda. Garovni balansga qabul qilish bo'yicha Rahbariyat qarori kutilmoqda.</p>";
        holat = sorovKarta("soat", "Qaror so'rovi yuborildi", s.ochiq,
          "<span>Javob muddati:</span> <b data-tarjimasiz>" + esc(s.ochiq.javobMuddati || "—") + "</b>" +
          (MKB.tasdiq.ozimi(s.ochiq) ? " · <span>Siz yuborgansiz. Boshqa xodim tasdiqlaydi</span>" : ""));
      } else if (s.tasdiqlangan){
        matn = "<p>Rahbariyat garovni balansga qabul qilishni tasdiqladi. Qabulni obyekt menejeri rasmiylashtiradi, unga vazifa yaratilgan.</p>";
        holat = sorovKarta("tasdiq", "Rahbariyat qabulni tasdiqladi", s.tasdiqlangan,
          "<span>Qaror sanasi:</span> <b data-tarjimasiz>" + esc(s.tasdiqlangan.qarorSana || "—") + "</b>");
        if (MKB.huquq("aktivlar", "yoz")) amal = '<a class="tugma tugma-asosiy" href="qabul-boshlash.html?ish=' + qid + '">' + ik("aktivlar") + "Balansga qabul qilish</a>";
      } else {
        matn = "<p>Ijro varaqasi MIBda. Garov savdoda sotilmasa yoki bank uni o'zida qoldirishga qaror qilsa, mulk Rahbariyat qarori bilan balansga qabul qilinadi.</p>";
        if (s.rad) holat = sorovKarta("xavf", "Rahbariyat avvalgi so'rovni rad etgan", s.rad,
          "<span>Sabab:</span> <span data-tarjimasiz>" + esc(s.rad.sabab || "—") + "</span>");
        if (soray) amal = '<button type="button" class="tugma tugma-asosiy" data-amal="tasdiq" data-yozadi data-sayohat="qabulga">' + ik("tasdiq") +
          (s.rad ? "Qarorni qayta so'rash" : "Rahbariyat qarorini so'rash") + "</button>";
        else matn += "<p>Qaror so'rovini mas'ul yurist yuboradi.</p>";
      }
    }
    if (!amal && ish.holat === "faol" && !yoz) matn += "<p>Sizda bu ish bo'yicha amal bajarish huquqi yo'q. Ma'lumotlar faqat ko'rish uchun.</p>";
    joy.innerHTML = matn + holat + (amal ? '<div class="amallar">' + amal + "</div>" : "") + muddatBlok();
    joy.querySelectorAll("[data-amal]").forEach(b => b.addEventListener("click", () => ({sud: sudQayd, ijro: ijroQayd, tasdiq: () => tasdiqSora(b)})[b.dataset.amal]()));
    const mo = document.getElementById("muddat-ozgar");
    if (mo) mo.addEventListener("click", muddatOzgar);
  }

  function malumotChiz(){
    const q = ish.qarzdor || {}, sh = ish.shartnoma || {}, qz = ish.qarz || {}, g = ish.garov || {};
    const adv = ish.advokatId && D.advokat ? D.advokat(ish.advokatId) : null;
    const qator = (ikon, nom, qiymat) => "<dt>" + ik(ikon) + "<span>" + nom + "</span></dt><dd>" + qiymat + "</dd>";
    const ikki = (a, b) => a + (b ? '<span class="ikkinchi">' + b + "</span>" : "");
    document.getElementById("malumot").innerHTML =
      qator("foyd", "Qarzdor", ikki(t(q.nom), [q.tur ? "<span>" + esc(q.tur) + "</span>" : "", q.stirYokiPinfl ? t(q.stirYokiPinfl) : "", q.tel ? t(q.tel) : ""].filter(Boolean).join(" · "))) +
      qator("hujjat", "Kredit shartnomasi", ikki(t(sh.raqam), [sh.tur ? "<span>" + esc(sh.tur) + "</span>" : "", sh.sana ? t(sh.sana) : "", sh.berilgan != null ? "<span>berilgan:</span> " + t(MKB.pul(sh.berilgan)) : ""].filter(Boolean).join(" · "))) +
      qator("pul", "Qarz", ikki('<b class="pul" data-tarjimasiz>' + esc(MKB.pul(qz.jami)) + "</b>",
        "<span>asosiy:</span> " + t(MKB.pul(qz.asosiy)) + " · <span>foiz:</span> " + t(MKB.pul(qz.foiz)) +
        (qz.kechikishKun != null ? " · <span>kechikish:</span> <b data-tarjimasiz>" + qz.kechikishKun + "</b> <span>kun</span>" : ""))) +
      qator("aktivlar", "Garov", ikki(t(g.nom), [g.tur ? "<span>" + esc(g.tur) + "</span>" : "", g.manzil ? t(g.manzil) : (g.hudud ? t(g.hudud) : ""),
        g.bahoMln != null ? "<span>baho:</span> " + t(MKB.pul(g.bahoMln)) : "", g.garovShartnoma ? t(g.garovShartnoma) : ""].filter(Boolean).join(" · "))) +
      qator("sud", "Sud", ish.sud ? ikki(t(ish.sud.nomi), ish.sud.ishRaqami ? "<span>ish raqami:</span> " + t(ish.sud.ishRaqami) : "") : "<span>Sudga berilmagan</span>") +

    const r = await MKB.tasdiqla({
      sarlavha: kel ? "Restrukturizatsiya kelishilganini qayd etish" : "Restrukturizatsiya taklifini rad etish",
      matn: kel ? "Taklif \"Kelishilgan\" holatiga o'tadi va ish tarixiga yoziladi. Kredit shartlarini o'zgartirish kredit bo'limida rasmiylashtiriladi."
                : "Taklif \"Rad etilgan\" holatiga o'tadi. Sabab ish tarixiga yoziladi.",

      okMatn: kel ? "Kelishildi" : "Taklifni rad etish",
      bekorMatn: "Orqaga",
      bajar: async ({sabab}) => {
        await MKBapi.yangilash("RESTRUKTURIZATSIYA", x.id, Object.assign({holat}, sabab ? {izoh: sabab} : {}));

  async function bosqichOtkaz(yangi, patch, tafsilot, muddat, voqea){

      '<div class="maydon keng" id="m-yangi-adv" hidden><div class="forma-tor">' +
        maydon("ism", "F.I.Sh.", kirish("ism", "text", "", ' required data-xato="Advokat F.I.Sh. ni kiriting" autocomplete="off"'), true, "", true) +
        maydon("lits", "Litsenziya raqami", kirish("lits", "text", "", ' required data-xato="Litsenziya raqamini kiriting" autocomplete="off"'), false, "", true) +
        maydon("tel", "Telefon", kirish("tel", "text", "", ' data-format="tel"')) + "</div></div></form>",
    {okMatn: "Saqlash", ok: async parda => {
      const f = parda.querySelector("form");
      const rr = MKB.formaTekshir(f);
      if (!rr) return false;
      const q = rr.qiymatlar;
      let advId = q.adv, advIsm;
      try{
        if (q.adv === "yangi"){
          advId = await MKB.keyingiId("ADVOKATLAR", "AD-", 2);
          await MKBapi.yangi("ADVOKATLAR", {id: advId, ism: q.ism, litsenziya: q.lits, ixtisos: "", tel: q.tel || "", tajriba: ""});
          advIsm = q.ism;
        } else advIsm = (r.find(a => a.id === advId) || {}).ism || advId;
        await MKBapi.yangilash("UNDIRUV_ISHLAR", ish.id, {advokatId: advId, tarix: tarixQosh("Advokat biriktirildi", advIsm)});
      }catch(e){ MKB.formaXato(f, "Advokat biriktirilmadi: " + e.message); return false; }
      MKB.toast(advIsm + " ishga biriktirildi");
      await qaytaChiz();
    }});
    const p = oxirgiParda();
    p.querySelector("#m-adv").addEventListener("change", e => { p.querySelector("#m-yangi-adv").hidden = e.target.value !== "yangi"; });
  }

  document.getElementById("majlis-qosh").addEventListener("click", () => {
    const r = D.ADVOKATLAR || [];
    MKB.modal("Sud majlisini tayinlash", '<form class="forma-tor" novalidate>' +
      maydon("sud", "Sud", kirish("sud", "text", ish.sud && ish.sud.nomi, ' required data-xato="Sud nomini kiriting" autocomplete="off"'), true, "", true) +
      maydon("sana", "Sana", kirish("sana", "date", "", ' required min="' + iso(bugun) + '"'), false, "", true) +
      maydon("soat", "Vaqt", kirish("soat", "time", "10:00", " required"), false, "", true) +
      maydon("zal", "Zal", kirish("zal", "text", "", ' autocomplete="off" placeholder="2-zal"')) +
      maydon("adv", "Advokat", '<select id="m-adv" name="adv"><option value="">Biriktirilmagan</option>' + r.map(a => '<option value="' + esc(a.id) + '"' + (a.id === ish.advokatId ? " selected" : "") + ">" + esc(a.ism) + "</option>").join("") + "</select>") +
      maydon("mavzu", "Mavzu", '<select id="m-mavzu" name="mavzu" required>' + ["Tayyorgarlik majlisi", "Dalillarni o'rganish", "Asosiy muhokama", "Qaror e'lon qilish", "Apellyatsiya majlisi"].map(x => "<option>" + esc(x) + "</option>").join("") + "</select>", true, "", true) + "</form>",
    {okMatn: "Tayinlash", ok: async parda => {
      const f = parda.querySelector("form");
      const rr = MKB.formaTekshir(f, {
        soat: (v, q) => !majlislar.some(m => m.holat === "rejada" && m.sana === q.sana && m.soat === v) || "Shu vaqtga majlis allaqachon tayinlangan",
      });
      if (!rr) return false;
      const q = rr.qiymatlar;
      const adv = r.find(a => a.id === q.adv);
      try{
        const mid = await MKB.keyingiId("SUD_MAJLISLAR", "SM-" + bugun.getFullYear() + "/", 4);
        await MKBapi.yangi("SUD_MAJLISLAR", {id: mid, ishId: ish.id, sud: q.sud, sana: q.sana, soat: q.soat, zal: q.zal || "",
          advokatId: adv ? adv.id : null, advokat: adv ? adv.ism : "", mavzu: q.mavzu, holat: "rejada", natija: ""});
        await MKBapi.yangilash("UNDIRUV_ISHLAR", ish.id, {tarix: tarixQosh("Sud majlisi tayinlandi", q.sana + " " + q.soat + ", " + q.mavzu)});
      }catch(e){ MKB.formaXato(f, "Majlis tayinlanmadi: " + e.message); return false; }
      MKB.toast("Majlis " + q.sana + " " + q.soat + " ga tayinlandi");
      await qaytaChiz();
    }});
  });

  document.getElementById("muloqot-qosh").addEventListener("click", () => {
    MKB.modal("Muloqotni qayd etish", '<form class="forma-tor" novalidate>' +
      maydon("sana", "Sana", kirish("sana", "date", iso(bugun), ' required max="' + iso(bugun) + '"'), false, "", true) +
      maydon("kanal", "Kanal", '<select id="m-kanal" name="kanal" required>' + ["Telefon", "SMS", "Yozma talabnoma", "Uchrashuv"].map(x => "<option>" + x + "</option>").join("") + "</select>", false, "", true) +
      maydon("natija", "Natija", kirish("natija", "text", "", ' required data-xato="Muloqot natijasini yozing" autocomplete="off" placeholder="Masalan: Qisman to\'lov va\'da qilindi"'), true, "", true) + "</form>",
    {okMatn: "Saqlash", ok: async parda => {
      const f = parda.querySelector("form");
      const rr = MKB.formaTekshir(f);
      if (!rr) return false;
      const q = rr.qiymatlar;
      try{
        const mid = await MKB.keyingiId("MULOQOTLAR", "ML-" + ish.id.slice(3).replace("/", "-") + "-", 0);
        await MKBapi.yangi("MULOQOTLAR", {id: mid, ishId: ish.id, sana: q.sana, kanal: q.kanal, natija: q.natija});
      }catch(e){ MKB.formaXato(f, "Muloqot saqlanmadi: " + e.message); return false; }
      MKB.toast("Muloqot qayd etildi");
      await qaytaChiz();
    }});
  });

  document.getElementById("res-qosh").addEventListener("click", () => {
    MKB.modal("Restrukturizatsiya taklifi", '<form class="forma-tor" novalidate>' +
      maydon("taklif", "Taklif mazmuni", kirish("taklif", "text", "", ' required data-xato="Taklif mazmunini yozing" autocomplete="off" placeholder="Masalan: Muddatni 18 oyga uzaytirish"'), true, "", true) +
      maydon("sana", "Kelib tushgan sana", kirish("sana", "date", iso(bugun), ' required max="' + iso(bugun) + '"'), false, "", true) + "</form>",
    {okMatn: "Saqlash", ok: async parda => {
      const f = parda.querySelector("form");
      const rr = MKB.formaTekshir(f);
      if (!rr) return false;
      const q = rr.qiymatlar;
      try{
        const rid = await MKB.keyingiId("RESTRUKTURIZATSIYA", "RS-" + bugun.getFullYear() + "/", 4);
        await MKBapi.yangi("RESTRUKTURIZATSIYA", {id: rid, ishId: ish.id, taklif: q.taklif, sana: q.sana, holat: "korib chiqilmoqda", izoh: ""});
        await MKBapi.yangilash("UNDIRUV_ISHLAR", ish.id, {tarix: tarixQosh("Restrukturizatsiya taklifi kelib tushdi", q.taklif, q.sana)});
      }catch(e){ MKB.formaXato(f, "Taklif saqlanmadi: " + e.message); return false; }
      MKB.toast("Restrukturizatsiya taklifi qayd etildi");
      await qaytaChiz();
    }});
  });

  /* Ishni yopish: qaytarib bo'lmaydi, sabab majburiy va ish raqamini yozib tasdiqlanadi */
  document.getElementById("ish-yop").addEventListener("click", async () => {
    const r = await MKB.tasdiqla({
      sarlavha: "Ishni yopish",
      matn: "Ish " + ish.id + " yopiladi va faol ishlar ro'yxatidan chiqadi. Yopilgan ishni qayta ochib bo'lmaydi.",
      tafsilot: [["Qarzdor", tj(ish.qarzdor && ish.qarzdor.nom)], ["Bosqich", bosqich(ish.bosqich).nom], ["Qarz", tj(MKB.pul(ish.qarz ? ish.qarz.jami : null))]],
      oqibat: ["Nazorat muddati olib tashlanadi", "Garov balansga olinadigan bo'lsa, ishni yopmang: balansga qabul ustasi uni o'zi yopadi"],
      ton: "xavfli",
      sabab: {majburiy: true, min: 5, yorliq: "Yopish sababi", izoh: "Sabab ish tarixiga yoziladi", namuna: "Masalan, qarz to'liq to'landi yoki kelishuv bitimi bajarildi"},
      yozibTasdiq: ish.id,
      okMatn: "Ishni yopish",
      bekorMatn: "Orqaga",
      bajar: ({sabab}) => MKBapi.yangilash("UNDIRUV_ISHLAR", ish.id, {holat: "yopilgan", yopilganSana: bugunMatn, muddat: null,
        tarix: tarixQosh("Ish yopildi", sabab)}),
    });
    if (!r) return;
    MKB.toast("Ish " + ish.id + " yopildi");
    await qaytaChiz();
  });

  let yonaltirildi = false;
  await MKB.sahifaYukla({joylar: JOYLAR, xato: "Ish varaqasini yuklab bo'lmadi",
    ish: async () => { if (!(await yukla())){ yonaltirildi = true; return; } chiz(); }});
  if (yonaltirildi) return;
})();
</script>
</body>
</html>
