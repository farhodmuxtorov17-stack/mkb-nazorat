<script>
(() => {
  let D, esc, yaxlit, usulNomi, jadval = null, ulangan = false;
  function sozla(){
  D = MKB_DATA;
  esc = MKB.esc;
  yaxlit = n => Math.round(n * 10) / 10;
  usulNomi = k => k === "hisobdan" ? "Hisobdan chiqarish" : (((D.SOTISH_USULLARI || []).find(u => u.kalit === k) || {}).nom || k || "—");
  }

  function tolovQoldiq(s){
    if (s.holat === "yakunlangan") return 0;
    const j = Array.isArray(s.jadval) ? s.jadval : [];
    return Math.max(0, yaxlit((+s.narx || 0) - (+s.avans || 0) - j.filter(x => x.tolandi).reduce((a, x) => a + (+x.summa || 0), 0)));
  }

  async function chiz(){
    const arxiv = MKB.doira(await MKBapi.royxat("ARXIV"));
    const qatorlar = arxiv.map(a => {
      const sd = D.sanaOqi(a.sotuvSana);
      return Object.assign({}, a, {nomi: a.qisqa || a.nom || a.id, usul: usulNomi(a.sotishUsuli), yil: sd ? String(sd.getFullYear()) : "—",
        sotuvNarxi: a.sotuvNarxi == null ? null : +a.sotuvNarxi, balansQiymat: +a.balansQiymat || 0, jamiXarajat: +a.jamiXarajat || 0,
        foydaZarar: a.foydaZarar == null ? null : +a.foydaZarar});
    });

    /* Metrikalar: faqat haqiqiy arxiv yozuvlaridan */
    const jami = qatorlar.length;
    const tushum = qatorlar.reduce((s, a) => s + (a.sotuvNarxi || 0), 0);
    const balans = qatorlar.reduce((s, a) => s + a.balansQiymat, 0);
    const natija = qatorlar.reduce((s, a) => s + (a.foydaZarar || 0), 0);
    const kunlar = qatorlar.map(a => a.turganKun).filter(n => n != null && n >= 0).sort((a, b) => a - b);
    const mediana = kunlar.length ? (kunlar.length % 2 ? kunlar[(kunlar.length - 1) / 2] : Math.round((kunlar[kunlar.length / 2 - 1] + kunlar[kunlar.length / 2]) / 2)) : null;
    const pulK = (n, belgi) => { const t = MKB.pul(n), i = t.indexOf(" "); return (belgi || "") + esc(t.slice(0, i)) + "<small>" + esc(t.slice(i)) + "</small>"; };
    const m = (yorliq, qiymat, izoh) => '<div class="metrika"><span class="m-yorliq">' + yorliq + '</span><span class="m-qiymat" data-tarjimasiz>' + qiymat + '</span><span class="m-izoh">' + izoh + "</span></div>";
    document.getElementById("metrikalar").innerHTML =
      m("Chiqarilgan aktivlar", MKB.fmt(jami), "<span>arxiv yozuvlari</span>") +
      m("Jami tushum", jami ? pulK(tushum) : "—", jami ? '<span>balans qiymati</span> <span data-tarjimasiz>' + esc(MKB.pul(balans)) + "</span>" : "<span>ma&#39;lumot yo&#39;q</span>") +
      m("Natija", jami ? '<span class="' + (natija < 0 ? "natija-manfiy" : "natija-musbat") + '">' + pulK(Math.abs(natija), natija < 0 ? "−" : "+") + "</span>" : "—", "<span>tushum − balans − xarajat</span>") +
      m("Balansda turgan muddat", mediana == null ? "—" : MKB.fmt(mediana), mediana == null ? "<span>ma&#39;lumot yo&#39;q</span>" : "<span>kun, mediana</span>");

    const ustunlar = [
      {kalit: "nomi", nom: "Obyekt", oral: true, majburiy: true, chiz: a => '<span class="obyekt-katak">' + MKB.obyektSurati(a, {kichik: true}) +
        '<span><span class="nom">' + esc(a.nomi) + '</span><br><span class="sub kod-mono" data-tarjimasiz>' + esc(a.id) + "</span></span></span>"},
      {kalit: "sotuvSana", nom: "Sotuv sanasi", tur: "sana"},
      {kalit: "usul", nom: "Usul"},
      {kalit: "sotuvNarxi", nom: "Sotuv narxi", son: true, chiz: a => '<span class="pul" data-tarjimasiz>' + esc(MKB.pul(a.sotuvNarxi)) + "</span>"},
      {kalit: "balansQiymat", nom: "Balans qiymati", son: true, chiz: a => '<span data-tarjimasiz>' + esc(MKB.pul(a.balansQiymat)) + "</span>"},
      {kalit: "jamiXarajat", nom: "Xarajatlar", son: true, chiz: a => '<span data-tarjimasiz>' + esc(MKB.pul(a.jamiXarajat)) + "</span>"},
      {kalit: "foydaZarar", nom: "Foyda / zarar", son: true, chiz: a => a.foydaZarar == null ? "—" :
        '<b class="' + (a.foydaZarar < 0 ? "natija-manfiy" : "natija-musbat") + '" data-tarjimasiz>' + (a.foydaZarar < 0 ? "−" : "+") + esc(MKB.pul(Math.abs(a.foydaZarar))) + "</b>"},
    ];
    const yillar = [...new Set(qatorlar.map(a => a.yil))].sort().reverse();
    if (!jadval) jadval = MKB.jadval("jadval-joy", {id: "arxiv", qatorlar, ustunlar, sahifaHajmi: 20, saralash: "sotuvSana", yonalish: -1,
      qidiruv: ["nomi", "id", "xaridor", "filial"], qidiruvYozuvi: "Obyekt, id yoki xaridor",
      filtrlar: [{kalit: "yil", nom: "Yil", variantlar: yillar}, {kalit: "usul", nom: "Usul", variantlar: [...new Set(qatorlar.map(a => a.usul))]}],
      csvNomi: "arxiv",
      bosh: {sarlavha: "Arxiv bo'sh", izoh: D.MANBA === "mahalliy" ? "Mahalliy reyestrda hali balansdan chiqarilgan obyekt yo'q." : "Balansdan chiqarilgan obyektlar shu yerda chiqadi."},
      bosilganda: a => { location.href = "arxiv-obyekt.html?id=" + encodeURIComponent(a.id); }});
    else jadval.yangila(qatorlar);

    /* Chiqimga tayyorlar */
    const r = [];
    MKB.doira((D.TASDIQLAR || []).filter(t => t.tur === "chiqim" && t.holat === "kutilmoqda")).forEach(t => {
      const o = D.topish(t.obyektId || t.manbaId); if (o && o.holat !== "Chiqarildi") r.push({y: o, href: "chiqim-tasdiqlash.html?tasdiq=" + encodeURIComponent(t.id), sabab: "Qaror so'rovi kutilmoqda", chip: ["chip-sariq", "Kutilmoqda"]});
    });
    MKB.doira((D.SHARTNOMALAR || []).filter(s => s.holat !== "bekor" && tolovQoldiq(s) <= 0)).forEach(s => {
      const o = D.topish(s.obyektId); if (o && o.holat !== "Chiqarildi" && !r.some(x => x.y.id === o.id)) r.push({y: o, href: "chiqim-tasdiqlash.html?shartnoma=" + encodeURIComponent(s.id), sabab: "Shartnoma to'liq to'langan", chip: ["chip-yashil", "Tayyor"]});
    });
    MKB.doira((D.YOZUVLAR || []).filter(o => o.holat === "Davaktivga o'tkazilgan")).forEach(o => {
      if (!r.some(x => x.y.id === o.id)) r.push({y: o, href: "chiqim-tasdiqlash.html?id=" + encodeURIComponent(o.id), sabab: "Davaktivga o'tkazilgan", chip: ["chip-kul", "Davaktiv"]});
    });
    const tb = document.getElementById("tayyor-blok");
    tb.hidden = !r.length;
    document.getElementById("tayyor-soni").textContent = r.length;
    const ochadi = MKB.ruxsat("chiqim-tasdiqlash.html");
    /* Rolga yopiq havolani havolalarniTekshir() DOMdan olib tashlaydi: tugma bo'lmasligi mumkin */
    const ct = document.getElementById("chiqim-tugma");
    if (ct) ct.hidden = !ochadi;
    document.getElementById("tayyor").innerHTML = r.map(x => {
      const ichki = MKB.obyektSurati(x.y, {kichik: true, sinf: "media"}) +
        '<div class="matn"><b>' + esc(x.y.qisqa || x.y.nom) + '</b><span><span class="kod-mono" data-tarjimasiz>' + esc(x.y.id) + "</span> · <span>" + esc(x.sabab) + "</span></span></div>" +
        '<div class="ong"><span class="pul" data-tarjimasiz>' + esc(MKB.pul(x.y.balans && x.y.balans.qiymat)) + '</span><span class="chip ' + x.chip[0] + ' chip-kichik">' + x.chip[1] + "</span></div>";
      return ochadi ? '<a class="qator" href="' + x.href + '">' + ichki + "</a>" : '<a class="qator" href="obyekt.html?id=' + encodeURIComponent(x.y.id) + '">' + ichki + "</a>";
    }).join("");
    tarjimaQil(document.querySelector(".kontent"));
  }
  MKB.sahifaYukla({
    joylar: {"metrikalar": ["karta", 4], "jadval-joy": ["jadval", 8]},
    xato: "Arxivni o'qib bo'lmadi",
    ish: async () => {
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      sozla();
      jadval = null;
      await chiz();
      if (!ulangan){ ulangan = true; document.addEventListener("mkb:malumot", () => { chiz().catch(() => {}); }); }
    },
  });
})();
</script>
