<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Nazoratdan chiqarilgan obyektlar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082780">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="arxiv">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Arxiv</span></div>
    <div class="hs-qator"><h1>Nazoratdan chiqarilgan obyektlar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="arxiv.html" class="faol">Reyestr</a><a href="arxiv-yillik.html">Yillik jamlanma</a></nav>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082780"></script>
<script src="malumot.js?v=26082780"></script>
<script src="malumot-qoshimcha.js?v=26082780"></script>
<script src="malumot-kengaytma.js?v=26082780"></script>
<script src="malumot-kirish.js?v=26082780"></script>
<script src="malumot-indeks.js?v=26082780"></script>
<script src="tarjima.js?v=26082780"></script>
<script src="yadro/ikonlar.js?v=26082780"></script>
<script src="yadro/daraxt.js?v=26082780"></script>
<script src="yadro/chizma.js?v=26082780"></script>
<script src="yadro/qollanma.js?v=26082780"></script>
<script src="yadro/api.js?v=26082780"></script>
<script src="yadro/app.js?v=26082780"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("ARXIV");
  document.getElementById("hs-meta").textContent = r.length + " ta yakunlangan ish";
  MKB.jadval("jadval-joy", {
    qatorlar: r.map(a => Object.assign({}, a, {summaN: MKB.sonQiymat(a.summa)})),
    qidiruv: ["nom", "xaridor", "kod"],
    filtrlar: [
      {kalit: "yil", nom: "Yil", variantlar: [...new Set(r.map(a => a.yil))]},
      {kalit: "tur", nom: "Turi", variantlar: [...new Set(r.map(a => a.tur))]},
    ],
    ustunlar: [
      {kalit: "nom", nom: "Obyekt", chiz: a =>
        '<span class="obyekt-katak">' +
        (a.rasm ? '<img class="foto" src="' + a.rasm + '" alt="" loading="lazy">' : '') +
        '<span><span class="nom">' + a.nom + '</span><br><span class="sub kod-mono">' + a.kod + '</span></span></span>'},
      {kalit: "tur", nom: "Turi"},
      {kalit: "sotilgan", nom: "Sotilgan sana"},
      {kalit: "xaridor", nom: "Xaridor"},
      {kalit: "nazorat", nom: "Nazorat davri"},
      {kalit: "summaN", nom: "Summa", son: true, chiz: a => '<span class="pul">' + MKB.fmt(a.summa) + ' mln</span>'},
    ],
    bosilganda: a => location.href = "arxiv-obyekt.html?id=" + encodeURIComponent(a.id),
  });
});
</script>
</body>
</html>
