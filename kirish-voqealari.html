<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>

<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Himoya va monitoring</a><span class="ajratgich">/</span><span>Signallar va voqealar</span></div>
    <div class="hs-qator"><h1>Signallar va voqealar</h1><span class="hs-meta" id="hs-meta"></span><span class="hs-meta" id="kv-yangilandi" data-sayohat="yangilandi" data-tur="kirish-voqealari-yangilandi" hidden></span>
      <div class="hs-amallar"><a class="tugma tugma-oq" href="kirish-hisoboti.html" data-tur="kirish-voqealari-hisobot"><svg class="ic"><use href="#ik-hisobot"/></svg>Himoya hisoboti</a></div></div>
  </div>
  <nav class="bolim-tablar" data-bir-qator aria-label="Bo'lim ichi"><a href="himoya.html">Monitoring markazi</a><a href="qoriqlash.html">Qo'riqlash</a><a href="kommunal.html">Kommunal</a><a href="qurilmalar.html">Qurilmalar</a><a href="hodisalar.html">Hodisalar</a><a href="tashriflar.html">Tashriflar</a><a href="masofaviy-korik.html">Masofaviy ko'rik</a><a href="ruxsatlar.html">Ruxsatlar</a><a href="kirish-voqealari.html" class="faol" aria-current="page">Signallar</a></nav>
  <div class="kv-asbob" data-tur="kirish-voqealari-filtr">
    <div role="group" aria-label="Ko'rinish" style="display:flex;gap:6px">
      <button type="button" class="pill faol" data-rejim="kirish">Kirish voqealari</button>
      <button type="button" class="pill" data-rejim="signal">Qurilma signallari</button>
    </div>
    <label class="tanlov"><span class="t-old">Obyekt:</span><select id="kv-obyekt" aria-label="Obyekt bo'yicha"><option value="">Barchasi</option></select></label>
  </div>

<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(async () => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  const yuklandi = await new Promise(hal => MKB.sahifaYukla({
    joylar: {"kv-jadval": ["jadval", 10]},
    xato: "Signallar va voqealarni yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["KIRISH_VOQEALARI", "XAVFSIZLIK_HODISALARI", "SHAXSLAR", "QURILMALAR"]);
      ulandi = true;
      hal(true);
    },
  }));
  if (!yuklandi) return;
  /* Yangi kiritilgan shaxs indeksda bo'lmasligi mumkin: to'plamdan ham qidiriladi */
  const shaxsTop = id => D.shaxs(id) || (D.SHAXSLAR || []).find(s => s.id === id) || null;

  const p = new URLSearchParams(location.search);
  let rejim = p.get("rejim") === "signal" ? "signal" : "kirish";
  const NAT = {ruxsat: ["Ruxsat berildi", "chip-yashil"], rad: ["Rad etildi", "chip-xavf"], ogohlantirish: ["Ogohlantirish", "chip-sariq"], "qayd etildi": ["Qayd etildi", "chip-kul"]};
  const XH = {ochiq: ["Yangi", "chip-xavf"], tekshiruvda: ["Tekshiruvda", "chip-sariq"], bartaraf: ["Bartaraf etilmoqda", "chip-info"], hal: ["Hal qilindi", "chip-yashil"], yopildi: ["Yopildi", "chip-kul"]};
  const JID = {"yuqori": "Yuqori", "o'rta": "O'rta", "past": "Past"};
  let voqealar = MKB.doira(D.KIRISH_VOQEALARI || []);
  let signallar = MKB.doira(D.XAVFSIZLIK_HODISALARI || []);
  const obIdlar = [...new Set(voqealar.concat(signallar).map(v => v.obyektId))].map(i => [i, MKB.kn.obyektYorligi(i)]).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  /* Havoladan kelgan obyektda voqea bo'lmasa ham u tanlanadi: butun jurnal o'rniga bo'sh holat ko'rsatiladi */
  if (p.get("obyekt") && !obIdlar.some(x => x[0] === p.get("obyekt"))) obIdlar.unshift([p.get("obyekt"), MKB.kn.obyektYorligi(p.get("obyekt"))]);
  $("kv-obyekt").insertAdjacentHTML("beforeend", obIdlar.map(([i, n]) => '<option value="' + esc(i) + '">' + esc(n) + "</option>").join(""));
  if (p.get("obyekt")) $("kv-obyekt").value = p.get("obyekt");

  const kirishQator = v => { const sh = shaxsTop(v.shaxsId);
    return {id: v.id, v, vaqt: v.vaqt || "", obyekt: MKB.kn.obyektNomi(v.obyektId), nuqta: v.nuqtaNomi || "", shaxs: sh ? sh.ism : (v.natija === "qayd etildi" ? "Shaxs aniqlanmaydi" : "Aniqlanmagan"),
      usul: v.usul || "—", yonalish: v.yonalish === "chiqish" ? "Chiqish" : "Kirish", natija: (NAT[v.natija] || [v.natija || "—"])[0], k: v.natija, sabab: v.sabab || ""}; };
  const signalQator = h => { const q = D.qurilma(h.qurilmaId);
    return {id: h.id, h, vaqt: h.vaqt || h.sana || "", obyekt: MKB.kn.obyektNomi(h.obyektId), hodisa: h.hodisa || "", qurilma: q ? q.turNomi : "—", jiddiylik: JID[h.jiddiylik] || h.jiddiylik || "—",
      holat: (XH[h.holat] || [h.holat])[0], k: h.holat, masul: h.masul || ""}; };

  let jadval = null;
  function chiz(){
    const o = $("kv-obyekt").value;
    document.querySelectorAll("[data-rejim]").forEach(b => { b.classList.toggle("faol", b.dataset.rejim === rejim); b.setAttribute("aria-pressed", b.dataset.rejim === rejim); });
    jadval = null;
    if (rejim === "kirish"){
      const q = voqealar.filter(v => !o || v.obyektId === o).map(kirishQator);
      $("hs-meta").innerHTML = '<b data-tarjimasiz>' + q.length + "</b> <span>ta kirish voqeasi</span> · <b data-tarjimasiz>" + q.filter(x => x.k === "rad").length + "</b> <span>ta rad etilgan</span>";
      jadval = MKB.jadval("kv-jadval", {qatorlar: q, csvNomi: "kirish-voqealari",
        qidiruv: ["shaxs", "obyekt", "nuqta", "id", "sabab"], qidiruvYozuvi: "Shaxs, obyekt yoki sabab",
        filtrlar: [{kalit: "natija", nom: "Natija", variantlar: Object.values(NAT).map(x => x[0])}, {kalit: "usul", nom: "Usul", variantlar: [...new Set(q.map(x => x.usul))].sort()},
                   {kalit: "yonalish", nom: "Yo'nalish", variantlar: ["Kirish", "Chiqish"]}],
        bosh: {sarlavha: "Kirish voqeasi yo'q", izoh: "Aqlli qulf, eshik datchigi yoki Face ID o'rnatilgach voqealar shu yerda yoziladi"},
        ustunlar: [
          {kalit: "vaqt", nom: "Vaqt", tur: "sana", chiz: x => '<span data-tarjimasiz style="white-space:nowrap">' + esc(x.vaqt) + "</span>"},
          {kalit: "obyekt", nom: "Obyekt va nuqta", chiz: x => esc(x.obyekt) + '<div class="kod-mono">' + esc(x.nuqta) + "</div>", csv: x => x.obyekt + ", " + x.nuqta},
          {kalit: "shaxs", nom: "Shaxs"},
          {kalit: "usul", nom: "Usul", chiz: x => esc(x.usul) + '<div class="kod-mono">' + esc(x.yonalish) + "</div>", csv: x => x.usul},
          {kalit: "natija", nom: "Natija", chiz: x => '<span class="chip chip-kichik ' + (NAT[x.k] || ["", "chip-kul"])[1] + '">' + esc(x.natija) + "</span>"},
        ],
        saralash: "vaqt", yonalish: -1,
        bosilganda: x => { location.href = "kirish-voqea.html?id=" + encodeURIComponent(x.id); }});
    } else {
      const q = signallar.filter(v => !o || v.obyektId === o).map(signalQator);
      $("hs-meta").innerHTML = '<b data-tarjimasiz>' + q.length + "</b> <span>ta qurilma signali</span>";
      jadval = MKB.jadval("kv-jadval", {qatorlar: q, csvNomi: "qurilma-signallari",
        qidiruv: ["hodisa", "obyekt", "id", "masul"], qidiruvYozuvi: "Signal, obyekt yoki mas'ul",
        filtrlar: [{kalit: "jiddiylik", nom: "Jiddiylik", variantlar: ["Yuqori", "O'rta", "Past"]}, {kalit: "holat", nom: "Holat", variantlar: Object.values(XH).map(x => x[0])}],
        bosh: {sarlavha: "Signal yo'q", izoh: "Qurilma o'rnatilgach aloqa uzilishi, batareya va datchik signallari shu yerda chiqadi"},
        ustunlar: [
          {kalit: "vaqt", nom: "Vaqt", tur: "sana", chiz: x => '<span data-tarjimasiz style="white-space:nowrap">' + esc(x.vaqt) + "</span>"},
          {kalit: "hodisa", nom: "Signal", chiz: x => "<b>" + esc(x.hodisa) + '</b><div class="kod-mono">' + esc(x.qurilma) + "</div>", csv: x => x.hodisa},
          {kalit: "obyekt", nom: "Obyekt"},
          {kalit: "jiddiylik", nom: "Jiddiylik"},
          {kalit: "holat", nom: "Holat", chiz: x => '<span class="chip chip-kichik ' + (XH[x.k] || ["", "chip-kul"])[1] + '">' + esc(x.holat) + "</span>"},
        ],
        saralash: "vaqt", yonalish: -1,
        bosilganda: x => { location.href = "hodisa.html?id=" + encodeURIComponent(x.id); }});
    }
    const n = p.get("natija");
    if (jadval && rejim === "kirish" && n && NAT[n]){ jadval.holat.filtrlar.natija = NAT[n][0]; jadval.yangila(); }
    tarjimaQil($("hs-meta"));
    const u = new URL(location.href);
    u.searchParams.set("rejim", rejim); if (o) u.searchParams.set("obyekt", o); else u.searchParams.delete("obyekt");
    history.replaceState(null, "", u);
  }
  document.querySelectorAll("[data-rejim]").forEach(b => b.addEventListener("click", () => { rejim = b.dataset.rejim; chiz(); }));
  $("kv-obyekt").addEventListener("change", chiz);
  chiz();
  const belgi = MKB.yangilanganBelgi("kv-yangilandi", {avto: 60, yangila: async () => {
    await MKB.kn.yukla(["KIRISH_VOQEALARI", "XAVFSIZLIK_HODISALARI", "SHAXSLAR", "QURILMALAR"]);
    voqealar = MKB.doira(D.KIRISH_VOQEALARI || []); signallar = MKB.doira(D.XAVFSIZLIK_HODISALARI || []);
    chiz();
  }});
  belgi.belgila();
})();
</script>
</body>
</html>
