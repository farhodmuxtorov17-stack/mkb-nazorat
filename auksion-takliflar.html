<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Takliflar reyestri</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="savdo">
<div class="qobiq">
<nav class="relsa" id="relsa" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Realizatsiya</span></div>
    <div class="hs-qator"><h1>Takliflar reyestri</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="savdo.html">Doska</a><a href="auksion-jadvali.html">Auksion jadvali</a><a href="auksion-takliflar.html" class="faol">Takliflar</a><a href="tolov-nazorati.html">To'lovlar</a><a href="ijara.html">Ijara</a><a href="xaridorlar.html">Xaridorlar</a><a href="savdo-natijalari.html">Natijalar</a></nav>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("TAKLIFLAR");
  document.getElementById("hs-meta").textContent = r.length + " ta taklif";
  MKB.jadval("jadval-joy", {
    qatorlar: r.map(t => Object.assign({}, t, {summaN: MKB.sonQiymat(t.summa)})),
    qidiruv: ["kim", "obyekt"],
    filtrlar: [{kalit: "holat", nom: "Holat", variantlar: [...new Set(r.map(t => t.holat))]}],
    ustunlar: [
      {kalit: "id", nom: "Taklif", chiz: t => '<span class="kod-mono">' + t.id + '</span>'},
      {kalit: "obyekt", nom: "Lot"},
      {kalit: "kim", nom: "Ishtirokchi", chiz: t => '<b>' + t.kim + '</b><br><span style="font-size:11px;color:var(--iz)">' + t.turi + '</span>'},
      {kalit: "summaN", nom: "Summa", son: true, chiz: t => '<span class="pul">' + MKB.fmt(t.summa) + ' mln</span>'},
      {kalit: "sana", nom: "Sana"},
      {kalit: "holat", nom: "Holat", chiz: t => '<span class="chip ' +
        (t.holat === "yetakchi" ? "chip-brend" : t.holat === "muzokarada" ? "chip-sariq" : "") + '">' + t.holat + '</span>'},
    ],
    saralash: "summaN",
    bosilganda: t => location.href = "lot.html?id=" + encodeURIComponent(t.obyektId),
  });
});
</script>
</body>
</html>
