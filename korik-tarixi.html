</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Ko'rik nazorati</span></div>
    <div class="hs-qator"><h1>Ko'riklar tarixi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html">Reja</a><a href="korik-kalendar.html">Kalendar</a><a href="korik-tarixi.html" class="faol">Tarix</a><a href="korik-kechikkan.html">Kechikkanlar</a><a href="korik-marshrut.html">Marshrutlar</a></nav>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082730"></script>
<script src="malumot.js?v=26082730"></script>
<script src="malumot-qoshimcha.js?v=26082730"></script>

<script src="malumot-kirish.js?v=26082730"></script>
<script src="malumot-indeks.js?v=26082730"></script>

<script src="yadro/qollanma.js?v=26082730"></script>
<script src="yadro/api.js?v=26082730"></script>
<script src="yadro/app.js?v=26082730"></script>
<script>
function korikQatori(k){
  return '<a class="qator" href="korik-akti.html?id=' + encodeURIComponent(k.id) + '">' +
    '<span class="belgi ' +
      (k.holat === "rejada" ? "mint" : k.holat === "kechikkan" ? "pushti" : "lavanda") + '">' + ik("korik") + '</span>' +
    '<span class="matn"><b>' + (k.obyektNomi || k.obyektId) + '</b>' +
    '<span>' + k.id + ' · ' + (k.tur || "Rejali") + ' · ' + k.inspektor + '</span></span>' +
    '<span class="chip ' + (k.holat === "rejada" ? "chip-brend" : k.holat === "kechikkan" ? "chip-xavf" : "chip-yashil") + '">' + k.sana + '</span></a>';
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? (o.qisqa || o.nom) : id;
}
document.addEventListener("mkb:tayyor", async () => {
  const r = (await MKBapi.royxat("KORIKLAR")).filter(k => k.holat === "otkazildi");
  r.forEach(k => k.obyektNomi = obyektNomi(k.obyektId));
  document.getElementById("hs-meta").textContent = r.length + " ta o'tkazilgan ko'rik";
  MKB.jadval("jadval-joy", {
    qatorlar: r,
    qidiruv: ["id", "obyektNomi", "inspektor"],
    filtrlar: [{kalit: "tur", nom: "Turi", variantlar: [...new Set(r.map(k => k.tur || "Rejali"))]}],
    ustunlar: [
      {kalit: "id", nom: "Akt", chiz: k => '<span class="kod-mono">' + k.id + '</span>'},
      {kalit: "obyektNomi", nom: "Obyekt"},
      {kalit: "tur", nom: "Turi"},
      {kalit: "sana", nom: "Sana"},
      {kalit: "inspektor", nom: "Inspektor"},
      {kalit: "baho", nom: "Baho", chiz: k => k.baho ? '<span class="chip">' + k.baho + '</span>' : "—"},
    ],
    bosilganda: k => location.href = "korik-akti.html?id=" + encodeURIComponent(k.id),
  });
});
</script>
</body>
</html>
