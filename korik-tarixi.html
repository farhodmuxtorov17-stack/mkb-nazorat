        <select id="kt-davr" aria-label="Davr"><option value="oy">Shu oy</option><option value="chorak">Oxirgi 3 oy</option><option value="yil" selected>Oxirgi 12 oy</option><option value="hammasi">Butun davr</option></select></div></div></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html">Ko'rik rejasi</a><a href="korik-kechikkan.html">Kechikkanlar</a><a href="korik-tarixi.html" class="faol" aria-current="page">Ko'riklar tarixi</a><a href="korik-tayinlash.html">Ko'rik tayinlash</a><a href="masofaviy-korik.html">Masofaviy ko'rik</a><a href="inventarizatsiya.html">Inventarizatsiya</a></nav>

  <section class="metrika-qator uch" aria-label="Asosiy ko'rsatkichlar" data-sayohat="kpi">

    <div class="metrika" data-ikonka="yulduz"><span class="m-yorliq">O'rtacha baho</span><span class="m-qiymat" id="kt-baho">—</span><span class="m-izoh"><span>5 ballik tizim</span></span></div>
    <div class="metrika" data-ikonka="ogoh"><span class="m-yorliq">Kamchilik aniqlangan</span><span class="m-qiymat" id="kt-kam">—</span><span class="m-izoh" id="kt-kam-izoh">—</span></div>
  </section>

  <section class="karta">
    <div class="karta-bosh"><h2 data-ikonka="grafik">Oylar bo'yicha</h2><span class="soni">oxirgi 12 oy</span></div>

<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc;
  const bugun = () => { const b = D.bugun(); return new Date(b.getFullYear(), b.getMonth(), b.getDate()); };
  const BAHO = {5: "A'lo", 4: "Yaxshi", 3: "Qoniqarli", 2: "Nuqsonli", 1: "Avariya holati"};
  const bahoChip = n => n ? '<span class="chip chip-kichik ' + (n >= 4 ? "chip-yashil" : n === 3 ? "chip-sariq" : "chip-xavf") + '"><span><b data-tarjimasiz>' + n + "</b> <span>" + BAHO[n] + "</span></span></span>" : "—";
  const OYLAR = ["yan", "fev", "mar", "apr", "may", "iyn", "iyl", "avg", "sen", "okt", "noy", "dek"];
  const tanlov = document.getElementById("kt-davr");
  const url = new URLSearchParams(location.search);
  if (url.get("davr") && [...tanlov.options].some(o => o.value === url.get("davr"))) tanlov.value = url.get("davr");
  let jadval = null;

  function hammasi(){
    return MKB.doira(D.KORIKLAR || []).filter(k => k.holat === "otkazildi").map(k => {
      const o = D.OBYEKT_INDEKS[k.obyektId] || {};
      const kamchilik = (k.chekList || []).filter(c => c.natija === "kamchilik").length;
      return {id: k.id, sana: k.sana, d: D.sanaOqi(k.sana), obyekt: o.qisqa || o.nom || k.obyektId, obyektId: k.obyektId,
        turi: k.korikTuri || k.tur || "Rejali", inspektor: k.inspektor || "—", ball: k.holatBall || null,
        baho: k.holatBall ? k.holatBall + " · " + BAHO[k.holatBall] : "—",
        natija: kamchilik || k.kamchiliklar ? "Kamchilik bor" : "Kamchiliksiz", kamchilik, xulosa: k.xulosa || ""};
    });
  }
  function davrdan(r){
    const b = bugun(), v = tanlov.value;
    if (v === "hammasi") return r;
    const bosh = v === "oy" ? new Date(b.getFullYear(), b.getMonth(), 1) : D.oyQosh(b, v === "chorak" ? -3 : -12);
    return r.filter(x => x.d && x.d >= bosh && x.d <= b);
  }

  function chiz(){
    const hamma = hammasi();
    const r = davrdan(hamma);
    const b = bugun();
    document.getElementById("hs-meta").innerHTML = "<span data-tarjimasiz>" + MKB.fmt(hamma.length) + "</span> <span>ta yozuv</span>";
    document.getElementById("kt-jami").textContent = MKB.fmt(r.length);
    document.getElementById("kt-jami-izoh").innerHTML = "<span>" + esc(tanlov.options[tanlov.selectedIndex].text) + "</span>";
    const ballar = r.filter(x => x.ball);
    document.getElementById("kt-baho").innerHTML = ballar.length ? (ballar.reduce((s, x) => s + x.ball, 0) / ballar.length).toFixed(1).replace(".", ",") + "<small>/ 5</small>" : "—";
    const kam = r.filter(x => x.natija === "Kamchilik bor").length;
    document.getElementById("kt-kam").textContent = MKB.fmt(kam);
    document.getElementById("kt-kam-izoh").innerHTML = r.length ? "<span data-tarjimasiz>" + Math.round(kam / r.length * 100) + "%</span> <span>ko'riklarda</span>" : "<span>Davrda ko'rik yo'q</span>";

    /* 12 oylik dinamika */
    const oylar = [], qiymatlar = [];
    for (let i = 11; i >= 0; i--){
      const d = new Date(b.getFullYear(), b.getMonth() - i, 1);
      oylar.push(OYLAR[d.getMonth()]);
      qiymatlar.push(hamma.filter(x => x.d && x.d.getFullYear() === d.getFullYear() && x.d.getMonth() === d.getMonth()).length);
    }
    const ch = document.getElementById("kt-chizma");
    if (qiymatlar.some(Boolean)){ ch.innerHTML = ""; MKBchizma.ustun(ch, {qiymatlar, yorliqlar: oylar, balandlik: 180, urgu: 11, tooltipFormat: v => v + " ta ko'rik"}); }
    else ch.innerHTML = MKB.boshHolat("grafik", "Ko'rik tarixi yo'q", D.MANBA === "mahalliy" ? "Mahalliy reyestrda ko'riklar hali kiritilmagan" : "");

    document.getElementById("kt-soni").textContent = r.length + " ta";
    const cfg = {
      qatorlar: r, saralash: "sana", yonalish: -1, sahifaHajmi: 12,
      qidiruv: ["obyekt", "obyektId", "inspektor", "id", "xulosa"], qidiruvYozuvi: "Obyekt, inspektor yoki xulosa",
      filtrlar: [
        {kalit: "turi", nom: "Turi", variantlar: [...new Set(hamma.map(x => x.turi))].sort()},
        {kalit: "inspektor", nom: "Inspektor", variantlar: [...new Set(hamma.map(x => x.inspektor))].sort()},
        {kalit: "natija", nom: "Natija", variantlar: ["Kamchilik bor", "Kamchiliksiz"]},
      ],
      csvNomi: "koriklar-tarixi",
      bosh: {sarlavha: "Bu davrda ko'rik o'tkazilmagan", izoh: "Davrni kengaytirib ko'ring"},
      ustunlar: [
        {kalit: "sana", nom: "Sana", tur: "sana", chiz: x => '<span class="kod-mono" data-tarjimasiz>' + esc(x.sana) + "</span>"},
        {kalit: "obyekt", nom: "Obyekt", chiz: x => "<b>" + esc(x.obyekt) + '</b><br><span style="font-size:12px;color:var(--matn-3)"><span class="kod-mono" data-tarjimasiz>' + esc(x.id) + "</span> · <span>" + esc(x.turi) + "</span></span>"},
        {kalit: "inspektor", nom: "Inspektor"},
        {kalit: "ball", nom: "Baho", tur: "son", chiz: x => bahoChip(x.ball), csv: x => x.baho},
        {kalit: "natija", nom: "Natija", chiz: x => x.natija === "Kamchilik bor" ? '<span class="chip chip-kichik chip-sariq">Kamchilik bor</span>' : '<span class="chip chip-kichik chip-kul">Kamchiliksiz</span>'},
      ],
      bosilganda: x => { location.href = "korik-akti.html?id=" + encodeURIComponent(x.id); },
    };
    if (jadval) jadval.yangila(r); else jadval = MKB.jadval("kt-jadval", cfg);
    tarjimaQil(document.querySelector(".kontent"));
  }
  tanlov.addEventListener("change", chiz);
  MKB.sahifaYukla({joylar: {"kt-chizma": ["qator", 3], "kt-jadval": ["jadval"]}, xato: "Ko'riklar tarixini yuklab bo'lmadi", ish: async () => {
    await MKB.kolYukla(["KORIKLAR"]);
    chiz();
  }});
})();
</script>
</body>
</html>
