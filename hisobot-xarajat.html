<script>

function gorizontalBar(joy, juftlar, rang){
  MKB.barlar(joy, juftlar.map(([nom, v]) => [nom, v, rang]), {format: (n, j) => j[1]});
}
function ustunBar(joy, yorliqlar, qiymatlar){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:12px;height:160px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + String(v).replace(".", ",") + '</span>' +
        '<div style="width:100%;max-width:38px;height:' + Math.round(v / maks * 112) + 'px;border-radius:14px 14px 4px 4px;background:' +
        (i === qiymatlar.length - 1 ? 'var(--brend)' : 'var(--siyoh)') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span></div>').join("") + '</div>';
}
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("XARAJATLAR");
  const jami = r.reduce((a, v) => a + MKB.sonQiymat(v.summa), 0);
  const tol = r.filter(v => v.holat === "tolangan").reduce((a, v) => a + MKB.sonQiymat(v.summa), 0);
  /* summalar mln so'mda saqlanadi; 1 mlrd dan oshsa mlrd so'mda ko'rsatiladi */
  const pul = v => v >= 1000 ? (v / 1000).toFixed(1).replace(".", ",") + "<small>mlrd so'm</small>"
    : MKB.fmt(Math.round(v)) + "<small>mln so'm</small>";
  document.getElementById("hs-meta").textContent = MKB.fmt(r.length) + " ta yozuv";
  document.getElementById("hx-1").innerHTML = pul(jami);
  document.getElementById("hx-2").innerHTML = pul(tol);
  document.getElementById("hx-3").innerHTML = pul(jami - tol);
  const turlar = {};
  r.forEach(v => turlar[v.tur] = (turlar[v.tur] || 0) + MKB.sonQiymat(v.summa));
  MKB.barlar("hx-bar", Object.entries(turlar).sort((a, b) => b[1] - a[1]).map(([n, v]) => [n, Math.round(v)]),
    {format: v => MKB.fmt(v)});
});
</script>
