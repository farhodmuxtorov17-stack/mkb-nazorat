<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Obyekt pasporti</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<link rel="stylesheet" href="yadro/dalolatnoma.css?v=26092200">
<style>
#pasport > .skelet-royxat{background:var(--oq);border-radius:var(--r-karta);padding:24px;box-shadow:var(--soya);max-width:880px;margin:0 auto;width:100%}
</style>
</head>
<body data-sahifa="aktivlar">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="obyektlar.html">Balans aktivlari</a><span class="ajratgich">/</span><span id="hs-obyekt" data-tarjimasiz>—</span></div>
    <div class="hs-qator"><h1>Obyekt pasporti</h1><span class="hs-meta" id="hs-meta" data-tarjimasiz>—</span>
      <div class="hs-amallar">
        <a class="tugma tugma-oq tugma-kichik" id="orqaga" href="obyekt.html" data-sayohat="orqaga"><svg class="ic"><use href="#ik-chap"/></svg><span>Kartochkaga qaytish</span></a>
        <button type="button" class="tugma tugma-asosiy tugma-kichik" id="chop" data-sayohat="chop"><svg class="ic"><use href="#ik-chop"/></svg><span>Chop etish</span></button>
      </div></div>
  </div>

  <div id="pasport" data-sayohat="pasport"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script src="yadro/dalolatnoma.js?v=26092200"></script>
<script>
MKB.sahifaYukla({joylar: {pasport: ["qator", 8]}, xato: "Obyekt pasportini yuklab bo'lmadi", ish: async () => {
  const joy = document.getElementById("pasport");
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r));
  const D = MKB_DATA;
  const id = new URLSearchParams(location.search).get("id");
  const y = id ? D.topish(id) : null;
  if (!y || !MKB.doira([y]).length){ location.replace("xato-404.html"); return; }
  await MKB.kolYukla(["SUGURTALAR", "QORIQLASH", "QURILMALAR"]);
  const q = encodeURIComponent(y.id);
  document.getElementById("hs-obyekt").innerHTML = '<a href="obyekt.html?id=' + q + '">' + MKB.esc(y.qisqa || y.nom) + "</a>";
  document.getElementById("hs-meta").textContent = y.id + (y.filial ? " · " + y.filial : "");
  document.getElementById("orqaga").href = "obyekt.html?id=" + q;
  document.getElementById("chop").onclick = () => window.print();

  const bugun = D.bugun();
  const t = v => v == null || v === "" ? null : {t: v};
  const sanaKalit = s => { const d = D.sanaOqi(s); return d ? d.getTime() : 0; };
  const binoli = D.binolimi(y);
  const b = y.balans || {}, h = y.huquq || {}, md = y.maydon || {}, qv = y.qiymat || {};
  const asos = D.qabulAsosiInfo(b.qabulAsosi);
  const z = D.zaxiraHisobi(y);
  const m2 = v => v > 0 ? MKB.fmt(Math.round(v)) + " m²" : null;

  /* Sug'urta: SUGURTALAR dagi eng oxirgi mos polis */
  const kerakPolis = y.turKalit === "transport" ? "OSAGO" : "mulk";
  const polis = (D.SUGURTALAR || []).filter(s => s.obyektId === y.id && (!s.polisTuri || s.polisTuri === kerakPolis))
    .sort((a, c) => sanaKalit(c.tugash) - sanaKalit(a.tugash))[0];
  const polisAmalda = polis && D.sanaOqi(polis.tugash) >= bugun;
  const qq = (D.QORIQLASH || []).filter(x => x.obyektId === y.id && x.holat === "amalda" && (!x.tugash || D.sanaOqi(x.tugash) >= bugun))[0];
  const qurilmalar = (D.QURILMALAR || []).filter(x => x.obyektId === y.id);
  const aloqada = qurilmalar.filter(x => D.qurilmaHolati ? D.qurilmaHolati(x).aloqada : x.holat === "onlayn").length;
  const taqiqlar = (h.taqiqlar || []).filter(x => x && !x.yechilganSana);
  const KOMMUNAL = {ulangan: "Ulangan", uzilgan: "Uzilgan", "vaqtincha to'xtatilgan": "Vaqtincha to'xtatilgan", "mavjud emas": "Mavjud emas"};
  const suratlar = (MKB.suratlar ? MKB.suratlar(y) : []).filter(s => s.tur !== "sxema").slice(0, 6);

  const model = {
    tur: "pasport", sarlavha: "Obyekt pasporti", raqam: y.id, sana: D.sanaYoz(bugun), sanaXeshda: false,
    joy: y.hududToliq || y.hudud || "", filial: y.filial || "", obyekt: {id: y.id, nom: y.nom},
    havola: "obyekt-pasport.html?id=" + q,
    bolimlar: [
      {sarlavha: "Umumiy ma'lumot", kv: [
        ["Turi", t(y.tur)], ["Holat", t(y.holat)],
        y.tafsilot ? ["Tavsif", y.tafsilot, {keng: true}] : null,
        ["Manzil", y.manzil || y.hududToliq || null, {keng: true}],
        ["Sobiq egasi", y.sobiqEga || null], ["Mas'ul saqlovchi", y.masul || null],
      ]},
      {sarlavha: binoli ? "Huquq va kadastr" : "Ro'yxat ma'lumotlari", kv: binoli ? [
        ["Kadastr raqami", h.kadastrRaqami || null], ["Huquq qayd sanasi", h.qaydSana || null],
        ["Reyestrdan ko'chirma", h.reyestrKochirma || null], ["Yer huquqi turi", t(h.yerHuquqiTuri)],
        ["Taqiqlar", taqiqlar.length ? taqiqlar.map(x => [x.turi, x.organ, x.sana].filter(Boolean).join(", ")).join("; ") : {t: "Yo'q"}, {keng: true}],
        ["Yer maydoni", m2(md.yer)], ["Qurilish osti", m2(md.qurilishOsti)], ["Foydali maydon", m2(md.foydali)],
      ] : [
        ["Davlat raqami", h.davlatRaqami || null], ["VIN yoki zavod raqami", h.vin || null],
        ["Texnik pasport", h.texPasport || null], ["YHXXda qayd sanasi", h.yhxxQaydSana || null],
        ["Taqiqlar", taqiqlar.length ? String(taqiqlar.length) : {t: "Yo'q"}],
      ]},
      {sarlavha: "Balans va qiymat", kv: [
        ["Balansga qabul sanasi", b.sana || null], ["Qabul asosi", asos ? {t: asos.nom} : null],
        ["Asos hujjati", b.asosHujjat && b.asosHujjat.raqam ? "№ " + b.asosHujjat.raqam + (b.asosHujjat.sana ? ", " + b.asosHujjat.sana : "") : null],
        ["Balans qiymati", b.qiymat ? MKB.pul(b.qiymat) : null], ["Hisobvaraq", b.hisobvaraq || null],
        ["Bozor qiymati", qv.bozor != null && !qv.baholanmagan ? MKB.pul(qv.bozor) + (qv.bahoSana ? ", " + qv.bahoSana : "") : {t: "Baholanmagan"}],
        qv.tugatish ? ["Tugatish qiymati", MKB.pul(qv.tugatish)] : null,
        ["Zaxira", z && !z.kiritilmagan ? {html: "<span>" + MKB.esc(z.toifaNomi || "") + '</span><span data-tarjimasiz>, ' + z.foiz + "%, " + MKB.esc(MKB.pul(z.summa)) + "</span>" +
          (z.taxminiy ? " <span>(buxgalteriya tasdig'ida)</span>" : "")} : null, {xeshsiz: true}],   /* foiz balansdagi kunlar bilan o'sadi */
      ]},
      {sarlavha: "Sug'urta va himoya", kv: [
        ["Polis", polis ? (polis.polis || polis.id) : {t: "Sug'urtalanmagan"}],
        polis ? ["Sug'urtachi", polis.kompaniya || null] : null,
        polis ? ["Sug'urta summasi", polis.summa ? MKB.pul(polis.summa) : null] : null,
        polis ? ["Amal qilish muddati", {html: '<span data-tarjimasiz>' + MKB.esc((polis.boshlanish || "—") + " – " + (polis.tugash || "—")) + "</span>" + (polisAmalda ? "" : " <span>(muddati tugagan)</span>")}, {xesh: (polis.boshlanish || "") + "/" + (polis.tugash || "")}] : null,
        ["Qo'riqlash", qq ? {html: "<span>" + MKB.esc((D.QORIQLASH_TURLARI.find(x => x.kalit === qq.qoriqlashTuri) || {}).nom || qq.qoriqlashTuri) + '</span><span data-tarjimasiz>, ' + MKB.esc(qq.ijrochi || "") + "</span>"} : {t: "Qo'riqlanmaydi"}],
        qq && qq.shartnomaRaqami ? ["Shartnoma", "№ " + qq.shartnomaRaqami + (qq.tugash ? ", " + qq.tugash : "")] : null,
        ["Qurilmalar aloqada", qurilmalar.length ? aloqada + " / " + qurilmalar.length : {t: "O'rnatilmagan"}, {xesh: qurilmalar.length}],
      ]},
      binoli && (y.kommunal || []).length ? {sarlavha: "Kommunal xizmatlar", jadval: {ustunlar: ["Xizmat", "Holat", "Hisoblagich", "Oxirgi ko'rsatkich"], son: [3],
        qatorlar: (y.kommunal || []).map(k => [{t: ((D.KOMMUNAL_XIZMATLAR.find(x => x.kalit === k.xizmat) || {}).nom || k.xizmat)}, t(KOMMUNAL[k.holat] || k.holat),
          k.hisoblagich || "—", k.korsatkich != null ? MKB.fmt(k.korsatkich) + (k.korsatkichSana ? " (" + k.korsatkichSana + ")" : "") : "—"])}} : null,
    ],
    fotolar: !suratlar.length ? undefined : suratlar.map((s, i) => ({id: String(s.yol || i), html: MKB.obyektSurati({rasm: s.yol, rasmTuri: y.rasmTuri, qisqa: y.qisqa}),
      izoh: /assets\/namuna\//.test(String(s.yol)) ? {t: "Namuna surati"} : null})),
    imzoSarlavha: "Imzolar",
    komissiya: [{rol: "Mas'ul saqlovchi", ism: y.masul || ""}, {rol: "Filial boshqaruvchisi", ism: ""}, {rol: "Tuzdi", ism: MKB.kim() !== "—" ? MKB.kim() : "", xeshsiz: true}],
  };
  MKB.dalolatnoma.chiz(joy, model);
}});
</script>
</body>
</html>
