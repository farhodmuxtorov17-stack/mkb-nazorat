<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Kredit shartnomalari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082620">
</head>
<body data-sahifa="portfel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Kredit shartnomalari</span></div>
    <div class="hs-qator"><h1>Kredit shartnomalari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <div id="jadval-joy"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082620"></script>
<script src="malumot-qoshimcha.js?v=26082620"></script>
<script src="tarjima.js?v=26082620"></script>
<script src="yadro/ikonlar.js?v=26082620"></script>
<script src="yadro/daraxt.js?v=26082620"></script>
<script src="yadro/chizma.js?v=26082620"></script>
<script src="yadro/api.js?v=26082620"></script>
<script src="yadro/app.js?v=26082620"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const qatorlar = yoz.map(y => ({
    id: y.id, raqam: y.shartnoma.raqam, tur: y.shartnoma.tur, sana: y.shartnoma.sana,
    berilgan: y.shartnoma.berilgan, mijoz: y.mijoz.nom, filial: y.filial,
    qarzN: MKB.sonQiymat(y.qarzSon), qarzMatn: y.qarzMatn, bosqich: y.bosqichNomi,
  }));
  document.getElementById("hs-meta").textContent = qatorlar.length + " ta shartnoma";
  MKB.jadval("jadval-joy", {
    qatorlar,
    qidiruv: ["raqam", "mijoz", "tur"],
    qidiruvYozuvi: "Shartnoma raqami, mijoz...",
    filtrlar: [
      {kalit: "tur", nom: "Kredit turi", variantlar: [...new Set(qatorlar.map(q => q.tur))]},
      {kalit: "filial", nom: "Filial", variantlar: [...new Set(qatorlar.map(q => q.filial))]},
    ],
    ustunlar: [
      {kalit: "raqam", nom: "Raqam", chiz: q => '<span class="kod-mono">' + q.raqam + '</span>'},
      {kalit: "mijoz", nom: "Mijoz"},
      {kalit: "tur", nom: "Kredit turi"},
      {kalit: "sana", nom: "Sana"},
      {kalit: "berilgan", nom: "Berilgan summa", son: true, chiz: q => '<span class="pul">' + q.berilgan + '</span>'},
      {kalit: "qarzN", nom: "Qoldiq", son: true, chiz: q => '<span class="pul">' + q.qarzMatn + '</span>'},
    ],
    bosilganda: q => location.href = "shartnoma.html?id=" + encodeURIComponent(q.id),
  });
});
</script>
</body>
</html>
