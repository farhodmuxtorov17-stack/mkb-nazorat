<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Hisobotlar markazi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="hisobot">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Hisobotlar</span></div>
    <div class="hs-qator"><h1>Hisobotlar markazi</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="hisobotlar.html" class="faol">Markaz</a><a href="hisobot-portfel.html">Portfel</a><a href="hisobot-undiruv.html">Undiruv</a><a href="hisobot-realizatsiya.html">Realizatsiya</a><a href="hisobot-zaxira.html">Zaxira</a><a href="hisobot-hudud.html">Hudud</a><a href="hisobot-kpi.html">KPI</a></nav>
  <section class="karta"><div class="karta-bosh"><h2>Tayyor hisobotlar</h2><span class="soni" id="hm-soni"></span><button type="button" class="tugma tugma-kichik tugma-asosiy" id="hm-yangi" style="margin-left:auto"><svg class="ic"><use href="#i-qoshish"/></svg>Hisobot shakllantirish</button></div><div id="hm-royxat"></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", () => {
  const qoshimcha = JSON.parse(localStorage.getItem("mkb4-hisobotlar") || "[]");
  const r = qoshimcha.concat(MKB_DATA.HISOBOTLAR);
  document.getElementById("hm-soni").textContent = r.length + " ta";
  document.getElementById("hm-royxat").innerHTML = r.map(h =>
    '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--chiziq-2)">' +
      '<span style="width:40px;height:40px;border-radius:11px;background:var(--varaq-2);display:grid;place-items:center;font:700 10px var(--shrift);color:var(--qalam)">' + h.format + '</span>' +
      '<span style="flex:1;min-width:0"><b style="display:block;font-size:13.5px">' + h.nom + '</b>' +
      '<span style="font-size:12.5px;color:var(--matn-3)">' + h.sub + '</span></span>' +
      '<span style="font-size:12.5px;color:var(--matn-3);text-align:right">' + h.sana + '<br>' + (h.hajm || "") + '</span>' +
      '<button type="button" class="tugma tugma-kichik tugma-oq" data-toast="Hisobot yuklab olinmoqda: ' + h.nom + '">' + ik("yuklab") + 'Yuklab olish</button>' +
    '</div>').join("");
  document.getElementById("hm-yangi").addEventListener("click", () => {
    MKB.modal("Hisobot shakllantirish",
      '<div class="forma-tor">' +
      '<div class="maydon"><label class="maydon-yorliq">Yo\'nalish <b>*</b></label><div class="kirish"><select name="tur">' +
      '<option>Portfel hisoboti</option><option>Undiruv hisoboti</option><option>Realizatsiya hisoboti</option>' +
      '<option>Zaxira hisoboti</option><option>Hududiy kesim</option></select></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq">Davr</label><div class="kirish"><select name="davr">' +
      '<option>Joriy oy</option><option>Chorak</option><option>Yil boshidan</option></select></div></div>' +
      '<div class="maydon"><label class="maydon-yorliq">Format</label><div class="kirish"><select name="format">' +
      '<option>PDF</option><option>XLSX</option></select></div></div></div>',
      {okMatn: "Shakllantirish", ok(modal){
        const q = MKB.forma(modal, ["tur"]);
        if (!q) return false;
        const j = JSON.parse(localStorage.getItem("mkb4-hisobotlar") || "[]");
        j.unshift({nom: q.tur, sub: q.davr + " · so'rov bo'yicha shakllantirildi",
          format: q.format, sana: new Date().toLocaleDateString("uz"), hajm: "1,1 MB"});
        localStorage.setItem("mkb4-hisobotlar", JSON.stringify(j.slice(0, 20)));
        MKB.toast("Hisobot tayyor — ro'yxatga qo'shildi");
        location.reload();
      }});
  });
});
</script>
</body>
</html>
