<script>
(() => {
  const $ = id => document.getElementById(id);
  MKB.sahifaYukla({
    joylar: {"mb-fokus": ["karta", 4], "hm-katalog": ["qator", 6]},
    xato: "Hisobotlar ro'yxatini yuklab bo'lmadi",
    ish: boshla,
  });

async function boshla(){
  if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
  const D = MKB_DATA, esc = MKB.esc;
  /* Hisobot tamg'asi: qachon va kim tayyorlagan (chop etish sarlavhasida) */
  const tayyorlandi = () => { const s = MKBapi.sessiya() || {}; return D.sanaYoz(D.bugun()) + " " + MKB.soat() + " · " + (s.ism || MKB.kim()) + (s.rol ? ", " + s.rol : ""); };
  /* Eksportda niqoblanadigan ustunlar (Sozlamalar: eksportNiqob) */
  const MAXFIY_USTUN = /telefon|pasport|pinfl|stir|karta raqami/i;

  /* ---------- Yordamchilar ---------- */
  const OYLAR = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
  const oyNomi = davr => { const [y, m] = String(davr).split("-").map(Number); return OYLAR[m - 1] ? OYLAR[m - 1] + " " + y : davr; };
  const yax = (n, k) => n == null || n === "" || isNaN(n) ? null : D.yaxlit(Number(n), k == null ? 1 : k);
  const son = n => n == null || n === "" ? "" : String(yax(n, 2)).replace(".", ",");
  const sana = s => { const d = D.sanaOqi(s); return d ? D.sanaYoz(d) : ""; };
  const jami = (r, f) => D.yaxlit(r.reduce((a, x) => a + (Number(f(x)) || 0), 0), 1);
  const faol = () => MKB.doira((D.YOZUVLAR || []).filter(y => y.holat !== "Chiqarildi"));
  const obNom = id => (D.obyektNomi ? D.obyektNomi(id, true) : "") || id || "";
  const obFilial = id => { const o = D.OBYEKT_INDEKS && D.OBYEKT_INDEKS[id]; if (o) return o.filial || "";
    const a = (D.ARXIV || []).find(x => x.id === id); return a ? a.filial || "" : ""; };
  const tur = k => ((D.XARAJAT_TOIFALARI || []).find(t => t.kalit === k) || {}).nom || k || "";
  const usul = k => ((D.SOTISH_USULLARI || []).find(t => t.kalit === k) || {}).nom || k || "";
  const holat = k => MKB.holatNomi(k);
  const muddat = y => { try{ return D.muddatHisobi(y); }catch(_){ return {}; } };
  const zaxira = y => { try{ return D.zaxiraHisobi(y); }catch(_){ return {}; } };
  const bahoAmal = y => {
    const b = D.sanaOqi(y.qiymat && y.qiymat.bahoSana);
    if (!b || !y.qiymat || y.qiymat.bozor == null) return {holat: "Baholanmagan", tugash: null, qolgan: null};
    const t = D.oyQosh(b, D.param("bahoAmalOy") || 12), q = D.kunFarqi(D.bugun(), t);
    return {holat: q < 0 ? "Eskirgan" : q <= 90 ? "Eskirmoqda" : "Dolzarb", tugash: D.sanaYoz(t), qolgan: q};
  };
  const chorakBosh = s => { const m = /^(\d{4})-Q([1-4])$/.exec(String(s || "")); return m ? new Date(+m[1], (m[2] - 1) * 3, 1) : null; };
  const oyBosh = s => { const m = /^(\d{4})-(\d{2})$/.exec(String(s || "")); return m ? new Date(+m[1], m[2] - 1, 1) : null; };
  /* Himoya hisoboti uchun: ochiq hodisa holatlari va qo'riqlash turi nomlari */
  const XH_OCHIQ = ["ochiq", "tekshiruvda", "bartaraf"], GH_OCHIQ = ["yangi", "tekshirilmoqda", "tekshiruvda", "bartaraf"];
  const QTUR = {}; (D.QORIQLASH_TURLARI || []).forEach(t => { QTUR[t.kalit] = t.nom; });
  /* MB hisobotining kutilayotgan davri: "Ochish" havolasi shu davrni oladi (mbFokus belgilaydi) */
  let mbDavr = null;

  /* ---------- Davr ---------- */
  const DAVRLAR = [["oy", "Joriy oy"], ["otgan", "O'tgan oy"], ["chorak", "Joriy chorak"], ["yil", "Joriy yil"], ["hammasi", "Barcha davr"]];
  function oraliq(k){
    const b = D.bugun(), y = b.getFullYear(), m = b.getMonth();
    const bugun = new Date(y, m, b.getDate());
    if (k === "oy") return [new Date(y, m, 1), bugun];
    if (k === "otgan") return [new Date(y, m - 1, 1), new Date(y, m, 0)];
    if (k === "chorak") return [new Date(y, m - m % 3, 1), bugun];
    if (k === "yil") return [new Date(y, 0, 1), bugun];
    return [null, null];
  }
  const davrdami = (d, o) => !o[0] || (d && d >= o[0] && d < D.kunQosh(o[1], 1));

  /* ---------- Hisobot ta'riflari: har biri manba, ustunlar va jamlama ---------- */
  const PORTFEL_USTUN = [
    ["Kod", y => y.id], ["Nomi", y => y.nom], ["Turi", y => y.tur], ["Hudud", y => y.hudud], ["Filial", y => y.filial],
  ];
  const HISOBOTLAR = [
    {id: "portfel", guruh: "portfel", nom: "Balans aktivlari", izoh: "Balansdagi aktivlar: qiymat, holat va zaxira", bolim: "hisobot", sahifa: "hisobot-portfel.html", ikon: "portfel", kol: "YOZUVLAR", parametr: d => "davr=" + d,
      qatorlar: () => faol(),
      ustunlar: PORTFEL_USTUN.concat([["Holat", y => y.holat], ["Balansga olingan", y => sana(y.balans && y.balans.sana)],
        ["Balans qiymati, mln so'm", y => son(y.balans && y.balans.qiymat)], ["Bozor qiymati, mln so'm", y => son(y.qiymat && y.qiymat.bozor)],
        ["Zaxira toifasi", y => zaxira(y).toifaNomi || ""], ["Zaxira, %", y => son(zaxira(y).foiz)], ["Zaxira, mln so'm", y => son(zaxira(y).summa)]]),
      jamlama: r => [["Aktivlar", r.length + " ta"], ["Balans qiymati", MKB.pul(jami(r, y => y.balans && y.balans.qiymat))],
        ["Bozor qiymati", MKB.pul(jami(r, y => y.qiymat && y.qiymat.bozor))], ["Zaxira", MKB.pul(jami(r, y => zaxira(y).summa))]]},
    {id: "mb", guruh: "portfel", nom: "Markaziy bank oylik hisoboti", izoh: "MB 3441-son nizom, 16-band: har oyning 10-sanasigacha", bolim: "qiymat", sahifa: "hisobot-mb.html", ikon: "bank", kol: "MB_HISOBOTLAR", parametr: () => mbDavr ? "davr=" + encodeURIComponent(mbDavr) : "", chopYorliq: "Davrlar ro'yxatini chop etish",
      sana: x => oyBosh(x.davr),
      qatorlar: () => (D.MB_HISOBOTLAR || []).slice().sort((a, b) => String(b.davr).localeCompare(String(a.davr))),
      ustunlar: [["Davr", x => oyNomi(x.davr)], ["Topshirish muddati", x => x.muddat], ["Topshirilgan sana", x => x.topshirilganSana || ""],
        ["Obyektlar soni", x => x.obyektlarSoni], ["Jami balans qiymati, mln so'm", x => son(x.jamiBalansQiymat)],
        ["1-darajali kapital, mlrd so'm", x => son(x.kapital1Daraja)], ["Kapitalga nisbati", x => son(x.kapitalgaNisbat)],
        ["Umidsiz toifada", x => x.umidsizSoni], ["Holat", x => holat(x.holat)]],
      jamlama: r => [["Hisobotlar", r.length + " ta"], ["Topshirilgan", r.filter(x => x.holat === "topshirilgan").length + " ta"]]},
    {id: "zaxira", guruh: "portfel", nom: "Tasnif va zaxira qaydnomasi", izoh: "MB 2696: toifa, zaxira foizi va summasi", bolim: "qiymat", sahifa: "zaxira.html", ikon: "zaxira", kol: "ZAXIRA_TARIX",
      qatorlar: () => faol(),
      ustunlar: [["Kod", y => y.id], ["Nomi", y => y.nom], ["Balansga olingan", y => sana(y.balans && y.balans.sana)], ["Balansda, kun", y => muddat(y).turganKun],
        ["Me'yoriy chegara, kun", y => muddat(y).chegaraKun], ["Toifa", y => zaxira(y).toifaNomi || ""], ["Zaxira, %", y => son(zaxira(y).foiz)],
        ["Balans qiymati, mln so'm", y => son(y.balans && y.balans.qiymat)], ["Zaxira, mln so'm", y => son(zaxira(y).summa)],
        ["Izoh", y => zaxira(y).taxminiy ? "Oraliq stavka, buxgalteriya tasdig'ida" : ""]],
      jamlama: r => [["Aktivlar", r.length + " ta"], ["Zaxira jami", MKB.pul(jami(r, y => zaxira(y).summa))],
        ["Umidsiz toifada", r.filter(y => zaxira(y).toifa === "umidsiz").length + " ta"]]},
    {id: "muddat", guruh: "portfel", nom: "Muddatlar kalendari", izoh: "Soliq imtiyozi, umidsiz toifa va 3 yil chegaralari", bolim: "aktivlar", sahifa: "muddatlar.html", ikon: "kalendar",
      qatorlar: () => faol().slice().sort((a, b) => (muddat(a).qolganKun ?? 1e9) - (muddat(b).qolganKun ?? 1e9)),
      ustunlar: [["Kod", y => y.id], ["Nomi", y => y.nom], ["Balansga olingan", y => muddat(y).balansSana || ""], ["Soliq imtiyozi tugaydi", y => muddat(y).soliqImtiyozTugash || ""],
        ["Umidsiz toifa sanasi", y => muddat(y).chegaraSana || ""], ["Qolgan kun", y => muddat(y).qolganKun ?? ""], ["3 yil to'ladi", y => muddat(y).uchYilSana || ""],
        ["Holat", y => muddat(y).holatNomi || ""]],
      jamlama: r => [["Aktivlar", r.length + " ta"], ["90 kun ichida umidsizga o'tadi", r.filter(y => muddat(y).holat === "xavf-90").length + " ta"],
        ["Umidsiz toifada", r.filter(y => ["umidsiz", "3-yildan-oshgan"].indexOf(muddat(y).holat) >= 0).length + " ta"]]},
    {id: "hudud", guruh: "portfel", nom: "Hududlar va filiallar kesimi", izoh: "Aktivlar soni, qiymati va umidsiz ulushi", bolim: "hisobot", sahifa: "hisobot-hudud.html", ikon: "xarita", ochishYorliq: "Xaritada ko'rish",
      qatorlar: () => {
        const g = {};
        faol().forEach(y => {
          const k = y.hudud || "Kiritilmagan", h = g[k] || (g[k] = {id: k, hudud: k, son: 0, qiymat: 0, umidsiz: 0, filiallar: new Set()});
          h.son++; h.qiymat += (y.balans && y.balans.qiymat) || 0; h.filiallar.add(y.filial);
          if (["umidsiz", "3-yildan-oshgan"].indexOf(muddat(y).holat) >= 0) h.umidsiz++;
        });
        return Object.values(g).sort((a, b) => b.son - a.son);
      },
      ustunlar: [["Hudud", h => h.hudud], ["Filiallar", h => h.filiallar.size], ["Aktivlar", h => h.son], ["Balans qiymati, mln so'm", h => son(h.qiymat)],
        ["Umidsiz toifada", h => h.umidsiz], ["Umidsiz ulushi, %", h => son(h.son ? h.umidsiz / h.son * 100 : 0)]],
      jamlama: r => [["Hududlar", r.length + " ta"], ["Aktivlar", r.reduce((a, h) => a + h.son, 0) + " ta"]]},

    {id: "lotlar", guruh: "realizatsiya", nom: "E-auksion lotlari", izoh: "E'lon, savdo, narx pasaytirish va natija", bolim: "sotuv", sahifa: "lotlar.html", ikon: "savdo", kol: "LOTLAR",
      sana: x => D.sanaOqi(x.elonSana), qatorlar: () => MKB.doira(D.LOTLAR || []),
      ustunlar: [["Lot", x => x.id], ["E-auksion raqami", x => x.eauksionLotRaqami || ""], ["Obyekt", x => obNom(x.obyektId)], ["Sotish usuli", x => usul(x.sotishUsuli)],
        ["E'lon sanasi", x => x.elonSana || ""], ["Savdo sanasi", x => x.savdoSana || ""], ["Boshlang'ich narx, mln so'm", x => son(x.boshlangichNarx)],
        ["Minimal narx, mln so'm", x => son(x.minimalNarx)], ["Narx pasaytirishlar", x => (x.pasaytirishlar || []).length], ["Holat", x => holat(x.holat)],
        ["G'olib", x => x.golib || ""], ["Yakuniy narx, mln so'm", x => son(x.yakuniyNarx)],
        ["E'londan savdogacha, kun", x => x.elonSana && x.savdoSana ? D.kunFarqi(x.elonSana, x.savdoSana) : ""]],
      jamlama: r => [["Lotlar", r.length + " ta"], ["Sotilgan", r.filter(x => x.holat === "sotildi").length + " ta"],
        ["O'tkazilmagan", r.filter(x => x.holat === "otkazilmagan").length + " ta"]]},
    {id: "takliflar", guruh: "realizatsiya", nom: "Takliflar va AML qaydnomasi", izoh: "Xaridor takliflari, AML natijasi va qaror raqami", bolim: "sotuv", sahifa: "takliflar.html", ikon: "muhr", kol: "TAKLIFLAR",
      sana: x => D.sanaOqi(x.sana), qatorlar: () => MKB.doira(D.TAKLIFLAR || []),
      ustunlar: [["Taklif", x => x.id], ["Sana", x => x.sana], ["Obyekt", x => obNom(x.obyektId)], ["Lot", x => x.lotId || ""], ["Xaridor", x => x.xaridor],
        ["Xaridor turi", x => x.xaridorTuri || ""], ["Summa, mln so'm", x => son(x.summa)], ["To'lov sharti", x => x.tolovSharti || ""],
        ["AML natijasi", x => holat(x.amlNatija)], ["Affillangan", x => x.affillanganlik ? "Ha" : "Yo'q"], ["Qaror raqami", x => x.qarorRaqami || ""], ["Holat", x => holat(x.holat)]],
      jamlama: r => [["Takliflar", r.length + " ta"], ["AML shubhali", r.filter(x => x.amlNatija === "shubhali").length + " ta"]]},
    {id: "debitorlik", guruh: "realizatsiya", nom: "Bo'lib to'lash debitorligi", izoh: "To'lov jadvali, to'langan va muddati o'tgan summalar", bolim: "sotuv", sahifa: "shartnomalar.html", ikon: "karta-pul", kol: "SHARTNOMALAR",
      qatorlar: () => MKB.doira((D.SHARTNOMALAR || []).filter(s => (s.jadval || []).length)),
      ustunlar: [["Shartnoma", s => s.id], ["Sana", s => s.sana], ["Obyekt", s => obNom(s.obyektId)], ["Xaridor", s => s.xaridor], ["Narx, mln so'm", s => son(s.narx)],
        ["Avans, mln so'm", s => son(s.avans)], ["To'langan, mln so'm", s => son((s.avans || 0) + jami((s.jadval || []).filter(j => j.tolandi), j => j.summa))],
        ["Qoldiq, mln so'm", s => son(jami((s.jadval || []).filter(j => !j.tolandi), j => j.summa))],
        ["Muddati o'tgan to'lovlar", s => (s.jadval || []).filter(j => !j.tolandi && D.sanaOqi(j.sana) < D.bugun()).length],
        ["Muddati o'tgan, mln so'm", s => son(jami((s.jadval || []).filter(j => !j.tolandi && D.sanaOqi(j.sana) < D.bugun()), j => j.summa))],
        ["Keyingi to'lov", s => ((s.jadval || []).find(j => !j.tolandi) || {}).sana || ""], ["Holat", s => holat(s.holat)]],
      jamlama: r => [["Shartnomalar", r.length + " ta"], ["Qoldiq jami", MKB.pul(jami(r, s => jami((s.jadval || []).filter(j => !j.tolandi), j => j.summa)))]]},
    {id: "ijara", guruh: "realizatsiya", nom: "Ijara daromadi", izoh: "Ijara shartnomalari, tushum va to'lanmagan oylar", bolim: "sotuv", sahifa: "ijara.html", ikon: "ijara", kol: "IJARA",
      qatorlar: () => MKB.doira(D.IJARA || []),
      ustunlar: [["Shartnoma", x => x.id], ["Obyekt", x => obNom(x.obyektId)], ["Ijarachi", x => x.ijarachi], ["Maydon, m²", x => x.maydon], ["Oylik ijara, mln so'm", x => son(x.oylikIjara)],
        ["Boshlanish", x => x.boshlanish], ["Tugash", x => x.tugash], ["Tushgan, mln so'm", x => son(jami((x.tolovlar || []).filter(t => t.tolandi), t => t.summa))],
        ["To'lanmagan oylar", x => (x.tolovlar || []).filter(t => !t.tolandi).length], ["Holat", x => holat(x.holat)]],
      jamlama: r => [["Shartnomalar", r.length + " ta"], ["Tushgan jami", MKB.pul(jami(r, x => jami((x.tolovlar || []).filter(t => t.tolandi), t => t.summa)))]]},
    {id: "natija", guruh: "realizatsiya", nom: "Sotilgan aktivlar natijasi", izoh: "Balans qiymati, xarajat, tiklangan zaxira va sof natija", bolim: "aktivlar", sahifa: "arxiv.html", ikon: "arxiv", kol: "ARXIV",

  function huquqHolat(y){
    const h = y.huquq || {};
    if (y.turKalit === "transport" || y.turKalit === "texnika") return h.yhxxQaydSana ? "Rasmiylashtirilgan" : "YHXXda qayd etilmagan";
    if (D.binolimi(y)) return h.qaydSana ? "Rasmiylashtirilgan" : "Kadastrda qayd etilmagan";
    return "Rasmiylashtirish talab etilmaydi";
  }
  const GURUHLAR = [["hammasi", "Barchasi"], ["portfel", "Balans aktivlari va Markaziy bank"], ["realizatsiya", "Sotuv va undiruv"], ["saqlash", "Saqlash va himoya"],
    ["nazorat", "Nazorat"], ["boshqaruv", "Boshqaruv"]];
  const ochiq = HISOBOTLAR.filter(h => h.id === "amallar" ? MKB.ruxsat(h.sahifa) : MKB.huquq(h.bolim, "oqi"));

  /* ---------- Holat (tanlangan davr va guruh) ---------- */
  const kalit = MKBapi.kalit("mkb4-hisobot-markaz");
  let saqlangan = {};
  try{ saqlangan = JSON.parse(localStorage.getItem(kalit) || "{}") || {}; }catch(_){ saqlangan = {}; }
  const h = {davr: DAVRLAR.some(d => d[0] === saqlangan.davr) ? saqlangan.davr : "yil",
             guruh: GURUHLAR.some(g => g[0] === saqlangan.guruh) ? saqlangan.guruh : "hammasi", qidiruv: ""};
  const eslab = () => { try{ localStorage.setItem(kalit, JSON.stringify({davr: h.davr, guruh: h.guruh})); }catch(_){ } };
  /* Tashqi havola markazni tayyor holatda ochadi: hisobotlar.html?hisobot=undiruv&davr=yil.

  const manzil = new URLSearchParams(location.search);
  const soralgan = ochiq.find(d => d.id === manzil.get("hisobot")) || null;
  if (DAVRLAR.some(d => d[0] === manzil.get("davr"))) h.davr = manzil.get("davr");
  if (soralgan) h.guruh = soralgan.guruh;
  else if (GURUHLAR.some(g => g[0] === manzil.get("guruh"))) h.guruh = manzil.get("guruh");
  if (manzil.get("q")) h.qidiruv = manzil.get("q");

  $("hm-davr").innerHTML = DAVRLAR.map(d => '<option value="' + d[0] + '">' + d[1] + "</option>").join("");
  $("hm-davr").value = h.davr;
  if (h.qidiruv) $("hm-qidiruv").value = h.qidiruv;
  $("hm-guruhlar").innerHTML = GURUHLAR.filter(g => g[0] === "hammasi" || ochiq.some(x => x.guruh === g[0]))
    .map(g => '<button type="button" data-guruh="' + g[0] + '" aria-pressed="' + (g[0] === h.guruh) + '">' + g[1] + "</button>").join("");

  async function tayyorla(def){
    const o = oraliq(h.davr);
    let r = await def.qatorlar();
    if (def.sana && o[0]) r = r.filter(x => davrdami(def.sana(x), o));
    return r;
  }
  /* Davr hisobotga ta'sir qiladimi: qatorlar davr bo'yicha filtrlanadi (sana) yoki ichida sanaladi (davrli) */
  const davrga = def => !!(def.sana || def.davrli);
  const davrMatni = def => {
    if (!davrga(def)) return D.sanaYoz(D.bugun()) + " holatiga";
    const o = oraliq(h.davr);
    return o[0] ? D.sanaYoz(o[0]) + " – " + D.sanaYoz(o[1]) : "Barcha davr";
  };
  /* "Ochish" havolasi: batafsil ko'rinish tanlangan davr bilan ochiladi */
  const BATAFSIL = {"hisobot-portfel.html": 1, "hisobot-hudud.html": 1, "hisobot-xarajat.html": 1,
    "hisobot-kpi.html": 1, "hisobot-undiruv.html": 1, "kirish-hisoboti.html": 1};
  const ochishYorliq = d => d.ochishYorliq || (BATAFSIL[d.sahifa] ? "Batafsil" : "Ochish");
  const ochishHavola = d => {
    const q = d.parametr ? d.parametr(h.davr) : "";
    return d.sahifa + (q ? (d.sahifa.indexOf("?") >= 0 ? "&" : "?") + q : "");
  };

  function mbFokus(){
    const el = $("mb-fokus");
    if (!MKB.huquq("qiymat", "oqi")){ el.remove(); return; }
    const b = D.bugun(), bugun = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    const royxat = (D.MB_HISOBOTLAR || []).slice().sort((a, c) => String(c.davr).localeCompare(String(a.davr)));
    const kutilgan = royxat.filter(x => x.holat !== "topshirilgan").sort((a, c) => String(a.davr).localeCompare(String(c.davr)))[0];
    const joriy = b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0");
    const kelgusiMuddat = D.ishKuniQosh(new Date(b.getFullYear(), b.getMonth() + 1, D.param("mbHisobotKuni") || 10), 0);
    const x = kutilgan || {davr: joriy, muddat: D.sanaYoz(kelgusiMuddat), holat: "kelgusi"};
    mbDavr = kutilgan ? kutilgan.davr : null;
    const qolgan = D.kunFarqi(bugun, x.muddat);
    const oxirgi = royxat.find(r => r.holat === "topshirilgan");
    /* Filial rahbari hisobot sonini ham o'z filiali doirasida ko'radi (hisobot-mb.html bilan bir xil hisob) */
    const filialKesim = !!MKB.filialDoirasi() && !!D.mbHisobotHisobla;
    const soni = x.obyektlarSoni == null ? faol().length : filialKesim ? D.mbHisobotHisobla(x.davr, a => MKB.doira(a)).obyektlarSoni : x.obyektlarSoni;
    const holatChip = x.holat === "kelgusi" ? '<span class="chip chip-kul">Davr davom etmoqda</span>'
      : qolgan < 0 ? '<span class="chip chip-xavf">Muddati o\'tgan</span>' : '<span class="chip chip-sariq">Topshirilmagan</span>';
    el.innerHTML = '<div class="mb-fokus">' +
      '<div class="mf-bosh"><span class="mf-izoh"><span>Majburiy hisobot</span><span data-tarjimasiz> · </span><span>MB 3441-son nizom, 16-band</span></span><h2>Markaziy bank oylik hisoboti</h2>' +
        '<span><span class="chip chip-kichik chip-siyoh" data-tarjimasiz>' + esc(oyNomi(x.davr)) + '</span> ' + holatChip + "</span></div>" +
      '<div class="metrika"><span class="m-yorliq">Topshirish muddati</span><span class="m-qiymat" data-tarjimasiz>' + esc(x.muddat) + "</span>" +
        '<span class="m-izoh">' + (qolgan >= 0 ? "<b data-tarjimasiz>" + qolgan + "</b> <span>kun qoldi</span>" : "<b data-tarjimasiz>" + (-qolgan) + "</b> <span>kun kechikdi</span>") + "</span></div>" +
      '<div class="metrika"><span class="m-yorliq">Obyektlar soni</span><span class="m-qiymat" data-tarjimasiz>' +
        MKB.fmt(soni) + "</span>" +
        '<span class="m-izoh">' + (x.obyektlarSoni == null ? "bugungi holat" : filialKesim ? "filialingiz bo'yicha" : "hisobot bo'yicha") + "</span></div>" +
      '<div class="metrika"><span class="m-yorliq">Oxirgi topshirilgan</span><span class="m-qiymat" data-tarjimasiz>' + (oxirgi ? esc(oxirgi.topshirilganSana || "—") : "—") + "</span>" +
        '<span class="m-izoh">' + (oxirgi ? esc(oyNomi(oxirgi.davr)) : "hali topshirilmagan") + "</span></div>" +
      '<div class="mf-amal"><a class="tugma tugma-asosiy" href="hisobot-mb.html' + (kutilgan ? "?davr=" + encodeURIComponent(kutilgan.davr) : "") + '" data-sayohat="mb-ochish">' + ik("bank") + "Hisobotni ochish</a></div></div>";
    tarjimaQil(el);
  }

  /* ---------- Katalog ---------- */
  const ikonka = n => document.getElementById("ik-" + n) ? n : "hisobot";
  async function katalog(){
    const joy = $("hm-katalog");
    ekYangila();
    const q = h.qidiruv.trim().toLowerCase();
    const royxat = ochiq.filter(d => (h.guruh === "hammasi" || d.guruh === h.guruh) &&
      (!q || (d.nom + " " + d.izoh).toLowerCase().indexOf(q) >= 0));
    const o = oraliq(h.davr);
    $("hm-oraliq").textContent = o[0] ? D.sanaYoz(o[0]) + " – " + D.sanaYoz(o[1]) : "";
    /* Sarlavha izohi ham ruschaga o'giriladi: son va sana tarjimasiz, qolgani lug'atdan */
    $("hs-meta").innerHTML = '<b data-tarjimasiz>' + ochiq.length + "</b> <span>ta hisobot</span> · <span>holat sanasi</span> <b data-tarjimasiz>" + D.sanaYoz(D.bugun()) + "</b>";
    tarjimaQil($("hs-meta"));
    if (!royxat.length){
      joy.innerHTML = '<section class="karta">' + MKB.boshHolat("hisobot", "Hisobot topilmadi", "Qidiruv so'zini yoki guruhni o'zgartiring") + "</section>";
      tarjimaQil(joy); return;
    }
    const sonlar = {};
    for (const d of royxat){ try{ sonlar[d.id] = (await tayyorla(d)).length; }catch(_){ sonlar[d.id] = null; } }
    const guruhlar = GURUHLAR.filter(g => g[0] !== "hammasi" && royxat.some(d => d.guruh === g[0]));
    joy.innerHTML = guruhlar.map(g => {
      const ichi = royxat.filter(d => d.guruh === g[0]);
      return '<section class="karta"><div class="karta-bosh"><h2>' + g[1] + '</h2><span class="soni"><span data-tarjimasiz>' + ichi.length + "</span> <span>ta hisobot</span></span></div>" +
        ichi.map(d => {
          const n = sonlar[d.id];
          const bosh = !n;
          return '<div class="qator hm-qator" data-id="' + d.id + '">' +
            '<span class="belgi">' + ik(ikonka(d.ikon)) + "</span>" +
            '<span class="matn"><b>' + esc(d.nom) + "</b><span>" + esc(d.izoh) + "</span></span>" +
            '<span class="ong">' +
              '<span class="vaqt">' + (n == null ? "<span>O'qib bo'lmadi</span>" : bosh ? "<span>Yozuv yo'q</span>" : "<b data-tarjimasiz>" + MKB.fmt(n) + "</b> <span>qator</span>") + "</span>" +
              '<span class="chip chip-kichik ' + (davrga(d) ? "chip-info" : "chip-kul") + '">' + (davrga(d) ? (h.davr === "hammasi" ? "Barcha davr" : "Davr bo'yicha") : "Joriy holat") + "</span>" +
              '<button type="button" class="tugma tugma-kichik tugma-oq" data-csv="' + d.id + '"' + (bosh ? " disabled" : "") + ">" + ik("csv") + "CSV</button>" +
              '<button type="button" class="tugma tugma-kichik tugma-oq" data-chop="' + d.id + '"' + (bosh ? " disabled" : "") + ">" + ik("chop") + esc(d.chopYorliq || "Chop etish") + "</button>" +
              (MKB.ruxsat(d.sahifa) ? '<a class="tugma tugma-kichik tugma-oq" href="' + esc(ochishHavola(d)) + '">' + ik("ong") + esc(ochishYorliq(d)) + "</a>" : "") +
            "</span></div>";
        }).join("") + "</section>";
    }).join("");
    joy.querySelectorAll("[data-csv]").forEach(b => b.addEventListener("click", () => MKB.band(b, () => csvYukla(b.dataset.csv))));
    joy.querySelectorAll("[data-chop]").forEach(b => b.addEventListener("click", () => MKB.band(b, () => chopEt(b.dataset.chop))));
    const c1 = joy.querySelector("[data-csv]:not([disabled])"), p1 = joy.querySelector("[data-chop]:not([disabled])");
    if (c1) c1.setAttribute("data-sayohat", "csv");
    if (p1) p1.setAttribute("data-sayohat", "chop");
    tarjimaQil(joy);
  }

  /* ---------- Ma'lumot eksporti kartasi ----------
     To'plam ro'yxati hisobot ta'riflaridagi "kol" maydonidan olinadi: alohida ro'yxat yuritilmaydi. */
  let ekYangila = () => {};
  function eksportKarta(){
    const el = $("hm-eksport");
    if (!MKB.ruxsat("hisobot-eksport.html")){ el.remove(); return; }
    const korilgan = {}, kollar = [];
    ochiq.forEach(d => { if (d.kol && !korilgan[d.kol]){ korilgan[d.kol] = 1; kollar.push([d.kol, d.nom]); } });
    if (!kollar.length){ el.remove(); return; }
    el.innerHTML = '<div class="karta-bosh"><h2>Ma\'lumot eksporti</h2><span class="soni">CSV yoki JSON</span></div>' +
      '<p class="maydon-izoh">Hisobot jadvali emas, to\'plamning o\'zi kerak bo\'lsa shu yerdan yuklab oling.</p>' +
      '<div class="hm-asbob" style="margin-top:14px">' +
        '<label class="tanlov"><span class="t-old">To\'plam:</span><select id="he-kol" aria-label="To\'plam">' +
          kollar.map(k => '<option value="' + esc(k[0]) + '">' + esc(k[1]) + "</option>").join("") + "</select></label>" +
        '<label class="tanlov"><span class="t-old">Format:</span><select id="he-format" aria-label="Fayl formati">' +
          '<option value="csv">CSV (Excel)</option><option value="json">JSON</option></select></label>' +
        '<a class="tugma tugma-oq" id="he-ochish" href="hisobot-eksport.html">' + ik("yuklab") + "Eksportni ochish</a></div>";
    ekYangila = () => { $("he-ochish").href = "hisobot-eksport.html?kol=" + encodeURIComponent($("he-kol").value) +
      "&format=" + encodeURIComponent($("he-format").value) + "&davr=" + encodeURIComponent(h.davr); };
    $("he-kol").addEventListener("change", ekYangila);
    $("he-format").addEventListener("change", ekYangila);
    ekYangila();
    tarjimaQil(el);
  }

  /* ---------- Bo'lim sahifalari ----------
     Bo'limning barcha sahifalari shu yerda: yon panelda faqat bitta band qoladi, sahifa yo'qolmaydi.
     Ro'yxat MKB_DARAXT bilan solishtiriladi — daraxtga yangi sahifa qo'shilsa, u ham chiqadi. */
  const SAHIFA_IZOH = {
    "hisobot-portfel.html": ["portfel", "Balansdagi aktivlar, oylik dinamika va zaxira toifalari"],
    "hisobot-hudud.html": ["xarita", "Hududlar va filiallar kesimi, xarita bilan"],
    "hisobot-xarajat.html": ["pul", "Saqlash xarajatlari: toifa, filial va obyekt kesimi"],
    "hisobot-kpi.html": ["diagramma", "Nazorat indeksi, sotuv samaradorligi va sikl muddati"],
    "hisobot-undiruv.html": ["sud", "Undiruv ishlari: bosqichlar, sud majlislari va yopilgan ishlar"],
    "kirish-hisoboti.html": ["qalqon", "Himoya qamrovi, hodisalar va kirish nazorati"],
    "hisobot-mb.html": ["bank", "Markaziy bankka oylik hisobot: shakl, ilova va chop etish"],
    "hisobot-eksport.html": ["yuklab", "To'plamni CSV yoki JSON ko'rinishida yuklab olish"],
  };
  const SAHIFA_GURUH = [
    ["Batafsil ko'rinishlar", ["hisobot-portfel.html", "hisobot-hudud.html", "hisobot-xarajat.html", "hisobot-kpi.html", "hisobot-undiruv.html", "kirish-hisoboti.html"]],
    ["Majburiy hisobot", ["hisobot-mb.html"]],
    ["Ma'lumot", ["hisobot-eksport.html"]],
  ];
  function sahifalarKartasi(){
    const el = $("hm-sahifalar");
    const daraxt = (window.MKB_DARAXT && MKB_DARAXT.hisobot || []).filter(x => x.f !== "hisobotlar.html");
    const nomi = {}; daraxt.forEach(x => { nomi[x.f] = String(x.n).replace(/&#39;/g, "'"); });
    const guruhlar = SAHIFA_GURUH.map(g => [g[0], g[1].filter(f => nomi[f])]);
    const qolgan = daraxt.map(x => x.f).filter(f => !SAHIFA_GURUH.some(g => g[1].indexOf(f) >= 0));
    if (qolgan.length) guruhlar.push(["Boshqa sahifalar", qolgan]);
    const bolim = guruhlar.map(g => [g[0], g[1].filter(f => MKB.ruxsat(f))]).filter(g => g[1].length);
    const soni = bolim.reduce((a, g) => a + g[1].length, 0);
    if (!soni){ el.remove(); return; }
    el.innerHTML = '<div class="karta-bosh"><h2>Bo\'lim sahifalari</h2><span class="soni"><span data-tarjimasiz>' + soni + "</span> <span>ta sahifa</span></span></div>" +
      bolim.map(g => '<h3 class="bs-guruh">' + esc(g[0]) + "</h3>" +
        g[1].map(f => {
          const iz = SAHIFA_IZOH[f] || ["hisobot", ""];
          return '<div class="qator"><span class="belgi">' + ik(ikonka(iz[0])) + "</span>" +
            '<span class="matn"><b><a class="qator-och" href="' + f + '">' + esc(nomi[f]) + "</a></b><span>" + esc(iz[1]) + "</span></span>" +
            '<span class="ong">' + ik("ong") + "</span></div>";
        }).join("")).join("");
    tarjimaQil(el);
  }

  /* ---------- CSV va chop etish ---------- */
  function faylNomi(def, davr){
    const b = D.bugun();
    return "mkb-" + def.id + (davrga(def) && davr !== "hammasi" ? "-" + davr : "") + "-" +
      b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0") + ".csv";
  }
  async function csvYukla(id, davr){
    const def = HISOBOTLAR.find(d => d.id === id);
    if (!def) return;
    const eski = h.davr;
    if (davr) h.davr = davr;
    try{
      const r = await tayyorla(def);
      if (!r.length){ MKB.toast("Tanlangan davrda yozuv yo'q. Fayl tuzilmadi", "xavf"); return; }
      const niqob = MKB.niqobYoqilgan();
      MKB.csv(faylNomi(def, h.davr), def.ustunlar.map(u => u[0]), r.map(x => def.ustunlar.map(u => { const v = u[1](x); const m = v == null ? "" : v; return niqob && MAXFIY_USTUN.test(u[0]) ? MKB.niqob(m) : m; })));
      MKB.toast(def.nom + ": " + r.length + " qator yuklab olindi", "yuklab");
    }catch(e){ MKB.toast(e.message || "Hisobotni tuzib bo'lmadi", "xavf"); }
    finally{ h.davr = eski; }
  }
  async function chopEt(id){
    const def = HISOBOTLAR.find(d => d.id === id);
    if (!def) return;
    let r;
    try{ r = await tayyorla(def); }catch(e){ MKB.toast(e.message || "Hisobotni tuzib bo'lmadi", "xavf"); return; }
    if (!r.length){ MKB.toast("Tanlangan davrda yozuv yo'q", "xavf"); return; }
    const ch = $("chop");
    const niqob = MKB.niqobYoqilgan();
    ch.innerHTML = '<div class="cv-meta"><span>Mikrokreditbank</span> · <span>Balansdagi aktivlarni boshqarish tizimi</span></div>' +
      "<h1>" + esc(def.nom) + "</h1>" +
      '<div class="cv-meta"><span>Davr:</span> <span data-tarjimasiz>' + esc(davrMatni(def)) + "</span> · <span>Tayyorlandi:</span> <span data-tarjimasiz>" + esc(tayyorlandi()) + "</span></div>" +
      "<dl>" + def.jamlama(r).map(j => "<dt>" + esc(j[0]) + '</dt><dd data-tarjimasiz>' + esc(j[1]) + "</dd>").join("") + "</dl>" +
      "<table><thead><tr>" + def.ustunlar.map(u => "<th>" + esc(u[0]) + "</th>").join("") + "</tr></thead><tbody>" +
      r.map(x => "<tr>" + def.ustunlar.map(u => { const v = u[1](x); const m = v == null ? "" : String(v); return "<td data-tarjimasiz>" + esc(niqob && MAXFIY_USTUN.test(u[0]) ? MKB.niqob(m) : m) + "</td>"; }).join("") + "</tr>").join("") +
      "</tbody></table>";
    tarjimaQil(ch);
    document.body.classList.add("chop-faol");
    const tozala = () => { document.body.classList.remove("chop-faol"); window.removeEventListener("afterprint", tozala); };
    window.addEventListener("afterprint", tozala);
    window.print();
  }

  /* ---------- Hodisalar ---------- */
  $("hm-davr").addEventListener("change", e => { h.davr = e.target.value; eslab(); katalog(); });
  $("hm-qidiruv").addEventListener("input", e => { h.qidiruv = e.target.value; katalog(); });
  $("hm-guruhlar").addEventListener("click", e => {
    const b = e.target.closest("[data-guruh]");
    if (!b) return;
    h.guruh = b.dataset.guruh; eslab();
    $("hm-guruhlar").querySelectorAll("[data-guruh]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    katalog();
  });
  const yangila = () => { mbFokus(); return katalog(); };
  document.addEventListener("mkb:qoidalar", yangila);
  eksportKarta();
  sahifalarKartasi();
  await yangila();
  if (soralgan){
    const q = $("hm-katalog").querySelector('[data-id="' + soralgan.id + '"]');
    if (q){ q.classList.add("hm-belgi"); q.scrollIntoView({block: "center", behavior: "smooth"}); }
  }
}
})();
</script>
</body>
</html>
