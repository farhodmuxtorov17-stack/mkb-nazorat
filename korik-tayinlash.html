<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko'rik tayinlash</title>
<link rel="stylesheet" href="yadro/app.css?v=26082760">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="korik-rejasi.html">Ko'rik nazorati</a><span class="ajratgich">/</span><span>Tayinlash</span></div>
    <div class="hs-qator"><h1>Ko'rik tayinlash</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <section class="karta" style="max-width:720px"><div class="karta-bosh"><h2>Yangi ko'rik</h2></div>
  <form id="kt-forma" class="forma-tor">
    <div class="maydon keng"><label class="maydon-yorliq">Obyekt <b>*</b></label>
      <div class="kirish"><select name="obyektId" id="kt-obyekt"></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Ko'rik turi <b>*</b></label>
      <div class="kirish"><select name="tur"><option>Rejali</option><option>Navbatdan tashqari</option><option>Qabul ko'rigi</option><option>Nazorat ko'rigi</option></select></div></div>
    <div class="maydon"><label class="maydon-yorliq">Sana <b>*</b></label>
      <div class="kirish"><input name="sana" placeholder="kk-oy, yyyy"></div></div>
    <div class="maydon"><label class="maydon-yorliq">Inspektor <b>*</b></label>
      <div class="kirish"><select name="inspektor"><option>Sattorov Jasur</option><option>Karimova Feruza</option><option>Yo'ldoshev Sardor</option><option>Tosheva Barno</option></select></div></div>
    <div class="maydon keng"><label class="maydon-yorliq">Izoh</label>
      <textarea class="kirish-matn" name="izoh" placeholder="Ko'rik maqsadi va e'tibor beriladigan jihatlar"></textarea></div>
    <div class="keng" style="display:flex;justify-content:flex-end;gap:10px">
      <a class="tugma tugma-oq" href="korik-rejasi.html">Bekor qilish</a>
      <button class="tugma tugma-asosiy" type="submit"><svg class="ic"><use href="#i-korik"/></svg>Rejaga qo'shish</button></div>
  </form></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082760"></script>
<script src="malumot.js?v=26082760"></script>
<script src="malumot-qoshimcha.js?v=26082760"></script>
<script src="malumot-kengaytma.js?v=26082760"></script>
<script src="malumot-kirish.js?v=26082760"></script>
<script src="malumot-indeks.js?v=26082760"></script>
<script src="tarjima.js?v=26082760"></script>
<script src="yadro/ikonlar.js?v=26082760"></script>
<script src="yadro/daraxt.js?v=26082760"></script>
<script src="yadro/chizma.js?v=26082760"></script>
<script src="yadro/qollanma.js?v=26082760"></script>
<script src="yadro/api.js?v=26082760"></script>
<script src="yadro/app.js?v=26082760"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  const oldindan = new URLSearchParams(location.search).get("id");
  document.getElementById("kt-obyekt").innerHTML = yoz.map(y =>
    '<option value="' + y.id + '"' + (y.id === oldindan ? " selected" : "") + '>' +
    y.id + " — " + y.mulk.qisqa + '</option>').join("");
  document.getElementById("kt-forma").addEventListener("submit", async e => {
    e.preventDefault();
    const q = MKB.forma(e.target, ["obyektId", "tur", "sana", "inspektor"]);
    if (!q) return;
    const id = "KO-2026/0" + String(430 + Math.floor((Date.now() / 60000) % 500));
    await MKBapi.yangi("KORIKLAR", {id, obyektId: q.obyektId, tur: q.tur,
      sana: q.sana, holat: "rejada", inspektor: q.inspektor, izoh: q.izoh || ""});
    MKB.toast("Ko'rik rejaga kiritildi — " + id);
    setTimeout(() => location.href = "korik-rejasi.html", 700);
  });
});
</script>
</body>
</html>
