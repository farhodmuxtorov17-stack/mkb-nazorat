<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Sahifa topilmadi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082610">
<style>
.xato-sahna{min-height:100vh;display:grid;place-items:center;background:var(--qogoz);padding:24px}
.xato-karta{text-align:center;max-width:460px}
.xato-karta .kod{font:800 96px/1 var(--shrift-displey);letter-spacing:-.04em;color:var(--siyoh)}
.xato-karta .kod i{font-style:normal;color:var(--brend);text-shadow:0 0 0 var(--brend)}
.xato-karta h1{font:700 22px/1.2 var(--shrift-displey);margin:10px 0 8px}
.xato-karta p{font-size:13.5px;color:var(--iz);line-height:1.6;margin-bottom:22px}
.xato-karta .tugmalar{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body data-sahifa="kirish" data-ochiq="1">
<div class="xato-sahna"><div class="xato-karta">
  <div class="kod">4<i>0</i>4</div>
  <h1>Bunday sahifa topilmadi</h1>
  <p>Manzil xato yozilgan yoki yozuv arxivga ko'chirilgan bo'lishi mumkin.</p>
  <div class="tugmalar">
    <a class="tugma tugma-oq" href="javascript:history.back()">Orqaga qaytish</a>
    <a class="tugma tugma-asosiy" id="bosh-havola" href="kirish.html">Bosh sahifa</a>
  </div>
</div></div>
<script src="malumot.js?v=26082610"></script>
<script src="malumot-qoshimcha.js?v=26082610"></script>
<script src="tarjima.js?v=26082610"></script>
<script src="yadro/ikonlar.js?v=26082610"></script>
<script src="yadro/chizma.js?v=26082610"></script>
<script src="yadro/api.js?v=26082610"></script>
<script src="yadro/app.js?v=26082610"></script>
<script>
document.addEventListener("mkb:tayyor", () => {
  const s = MKBapi.sessiya();
  if (s) document.getElementById("bosh-havola").href = rolBoshSahifasi(ROL_KALIT[s.rol] || "admin");
});
</script>
</body>
</html>
