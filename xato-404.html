<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Sahifa topilmadi</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.ochiq-sahna{min-height:100vh;display:grid;place-items:center;padding:26px 16px;
  background:
    radial-gradient(900px 640px at 12% 0%, var(--fon-issiq) 0%, transparent 58%),
    radial-gradient(800px 620px at 92% 16%, var(--fon-sovuq) 0%, transparent 56%),
    linear-gradient(150deg,var(--fon-issiq) 0%,var(--fon-sovuq) 54%,var(--fon-mint) 100%)}
.xato-karta{text-align:center;width:min(500px,100%);background:var(--oq);border-radius:30px;padding:44px 40px;box-shadow:var(--soya-suzuvchi)}
.xato-karta .kod{font:500 92px/1 var(--shrift-displey);letter-spacing:-.05em;color:var(--siyoh)}
.xato-karta .kod i{font-style:normal;color:var(--mint-matn)}
.xato-karta h1{font:500 24px/1.2 var(--shrift-displey);letter-spacing:-.03em;margin:14px 0 10px}
.xato-karta p{font-size:14.5px;color:var(--matn-3);line-height:1.6;margin-bottom:26px}
.xato-karta .tugmalar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (max-width:480px){.xato-karta{padding:34px 22px;border-radius:26px}.xato-karta .kod{font-size:72px}}
</style>
</head>
<body data-sahifa="kirish" data-ochiq="1">
<div class="ochiq-sahna"><main class="xato-karta">
  <div class="kod" data-tarjimasiz>4<i>0</i>4</div>
  <h1>Bunday sahifa yoki yozuv topilmadi</h1>
  <p>Manzil xato yozilgan yoki yozuv o&#39;chirilgan. Balansdan chiqarilgan aktiv arxivda saqlanadi.</p>
  <div class="tugmalar" data-sayohat="tugmalar">
    <button type="button" class="tugma tugma-oq" id="orqaga"><svg class="ic"><use href="#ik-chap"/></svg><span>Orqaga qaytish</span></button>
    <a class="tugma tugma-asosiy" id="bosh-havola" href="kirish.html">Kirish sahifasi</a>
  </div>
</main></div>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script>
(async () => {
  await MKBapi.tayyor;
  const orqaga = document.getElementById("orqaga");
  if (history.length > 1) orqaga.addEventListener("click", () => history.back());
  else orqaga.hidden = true;
  const rol = MKBapi.sessiya() ? MKB.rol() : null;
  if (rol){
    const a = document.getElementById("bosh-havola");
    a.href = rolBoshSahifasi(rol);
    a.textContent = "Bosh sahifa";
  }
  tarjimaQil();
})();
</script>
</body>
</html>
