<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Hisobotlar</span></div>
    <div class="hs-qator"><h1>Realizatsiya hisoboti</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><button type="button" class="tugma tugma-oq" onclick="window.print()"><svg class="ic"><use href="#i-chop"/></svg>Chop</button><a class="tugma tugma-asosiy" href="hisobot-eksport.html"><svg class="ic"><use href="#i-yuklab"/></svg>Eksport</a></div></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="hisobotlar.html">Markaz</a><a href="hisobot-portfel.html">Portfel</a><a href="hisobot-undiruv.html">Undiruv</a><a href="hisobot-realizatsiya.html" class="faol">Realizatsiya</a><a href="hisobot-zaxira.html">Zaxira</a><a href="hisobot-hudud.html">Hudud</a><a href="hisobot-kpi.html">KPI</a></nav>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Savdodagi lotlar</span>
      <span class="m-qiymat"><span id="hr-1">—</span></span>

    <div class="metrika"><span class="m-yorliq">Sotilgan (2026)</span>
      <span class="m-qiymat"><span id="hr-2">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Tushum (2026)</span>
      <span class="m-qiymat"><span id="hr-3">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">O'rtacha chegirma</span>

    </div>

    <section class="karta"><div class="karta-bosh"><h2>Yillik tushum, mln</h2></div><div id="hr-yil"></div></section>

<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>

<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>

<script src="yadro/app.js?v=26082621"></script>
<script>

function gorizontalBar(joy, juftlar, rang){
  MKB.barlar(joy, juftlar.map(([nom, v]) => [nom, v, rang]), {format: (n, j) => j[1]});
}
function ustunBar(joy, yorliqlar, qiymatlar){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:12px;height:160px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + String(v).replace(".", ",") + '</span>' +
        '<div style="width:100%;max-width:38px;height:' + Math.round(v / maks * 112) + 'px;border-radius:14px 14px 4px 4px;background:' +
        (i === qiymatlar.length - 1 ? 'var(--brend)' : 'var(--siyoh)') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span></div>').join("") + '</div>';
}
document.addEventListener("mkb:tayyor", async () => {
  const sotuv = await MKBapi.royxat("SOTUV");
  const arxiv = await MKBapi.royxat("ARXIV");
  const y26 = arxiv.filter(a => a.yil === "2026");
  document.getElementById("hr-1").textContent = sotuv.length;
  document.getElementById("hr-2").textContent = y26.length;
  document.getElementById("hr-3").innerHTML =
    MKB.fmt(Math.round(y26.reduce((a, x) => a + MKB.sonQiymat(x.summa), 0))) + "<small>mln so'm</small>";
  document.getElementById("hr-4").innerHTML = "7,4<small>%</small>";
  gorizontalBar("hr-bosqich", MKB_DATA.AUKSION_BOSQICH.map(([kalit, nom]) =>
    [nom, sotuv.filter(l => l.bosqich === kalit).length]));
  const yillar = {};
  arxiv.forEach(a => yillar[a.yil] = (yillar[a.yil] || 0) + MKB.sonQiymat(a.summa));
  const juft = Object.entries(yillar).sort();
  MKBchizma.ustun("hr-yil", {yorliqlar: juft.map(v => v[0]), qiymatlar: juft.map(v => Math.round(v[1])),
    balandlik: 200, tooltipFormat: v => MKB.fmt(v) + " mln"});
});
</script>
</body>
</html>
