<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Ko'rik kalendari</title>
<link rel="stylesheet" href="yadro/app.css?v=26082730">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Ko'rik nazorati</span></div>
    <div class="hs-qator"><h1>Ko'rik kalendari</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="korik-rejasi.html">Reja</a><a href="korik-kalendar.html" class="faol">Kalendar</a><a href="korik-tarixi.html">Tarix</a><a href="korik-kechikkan.html">Kechikkanlar</a><a href="korik-marshrut.html">Marshrutlar</a></nav>
  <div id="kk-kunlar" style="display:flex;flex-direction:column;gap:14px"></div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082730"></script>
<script src="malumot.js?v=26082730"></script>
<script src="malumot-qoshimcha.js?v=26082730"></script>
<script src="malumot-kengaytma.js?v=26082730"></script>
<script src="malumot-kirish.js?v=26082730"></script>
<script src="malumot-indeks.js?v=26082730"></script>
<script src="tarjima.js?v=26082730"></script>
<script src="yadro/ikonlar.js?v=26082730"></script>
<script src="yadro/daraxt.js?v=26082730"></script>
<script src="yadro/chizma.js?v=26082730"></script>
<script src="yadro/qollanma.js?v=26082730"></script>
<script src="yadro/api.js?v=26082730"></script>
<script src="yadro/app.js?v=26082730"></script>
<script>
function korikQatori(k){
  return '<a class="qator" href="korik-akti.html?id=' + encodeURIComponent(k.id) + '">' +
    '<span class="belgi ' +
      (k.holat === "rejada" ? "mint" : k.holat === "kechikkan" ? "pushti" : "lavanda") + '">' + ik("korik") + '</span>' +
    '<span class="matn"><b>' + (k.obyektNomi || k.obyektId) + '</b>' +
    '<span>' + k.id + ' · ' + (k.tur || "Rejali") + ' · ' + k.inspektor + '</span></span>' +
    '<span class="chip ' + (k.holat === "rejada" ? "chip-brend" : k.holat === "kechikkan" ? "chip-xavf" : "chip-yashil") + '">' + k.sana + '</span></a>';
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? (o.qisqa || o.nom) : id;
}
document.addEventListener("mkb:tayyor", async () => {
  const r = await MKBapi.royxat("KORIKLAR");
  r.forEach(k => k.obyektNomi = obyektNomi(k.obyektId));
  document.getElementById("hs-meta").textContent = r.length + " ta ko'rik jadvalda";
  const kunlar = {};
  r.forEach(k => (kunlar[k.sana] = kunlar[k.sana] || []).push(k));
  document.getElementById("kk-kunlar").innerHTML = Object.entries(kunlar).map(([sana, royxat]) =>
    '<section class="karta"><div class="karta-bosh"><h2>' + sana + '</h2>' +
    '<span class="soni">' + royxat.length + ' ta ko\'rik</span></div>' +
    royxat.map(korikQatori).join("") + '</section>').join("");
});
</script>
</body>
</html>
