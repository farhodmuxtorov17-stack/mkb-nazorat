<style>
/* Yordam markazi: v6 tokenlari, o'lchamlar kichraytirilmaydi */
/* Ichki daraja: yadrodagi yagona segment almashtirgich (trek + pilyulalar), bo'lim tasmasidan aniq ajraladi */
.ym-menyu{align-self:flex-start;max-width:100%;margin-bottom:16px}
.ym-izlash{position:relative;margin-bottom:20px}
.ym-izlash .ic{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--matn-3);pointer-events:none}
.ym-izlash input{width:100%;min-height:56px;padding:0 52px 0 52px;border:0;border-radius:var(--r-pilyula);background:var(--oq);box-shadow:var(--soya);font-size:15.5px}
.ym-izlash input:focus-visible{outline:2px solid var(--siyoh);outline-offset:2px}
.ym-izlash .ym-tozala{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.ym-izlash-izoh{font-size:13px;color:var(--matn-3);margin:-10px 0 18px 8px}
.ym-bolim{margin-top:24px}
.ym-bolim > h2{font:500 20px/1.25 var(--shrift-displey);letter-spacing:-.02em;margin:0 0 12px 4px}
.ym-bolim > .ym-izoh{font-size:13.5px;color:var(--matn-3);margin:-6px 0 14px 4px;line-height:1.55}
.ym-panjara{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ym-plitka{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:var(--r-plitka);background:var(--oq);box-shadow:var(--soya-past);
  min-height:88px;transition:background var(--tez),box-shadow var(--tez);color:inherit;text-align:left;width:100%}
.ym-plitka:hover{background:var(--plitka)}
.ym-plitka:focus-visible{outline:2px solid var(--siyoh);outline-offset:2px}
.ym-plitka .ym-ikon{width:40px;height:40px;border-radius:var(--r-pilyula);background:var(--plitka);display:grid;place-items:center;flex:none}
.ym-plitka:hover .ym-ikon{background:var(--oq)}
.ym-plitka b{display:block;font-size:14.5px;font-weight:500;line-height:1.35}
.ym-plitka span.ym-kichik{display:block;font-size:13px;color:var(--matn-3);line-height:1.5;margin-top:3px}
.ym-plitka .chip{margin-top:6px}
.ym-natija{display:flex;flex-direction:column;gap:2px}
.ym-natija a{display:block;padding:14px 18px;border-radius:var(--r-orta);color:inherit}
.ym-natija a:hover,.ym-natija a:focus-visible{background:var(--plitka)}
.ym-natija .ym-tur{font-size:12px;color:var(--matn-3);letter-spacing:.04em;text-transform:uppercase}
.ym-natija b{display:block;font-size:14.5px;font-weight:500;margin:2px 0}
.ym-natija p{font-size:13.5px;color:var(--matn-2);line-height:1.55}
mark{background:var(--sariq);color:var(--siyoh);border-radius:4px;padding:0 2px}
.ym-bosh{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.ym-bosh .ym-ikon-katta{width:56px;height:56px;border-radius:var(--r-pilyula);background:var(--plitka);display:grid;place-items:center;flex:none}
.ym-bosh .ym-bosh-matn{flex:1;min-width:240px}
.ym-bosh h2{font:500 26px/1.2 var(--shrift-displey);letter-spacing:-.03em}
.ym-tugmalar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ym-uch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ym-uch .qol-blok{margin-top:0}
.ym-rasm{margin:10px 0 4px;border-radius:var(--r-kichik);overflow:hidden;box-shadow:0 0 0 1px var(--chiziq);background:var(--plitka);max-width:640px}
.ym-rasm img{width:100%;height:auto;display:block}
.ym-rasm figcaption{font-size:12.5px;color:var(--matn-3);padding:8px 12px;background:var(--oq)}
.ym-dl{display:flex;flex-direction:column}
.ym-dl > div{padding:12px 0;border-top:1px solid var(--chiziq-2)}
.ym-dl > div:first-child{border-top:0;padding-top:0}
.ym-dl dt{font-size:14px;font-weight:500}
.ym-dl dd{font-size:13.5px;color:var(--matn-2);line-height:1.6;margin-top:3px}
.ym-chiplar{display:flex;gap:6px;flex-wrap:wrap}
.ym-havolalar{display:flex;gap:8px;flex-wrap:wrap}
.ym-havolalar a{min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:var(--r-pilyula);background:var(--plitka);font-size:13.5px}
.ym-havolalar a:hover{background:var(--band-hover)}
.huquq-royxat{list-style:none;display:flex;flex-direction:column}
.huquq-royxat li{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:13.5px}
.huquq-royxat li + li{border-top:1px solid var(--chiziq-2)}
.huquq-royxat li > span:first-child{flex:1;min-width:0}
.huquq-royxat li.yopiq{color:var(--matn-3)}
.huquq-royxat .chiplar{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ym-savol{border-top:1px solid var(--chiziq-2)}
.ym-savol:first-of-type{border-top:0}
.ym-savol summary{list-style:none;cursor:pointer;padding:14px 4px;font-size:14.5px;font-weight:500;display:flex;gap:10px;align-items:flex-start;min-height:44px}
.ym-savol summary::-webkit-details-marker{display:none}
.ym-savol summary::before{content:"+";width:24px;height:24px;flex:none;border-radius:var(--r-pilyula);background:var(--plitka);display:grid;place-items:center;font-weight:400}
.ym-savol[open] summary::before{content:"−"}
.ym-savol p{font-size:13.5px;color:var(--matn-2);line-height:1.65;padding:0 4px 16px 38px}
.ym-savol:target summary,.ym-atama:target{background:var(--sariq-fon);border-radius:var(--r-kichik)}
.ym-harflar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.ym-harflar a{min-width:40px;min-height:40px;display:grid;place-items:center;border-radius:var(--r-pilyula);background:var(--plitka);font-size:13.5px}
.ym-harflar a:hover{background:var(--band-hover)}
.ym-atama{padding:14px 8px;border-top:1px solid var(--chiziq-2)}
.ym-atama dt{font-size:15px;font-weight:500}
.ym-atama dd{font-size:13.5px;color:var(--matn-2);line-height:1.6;margin-top:4px}
.ym-atama .ym-havolalar{margin-top:8px}
.ym-jadval{width:100%;border-collapse:collapse;font-size:14px}
.ym-jadval th,.ym-jadval td{text-align:left;padding:12px 10px;border-top:1px solid var(--chiziq-2);vertical-align:top}
.ym-jadval th{font-weight:500;color:var(--matn-3);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;border-top:0}
kbd{display:inline-block;min-width:28px;padding:3px 8px;border-radius:8px;background:var(--plitka);box-shadow:inset 0 -1px 0 var(--chiziq-3);font:500 13px var(--shrift);text-align:center;margin:2px 2px 2px 0}
.ym-xarita{width:100%;overflow:visible}
.ym-xarita svg{display:block;width:100%;height:auto}
.ym-xarita .jx-quti{fill:var(--oq);stroke:var(--chiziq-3);stroke-width:1;transition:fill var(--tez)}
.ym-xarita a:hover .jx-quti,.ym-xarita a:focus .jx-quti{fill:var(--plitka)}
.ym-xarita a:focus{outline:none}
.ym-xarita a:focus-visible .jx-quti{stroke:var(--siyoh);stroke-width:2}
.ym-xarita .jx-raqam{fill:var(--siyoh)}
.ym-xarita .jx-raqam-t{fill:var(--oq);font:500 12px var(--shrift)}
.ym-xarita .jx-nom{fill:var(--siyoh);font:500 13px var(--shrift)}
.ym-xarita .jx-rol{fill:var(--matn-3);font:400 12px var(--shrift)}
.ym-xarita .jx-chiziq{stroke:var(--matn-4);stroke-width:1.5;fill:none}
.ym-xarita .jx-uch{fill:var(--matn-4)}
.ym-xarita .jx-yolak{fill:var(--plitka)}
.ym-xarita .jx-yolak-t{fill:var(--matn-3);font:500 12px var(--shrift);letter-spacing:.04em}
.ym-yangi li{padding:12px 0;border-top:1px solid var(--chiziq-2);font-size:14px;line-height:1.6;list-style:none}
.ym-yangi li:first-child{border-top:0}
.ym-yangi b{font-weight:500}
.ym-mundarija ol{columns:2;column-gap:32px;padding-left:20px}
.ym-mundarija li{font-size:14px;line-height:1.9}
.ym-toliq-bolim{margin-top:28px}
.ym-toliq-bolim > h2{font:500 22px/1.25 var(--shrift-displey);margin-bottom:12px}
.ym-toliq-maqola{margin-top:16px}
@media (max-width:980px){ .ym-uch{grid-template-columns:1fr} }
@media (max-width:720px){
  .ym-bosh h2{font-size:22px}
  .ym-mundarija ol{columns:1}
  .ym-panjara{grid-template-columns:1fr}
}
@media print{
  .ym-menyu,.ym-izlash,.ym-izlash-izoh,.ym-tugmalar,.ym-yashir-chop{display:none!important}
  .ym-toliq-bolim{break-before:page}
  .qol-qadam,.ym-rasm,.ym-savol,.ym-atama,.ym-dl > div,.huquq-royxat li{break-inside:avoid}
  h2,h4{break-after:avoid}
  .ym-rasm{max-width:100%;box-shadow:0 0 0 1px #ccc}
  .ym-savol p{padding-left:0}
  .ym-plitka,.karta{box-shadow:none!important;border:1px solid #ddd}
}
</style>
</head>

    ["Bu sahifa obyekt kartochkasining tabi: reyestrdan aktivni oching va kerakli tabni tanlang.",
     "Это вкладка карточки объекта: откройте актив из реестра и выберите нужную вкладку."],
  ].forEach(p => X(p[0], p[1]));
  if (typeof window.mkbYordamTuzat === "function") window.mkbYordamTuzat();

  /* ---------- Yordamchilar ---------- */
  const MENYU = [["", "Bosh sahifa"], ["rollar", "Rollar"], ["sahifalar", "Sahifalar"], ["jarayonlar", "Jarayonlar"], ["atamalar", "Atamalar"], ["savollar", "Savollar"], ["klaviatura", "Klaviatura"], ["yangi", "Nima yangi"]];
  const ikon = (nom, kls) => '<span class="' + (kls || "ym-ikon") + '" aria-hidden="true">' + ik(nom) + "</span>";
  const sahifaNomi = f => (Y[f] && Y[f].sarlavha) || f;
  /* Bo'lim markazi: yon paneldan tushgan sahifa shu yerdagi tasmada qoladi (yadro/app.js BOLIMLAR) */
  const bolimMarkazi = b => {
    if (!b || b === "kirish") return null;
    if (b === "sozlama") return "sozlamalar.html";
    const x = BOLIMLAR.find(k => k.kalit === b);
    if (!x) return null;
    const rolga = typeof BOLIM_BOSH_ROL === "object" && BOLIM_BOSH_ROL[b] ? BOLIM_BOSH_ROL[b][joriyRol] : null;
    return rolga || faylNomi(x.href);
  };
  const rolNomi = k => (Q[k] && Q[k].nom) || k;
  const rolOchadimi = (rol, f) => {
    if (rol === "admin") return true;
    if (SAHIFA_MAXSUS[f] && !SAHIFA_MAXSUS[f].includes(rol)) return false;
    const b = bolimTopish(f);
    if (!b) return true;
    if (!huquqBor(rol, b, "o")) return false;
    if (SAHIFA_AMAL[f] && !SAHIFA_AMAL[f].split("|").some(a => huquqBor(rol, b, AMAL_HARF[a]))) return false;
    if (SAHIFA_BOLIM2[f] && !huquqBor(rol, SAHIFA_BOLIM2[f], "o")) return false;
    return true;
  };
  const turRollari = id => { const t = TUR[id]; if (!t) return []; return t.rol === "hammasi" || !t.rol ? ROL_TARTIB.slice() : [].concat(t.rol); };
  const turMenga = id => !!TUR[id] && (turRollari(id).includes(joriyRol));
  const havolaTugma = (href, matn, ikn, kls) => '<a class="tugma ' + (kls || "tugma-oq") + '" href="' + esc(href) + '">' + (ikn ? ik(ikn) : "") + "<span>" + esc(matn) + "</span></a>";
  const sayohatTugma = (id, matn, kls, qadam) => '<button type="button" class="tugma ' + (kls || "tugma-asosiy") + '" data-ym-sayohat="' + esc(id) + '"' + (qadam ? ' data-ym-qadam="' + qadam + '"' : "") + ">" + ik("ong") + "<span>" + esc(matn) + "</span></button>";
  /* Vazifaning sayohati bitta yoki bir nechta bo'lishi mumkin: rolga mos kelgani ochiladi
     (qaror qabul qiladigan xodim va so'rov yuboradigan xodim uchun alohida sayohat) */
  const turTanla = s => [].concat(s || []).find(turMenga) || null;
  const sayohatTugmalari = (turId2, namoyishId) => {
    let h = "";
    const turId = turTanla(turId2);
    if (turId) h += sayohatTugma(turId, "Sayohatni boshlash");
    if (namoyishId && turMenga(namoyishId)) h += '<button type="button" class="tugma tugma-oq" data-ym-sayohat="' + esc(namoyishId) + '">' + ik("korish") + "<span>Qanday ishlaydi</span></button>";
    return h;
  };
  const royxatBlok = (nom, bandlar, kls) => bandlar && bandlar.length
    ? '<div class="qol-blok' + (kls ? " " + kls : "") + '"><h4>' + esc(nom) + "</h4><ul>" + bandlar.map(b => "<li>" + esc(b) + "</li>").join("") + "</ul></div>" : "";
  const huquqRoyxati = rol => {
    const r = ROL_RUXSAT[rol];
    const bol = BOLIMLAR.map(b => ({kalit: b.kalit, nom: b.yorliq}));
    if (!bol.some(b => b.kalit === "sozlama")) bol.push({kalit: "sozlama", nom: "Sozlamalar"});
    return '<ul class="huquq-royxat">' + bol.map(b => {
      const h = r === null ? "oyt" : ((r || {})[b.kalit] || "");
      return '<li class="' + (h ? "" : "yopiq") + '"><span>' + esc(b.nom) + '</span><span class="chiplar">' +
        (h ? HARF.filter(x => h.includes(x[0])).map(x => '<span class="chip chip-kichik ' + x[2] + '">' + esc(x[1]) + "</span>").join("") : "<span>Yopiq</span>") + "</span></li>";
    }).join("") + "</ul>";
  };
  const rasm = (src, izoh) => src ? '<figure class="ym-rasm"><a href="' + esc(src) + '" target="_blank" rel="noopener" aria-label="Rasmni kattalashtirish">' +
    '<img src="' + esc(src) + '" alt="' + esc(izoh || "") + '" loading="lazy" decoding="async"></a>' + (izoh ? "<figcaption>" + esc(izoh) + "</figcaption>" : "") + "</figure>" : "";
  /* Sahifaga tegishli rasm: rol qadamlarida shu sahifaga bog'langan birinchi rasm */
  const sahifaRasmi = f => {
    for (const k of ROL_TARTIB) for (const q of (Q[k].qadamlar || [])) if (q.rasm && q.havola && q.havola.split("#")[0] === f) return {src: q.rasm, izoh: q.nom};
    return null;
  };
  const kontent = $("ym-kontent");

  /* ---------- Menyu ---------- */
  function menyuChiz(faol){
    $("ym-menyu").innerHTML = MENYU.map(m => '<a href="#' + m[0] + '"' + (m[0] === faol ? ' aria-current="page"' : "") + ">" + esc(m[1]) + "</a>").join("");
  }

  /* ---------- Bosh sahifa ---------- */
  function boshSahifa(){
    const rollar = ROL_TARTIB.map(k => '<a class="ym-plitka" href="#rol-' + k + '">' + ikon(ROL_KIRISH[k].ik) +
      "<span><b>" + esc(ROL_KIRISH[k].men) + '</b><span class="ym-kichik">' + esc(rolNomi(k)) + "</span>" +
      (k === joriyRol ? '<span class="chip chip-kichik chip-brend">siz</span>' : "") + "</span></a>").join("");
    const vaz = VAZIFALAR.filter(v => v.rollar === "hammasi" || v.rollar.includes(joriyRol)).concat(VAZIFALAR.filter(v => !(v.rollar === "hammasi" || v.rollar.includes(joriyRol))));
    const vazifalar = vaz.map(v => '<a class="ym-plitka" href="#vazifa-' + v.id + '">' + ikon(v.ik) + "<span><b>" + esc(v.nom) + '</b><span class="ym-kichik">' + esc(v.izoh) + "</span></span></a>").join("");
    const savol = SAVOLLAR.filter(s => s.rol === "umumiy" || s.rol === joriyRol).slice(0, 6);
    return '<section class="ym-bolim" aria-labelledby="ym-rol-s"><h2 id="ym-rol-s">Siz kimsiz?</h2><p class="ym-izoh">Rolingizni tanlang: ish tartibi, ekranlar va huquqlar ochiladi.</p>' +
        '<div class="ym-panjara">' + rollar + "</div></section>" +
      '<section class="ym-bolim" aria-labelledby="ym-vaz-s"><h2 id="ym-vaz-s">Nima qilmoqchisiz?</h2><p class="ym-izoh">Har vazifada qadamlar va sayohat bor.</p>' +
        '<div class="ym-panjara">' + vazifalar + "</div></section>" +
      '<section class="ym-bolim karta" aria-labelledby="ym-sav-s" style="margin-top:24px"><div class="karta-bosh"><h2 id="ym-sav-s" data-ikonka="yordam">Ko&#39;p so&#39;raladigan savollar</h2>' +
        '<a class="karta-havola" href="#savollar"><span>Barcha savollar</span>' + ik("ong") + "</a></div>" + savol.map(x => savolHTML(x)).join("") + "</section>" +
      '<section class="ym-bolim karta" aria-labelledby="ym-hs-s" style="margin-top:20px"><div class="karta-bosh"><h2 id="ym-hs-s" data-ikonka="bogliq">Aktivning hayot yo&#39;li</h2>' +
        '<a class="karta-havola" href="#jarayonlar"><span>Jarayonlar</span>' + ik("ong") + '</a></div><div class="ym-xarita" data-xarita="hayot"></div></section>';
  }
  const savolHTML = (s, ochiq) => '<details class="ym-savol" id="savol-' + esc(s.id) + '"' + (ochiq ? " open" : "") + "><summary>" + esc(s.savol) + "</summary><p>" + esc(s.javob) + "</p></details>";

  /* ---------- Rollar ---------- */
  function rollarSahifa(){
    return '<section class="ym-bolim"><h2>Rollar</h2><div class="ym-panjara">' + ROL_TARTIB.map(k => '<a class="ym-plitka" href="#rol-' + k + '">' + ikon(ROL_KIRISH[k].ik) +
      "<span><b>" + esc(rolNomi(k)) + '</b><span class="ym-kichik">' + esc(Q[k].maqsad) + "</span>" + (k === joriyRol ? '<span class="chip chip-kichik chip-brend">siz</span>' : "") + "</span></a>").join("") + "</div></section>";
  }
  function rolSahifa(k, toliq){
    const q = Q[k];
    if (!q) return null;
    const turTugma = q.sayohat && turMenga(q.sayohat) ? sayohatTugma(q.sayohat, "Sayohatni boshlash")
      : '<span class="maydon-izoh">Sayohat shu rolda kirgan xodimga ochiladi</span>';
    const qadamlar = '<ol class="qol-qadamlar">' + q.qadamlar.map((x, i) => {
      const ochiq = x.havola && sahifaRuxsatlimi(x.havola);
      return '<li class="qol-qadam"><span class="raqam" data-tarjimasiz>' + (i + 1) + '</span><span class="matn"><b>' + esc(x.nom) + "</b><span>" + esc(x.izoh) + "</span>" +
        (x.rasm ? rasm(x.rasm, x.nom) : "") +
        (x.havola ? '<a href="#' + esc(x.havola.split("#")[0]) + '"><span>' + esc(sahifaNomi(x.havola.split("#")[0])) + "</span>" + ik("ong", "mitti") + "</a>" : "") +
        (ochiq && !toliq ? '<a href="' + esc(x.havola) + '"><span>Sahifani ochish</span>' + ik("tashqi", "mitti") + "</a>" : "") +
        "</span></li>";
    }).join("") + "</ol>";
    const turlar = Object.keys(TUR).filter(id => (TUR[id].rejim || "sayohat") === "sayohat" && !TUR[id].birinchi && turRollari(id).includes(k));
    const savollar = SAVOLLAR.filter(s => s.rol === k);
    return (toliq ? "" : '<section class="karta"><div class="ym-bosh">' + ikon(ROL_KIRISH[k].ik, "ym-ikon-katta") + '<div class="ym-bosh-matn">' +
        '<h2 id="rol-' + k + '-s">' + esc(q.nom) + (k === joriyRol ? ' <span class="chip chip-kichik chip-brend">siz</span>' : "") + "</h2>" +
        '<p class="qol-maqsad" style="margin-top:8px">' + esc(q.maqsad) + '</p><div class="ym-tugmalar">' + turTugma + "</div></div></div></section>") +
      (toliq ? '<p class="qol-maqsad">' + esc(q.maqsad) + "</p>" : "") +
      '<section class="karta" style="margin-top:20px"><div class="karta-bosh"><h2 data-ikonka="reja">Ish tartibi</h2></div><div class="ym-uch">' +
        royxatBlok("Har kuni", q.kunlik) + royxatBlok("Har hafta", q.haftalik) + royxatBlok("Har oy", q.oylik) + "</div></section>" +
      '<div class="tor-2" style="margin-top:20px"><section class="karta"><div class="karta-bosh"><h2 data-ikonka="reja">Qadamma-qadam</h2></div>' + qadamlar + "</section>" +
      '<div class="ustun">' +
        '<section class="karta"><div class="karta-bosh"><h2 data-ikonka="info">Nima qila olasiz</h2></div>' + royxatBlok("", q.mumkin).replace("<h4></h4>", "") +
          royxatBlok("Nima qila olmaysiz", q.mumkinEmas, "qol-yopiq") + "</section>" +
        '<section class="karta"><div class="karta-bosh"><h2 data-ikonka="ruxsat">Bo&#39;limlar va huquqlar</h2></div>' + huquqRoyxati(k) + "</section>" +
        '<section class="karta"><div class="karta-bosh"><h2 data-ikonka="panel">Qaysi ekranlar</h2></div><div class="ym-havolalar">' +
          (q.ekranlar || []).map(f => '<a href="#' + esc(f) + '">' + esc(sahifaNomi(f)) + "</a>").join("") + "</div></section>" +
        '<section class="karta">' + royxatBlok("Javobgarlik", q.javobgarlik) + royxatBlok("Muddat va me'yorlar", q.meyor, "qol-meyor") + "</section>" +
        (turlar.length && !toliq ? '<section class="karta"><div class="karta-bosh"><h2 data-ikonka="vazifa">Vazifa sayohatlari</h2></div><div class="ym-havolalar">' +
          turlar.map(id => {
            const v = VAZIFALAR.find(x => [].concat(x.sayohat || []).indexOf(id) >= 0);
            return '<a href="' + (v ? "#vazifa-" + v.id : "#") + '"' + (v ? "" : ' data-ym-sayohat="' + esc(id) + '"') + ">" + ik("ong") + "<span>" + esc(TUR[id].sarlavha) + "</span></a>";
          }).join("") + "</div></section>" : "") +
        (savollar.length ? '<section class="karta"><div class="karta-bosh"><h2 data-ikonka="yordam">Shu rol savollari</h2></div>' + savollar.map(x => savolHTML(x, toliq)).join("") + "</section>" : "") +
      "</div></div>";

  /* ---------- Sahifa maqolasi ---------- */
  function maqolaHTML(f, toliq){
    const m = Y[f];
    if (!m) return null;
    const bolim = KIRISH_SAHIFALAR.includes(f) ? "kirish" : bolimTopish(f);
    const kim = ROL_TARTIB.filter(k => rolOchadimi(k, f));
    const yozadi = kim.filter(k => k === "admin" || huquqBor(k, bolim, "y"));
    const r = sahifaRasmi(f);
    let ochish = "";
    if (!toliq && !KIRISH_SAHIFALAR.includes(f) && f !== "qollanma.html"){
      if (OTA[f]) ochish = '<span class="maydon-izoh">Bu sahifa ro&#39;yxatdan yozuv tanlanganda ochiladi</span>' + (sahifaRuxsatlimi(OTA[f]) ? havolaTugma(OTA[f], "Ro'yxatni ochish", "ong") : "");
      else if (sahifaRuxsatlimi(f)) ochish = havolaTugma(f, "Sahifani ochish", "ong");
      else ochish = '<span class="maydon-izoh">Sahifa rolingizga yopiq</span>';
    }
    const turlar = toliq ? [] : (MKB.sayohat && MKB.sayohat.sahifaUchun ? MKB.sayohat.sahifaUchun(f) : []);
    const oddiy = turlar.filter(t => (t.rejim || "sayohat") === "sayohat");
    const nam = turlar.filter(t => t.rejim === "namoyish");
    const turTugmalar = (oddiy.length ? sayohatTugma(oddiy[0].id, "Shu sahifa bo'yicha sayohat", "tugma-asosiy", "sahifa:" + f) : "") +
      nam.map(t => '<button type="button" class="tugma tugma-oq" data-ym-sayohat="' + esc(t.id) + '">' + ik("korish") + "<span>Qanday ishlaydi</span></button>").join("");
    const blok = (nom, bandlar) => bandlar && bandlar.length ? '<div class="qol-blok"><h4>' + esc(nom) + '</h4><dl class="ym-dl">' +
      bandlar.map(b => "<div><dt>" + esc(b.nom) + "</dt><dd>" + esc(b.izoh) + "</dd></div>").join("") + "</dl></div>" : "";
    /* Yon panel qisqargan: har bir maqola sahifaning qayerdan ochilishini aytadi */
    const markaz = bolimMarkazi(bolim);
    const kartochkada = (window.MKB_OBYEKT_TABLAR || []).some(t => t.f === f);
    const qayerdan = (!toliq && markaz && markaz !== f && !KIRISH_SAHIFALAR.includes(f))
      ? '<div class="qol-blok"><h4>Qayerdan topiladi</h4><p class="maydon-izoh" style="margin:0 0 10px">' +
        esc(kartochkada ? "Bu sahifa obyekt kartochkasining tabi: reyestrdan aktivni oching va kerakli tabni tanlang."
          : "Yon panelda har bir rolga ko\'pi bilan olti band ko\'rinadi. Bu sahifa yon panelda bo\'lmasa ham, bo\'lim tasmasida, Ctrl+K qidiruvida va to\'g\'ridan-to\'g\'ri havolada ochiq turadi.") +
        '</p><div class="ym-havolalar"><a href="#' + esc(markaz) + '">' + esc(sahifaNomi(markaz)) + "</a>" +
        (kartochkada && Y["obyektlar.html"] ? '<a href="#obyektlar.html">' + esc(sahifaNomi("obyektlar.html")) + "</a>" : "") +
        "</div></div>"
      : "";
    const amallar = m.amallar && m.amallar.length ? '<div class="qol-blok"><h4>Tugmalar va ulardan keyin nima bo&#39;ladi</h4><ol class="qol-qadamlar">' +
      m.amallar.map((a, i) => '<li class="qol-qadam"><span class="raqam" data-tarjimasiz>' + (i + 1) + '</span><span class="matn"><b>' + esc(a.nom) + "</b><span>" + esc(a.izoh) + "</span></span></li>").join("") + "</ol></div>" : "";
    return '<article class="' + (toliq ? "ym-toliq-maqola karta" : "karta") + '" id="' + (toliq ? "m-" + esc(f.replace(".html", "")) : "ym-maqola") + '">' +
      '<div class="ym-bosh"><div class="ym-bosh-matn"><span class="chip chip-kichik chip-kul">' + esc(BOLIM_NOM[bolim] || "") + "</span>" +
        "<h2 style=\"margin-top:8px\">" + esc(m.sarlavha) + "</h2>" +
        '<p class="qol-maqsad" style="margin-top:8px">' + esc(m.nimaUchun) + "</p>" +
        ((ochish || turTugmalar) ? '<div class="ym-tugmalar">' + turTugmalar + ochish + "</div>" : "") + "</div></div>" +
      (kim.length && !KIRISH_SAHIFALAR.includes(f) ? '<div class="qol-blok"><h4>Kim foydalanadi</h4><div class="ym-chiplar">' +
        kim.map(k => '<span class="chip ' + (yozadi.includes(k) ? "chip-kok" : "chip-kul") + '"><span>' + esc(rolNomi(k)) + "</span> · <span>" + (yozadi.includes(k) ? "Yozadi" : "Ko'radi") + "</span></span>").join("") + "</div></div>" : "") +
      qayerdan +
      (r ? rasm(r.src, m.sarlavha) : "") +
      blok("Ekrandagi bloklar", m.bloklar) + amallar +
      royxatBlok("Ko'p uchraydigan xatolar", m.xatolar, "qol-yopiq") + royxatBlok("Qoidalar", m.qoidalar, "qol-meyor") +
      (m.bogliq && m.bogliq.length ? '<div class="qol-blok"><h4>Bog&#39;liq sahifalar</h4><div class="ym-havolalar">' +
        m.bogliq.filter(b => Y[b]).map(b => '<a href="#' + esc(b) + '">' + esc(sahifaNomi(b)) + "</a>").join("") + "</div></div>" : "") +
      "</article>";
  }

  /* ---------- Sahifalar ro'yxati ---------- */
  function sahifalarGuruhlari(){
    const guruh = [];
    const kalitlar = BOLIMLAR.map(b => b.kalit).concat(["sozlama"]).filter((k, i, a) => a.indexOf(k) === i);
    kalitlar.forEach(k => {
      const f = ((window.MKB_DARAXT || {})[k] || []).map(x => x.f).concat((window.MKB_ICHKI || {})[k] || []).filter(x => Y[x]);
      if (f.length) guruh.push([k, f]);
    });
    guruh.push(["kirish", KIRISH_SAHIFALAR.filter(x => Y[x])]);
    const bor = new Set(guruh.flatMap(g => g[1]));
    const qolgan = Object.keys(Y).filter(x => !bor.has(x));
    if (qolgan.length) guruh.push(["boshqa", qolgan]);
    return guruh;
  }
  function sahifalarSahifa(){
    return sahifalarGuruhlari().map(([k, f]) => '<section class="ym-bolim" id="bolim-' + esc(k) + '"><h2>' + esc(BOLIM_NOM[k] || k) + '</h2><div class="ym-panjara">' +
      f.map(x => '<a class="ym-plitka" href="#' + esc(x) + '"><span><b>' + esc(Y[x].sarlavha) + '</b><span class="ym-kichik" data-tarjimasiz>' + esc(tr(Y[x].nimaUchun).split(". ")[0].replace(/\.$/, "")) + "</span></span></a>").join("") +
      "</div></section>").join("");
  }

  /* ---------- Vazifa maqolasi ---------- */
  function vazifaHTML(v, toliq){
    const rollar = v.rollar === "hammasi" ? ROL_TARTIB : v.rollar;
    return '<article class="karta' + (toliq ? " ym-toliq-maqola" : "") + '"><div class="ym-bosh">' + ikon(v.ik, "ym-ikon-katta") + '<div class="ym-bosh-matn"><h2>' + esc(v.nom) + "</h2>" +
      '<p class="qol-maqsad" style="margin-top:8px">' + esc(v.izoh) + "</p>" +
      (toliq ? "" : '<div class="ym-tugmalar">' + sayohatTugmalari(v.sayohat, v.namoyish) + "</div>") + "</div></div>" +
      '<div class="qol-blok"><h4>Kim bajaradi</h4><div class="ym-chiplar">' + rollar.map(k => '<span class="chip chip-kul">' + esc(rolNomi(k)) + "</span>").join("") + "</div></div>" +
      '<div class="qol-blok"><h4>Qadamlar</h4><ol class="qol-qadamlar">' + v.qadamlar.map((q, i) => '<li class="qol-qadam"><span class="raqam" data-tarjimasiz>' + (i + 1) +
        '</span><span class="matn"><span style="color:var(--siyoh);font-size:14px">' + esc(q) + "</span></span></li>").join("") + "</ol></div>" +
      '<div class="qol-blok"><h4>Sahifalar va maqolalar</h4><div class="ym-havolalar">' + v.sahifalar.filter(f => Y[f]).map(f => '<a href="#' + esc(f) + '">' + esc(sahifaNomi(f)) + "</a>").join("") + "</div></div></article>";
  }

  /* ---------- Jarayon xaritalari (SVG, kenglikka qarab gorizontal yoki vertikal) ---------- */

  const svgMatn = s => esc(tr(s));
  function xaritaSVG(tur, en){
    const tor = en < 720;
    const uch = '<defs><marker id="jx-uch-' + tur + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="jx-uch" d="M0 0L10 5L0 10z"/></marker></defs>';
    const qutiH = (x, y, w, h, n, nom, rol, href) => '<a href="#' + href + '" aria-label="' + svgMatn(nom) + '">' +
      '<rect class="jx-quti" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="16"/>' +
      '<circle class="jx-raqam" cx="' + (x + 22) + '" cy="' + (y + 24) + '" r="11"/><text class="jx-raqam-t" x="' + (x + 22) + '" y="' + (y + 28) + '" text-anchor="middle">' + n + "</text>" +
      '<text class="jx-nom" x="' + (x + 14) + '" y="' + (y + 58) + '">' + svgMatn(nom) + "</text>" +
      (rol ? '<text class="jx-rol" x="' + (x + 14) + '" y="' + (y + 78) + '">' + svgMatn(rol) + "</text>" : "") + "</a>";
    if (tur === "hayot"){
      if (!tor){
        const w = 146, g = 12, h = 96, W = HAYOT.length * w + (HAYOT.length - 1) * g;
        let s = '<svg viewBox="0 0 ' + W + " " + (h + 4) + '" role="group" aria-label="' + svgMatn("Aktivning hayot yo'li") + '">' + uch;
        HAYOT.forEach((b, i) => {
          const x = i * (w + g);
          s += qutiH(x, 2, w, h, i + 1, b[1], b[2], b[0]);
          if (i < HAYOT.length - 1) s += '<path class="jx-chiziq" d="M' + (x + w + 1) + " " + (2 + h / 2) + "H" + (x + w + g - 1) + '" marker-end="url(#jx-uch-' + tur + ')"/>';
        });
        return s + "</svg>";
      }
      const w = Math.max(280, en - 4), h = 88, g = 18;
      let s = '<svg viewBox="0 0 ' + w + " " + (HAYOT.length * (h + g) - g + 4) + '" role="group" aria-label="' + svgMatn("Aktivning hayot yo'li") + '">' + uch;
      HAYOT.forEach((b, i) => {
        const y = 2 + i * (h + g);
        s += qutiH(2, y, w - 4, h, i + 1, b[1], b[2], b[0]);
        if (i < HAYOT.length - 1) s += '<path class="jx-chiziq" d="M36 ' + (y + h + 1) + "V" + (y + h + g - 1) + '" marker-end="url(#jx-uch-' + tur + ')"/>';

    /* Undiruvdan balansga: uch yo'lak */

        '<text class="jx-yolak-t" x="16" y="' + (2 + i * yh + yh / 2) + '">' + svgMatn(y) + "</text>"; });
      let oldin = null;
      TOPSHIRISH.forEach((b, i) => {
        const x = lw + i * (w + g), y = 2 + b[2] * yh + (yh - 8 - h) / 2;
        s += '<a href="#' + b[0] + '" aria-label="' + svgMatn(b[1]) + '"><rect class="jx-quti" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="14"/>' +
          '<circle class="jx-raqam" cx="' + (x + 20) + '" cy="' + (y + 22) + '" r="10"/><text class="jx-raqam-t" x="' + (x + 20) + '" y="' + (y + 26) + '" text-anchor="middle">' + (i + 1) + "</text>" +
          '<text class="jx-nom" x="' + (x + 12) + '" y="' + (y + 54) + '" style="font-size:12px">' + svgMatn(b[1]) + "</text></a>";
        if (oldin){
          const [ox, oy] = oldin;
          s += oy === y ? '<path class="jx-chiziq" d="M' + (ox + w + 1) + " " + (y + h / 2) + "H" + (x - 1) + '" marker-end="url(#jx-uch-' + tur + ')"/>'
            : '<path class="jx-chiziq" d="M' + (ox + w / 2) + " " + (oy + h + 1) + "V" + (y + h / 2) + "H" + (x - 1) + '" marker-end="url(#jx-uch-' + tur + ')"/>';
        }
        oldin = [x, y];
      });
      return s + "</svg>";
    }
    const w = Math.max(280, en - 4), h = 88, g = 16;
    let s = '<svg viewBox="0 0 ' + w + " " + (TOPSHIRISH.length * (h + g) - g + 4) + '" role="group" aria-label="' + svgMatn("Undiruvdan balansga qabul") + '">' + uch;
    TOPSHIRISH.forEach((b, i) => {
      const y = 2 + i * (h + g);
      s += qutiH(2, y, w - 4, h, i + 1, b[1], YOLAKLAR[b[2]], b[0]);
      if (i < TOPSHIRISH.length - 1) s += '<path class="jx-chiziq" d="M36 ' + (y + h + 1) + "V" + (y + h + g - 1) + '" marker-end="url(#jx-uch-' + tur + ')"/>';

  /* ---------- Qidiruv ---------- */
  const norm = s => String(s || "").toLowerCase().replace(/[’ʼʻ`´‘]/g, "'").replace(/ё/g, "е");
  /* Solishtirish uchun apostrofsiz ko'rinish: klaviaturada ' belgisi yo'q xodim «korik», «sugurta»
     deb yozsa ham topilsin. Ta'kidlash norm() da qoladi, shunda mark indekslari siljimaydi. */
  const norm2 = s => norm(s).replace(/'/g, "");
  let INDEKS = null;
  function indeksQur(){
    const t = [];
    Object.keys(Y).forEach(f => { const m = Y[f]; t.push({tur: "Sahifa", nom: m.sarlavha, havola: "#" + f,
      matnlar: [m.sarlavha, m.nimaUchun].concat((m.bloklar || []).flatMap(b => [b.nom, b.izoh]), (m.amallar || []).flatMap(b => [b.nom, b.izoh]), m.xatolar || [], m.qoidalar || [])}); });

      matnlar: [q.nom, ROL_KIRISH[k].men, q.maqsad].concat(q.qadamlar.flatMap(x => [x.nom, x.izoh]), q.kunlik || [], q.haftalik || [], q.oylik || [], q.mumkin || [], q.mumkinEmas || [], q.javobgarlik || [], q.meyor || [])}); });
    VAZIFALAR.forEach(v => t.push({tur: "Vazifa", nom: v.nom, havola: "#vazifa-" + v.id, matnlar: [v.nom, v.izoh].concat(v.qadamlar)}));
    ATAMALAR.forEach(a => t.push({tur: "Atama", nom: a.nom, havola: "#atama-" + a.id, matnlar: [a.nom, a.izoh]}));
    SAVOLLAR.forEach(s => t.push({tur: "Savol", nom: s.savol, havola: "#savol-" + s.id, matnlar: [s.savol, s.javob]}));
    /* Jarayon xaritalari ham qidiriladi: «hayot yo'li» yozgan xodim bo'sh natija ko'rmasin */
    t.push({tur: "Jarayon", nom: X("Aktivning hayot yo'li", "Жизненный цикл актива"), havola: "#jarayonlar",
      matnlar: [X("Aktivning hayot yo'li", "Жизненный цикл актива"), X("Jarayon xaritasi: aktiv balansga qabuldan balansdan chiqarilgunga qadar qaysi bosqichlardan o'tadi va har bosqich kimda turadi.",
        "Карта процесса: через какие этапы проходит актив от приёма на баланс до списания и кто отвечает за каждый этап.")].concat(HAYOT.flatMap(b => [b[1], b[2]]))});
    t.push({tur: "Jarayon", nom: X("Undiruvdan balansga qabul", "Из взыскания на приём на баланс"), havola: "#jarayonlar",
      matnlar: [X("Undiruvdan balansga qabul", "Из взыскания на приём на баланс"), X("Jarayon xaritasi: garov ogohlantirishdan sud va ijro orqali balansga o'tish yo'li — obyekt menejeri va Rahbariyat.",
        "Карта процесса: путь залога от предупреждения через суд и исполнение до баланса — менеджер по объектам и Руководство.")].concat(TOPSHIRISH.flatMap(b => [b[1], YOLAKLAR[b[2]]]))});
    return t;
  }
  function qidir(q){
    const sozlar = norm2(q).split(/\s+/).filter(s => s.length > 1 || /\d/.test(s));
    if (!sozlar.length) return [];
    INDEKS = INDEKS || indeksQur();
    const nat = [];
    const boshqa = s => (!ru() && s && L[s] != null ? L[s] : s);
    INDEKS.forEach(x => {
      const matnlar = x.matnlar.map(tr);
      /* ikkala tilda qidiriladi: o'zbekcha interfeysda ruscha so'z bilan ham topiladi */
      const hammasi = norm2(matnlar.join(" \n ") + " \n " + (ru() ? x.matnlar.join(" \n ") : x.matnlar.map(boshqa).join(" \n ")));
      if (!sozlar.every(s => hammasi.includes(s))) return;
      const nom = norm2(tr(x.nom));
      let ball = sozlar.reduce((b, s) => b + (nom.includes(s) ? 10 : 0) + (nom.startsWith(s) ? 5 : 0), 0);
      ball += {Vazifa: 3, Jarayon: 3, Sahifa: 2, Rol: 2, Atama: 2, Savol: 1}[x.tur] || 0;
      const parcha = matnlar.slice(1).find(m => sozlar.some(s => norm2(m).includes(s))) || matnlar[1] || "";
      nat.push({x, ball, parcha});
    });
    return nat.sort((a, b) => b.ball - a.ball).slice(0, 40);
  }
  /* Apostrofsiz so'z matndagi apostrofli shakliga ham mos kelsin: «korik» → «ko'rik».
     norm() belgilarni birma-bir almashtiradi, shuning uchun indekslar asl matn bilan bir xil turadi. */
  const izRe = s => new RegExp(s.split("").map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("'?"), "g");
  function moslar(n, sozlar){
    const o = [];
    sozlar.forEach(s => { const re = izRe(s); let m; while ((m = re.exec(n))){ if (!m[0]){ re.lastIndex++; continue; } o.push([m.index, m.index + m[0].length]); } });
    return o.sort((a, b) => a[0] - b[0]);
  }
  /* Matnni DOM tugunlariga bo'lib, mos qismlarni <mark> bilan ajratish */
  function belgila(el, matn, sozlar){
    const n = norm(matn);
    if (n.length !== matn.length){ el.appendChild(document.createTextNode(matn)); return; }
    const oraliq = moslar(n, sozlar);
    let joy = 0;
    oraliq.forEach(([a, b]) => {
      if (a < joy) return;
      if (a > joy) el.appendChild(document.createTextNode(matn.slice(joy, a)));
      const m = document.createElement("mark"); m.textContent = matn.slice(a, b); el.appendChild(m); joy = b;
    });
    if (joy < matn.length) el.appendChild(document.createTextNode(matn.slice(joy)));
  }
  const kesma = (matn, sozlar) => {
    if (matn.length < 180) return matn;
    const n = norm(matn);
    const o = n.length === matn.length ? moslar(n, sozlar) : [];
    const i = o.length ? o[0][0] : 0;
    const bosh = Math.max(0, i - 60);
    return (bosh ? "…" : "") + matn.slice(bosh, bosh + 180) + (bosh + 180 < matn.length ? "…" : "");
  };
  function natijalarChiz(q){
    const sozlar = norm2(q).split(/\s+/).filter(s => s.length > 1 || /\d/.test(s));
    const nat = qidir(q);
    kontent.innerHTML = '<section class="karta"><div class="karta-bosh"><h2 data-ikonka="izlash">Qidiruv natijalari</h2><span class="chip chip-kichik chip-kul" data-tarjimasiz>' + nat.length + "</span></div>" +
      (nat.length ? '<div class="ym-natija" data-tarjimasiz></div>' : MKB.boshHolat("izlash", "Hech narsa topilmadi", "Boshqa so'z bilan qidiring yoki bo'limlarni ko'rib chiqing.")) + "</section>";
    const joy = kontent.querySelector(".ym-natija");
    if (joy) nat.forEach(({x, parcha}) => {
      const a = document.createElement("a"); a.href = x.havola;
      const t = document.createElement("span"); t.className = "ym-tur"; t.textContent = tr(x.tur); a.appendChild(t);
      const b = document.createElement("b"); belgila(b, tr(x.nom), sozlar); a.appendChild(b);
      if (parcha && parcha !== x.nom){ const p = document.createElement("p"); belgila(p, kesma(tr(parcha), sozlar), sozlar); a.appendChild(p); }
      joy.appendChild(a);
    });
    tarjimaQil(kontent);
  }

  /* ---------- Marshrutlash ---------- */
  function yol(){
    let h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const p = new URLSearchParams(location.search);
    if (!h && p.get("rol") && Q[p.get("rol")]) h = "rol-" + p.get("rol");
    return h;
  }
  function chiz(){
    const q = $("ym-q").value.trim();
    $("ym-tozala").hidden = !q;
    if (q){ menyuChiz(null); natijalarChiz(q); $("hs-meta").textContent = "Qidiruv"; tarjimaQil(document.querySelector(".hujjat-shapka")); return; }
    const h = yol();
    let html = "", faol = null, meta = "";
    if (!h){ faol = ""; html = boshSahifa(); }
    else if (h === "rollar"){ faol = "rollar"; html = rollarSahifa(); meta = "Rollar"; }
    else if (h.indexOf("rol-") === 0 && Q[h.slice(4)]){ faol = "rollar"; html = rolSahifa(h.slice(4)); meta = rolNomi(h.slice(4)); }
    else if (h === "sahifalar"){ faol = "sahifalar"; html = sahifalarSahifa(); meta = "Sahifalar"; }
    else if (/\.html$/.test(h)){ faol = "sahifalar"; html = maqolaHTML(h) || MKB.boshHolat("hujjat", "Maqola topilmadi"); meta = sahifaNomi(h); }
    else if (h.indexOf("vazifa-") === 0){ const v = VAZIFALAR.find(x => x.id === h.slice(7)); faol = ""; html = v ? vazifaHTML(v) : MKB.boshHolat("hujjat", "Maqola topilmadi"); meta = v ? v.nom : ""; }
    else if (h === "jarayonlar"){ faol = "jarayonlar"; html = jarayonlarSahifa(); meta = "Jarayonlar"; }
    else if (h === "atamalar" || h.indexOf("atama-") === 0 || h.indexOf("harf-") === 0){ faol = "atamalar"; html = atamalarSahifa(); meta = "Atamalar"; }
    else if (h === "savollar" || h.indexOf("savol-") === 0){ faol = "savollar"; html = savollarSahifa(); meta = "Savollar"; }
    else if (h === "klaviatura"){ faol = "klaviatura"; html = klaviaturaSahifa(); meta = "Klaviatura"; }
    else if (h === "yangi"){ faol = "yangi"; html = yangiSahifa(); meta = "Nima yangi"; }
    else if (h === "toliq"){ faol = null; html = toliqSahifa(); meta = "To'liq qo'llanma"; }
    else if (h.indexOf("t-") === 0 || h.indexOf("bolim-") === 0){ return; }
    else { faol = ""; html = boshSahifa(); }
    menyuChiz(faol);
    kontent.innerHTML = html;
    $("hs-meta").textContent = meta || "—";
    xaritalarniChiz(kontent);
    tarjimaQil(document.querySelector(".kontent"));
    /* Nishonga o'tish: atama, savol, harf */
    const nishon = h.indexOf("atama-") === 0 ? document.getElementById(h)
      : h.indexOf("savol-") === 0 ? document.getElementById(h)
      : h.indexOf("harf-") === 0 ? kontent.querySelector('[data-harf="' + CSS.escape(h.slice(5)) + '"]') : null;
    if (nishon){
      if (nishon.tagName === "DETAILS") nishon.open = true;
      nishon.scrollIntoView({block: "center"});
      const f = nishon.querySelector("summary, dt") || nishon; f.setAttribute("tabindex", "-1"); f.focus({preventScroll: true});
    } else if (h) window.scrollTo(0, 0);
  }

  /* ---------- Hodisalar ---------- */
  let qT = 0;
  $("ym-q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(chiz, 90); });
  $("ym-q").addEventListener("keydown", e => {
    if (e.key === "Escape" && $("ym-q").value){ e.stopPropagation(); $("ym-q").value = ""; chiz(); }
    if (e.key === "Enter"){ const a = kontent.querySelector(".ym-natija a"); if (a){ e.preventDefault(); a.click(); } }
  });
  $("ym-tozala").addEventListener("click", () => { $("ym-q").value = ""; chiz(); $("ym-q").focus(); });
  kontent.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]');
    if (a && $("ym-q").value){ $("ym-q").value = ""; $("ym-tozala").hidden = true; }
    const c = e.target.closest("[data-ym-chop]");
    if (c){ window.print(); return; }
    const b = e.target.closest("[data-ym-sayohat]");
    if (!b || !MKB.sayohat) return;
    e.preventDefault();
    const id = b.dataset.ymSayohat;
    let qadam = 0;
    const s = b.dataset.ymQadam || "";
    if (s.indexOf("sahifa:") === 0){
      /* sahifadagi birinchi qadamdan: dvigatel rol uchun qadamlarni o'zi saralaydi, biz shu ro'yxatdagi indeksni topamiz */
      const f = s.slice(7);
      const T = TUR[id];
      const ruxsatli = (T && T.qadamlar || []).filter(q => !q.sahifa || sahifaRuxsatlimi(String(q.sahifa).split("?")[0]));
      const i = ruxsatli.findIndex(q => String(q.sahifa).split("?")[0] === f);
      /* Shu sahifadagi yagona qadam oxirgisi bo'lsa boshidan ochiladi: yolg'iz yakuniy karta ko'rsatilmaydi */
      qadam = i > 0 && i + 1 < ruxsatli.length ? i : 0;
    }
    MKB.sayohat.boshla(id, {qadam});
  });
  window.addEventListener("hashchange", () => { $("ym-q").value = ""; chiz(); });
  document.addEventListener("mkb:til", () => { INDEKS = null; chiz(); });
  let enT = 0, oldEn = window.innerWidth;
  window.addEventListener("resize", () => { clearTimeout(enT); enT = setTimeout(() => {
    if ((oldEn < 720) !== (window.innerWidth < 720) || Math.abs(oldEn - window.innerWidth) > 80){ oldEn = window.innerWidth; xaritalarniChiz(kontent); tarjimaQil(kontent); }
  }, 150); });

  chiz();
})();
</script>
</body>
</html>
