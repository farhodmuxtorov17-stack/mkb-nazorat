<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Realizatsiya paneli</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="panel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Boshqaruv paneli</span></div>
    <div class="hs-qator"><h1>Realizatsiya paneli</h1><span class="hs-meta" id="hs-meta">Auksion, ijara va tushum</span><div class="hs-amallar"><a class="tugma tugma-oq" href="hisobotlar.html"><svg class="ic"><use href="#i-hisobot"/></svg>Hisobotlar</a><a class="tugma tugma-asosiy" href="obyektlar.html"><svg class="ic"><use href="#i-aktivlar"/></svg>Obyektlar reyestri</a></div></div>
  </div>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Savdodagi lotlar</span>
      <span class="m-qiymat"><span id="s-lot">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Takliflar</span>
      <span class="m-qiymat"><span id="s-taklif">—</span></span>
      <span class="m-izoh">Barcha lotlar bo'yicha</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Ijaradagi obyektlar</span>
      <span class="m-qiymat"><span id="s-ijara">—</span></span>
    </div>
    <div class="metrika"><span class="m-yorliq">Sotilgan (2026)</span>
      <span class="m-qiymat"><span id="s-sotildi">—</span></span>
    </div>
  </section>
  <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="panel-tor">
    <section class="karta"><div class="karta-bosh"><h2>Faol lotlar</h2><a class="karta-havola" href="savdo.html">Barchasi<svg class="ic"><use href="#i-ong"/></svg></a></div><div id="s-lotlar"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>Bosqichlar</h2></div><div id="s-bosqich"></div></section>
  </div>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>

function ustunlarChiz(joy, yorliqlar, qiymatlar, brendIdx){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:10px;height:150px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + v + '</span>' +
        '<div style="width:100%;max-width:34px;height:' + Math.round(v / maks * 104) + 'px;border-radius:14px 14px 4px 4px;background:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? 'var(--brend)' : 'var(--siyoh)') + ';opacity:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? '1' : '.82') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span>' +
      '</div>').join("") + '</div>';
}
function obyektQatori(y){
  return '<a class="qator" href="obyekt.html?id=' + encodeURIComponent(y.id) + '">' +
    '<img class="media" src="' + (y.mulk.rasmKichik || y.mulk.rasm) + '" alt="" loading="lazy">' +
    '<span class="matn"><b>' + y.mulk.qisqa + '</b>' +
    '<span>' + y.id + ' · ' + y.bosqichNomi + '</span></span>' +
    '<span class="ong"><span class="pul">' + y.qarzMatn + '</span>' +
    MKB.shtrix(y.qoplash, 12) + '</span></a>';
}
function muddatQatori(m){
  return '<a class="qator" href="' + m.href + '">' +
    '<span class="belgi ' + (m.xavfli ? "pushti" : "") + '">' + ik(m.ikonka) + '</span>' +
    '<span class="matn"><b>' + m.nom + '</b><span>' + m.izoh + '</span></span>' +
    '<span class="vaqt"' + (m.xavfli ? ' style="color:var(--pushti-matn)"' : '') + '>' + m.vaqt + '</span></a>';
}

document.addEventListener("mkb:tayyor", async () => {
  const lot = await MKBapi.royxat("SOTUV");
  const tak = await MKBapi.royxat("TAKLIFLAR");
  const ij = await MKBapi.royxat("IJARA");
  const arx = await MKBapi.royxat("ARXIV");
  document.getElementById("s-lot").textContent = lot.length;
  document.getElementById("s-taklif").textContent = tak.length;
  document.getElementById("s-ijara").textContent = ij.length;
  document.getElementById("s-sotildi").textContent = arx.filter(a => a.yil === "2026").length;
  document.getElementById("s-lotlar").innerHTML = lot.slice(0, 6).map(l =>
    '<a class="qator" href="lot.html?id=' + encodeURIComponent(l.id) + '">' +
      '<img class="media" src="' + l.rasm + '" alt="" loading="lazy">' +
      '<span class="matn"><b>' + l.nom + '</b><span>' + l.id + ' · ' + l.tur + '</span></span>' +
      '<span class="ong"><span class="pul">' + MKB.fmt(l.baho) + " mln</span>" +
      '<span class="chip">' + tak.filter(t => t.obyektId === l.id).length + " taklif</span></span></a>").join("");
  MKB.barlar("s-bosqich", MKB_DATA.AUKSION_BOSQICH.map(([k, n, rang]) =>
    [n, lot.filter(l => l.bosqich === k).length, rang]));
});
</script>
</body>
</html>
