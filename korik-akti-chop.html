<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Dalolatnoma (chop)</title>
<link rel="stylesheet" href="yadro/app.css?v=26082620">
</head>
<body data-sahifa="korik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="korik-rejasi.html">Ko'rik nazorati</a><span class="ajratgich">/</span><span>Dalolatnoma</span><span class="ajratgich">/</span><span>Chop</span></div>
    <div class="hs-qator"><h1>Dalolatnoma (chop)</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><button type="button" class="tugma tugma-asosiy" onclick="window.print()"><svg class="ic"><use href="#i-chop"/></svg>Chop etish</button></div></div>
  </div>
  <section class="karta" id="akt-chop">
    <div style="display:flex;align-items:flex-start;gap:16px;border-bottom:2px solid var(--siyoh);padding-bottom:14px;margin-bottom:16px">
      <div style="flex:1"><b style="font:700 16px var(--shrift-displey)">«Mikrokreditbank» ATB</b>
        <div style="font-size:11.5px;color:var(--iz)">Aktivlar nazorati bo'limi</div></div>
      <div style="text-align:right;font-size:11.5px;color:var(--iz)">Shakl KN-02<br><span id="kc-id" class="kod-mono"></span></div>
    </div>
    <h2 style="font:700 19px var(--shrift-displey);text-align:center;margin-bottom:16px">KO'RIK DALOLATNOMASI</h2>
    <div id="kc-dl"></div>
    <div style="margin-top:14px"><b style="font-size:13px">Xulosa:</b><p id="kc-xulosa" style="font-size:12.5px;line-height:1.7;margin-top:6px">—</p></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:36px;font-size:12.5px">
      <div>Inspektor: <span id="kc-inspektor"></span> ____________<div style="color:var(--iz);font-size:11px;margin-top:4px">imzo</div></div>
      <div>Filial vakili: ______________________<div style="color:var(--iz);font-size:11px;margin-top:4px">imzo</div></div>
    </div>
  </section>
</main>
</div>
</div>
<script src="malumot.js?v=26082620"></script>
<script src="malumot-qoshimcha.js?v=26082620"></script>
<script src="tarjima.js?v=26082620"></script>
<script src="yadro/ikonlar.js?v=26082620"></script>
<script src="yadro/daraxt.js?v=26082620"></script>
<script src="yadro/chizma.js?v=26082620"></script>
<script src="yadro/api.js?v=26082620"></script>
<script src="yadro/app.js?v=26082620"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const id = new URLSearchParams(location.search).get("id");
  const k = id ? await MKBapi.bitta("KORIKLAR", id) : null;
  if (!k){ location.replace("xato-404.html"); return; }
  const y = MKB_DATA.OBYEKT_INDEKS[k.obyektId] || {};
  document.getElementById("hs-meta").textContent = k.id;
  document.getElementById("kc-id").textContent = k.id;
  const q = (a, b) =>
    '<dt style="color:var(--iz);padding:7px 16px 7px 0;border-bottom:1px solid var(--chiziq-2)">' + a +
    '</dt><dd style="font-weight:500;text-align:right;padding:7px 0;border-bottom:1px solid var(--chiziq-2)">' + b + '</dd>';
  document.getElementById("kc-dl").innerHTML = '<dl class="malumot-royxat" style="font-size:12.5px">' +
    q("Obyekt", (y.qisqa || "") + ' <span class="kod-mono">' + k.obyektId + "</span>") +
    q("Manzil", y.manzil || "—") + q("Ko'rik turi", k.tur || "Rejali") +
    q("Sana", k.otkazilganSana || k.sana) + q("Inspektor", k.inspektor) +
    q("Umumiy baho", k.baho || "—") + "</dl>";
  document.getElementById("kc-xulosa").textContent = k.izoh || "—";
  document.getElementById("kc-inspektor").textContent = k.inspektor;
});
</script>
</body>
</html>
