<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="yadro/app.css?v=26082745">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="panel">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Boshqaruv paneli</span></div>
    <div class="hs-qator"><h1>Umumiy ko'rsatkichlar</h1><span class="hs-meta" id="hs-meta">Moliyaviy natijalar va dinamika</span></div>
  </div>
  <section class="metrika-qator" aria-label="Asosiy ko'rsatkichlar">
    <div class="metrika"><span class="m-yorliq">Undirilgan mablag'</span>
      <span class="m-qiymat"><span id="u-1">—</span><span class="delta" id="u-1d"></span></span>
      <span class="m-izoh">Yil boshidan</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Auksion tushumi</span>
      <span class="m-qiymat"><span id="u-2">—</span><span class="delta" id="u-2d"></span></span>
      <span class="m-izoh">Yakunlangan savdolar</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Ijara daromadi</span>
      <span class="m-qiymat"><span id="u-3">—</span><span class="delta" id="u-3d"></span></span>
      <span class="m-izoh">Joriy yil</span>
    </div>
    <div class="metrika"><span class="m-yorliq">Saqlash xarajatlari</span>
      <span class="m-qiymat"><span id="u-4">—</span><span class="delta" id="u-4d"></span></span>
      <span class="m-izoh">Balansdagi obyektlar</span>
    </div>
  </section>
  <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="panel-tor">
    <section class="karta"><div class="karta-bosh"><h2>Undiruv dinamikasi, mlrd so'm</h2></div><div id="u-grafik"></div></section>
    <section class="karta"><div class="karta-bosh"><h2>Hududlar kesimi</h2><a class="karta-havola" href="xarita.html">Barchasi<svg class="ic"><use href="#i-ong"/></svg></a></div><div id="u-hudud"></div></section>
  </div>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082745"></script>
<script src="malumot.js?v=26082745"></script>

<script src="malumot-kirish.js?v=26082745"></script>
<script src="malumot-indeks.js?v=26082745"></script>
<script src="tarjima.js?v=26082745"></script>

<script src="yadro/api.js?v=26082745"></script>
<script src="yadro/app.js?v=26082745"></script>
<script>

function ustunlarChiz(joy, yorliqlar, qiymatlar, brendIdx){
  const maks = Math.max(...qiymatlar);
  document.getElementById(joy).innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:10px;height:150px">' +
    qiymatlar.map((v, i) =>
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">' +
        '<span style="font:500 12.5px var(--shrift-mono);color:var(--qalam)">' + v + '</span>' +
        '<div style="width:100%;max-width:34px;height:' + Math.round(v / maks * 104) + 'px;border-radius:14px 14px 4px 4px;background:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? 'var(--brend)' : 'var(--siyoh)') + ';opacity:' +
          (i === (brendIdx == null ? qiymatlar.length - 1 : brendIdx) ? '1' : '.82') + '"></div>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + yorliqlar[i] + '</span>' +
      '</div>').join("") + '</div>';
}
function obyektQatori(y){
  return '<a class="qator" href="obyekt.html?id=' + encodeURIComponent(y.id) + '">' +
    '<img class="media" src="' + (y.mulk.rasmKichik || y.mulk.rasm) + '" alt="" loading="lazy">' +
    '<span class="matn"><b>' + y.mulk.qisqa + '</b>' +
    '<span>' + y.id + ' · ' + y.bosqichNomi + '</span></span>' +
    '<span class="ong"><span class="pul">' + y.qarzMatn + '</span>' +
    MKB.shtrix(MKB_DATA.nazoratIndeksi(y).ball, 12) + '</span></a>';
}
function muddatQatori(m){
  return '<a class="qator" href="' + m.href + '">' +
    '<span class="belgi ' + (m.xavfli ? "pushti" : "") + '">' + ik(m.ikonka) + '</span>' +
    '<span class="matn"><b>' + m.nom + '</b><span>' + m.izoh + '</span></span>' +
    '<span class="vaqt"' + (m.xavfli ? ' style="color:var(--pushti-matn)"' : '') + '>' + m.vaqt + '</span></a>';
}

document.addEventListener("mkb:tayyor", () => {
  const D = MKB_DATA;
  const K = D.KPI_BAZA || [];
  [["u-1", 0], ["u-2", 1], ["u-3", 3], ["u-4", 2]].forEach(([id, i], k) => {
    const b = K[i] || K[k] || {qiymat: "—", birlik: "", delta: 0};
    document.getElementById(id).innerHTML =
      String(b.qiymat).replace(".", ",") + "<small>" + b.birlik + "</small>";
    const d = document.getElementById(id + "d");
    d.className = "delta " + (b.manfiy ? "salbiy" : "ijobiy");
    d.textContent = (b.manfiy ? "↓ " : "↑ ") + String(Math.abs(b.delta)).replace(".", ",") + "%";
  });
  const s = D.UNDIRUV_SERIYA.oylik;
  MKBchizma.maydon("u-grafik", {yorliqlar: s.yorliq, qiymatlar: s.qiymat,
    balandlik: 200, rang: "--brend", oqFormat: v => v.toFixed(0),
    tooltipFormat: v => String(v).replace(".", ",") + " mlrd so'm"});
  MKB.barlar("u-hudud", D.HUDUDLAR.slice(0, 8).map(h => [h[0], MKB.sonQiymat(h[1])]),
    {href: "xarita.html"});
});
</script>
</body>
</html>
