<script>
document.addEventListener("mkb:tayyor", () => {
  const BOLIMLAR2 = [
    ["Undiruv bosqichlari", MKB_DATA.BOSQICHLAR.map(b => [b.nom, "kalit: " + b.kalit])],
    ["Kirish nuqtasi turlari", [["Turniket", "kalit: turniket"], ["Elektron qulfli eshik", "kalit: eshik"],
      ["Shlagbaum", "kalit: shlagbaum"], ["Yuk darvozasi", "kalit: darvoza"]]],
    ["Xona holatlari", MKBbino.HOLATLAR.map(h => [h.nom, "kalit: " + h.kalit])],
    ["Nazorat indeksi tarkibi", MKB_DATA.NAZORAT_OGIRLIK.map(o => [o.nom, o.ogirlik + "%"])],
    ["Sudlar", ["Toshkent shahar sudi", "Toshkent viloyat sudi", "Samarqand sudi", "Namangan sudi", "Buxoro sudi"].map(s => [s, "fuqarolik ishlari"])],
    ["Baholovchi tashkilotlar", ["«Baholash Servis» MChJ", "«Expert Baho» MChJ", "«Milliy Baholash Markazi» DUK"].map(s => [s, "akkreditatsiyalangan"])],
  ];
  document.getElementById("hs-meta").textContent = BOLIMLAR2.length + " ta ma'lumotnoma";
  document.getElementById("mn-royxat").innerHTML = BOLIMLAR2.map(([nom, bandlar]) =>
    '<section class="karta"><div class="karta-bosh"><h2>' + nom + '</h2>' +
    '<span class="soni">' + bandlar.length + ' ta yozuv</span></div>' +
    bandlar.map(([b, izoh]) =>
      '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--chiziq-2);font-size:13px">' +
      '<b>' + b + '</b><span style="color:var(--iz);font-size:12px">' + izoh + '</span></div>').join("") +
    '</section>').join("");
});
</script>
