<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Undiruv doskasi</title>
<link rel="stylesheet" href="yadro/app.css?v=26082621">
<style>
.doska{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:14px;overflow-x:auto;padding-bottom:8px}
.doska-ustun{background:var(--varaq-2);border:1px solid var(--chiziq-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.doska-bosh{display:flex;align-items:center;gap:8px;padding:4px 6px}
.doska-bosh b{font-size:12.5px}
.doska-bosh .soni{margin-left:auto;font:700 11px var(--shrift-mono);background:var(--varaq);border:1px solid var(--chiziq-2);border-radius:99px;padding:2px 8px;color:var(--qalam)}
.ish-karta{background:var(--varaq);border:1px solid var(--chiziq-2);border-radius:16px;padding:12px;display:block;transition:transform var(--tez),box-shadow var(--tez)}
.ish-karta:hover{transform:translateY(-2px);box-shadow:0 6px 18px -8px rgba(25,26,20,.18)}
.ish-karta .ik{font:500 10.5px var(--shrift-mono);color:var(--iz)}
.ish-karta b{display:block;font-size:12.5px;margin:3px 0 6px;line-height:1.35}
.ish-karta .past{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--matn-3)}
</style>
</head>
<body data-sahifa="yuridik">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Undiruv va sud</span></div>
    <div class="hs-qator"><h1>Undiruv doskasi</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><a class="tugma tugma-oq" href="sud-kalendar.html"><svg class="ic"><use href="#i-kalendar"/></svg>Sud kalendari</a><a class="tugma tugma-asosiy" href="davo-tayyorlash.html"><svg class="ic"><use href="#i-sud"/></svg>Da'vo tayyorlash</a></div></div>
  </div>
  <div class="doska" id="doska"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26082621"></script>
<script src="malumot-qoshimcha.js?v=26082621"></script>
<script src="tarjima.js?v=26082621"></script>
<script src="yadro/ikonlar.js?v=26082621"></script>
<script src="yadro/daraxt.js?v=26082621"></script>
<script src="yadro/chizma.js?v=26082621"></script>
<script src="yadro/api.js?v=26082621"></script>
<script src="yadro/app.js?v=26082621"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  const yoz = await MKBapi.royxat("YOZUVLAR");
  document.getElementById("hs-meta").textContent = yoz.length + " ta ish yuritilmoqda";
  document.getElementById("doska").innerHTML = MKB_DATA.BOSQICHLAR.map(b => {
    const r = yoz.filter(y => y.ish.bosqich === b.kalit);
    return '<div class="doska-ustun"><div class="doska-bosh">' +
      '<span style="width:8px;height:8px;border-radius:99px;background:' + b.rang + '"></span>' +
      '<b>' + b.nom + '</b><span class="soni">' + r.length + '</span></div>' +
      (r.length ? r.map(y =>
        '<a class="ish-karta" href="ish.html?id=' + encodeURIComponent(y.id) + '">' +
          '<span class="ik">' + y.ish.raqam + '</span><b>' + y.mijoz.nom + '</b>' +
          '<span style="font-size:12.5px;color:var(--matn-3);display:block;margin-bottom:8px">' + y.mulk.qisqa + '</span>' +
          '<div class="past"><span class="pul" style="color:var(--qalam)">' + y.qarzMatn + '</span>' +
          (y.ish.shoshilinch ? '<span class="chip chip-xavf">shoshilinch</span>' : '<span>' + y.qarz.kunlar + ' kun</span>') +
          '</div></a>').join("")
      : '<div style="font-size:12.5px;color:var(--xira);text-align:center;padding:16px 0">Ish yo\'q</div>');
  }).map(x => x + "</div>").join("");
});
</script>
</body>
</html>
