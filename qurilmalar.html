<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Qurilmalar</title>
<link rel="stylesheet" href="yadro/app.css?v=26092200">
<style>
.metrika-qator button.metrika{text-align:left;font:inherit;cursor:pointer;transition:transform var(--tez),box-shadow var(--tez)}
.metrika-qator button.metrika:hover{transform:translateY(-2px);box-shadow:var(--soya-suzuvchi)}
.metrika-qator .metrika.tanlangan{box-shadow:0 0 0 2px var(--siyoh),var(--soya)}
.bat{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bat i{display:block;width:42px;height:8px;border-radius:99px;background:var(--band);overflow:hidden}
.bat i s{display:block;height:100%;background:var(--mint-matn);border-radius:99px}
.bat.past i s{background:var(--xavf)}
.bat.past b{color:var(--pushti-matn)}
.ob-tanlov select{max-width:260px}
.qr-model{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body data-sahifa="himoya">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="himoya.html">Nazorat va himoya</a><span class="ajratgich">/</span><span>Qurilmalar</span></div>
    <div class="hs-qator"><h1>Qurilmalar</h1><span class="hs-meta" id="hs-meta"></span><span class="hs-meta" id="qr-yangilandi" data-sayohat="yangilandi" data-tur="qurilmalar-yangilandi" hidden></span>
      <div class="hs-amallar"><a class="tugma tugma-asosiy" href="qurilma-ornatish.html" data-huquq="yoz" data-tur="qurilmalar-ornatish"><svg class="ic"><use href="#ik-qoshish"/></svg>Qurilma o'rnatish</a></div></div>
  </div>
  <nav class="bolim-tablar" data-bir-qator aria-label="Bo'lim ichi"><a href="himoya.html">Monitoring markazi</a><a href="qoriqlash.html">Qo'riqlash</a><a href="kommunal.html">Kommunal</a><a href="qurilmalar.html" class="faol" aria-current="page">Qurilmalar</a><a href="hodisalar.html">Hodisalar</a><a href="tashriflar.html">Tashriflar</a><a href="masofaviy-korik.html">Masofaviy ko'rik</a><a href="ruxsatlar.html">Ruxsatlar</a><a href="kirish-voqealari.html">Signallar</a></nav>
  <section class="metrika-qator tort" id="qr-metrika" aria-label="Qurilmalar holati" data-sayohat="holat" data-tur="qurilmalar-kpi"></section>
  <div id="qr-jadval" data-sayohat="jadval" data-tur="qurilmalar-jadval"></div>
</main>
</div>
</div>
<script src="malumot.js?v=26092200"></script>
<script src="malumot-qoshimcha.js?v=26092200"></script>
<script src="malumot-kengaytma.js?v=26092200"></script>
<script src="malumot-kirish.js?v=26092200"></script>
<script src="malumot-indeks.js?v=26092200"></script>
<script src="tarjima.js?v=26092200"></script>
<script src="yadro/ikonlar.js?v=26092200"></script>
<script src="yadro/daraxt.js?v=26092200"></script>
<script src="yadro/chizma.js?v=26092200"></script>
<script src="yadro/qollanma.js?v=26092200"></script>
<script src="yadro/api.js?v=26092200"></script>
<script src="yadro/app.js?v=26092200"></script>
<script src="yadro/amal.js?v=26092200"></script>
<script>
(() => {
  const D = MKB_DATA, esc = MKB.esc, $ = id => document.getElementById(id);
  let ulandi = false;
  MKB.sahifaYukla({
    joylar: {"qr-metrika": ["karta", 4], "qr-jadval": ["jadval", 8]},
    xato: "Qurilmalar ro'yxatini yuklab bo'lmadi",
    ish: async () => {
      if (ulandi){ location.reload(); return; }
      if (!window.MKB_TAYYOR) await new Promise(r => document.addEventListener("mkb:tayyor", r, {once: true}));
      if (!window.MKB_UX_TAYYOR) await new Promise(r => document.addEventListener("mkb:ux", r, {once: true}));
      await MKB.kn.yukla(["QURILMALAR"]);
      ulandi = true;
      boshla();
    },
  });

  function boshla(){
  const p = new URLSearchParams(location.search);
  const QUVVAT = {"quyosh+akkumulyator": "Quyosh va akkumulyator", "akkumulyator": "Akkumulyator", "tarmoq": "Elektr tarmog'i"};
  /* Aloqa holati faqat oxirgi signal vaqtidan hisoblanadi: "aloqada" = so'nggi soatda signal kelgan */
  const HOLAT = {"Aloqada": "chip-yashil", "1 soatdan ortiq jim": "chip-sariq", "24 soatdan ortiq jim": "chip-xavf", "Nosoz": "chip-xavf", "Xizmatda": "chip-info", "Signal yo'q": "chip-kul"};
  const holatNomi = q => {
    const h = D.qurilmaHolati(q) || {};
    if (q.holat === "nosoz") return "Nosoz";
    if (q.holat === "xizmatda") return "Xizmatda";
    if (h.holat === "aloqa yo'q") return "Signal yo'q";
    if (h.uzoqOflayn) return "24 soatdan ortiq jim";
    return h.holat === "onlayn" ? "Aloqada" : "1 soatdan ortiq jim";
  };
  let hamma = [], qatorlar = [];
  const hisobla = () => {
    hamma = MKB.doira(D.QURILMALAR || []);
    qatorlar = hamma.map(q => {
      const h = D.qurilmaHolati(q) || {};
      return {id: q.id, q, tur: q.turNomi || q.tur, model: [q.ishlabChiqaruvchi, q.model].filter(Boolean).join(" "),
        obyektId: q.obyektId, obyekt: MKB.kn.obyektNomi(q.obyektId), quvvat: QUVVAT[q.quvvat] || q.quvvat || "—",
        batareya: q.batareya == null ? -1 : q.batareya, aloqa: q.aloqa || "—", signal: q.oxirgiSignal || "", soat: h.oflaynSoat,
        holat: holatNomi(q), batPast: !!h.batareyaPast};
    });
  };
  hisobla();

  let filtr = p.get("filtr") || "";
  const FILTR = {
    "": ["Jami qurilmalar", () => true, "Barcha obyektlarda"],
    onlayn: ["Aloqadagi qurilmalar", x => x.holat === "Aloqada", "Oxirgi holat qaydi bo'yicha"],
    oflayn24: ["24 soatdan ortiq jim", x => x.holat === "24 soatdan ortiq jim" || x.holat === "Nosoz", "Nosozlari bilan birga"],
    batareya: ["Batareyasi 20% dan past", x => x.batPast, "Almashtirish kerak"],
  };
  const obSet = () => [...new Set(qatorlar.map(x => x.obyektId))].map(id => [id, MKB.kn.obyektYorligi(id)]).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  let obyekt = p.get("obyekt") || "";
  const tanlangan = () => qatorlar.filter(x => (!obyekt || x.obyektId === obyekt) && FILTR[filtr][1](x));

  function metrikaChiz(){
    const baza = qatorlar.filter(x => !obyekt || x.obyektId === obyekt);
    $("qr-metrika").innerHTML = Object.keys(FILTR).map(k => {
      const son = baza.filter(FILTR[k][1]).length;
      const xavf = (k === "oflayn24" || k === "batareya") && son > 0;
      return '<button type="button" class="metrika' + (k === filtr ? " tanlangan" : "") + '" data-f="' + k + '" aria-pressed="' + (k === filtr) + '">' +
        '<span class="m-yorliq">' + FILTR[k][0] + '</span><span class="m-qiymat' + (xavf ? " xavf" : "") + '"><span data-tarjimasiz>' + son + "</span>" +
        (k === "onlayn" ? "<small data-tarjimasiz>/ " + baza.length + "</small>" : "") + '</span><span class="m-izoh">' + FILTR[k][2] + "</span></button>";
    }).join("");
    tarjimaQil($("qr-metrika"));
  }
  $("qr-metrika").addEventListener("click", e => {
    const b = e.target.closest("[data-f]");
    if (!b) return;
    filtr = b.dataset.f === filtr ? "" : b.dataset.f;
    yangila();
  });

  const obTanlovHTML = () => '<label class="tanlov ob-tanlov" data-tur="qurilmalar-obyekt-filtr"><span class="t-old">Obyekt:</span><select data-obyekt aria-label="Obyekt bo&#39;yicha">' +
    '<option value="">Barchasi</option>' + obSet().map(([id, nom]) => '<option value="' + esc(id) + '"' + (id === obyekt ? " selected" : "") + ">" + esc(nom) + "</option>").join("") + "</select></label>";
  const cfg = {
    id: "qurilmalar",
    qatorlar: [], csvNomi: "qurilmalar",
    qidiruv: ["id", "tur", "model", "obyekt"], qidiruvYozuvi: "ID, model yoki obyekt",
    filtrlar: [
      {kalit: "holat", nom: "Holat", variantlar: Object.keys(HOLAT)},
      {kalit: "tur", nom: "Turi", variantlar: D.QURILMA_TURLARI.map(t => t.nom)},
      {kalit: "quvvat", nom: "Quvvat", variantlar: Object.values(QUVVAT)},
      {kalit: "aloqa", nom: "Aloqa", variantlar: D.ALOQA_KANALLARI || ["4G", "LoRaWAN", "NB-IoT"]},
    ],
    amallar: "",
    bosh: {sarlavha: "Qurilmalar hali kiritilmagan", izoh: "Kamera, datchik yoki GPS-treker o'rnatilgach shu yerda chiqadi"},
    ustunlar: [
      {kalit: "tur", nom: "Qurilma", chiz: x => "<b>" + esc(x.tur) + '</b><div class="kod-mono qr-model" data-tarjimasiz title="' + esc(x.model) + '">' + esc(x.id) + (x.model ? " · " + esc(x.model) : "") + "</div>", csv: x => x.tur},
      {kalit: "obyekt", nom: "Obyekt", chiz: x => '<a href="obyekt-himoya.html?id=' + encodeURIComponent(x.obyektId) + '">' + esc(x.obyekt) + "</a>"},
      {kalit: "batareya", nom: "Quvvat", son: true, chiz: x => (x.batareya < 0 ? "<span>Tarmoq</span>" :
        '<span class="bat' + (x.batPast ? " past" : "") + '"><i><s style="width:' + Math.max(3, x.batareya) + '%"></s></i><b data-tarjimasiz>' + x.batareya + "%</b></span>") +
        '<div class="kod-mono">' + esc(x.quvvat) + "</div>", csv: x => (x.batareya < 0 ? "" : x.batareya + "%, ") + x.quvvat},
      {kalit: "aloqa", nom: "Aloqa", csv: x => x.aloqa + (x.q.simRaqam ? " " + x.q.simRaqam : "")},
      {kalit: "signal", nom: "Oxirgi signal", tur: "sana", chiz: x => '<span data-tarjimasiz>' + esc(x.signal || "—") + "</span>" +
        (x.soat != null && x.soat >= 1 ? '<div class="kod-mono"><span data-tarjimasiz>' + (x.soat >= 48 ? Math.floor(x.soat / 24) : x.soat) + "</span> <span>" + (x.soat >= 48 ? "kun oldin" : "soat oldin") + "</span></div>" : "")},
      {kalit: "holat", nom: "Holat", chiz: x => '<span class="chip chip-kichik ' + HOLAT[x.holat] + '">' + x.holat + "</span>"},
    ],
    saralash: "signal", yonalish: 1,
    bosilganda: x => { location.href = "qurilma.html?id=" + encodeURIComponent(x.id); },
  };
  $("qr-jadval").addEventListener("change", e => {
    if (!e.target.matches("[data-obyekt]")) return;
    obyekt = e.target.value; yangila();
  });
  let jadval = null;
  function yangila(){
    cfg.amallar = obTanlovHTML();
    if (jadval) jadval.yangila(tanlangan()); else { cfg.qatorlar = tanlangan(); jadval = MKB.jadval("qr-jadval", cfg); }
    metrikaChiz();
    $("hs-meta").innerHTML = obyekt ? '<span>' + esc(MKB.kn.obyektNomi(obyekt)) + "</span>" :
      '<b data-tarjimasiz>' + hamma.length + "</b> <span>ta qurilma</span> · <b data-tarjimasiz>" + obSet().length + "</b> <span>ta obyektda</span>";
    tarjimaQil($("hs-meta"));
    const u = new URL(location.href);
    if (filtr) u.searchParams.set("filtr", filtr); else u.searchParams.delete("filtr");
    if (obyekt) u.searchParams.set("obyekt", obyekt); else u.searchParams.delete("obyekt");
    history.replaceState(null, "", u);
  }
  if (!FILTR[filtr]) filtr = "";
  if (!hamma.length){
    $("qr-metrika").hidden = true;
    $("qr-jadval").innerHTML = '<div class="karta">' + MKB.boshHolat("qurilma", "Qurilmalar hali kiritilmagan",
      "Kamera, datchik yoki GPS-treker o'rnatilgach holati, batareyasi va oxirgi signali shu yerda ko'rinadi",
      '<a class="tugma tugma-asosiy tugma-kichik" href="qurilma-ornatish.html" data-huquq="yoz">' + ik("qoshish") + "Birinchi qurilmani o'rnatish</a>") + "</div>";
    tarjimaQil($("qr-jadval"));
    $("hs-meta").textContent = "";
    return;
  }
  yangila();
  const belgi = MKB.yangilanganBelgi("qr-yangilandi", {avto: 60, yangila: async () => { await MKB.kn.yukla(["QURILMALAR"]); hisobla(); yangila(); }});
  belgi.belgila();
  }
})();
</script>
</body>
</html>
