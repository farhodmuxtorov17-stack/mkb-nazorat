<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Tasnif jadvali (chop)</title>
<link rel="stylesheet" href="yadro/app.css?v=26082645">
</head>
<body data-sahifa="zaxira">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><a href="tasniflash.html">Tasnif va zaxira</a><span class="ajratgich">/</span><span>Chop shakli</span></div>
    <div class="hs-qator"><h1>Tasnif jadvali (chop)</h1><span class="hs-meta" id="hs-meta">—</span><div class="hs-amallar"><button type="button" class="tugma tugma-asosiy" onclick="window.print()"><svg class="ic"><use href="#i-chop"/></svg>Chop etish</button></div></div>
  </div>
  <section class="karta"><div style="display:flex;align-items:flex-start;gap:16px;border-bottom:2px solid var(--siyoh);padding-bottom:14px;margin-bottom:16px"><div style="flex:1"><b style="font:500 16px var(--shrift-displey)">«Mikrokreditbank» ATB</b><div style="font-size:12.5px;color:var(--matn-3)">Tavakkalchilikni boshqarish departamenti</div></div><div style="text-align:right;font-size:12.5px;color:var(--matn-3)">Shakl TZ-03<br><span id="tc-sana"></span></div></div><h2 style="font:500 19px var(--shrift-displey);text-align:center;margin-bottom:16px">AKTIVLAR TASNIFI VA ZAXIRA JADVALI</h2><div id="tc-jadval"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px;font-size:12.5px"><div>Tavakkalchilik menejeri: ______________<div style="color:var(--matn-3);font-size:12.5px;margin-top:4px">imzo</div></div><div>Bosh buxgalter: ______________________<div style="color:var(--matn-3);font-size:12.5px;margin-top:4px">imzo</div></div></div></section>
</main>
</div>
</div>
<script src="malumot.js?v=26082645"></script>
<script src="malumot-qoshimcha.js?v=26082645"></script>
<script src="malumot-kengaytma.js?v=26082645"></script>
<script src="tarjima.js?v=26082645"></script>
<script src="yadro/ikonlar.js?v=26082645"></script>
<script src="yadro/daraxt.js?v=26082645"></script>
<script src="yadro/chizma.js?v=26082645"></script>
<script src="yadro/api.js?v=26082645"></script>
<script src="yadro/app.js?v=26082645"></script>
<script>
document.addEventListener("mkb:tayyor", () => {
  document.getElementById("tc-sana").textContent = new Date().toLocaleDateString("uz-UZ");
  const stat = MKB_DATA.tasnifStatistikasi();
  document.getElementById("tc-jadval").innerHTML =
    '<table class="jadval"><thead><tr><th>Toifa</th><th>Stavka</th><th style="text-align:right">Soni</th>' +
    '<th style="text-align:right">Qarz, mln</th><th style="text-align:right">Zaxira, mln</th></tr></thead><tbody>' +
    stat.map(s => '<tr><td><b>' + s.nom + '</b></td><td>' + s.foizStavka + '%</td>' +
      '<td class="son">' + s.son + '</td><td class="son pul">' + MKB.fmt(Math.round(s.qarz)) + '</td>' +
      '<td class="son pul">' + MKB.fmt(Math.round(s.zaxira)) + '</td></tr>').join("") +
    '<tr><td><b>JAMI</b></td><td></td><td class="son"><b>' + stat.reduce((a, s) => a + s.son, 0) + '</b></td>' +
    '<td class="son pul"><b>' + MKB.fmt(Math.round(stat.reduce((a, s) => a + s.qarz, 0))) + '</b></td>' +
    '<td class="son pul"><b>' + MKB.fmt(Math.round(stat.reduce((a, s) => a + s.zaxira, 0))) + '</b></td></tr>' +
    '</tbody></table>';
});
</script>
</body>
</html>
