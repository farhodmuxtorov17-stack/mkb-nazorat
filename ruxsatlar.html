</head>
<body data-sahifa="kn">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Kirish nazorati</span></div>
    <div class="hs-qator"><h1>Ruxsatlar reyestri</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="kirish-nazorati.html">Post</a><a href="kuzatuv.html">Nazorat markazi</a><a href="kirish-nuqtalari.html">Nuqtalar</a><a href="kirish-voqealari.html">Voqealar</a><a href="tashriflar.html">Tashriflar</a><a href="ruxsatlar.html" class="faol">Ruxsatlar</a><a href="qurilmalar.html">Qurilmalar</a><a href="hodisalar.html">Hodisalar</a></nav>

</main>

</div>
<script src="yadro/bino.js?v=26082780"></script>
<script src="malumot.js?v=26082780"></script>

<script src="malumot-indeks.js?v=26082780"></script>

<script src="yadro/daraxt.js?v=26082780"></script>
<script src="yadro/chizma.js?v=26082780"></script>
<script src="yadro/qollanma.js?v=26082780"></script>
<script src="yadro/api.js?v=26082780"></script>
<script src="yadro/app.js?v=26082780"></script>
<script>

const KN_NATIJA = {ruxsat: ["Ruxsat berildi", "chip-yashil"], rad: ["Rad etildi", "chip-xavf"],
                   ogohlantirish: ["Ogohlantirish", "chip-sariq"]};
const KN_HOLAT = {onlayn: ["Onlayn", "chip-yashil"], oflayn: ["Oflayn", "chip-xavf"],
                  xizmatda: ["Xizmatda", "chip-sariq"]};
const QR_HOLAT = {ishlayapti: ["Ishlayapti", "chip-yashil"], ogohlantirish: ["Ogohlantirish", "chip-sariq"],
                  nosoz: ["Nosoz", "chip-xavf"]};
function chip(xarita, kalit){
  const v = xarita[kalit] || [kalit, ""];
  return '<span class="chip ' + v[1] + '">' + v[0] + "</span>";
}
function nuqtaIkonka(t){
  return t === "turniket" ? "turniket" : t === "shlagbaum" ? "mashina" : t === "darvoza" ? "zavod" : "eshik";
}
function shaxsSurati(sh, olcham){
  const o = olcham || 38;
  return sh && sh.rasm
    ? '<img class="shaxs-surat" src="' + sh.rasm + '" alt="" loading="lazy" style="width:' + o +
      "px;height:" + o + 'px">'
    : '<span class="belgi">' + (sh ? sh.belgi : "?") + "</span>";
}
function shaxsQatori(sh, ong){
  if (!sh) return '<span class="matn"><b>Aniqlanmagan shaxs</b><span>Identifikatsiya o&#39;tmadi</span></span>';
  return shaxsSurati(sh) +
    '<span class="matn"><b>' + sh.ism + "</b><span><span>" + sh.lavozim + "</span> · <span>" + sh.tashkilot + "</span></span></span>" +
    (ong || "");
}
function obyektNomi(id){
  const o = MKB_DATA.OBYEKT_INDEKS[id];
  return o ? o.qisqa : id;
}
function voqeaQatori(v){
  const sh = MKB_DATA.shaxs(v.shaxsId);
  return '<a class="qator" href="kirish-voqea.html?id=' + encodeURIComponent(v.id) + '">' +
    '<span class="belgi ' + (v.natija === "rad" ? "pushti" : v.natija === "ogohlantirish" ? "lavanda" : "mint") + '">' +
      ik(v.natija === "ruxsat" ? "tasdiq" : v.natija === "rad" ? "rad" : "xavf") + "</span>" +
    '<span class="matn"><b>' + (sh ? sh.ism : "Aniqlanmagan shaxs") + "</b>" +
    "<span>" + obyektNomi(v.obyektId) + " · " + v.nuqtaNomi + " · " + v.usul + "</span></span>" +
    '<span class="ong"><span class="vaqt">' + v.soat + "</span>" + chip(KN_NATIJA, v.natija) + "</span></a>";
}

document.addEventListener("mkb:tayyor", () => {
  const D = MKB_DATA;
  const qatorlar = D.RUXSATLAR.map(r => {
    const sh = D.shaxs(r.shaxsId) || {};
    return {id: r.id, shaxs: sh.ism || "—", lavozim: sh.lavozim || "—", tur: sh.tur || "—",
      obyekt: obyektNomi(r.obyektId), daraja: r.daraja, usul: r.usul,
      boshlanish: r.boshlanish, tugash: r.tugash, holat: r.holat,
      nuqta: r.nuqtalar.length, bergan: r.bergan};
  });
  document.getElementById("hs-meta").textContent =
    qatorlar.filter(q => q.holat === "amalda").length + " ta amaldagi ruxsat";
  MKB.jadval("jadval-joy", {
    qatorlar,
    qidiruv: ["shaxs", "obyekt", "id"],
    qidiruvYozuvi: "Shaxs yoki obyekt...",
    filtrlar: [
      {kalit: "holat", nom: "Holat", variantlar: ["amalda", "muddati tugagan", "to&#39;xtatilgan"]},
      {kalit: "daraja", nom: "Daraja", variantlar: [...new Set(qatorlar.map(q => q.daraja))]},
    ],
    ustunlar: [
      {kalit: "shaxs", nom: "Shaxs", chiz: q =>
        '<span class="nom">' + q.shaxs + '</span><br><span class="sub">' + q.lavozim + "</span>"},
      {kalit: "obyekt", nom: "Obyekt"},
      {kalit: "nuqta", nom: "Nuqta", son: true},
      {kalit: "daraja", nom: "Daraja"},
      {kalit: "usul", nom: "Usul"},
      {kalit: "tugash", nom: "Amal muddati", chiz: q =>
        q.boshlanish + " — " + q.tugash},
      {kalit: "holat", nom: "Holat", chiz: q =>
        '<span class="chip ' + (q.holat === "amalda" ? "chip-yashil" : q.holat === "muddati tugagan" ? "chip-xavf" : "chip-sariq") +
        '">' + q.holat + "</span>"},
      {kalit: "amal", nom: "", saralash: false, chiz: q =>
        q.holat === "amalda"
          ? '<span class="amal-tugmalar"><button type="button" class="amal-tugma" ' +
            'title="Ruxsatni to&#39;xtatish" data-toxtat="' + q.id + '">' + ik("bloklash") + "</button></span>"
          : ""},
    ],
    saralash: "tugash",
  });

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-toxtat]");
    if (!t) return;
    const r = D.RUXSATLAR.find(x => x.id === t.dataset.toxtat);
    if (!r) return;
    MKB.modal("Ruxsatni to’xtatish",
      '<p style="font-size:14px;line-height:1.6;color:var(--matn-2)">' +
      D.shaxsNomi(r.shaxsId) + " uchun " + obyektNomi(r.obyektId) +
      " bo’yicha ruxsat bekor qilinadi. Amal jurnalga yoziladi.</p>",
      {okMatn: "To’xtatish", ok: () => {
        r.holat = "to’xtatilgan";
        MKB.toast("Ruxsat to’xtatildi");
        setTimeout(() => location.reload(), 600);
      }});
  });
});
</script>
</body>
</html>
