<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKB — Tasdiqlar</title>
<link rel="stylesheet" href="yadro/app.css?v=26082745">
<style>@media (max-width:1100px){.panel-tor{grid-template-columns:minmax(0,1fr)!important}}</style>
</head>
<body data-sahifa="vazifa">
<div class="qobiq">
<nav class="yon" id="yon" aria-label="Asosiy bo'limlar"></nav>
<div class="sahna">
<header class="shapka" id="shapka"></header>
<main class="kontent">
  <div class="hujjat-shapka">
    <div class="hs-yorliq"><span>Vazifalar</span></div>
    <div class="hs-qator"><h1>Tasdiqlar</h1><span class="hs-meta" id="hs-meta">—</span></div>
  </div>
  <nav class="bolim-tablar" aria-label="Bo'lim ichi"><a href="vazifalar.html">Vazifalar</a><a href="tasdiqlar.html" class="faol">Tasdiqlar</a><a href="bildirishnomalar.html">Bildirishnomalar</a><a href="taqvim.html">Taqvim</a><a href="eslatmalar.html">Eslatmalar</a></nav>
  <section class="karta"><div id="t-royxat"></div></section>
</main>
</div>
</div>
<script src="yadro/bino.js?v=26082745"></script>
<script src="malumot.js?v=26082745"></script>
<script src="malumot-qoshimcha.js?v=26082745"></script>
<script src="malumot-kengaytma.js?v=26082745"></script>
<script src="malumot-kirish.js?v=26082745"></script>
<script src="malumot-indeks.js?v=26082745"></script>
<script src="tarjima.js?v=26082745"></script>
<script src="yadro/ikonlar.js?v=26082745"></script>
<script src="yadro/daraxt.js?v=26082745"></script>
<script src="yadro/chizma.js?v=26082745"></script>
<script src="yadro/qollanma.js?v=26082745"></script>
<script src="yadro/api.js?v=26082745"></script>
<script src="yadro/app.js?v=26082745"></script>
<script>
document.addEventListener("mkb:tayyor", async () => {
  async function chiz(){
    const r = await MKBapi.royxat("TASDIQLAR");
    document.getElementById("hs-meta").textContent =
      r.filter(t => !t.hal).length + " ta kutilmoqda · " + r.length + " ta jami";
    document.getElementById("t-royxat").innerHTML = r.map(t =>
      '<div class="qator">' +
        '<span style="width:38px;height:38px;border-radius:14px;background:var(--' + (t.tile === "yashil" ? 'yashil-fon' : 'brend-fon') +
        ');display:grid;place-items:center;color:var(--brend-quyuq)">' + ik("muhr") + '</span>' +
        '<span class="matn"><b>' + t.sarlavha + '</b>' +
        '<span style="font-size:12.5px;color:var(--matn-3)">' + [t.org, t.sub, t.vaqt].filter(Boolean).join(" · ") + '</span></span>' +
        (t.hal ? '<span class="chip ' + (t.hal === "tasdiqlandi" ? 'chip-yashil">Tasdiqlangan' : 'chip-xavf">Rad etilgan') + '</span>'
          : '<button type="button" class="tugma tugma-kichik tugma-oq" data-rad="' + t.id + '">Rad</button>' +
            '<button type="button" class="tugma tugma-kichik tugma-asosiy" data-ok="' + t.id + '">Tasdiqlash</button>') +
      '</div>').join("");
    document.querySelectorAll("[data-ok]").forEach(b => b.addEventListener("click", async () => {
      await MKBapi.yangilash("TASDIQLAR", b.dataset.ok, {hal: "tasdiqlandi"}); MKB.toast("Tasdiqlandi"); chiz();
    }));
    document.querySelectorAll("[data-rad]").forEach(b => b.addEventListener("click", async () => {
      await MKBapi.yangilash("TASDIQLAR", b.dataset.rad, {hal: "rad"}); MKB.toast("Rad etildi"); chiz();
    }));
  }
  chiz();
});
</script>
</body>
</html>
